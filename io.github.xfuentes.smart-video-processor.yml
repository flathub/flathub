app-id: io.github.xfuentes.smart-video-processor
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
separate-locales: false
command: io.github.xfuentes.smart-video-processor
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=xdg-videos
  - --filesystem=xdg-download
modules:
  - name: smart-video-processor-x86_64
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/smart-video-processor
      - cp -r * /app/lib/smart-video-processor/
      - cd /app/lib/smart-video-processor/resources/bin && ./mkvmerge --appimage-extract && rm mkvmerge && mkdir -p /app/lib/mkvmerge-libs && cp -P squashfs-root/usr/lib/* /app/lib/mkvmerge-libs/ && cp squashfs-root/usr/bin/mkvmerge mkvmerge.real && rm -rf squashfs-root && echo -e '#!/bin/sh\nexport LD_LIBRARY_PATH=/app/lib/mkvmerge-libs:$LD_LIBRARY_PATH\nexec /app/lib/smart-video-processor/resources/bin/mkvmerge.real "$@"' > mkvmerge && chmod +x mkvmerge mkvmerge.real
    sources:
      - type: archive
        url: https://github.com/xfuentes/smart-video-processor/releases/download/v1.9.1/smart-video-processor-1.9.1-x64.tar.gz
        sha256: 57b5cb9f11a8ccca443c446d9d1160981e6e0c05477714d736f432cd8bdc5afc

  - name: smart-video-processor-aarch64
    only-arches:
      - aarch64
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/smart-video-processor
      - cp -r * /app/lib/smart-video-processor/
      - cd /app/lib/smart-video-processor/resources/bin && ./mkvmerge --appimage-extract && rm mkvmerge && mkdir -p /app/lib/mkvmerge-libs && cp -P squashfs-root/usr/lib/* /app/lib/mkvmerge-libs/ && cp squashfs-root/usr/bin/mkvmerge mkvmerge.real && rm -rf squashfs-root && echo -e '#!/bin/sh\nexport LD_LIBRARY_PATH=/app/lib/mkvmerge-libs:$LD_LIBRARY_PATH\nexec /app/lib/smart-video-processor/resources/bin/mkvmerge.real "$@"' > mkvmerge && chmod +x mkvmerge mkvmerge.real
    sources:
      - type: archive
        url: https://github.com/xfuentes/smart-video-processor/releases/download/v1.9.1/smart-video-processor-1.9.1-arm64.tar.gz
        sha256: 6c090ed78c580b61e88fd13f36a9007a7679a91b81c6d423e2fe2b983f8a0021

  - name: smart-video-processor-metadata
    buildsystem: simple
    build-commands:
      - install -Dm755 run.sh /app/bin/io.github.xfuentes.smart-video-processor
      - install -Dm644 io.github.xfuentes.smart-video-processor.desktop /app/share/applications/io.github.xfuentes.smart-video-processor.desktop
      - install -Dm644 io.github.xfuentes.smart-video-processor.metainfo.xml /app/share/metainfo/io.github.xfuentes.smart-video-processor.metainfo.xml
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/io.github.xfuentes.smart-video-processor.svg
    sources:
      - type: file
        path: io.github.xfuentes.smart-video-processor.desktop
      - type: file
        path: io.github.xfuentes.smart-video-processor.metainfo.xml
      - type: file
        path: icon.svg
        dest-filename: icon.svg
      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper.sh /app/lib/smart-video-processor/smart-video-processor "$@"
