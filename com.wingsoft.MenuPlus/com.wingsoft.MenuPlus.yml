app-id: com.wingsoft.MenuPlus
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: run.sh
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=cups
  - --device=dri
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
build-options:
  append-path: /usr/lib/sdk/node24/bin
  env:
    NPM_CONFIG_LOGLEVEL: info
modules:
  - name: menuplus-panel
    buildsystem: simple
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/menuplus-panel/flatpak-node/cache
        npm_config_cache: /run/build/menuplus-panel/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      - npm install --offline
      - |
        . ../flatpak-node/electron-builder-arch-args.sh
        npm run dist:dir -- $ELECTRON_BUILDER_ARCH_ARGS
      - cp -a dist/linux*unpacked /app/main
      - install -Dm755 -t /app/bin/ ../run.sh
      - install -Dm644 flatpak/com.wingsoft.MenuPlus.metainfo.xml /app/share/metainfo/com.wingsoft.MenuPlus.metainfo.xml
      - install -Dm644 flatpak/com.wingsoft.MenuPlus.desktop /app/share/applications/com.wingsoft.MenuPlus.desktop
      - |
        for size in 16 32 48 64 128 256 512; do
          install -Dm644 flatpak/icons/hicolor/${size}x${size}/apps/com.wingsoft.MenuPlus.png \
            /app/share/icons/hicolor/${size}x${size}/apps/com.wingsoft.MenuPlus.png
        done
      - install -Dm644 flatpak/LICENSE /app/share/licenses/com.wingsoft.MenuPlus/LICENSE
    subdir: src
    sources:
      - type: archive
        url: https://github.com/ylmazkanat/menuplus-Elektron/archive/refs/tags/v1.0.0.tar.gz
        sha256: 4ecc96267ca8b5843900e5956cdd1abf2bbb0f0c9e3b7703f8d05bb2a035a6da
        strip-components: 1
        dest: src
      - type: file
        path: generated-sources.json
      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper.sh /app/main/menuplus-panel "$@"
