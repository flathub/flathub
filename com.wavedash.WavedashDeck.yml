app-id: com.wavedash.WavedashDeck
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: wavedash-deck

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Newer Flatpak uses input only; older SteamOS keeps controller access.
  - --device-if=all:!has-input-device
  - --device=input
  # Launch Steam's keyboard on the host; Gaming Mode's portal has no OpenURI.
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=/run/udev:ro
  - --persist=.config/Wavedash
  - --env=ELECTRON_TRASH=gio
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: wavedash-deck
    buildsystem: simple
    build-commands:
      - mkdir -p /app/main
      - cp -a app/. /app/main/
      - install -Dm755 run.sh /app/bin/wavedash-deck
      - install -Dm644 assets/com.wavedash.WavedashDeck.desktop /app/share/applications/com.wavedash.WavedashDeck.desktop
      - install -Dm644 assets/com.wavedash.WavedashDeck.png /app/share/icons/hicolor/512x512/apps/com.wavedash.WavedashDeck.png
      - install -Dm644 assets/com.wavedash.WavedashDeck.metainfo.xml /app/share/metainfo/com.wavedash.WavedashDeck.metainfo.xml
      - mkdir -p /app/share/wavedash
      - cp -a assets scripts steam /app/share/wavedash/
      - install -Dm644 app/LICENSE.electron.txt /app/share/licenses/com.wavedash.WavedashDeck/electron/LICENSE
      - install -Dm644 app/LICENSES.chromium.html /app/share/licenses/com.wavedash.WavedashDeck/chromium/LICENSES.html
    sources:
      - type: archive
        url: https://github.com/wvdsh/wavedash-deck/releases/download/v0.2.0/Wavedash-0.2.0-linux-x86_64.tar.gz
        sha256: 9c057a0324b3466971baefe558ab0f4dd1381031a426a5b9b9bd97a6906e1cb8
        only-arches:
          - x86_64
