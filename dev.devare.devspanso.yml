app-id: dev.devare.devspanso
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: espanso
finish-args:
  # Wayland display socket
  - --socket=wayland
  # Fallback X11 display socket
  - --socket=fallback-x11
  # DBus access for portals
  - --talk-name=org.freedesktop.portal.Desktop
  # DBus access for logind
  - --system-talk-name=org.freedesktop.login1
modules:
  - name: espanso
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/espanso/cargo
    build-commands:
      - cargo --offline build --release --no-default-features --features wayland,modulo,vendored-tls
      - install -Dm755 target/release/espanso /app/bin/espanso
      - install -Dm644 flatpak/dev.devare.devspanso.desktop /app/share/applications/dev.devare.devspanso.desktop
      - install -Dm644 flatpak/dev.devare.devspanso.metainfo.xml /app/share/metainfo/dev.devare.devspanso.metainfo.xml
    sources:
      - type: dir
        path: ../
      - cargo-sources.json
