app-id: io.github.DinukaD97.UnoScoreboard
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '23.08'
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
command: start-uno-scoreboard
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=x11
  - --filesystem=xdg-config/uno-scoreboard:create
modules:
  - name: node
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/node20/install-sdk.sh

  - name: uno-scoreboard
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node20/bin
      env:
        XDG_CACHE_HOME: /run/build/uno-scoreboard/flatpak-node/cache
        npm_config_cache: /run/build/uno-scoreboard/flatpak-node/npm-cache
    build-commands:
      - npm install --prefix=app --offline
      - mkdir -p /app/uno-scoreboard
      - cp -r app/main.js app/preload.js app/index.html app/build app/node_modules app/package.json /app/uno-scoreboard/
      - install -Dm644 io.github.DinukaD97.UnoScoreboard.desktop /app/share/applications/io.github.DinukaD97.UnoScoreboard.desktop
      - install -Dm644 io.github.DinukaD97.UnoScoreboard.metainfo.xml /app/share/metainfo/io.github.DinukaD97.UnoScoreboard.metainfo.xml
      - install -Dm644 app/build/icon.png /app/share/icons/hicolor/512x512/apps/io.github.DinukaD97.UnoScoreboard.png
      - install -Dm755 start-uno-scoreboard.sh /app/bin/start-uno-scoreboard
    sources:
      - type: git
        url: https://github.com/DinukaD97/uno-scoreboard.git
        tag: v1.6.0
        dest: app
      - generated-sources.json
      - type: file
        path: io.github.DinukaD97.UnoScoreboard.desktop
      - type: file
        path: io.github.DinukaD97.UnoScoreboard.metainfo.xml
      - type: script
        dest-filename: start-uno-scoreboard.sh
        commands:
          - export PATH=$PATH:/app/node/bin
          - |
            zypak-wrapper \
              /app/uno-scoreboard/node_modules/electron/dist/electron \
              /app/uno-scoreboard
