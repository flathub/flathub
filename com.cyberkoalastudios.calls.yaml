app-id: com.cyberkoalastudios.calls
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "20.08"
command: ccalls
finish-args:
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --share=network
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  - --device=dri
  - --socket=pulseaudio
modules:
  - name: ccalls
    buildsystem: simple
    build-commands:
      - npm install --production
      - cp -r * /app/
    sources:
      - type: git
        url: https://github.com/CyberKoalaStudios/calls-releases.git
        tag: v2.7.4
