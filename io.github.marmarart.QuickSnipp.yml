app-id: io.github.marmarart.QuickSnipp
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
# PyQt6 comes from the official Flathub baseapp (required by Flathub policy
# instead of bundling the wheels).
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.10'
command: quicksnipp
separate-locales: false

# We don't use QtWebEngine — let the baseapp cleanup strip it (saves ~200 MB).
build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: "1"

cleanup-commands:
  - /app/cleanup-BaseApp.sh

finish-args:
  # Display + clipboard
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Screen capture goes through the XDG portal (no extra permission needed).
  # PNG export location.
  - --filesystem=xdg-pictures

modules:
  - name: quicksnipp
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/share/quicksnipp
      - cp -r quicksnipp ${FLATPAK_DEST}/share/quicksnipp/
      - rm -rf ${FLATPAK_DEST}/share/quicksnipp/quicksnipp/__pycache__
      - install -Dm755 packaging/quicksnipp.sh ${FLATPAK_DEST}/bin/quicksnipp
      - install -Dm644 packaging/io.github.marmarart.QuickSnipp.desktop
        ${FLATPAK_DEST}/share/applications/io.github.marmarart.QuickSnipp.desktop
      - install -Dm644 packaging/io.github.marmarart.QuickSnipp.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/io.github.marmarart.QuickSnipp.metainfo.xml
      - install -Dm644 packaging/io.github.marmarart.QuickSnipp.svg
        ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.marmarart.QuickSnipp.svg
    sources:
      - type: git
        url: https://github.com/marmarart/QuickSnipp.git
        tag: v1.0.0
        commit: 13e816ed53ee6b19f904b672774cacff525fbbce
