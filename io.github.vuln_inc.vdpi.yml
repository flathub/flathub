id: io.github.vuln_inc.vdpi
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: vdpi-desktop

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Flatpak

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/vdpi/cargo
    CARGO_NET_OFFLINE: 'true'
    XDG_CACHE_HOME: /run/build/vdpi/flatpak-node/cache
    npm_config_cache: /run/build/vdpi/flatpak-node/npm-cache
    npm_config_nodedir: /usr/lib/sdk/node22
    npm_config_offline: 'true'

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: vdpi
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/Vuln-Inc/vdpi.git
        tag: v0.6.3
        commit: 74b1e7cbb6975a0722f68520c356eabbac2fdd2c
      - cargo-sources.json
      - node-sources.json
      - type: file
        path: io.github.vuln_inc.vdpi.desktop
      - type: file
        path: io.github.vuln_inc.vdpi.metainfo.xml
    build-commands:
      - cd desktop/ui && npm ci --offline --no-audit --no-fund && npm run build
      - cargo --offline build --release --manifest-path Cargo.toml -p vdpi
      - cargo --offline build --release --manifest-path desktop/src-tauri/Cargo.toml
      - install -Dm755 target/release/vdpi /app/bin/vdpi
      - install -Dm755 desktop/src-tauri/target/release/vdpi-desktop /app/bin/vdpi-desktop
      - install -Dm644 io.github.vuln_inc.vdpi.desktop /app/share/applications/io.github.vuln_inc.vdpi.desktop
      - install -Dm644 io.github.vuln_inc.vdpi.metainfo.xml /app/share/metainfo/io.github.vuln_inc.vdpi.metainfo.xml
      - install -Dm644 desktop/src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.vuln_inc.vdpi.png
      - install -Dm644 desktop/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.vuln_inc.vdpi.png
      - install -Dm644 desktop/src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.vuln_inc.vdpi.png
      - install -Dm644 LICENSE /app/share/licenses/io.github.vuln_inc.vdpi/LICENSE
