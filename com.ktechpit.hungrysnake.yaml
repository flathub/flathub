app-id: com.ktechpit.hungrysnake
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: hungrysnake
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: hungrysnake
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/keshavbhatt/HungrySnake.git
        tag: v3.1.2
        commit: 1735752003ac5a8027d2124d86593c938727436f
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
