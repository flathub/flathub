app-id: com.ktechpit.hungrysnake
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: hungrysnake
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man

modules:
  - name: hungrysnake
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/keshavbhatt/HungrySnake.git
        tag: v3.1.1
        commit: 5bb5ac2763341c7f32e5f9730952f2397eec423d
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
