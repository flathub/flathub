app-id: com.ktechpit.hungrysnake
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: hungrysnake
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man

modules:
  - name: hungrysnake
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/keshavbhatt/HungrySnake.git
        tag: v3.1.1
        commit: cbb61b4f611ef69c434bafefee6ad4f5642a238a
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
