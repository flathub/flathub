id: com.commandprompt.audax_data_manager
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: audaxdm-app
rename-desktop-file: audaxdm-app.desktop
rename-icon: audaxdm-app

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

cleanup:
  - /lib/postgresql/*/include
  - /lib/postgresql/*/lib/pkgconfig
  - /lib/postgresql/*/bin/pg_config
  - /lib/postgresql/*/share
  - '*.a'

modules:
  - name: postgresql-13
    buildsystem: simple
    build-options:
      env:
        PG_MAJOR: '13'
        PG_CONFIGURE_OPTS: ''
    build-commands: &postgresql-build-commands
      - ./configure --prefix=/app/lib/postgresql/${PG_MAJOR} --with-openssl ${PG_CONFIGURE_OPTS}
      - make -C src/interfaces/libpq -j${FLATPAK_BUILDER_N_JOBS} install
      - make -C src/bin/pg_dump -j${FLATPAK_BUILDER_N_JOBS} install
      - make -C src/bin/psql -j${FLATPAK_BUILDER_N_JOBS} install
      - install -Dm644 COPYRIGHT ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/postgresql-${PG_MAJOR}/COPYRIGHT
    sources:
      - type: archive
        url: https://ftp.postgresql.org/pub/source/v13.23/postgresql-13.23.tar.bz2
        sha256: 6ec3c82726af92b7dec873fa1cdf881eca92a4219787dfad05acb6b10e041fd6
        x-checker-data:
          type: html
          url: https://ftp.postgresql.org/pub/source/
          version-pattern: v(13\.\d+)/
          url-template: https://ftp.postgresql.org/pub/source/v$version/postgresql-$version.tar.bz2

  - name: postgresql-14
    buildsystem: simple
    build-options:
      env:
        PG_MAJOR: '14'
        PG_CONFIGURE_OPTS: ''
    build-commands: *postgresql-build-commands
    sources:
      - type: archive
        url: https://ftp.postgresql.org/pub/source/v14.24/postgresql-14.24.tar.bz2
        sha256: a7fa7ed3d558172355f51406097a7bd4f6b473be80f311ef7cda96bf383d8897
        x-checker-data:
          type: html
          url: https://ftp.postgresql.org/pub/source/
          version-pattern: v(14\.\d+)/
          url-template: https://ftp.postgresql.org/pub/source/v$version/postgresql-$version.tar.bz2

  - name: postgresql-15
    buildsystem: simple
    build-options:
      env:
        PG_MAJOR: '15'
        PG_CONFIGURE_OPTS: ''
    build-commands: *postgresql-build-commands
    sources:
      - type: archive
        url: https://ftp.postgresql.org/pub/source/v15.19/postgresql-15.19.tar.bz2
        sha256: e1a64a87a46b825b88c082e4518161a47aab53c45694964f8ba1df28f7859f89
        x-checker-data:
          type: html
          url: https://ftp.postgresql.org/pub/source/
          version-pattern: v(15\.\d+)/
          url-template: https://ftp.postgresql.org/pub/source/v$version/postgresql-$version.tar.bz2

  - name: postgresql-16
    buildsystem: simple
    build-options:
      env:
        PG_MAJOR: '16'
        PG_CONFIGURE_OPTS: --with-lz4 --with-zstd
    build-commands: *postgresql-build-commands
    sources:
      - type: archive
        url: https://ftp.postgresql.org/pub/source/v16.15/postgresql-16.15.tar.bz2
        sha256: c1575341fa7bd40f5274ea465b34390f4dc64cdd0770af327005caaeb9f6b7ed
        x-checker-data:
          type: html
          url: https://ftp.postgresql.org/pub/source/
          version-pattern: v(16\.\d+)/
          url-template: https://ftp.postgresql.org/pub/source/v$version/postgresql-$version.tar.bz2

  - name: postgresql-17
    buildsystem: simple
    build-options:
      env:
        PG_MAJOR: '17'
        PG_CONFIGURE_OPTS: --with-lz4 --with-zstd
    build-commands: *postgresql-build-commands
    sources:
      - type: archive
        url: https://ftp.postgresql.org/pub/source/v17.11/postgresql-17.11.tar.bz2
        sha256: dd27f2b3c59e73ed14aa3324901242bf69a032a6347805f274e6260322d42979
        x-checker-data:
          type: html
          url: https://ftp.postgresql.org/pub/source/
          version-pattern: v(17\.\d+)/
          url-template: https://ftp.postgresql.org/pub/source/v$version/postgresql-$version.tar.bz2

  # The newest version also provides libpq, headers and pg_config for psycopg2,
  # and the default tools in /app/bin for servers without a matching version.
  - name: postgresql-18
    buildsystem: simple
    build-options:
      env:
        PG_MAJOR: '18'
        PG_CONFIGURE_OPTS: --with-lz4 --with-zstd
    build-commands: *postgresql-build-commands
    post-install:
      - make -C src/include -j${FLATPAK_BUILDER_N_JOBS} install
      - make -C src/bin/pg_config -j${FLATPAK_BUILDER_N_JOBS} install
      - ln -sfn postgresql/18/lib/libpq.so.5 ${FLATPAK_DEST}/lib/libpq.so.5
      - install -d ${FLATPAK_DEST}/bin
      - for tool in psql pg_dump pg_dumpall pg_restore; do ln -sfn ../lib/postgresql/18/bin/${tool}
        ${FLATPAK_DEST}/bin/${tool}; done
    sources:
      - type: archive
        url: https://ftp.postgresql.org/pub/source/v18.6/postgresql-18.6.tar.bz2
        sha256: 555610c24d53e4316da5b7d3fc25c279d96856d5e0e23ee308c328c5fa881d9f
        x-checker-data:
          type: html
          url: https://ftp.postgresql.org/pub/source/
          version-pattern: v(18\.\d+)/
          url-template: https://ftp.postgresql.org/pub/source/v$version/postgresql-$version.tar.bz2

  - name: pigz
    buildsystem: simple
    build-commands:
      - make -j${FLATPAK_BUILDER_N_JOBS} CFLAGS="${CFLAGS}" LDFLAGS="${LDFLAGS}"
      - install -Dm755 -t ${FLATPAK_DEST}/bin pigz unpigz
      - install -Dm644 README ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/pigz/README
    sources:
      - type: archive
        url: https://zlib.net/pigz/fossils/pigz-2.8.tar.gz
        sha256: eb872b4f0e1f0ebe59c9f7bd8c506c4204893ba6a8492de31df416f0d5170fd0

  - python3-dependencies.json

  - name: python3-psycopg2
    buildsystem: simple
    build-options:
      append-path: /app/lib/postgresql/18/bin
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} psycopg2 pgspecial click --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/c7/bc/f66df707ed1aec949fbf24e4460e4f4277a7ba23cdadb3965bb1f634ddb9/psycopg2-2.9.12.tar.gz
        sha256: 1dedb1c7a1d8552c4a6044c6b1c41a52e6a8e2d144af83eccac758076b1b7c15
      - type: file
        url: https://files.pythonhosted.org/packages/a6/ab/fb874ac932a931afe1b2e67e1e937376dc1ef9e667c5676bb02eb7955a78/pgspecial-1.13.0-py3-none-any.whl
        sha256: 646d1409fe5dcd25d92707a5965d8c1ad7a20289a323316267fb9a5e4ef7d126
      - type: file
        url: https://files.pythonhosted.org/packages/58/50/6c0d534c5f134586a8e1ba4e330569e32f057e33372ae556463212fb4cd3/click-8.5.0-py3-none-any.whl
        sha256: 255bc9599cf7748b4b1a446ccc735421bd08a2ae529a8b88597d3de5664ee360

  - name: nwjs
    buildsystem: simple
    build-commands:
      - install -d ${FLATPAK_DEST}/audaxdm
      - cp -a ./. ${FLATPAK_DEST}/audaxdm/
      - mv ${FLATPAK_DEST}/audaxdm/nw ${FLATPAK_DEST}/audaxdm/audaxdm-app
      - chmod 755 ${FLATPAK_DEST}/audaxdm
      - install -Dm644 credits.html ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/nwjs/credits.html
    sources:
      - type: archive
        url: https://dl.nwjs.io/v0.114.0/nwjs-v0.114.0-linux-x64.tar.gz
        sha256: 31e7e6ebde8f7c2b2eb837ccaa7a5b8a39ca0ccb7de373ec3c5cdc191d8b3c84

  - name: audaxdm
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
      env:
        AUDAXDM_VERSION: 1.6.1
        npm_config_cache: /run/build/audaxdm/flatpak-node/npm-cache
        npm_config_offline: 'true'
        # The git dependencies already contain their built files. Skip npm's git
        # dependency preparation, because it installs their dev dependencies.
        _PACOTE_NO_PREPARE_: |-
          git+ssh://git@github.com/onekiloparsec/vue-power-tree.git#9892260e386bc5963fa95dea9fc2912ca82a2928
          git+ssh://git@github.com/commandprompt/antlr4ts-sql.git#7ecdc2705aac22f27cbf030ce4cc7306b8f09864
          git+ssh://git@github.com/commandprompt/pev2.git#4e6fa30cad192bc76b1419d7bcb34e94b85e3190
          git+ssh://git@github.com/commandprompt/sql-autocomplete.git#f3e7cb16eae407d682313465f2a39ee3c12498d9
    build-commands:
      - |
        set -eu

        # Build the frontend from the offline npm cache. pev2 runs "husky" (git
        # hooks) as its prepare script; a stub stands in for it.
        (cd pgmanage/app/static/pgmanage_frontend \
          && PATH="/run/build/audaxdm/flatpak-node/stub-bin:$PATH" npm ci --no-audit --no-fund \
          && npm run build)
        find pgmanage/app/static/dist -type f \( -name '*.map' -o -name '*.scss' \) -delete

        # Server files, without the frontend sources and tests.
        install -d ${FLATPAK_DEST}/audaxdm/server
        tar -C pgmanage -cf - \
          --exclude=app/static/pgmanage_frontend \
          --exclude=app/tests \
          --exclude=app/tests.old \
          --exclude=__pycache__ \
          pgmanage-server.py config.py pgmanage app \
          | tar -C ${FLATPAK_DEST}/audaxdm/server -xf -

        # Version strings.
        settings=${FLATPAK_DEST}/audaxdm/server/pgmanage/custom_settings.py
        sed -i "s/^PGMANAGE_VERSION = 'Dev'$/PGMANAGE_VERSION = 'Audax Data Manager ${AUDAXDM_VERSION}'/" "$settings"
        sed -i "s/^PGMANAGE_SHORT_VERSION = 'dev'$/PGMANAGE_SHORT_VERSION = '${AUDAXDM_VERSION}'/" "$settings"
        grep -q "^PGMANAGE_SHORT_VERSION = '${AUDAXDM_VERSION}'$" "$settings"
        grep -q "^PGMANAGE_VERSION = 'Audax Data Manager ${AUDAXDM_VERSION}'$" "$settings"

        # NW.js shell files.
        install -Dm644 -t ${FLATPAK_DEST}/audaxdm deploy/app/index.html deploy/app/package.json deploy/app/audaxdm_icon.png
        sed -i "s/version_placeholder/v${AUDAXDM_VERSION}/" ${FLATPAK_DEST}/audaxdm/index.html

        # Launchers. Both use exec, so the server watchdog sees NW.js as its grandparent.
        install -Dm755 audaxdm-app.sh ${FLATPAK_DEST}/bin/audaxdm-app
        install -Dm755 audaxdm-server.sh ${FLATPAK_DEST}/audaxdm/audaxdm-server/audaxdm-server

        # Desktop file, metainfo and icon.
        install -Dm644 deploy/linux/pkgbuild/audaxdm-app.desktop ${FLATPAK_DEST}/share/applications/audaxdm-app.desktop
        install -Dm644 deploy/linux/flatpak/com.commandprompt.audax_data_manager.metainfo.xml \
          ${FLATPAK_DEST}/share/metainfo/com.commandprompt.audax_data_manager.metainfo.xml
        install -Dm644 artwork/audax/audax-icon-final.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/audaxdm-app.svg

        # Licences of the bundled fonts.
        for font in Roboto RobotoMono; do
          install -Dm644 pgmanage/app/static/pgmanage_frontend/src/assets/fonts/${font}/LICENSE.txt \
            ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/fonts/${font}/LICENSE.txt
        done

        # Byte-compile now: /app is read-only at runtime. Hash-based .pyc files stay
        # valid, because Flatpak stores files with mtime 0.
        python3 -m compileall -q --invalidation-mode checked-hash ${FLATPAK_DEST}/audaxdm/server
    sources:
      - type: git
        url: https://github.com/commandprompt/Audax-Data-Manager.git
        commit: 7940c1ed05f519e24e8f642ebbd605b3ede5126a

      # Generated by flatpak-node-generator from package-lock.json.
      - npm-sources.json

      - type: script
        dest: flatpak-node/stub-bin
        dest-filename: husky
        commands:
          - exit 0
      - type: script
        dest-filename: audaxdm-app.sh
        commands:
          - exec /app/audaxdm/audaxdm-app "$@"
      - type: script
        dest-filename: audaxdm-server.sh
        commands:
          - exec python3 /app/audaxdm/server/pgmanage-server.py "$@"
