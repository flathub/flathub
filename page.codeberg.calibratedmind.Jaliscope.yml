app-id: page.codeberg.calibratedmind.Jaliscope
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: jaliscope

finish-args:
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:

  - name: sdl3
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_SHARED=ON
      - -DSDL_STATIC=OFF
      - -DSDL_TEST_LIBRARY=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.14/SDL3-3.4.14.zip
        sha256: b07ef7b5431cea0cb2ea9613e2d8410f9ef37f5627f82f1733086cb00aa2b4b4

  - name: sdl3_image
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_image/releases/download/release-3.4.6/SDL3_image-3.4.6.zip
        sha256: dee281e2d0a49b42aa3e67f9dca839d608df346a9d82d49e70c75d8b5962d03f

  - name: sdl3_ttf
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_ttf/releases/download/release-3.2.2/SDL3_ttf-3.2.2.zip
        sha256: d38c2078630e015777aafa1a1ce627df4323114a920c313274346c372ba0d19d

  - name: jaliscope
    buildsystem: cmake-ninja
    no-make-install: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
    post-install:
      - install -Dm755 Jaliscope /app/bin/jaliscope
      - cp -r Data /app/bin/
      - install -Dm644 page.codeberg.calibratedmind.Jaliscope.desktop /app/share/applications/page.codeberg.calibratedmind.Jaliscope.desktop
      - install -Dm644 page.codeberg.calibratedmind.Jaliscope.metainfo.xml /app/share/metainfo/page.codeberg.calibratedmind.Jaliscope.metainfo.xml
      - install -Dm644 page.codeberg.calibratedmind.Jaliscope.svg /app/share/icons/hicolor/scalable/apps/page.codeberg.calibratedmind.Jaliscope.svg
    sources:
      - type: git
        url: https://codeberg.org/CalibratedMind/Jaliscope.git
        tag: release-1.0.2v
        commit: d00b0960e69cf3d739a70ce751c10885474d37be
      - type: file
        path: page.codeberg.calibratedmind.Jaliscope.desktop
      - type: file
        path: page.codeberg.calibratedmind.Jaliscope.metainfo.xml
      - type: file
        path: page.codeberg.calibratedmind.Jaliscope.svg
