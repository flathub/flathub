id: com.danklinux.dankcalendar
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: dcal

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/libSPIRV-Tools*
  - /bin/spirv-*
  - /share/applications/org.quickshell.desktop
  - /share/icons/hicolor/scalable/apps/org.quickshell.svg

build-options:
  append-path: /usr/lib/sdk/golang/bin
  env:
    GOTOOLCHAIN: local

modules:
  - name: cli11
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCLI11_BUILD_DOCS=OFF
      - -DCLI11_BUILD_EXAMPLES=OFF
      - -DCLI11_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/CLIUtils/CLI11.git
        tag: v2.6.1
        commit: bfffd37e1f804ca4fae1caae106935791696b6a9

  - name: spirv-tools
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSPIRV_SKIP_TESTS=ON
      - -DSPIRV_WERROR=OFF
    sources:
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Tools.git
        tag: v2026.2
        commit: 0539c81f69a3daeb706fd3477dca61435b475156
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Headers.git
        commit: ad9184e76a66b1001c29db9b0a3e87f646c64de0
        dest: external/spirv-headers

  - name: quickshell
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DDISTRIBUTOR=DankCalendar Flatpak
      - -DUSE_JEMALLOC=OFF
      - -DCRASH_HANDLER=OFF
      - -DBUILD_TESTING=OFF
      - -DSOCKETS=ON
      - -DWAYLAND=ON
      - -DWAYLAND_WLR_LAYERSHELL=OFF
      - -DWAYLAND_SESSION_LOCK=OFF
      - -DWAYLAND_TOPLEVEL_MANAGEMENT=OFF
      - -DHYPRLAND=OFF
      - -DSCREENCOPY=OFF
      - -DX11=ON
      - -DI3=OFF
      - -DSERVICE_STATUS_NOTIFIER=OFF
      - -DSERVICE_PIPEWIRE=OFF
      - -DSERVICE_MPRIS=OFF
      - -DSERVICE_PAM=OFF
      - -DSERVICE_POLKIT=OFF
      - -DSERVICE_GREETD=OFF
      - -DSERVICE_UPOWER=OFF
      - -DSERVICE_NOTIFICATIONS=OFF
      - -DBLUETOOTH=OFF
      - -DNETWORK=OFF
    sources:
      - type: git
        url: https://github.com/quickshell-mirror/quickshell.git
        commit: 4df562dfb2475a9057f0f33a8db75808efad8670
        disable-submodules: true

  - name: dankcalendar
    buildsystem: simple
    build-commands:
      - make -C core sync-shell
      - >-
        go build -C core -mod=vendor -tags withshell
        -ldflags=-s\ -w\ -X\ main.Version=0.2.7\ -X\ main.Commit=6b36b8a3
        -o dcal ./cmd/dcal
      - install -Dm755 core/dcal /app/bin/dcal
      - >-
        install -Dm644 assets/com.danklinux.dankcalendar.desktop
        /app/share/applications/com.danklinux.dankcalendar.desktop
      - >-
        install -Dm644 assets/com.danklinux.dankcalendar.metainfo.xml
        /app/share/metainfo/com.danklinux.dankcalendar.metainfo.xml
      - >-
        install -Dm644 assets/com.danklinux.dankcalendar.svg
        /app/share/icons/hicolor/scalable/apps/com.danklinux.dankcalendar.svg
      - >-
        install -Dm644 LICENSE
        /app/share/licenses/com.danklinux.dankcalendar/LICENSE
    sources:
      - type: git
        url: https://github.com/AvengeMedia/dankcalendar.git
        tag: v0.2.7
        commit: 6b36b8a33caee1fc33ac09b634660b3d9f75c96b
      - go.mod.yml
