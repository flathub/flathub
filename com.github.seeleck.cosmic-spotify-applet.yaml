# Flathub submission for cosmic-spotify-applet
app-id: com.github.seeleck.cosmic-spotify-applet
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cosmic-spotify-applet
finish-args:
  # Wayland display socket for GUI rendering
  - --socket=wayland
  # Share IPC with the host
  - --share=ipc
  # Network access for fetching album cover art over HTTP
  - --share=network
  # D-Bus session bus access to communicate with Spotify
  - --socket=session-bus
  # Explicit MPRIS permissions to communicate with Spotify instances
  - --talk-name=org.mpris.MediaPlayer2.spotify
  - --talk-name=org.mpris.MediaPlayer2.spotify.*

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: cosmic-spotify-applet
    buildsystem: simple
    build-commands:
      # Copy the generated offline cargo config to the project's .cargo directory
      - mkdir -p .cargo
      - cp cargo/config .cargo/config.toml
      # Build the binary offline using the pre-downloaded crates from cargo-sources.json
      - cargo build --release --frozen --offline
      # Install binary, desktop entry, AppStream metainfo, and icon manually
      - install -Dm0755 target/release/cosmic-spotify-applet -t /app/bin/
      - install -Dm0644 resources/app.desktop /app/share/applications/com.github.seeleck.cosmic-spotify-applet.desktop
      - install -Dm0644 resources/app.metainfo.xml /app/share/metainfo/com.github.seeleck.cosmic-spotify-applet.metainfo.xml
      - install -Dm0644 resources/icon.svg /app/share/icons/hicolor/scalable/apps/com.github.seeleck.cosmic-spotify-applet.svg
    sources:
      - type: git
        url: https://github.com/Seeleck/cosmic-spotify-applet.git
        branch: main
        commit: 63260a6b2da1962b8fff130541b25fa439b243e2
      - cargo-sources.json
