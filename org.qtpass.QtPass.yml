id: org.qtpass.QtPass
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: qtpass
rename-desktop-file: qtpass.desktop
rename-icon: qtpass-icon
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --socket=gpg-agent
  - --persist=.password-store
  - --persist=.gnupg
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.la
  - /lib/*.a
  - /lib/cmake
  - /share/aclocal
  - /share/info
  - /share/man
  - /share/doc
  - /bin/*-config

modules:
  - name: git
    buildsystem: autotools
    config-opts:
      - --without-tcltk
    make-args: &git-args
      - NO_RUST=1
      - NO_TCLTK=1
      - NO_PERL=1
      - NO_PYTHON=1
      - NO_GETTEXT=1
      - NO_INSTALL_HARDLINKS=1
      - INSTALL_SYMLINKS=1
    make-install-args: *git-args
    cleanup:
      - /share/gitweb
      - /share/git-gui
      - /share/gitk
      - /share/bash-completion
      - /libexec/git-core/git-daemon
      - /libexec/git-core/git-http-push
      - /libexec/git-core/git-imap-send
      - /libexec/git-core/git-cvsserver
      - /libexec/git-core/git-shell
      - /libexec/git-core/scalar
      - /bin/git-cvsserver
      - /bin/git-shell
      - /bin/scalar
    sources:
      - type: archive
        url: https://www.kernel.org/pub/software/scm/git/git-2.55.0.tar.xz
        sha256: 457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357
        x-checker-data:
          type: anitya
          project-id: 5350
          stable-only: true
          url-template: https://www.kernel.org/pub/software/scm/git/git-$version.tar.xz

  - name: pwgen
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/pwgen/pwgen/2.08/pwgen-2.08.tar.gz
        sha256: dab03dd30ad5a58e578c5581241a6e87e184a18eb2c3b2e0fffa8a9cf105c97b
        x-checker-data:
          type: anitya
          project-id: 3963
          stable-only: true
          url-template: https://downloads.sourceforge.net/project/pwgen/pwgen/$version/pwgen-$version.tar.gz

  - name: qrencode
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DWITH_TOOLS=YES
      - -DWITH_TESTS=NO
      - -DBUILD_SHARED_LIBS=NO
    sources:
      - type: archive
        url: https://github.com/fukuchi/libqrencode/archive/refs/tags/v4.1.1.tar.gz
        sha256: 5385bc1b8c2f20f3b91d258bf8ccc8cf62023935df2d2676b5b67049f31a049c
        x-checker-data:
          type: anitya
          project-id: 12675
          stable-only: true
          url-template: https://github.com/fukuchi/libqrencode/archive/refs/tags/v$version.tar.gz

  - name: pass
    buildsystem: simple
    build-commands:
      - make PREFIX=/app WITH_ALLCOMP=no install
    sources:
      - type: git
        url: https://git.zx2c4.com/password-store
        tag: "1.7.4"
        commit: 1078f2514d579178d5df7042c6a790e9c9b731ad

  - name: qtpass
    buildsystem: simple
    build-commands:
      - qmake PREFIX=/app CONFIG+=release qtpass.pro
      - make -j$FLATPAK_BUILDER_N_JOBS sub-src sub-main
      - make -C main install
      - install -Dm755 flatpak/gpg2 /app/bin/gpg2
    sources:
      - type: git
        url: https://github.com/IJHack/QtPass.git
        tag: v1.8.2
        commit: 71122182ddaef33d83c60868a7baff4a85442f1a
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
