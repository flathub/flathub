app-id: io.github.rash_aad.Binder
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: binder
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
modules:
  - name: binder
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/binder/node_modules/pdfjs-dist /app/electron
      - cp -r main.js preload.js package.json src /app/lib/binder/
      - cp -r pdfjs/build pdfjs/web pdfjs/package.json /app/lib/binder/node_modules/pdfjs-dist/
      - unzip -q electron.zip -d /app/electron
      - install -Dm755 binder.sh /app/bin/binder
      - install -Dm644 packaging/io.github.rash_aad.Binder.desktop /app/share/applications/io.github.rash_aad.Binder.desktop
      - install -Dm644 packaging/io.github.rash_aad.Binder.metainfo.xml /app/share/metainfo/io.github.rash_aad.Binder.metainfo.xml
      - install -Dm644 packaging/io.github.rash_aad.Binder.png /app/share/icons/hicolor/256x256/apps/io.github.rash_aad.Binder.png
    sources:
      - type: git
        url: https://github.com/rash-aad/binder.git
        tag: v1.0.0
        commit: e89d3375f27e324164c07b236dc2f7956c9990ba
      - type: archive
        url: https://registry.npmjs.org/pdfjs-dist/-/pdfjs-dist-6.4.299.tgz
        sha512: 015975dfccc02ed7da00fbc00ee944d0f65385b6330814bbf672f8a4e48bffa4a6ff8007e40db5043f551edf7b3a50aecc9b82a66799b40b648a78ac17855bd6
        dest: pdfjs
      - type: file
        url: https://github.com/electron/electron/releases/download/v45.1.0/electron-v45.1.0-linux-x64.zip
        sha256: 9dafab2c57ce209f8f716f8f3e4fddd8ffe0820e2455bfbbfc00b0fc13e03a3b
        dest-filename: electron.zip
        only-arches: [x86_64]
      - type: script
        dest-filename: binder.sh
        commands:
          - exec zypak-wrapper /app/electron/electron /app/lib/binder "$@"
