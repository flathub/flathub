id: app.liten.Gram
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: gram
finish-args:
  - --talk-name=org.freedesktop.Flatpak
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=home
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: gram
    buildsystem: simple
    build-options:
      env:
        APP_ID: app.liten.Gram
        APP_ICON: app.liten.Gram
        APP_NAME: Gram
        BRANDING_LIGHT: '#b2d88f'
        BRANDING_DARK: '#4e4b5c'
        APP_CLI: gram
        APP_ARGS: --foreground %U
        DO_STARTUP_NOTIFY: 'false'
    build-commands:
      - install -Dm644 app.liten.Gram.svg /app/share/icons/hicolor/scalable/apps/app.liten.Gram.svg
      - install -Dm644 app.liten.Gram-symbolic.svg /app/share/icons/hicolor/symbolic/apps/app.liten.Gram-symbolic.svg
      - envsubst < gram.desktop.in > gram-editor.desktop && install -Dm755 gram-editor.desktop
        /app/share/applications/app.liten.Gram.desktop
      - envsubst < flatpak/gram.metainfo.xml.in > gram.metainfo.xml && install -Dm644
        gram.metainfo.xml /app/share/metainfo/app.liten.Gram.metainfo.xml
      - sed -i -e '/@release_info@/{r flatpak/release-info/stable' -e 'd}' /app/share/metainfo/app.liten.Gram.metainfo.xml
      - install -Dm755 bin/gram /app/bin/gram
      - install -Dm755 libexec/gram-editor /app/libexec/gram-editor
      - install -Dm755 lib/* -t /app/lib
    sources:
      - type: archive
        path: ./target/release/gram-linux-x86_64.tar.gz
      - type: dir
        path: ./crates/gram/resources
