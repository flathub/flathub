app-id: com.orbytestudio.nocthurnalroom
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: nocthurnal_room
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
modules:
  - name: nocthurnal-room
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - cp -r app/build/linux/x64/release/bundle/* /app/bin/
      - install -Dm644 flatpak/com.orbytestudio.nocthurnalroom.desktop /app/share/applications/com.orbytestudio.nocthurnalroom.desktop
      - install -Dm644 flatpak/com.orbytestudio.nocthurnalroom.metainfo.xml /app/share/metainfo/com.orbytestudio.nocthurnalroom.metainfo.xml
      - install -Dm644 app/assets/icon_512.png /app/share/icons/hicolor/512x512/apps/com.orbytestudio.nocthurnalroom.png
    sources:
      # Baixa o código direto do seu repositório oficial
      - type: git
        url: https://github.com/aquelejoaovittor/nocthurnal-room.git
        tag: v1.0.0
