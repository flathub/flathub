app-id: com.clustta.clustta
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
  - org.freedesktop.Sdk.Extension.node20

command: clustta

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --own-name=org.wails_app_com_clustta_clustta_single_instance.SingleInstance
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher

build-options:
  append-path: /usr/lib/sdk/golang/bin:/usr/lib/sdk/node20/bin
  env:
    GOPATH: /run/build/clustta/go
    GOBIN: /run/build/clustta/go/bin
    GOMODCACHE: /run/build/clustta/go/pkg/mod
    npm_config_nodedir: /usr/lib/sdk/node20

modules:
  - name: clustta
    buildsystem: simple
    build-commands:
      # Strip @clustta/web-adapters (file: dep unavailable in sandbox; Vite stub plugin handles imports at build time)
      - |
        yarn config set yarn-offline-mirror "$PWD/flatpak-node/yarn-mirror"
        cd frontend
        sed -i '/@clustta\/web-adapters/d' package.json
        sed -i '/^"@clustta\/web-adapters/,/^$/d' yarn.lock
        yarn install --offline
      - cd frontend && yarn build
      - |
        . /usr/lib/sdk/golang/enable.sh
        export GOFLAGS="-mod=mod"
        CGO_ENABLED=1 go build -tags production -trimpath -buildvcs=false \
          -ldflags="-w -s" -o /app/bin/clustta
      - install -Dm644 build/linux/flatpak/com.clustta.clustta.desktop /app/share/applications/com.clustta.clustta.desktop
      - install -Dm644 build/linux/flatpak/com.clustta.clustta.metainfo.xml /app/share/metainfo/com.clustta.clustta.metainfo.xml
      - install -Dm644 build/linux/clustta-clst.xml /app/share/mime/packages/com.clustta.clustta-clst.xml
      - |
        if command -v ffmpeg >/dev/null 2>&1; then
          ffmpeg -y -i build/appicon.png -vf scale=256:256 /tmp/appicon-256.png
          install -Dm644 /tmp/appicon-256.png /app/share/icons/hicolor/256x256/apps/com.clustta.clustta.png
        else
          install -Dm644 build/appicon.png /app/share/icons/hicolor/256x256/apps/com.clustta.clustta.png
        fi
      # Fix read-only Go module files so flatpak-builder can clean up
      - chmod -R u+w go/pkg/mod
    sources:
      - type: git
        url: https://github.com/eaxum/clustta-client.git
        tag: v0.4.33-flatpak.1
        commit: 49f2ffcab1890a97ad3df3a296771376e904e774
      - generated-sources.json
      - go-sources.json
