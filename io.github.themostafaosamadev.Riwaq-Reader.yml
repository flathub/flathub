id: io.github.themostafaosamadev.Riwaq-Reader
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable
command: riwaq

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # The optional Store browses external novel sites. Reading local files is offline.
  - --share=network
  # https://github.com/tauri-apps/tauri/issues/9304
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  # notify-rust calls the session bus directly; without this the call is refused
  # and download notifications silently never appear.
  - --talk-name=org.freedesktop.Notifications
  # "Open With" needs nothing more. --file-forwarding is a `flatpak run` option,
  # not a finish-arg, and a literal `@@ %f @@` in Exec= breaks `flatpak install`.
  # Flatpak adds both itself for a desktop file with a bare %f.

build-options:
  append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/riwaq/cargo

modules:
  - name: riwaq
    buildsystem: simple
    build-options:
      env:
        npm_config_offline: 'true'
        npm_config_cache: /run/build/riwaq/flatpak-node/npm-cache
        XDG_CACHE_HOME: /run/build/riwaq/flatpak-node/cache
        # pnpm 11 re-fetches registry metadata during --frozen-lockfile to check
        # tarball URLs, which fails offline (ERR_PNPM_NO_OFFLINE_META). Safe to
        # skip: --frozen-lockfile already pins every resolution to the lockfile.
        pnpm_config_trust_lockfile: 'true'
        # flatpak-node-generator writes storeDir into pnpm-workspace.yaml using
        # the outer host path, which does not exist once the module is remapped
        # to /run/build/riwaq. Pin it to the in-sandbox location instead.
        pnpm_config_store_dir: /run/build/riwaq/flatpak-node/pnpm-store
    build-commands:
      - node pnpm/bin/pnpm.cjs install --offline --frozen-lockfile
      - node pnpm/bin/pnpm.cjs build
      # custom-protocol is required: without it tauri builds in dev mode, embeds
      # no assets and loads devUrl, so the app installs and opens a blank window.
      - cargo build --release --manifest-path src-tauri/Cargo.toml --offline
          --features tauri/custom-protocol
      # [[bin]] name = "Riwaq" overrides the package name, so cargo writes
      # target/release/Riwaq. Install it lowercase to match `command:` and Exec=.
      - install -Dm755 src-tauri/target/release/Riwaq /app/bin/riwaq
      - install -Dm644 src-tauri/icons/icon.png
          /app/share/icons/hicolor/512x512/apps/io.github.themostafaosamadev.Riwaq-Reader.png
      - install -Dm644 io.github.themostafaosamadev.Riwaq-Reader.desktop
          /app/share/applications/io.github.themostafaosamadev.Riwaq-Reader.desktop
      - install -Dm644 io.github.themostafaosamadev.Riwaq-Reader.metainfo.xml
          /app/share/metainfo/io.github.themostafaosamadev.Riwaq-Reader.metainfo.xml
    sources:
      - type: git
        url: https://github.com/TheMostafaOsamaDev/Riwaq-Reader.git
        tag: v0.6.0
        commit: 56e20c5562e62a0f7528902a6e7dcc7082869684
      # node22 ships node and npm, not pnpm, and corepack needs a network.
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-11.21.0.tgz
        sha256: 87237d37eadb79dc626a0576eb3a52d23d70422c323ae5e00fc05c91f4323780
        dest: pnpm
      - cargo-sources.json
      - node-sources.json
      - type: file
        path: io.github.themostafaosamadev.Riwaq-Reader.desktop
      - type: file
        path: io.github.themostafaosamadev.Riwaq-Reader.metainfo.xml
