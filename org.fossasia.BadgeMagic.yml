id: org.fossasia.BadgeMagic
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: badgemagic
rename-desktop-file: badgemagic.desktop
rename-icon: badgemagic
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: BadgeMagic
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm20/bin:/var/lib/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        PUB_CACHE: /run/build/BadgeMagic/.pub-cache
    build-commands:
      - setup-flutter.sh
      - flutter build linux --release --no-pub
      - cp -r $BUNDLE_PATH /app/org.fossasia.BadgeMagic
      - mkdir -p /app/bin && ln -s /app/org.fossasia.BadgeMagic/badgemagic /app/bin/badgemagic
      - install -D linux/org.fossasia.BadgeMagic.metainfo.xml /app/share/metainfo/org.fossasia.BadgeMagic.metainfo.xml
      - install -D linux/badgemagic.desktop /app/share/applications/badgemagic.desktop
      - install -D linux/assets/badgemagic.png /app/share/icons/hicolor/512x512/apps/badgemagic.png
    sources:
      - type: git
        url: https://github.com/fossasia/badgemagic-app.git
        commit: 69a5699360b6ef5079bb3af32132839ab4102073
      - generated/sources/pubspec.json
    modules:
      - generated/modules/flutter-sdk-3.44.1.json
