id: io.github.Taygun86.Doors
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: doors

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --allow=multiarch
  - --allow=devel
  - --allow=per-app-dev-shm
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.gtk.vfs.*
  - --filesystem=xdg-run/gvfsd
  - --filesystem=host
  - --filesystem=/mnt
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/var/mnt
  - --filesystem=~/.var/app/com.valvesoftware.Steam/data/Steam:ro

modules:
  - name: doors
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/doors/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/doors /app/bin/doors
      - install -Dm644 data/io.github.Taygun86.Doors.desktop /app/share/applications/io.github.Taygun86.Doors.desktop
      - install -Dm644 data/io.github.Taygun86.Doors.metainfo.xml /app/share/metainfo/io.github.Taygun86.Doors.metainfo.xml
      - install -Dm644 data/io.github.Taygun86.Doors.svg /app/share/icons/hicolor/scalable/apps/io.github.Taygun86.Doors.svg
      - install -Dm644 data/io.github.Taygun86.Doors.png /app/share/icons/hicolor/512x512/apps/io.github.Taygun86.Doors.png
      - mkdir -p /app/share/locale && cp -r locale/* /app/share/locale/
    sources:
      - type: git
        url: https://github.com/Taygun86/Doors.git
        tag: v0.3.0
        commit: 905c476711b2b6647cc395919a7b5ee0d0da23bc
      - cargo-sources.json
