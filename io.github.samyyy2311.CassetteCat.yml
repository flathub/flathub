app-id: io.github.samyyy2311.CassetteCat
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: CassetteCat
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=host:ro
  - --talk-name=org.freedesktop.secrets
  - --own-name=org.mpris.MediaPlayer2.CassetteCat
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
modules:
  - name: cassettecat
    buildsystem: simple
    build-commands:
      - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCASSETTECAT_BUILD_TESTING=OFF -DCASSETTECAT_TAGLIB_SOURCE_DIR="$PWD/taglib-src"
      - cmake --build build --parallel
      - install -Dm755 build/bin/CassetteCat /app/bin/CassetteCat
      - install -Dm644 packaging/linux/io.github.samyyy2311.CassetteCat.desktop /app/share/applications/io.github.samyyy2311.CassetteCat.desktop
      - install -Dm644 packaging/linux/io.github.samyyy2311.CassetteCat.metainfo.xml /app/share/metainfo/io.github.samyyy2311.CassetteCat.metainfo.xml
      - install -Dm644 assets/cassettecat_icon.png /app/share/icons/hicolor/256x256/apps/io.github.samyyy2311.CassetteCat.png
    sources:
      - type: git
        url: https://github.com/samyyy2311/CassetteCat-Desktop.git
        tag: v0.7.0
        commit: d97cf85c01c15962557901dd5b551dd8fa81a8d9
      - type: git
        url: https://github.com/taglib/taglib.git
        commit: e3de03501ff66221d1f1f971022b248d5b38ba06
        dest: taglib-src
