app-id: net.leatherclient.LeatherClient
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: leather-client
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-data/LeatherClient:create
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=LD_LIBRARY_PATH=/app/lib
modules:
  - name: leather-client
    buildsystem: simple
    build-commands:
      - install -Dm755 leather-client /app/bin/leather-client
      - mkdir -p '/app/lib/Leather Client'
      - cp -a libs/. /app/lib/
      - cp -a resources/. '/app/lib/Leather Client/'
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/net.leatherclient.LeatherClient.png
      - install -Dm644 net.leatherclient.LeatherClient.desktop /app/share/applications/net.leatherclient.LeatherClient.desktop
      - install -Dm644 net.leatherclient.LeatherClient.metainfo.xml /app/share/metainfo/net.leatherclient.LeatherClient.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/Leather-Client/version/releases/download/v1.1.0/leather-client-flatpak-1.1.0-x86_64.tar.gz
        sha256: 907ce05cef59b89ef4418a14f63ce76e174c82ef2e8c75d00590a5a0c986c528
      - type: file
        url: https://github.com/Leather-Client/version/releases/download/v1.1.0/net.leatherclient.LeatherClient.desktop
        sha256: f0fe0b063cee3c0604747d5d731357f6cc2e990487dded56a306adf8b10bd3bc
      - type: file
        url: https://github.com/Leather-Client/version/releases/download/v1.1.0/net.leatherclient.LeatherClient.metainfo.xml
        sha256: 9892e23e6fc461bf8bd5ebde6b3a7871b8c54c1b72da4184ff050fe6ec2d11d8
