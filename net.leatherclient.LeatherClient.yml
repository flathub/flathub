app-id: net.leatherclient.LeatherClient
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: leather-client
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-data/LeatherClient:create
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=LD_LIBRARY_PATH=/app/lib
modules:
  - name: leather-client
    buildsystem: simple
    build-commands:
      - install -Dm755 leather-client /app/bin/leather-client
      - mkdir -p '/app/lib/Leather Client'
      - cp -a libs/. /app/lib/
      - cp -a resources/. '/app/lib/Leather Client/'
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/net.leatherclient.LeatherClient.png
      - install -Dm644 net.leatherclient.LeatherClient.desktop /app/share/applications/net.leatherclient.LeatherClient.desktop
      - install -Dm644 net.leatherclient.LeatherClient.metainfo.xml /app/share/metainfo/net.leatherclient.LeatherClient.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/Leather-Client/version/releases/download/v1.1.1/leather-client-flatpak-1.1.1-x86_64.tar.gz
        sha256: 98bde85111b84c44fe05433b01679e76f15ff5149fc20d9605cc7e29f8b2897d
      - type: file
        url: https://github.com/Leather-Client/version/releases/download/v1.1.1/net.leatherclient.LeatherClient.desktop
        sha256: f0fe0b063cee3c0604747d5d731357f6cc2e990487dded56a306adf8b10bd3bc
      - type: file
        url: https://github.com/Leather-Client/version/releases/download/v1.1.1/net.leatherclient.LeatherClient.metainfo.xml
        sha256: 97a575d6814e3941a2559687fe6dbe7268afe4b8016f1f89bb06cdb88024f489
