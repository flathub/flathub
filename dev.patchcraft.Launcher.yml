app-id: dev.patchcraft.Launcher
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: patchcraft-launcher
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --device=input
  - --device-if=all:!has-input-device
  - --socket=pulseaudio
  - --share=network
  - --env=JAVA_HOME=/app/jre
  - --env=ELECTRON_TRASH=gio
  - --filesystem=~/.runelite:create
  - --filesystem=~/.hdos:create
  - --filesystem=xdg-pictures/RuneScape:create
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.feralinteractive.GameMode

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh

  - shared-modules/gtk2/gtk2.json

  - name: patchcraft-launcher
    buildsystem: simple
    build-commands:
      - install -Dm755 -d /app/bin /app/share/patchcraft-launcher /app/share/licenses/dev.patchcraft.Launcher
      - cp -a app-bundle/. /app/share/patchcraft-launcher/
      - chmod 755 /app/share/patchcraft-launcher/patchcraft-launcher
      - install -Dm755 patchcraft-launcher.sh /app/bin/patchcraft-launcher
      - install -Dm644 LICENSE /app/share/licenses/dev.patchcraft.Launcher/LICENSE
      - if [ -f app-bundle/LICENSES.chromium.html ]; then install -Dm644 app-bundle/LICENSES.chromium.html /app/share/licenses/dev.patchcraft.Launcher/LICENSES.chromium.html; fi
      - install -Dm644 dev.patchcraft.Launcher.desktop /app/share/applications/dev.patchcraft.Launcher.desktop
      - install -Dm644 dev.patchcraft.Launcher.metainfo.xml /app/share/metainfo/dev.patchcraft.Launcher.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/dev.patchcraft.Launcher.png
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/dev.patchcraft.Launcher.png
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/dev.patchcraft.Launcher.png
      - install -Dm644 icon-64.png /app/share/icons/hicolor/64x64/apps/dev.patchcraft.Launcher.png
      - install -Dm644 icon-32.png /app/share/icons/hicolor/32x32/apps/dev.patchcraft.Launcher.png
    sources:
      - type: archive
        url: https://github.com/cook0001/Patchcraft-Launcher/releases/download/v2.0.0/patchcraft-launcher-2.0.0-flatpak.tar.gz
        sha256: 5d722dbf2bf1e9e1a05921e7368135b17edba3a4df5975c71243fb61f54bb5c3
        dest: app-bundle
        only-arches:
          - x86_64
      - type: script
        dest-filename: patchcraft-launcher.sh
        commands:
          - export PATH="/app/jre/bin:${PATH}"
          - exec env TMPDIR="${XDG_CACHE_HOME:-${HOME}/.cache}" zypak-wrapper /app/share/patchcraft-launcher/patchcraft-launcher "$@"
      - type: file
        path: dev.patchcraft.Launcher.desktop
      - type: file
        path: dev.patchcraft.Launcher.metainfo.xml
      - type: file
        url: https://raw.githubusercontent.com/cook0001/Patchcraft-Launcher/41158d15345b5d1423b72389df0155f68984c501/LICENSE
        dest-filename: LICENSE
        sha256: ff92fc58658224d3b9f21b9b8113be9113ca9a418e3b565ae91f4931101dafa1
      - type: file
        url: https://raw.githubusercontent.com/cook0001/Patchcraft-Launcher/v2.0.0/resources/icons/512x512.png
        dest-filename: icon-512.png
        sha256: 1aad284f3e212e6a47ce2bbf33165957540bcd2fa8d38c5bbcea39ae75226cfe
      - type: file
        url: https://raw.githubusercontent.com/cook0001/Patchcraft-Launcher/v2.0.0/resources/icons/256x256.png
        dest-filename: icon-256.png
        sha256: b8b8e0dd98d2888bbe79c47aa7f30a7256ebbbf5952e55a8d2b1df60dabe94e1
      - type: file
        url: https://raw.githubusercontent.com/cook0001/Patchcraft-Launcher/v2.0.0/resources/icons/128x128.png
        dest-filename: icon-128.png
        sha256: 2b6f20ed6fd62028c6f82a65766486eddb90ac75a917dadead3fc4447e58a675
      - type: file
        url: https://raw.githubusercontent.com/cook0001/Patchcraft-Launcher/v2.0.0/resources/icons/64x64.png
        dest-filename: icon-64.png
        sha256: 5f96eaa418d664ba6ae97cc77fd31bdceb16570fec6e824f0c87c5ae42823210
      - type: file
        url: https://raw.githubusercontent.com/cook0001/Patchcraft-Launcher/v2.0.0/resources/icons/32x32.png
        dest-filename: icon-32.png
        sha256: 139b977a41ea0b23354bdfd239b93e11737f996b44d656d9fef1ceb3bca1fc18
