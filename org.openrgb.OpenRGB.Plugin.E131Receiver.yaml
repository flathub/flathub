id: org.openrgb.OpenRGB.Plugin.E131Receiver
branch: '4'
extension-tag: org.openrgb.OpenRGB.Plugin
build-extension: true
separate-locales: false

runtime: org.openrgb.OpenRGB
runtime-version: 'stable'
sdk: org.kde.Sdk//5.15-25.08

build-options:
  prefix: /app/lib/openrgb/plugins/E131Receiver

modules:
  - name: openrgb-plugin-e131-receiver
    buildsystem: qmake
    cleanup:
      - ${FLATPAK_DEST}/lib
    post-install:
      - mv ${FLATPAK_DEST}/lib/openrgb/plugins/libOpenRGBE131ReceiverPlugin.so ${FLATPAK_DEST}/libOpenRGBE131ReceiverPlugin.so
      - install -Dm644 OpenRGBE131ReceiverPlugin.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/openrgb-e131-receiver-plugin.png
    sources:
      - type: git
        url: https://gitlab.com/OpenRGBDevelopers/OpenRGBE131ReceiverPlugin
        tag: release_candidate_1.0rc2
        commit: d765325fff5496a1da34fcab9a19f6ad621e0f23
      - type: patch
        path: patches/add-metadata.patch

