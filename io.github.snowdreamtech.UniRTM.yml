app-id: io.github.snowdreamtech.UniRTM
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: unirtm

finish-args:
  - --share=network
  - --filesystem=host
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: unirtm
    buildsystem: simple
    build-commands:
      - install -Dm755 unirtm_Linux_x86_64/unirtm ${FLATPAK_DEST}/bin/unirtm
      - install -Dm644 unirtm_Linux_x86_64/LICENSE ${FLATPAK_DEST}/share/licenses/unirtm/LICENSE
      - install -Dm644 unirtm_Linux_x86_64/README.md ${FLATPAK_DEST}/share/doc/unirtm/README.md
      - install -Dm644 unirtm_Linux_x86_64/completions/unirtm.bash ${FLATPAK_DEST}/share/bash-completion/completions/unirtm
      - install -Dm644 unirtm_Linux_x86_64/completions/unirtm.zsh ${FLATPAK_DEST}/share/zsh/site-functions/_unirtm
      - install -Dm644 unirtm_Linux_x86_64/completions/unirtm.fish ${FLATPAK_DEST}/share/fish/vendor_completions.d/unirtm.fish
      - install -Dm644 io.github.snowdreamtech.UniRTM.desktop ${FLATPAK_DEST}/share/applications/io.github.snowdreamtech.UniRTM.desktop
      - install -Dm644 io.github.snowdreamtech.UniRTM.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.snowdreamtech.UniRTM.svg
      - install -Dm644 io.github.snowdreamtech.UniRTM.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.snowdreamtech.UniRTM.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/snowdreamtech/UniRTM/releases/download/v0.16.1/unirtm_Linux_x86_64.tar.gz
        sha256: 91f2ec42825ef3ea4430b197be13778b951b020895d94ad6383c3da63f97ac02
        dest-filename: unirtm.tar.gz
      - type: file
        path: io.github.snowdreamtech.UniRTM.desktop
      - type: file
        path: io.github.snowdreamtech.UniRTM.svg
      - type: file
        path: io.github.snowdreamtech.UniRTM.metainfo.xml
