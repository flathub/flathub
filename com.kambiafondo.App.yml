app-id: com.kambiafondo.App
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: kambiafondo

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=xdg-pictures/Kambiafondo:create
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.Wallpaper

modules:
  - name: kambiafondo
    buildsystem: simple
    build-commands:
      - mkdir -p /app/kambiafondo /app/bin
      - cp -r bundle/* /app/kambiafondo/
      - ln -s /app/kambiafondo/kambiafondo /app/bin/kambiafondo
      - install -Dm644 com.kambiafondo.App.desktop /app/share/applications/com.kambiafondo.App.desktop
      - install -Dm644 com.kambiafondo.App.metainfo.xml /app/share/metainfo/com.kambiafondo.App.metainfo.xml
      - install -Dm644 Icon-512.png /app/share/icons/hicolor/512x512/apps/com.kambiafondo.App.png
    sources:
      - type: archive
        url: https://kambiafondo.com/uploads/kambiafondo-linux-x64.tar.gz
        sha256: ace38e92d99438dcbef09f7a023558cd038bf3014455fc85c93a697a01577841
        strip-components: 0
      - type: file
        path: com.kambiafondo.App.desktop
      - type: file
        path: com.kambiafondo.App.metainfo.xml
      - type: file
        path: Icon-512.png
