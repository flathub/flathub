app-id: io.github.daniell1904.SplitCommander
runtime: org.kde.Platform
runtime-version: '6.6'
sdk: org.kde.Sdk
command: splitcommander
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=host             # Ermöglicht vollen Zugriff auf das Dateisystem (wichtig für Dateimanager)
  - --filesystem=host-os          # Ermöglicht Zugriff auf Systemdateien des Hosts unter /run/host
  - --filesystem=host-etc         # Ermöglicht Zugriff auf Systemkonfiguration des Hosts under /run/host/etc
  - --system-talk-name=org.freedesktop.UDisks2  # D-Bus Zugriff für Geräteerkennung (Solid) auf dem System-Bus
  - --talk-name=org.freedesktop.FileManager1 # Registrierung als Standard-Dateimanager im System
  - --talk-name=org.freedesktop.portal.Flatpak # Erlaubt das Starten von anderen Flatpak-Apps (z.B. Terminal-Aktionen)
  - --talk-name=org.kde.baloo     # Für die Baloo-Suche, falls vorhanden

modules:
  - name: splitcommander
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSC_PLUGIN_GIT=ON
      - -DSC_PLUGIN_PAPERLESS=ON
      - -DSC_PLUGIN_MOUNTISO=ON
      - -DSC_PLUGIN_MAKEFILEACTIONS=ON
    sources:
      - type: git
        url: https://github.com/daniell1904/SplitCommander.git
        tag: v0.5.3
