id: io.github.patlefox.TuxFoot
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: tuxfoot

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri            # accès GPU (rendu 3D)
  - --socket=pulseaudio     # son
  - --share=ipc

modules:
  - name: tuxfoot
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/patlefox/tuxfoot.git
        tag: v0.10.3
        commit: c15e213c49f6c307da39a44498e09cffb4672257
    post-install:
      # Fichiers nommés à l'identifiant applicatif (exigé par Flathub).
      - install -Dm644 packaging/flatpak/io.github.patlefox.TuxFoot.metainfo.xml
          -t ${FLATPAK_DEST}/share/metainfo/
      - install -Dm644 packaging/flatpak/io.github.patlefox.TuxFoot.desktop
          -t ${FLATPAK_DEST}/share/applications/
      - install -Dm644 icons/tuxfoot.png
          ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.patlefox.TuxFoot.png
      - install -Dm644 icons/tuxfoot-256.png
          ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.patlefox.TuxFoot.png
      - install -Dm644 icons/tuxfoot-128.png
          ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/io.github.patlefox.TuxFoot.png
      # On retire les fichiers non préfixés installés par CMake.
      - rm -f ${FLATPAK_DEST}/share/applications/tuxfoot.desktop
      - rm -f ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/tuxfoot.png
      - rm -f ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/tuxfoot.png
      - rm -f ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/tuxfoot.png
