
app-id: com.gtask_for_desktop.GTaskForDesktop
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: launch.sh

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network

modules:
  - name: gtask-for-desktop
    buildsystem: simple
    build-commands:
      # Make Java runtime binaries executable.
      - chmod -R a+x jre/bin
      - chmod -R a+x jre/javafx/lib
      - chmod a+x jre/lib/jspawnhelper

      # Install the application bundle.
      - install -d /app/share/gtask-for-desktop
      - cp -a . /app/share/gtask-for-desktop/

      # Install the application launcher and desktop integration files.
      - install -Dm755 launch.sh /app/bin/launch.sh
      - install -Dm644 com.gtask_for_desktop.GTaskForDesktop.desktop /app/share/applications/com.gtask_for_desktop.GTaskForDesktop.desktop
      - install -Dm644 com.gtask_for_desktop.GTaskForDesktop.metainfo.xml /app/share/metainfo/com.gtask_for_desktop.GTaskForDesktop.metainfo.xml

      # Install application icons.
      - install -Dm644 icon_48x48.png /app/share/icons/hicolor/48x48/apps/com.gtask_for_desktop.GTaskForDesktop.png
      - install -Dm644 icon_256x256.png /app/share/icons/hicolor/256x256/apps/com.gtask_for_desktop.GTaskForDesktop.png

    sources:
      # Download and extract the application bundle during the build.
      - type: archive
        only-arches:
          - x86_64
        url: https://gtask-for-desktop.com/app/8/gtask-for-desktop_8.2.0_amd64.tar.gz
        sha256: 5708de892977795f2346e244addb923fe8186bc8f3856e01b35f0464a0c9b5f5
        strip-components: 0

      # Include launcher and desktop integration files.
      - type: file
        path: launch.sh
      - type: file
        path: com.gtask_for_desktop.GTaskForDesktop.desktop
      - type: file
        path: com.gtask_for_desktop.GTaskForDesktop.metainfo.xml
      - type: file
        path: icon_48x48.png
      - type: file
        path: icon_256x256.png

