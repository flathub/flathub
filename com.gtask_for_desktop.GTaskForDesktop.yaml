app-id: com.gtask_for_desktop.GTaskForDesktop
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk25

command: launch.sh

finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --env=JAVA_HOME=/app/jre

modules:
  # Install OpenJDK
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk25/install.sh

  # Install the application.
  - name: gtask-for-desktop
    buildsystem: simple
    build-commands:

      # Install the application bundle.
      - install -d /app/share/gtask-for-desktop
      - cp -a . /app/share/gtask-for-desktop/

      # Install application launcher.
      - install -Dm755 flatpak-launch.sh /app/bin/launch.sh

      # Install desktop integration files.
      - install -Dm644 com.gtask_for_desktop.GTaskForDesktop.desktop /app/share/applications/com.gtask_for_desktop.GTaskForDesktop.desktop
      - install -Dm644 com.gtask_for_desktop.GTaskForDesktop.metainfo.xml /app/share/metainfo/com.gtask_for_desktop.GTaskForDesktop.metainfo.xml

      # Install application icons.
      - install -Dm644 icon_48x48.png /app/share/icons/hicolor/48x48/apps/com.gtask_for_desktop.GTaskForDesktop.png
      - install -Dm644 icon_256x256.png /app/share/icons/hicolor/256x256/apps/com.gtask_for_desktop.GTaskForDesktop.png

    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://gtask-for-desktop.com/app/8/gtask-for-desktop_8.2.0_amd64_flatpak.tar.gz
        sha256: e0d84a97eac81ce06f350aa06054cf8734231fa091aad24d4cbcc51b6e39391d
        strip-components: 0

