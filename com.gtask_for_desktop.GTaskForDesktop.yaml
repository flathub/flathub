
app-id: com.gtask_for_desktop.GTaskForDesktop
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: launch.sh

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network

modules:
  - name: gtask-for-desktop
    buildsystem: simple
    build-commands:
      # Create the application data directory and link the downloaded
      # application bundle into the location expected by the launcher.
      - install -d /app/share
      - ln -s /app/extra /app/share/gtask-for-desktop

      # Install the application launcher and desktop integration files.
      - install -Dm755 launch.sh /app/bin/launch.sh
      - install -Dm644 com.gtask_for_desktop.GTaskForDesktop.desktop /app/share/applications/com.gtask_for_desktop.GTaskForDesktop.desktop
      - install -Dm644 com.gtask_for_desktop.GTaskForDesktop.metainfo.xml /app/share/metainfo/com.gtask_for_desktop.GTaskForDesktop.metainfo.xml

      # Install application icons in the appropriate icon directories.
      - install -Dm644 icon_48x48.png /app/share/icons/hicolor/48x48/apps/com.gtask_for_desktop.GTaskForDesktop.png
      - install -Dm644 icon_256x256.png /app/share/icons/hicolor/256x256/apps/com.gtask_for_desktop.GTaskForDesktop.png

      # Install the script responsible for extracting the application archive.
      - install -Dm755 apply_extra.sh /app/bin/apply_extra

    sources:
      # Download the proprietary application bundle directly from the
      # server during installation, rather than including the application
      # binaries in the Flathub build.
      - type: extra-data
        filename: gtask-for-desktop.tar.gz
        only-arches:
          - x86_64
        url: https://gtask-for-desktop.com/app/8/gtask-for-desktop_8.1.0_amd64.tar.gz
        sha256: 20f3381a0250764215e65fb79833332f8d47a61f4c196e7b216da413f11ac42f
        size: 102001599

      # Include the extraction script as a regular source file.
      - type: file
        path: apply_extra.sh

      # Include the launcher, desktop entry, AppStream metadata and icons.
      - type: file
        path: launch.sh
      - type: file
        path: com.gtask_for_desktop.GTaskForDesktop.desktop
      - type: file
        path: com.gtask_for_desktop.GTaskForDesktop.metainfo.xml
      - type: file
        path: icon_48x48.png
      - type: file
        path: icon_256x256.png

