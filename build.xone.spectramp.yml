id: build.xone.spectramp
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: spectramp

finish-args: 
- --socket=wayland 
- --socket=fallback-x11 
- --share=ipc 
- --device=dri 
- --socket=pulseaudio 
- --share=network # internet radio, cover art, lyrics
- --filesystem=xdg-music # reads the music folder and save tag edits into the files
- --env=GTK_USE_PORTAL=1 
- --talk-name=org.kde.StatusNotifierWatcher # tray icon
- --talk-name=org.freedesktop.FileManager1 # show folders

modules:
  - name: app-dirs
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin

  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: spectramp
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/xDev143/spectramp-releases/releases/download/v1.0.0/Spectramp_1.0.0_amd64.deb
        sha256: ed77a536defbbcd965ad29f4e37d24f158db7fbf466c40186d84098aaad6e8f9
        dest-filename: spectramp.deb
        only-arches:
          - x86_64
      - type: file
        path: build.xone.spectramp.metainfo.xml
      - type: file
        path: LICENSE.txt
      - type: file
        path: THIRD-PARTY-NOTICES.txt

    build-commands:
      - ar -x spectramp.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/spectramp /app/bin/spectramp

      - install -Dm644 usr/share/icons/hicolor/32x32/apps/spectramp.png /app/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -Dm644 usr/share/icons/hicolor/48x48/apps/spectramp.png /app/share/icons/hicolor/48x48/apps/${FLATPAK_ID}.png
      - install -Dm644 usr/share/icons/hicolor/64x64/apps/spectramp.png /app/share/icons/hicolor/64x64/apps/${FLATPAK_ID}.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/spectramp.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 usr/share/icons/hicolor/256x256/apps/spectramp.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 usr/share/icons/hicolor/512x512/apps/spectramp.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm644 usr/share/applications/Spectramp.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 build.xone.spectramp.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 LICENSE.txt /app/share/licenses/${FLATPAK_ID}/LICENSE.txt
      - install -Dm644 THIRD-PARTY-NOTICES.txt /app/share/licenses/${FLATPAK_ID}/THIRD-PARTY-NOTICES.txt