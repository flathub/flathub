app-id: io.github.DarkVamp76.ngplayer
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ngplayer
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=xdg-music:ro
modules:
  - name: ngplayer
    buildsystem: simple
    build-commands:
      - make VERSION=2.3.0 -j$FLATPAK_BUILDER_N_JOBS
      - install -Dm755 build/ngplayer /app/bin/ngplayer
      - install -Dm644 assets/ngplayer.svg /app/share/icons/hicolor/scalable/apps/io.github.DarkVamp76.ngplayer.svg
      - sed 's/^Icon=ngplayer/Icon=io.github.DarkVamp76.ngplayer/' packaging/ngplayer.desktop > io.github.DarkVamp76.ngplayer.desktop
      - install -Dm644 io.github.DarkVamp76.ngplayer.desktop /app/share/applications/io.github.DarkVamp76.ngplayer.desktop
      - install -Dm644 packaging/ngplayer-mime.xml /app/share/mime/packages/io.github.DarkVamp76.ngplayer.xml
      - install -Dm644 io.github.DarkVamp76.ngplayer.metainfo.xml /app/share/metainfo/io.github.DarkVamp76.ngplayer.metainfo.xml
    sources:
      - type: git
        url: https://github.com/DarkVamp76/ngplayer.git
        tag: v2.3.0
        commit: 632bcd9f7ab94d2663ee98cbbcad5ed865a5f5f8
      - type: file
        path: io.github.DarkVamp76.ngplayer.metainfo.xml
