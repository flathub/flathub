id: net.andromede.Andromede
runtime: org.freedesktop.Platform        # L'app ne dépend que de bibliotheques
runtime-version: "26.08"                 # de base : le runtime freedesktop suffit
sdk: org.freedesktop.Sdk
command: andromede                       # Le binaire atterrit dans /app/bin

finish-args:
  - --share=ipc                          # Requis pour X11
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri                         # Accélération GPU
  - --socket=pulseaudio                  # Son : ALSA est redirigé vers PulseAudio par le runtime
  - --talk-name=org.freedesktop.Notifications   # notify-rust : service D-Bus des notifications
  - --talk-name=org.kde.StatusNotifierWatcher  # ksni : icône de zone de notification
  - --share=network                      # Requis : l'application ne fonctionne pas hors ligne


cleanup:
  - /share/doc
  - /share/man
  - /share/lintian

modules:
  - name: andromede
    buildsystem: simple
    only-arches:
      - x86_64                           # Le .deb n'existe qu'en x86_64
    build-commands:
      - ar -x andromede.deb
      - tar -xf data.tar.* -C /app --strip-components=2
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://www.andromede.net/telechargement/linux/andromede_0.1.0_amd64.deb
        sha256: 22755da6be749bc6a7761ead4a9ecc6f5ff9ea4df9b4b6b18da6d5ce53fc4d04
        dest-filename: andromede.deb

