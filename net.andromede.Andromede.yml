id: net.andromede.Andromede
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: andromede

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --share=network

cleanup:
  - /share/doc
  - /share/man
  - /share/lintian

modules:
  - name: andromede
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - ar -x andromede.deb
      - tar -xf data.tar.* -C /app --strip-components=2
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://www.andromede.net/telechargement/linux/andromede_0.1.0_amd64.deb
        sha256: 5a9f132b0b21df7785e6835e2c03a5cc3ce8cefa31a71382c58d21b3fca62d84
        dest-filename: andromede.deb
