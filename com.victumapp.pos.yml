app-id: com.victumapp.pos
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: victumpos

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --filesystem=/run/cups:ro
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.GeoClue2
  - --system-talk-name=org.freedesktop.Avahi
  - --env=ELECTRON_DISABLE_SECURITY_WARNINGS=true
  - --env=ELECTRON_DISABLE_SANDBOX=1
  - --env=NO_AT_BRIDGE=1

modules:
  - name: victumpos
    buildsystem: simple
    sources:
      - type: archive
        url: https://pos.victumapp.com/downloads/VictumPOS-Linux-1.0.3-x64.tar.gz
        sha256: 681a24348d64cc0e514b9c5a04d7d82e4c905854532a3be68361b47536fc0106

      - type: file
        path: victumpos-flatpak-launcher
      - type: file
        path: com.victumapp.pos.desktop
      - type: file
        path: com.victumapp.pos.metainfo.xml
      - type: dir
        path: icons
        dest: icons
    build-commands:
      - install -d /app/VictumPOS /app/bin
      - find . -mindepth 1 -maxdepth 1 ! -name victumpos-flatpak-launcher ! -name com.victumapp.pos.desktop ! -name com.victumapp.pos.metainfo.xml ! -name icons -exec cp -a {} /app/VictumPOS/ \;
      - rm -f /app/VictumPOS/chrome-sandbox
      - chmod 0755 /app/VictumPOS/victumpos /app/VictumPOS/chrome_crashpad_handler
      - install -Dm755 victumpos-flatpak-launcher /app/bin/victumpos
      - install -Dm644 com.victumapp.pos.desktop /app/share/applications/com.victumapp.pos.desktop
      - install -Dm644 com.victumapp.pos.metainfo.xml /app/share/metainfo/com.victumapp.pos.metainfo.xml
      - for size in 16 24 32 48 64 128 256 512 1024; do install -Dm644 "icons/${size}x${size}.png" "/app/share/icons/hicolor/${size}x${size}/apps/com.victumapp.pos.png"; done
