app-id: io.github.satodu.KdeWebappManager
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.8'
command: kde-webapp-manager
rename-desktop-file: io.github.satodu.KdeWebappManager.desktop

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --talk-name=org.kde.KWin
  - --filesystem=xdg-data/applications:create
  - --filesystem=xdg-data/icons:create
  - --filesystem=xdg-config/kwinrulesrc
  - --filesystem=xdg-config/webapps:create
  - --filesystem=/var/lib/flatpak:ro
  - --filesystem=xdg-data/flatpak:ro

modules:
  - name: kde-webapp-manager
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/satodu/kde-webapp-gen.git
        tag: '1.0.2'
        commit: 86367d5e49f864cfbe937b4697ffef79ef54c86b
    build-commands:
      # Instalação dos arquivos Python do pacote
      - mkdir -p /app/share/kde-webapp-manager
      - cp -r webapp_manager /app/share/kde-webapp-manager/
      - cp main.py /app/bin/kde-webapp-manager
      - chmod +x /app/bin/kde-webapp-manager
      
      # Instalar arquivos de metadados, desktop launcher e ícones
      - install -Dm644 images/kde-webapp-gen-icon-logo.png /app/share/icons/hicolor/256x256/apps/io.github.satodu.KdeWebappManager.png
      - install -Dm644 io.github.satodu.KdeWebappManager.desktop /app/share/applications/io.github.satodu.KdeWebappManager.desktop
      - install -Dm644 io.github.satodu.KdeWebappManager.metainfo.xml /app/share/metainfo/io.github.satodu.KdeWebappManager.metainfo.xml
