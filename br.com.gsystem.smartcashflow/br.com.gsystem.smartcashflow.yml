app-id: br.com.gsystem.smartcashflow
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: smart-cash-flow

finish-args:
  # Servidor gráfico (X11 e Wayland)
  - --socket=x11
  - --socket=fallback-x11
  - --socket=wayland
  # Portais de Desktop (abrir navegador padrão para o painel web local)
  - --talk-name=org.freedesktop.portal.OpenURI
  - --talk-name=org.freedesktop.portal.Desktop
  # Acesso de rede local e IPC
  - --share=network
  - --share=ipc
  # Sistema de notificações desktop
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: smartcashflow
    buildsystem: simple
    build-commands:
      # Instalação do binário
      - install -D smart-cash-flow /app/bin/smart-cash-flow
      # Instalação do lançador .desktop
      - install -D br.com.gsystem.smartcashflow.desktop /app/share/applications/br.com.gsystem.smartcashflow.desktop
      # Instalação do arquivo AppStream
      - install -D br.com.gsystem.smartcashflow.metainfo.xml /app/share/metainfo/br.com.gsystem.smartcashflow.metainfo.xml
      # Instalação do ícone em alta resolução
      - install -D br.com.gsystem.smartcashflow.png /app/share/icons/hicolor/512x512/apps/br.com.gsystem.smartcashflow.png
    sources:
      - type: archive
        url: https://github.com/eliasZX32/smart-go/releases/download/v2.0.1/Smart_cashflow_Linux.tar.gz
        sha256: c4b5a4db30d55392e53bd86a99335f58184700ea5ad9685da9b768ec9746ac5b
      - type: file
        path: br.com.gsystem.smartcashflow.desktop
      - type: file
        path: br.com.gsystem.smartcashflow.metainfo.xml
      - type: file
        path: br.com.gsystem.smartcashflow.png
