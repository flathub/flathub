app-id: io.github.gabrielbaiano.Deskstamp
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: deskstamp

finish-args:
  # Wayland display and zwlr_layer_shell_v1 access
  - --socket=wayland
  - --socket=fallback-x11
  # Hardware acceleration
  - --device=dri
  # StatusNotifierItem Tray integration
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-*
  # External links / Portal browser open
  - --talk-name=org.freedesktop.portal.OpenURI
  # Portal file chooser & image reading
  - --filesystem=xdg-pictures:ro

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/deskstamp/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: deskstamp
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/deskstamp /app/bin/deskstamp
      - install -Dm644 data/io.github.gabrielbaiano.Deskstamp.desktop /app/share/applications/io.github.gabrielbaiano.Deskstamp.desktop
      - install -Dm644 data/io.github.gabrielbaiano.Deskstamp.metainfo.xml /app/share/metainfo/io.github.gabrielbaiano.Deskstamp.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.gabrielbaiano.Deskstamp.svg /app/share/icons/hicolor/scalable/apps/io.github.gabrielbaiano.Deskstamp.svg
      - for size in 16 24 32 48 64 128 256 512; do install -Dm644 data/icons/hicolor/${size}x${size}/apps/io.github.gabrielbaiano.Deskstamp.png /app/share/icons/hicolor/${size}x${size}/apps/io.github.gabrielbaiano.Deskstamp.png; done
    sources:
      - type: git
        url: https://github.com/GabrielBaiano/Deskstamp.git
        tag: v0.1.0
        commit: 6c2d72e4c726d45a11e8a7ef0948c9f9c123ecc9
      - cargo-sources.json
