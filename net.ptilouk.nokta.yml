app-id: net.ptilouk.nokta
base: org.godotengine.godot.BaseApp
base-version: '4.7'
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: nokta
rename-icon: nokta
rename-desktop-file: nokta.desktop
rename-appdata-file: nokta.metainfo.xml
finish-args:
  - --socket=fallback-x11
  - --share=ipc
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio

modules:
  - name: nokta
    buildsystem: simple
    build-commands:
      - cp -r * /app/
    sources:
      - type: archive
        url: https://download.ptilouk.net/nokta-1.1-flatpak-release.tar.gz
        sha256: b76a683f31004b788fb22a07262e5ef86c68a06c811ddcf1a69f7f350fc2c6fa
    post-install:
      - install -Dm0644 /app/share/icons/nokta.svg /app/share/icons/hicolor/scalable/apps/nokta.svg
