app-id: net.ptilouk.nokta
base: org.godotengine.godot.BaseApp
base-version: '4.7'
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: nokta
rename-icon: nokta
rename-desktop-file: nokta.desktop
rename-appdata-file: nokta.metainfo.xml
finish-args:
  - --socket=fallback-x11
  - --share=ipc
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio

modules:
  - name: nokta
    buildsystem: simple
    build-commands:
      - cp -r * /app/
    post-install:
      - install -Dm0644 /app/share/icons/nokta.svg /app/share/icons/hicolor/scalable/apps/nokta.svg
    sources:
      - type: archive
        url: https://download.ptilouk.net/nokta-1.2-flatpak-release.tar.gz
        sha256: 91e194f205c2cdcf9c5abe53efe9c0463cc19e5dbdc8a3474e3d280b926555e0
