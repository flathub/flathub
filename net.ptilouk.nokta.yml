app-id: net.ptilouk.nokta
base: org.godotengine.godot.BaseApp
base-version: '4.7'
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: nokta
rename-icon: nokta
rename-desktop-file: nokta.desktop
rename-appdata-file: nokta.metainfo.xml
finish-args:
  - --socket=fallback-x11
  - --share=ipc
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio

modules:
  - name: nokta
    buildsystem: simple
    build-commands:
      - cp -r * /app/
    post-install:
      - install -Dm0644 /app/share/icons/nokta.svg /app/share/icons/hicolor/scalable/apps/nokta.svg
      - |
        if [ "$FLATPAK_ARCH" = "x86_64" ]; then
          rm -f /app/bin/*.arm64.so
        elif [ "$FLATPAK_ARCH" = "aarch64" ]; then
          rm -f /app/bin/*.x86_64.so
        fi
    sources:
      - type: archive
        url: https://download.ptilouk.net/nokta-1.2-flatpak-release.tar.gz
        sha256: dd544d113e39b741098b0c19af6507ac4a0a4b31d1ade958278858b3fce24b71
