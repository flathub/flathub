app-id: net.ptilouk.nokta
base: org.godotengine.godot.BaseApp
base-version: '4.7'
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: nokta
rename-icon: nokta
rename-desktop-file: nokta.desktop
rename-appdata-file: nokta.metainfo.xml
finish-args:
  - --socket=fallback-x11
  - --share=ipc
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio

modules:
  - name: nokta
    buildsystem: simple
    build-commands:
      - cp -r * /app/
    sources:
      - type: archive
        url: https://download.ptilouk.net/nokta-1.0-flatpak-release.tar.gz
        sha256: 7d7d6545b6ea658839d4e6c9d1478e238c41dcabcd642a8e7384ad5072d1d4af
    post-install:
      - install -Dm0644 /app/share/icons/nokta.svg /app/share/icons/hicolor/scalable/apps/nokta.svg
