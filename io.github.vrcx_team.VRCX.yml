app-id: io.github.vrcx_team.VRCX
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.dotnet9
command: vrcx
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # Flathub Steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam/.local/share/Steam/config:ro
  - --filesystem=~/.var/app/com.valvesoftware.Steam/.local/share/Steam/steamapps/compatdata/438100
  - --filesystem=~/.var/app/com.valvesoftware.Steam/.local/share/Steam/userdata
  
  # Native Steam
  - --filesystem=~/.local/share/Steam/config:ro
  - --filesystem=~/.local/share/Steam/steamapps/compatdata/438100
  - --filesystem=~/.local/share/Steam/userdata

build-options:
  append-path: /usr/lib/sdk/node24/bin
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    DOTNET_NOLOGO: 'true'
    NPM_CONFIG_LOGLEVEL: info
    NPM_CONFIG_UPDATE_NOTIFIER: 'false'

modules:
  - name: vrcx
    buildsystem: simple
    subdir: VRCX
    build-options:
      append-path: /usr/lib/sdk/dotnet9/bin
      append-ld-library-path: /usr/lib/sdk/dotnet9/lib
      prepend-pkg-config-path: /usr/lib/sdk/dotnet9/lib/pkgconfig
      env:
        XDG_CACHE_HOME: /run/build/vrcx/flatpak-node/cache
        NUGET_PACKAGES: /run/build/vrcx/nuget-packages
        npm_config_cache: /run/build/vrcx/flatpak-node/npm-cache
        npm_config_offline: 'true'
      arch:
        x86_64:
          env:
            VRCX_DOTNET_ARCH: x64
            VRCX_DOTNET_PLATFORM: x64
            VRCX_DOTNET_PROJECT: Dotnet/VRCX-Electron.csproj
            VRCX_ELECTRON_OUTPUT: build/linux-unpacked
        aarch64:
          env:
            VRCX_DOTNET_ARCH: arm64
            VRCX_DOTNET_PLATFORM: ARM64
            VRCX_DOTNET_PROJECT: Dotnet/VRCX-Electron-arm64.csproj
            VRCX_ELECTRON_OUTPUT: build/linux-arm64-unpacked
    license-files:
      - VRCX/LICENSE
    build-commands:
      - dotnet restore "$VRCX_DOTNET_PROJECT" --arch "$VRCX_DOTNET_ARCH" --source ../nuget-sources --source /usr/lib/sdk/dotnet9/nuget/packages
      - dotnet build "$VRCX_DOTNET_PROJECT" --configuration Release --no-restore --arch "$VRCX_DOTNET_ARCH" -p:Platform="$VRCX_DOTNET_PLATFORM" -p:PlatformTarget="$VRCX_DOTNET_PLATFORM" -p:WarningLevel=0
      # The upstream lock omits registry metadata. The Flatpak-only copy keeps
      # identical package versions while making npm ci fully offline.
      - cp ../package-lock.flatpak.json package-lock.json
      - npm ci --offline
      - npm run prod-linux
      - touch .no-updater
      - node src-electron/patch-package-version.js
      - ./node_modules/.bin/electron-builder --linux dir --"$VRCX_DOTNET_ARCH" --publish never
      - node src-electron/patch-node-api-dotnet.js --arch="$VRCX_DOTNET_ARCH"
      # Discard native SQLite payloads for other operating systems and CPU
      # architectures before installation.
      - if test -d "$VRCX_ELECTRON_OUTPUT/resources/app.asar.unpacked/build/Electron/runtimes"; then find "$VRCX_ELECTRON_OUTPUT/resources/app.asar.unpacked/build/Electron/runtimes" -mindepth 1 -maxdepth 1 ! -name "linux-$VRCX_DOTNET_ARCH" -exec rm -rf '{}' +; fi
      # Upstream's bundled OpenVR libraries are x86-64. The overlay cannot work
      # across the Flatpak Steam sandbox, so omit those incompatible files from
      # the aarch64 build while keeping the rest of VRCX functional.
      - if test "$FLATPAK_ARCH" = aarch64; then find "$VRCX_ELECTRON_OUTPUT/resources" -type f \( -name openvr_api.dll -o -name openvr_api.so -o -name libopenvr_api.so \) -delete; fi
      - cp -a "$VRCX_ELECTRON_OUTPUT" /app/vrcx
      - install -Dm755 ../packaging/vrcx.sh /app/bin/vrcx
      - install -Dm644 ../packaging/io.github.vrcx_team.VRCX.desktop /app/share/applications/io.github.vrcx_team.VRCX.desktop
      - install -Dm644 ../packaging/io.github.vrcx_team.VRCX.metainfo.xml /app/share/metainfo/io.github.vrcx_team.VRCX.metainfo.xml
      - install -Dm644 images/VRCX.png /app/share/icons/hicolor/512x512/apps/io.github.vrcx_team.VRCX.png
    sources:
      - type: git
        url: https://github.com/vrcx-team/VRCX.git
        tag: v2026.07.18
        commit: eafcccb20ed5828d99bd1b0f4b53a384a52a1d47
        dest: VRCX
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: patch
        path: patches/0001-linux-use-detected-steam-userdata-path.patch
        dest: VRCX
      - type: file
        path: packaging/vrcx.sh
        dest: packaging
      - type: file
        path: packaging/io.github.vrcx_team.VRCX.desktop
        dest: packaging
      - type: file
        path: packaging/io.github.vrcx_team.VRCX.metainfo.xml
        dest: packaging
      - type: file
        path: package-lock.flatpak.json
      # Generated from VRCX/package-lock.json at the pinned tag.
      - npm-sources.json
      # Generated from Dotnet/VRCX-Electron.csproj at the pinned tag.
      - nuget-sources.json
      # Generated from Dotnet/VRCX-Electron-arm64.csproj at the pinned tag.
      - nuget-sources-aarch64.json

  - name: dotnet-runtime
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/dotnet9/bin/install.sh
