id: uk._92li.lingyicute.ComputeSec
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: computesec
finish-args:
  - --socket=wayland
  - --device=dri
  # Read HSI via fwupd D-Bus (read-only). Needed for firmware security assessment.
  - --system-talk-name=org.freedesktop.fwupd
  # Read host OS name, kernel, hw vendor/model via systemd-hostnamed.
  - --system-talk-name=org.freedesktop.hostname1
  # Count installed Flatpak apps (exclude runtimes, GNOME/KDE platform, self) to evaluate sandbox adoption. Read-only.
  - --filesystem=/var/lib/flatpak:ro
  - --filesystem=~/.local/share/flatpak:ro
  # Enumerate USB devices to detect 2.4G wireless receivers. Read-only.
  - --filesystem=/run/udev:ro
  # Detect Windows bootloader. Read-only.
  - --filesystem=/boot/efi:ro
  - --filesystem=/efi:ro

cleanup:
  - '*.pyc'
  - __pycache__

modules:
  - name: computesec
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/computesec
      - cp -r computesec /app/lib/computesec/
      - cp -r data /app/lib/computesec/
      - install -Dm755 run.py /app/bin/computesec
      - install -Dm644 data/uk._92li.lingyicute.ComputeSec.desktop /app/share/applications/uk._92li.lingyicute.ComputeSec.desktop
      - install -Dm644 data/uk._92li.lingyicute.ComputeSec.metainfo.xml /app/share/metainfo/uk._92li.lingyicute.ComputeSec.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/uk._92li.lingyicute.ComputeSec.svg /app/share/icons/hicolor/scalable/apps/uk._92li.lingyicute.ComputeSec.svg
    sources:
      - type: archive
        url: https://github.com/lingyicute/ComputeSec/archive/refs/tags/v1.1.0.tar.gz
        sha256: 85002bf8d92a3fd15aaff03da19f0cbfef1990ca94cefd6aaf92124fa4f0149e
        x-checker-data:
          type: github
          owner: lingyicute
          repo: ComputeSec
          tag-pattern: ^v([\d.]+)$
          is-main-source: true
