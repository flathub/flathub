app-id: io.github.visageeee.Viditron
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: viditron

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-download/Viditron:create

modules:
  - name: viditron
    buildsystem: simple
    build-commands:
      - install -Dm755 flatpak/viditron-launcher /app/bin/viditron
      - install -Dm755 run.py /app/lib/viditron/run.py
      - cp -a viditron /app/lib/viditron/
      - cp -a data /app/lib/viditron/
      - install -Dm755 yt-dlp /app/bin/yt-dlp
      - install -Dm644 flatpak/io.github.visageeee.Viditron.desktop /app/share/applications/io.github.visageeee.Viditron.desktop
      - install -Dm644 flatpak/io.github.visageeee.Viditron.metainfo.xml /app/share/metainfo/io.github.visageeee.Viditron.metainfo.xml
      - install -Dm644 data/icons/app/io.github.visageeee.Viditron.svg /app/share/icons/hicolor/scalable/apps/io.github.visageeee.Viditron.svg
      - for size in 16 24 32 48 64 128 256; do install -Dm644 data/icons/app/${size}x${size}/io.github.visageeee.Viditron.png /app/share/icons/hicolor/${size}x${size}/apps/io.github.visageeee.Viditron.png; done
    sources:
      - type: archive
        url: https://github.com/visageeee/viditron/archive/refs/tags/v0.1.4.tar.gz
        sha256: 0c855eed285b21073a39f7b6362d1d9facfaa29d9568639f3a60611611f3f682
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp
        sha256: 1fa6733c37ea6fb51c99ad8fe785e7b7e5f3246c9b980230329d4fb72ed8d4d6
        dest-filename: yt-dlp
