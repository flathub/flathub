app-id: app.amverge.AMVerge
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: amverge

finish-args:
  # Windowing & Display
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11

  # GPU Hardware Acceleration
  - --device=dri

  # Audio Playback
  - --socket=pulseaudio

  # Network (AI models download, community Events, Discord RPC)
  - --share=network

  # File Access for video import, clip exports, and scenepacks
  - --filesystem=home

  # Desktop Integration
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: amverge
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
      env:
        CARGO_HOME: /run/build/amverge/cargo
        npm_config_cache: /run/build/amverge/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      # 1. Build React frontend offline
      - |
        cd frontend
        npm ci --offline --cache /run/build/amverge/flatpak-node/npm-cache
        npm run build

      # 2. Build Rust / Tauri desktop binary offline (with custom-protocol for bundled frontend assets)
      - |
        cd frontend/src-tauri
        TAURI_CONFIG='{"bundle":{"resources":["../src/assets/fonts/licenses/jersey-10-OFL.txt"]}}' \
          cargo build --release --offline --features tauri/custom-protocol

      # 3. Install desktop binary
      - install -Dm755 frontend/src-tauri/target/release/amverge /app/bin/amverge

      # 4. Install upstream desktop file, AppStream metainfo, and icons
      - install -Dm644 flatpak/app.amverge.AMVerge.desktop /app/share/applications/app.amverge.AMVerge.desktop
      - install -Dm644 flatpak/app.amverge.AMVerge.metainfo.xml /app/share/metainfo/app.amverge.AMVerge.metainfo.xml
      - install -Dm644 flatpak/icons/app.amverge.AMVerge.png /app/share/icons/hicolor/128x128/apps/app.amverge.AMVerge.png
      - install -Dm644 flatpak/icons/app.amverge.AMVerge-256.png /app/share/icons/hicolor/256x256/apps/app.amverge.AMVerge.png

    sources:
      - type: git
        url: https://github.com/AMVerge-team/AMVerge.git
        commit: f79950eaa953f385269360653d2c6fd744e2a34f
      - cargo-sources.json
      - node-sources.json
