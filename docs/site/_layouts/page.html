---
layout: default
---

<main class="stacked-main">
  <section class="section-heading section-heading-tight">
    {% if page.eyebrow %}
    <p class="eyebrow">{{ page.eyebrow }}</p>
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.intro %}
    <p class="lede narrow">{{ page.intro }}</p>
    {% endif %}
  </section>

  <section class="faq-shell">
    <article
      class="doc-body{% if page.body_class %} {{ page.body_class }}{% endif %}"
    >
      {{ content }}
    </article>
  </section>
</main>
