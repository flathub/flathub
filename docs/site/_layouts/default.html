<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% if page.title == site.title %}{{ site.title }}{% elsif page.title %}{{
      page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}
    </title>
    <meta
      name="description"
      content="{{ page.description | default: site.description }}"
    />
    <link rel="preconnect" href="https://github.com" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body>
    <div
      class="page-shell{% if page.layout == 'page' %} subpage-shell{% endif %}"
    >
      <header class="site-header">
        <a class="wordmark" href="./">OpenKara</a>
        <nav class="site-nav" aria-label="Primary">
          <a href="./">Home</a>
          <a href="faq.html">FAQ</a>
          <a href="https://github.com/thedavidweng/OpenKara/releases"
            >Releases</a
          >
          <a href="https://github.com/thedavidweng/OpenKara">GitHub</a>
        </nav>
      </header>

      {{ content }}

      <footer class="site-footer">
        <p>OpenKara is MIT licensed and developed in the open.</p>
        <div class="footer-links">
          <a href="https://github.com/thedavidweng/OpenKara">GitHub</a>
          <a href="https://github.com/thedavidweng/OpenKara/releases"
            >Releases</a
          >
          <a href="https://github.com/thedavidweng/OpenKara/blob/main/README.md"
            >README</a
          >
          <a
            href="https://github.com/thedavidweng/OpenKara/blob/main/README_CN.md"
            >README 中文</a
          >
        </div>
      </footer>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const els = document.querySelectorAll(".reveal");
        if (!els.length) return;
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((e) => {
              if (e.isIntersecting) {
                e.target.classList.add("in-view");
                io.unobserve(e.target);
              }
            });
          },
          { threshold: 0.12 },
        );
        els.forEach((el) => io.observe(el));
      });
    </script>
  </body>
</html>
