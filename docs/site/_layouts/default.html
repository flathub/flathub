<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% if page.title == site.title %}{{ site.title }}{% elsif page.title %}{{
      page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}
    </title>
    <meta
      name="description"
      content="{{ page.description | default: site.description }}"
    />
    <link rel="preconnect" href="https://github.com" />
    <link
      rel="icon"
      type="image/png"
      href="{{ '/assets/img/favicon-96x96.png' | relative_url }}"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ '/assets/img/favicon.svg' | relative_url }}"
    />
    <link
      rel="shortcut icon"
      href="{{ '/assets/img/favicon.ico' | relative_url }}"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}"
    />
    <meta name="apple-mobile-web-app-title" content="OpenKara" />
    <link
      rel="manifest"
      href="{{ '/assets/img/site.webmanifest' | relative_url }}"
    />
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
  </head>
  <body>
    <div
      class="page-shell{% if page.page_shell %} {{ page.page_shell }}{% endif %}"
    >
      <header class="site-header">
        <a class="wordmark" href="./">OpenKara</a>
        <nav class="site-nav" aria-label="Primary">
          <a href="./">Home</a>
          <a href="faq.html">FAQ</a>
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
          <a href="https://github.com/thedavidweng/OpenKara/releases"
            >Download</a
          >
          <a href="https://github.com/thedavidweng/OpenKara">GitHub</a>
        </nav>
      </header>

      {{ content }}

      <footer class="site-footer">
        <div class="footer-top">
          <p class="eyebrow" id="cta-title">Need more detail?</p>
          <div class="cta-links">
            <a href="faq.html">Read the FAQ</a>
            <a
              href="https://github.com/thedavidweng/OpenKara/blob/main/README.md"
              >Project README</a
            >
            <a
              href="https://github.com/thedavidweng/OpenKara/blob/main/docs/design-docs/architecture.md"
              >Architecture</a
            >
            <a
              href="https://github.com/thedavidweng/OpenKara/blob/main/docs/design-docs/releasing.md"
              >Release workflow</a
            >
          </div>
        </div>
        <div class="footer-bottom">
          <p>OpenKara is MIT licensed and developed in the open.</p>
          <div class="footer-links">
            <a href="https://github.com/thedavidweng/OpenKara">GitHub</a>
            <a href="https://github.com/thedavidweng/OpenKara/releases"
              >Download</a
            >
            <a href="faq.html">FAQ</a>
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
          </div>
        </div>
      </footer>
    </div>

    <script>
      document.querySelectorAll("pre").forEach(function (pre) {
        const button = document.createElement("button");
        button.className = "copy-button";
        button.textContent = "Copy";
        button.setAttribute("aria-label", "Copy code to clipboard");

        button.addEventListener("click", async function () {
          const code = pre.querySelector("code");
          if (!code) return;
          try {
            await navigator.clipboard.writeText(code.innerText);
            button.textContent = "Copied!";
            setTimeout(() => {
              button.textContent = "Copy";
            }, 2000);
          } catch (err) {
            console.error("Failed to copy", err);
          }
        });

        pre.appendChild(button);
      });
    </script>
  </body>
</html>
