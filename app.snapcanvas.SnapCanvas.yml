app-id: app.snapcanvas.SnapCanvas
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: snapcanvas

finish-args:
  # Display servers and GPU
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Audio
  - --socket=pulseaudio
  # Network (for OCR models, updater check, image uploads)
  - --share=network
  # Desktop Notifications & Tray
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher
  - --talk-name=org.ayatana.bamf
  # Filesystem permissions
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download
  - --filesystem=xdg-documents

modules:
  - name: snapcanvas
    buildsystem: simple
    build-commands:
      - install -Dm755 snapcanvas /app/lib/snapcanvas/snapcanvas
      - cp -P lib* /app/lib/snapcanvas/ 2>/dev/null || true
      - install -Dm644 app.snapcanvas.SnapCanvas.desktop /app/share/applications/app.snapcanvas.SnapCanvas.desktop
      - install -Dm644 app.snapcanvas.SnapCanvas.metainfo.xml /app/share/metainfo/app.snapcanvas.SnapCanvas.metainfo.xml
      - install -Dm644 app.snapcanvas.SnapCanvas.png /app/share/icons/hicolor/512x512/apps/app.snapcanvas.SnapCanvas.png
      - install -Dm644 app.snapcanvas.SnapCanvas-128.png /app/share/icons/hicolor/128x128/apps/app.snapcanvas.SnapCanvas.png
      - install -d /app/bin
      - |
        cat << 'EOF' > /app/bin/snapcanvas
        #!/bin/sh
        export LD_LIBRARY_PATH=/app/lib/snapcanvas:/app/lib:${LD_LIBRARY_PATH:-}
        export WEBKIT_DISABLE_DMABUF_RENDERER=1
        export GDK_BACKEND=x11,wayland
        exec /app/lib/snapcanvas/snapcanvas "$@"
        EOF
        chmod +x /app/bin/snapcanvas
    sources:
      - type: archive
        url: https://snapcanvas.app/release/1.1.0/linux/snapcanvas-linux-x86_64.tar.gz
        sha256: fe928bddf04ce8796f794e38ddb0ea881970fa439346b740739303272c320db5
        strip-components: 0
        only-arches:
          - x86_64
      - type: file
        path: app.snapcanvas.SnapCanvas.desktop
      - type: file
        path: app.snapcanvas.SnapCanvas.metainfo.xml
      - type: file
        path: app.snapcanvas.SnapCanvas.png
      - type: file
        path: app.snapcanvas.SnapCanvas-128.png
