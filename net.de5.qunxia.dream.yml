app-id: net.de5.qunxia.dream
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: qunxia_launcher

build-options:
  no-debuginfo: true

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network

modules:
  - name: dreamjianghu
    buildsystem: simple
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://qunxia.de5.net/releases/dreamjianghu-linux-amd64-1.0.0.tar.gz
        sha256: 33671f3cf2452d05fb658039963ec3dd9e1772b7c14643408fe6163f44deeb42
        x-checker-data:
          type: html
          url: https://qunxia.de5.net/releases/
          version-pattern: 'dreamjianghu-linux-amd64-([0-9.]+)\.tar\.gz'
          url-pattern: 'dreamjianghu-linux-amd64-([0-9.]+)\.tar\.gz'
      - type: archive
        only-arches: [aarch64]
        url: https://qunxia.de5.net/releases/dreamjianghu-linux-aarch64-1.0.0.tar.gz
        sha256: c4bd189891452503b80f68db14c72d1ef54cd933397af62226f9d6bba12da93b
        x-checker-data:
          type: html
          url: https://qunxia.de5.net/releases/
          version-pattern: 'dreamjianghu-linux-aarch64-([0-9.]+)\.tar\.gz'
          url-pattern: 'dreamjianghu-linux-aarch64-([0-9.]+)\.tar\.gz'
      - type: file
        path: net.de5.qunxia.dream.desktop
      - type: file
        path: net.de5.qunxia.dream.metainfo.xml
      - type: file
        path: icon.svg
    build-commands:
      - tar -xzf dreamjianghu-bin.tar.gz
      - install -Dm755 -t /app/bin qunxia_launcher
      - install -Dm755 -t /app/bin libqunxia.so libqunxia52.so libqunxia54.so
      - install -Dm755 -t /app/bin libSDL3.so
      - ln -sf libSDL3.so /app/bin/libSDL3.so.0
      - install -Dm644 -t /app/bin font.ttf Font-Awesome.otf
      - install -Dm644 -t /app/share/applications net.de5.qunxia.dream.desktop
      - install -Dm644 -t /app/share/metainfo net.de5.qunxia.dream.metainfo.xml
      - install -Dm644 -t /app/share/icons/hicolor/scalable/apps icon.svg
      - ln -sf /app/share/icons/hicolor/scalable/apps/icon.svg /app/share/icons/hicolor/scalable/apps/net.de5.qunxia.dream.svg
