# Flathub manifest for Dozenal Calc.
#
# Strategy: ship the PRE-BUILT Linux bundle (Flathub's builders have no network,
# and a Flutter source build downloads the engine/pub packages at build time —
# impractical to vendor). So we build `flutter build linux --release` locally,
# tar the bundle, publish it as a GitHub release asset, and reference it here.
# This is the common, accepted pattern for Flutter apps on Flathub.
#
# NOT yet submittable — see packaging/flatpak/README.md for the open TODOs
# (bundle url+sha256, the metainfo screenshot, flatpak-builder test pass).
app-id: app.weltanschauung.dozenal
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: dozenal_calc_flutter

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  # Deliberately NO --share=network and NO --filesystem: the app needs neither
  # (no analytics, no network — matches the privacy policy).

modules:
  - name: dozenal-calc
    buildsystem: simple
    build-commands:
      # The Flutter bundle keeps its binary + lib/ + data/ together; install it
      # as a unit and expose the binary on PATH via a symlink (the engine finds
      # lib/ and data/ relative to the real exe path via /proc/self/exe).
      - mkdir -p /app/dozenal-calc
      - cp -r bundle/. /app/dozenal-calc/
      - install -d /app/bin
      - ln -s /app/dozenal-calc/dozenal_calc_flutter /app/bin/dozenal_calc_flutter
      - install -Dm644 app.weltanschauung.dozenal.desktop /app/share/applications/app.weltanschauung.dozenal.desktop
      - install -Dm644 app.weltanschauung.dozenal.metainfo.xml /app/share/metainfo/app.weltanschauung.dozenal.metainfo.xml
      - install -Dm644 app.weltanschauung.dozenal-512.png /app/share/icons/hicolor/512x512/apps/app.weltanschauung.dozenal.png
      - install -Dm644 app.weltanschauung.dozenal-256.png /app/share/icons/hicolor/256x256/apps/app.weltanschauung.dozenal.png
      - install -Dm644 app.weltanschauung.dozenal-128.png /app/share/icons/hicolor/128x128/apps/app.weltanschauung.dozenal.png
    sources:
      - type: archive
        # Pre-built Linux x64 bundle, hosted on the v1.5.1 GitHub release.
        # Rebuild: flutter build linux --release &&
        #   tar czf dozenal-calc-1.5.1-linux-x64.tar.gz -C build/linux/x64/release bundle
        url: https://github.com/steinerschueler/dozenal_calc_flutter/releases/download/v1.5.1/dozenal-calc-1.5.1-linux-x64.tar.gz
        sha256: 19eebf1a378d121f00f9b1ca787ae23e42bf44597a50f65af7cca277d57dbd48
        # The tarball keeps its top-level bundle/ dir (default would strip it).
        strip-components: 0
      - type: file
        path: app.weltanschauung.dozenal.desktop
      - type: file
        path: app.weltanschauung.dozenal.metainfo.xml
      - type: file
        path: app.weltanschauung.dozenal-512.png
      - type: file
        path: app.weltanschauung.dozenal-256.png
      - type: file
        path: app.weltanschauung.dozenal-128.png
