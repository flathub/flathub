app-id: io.github.GitDavin.MapleWeb
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: maple-web

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download

modules:
  - name: maple-web
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node20/bin
      env:
        XDG_CACHE_HOME: /run/build/maple-web/flatpak-node/cache
        npm_config_cache: /run/build/maple-web/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      - npm install --offline --ignore-scripts
      - mkdir -p /app/main /app/bin /app/share/applications /app/share/metainfo /app/share/icons/hicolor/512x512/apps
      - cp -r main.js index.html package.json node_modules /app/main/
      - install -Dm644 io.github.GitDavin.MapleWeb.desktop /app/share/applications/io.github.GitDavin.MapleWeb.desktop
      - install -Dm644 io.github.GitDavin.MapleWeb.metainfo.xml /app/share/metainfo/io.github.GitDavin.MapleWeb.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.GitDavin.MapleWeb.png
      - |
        cat << 'WRAPPER' > /app/bin/maple-web
        #!/bin/bash
        exec zypak-wrapper /app/main/node_modules/electron/dist/electron /app/main --no-sandbox "$@"
        WRAPPER
      - chmod +x /app/bin/maple-web
    sources:
      - type: git
        url: https://github.com/GitDavin/Maple-Web.git
        commit: YOUR_40_CHAR_COMMIT_HASH
      - generated-sources.json
