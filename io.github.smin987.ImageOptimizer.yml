# Flathub manifest for Image Optimizer
# Submit via flathub/flathub new-pr branch (PR base MUST be `new-pr`, not master)
id: io.github.smin987.ImageOptimizer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: io.github.smin987.ImageOptimizer
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
modules:
  # Official prebuilt binaries from the v1.1.3 GitHub release (extra-data:
  # downloaded at install time, pinned by sha256). The Fair-Code license
  # permits free redistribution of official binaries, and this submission
  # is opened by the upstream author.
  - name: imageoptimizer-x86_64
    only-arches: [x86_64]
    buildsystem: simple
    build-commands:
      - install -Dm755 ImageOptimizer-x86_64 /app/bin/io.github.smin987.ImageOptimizer
    sources:
      - type: extra-data
        only-arches: [x86_64]
        filename: ImageOptimizer-x86_64
        url: https://github.com/smin987/ImageOptimizer/releases/download/v1.1.3/ImageOptimizer-linux-x86_64
        sha256: 21d78aeaf863efe99d11b74be551cc82e69b5ed176df6a29b353bf0f28e9877a
        size: 84979856
  - name: imageoptimizer-aarch64
    only-arches: [aarch64]
    buildsystem: simple
    build-commands:
      - install -Dm755 ImageOptimizer-aarch64 /app/bin/io.github.smin987.ImageOptimizer
    sources:
      - type: extra-data
        only-arches: [aarch64]
        filename: ImageOptimizer-aarch64
        url: https://github.com/smin987/ImageOptimizer/releases/download/v1.1.3/ImageOptimizer-linux-arm64
        sha256: 976824247be06ca1b8e73396c0718fc8307843642a65bf6fe9f7d74ac00fe88d
        size: 82588544
  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 io.github.smin987.ImageOptimizer.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 io.github.smin987.ImageOptimizer.desktop -t /app/share/applications/
      - install -Dm644 io.github.smin987.ImageOptimizer.png /app/share/icons/hicolor/512x512/apps/io.github.smin987.ImageOptimizer.png
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.smin987.ImageOptimizer/LICENSE
    sources:
      - type: file
        path: io.github.smin987.ImageOptimizer.metainfo.xml
      - type: file
        path: io.github.smin987.ImageOptimizer.desktop
      - type: file
        path: io.github.smin987.ImageOptimizer.png
      - type: file
        path: LICENSE
