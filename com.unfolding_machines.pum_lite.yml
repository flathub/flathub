# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json

app-id: com.unfolding_machines.pum_lite
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: pum_lite
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: pum_lite
    buildsystem: simple
    build-commands:
      - install -Dm644 com.unfolding_machines.pum_lite.desktop $FLATPAK_DEST/share/applications/com.unfolding_machines.pum_lite.desktop
      - install -Dm644 com.unfolding_machines.pum_lite.metainfo.xml $FLATPAK_DEST/share/metainfo/com.unfolding_machines.pum_lite.metainfo.xml
      - install -Dm644 icon_linux_512.png $FLATPAK_DEST/share/icons/hicolor/512x512/apps/com.unfolding_machines.pum_lite.png
      - install -Dm644 LICENSE.txt $FLATPAK_DEST/share/licenses/$FLATPAK_ID/LICENSE.txt
      - install -Dm755 pum_lite $FLATPAK_DEST/bin/pum_lite
      - cp -a lib data $FLATPAK_DEST/
    sources:
      - type: archive
        url: https://pumcpub.s3.eu-central-1.amazonaws.com/pum-lite_1.0.1_Linux-Portable.tar.gz
        sha256: 274de2cbcab9d6ef5b30a0a6a39e53dfef5bc4fc1a9fa83094e71eff327f04a4
        only-arches:
          - x86_64
      - type: file
        path: linux/com.unfolding_machines.pum_lite.desktop
      - type: file
        path: linux/com.unfolding_machines.pum_lite.metainfo.xml
      - type: file
        path: assets/splash_and_icon/icon_linux_512.png
      - type: file
        path: LICENSE.txt