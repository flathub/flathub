id: com.lyvuha.tienhiep.TienHiepAI
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: tienhiepai
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --socket=pulseaudio

modules:
  - name: tienhiepai
    buildsystem: simple
    build-commands:
      - mkdir -p /app/tienhiepai /app/share
      - cp -r app/* /app/tienhiepai/
      - install -Dm755 bin/tienhiepai /app/bin/tienhiepai
      - cp -r share/* /app/share/
    sources:
      - type: archive
        url: https://github.com/congkx123789/tienhiep-releases/releases/download/v0.11.26/TienHiepAI-linux-x86_64-0.11.26.tar.gz
        sha256: b834ada596fb60037b0241e2c879d462ec98f2ee52543b12263a6137ffed4a87