app-id: io.allswap.AddressValidator
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: allswap-address-validator
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
modules:
  - name: multichain-memo-address-validator
    buildsystem: simple
    build-commands:
      - install -Dm755 linux-gtk/allswap-address-validator.py /app/bin/allswap-address-validator
      - install -Dm644 linux-gtk/io.allswap.AddressValidator.desktop /app/share/applications/io.allswap.AddressValidator.desktop
      - install -Dm644 linux-gtk/io.allswap.AddressValidator.metainfo.xml /app/share/metainfo/io.allswap.AddressValidator.metainfo.xml
      - install -Dm644 linux-gtk/io.allswap.AddressValidator.svg /app/share/icons/hicolor/scalable/apps/io.allswap.AddressValidator.svg
    sources:
      - type: git
        url: https://github.com/zhangglnuo-art/multichain-memo-address-validator.git
        commit: 5c1217ee8ef44eae0e834039ed818f46afac0259
