app-id: io.github.sureshsoudararajan.Glypdl
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: glypdl

finish-args:
  # Network access for downloading media
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # File system access to Downloads directory and user home for cookies
  - --filesystem=xdg-download
  - --filesystem=home:ro
  # Notifications
  - --talk-name=org.freedesktop.Notifications

modules:
  # Up-to-date yt-dlp standalone engine
  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - install -Dm755 yt-dlp ${FLATPAK_DEST}/bin/yt-dlp
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp
        sha256: 1fa6733c37ea6fb51c99ad8fe785e7b7e5f3246c9b980230329d4fb72ed8d4d6

  # Glypdl Application
  - name: glypdl
    buildsystem: simple
    build-commands:
      - install -d ${FLATPAK_DEST}/share/glypdl
      - cp -r src/glypdl ${FLATPAK_DEST}/share/glypdl/
      - install -Dm755 bin/glypdl ${FLATPAK_DEST}/bin/glypdl
      - install -Dm644 data/desktop/io.github.suresh.Glypdl.desktop ${FLATPAK_DEST}/share/applications/io.github.sureshsoudararajan.Glypdl.desktop
      - install -Dm644 data/metainfo/io.github.suresh.Glypdl.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.sureshsoudararajan.Glypdl.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.suresh.Glypdl.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.sureshsoudararajan.Glypdl.svg
      - install -Dm644 data/icons/hicolor/512x512/apps/io.github.suresh.Glypdl.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.sureshsoudararajan.Glypdl.png
    sources:
      - type: git
        url: https://github.com/sureshsoudararajan/Glypdl.git
        tag: v1.0.0
        commit: d834be33260cb294ad7daa4542ce2f85e738a911
