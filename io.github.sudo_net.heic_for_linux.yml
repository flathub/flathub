app-id: io.github.sudo_net.heic_for_linux
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: heic-for-linux

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=~/.local/share/heic_for_linux:create
  - --filesystem=~/.config/autostart:create
  - --filesystem=xdg-pictures:ro
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf

modules:
  - python3-modules.json

  - name: exiftool
    buildsystem: simple
    build-commands:
      - install -Dm755 exiftool /app/bin/exiftool
      - cp -r lib /app/bin/
    sources:
      - type: archive
        url: https://github.com/exiftool/exiftool/archive/refs/tags/13.00.tar.gz
        sha256: 58449f91da6ce0cc5b88e56c6d75a080ab3bb28f546282c172df0a0eeabb50fb

  - name: libde265
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DDISABLE_DEC265=ON
      - -DDISABLE_SHERLOCK265=ON
    sources:
      - type: archive
        url: https://github.com/strukturag/libde265/releases/download/v1.0.15/libde265-1.0.15.tar.gz
        sha256: 00251986c29d34d3af7117ed05874950c875dd9292d016be29d3b3762666511d

  - name: libheif
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DWITH_EXAMPLES=ON
      - -DWITH_LIBDE265=ON
      - -DWITH_LIBDE265_PLUGIN=OFF
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://github.com/strukturag/libheif/releases/download/v1.18.2/libheif-1.18.2.tar.gz
        sha256: c4002a622bec9f519f29d84bfdc6024e33fd67953a5fb4dc2c2f11f67d5e45bf

  - name: heic_for_linux
    buildsystem: simple
    build-commands:
      - install -Dm755 main.py /app/bin/heic-for-linux
      - install -Dm755 daemon.py /app/bin/heic-daemon
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/io.github.sudo_net.heic_for_linux.svg
      - install -Dm644 io.github.sudo_net.heic_for_linux.desktop /app/share/applications/io.github.sudo_net.heic_for_linux.desktop
      - install -Dm644 io.github.sudo_net.heic_for_linux.metainfo.xml /app/share/metainfo/io.github.sudo_net.heic_for_linux.metainfo.xml
    sources:
      - type: git
        url: https://github.com/sudo-net/heic_for_linux.git
        tag: v0.1.0
        commit: 6a6e5978198f36c4a903fc344f2b6f49a9430cba
