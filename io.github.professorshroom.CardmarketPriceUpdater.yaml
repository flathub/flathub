id: io.github.professorshroom.CardmarketPriceUpdater
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet8

command: Cardmarket-Price-Updater

build-options:
  no-debuginfo: true
  append-path: /usr/lib/sdk/dotnet8/bin
  append-ld-library-path: /usr/lib/sdk/dotnet8/lib
  prepend-pkg-config-path: /usr/lib/sdk/dotnet8/lib/pkgconfig

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=dri

modules:
  - name: cardmarket-price-updater
    buildsystem: simple
    build-commands:
      - dotnet publish src/Avalonia/Cardmarket-Price-Updater.App.csproj -c Release -r linux-x64 --self-contained true --source ./nuget-sources -o /app/bin
      - install -Dm644 io.github.professorshroom.CardmarketPriceUpdater.desktop /app/share/applications/io.github.professorshroom.CardmarketPriceUpdater.desktop
      - install -Dm644 io.github.professorshroom.CardmarketPriceUpdater.appdata.xml /app/share/metainfo/io.github.professorshroom.CardmarketPriceUpdater.appdata.xml
      - install -Dm644 app-icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.professorshroom.CardmarketPriceUpdater.png
    sources:
      - type: git
        url: https://github.com/ProfessorShroom/Cardmarket-Price-Updater.git
        tag: v2.0.1.0
      - nuget-sources.json
