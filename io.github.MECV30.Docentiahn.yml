app-id: io.github.MECV30.Docentiahn
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: docentiahn

finish-args:
  # Gráficos y renderizado (Wayland y X11)
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Conectividad de red (Gemini API, Firebase Auth, Google Drive, Sync Móvil LAN puerto 8765)
  - --share=network
  # Periféricos (Cámara para escaneo de carnets y enrolamiento biométrico)
  - --device=all
  # Audio e impresión oficial de reportes
  - --socket=pulseaudio
  - --socket=cups
  # Llavero seguro del sistema operativo (libsecret / Secret Service API)
  - --talk-name=org.freedesktop.secrets
  # Carpetas de trabajo para exportar/importar PDFs y hojas de cálculo SACE
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # Acceso de solo lectura a machine-id para derivación de llave Argon2id (Ley 1)
  - --filesystem=/etc/machine-id:ro

modules:
  - name: docentiahn
    buildsystem: simple
    build-commands:
      - install -d /app/bin
      - cp -a bundle/* /app/bin/
      - chmod +x /app/bin/docentiahn
      - install -D -m 644 io.github.MECV30.Docentiahn.desktop /app/share/applications/io.github.MECV30.Docentiahn.desktop
      - install -D -m 644 io.github.MECV30.Docentiahn.metainfo.xml /app/share/metainfo/io.github.MECV30.Docentiahn.metainfo.xml
      - install -D -m 644 docentiahn.png /app/share/icons/hicolor/512x512/apps/io.github.MECV30.Docentiahn.png
    sources:
      - type: archive
        url: https://github.com/MECV30/docentiahn/releases/download/v1.0.0/docentiahn-1.0.0-linux-x64-portable.tar.gz
        sha256: 047b5e7cb8a3179791ab868df3b020011d734c557b293bfadc8fd5efbab868d6
      - type: file
        path: io.github.MECV30.Docentiahn.desktop
      - type: file
        path: io.github.MECV30.Docentiahn.metainfo.xml
      - type: file
        path: docentiahn.png
