app-id: com.voxcutpro.VoxCut
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: voxcut

# VoxCut est une application propriétaire (freemium). Le binaire (build
# PyInstaller) est récupéré via extra-data depuis la release GitHub officielle,
# puis décompressé à l'installation par apply_extra.
finish-args:
  - --share=ipc
  - --socket=x11            # Tkinter/CustomTkinter = client X11 (XWayland sur Wayland)
  - --share=network         # activation de licence (LemonSqueezy) + vérif. mises à jour
  - --filesystem=home       # lire le fichier source / écrire le fichier exporté choisis par l'utilisateur

modules:
  - name: voxcut
    buildsystem: simple
    build-commands:
      - install -Dm755 voxcut.sh /app/bin/voxcut
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm644 com.voxcutpro.VoxCut.desktop /app/share/applications/com.voxcutpro.VoxCut.desktop
      - install -Dm644 com.voxcutpro.VoxCut.metainfo.xml /app/share/metainfo/com.voxcutpro.VoxCut.metainfo.xml
      - install -Dm644 voxcut.png /app/share/icons/hicolor/256x256/apps/com.voxcutpro.VoxCut.png
      - install -Dm644 NotoColorEmoji.ttf /app/share/fonts/NotoColorEmoji.ttf
    sources:
      - type: extra-data
        filename: voxcut.tar.gz
        url: https://github.com/WgeorgeAssistantIA/voxcut-downloads/releases/download/v1.2.0/VoxCut-linux-x64.tar.gz
        sha256: 6f078695b8823636634946e53663690ed4803ff53eda7fd9bb1675a8c81e7a38
        size: 116769214
      - type: file
        path: voxcut.sh
      - type: file
        path: apply_extra.sh
      - type: file
        path: com.voxcutpro.VoxCut.desktop
      - type: file
        path: com.voxcutpro.VoxCut.metainfo.xml
      - type: file
        path: voxcut.png
      - type: file
        url: https://github.com/WgeorgeAssistantIA/voxcut-downloads/releases/download/v1.2.0/NotoColorEmoji.ttf
        sha256: 9fd0a3d0ce84d77e3185dfbae77bd1abf3926aa49a032e354d076c4f17151f10
