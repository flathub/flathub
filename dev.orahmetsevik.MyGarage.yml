app-id: dev.orahmetsevik.MyGarage
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: my_garage

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --env=GTK_USE_PORTAL=1

modules:
  # file_picker opens native dialogs using Zenity on Linux.
  - name: zenity
    buildsystem: meson
    config-opts:
      - -Dwebkitgtk=false
      - -Dmanpage=false
    cleanup:
      - /share/applications/org.gnome.Zenity.desktop
      - /share/icons/hicolor/*/apps/zenity.png
      - /share/icons/hicolor/*/apps/org.gnome.Zenity*
    sources:
      - type: archive
        url: https://download.gnome.org/sources/zenity/4.2/zenity-4.2.2.tar.xz
        sha256: 019186a996096ef4fc356e21577b5673f5baa3a29ac8e3d608b753371c18018d

  - name: my-garage
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
    only-arches:
      - x86_64
    build-commands:
      # Keep the executable, lib and data together as a Flutter bundle.
      - install -Dm755 my_garage /app/lib/my_garage/my_garage
      - cp -a lib data /app/lib/my_garage/
      - install -Dm755 my-garage-launcher.sh /app/bin/my_garage
      - install -Dm755 my-garage-which.sh /app/bin/which
      - install -Dm644 dev.orahmetsevik.MyGarage.desktop /app/share/applications/dev.orahmetsevik.MyGarage.desktop
      - install -Dm644 dev.orahmetsevik.MyGarage.metainfo.xml /app/share/metainfo/dev.orahmetsevik.MyGarage.metainfo.xml
      - install -Dm644 dev.orahmetsevik.MyGarage.svg /app/share/icons/hicolor/scalable/apps/dev.orahmetsevik.MyGarage.svg
    sources:
      - type: archive
        url: https://orahmetsevik.dev/flathub/my-garage-1.0.1-linux-x64.tar.gz
        sha256: 7977194c638b8720b265cca4d947579d17d9122f1c34fbb70250af41863e47a8
        strip-components: 0
