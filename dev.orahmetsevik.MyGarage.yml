app-id: dev.orahmetsevik.MyGarage
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: my_garage

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --env=GTK_USE_PORTAL=1

modules:
  - name: zenity
    buildsystem: meson
    config-opts:
      - -Dwebkitgtk=false
      - -Dmanpage=false
    cleanup:
      - /share/applications/org.gnome.Zenity.desktop
      - /share/icons/hicolor/*/apps/zenity.png
      - /share/icons/hicolor/*/apps/org.gnome.Zenity*
    sources:
      - type: archive
        url: https://download.gnome.org/sources/zenity/4.2/zenity-4.2.2.tar.xz
        sha256: 019186a996096ef4fc356e21577b5673f5baa3a29ac8e3d608b753371c18018d 
  - name: my-garage
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
    only-arches:
      - x86_64
    build-commands:
      - install -Dm755 my_garage /app/lib/my_garage/my_garage
      - cp -a lib data /app/lib/my_garage/
      - install -Dm755 my-garage-launcher.sh /app/bin/my_garage
      - install -Dm755 my-garage-which.sh /app/bin/which
      - install -Dm644 dev.orahmetsevik.MyGarage.desktop /app/share/applications/dev.orahmetsevik.MyGarage.desktop
      - install -Dm644 dev.orahmetsevik.MyGarage.metainfo.xml /app/share/metainfo/dev.orahmetsevik.MyGarage.metainfo.xml
      - install -Dm644 dev.orahmetsevik.MyGarage.png /app/share/icons/hicolor/512x512/apps/dev.orahmetsevik.MyGarage.png
    sources:
      - type: archive
        url: https://raw.githubusercontent.com/sprXogzz/ogiPortfolyo/main/flathub/my-garage-1.0.0-linux-x64.tar.gz
        sha256: 3ae8fbd206256f0fd86e76a65d95b59110ed42f64cf01f2b6b996b435694734f
        strip-components: 0
      - type: file
        path: dev.orahmetsevik.MyGarage.desktop
      - type: file
        path: dev.orahmetsevik.MyGarage.metainfo.xml
      - type: file
        path: dev.orahmetsevik.MyGarage.png
      - type: file
        path: my-garage-launcher.sh
      - type: file
        path: my-garage-which.sh
