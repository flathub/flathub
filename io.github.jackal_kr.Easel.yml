# Manifest submitted to Flathub (builds from the tagged source, not the local tree).
app-id: io.github.jackal_kr.Easel
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: easel

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: easel
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
    sources:
      - type: git
        url: https://github.com/jackal-kr/easel.git
        tag: v1.0.1
        commit: d64f63af6664087117bee2ef2b5ea76464f8fac4
