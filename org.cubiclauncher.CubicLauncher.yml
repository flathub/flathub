id: org.cubiclauncher.CubicLauncher

runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24

command: cubiclauncher
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network
  - --filesystem=~/.cubic:create
  - --socket=pulseaudio

build-options:
  append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin

modules:
  - name: cubiclauncher
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/CubicLauncherDevs/CubicLauncher.git
        tag: v32
        commit: bd619ac22deead9e180c3b3f8ddbda2a23c24b14
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

      - type: file
        path: package-lock.json

      - cargo-sources.json
      - node-sources.json

      - type: file
        path: org.cubiclauncher.CubicLauncher.desktop

      - type: file
        path: org.cubiclauncher.CubicLauncher.metainfo.xml

    build-options:
      env:
        CARGO_HOME: /run/build/cubiclauncher/cargo
        XDG_CACHE_HOME: /run/build/cubiclauncher/flatpak-node/cache
        npm_config_cache: /run/build/cubiclauncher/flatpak-node/npm-cache
        npm_config_offline: 'true'
        CARGO_NET_OFFLINE: 'true'

    build-commands:
      # El repo usa Bun, pero Flatpak solo lleva el SDK de Node.
      # Usamos package-lock.json para npm y ajustamos el hook de build.
      - python3 -c "import json; p='src-tauri/tauri.conf.json'; c=json.load(open(p)); c['build']['beforeBuildCommand']='npm run build'; c['bundle']['createUpdaterArtifacts']=False; f=open(p,'w'); json.dump(c, f, indent='\t', ensure_ascii=False); f.write('\n')"

      - npm ci --offline
      - cargo --offline fetch --manifest-path src-tauri/Cargo.toml --verbose
      - npm run --offline tauri build -- --no-bundle

      - install -Dm755 -t /app/bin/ target/release/cubiclauncher
      - install -Dm644 -t /app/share/metainfo/ org.cubiclauncher.CubicLauncher.metainfo.xml
      - install -Dm644 -t /app/share/applications/ org.cubiclauncher.CubicLauncher.desktop
      - desktop-file-edit
          --set-key=Icon
          --set-value="org.cubiclauncher.CubicLauncher"
          /app/share/applications/org.cubiclauncher.CubicLauncher.desktop
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/org.cubiclauncher.CubicLauncher.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/org.cubiclauncher.CubicLauncher.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/org.cubiclauncher.CubicLauncher.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/org.cubiclauncher.CubicLauncher.png
      - install -Dm644 LICENSE /app/share/licenses/org.cubiclauncher.CubicLauncher/LICENSE
