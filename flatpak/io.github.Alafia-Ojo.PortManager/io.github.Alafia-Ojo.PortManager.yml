app-id: io.github.Alafia-Ojo.PortManager
runtime: org.freedesktop.Platform//24.08
sdk: org.freedesktop.Sdk//24.08
command: port-manager
finish-args:
  - --share=ipc
  - --socket=x11
  - --filesystem=host
  - --filesystem=/etc/services:ro
modules:
  - name: port-manager
    buildsystem: simple
    build-commands:
      - cargo build --release --offline
      - install -Dm755 target/release/port-manager /app/bin/port-manager
      - install -Dm644 flatpak/io.github.Alafia-Ojo.PortManager.desktop /app/share/applications/io.github.Alafia-Ojo.PortManager.desktop
      - install -Dm644 flatpak/io.github.Alafia-Ojo.PortManager.metainfo.xml /app/share/metainfo/io.github.Alafia-Ojo.PortManager.metainfo.xml
      - install -Dm644 flatpak/io.github.Alafia-Ojo.PortManager.svg /app/share/icons/hicolor/scalable/apps/io.github.Alafia-Ojo.PortManager.svg
    sources:
      - type: git
        url: https://github.com/Alafia-Ojo/port-manager.git
        tag: v0.1.0
    build-options:
      env:
        CARGO_HOME: /run/build/port-manager/cargo
    cleanup:
      - /cargo
