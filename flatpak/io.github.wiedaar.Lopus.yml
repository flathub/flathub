app-id: io.github.wiedaar.Lopus
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: lopus

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
  # Zorg dat Python paden correct worden opgepikt indien nodig

modules:
  - name: lopus
    buildsystem: simple
    # Geef deze specifieke module tijdelijk internettoegang voor pip:
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip3 install --prefix=/app --no-deps PyQt6 PyQt6-sip PyQt6-Qt6
      - pip3 install --prefix=/app --no-deps PyQt6 PyQt6-sip PyQt6-Qt6 mutagen
      - mkdir -p /app/bin /app/share/applications /app/share/icons/hicolor/scalable/apps
      - cp *.py /app/bin/
      - |
        echo '#!/bin/sh' > /app/bin/lopus
        echo 'exec python3 /app/bin/lopus.py "$@"' >> /app/bin/lopus
        chmod +x /app/bin/lopus
      - cp io.github.wiedaar.Lopus.desktop /app/share/applications/io.github.wiedaar.Lopus.desktop
      - cp io.github.wiedaar.Lopus.svg /app/share/icons/hicolor/scalable/apps/io.github.wiedaar.Lopus.svg

    sources:
      - type: dir
        path: ..
      - type: file
        path: ../packaging/io.github.wiedaar.Lopus.desktop
      - type: file
        path: ../packaging/io.github.wiedaar.Lopus.svg
