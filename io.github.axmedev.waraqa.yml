app-id: io.github.axmedev.waraqa
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: warqa

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=~/Documents/waraqa:create

cleanup:
  - /share/flutter-sdk

modules:
  - name: flutter-sdk
    buildsys: simple
    build-commands:
      - install -d /app/share/flutter-sdk
      - cp -a flutter/. /app/share/flutter-sdk/
    sources:
      - type: archive
        url: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.0-stable.tar.xz
        sha256: e1ec95e6c550458a34de93580cb85dac24da0e9bedb9bb42811f050ac5a0c7d5

  - name: warqa
    buildsys: simple
    build-commands:
      - export PATH=/app/share/flutter-sdk/bin:$PATH
      - flutter config --no-analytics
      - flutter pub get
      - flutter build linux --release
      - install -d /app/share/waraqa
      - cp -a build/linux/x64/release/bundle/. /app/share/waraqa/
      - install -d /app/bin
      - ln -s ../share/waraqa/waraqa /app/bin/waraqa
      - install -Dm644 packaging/linux/io.github.axmedev.waraqa.desktop /app/share/applications/io.github.axmedev.waraqa.desktop
      - install -Dm644 packaging/linux/io.github.axmedev.waraqa.metainfo.xml /app/share/metainfo/io.github.axmedev.waraqa.metainfo.xml
      - install -d /app/share/icons/hicolor
      - cp -a packaging/linux/icons/. /app/share/icons/hicolor/
    sources:
      - type: git
        url: https://github.com/AXMEDEV/waraqa.git
        tag: v1.1.0
        commit: 0372ecd7d688fa34c55cd542aa8ad3d027d29e17
