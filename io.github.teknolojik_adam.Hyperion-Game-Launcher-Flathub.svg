<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="128" cy="128" r="120" fill="#1a1a2e"/>
  
  <!-- Outer Ring -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="url(#grad1)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Lightning Bolt -->
  <path d="M140 40 L100 140 L130 140 L115 220 L165 110 L130 110 Z" 
        fill="url(#grad1)" 
        filter="url(#glow)"
        transform="translate(8, -10)"/>
  
  <!-- Inner Circle -->
  <circle cx="128" cy="128" r="60" fill="none" stroke="#667eea" stroke-width="2" opacity="0.5"/>
  
  <!-- Stars -->
  <circle cx="180" cy="60" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="70" cy="80" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="200" cy="150" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="50" cy="180" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="190" cy="200" r="2" fill="#ffffff" opacity="0.6"/>
</svg>
