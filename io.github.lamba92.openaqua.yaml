app-id: io.github.lamba92.openaqua
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: open-aqua

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --filesystem=/sys:ro

modules:
  - name: open-aqua
    buildsystem: simple
    only-arches:
      - x86_64
    build-options:
      no-debuginfo: true
    build-commands:
      - install -d /app/lib/open-aqua /app/bin /app/share/applications /app/share/icons/hicolor/512x512/apps /app/share/metainfo
      - cp -r open-aqua/* /app/lib/open-aqua/
      - chmod +x /app/lib/open-aqua/bin/open-aqua
      - ln -s /app/lib/open-aqua/bin/open-aqua /app/bin/open-aqua
      - install -Dm644 io.github.lamba92.openaqua.desktop /app/share/applications/io.github.lamba92.openaqua.desktop
      - install -Dm644 io.github.lamba92.openaqua.png /app/share/icons/hicolor/512x512/apps/io.github.lamba92.openaqua.png
      - install -Dm644 io.github.lamba92.openaqua.metainfo.xml /app/share/metainfo/io.github.lamba92.openaqua.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/lamba92/open-aqua/releases/download/1.0.1/open-aqua-1.0.1-linux-x64.tar.gz
        sha256: 47166de335e7c5511df9705b0355bec57d471cbc843b9a28d29c65060673da30
      - type: file
        path: io.github.lamba92.openaqua.desktop
      - type: file
        path: io.github.lamba92.openaqua.png
      - type: file
        path: io.github.lamba92.openaqua.metainfo.xml
