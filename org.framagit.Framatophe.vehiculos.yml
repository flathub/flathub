app-id: org.framagit.Framatophe.vehiculos
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: vehiculos
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host # requis pour accéder au coffre (Vault) pour les fichiers locaux
  - --filesystem=home #Résolution des chemins utilisateurs

modules:
  # Module 1 : Compilation de libzip (requis pour réaliser les exports)
  - name: libzip
    sources:
      - type: archive
        url: https://libzip.org/download/libzip-1.11.4.tar.gz
        sha256: 82e9f2f2421f9d7c2466bbc3173cd09595a88ea37db0d559a9d0a2dc60dc722e
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib

  # Module 2 : application
  - name: vehiculos
    buildsystem: simple
    build-commands:
      # Compilation
      - gcc -O2 -Wall -Wextra *.c -o vehiculos $(pkg-config --cflags --libs gtk4 libzip)
      # Création des dossiers dans la sandbox (/app)
      - mkdir -p /app/bin/locales
      - mkdir -p /app/share/applications
      - mkdir -p /app/share/icons/hicolor/256x256/apps
      - mkdir -p /app/share/metainfo
      # Installation des fichiers
      - cp vehiculos /app/bin/
      - cp locales/*.ini /app/bin/locales/
      - cp org.framagit.Framatophe.vehiculos.desktop /app/share/applications/
      - cp org.framagit.Framatophe.vehiculos.png /app/share/icons/hicolor/256x256/apps/org.framagit.Framatophe.vehiculos.png
      - cp org.framagit.Framatophe.vehiculos.metainfo.xml /app/share/metainfo/
    sources:
      - type: git
        url: https://framagit.org/Framatophe/vehiculos.git
        branch: main
