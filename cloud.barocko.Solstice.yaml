app-id: cloud.barocko.Solstice
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: solstice-ui

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf
  - --talk-name=org.freedesktop.systemd1
  - --talk-name=org.gnome.Shell
  - --talk-name=org.gnome.Shell.Extensions
  - --talk-name=org.gnome.Mutter.DisplayConfig
  - --filesystem=home
  - --filesystem=xdg-data-home
  - --filesystem=/usr/share/themes:ro
  - --filesystem=/usr/share/icons:ro
  - --filesystem=/usr/share/sounds:ro
  - --filesystem=/usr/local/share/themes:ro
  - --filesystem=/usr/local/share/icons:ro
  - --share=network
  - --talk-name=org.freedesktop.PolicyKit1

modules:
  - name: solstice
    buildsystem: simple
    build-commands:
      - install -d ${FLATPAK_DEST}/lib/solstice
      - cp -r lib/solstice ${FLATPAK_DEST}/lib/
      - install -Dm755 bin/solstice-ui        ${FLATPAK_DEST}/bin/solstice-ui
      - install -Dm755 bin/solstice           ${FLATPAK_DEST}/bin/solstice
      - install -Dm755 bin/solstice-wallpaper ${FLATPAK_DEST}/bin/solstice-wallpaper
      - install -Dm644 share/applications/cloud.barocko.Solstice.desktop
          ${FLATPAK_DEST}/share/applications/cloud.barocko.Solstice.desktop
      - install -Dm644 share/metainfo/cloud.barocko.Solstice.metainfo.xml
          ${FLATPAK_DEST}/share/metainfo/cloud.barocko.Solstice.metainfo.xml
      - install -Dm644 share/icons/hicolor/scalable/apps/cloud.barocko.Solstice.svg
          ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/cloud.barocko.Solstice.svg
      - install -Dm644 share/icons/hicolor/symbolic/apps/cloud.barocko.Solstice-symbolic.svg
          ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/cloud.barocko.Solstice-symbolic.svg
      - mkdir -p ${FLATPAK_DEST}/share/locale/sv/LC_MESSAGES
      - msgfmt -o ${FLATPAK_DEST}/share/locale/sv/LC_MESSAGES/solstice.mo po/sv.po
    sources:
      - type: git
        url: https://forgejo.barocko.cloud/barocko/solstice
        tag: v1.2.0
        commit: af69bfbfc1872390ce454fc291c8dcebb530c0ae
