app-id: org.eronic.Codepad
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: codepad

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=home
  - --share=network
  - --device=dri
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: codepad
    buildsystem: simple
    build-commands:
      - install -d /app/lib/codepad
      - cp -r . /app/lib/codepad/
      - chmod 755 /app/lib/codepad/CodePad
      - mkdir -p /app/bin
      - printf "#!/bin/sh\nexport LD_LIBRARY_PATH=\"/app/lib/codepad:\$LD_LIBRARY_PATH\"\nexec /app/lib/codepad/CodePad \"\$@\"" > /app/bin/codepad
      - chmod 755 /app/bin/codepad
      - install -Dm644 org.eronic.Codepad.desktop /app/share/applications/org.eronic.Codepad.desktop
      - install -Dm644 org.eronic.Codepad.metainfo.xml /app/share/metainfo/org.eronic.Codepad.metainfo.xml

    sources:
      - type: archive
        url: https://github.com/AlphaGlider25/Codepad/releases/download/v1.0.3-inf/CodePad-1.0.3-inf-x64.AppImage
        sha256: 0019dfc4b32d63c1392aa264aed2253c1e0c2fb09216f8e2cc269bbfb8bb49b5
        strip-components: 0

      - type: inline
        dest-filename: org.eronic.Codepad.desktop
        contents: |
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=CodePad
          GenericName=Python IDE
          Comment=A lightweight Python IDE with plugin support
          Exec=codepad %F
          Icon=org.eronic.Codepad
          Terminal=false
          Categories=Development;IDE;TextEditor;
          MimeType=text/x-python;text/x-python3;text/plain;

      - type: inline
        dest-filename: org.eronic.Codepad.metainfo.xml
        contents: |
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>org.eronic.Codepad</id>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>MIT</project_license>
            <name>CodePad</name>
            <summary>A lightweight Python IDE with plugin support</summary>
            <description>
              <p>CodePad is a full-featured Python IDE with:</p>
              <ul>
                <li>Syntax highlighting and intelligent autocomplete powered by Jedi</li>
                <li>Plugin system for extending functionality</li>
                <li>Integrated Python shell</li>
                <li>Cloud sync support via MEGA</li>
              </ul>
            </description>
            <url type="homepage">https://www.eronic.co.za</url>
            <url type="bug-report">https://github.com/AlphaGlider25/Codepad/issues</url>
            <releases>
              <release version="1.0.3-inf" date="2026-05-20"/>
            </releases>
            <content_rating type="oars-1.1"/>
          </component>
