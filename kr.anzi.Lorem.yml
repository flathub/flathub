# Flathub 매니페스트 — 정본은 이 파일이고, Flathub 저장소(github.com/flathub/kr.anzi.Lorem)에 같은 것을 올린다.
# DECISIONS 2026-11-01: Linux는 Flathub로만 낸다.
#
# 소스를 빌드하지 않는다(소스 레포는 비공개). 릴리스 레포(공개)에 올린 tar.gz를 받아 그대로 싼다 —
# electron-builder.yml `linux.artifactName`이 그 이름을 정한다.
#
# 릴리스마다 바뀌는 것은 아래 archive의 url·sha256 둘뿐이다. Flathub의 flatpak-external-data-checker가
# x-checker-data로 새 릴리스를 보고 그 둘을 고친 PR을 스스로 연다(docs/release.md "Linux — Flathub").
app-id: kr.anzi.Lorem
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: lorem
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # 노트 본문의 동영상·오디오 재생.
  - --socket=pulseaudio
  # 보관함(Library)은 사용자가 고른 아무 폴더이고, 앱이 그 안의 파일을 계속 지켜본다 — 포털의 문서 경로
  # (/run/user/…/doc)로는 감시·상대 경로가 서지 않는다. MCP 등록도 남의 앱 설정(~/.claude.json,
  # ~/.config/Claude …)을 고쳐 쓴다(src/main/mcp/clients/registry.ts).
  - --filesystem=home
  # 데스크톱 알림.
  - --talk-name=org.freedesktop.Notifications
  # Electron safeStorage(libsecret) — AI 키·클라우드 세션 비밀(src/main/ai/keyStore.ts · cloudSync/sessionSecret.ts).
  - --talk-name=org.freedesktop.secrets

modules:
  - name: lorem
    buildsystem: simple
    build-commands:
      - cp -a lorem /app/lorem
      - install -Dm755 lorem.sh /app/bin/lorem
      - install -Dm644 kr.anzi.Lorem.desktop /app/share/applications/kr.anzi.Lorem.desktop
      - install -Dm644 kr.anzi.Lorem.metainfo.xml /app/share/metainfo/kr.anzi.Lorem.metainfo.xml
      - install -Dm644 kr.anzi.Lorem.png /app/share/icons/hicolor/512x512/apps/kr.anzi.Lorem.png
    sources:
      - type: archive
        # 맨 위 폴더 하나를 벗겨 lorem/ 아래에 푼다(strip-components 기본 1).
        dest: lorem
        only-arches: [x86_64]
        url: https://github.com/anjihhg/lorem-release/releases/download/v0.7.3/Lorem-0.7.3-linux-x64.tar.gz
        sha256: 840174664bfb3c7ee0ae1ad560dfe55c06edfa1e230c1003c103caf3377a380c
        x-checker-data:
          type: json
          url: https://api.github.com/repos/anjihhg/lorem-release/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/anjihhg/lorem-release/releases/download/v" + $version + "/Lorem-" + $version + "-linux-x64.tar.gz"'
      - type: file
        path: lorem.sh
      - type: file
        path: kr.anzi.Lorem.desktop
      - type: file
        path: kr.anzi.Lorem.metainfo.xml
      - type: file
        path: kr.anzi.Lorem.png
