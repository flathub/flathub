app-id: org.codeberg.EnviroGuy.Hordekeep
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
# The binary is installed under the app id, not `d2mm`: on Wayland the shell
# matches a window to a desktop entry by app id (the process name), and a
# `d2mm` window finds no `d2mm.desktop` in the sandbox — the dock then shows a
# generic icon while the app works. Naming it after the id makes the window, the
# desktop file and the icon one identity. The .deb keeps `d2mm`, matched by
# StartupWMClass, because its desktop file is Hordekeep.desktop.
command: org.codeberg.EnviroGuy.Hordekeep

# A mod manager's job is moving folders around wherever the user keeps them, and
# it stores those paths in its own database. Portal-granted directories would
# hand it handles that die at reboot, so the sandbox is given the home directory
# and nothing wider: no host access, no /mnt. Users whose game lives outside
# $HOME install the .deb from the apt repository instead.
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/hordekeep/cargo

modules:
  - name: hordekeep
    buildsystem: simple
    sources:
      - type: git
        url: https://codeberg.org/EnviroGuy/Hordekeep.git
        tag: v0.8.6
        commit: bf4952c7e581508b41860cb03983e4063d2c5504
        x-checker-data:
          type: json
          url: https://codeberg.org/api/v1/repos/EnviroGuy/Hordekeep/releases/latest
          tag-query: .tag_name
          version-query: .tag_name
          timestamp-query: .published_at
      # Generated by flatpak-cargo-generator.py from Cargo.lock; regenerate
      # whenever the lockfile changes.
      - cargo-sources.json
      # Generated by flatpak-node-generator npm from ui/package-lock.json.
      - node-sources.json
      - type: file
        path: org.codeberg.EnviroGuy.Hordekeep.desktop

    build-commands:
      # `cargo-sources.json` also delivers `cargo/config`, which points cargo at
      # the vendored crates beside it; nothing to write here.
      - cd ui && npm ci --offline --no-audit --no-fund --cache "$PWD/../flatpak-node/npm-cache" && npm run build

      - cargo build --release --offline -p d2mm-app

      - install -Dm755 target/release/d2mm /app/bin/org.codeberg.EnviroGuy.Hordekeep
      - install -Dm644 org.codeberg.EnviroGuy.Hordekeep.desktop /app/share/applications/org.codeberg.EnviroGuy.Hordekeep.desktop
      - install -Dm644 crates/app/icons/32x32.png /app/share/icons/hicolor/32x32/apps/org.codeberg.EnviroGuy.Hordekeep.png
      - install -Dm644 crates/app/icons/128x128.png /app/share/icons/hicolor/128x128/apps/org.codeberg.EnviroGuy.Hordekeep.png
      - install -Dm644 crates/app/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/org.codeberg.EnviroGuy.Hordekeep.png
      - install -Dm644 crates/app/icons/icon.png /app/share/icons/hicolor/512x512/apps/org.codeberg.EnviroGuy.Hordekeep.png
      - install -Dm644 packaging/metainfo/org.codeberg.EnviroGuy.Hordekeep.metainfo.xml /app/share/metainfo/org.codeberg.EnviroGuy.Hordekeep.metainfo.xml
      # The .deb installs Hordekeep.desktop; a Flatpak must use the app id,
      # and AppStream compose requires every launchable to resolve. One
      # metainfo, rewritten to the id this package actually installs.
      - sed -i 's|<launchable type="desktop-id">Hordekeep.desktop</launchable>|<launchable type="desktop-id">org.codeberg.EnviroGuy.Hordekeep.desktop</launchable>|' /app/share/metainfo/org.codeberg.EnviroGuy.Hordekeep.metainfo.xml
