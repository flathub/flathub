<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b9bff"/>
      <stop offset="1" stop-color="#0a6cff"/>
    </linearGradient>
  </defs>
  <!-- 左半脸蓝、右半脸白；中线(蓝白结合处)即鼻子 -->
  <circle cx="128" cy="104" r="74" fill="url(#face)"/>
  <path d="M128 30 A74 74 0 0 1 128 178 Z" fill="#ffffff"/>
  <!-- 眼睛：左眼白(蓝底) 右眼蓝(白底) -->
  <line x1="103" y1="84" x2="103" y2="100" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <line x1="153" y1="84" x2="153" y2="100" stroke="#0a6cff" stroke-width="7" stroke-linecap="round"/>
  <!-- 微笑：单条平滑弧线(深蓝，蓝白两半都可见)，无中缝尖角 -->
  <path d="M101 124 Q128 150 155 124" stroke="#0a3a8c" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- 底部蓝色短线（与 dock 指示同款） -->
  <rect x="84" y="212" width="88" height="14" rx="7" fill="#0a6cff"/>
</svg>
