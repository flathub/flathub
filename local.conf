<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Prioritize modern system fonts over DejaVu Sans in Flatpak runtime -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Ubuntu</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans TC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans JP</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Sans KR</family>
      <family>Noto Sans</family>
      <family>Inter</family>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Ubuntu</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans TC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans JP</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Sans KR</family>
      <family>Noto Sans</family>
      <family>Inter</family>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-sans-serif</family>
    <prefer>
      <family>Ubuntu</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans TC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans JP</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Sans KR</family>
      <family>Noto Sans</family>
      <family>Inter</family>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <!-- Remap Ubuntu Sans to Ubuntu to avoid variable font metric bugs with older HarfBuzz -->
  <match target="pattern">
    <test name="family">
      <string>Ubuntu Sans</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Ubuntu</string>
    </edit>
  </match>
</fontconfig>
