app-id: com.binhmmo.app_launcher_creator
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: app_launcher_creator

finish-args:
  # Display & GPU
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # File permissions to manage user applications and icons
  - --filesystem=xdg-data/applications:create
  - --filesystem=xdg-data/icons:create
  - --filesystem=host # Required to browse and select standalone binaries/AppImages across user storage

  # Portals & Notifications
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.FileChooser

modules:
  - name: app_launcher_creator
    buildsystem: simple
    build-commands:
      # Install application bundle with intact folder structure
      - install -d /app/app_launcher_creator
      - cp -a bundle/* /app/app_launcher_creator/
      - chmod +x /app/app_launcher_creator/app_launcher_creator

      # Create binary launcher wrapper in /app/bin
      - install -d /app/bin
      - |
        cat << 'EOF' > /app/bin/app_launcher_creator
        #!/bin/sh
        exec /app/app_launcher_creator/app_launcher_creator "$@"
        EOF
      - chmod +x /app/bin/app_launcher_creator

      # Install Desktop Entry
      - install -Dm644 com.binhmmo.app_launcher_creator.desktop /app/share/applications/com.binhmmo.app_launcher_creator.desktop

      # Install AppStream Metainfo
      - install -Dm644 com.binhmmo.app_launcher_creator.metainfo.xml /app/share/metainfo/com.binhmmo.app_launcher_creator.metainfo.xml

      # Install Icons (scalable and fixed resolutions)
      - install -Dm644 com.binhmmo.app_launcher_creator.svg /app/share/icons/hicolor/scalable/apps/com.binhmmo.app_launcher_creator.svg
      - install -Dm644 icon_512x512.png /app/share/icons/hicolor/512x512/apps/com.binhmmo.app_launcher_creator.png
      - install -Dm644 icon_128x128.png /app/share/icons/hicolor/128x128/apps/com.binhmmo.app_launcher_creator.png
      - install -Dm644 icon_64x64.png /app/share/icons/hicolor/64x64/apps/com.binhmmo.app_launcher_creator.png

    sources:
      # Binary release archive extracted into bundle/ directory
      - type: archive
        url: https://github.com/yaibait/Linux-Desktop-Entry-Creator/releases/download/Build/LDEC_x86_64.tar.gz
        sha256: f17bd12acbd368b3ae50d8ae8d07c213c271555ce40e8f035ebd20e566ecfe30
        strip-components: 0
        dest: bundle
        only-arches:
          - x86_64

      # AppStream metainfo, desktop entry, and icons
      - type: file
        path: com.binhmmo.app_launcher_creator.metainfo.xml

      - type: file
        path: com.binhmmo.app_launcher_creator.desktop

      - type: file
        path: com.binhmmo.app_launcher_creator.svg

      - type: file
        path: icon_512x512.png

      - type: file
        path: icon_128x128.png

      - type: file
        path: icon_64x64.png
