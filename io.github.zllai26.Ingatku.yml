app-id: io.github.zllai26.Ingatku
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: ingatku.sh
finish-args:
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --share=network

modules:
  - name: ingatku
    buildsystem: simple
    build-commands:
      - install -Dm755 ingatku.sh /app/bin/ingatku.sh
      - install -Dm644 io.github.zllai26.Ingatku.desktop /app/share/applications/io.github.zllai26.Ingatku.desktop
      - install -Dm644 io.github.zllai26.Ingatku.metainfo.xml /app/share/metainfo/io.github.zllai26.Ingatku.metainfo.xml
      - install -Dm644 ingatku-icon.png /app/share/icons/hicolor/512x512/apps/io.github.zllai26.Ingatku.png
    sources:
      - type: archive
        url: https://github.com/zllai26/ingatku/archive/refs/tags/v0.4.0.tar.gz
        sha256: PLACEHOLDER_SHA256
      - type: file
        path: ingatku.sh
      - type: file
        path: io.github.zllai26.Ingatku.desktop
      - type: file
        path: io.github.zllai26.Ingatku.metainfo.xml
      - type: file
        path: ingatku-icon.

