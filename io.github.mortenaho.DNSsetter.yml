# Flathub submission manifest template
# Rename to io.github.mortenaho.DNSsetter.yml when opening the Flathub PR.
# Replace 312ca4126076904c10090f15e053048e1799913116cfa166ab18bd0478092fa9 after uploading the release archive.

app-id: io.github.mortenaho.DNSsetter
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: dns-setter

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: dns-setter
    buildsystem: simple
    build-commands:
      - install -d /app/lib/dns-setter
      - cp -a bundle/. /app/lib/dns-setter/
      - install -Dm755 dns-setter.sh /app/bin/dns-setter
      - install -Dm644 io.github.mortenaho.DNSsetter.desktop /app/share/applications/io.github.mortenaho.DNSsetter.desktop
      - install -Dm644 io.github.mortenaho.DNSsetter.metainfo.xml /app/share/metainfo/io.github.mortenaho.DNSsetter.metainfo.xml
      - install -Dm644 icons/64.png /app/share/icons/hicolor/64x64/apps/io.github.mortenaho.DNSsetter.png
      - install -Dm644 icons/128.png /app/share/icons/hicolor/128x128/apps/io.github.mortenaho.DNSsetter.png
      - install -Dm644 icons/256.png /app/share/icons/hicolor/256x256/apps/io.github.mortenaho.DNSsetter.png
      - install -Dm644 icons/512.png /app/share/icons/hicolor/512x512/apps/io.github.mortenaho.DNSsetter.png
    sources:
      - type: archive
        url: https://github.com/mortenaho/dns-setter/releases/download/v1.0.0/dns-setter-1.0.0-x86_64-flatpak.tar.xz
