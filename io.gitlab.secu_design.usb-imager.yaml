id: io.gitlab.secu_design.usb-imager
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: usb-imager

# Flathub expects the desktop file and the icons to carry the app ID as their
# name. Both keys belong at the top level, a module ignores them.
rename-desktop-file: usb-imager.desktop
rename-icon: usb-imager

# The cleanup script of the base app reads both. The application uses neither
# QtWebEngine nor numpy, and dropping them saves about 370 MB.
build-options:
  env:
    BASEAPP_DISABLE_NUMPY: '1'
    BASEAPP_REMOVE_WEBENGINE: '1'

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Device access runs through udisks2, which passes the file descriptor over D-Bus.
  - --system-talk-name=org.freedesktop.UDisks2

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - python3-deps.yaml

  - name: usb-imager
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --no-deps --prefix=/app .
      - install -Dm644 distribution/flatpak/io.gitlab.secu_design.usb-imager.metainfo.xml
        -t /app/share/metainfo/
      - install -Dm644 LICENSE -t /app/share/licenses/io.gitlab.secu_design.usb-imager/
    sources:
      - type: git
        url: https://gitlab.com/secu-design/usb-imager.git
        tag: '4.1.0'
        commit: e2af0aa4c993920190c3be4fd9fd08be9d14dc5f
