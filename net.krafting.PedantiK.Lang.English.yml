app-id: net.krafting.PedantiK.Lang.English
build-extension: true
separate-locales: false
runtime: net.krafting.PedantiK
runtime-version: master
sdk: org.freedesktop.Sdk//25.08

modules:
  - name: English_Options_File
    buildsystem: simple
    build-commands:
      - install -Dm 644 languages/English/options.py /app/share/extra/English/options.py
      - install -Dm 644 net.krafting.PedantiK.Lang.English.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
    sources:
      - type: file
        path: net.krafting.PedantiK.Lang.English.metainfo.xml
      - type: git
        url: https://gitlab.com/Krafting/pedantik
        tag: '1.5.2'
        commit: d20745604a911bf1ca07ab3170635e64a3441907

  - name: English_Model_File
    buildsystem: simple
    build-commands:
      - gzip -d GoogleNews-vectors-negative300-SLIM.bin.gz
      - install -Dm 644 GoogleNews-vectors-negative300-SLIM.bin /app/share/extra/English/model.bin
    sources:
      - type: git
        url: https://github.com/eyaler/word2vec-slim
        commit: 35249de201875ac818eb78f7cc113c87c6e21bcc

