# Flathub submission manifest. Four of Flathub's rules shape everything below:
#
#   1. No network during the build. Every dependency is a pinned URL with a
#      sha256 in python3-deps.yaml, regenerated by tools/regen-flatpak-deps.sh.
#   2. No application source in the submission repository, so the app itself is
#      fetched from a tagged commit. tools/local_manifest.py swaps that for a
#      local directory when building from a working tree; build-flatpak.sh does
#      this for you.
#   3. The runtime must be the newest available at submission time.
#   4. Keys are in Flathub's prescribed order, not alphabetical.
#
# PySide6 is not pip-installed: it comes from the shared io.qt.PySide.BaseApp,
# which is why the runtime here is KDE's rather than the freedesktop one.
id: io.github.habi_zabi.InsightPoster
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: insight-poster-gui
base: io.qt.PySide.BaseApp
base-version: '6.11'

finish-args:
  # OpenRouter and the Facebook Graph API.
  - --share=network
  - --share=ipc
  - --socket=wayland
  # fallback-x11 rather than x11: the X socket is shared only when the session
  # is not Wayland. cli/gui.py asks Qt for "wayland;xcb" to match.
  - --socket=fallback-x11
  - --device=dri
  # API keys live in the OS keyring, reached over the Secret Service API.
  - --talk-name=org.freedesktop.secrets
  # No --filesystem of any kind: the database sits under XDG_CONFIG_HOME, which
  # Flatpak already points at this app's own writable directory. See
  # models/base.py:get_config_dir().

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

cleanup-commands:
  # Required by the BaseApp: strips its development files and unused Qt
  # binaries from the finished bundle.
  - /app/cleanup-BaseApp.sh

build-options:
  env:
    # The app has no web view and does no array maths; both are large.
    - BASEAPP_REMOVE_WEBENGINE=1
    - BASEAPP_DISABLE_NUMPY=1

modules:
  # Pinned, hashed, offline. Regenerate with tools/regen-flatpak-deps.sh after
  # changing [project.dependencies] in pyproject.toml.
  - python3-deps.yaml

  - name: insight-poster
    buildsystem: simple
    build-commands:
      # --no-index and --no-build-isolation keep this offline: no dependency
      # resolution (they are already installed) and no build backend download.
      - pip3 install --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 fb_insight_poster/resources/app_icon.png
        ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.habi_zabi.InsightPoster.png
      - install -Dm644 fb_insight_poster/resources/app_icon_512.png
        ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.habi_zabi.InsightPoster.png
    sources:
      - type: git
        url: https://github.com/habi-zabi/InsightPoster.git
        tag: v0.1.0
        # Replace with the SHA that tag points at before opening the PR:
        #   git rev-parse v0.1.0
        # tools/check_packaging.py --release refuses to pass while this is zeros.
        commit: 'aaaea1da6794438a8e82d4e429ccd54b740f2294'

  - name: desktop-file
    buildsystem: simple
    build-commands:
      - install -Dm644 io.github.habi_zabi.InsightPoster.desktop
        ${FLATPAK_DEST}/share/applications/io.github.habi_zabi.InsightPoster.desktop
    sources:
      - type: file
        path: io.github.habi_zabi.InsightPoster.desktop

  - name: metainfo
    buildsystem: simple
    build-commands:
      - install -Dm644 io.github.habi_zabi.InsightPoster.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/io.github.habi_zabi.InsightPoster.metainfo.xml
    sources:
      - type: file
        path: io.github.habi_zabi.InsightPoster.metainfo.xml
