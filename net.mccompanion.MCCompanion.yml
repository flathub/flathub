app-id: net.mccompanion.MCCompanion
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: MCCompanion

finish-args:
  # Wayland + X11 display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # OpenGL
  - --device=dri
  # Network access (server pinger, wiki, Firebase)
  - --share=network
  # Allow connectivity_plus to communicate with NetworkManager via System D-Bus
  - --system-talk-name=org.freedesktop.NetworkManager
  # Grant access to host Documents folder
  - --filesystem=xdg-documents

modules:
  - name: zenity
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/zenity/4.0/zenity-4.0.1.tar.xz
        sha256: 0c2f537813b10f728470d9d05d6c95713db2512f9c95096e1e85b1a6739605e6
  - name: MCCompanion
    buildsystem: simple
    build-commands:
      # Install the pre-built Flutter bundle produced by 'flutter build linux --release'
      - install -Dm755 MCCompanion /app/bin/MCCompanion
      - cp -r lib /app/bin/lib
      - cp -r data /app/bin/data
      # Desktop entry
      - install -Dm644 net.mccompanion.MCCompanion.desktop /app/share/applications/net.mccompanion.MCCompanion.desktop
      # App icon (256×256 PNG)
      - install -Dm644 net.mccompanion.MCCompanion.png /app/share/icons/hicolor/256x256/apps/net.mccompanion.MCCompanion.png
      # AppStream metainfo
      - install -Dm644 net.mccompanion.MCCompanion.metainfo.xml /app/share/metainfo/net.mccompanion.MCCompanion.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/MCCORG/MCCompanion/releases/latest/download/MCCompanion-linux-x64.tar.gz
        sha256: cd68276538f40bf7c486774394362740e0e7ecbd8d7d1003f017ae993aba2a2b
        x-checker-data:
          type: json
          url: https://api.github.com/repos/MCCORG/MCCompanion/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "MCCompanion-linux-x64.tar.gz") | .browser_download_url
          is-main-source: true
      - type: file
        url: https://raw.githubusercontent.com/MCCORG/MCCompanion/main/flatpak/net.mccompanion.MCCompanion.metainfo.xml
        sha256: 95a4393d0296a7cda57fdf354e49de47e2efed3ae7c85e7a39129b09e073746e
        dest-filename: net.mccompanion.MCCompanion.metainfo.xml
        x-checker-data:
          type: json
          url: https://api.github.com/repos/MCCORG/MCCompanion/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://raw.githubusercontent.com/MCCORG/MCCompanion/" + .tag_name + "/flatpak/net.mccompanion.MCCompanion.metainfo.xml"'
      - type: file
