app-id: com.socode.CCalculator
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: ccalculator
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: ccalculator
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/Sacapuntas96/CCalculator.git
        branch: main
