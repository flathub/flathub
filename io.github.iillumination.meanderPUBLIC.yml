app-id: io.github.iillumination.meanderPUBLIC
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: meander
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network

modules:
  - name: meander
    buildsystem: simple
    build-commands:
      - chmod +x Meander-linux-x64.AppImage
      - ./Meander-linux-x64.AppImage --appimage-extract
      - mkdir -p /app/bin /app/meander
      - cp -r squashfs-root/* /app/meander/
      - ln -s /app/meander/AppRun /app/bin/meander
      - install -Dm644 io.github.iillumination.meanderPUBLIC.desktop -t /app/share/applications/
      - install -Dm644 io.github.iillumination.meanderPUBLIC.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 icon_512.png /app/share/icons/hicolor/512x512/apps/io.github.iillumination.meanderPUBLIC.png
    sources:
      - type: file
        url: https://github.com/IILLUMINATION/meanderPUBLIC/releases/download/v1.0.0/Meander-linux-x64.AppImage
        sha256: da75c1012f381d9eca5658ca483ddeffefc507b5f3d736ff7118892edf8a35b3
      - type: file
        url: https://raw.githubusercontent.com/IILLUMINATION/meanderPUBLIC/2b5c0ee40d81248a05e69e3375d6942a5b70f8b6/icon_512.png
        sha256: 78b026ddc5a7a1b0fe96a968cb1c1bf79f6455a55b626c9de4f0002618f1f0cb
      - type: file
        path: io.github.iillumination.meanderPUBLIC.desktop
      - type: file
        path: io.github.iillumination.meanderPUBLIC.metainfo.xml