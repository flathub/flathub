app-id: com.gens.launcher
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: gens-launcher

finish-args:
  # Affichage et Accélération Graphique
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri

  # Réseau pour le téléchargement du jeu, authentification Microsoft et serveurs
  - --share=network

  # Audio (OpenAL, PipeWire, PulseAudio)
  - --socket=pulseaudio

  # Intégration Discord Rich Presence
  - --filesystem=xdg-run/discord-ipc-0:ro

  # Dossiers de stockage des instances et compatibilité .minecraft
  - --filesystem=~/.minecraft:ro
  - --filesystem=xdg-data/GensLauncher:create
  - --filesystem=xdg-config/GensLauncher:create

  # Notifications système
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: gens-launcher
    buildsystem: simple
    build-commands:
      # Extraction du paquet debian officiel de release
      - ar -x gens-launcher.deb
      - tar -xf data.tar.xz
      - cp -r opt/GensLauncher/* /app/
      - mkdir -p /app/bin
      - ln -sf /app/gens-launcher /app/bin/gens-launcher
      - install -Dm644 com.gens.launcher.desktop /app/share/applications/com.gens.launcher.desktop
      - install -Dm644 com.gens.launcher.metainfo.xml /app/share/metainfo/com.gens.launcher.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/com.gens.launcher.png
    sources:
      - type: file
        url: https://github.com/WilliamBossard/Gens-Launcher/releases/download/v1.8.13/GensLauncher-1.8.13-amd64.deb
        sha256: a039c17f5e732d717cecb17607bd9cf64e61704e5ba56fad8f714081f2b0b799
        dest-filename: gens-launcher.deb
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/WilliamBossard/Gens-Launcher/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/WilliamBossard/Gens-Launcher/releases/download/v" + $version + "/GensLauncher-" + $version + "-amd64.deb"'

      - type: file
        path: com.gens.launcher.desktop

      - type: file
        path: com.gens.launcher.metainfo.xml

      - type: file
        url: https://raw.githubusercontent.com/WilliamBossard/Gens-Launcher/main/assets/icon-512.png
        sha256: 4885e0938a35b26a9dc1ac642462e1ca23d1e57de0d8b127738769d20498ab4a
        dest-filename: icon-512.png
