app-id: io.github.mrproject72.mini_eq_rr
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm21
command: mini-eq-rr
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --share=network
  - --device=dri
  - --filesystem=xdg-config/mini-eq
  - --filesystem=xdg-cache/mini-eq
  - --filesystem=xdg-run/pipewire-0:ro
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=io.github.mrproject72.mini_eq_rr
  - --env=PIPEWIRE_MODULE_DIR=/app/lib/pipewire-0.3:/usr/lib/x86_64-linux-gnu/pipewire-0.3:/usr/lib/aarch64-linux-gnu/pipewire-0.3:/usr/lib/pipewire-0.3
  - --env=SPA_PLUGIN_DIR=/app/lib/spa-0.2:/usr/lib/x86_64-linux-gnu/spa-0.2:/usr/lib/aarch64-linux-gnu/spa-0.2:/usr/lib/spa-0.2

cleanup:
  - /include
  - /etc/bash_completion.d
  - /lib/pkgconfig
  - /share/doc
  - /share/gtk-doc
  - /share/locale
  - /share/man
  - /share/pkgconfig
  - "*.a"
  - "*.la"

modules:
  - name: libebur128
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SHARED_LIBS=ON
      - -DENABLE_TESTS=OFF
      - -DENABLE_FUZZER=OFF
    sources:
      - type: git
        url: https://github.com/jiixyj/libebur128.git
        tag: v1.2.6
        commit: 67b33abe1558160ed76ada1322329b0e9e058b02

  - name: pipewire-filter-chain-module
    buildsystem: meson
    config-opts:
      - -Dauto_features=disabled
      - -Ddocs=disabled
      - -Dman=disabled
      - -Dexamples=disabled
      - -Dtests=disabled
      - -Dinstalled_tests=disabled
      - -Dgstreamer=disabled
      - -Dgstreamer-device-provider=disabled
      - -Dsession-managers=[]
      - -Dsystemd-system-service=disabled
      - -Dsystemd-user-service=disabled
      - -Dlibsystemd=disabled
      - -Dlogind=disabled
      - -Dpipewire-alsa=disabled
      - -Dpipewire-jack=disabled
      - -Dpipewire-v4l2=disabled
      - -Dselinux=disabled
      - -Dspa-plugins=enabled
      - -Daudioconvert=enabled
      - -Daudiomixer=disabled
      - -Dcontrol=disabled
      - -Dsupport=disabled
      - -Dalsa=disabled
      - -Dbluez5=disabled
      - -Djack=disabled
      - -Dv4l2=disabled
      - -Dlibcamera=disabled
      - -Dvulkan=disabled
      - -Dffmpeg=disabled
      - -Dudev=disabled
      - -Ddbus=disabled
      - -Dsdl2=disabled
      - -Dsndfile=disabled
      - -Dlibmysofa=disabled
      - -Dlibpulse=disabled
      - -Droc=disabled
      - -Davahi=disabled
      - -Draop=disabled
      - -Dreadline=disabled
      - -Decho-cancel-webrtc=disabled
      - -Dlibusb=disabled
      - -Dx11=disabled
      - -Dx11-xfixes=disabled
      - -Dlibcanberra=disabled
      - -Davb=disabled
      - -Dgsettings=disabled
      - -Dcompress-offload=disabled
      - -Dopus=disabled
      - -Dlibffado=disabled
      - -Dsnap=disabled
      - -Debur128=disabled
      - -Dfftw=disabled
      - -Dlv2=disabled
      - -Donnxruntime=disabled
      - -Daudiotestsrc=disabled
      - -Dvideoconvert=disabled
      - -Dvideotestsrc=disabled
      - -Dpw-cat=disabled
      - -Dpw-cat-ffmpeg=disabled
      - -Dlegacy-rtkit=false
      - -Drlimits-install=false
      - -Dflatpak=enabled
    make-args:
      - src/modules/libpipewire-module-filter-chain.so
      - spa/plugins/filter-graph/libspa-filter-graph.so
      - spa/plugins/filter-graph/libspa-filter-graph-plugin-builtin.so
    no-make-install: true
    build-commands:
      - install -Dm755 src/modules/libpipewire-module-filter-chain.so ${FLATPAK_DEST}/lib/pipewire-0.3/libpipewire-module-filter-chain.so
      - install -Dm755 spa/plugins/filter-graph/libspa-filter-graph.so ${FLATPAK_DEST}/lib/spa-0.2/filter-graph/libspa-filter-graph.so
      - install -Dm755 spa/plugins/filter-graph/libspa-filter-graph-plugin-builtin.so ${FLATPAK_DEST}/lib/spa-0.2/filter-graph/libspa-filter-graph-plugin-builtin.so
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/pipewire/pipewire.git
        tag: 1.6.9
        commit: 8fa27cabdc6c0c1350c69c026af5850ef0af1e26

  - name: mini-eq-rr
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm21/bin
      env:
        CARGO_HOME: /run/build/mini-eq-rr/cargo
        CARGO_NET_OFFLINE: "true"
        LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib
    build-commands:
      - mkdir -p .cargo && cp cargo/config .cargo/config.toml
      - cargo build --release --offline --frozen
      - install -Dm755 target/release/mini-eq-rr ${FLATPAK_DEST}/bin/mini-eq-rr
      - install -Dm644 assets/metainfo/io.github.mrproject72.mini_eq_rr.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dm644 assets/io.github.mrproject72.mini_eq_rr.desktop -t ${FLATPAK_DEST}/share/applications
      - (cd assets/icons && find . -type d | while read d; do mkdir -p ${FLATPAK_DEST}/share/icons/hicolor/$d; cp $d/apps/*.png ${FLATPAK_DEST}/share/icons/hicolor/$d/apps/ 2>/dev/null || true; done)
    sources:
      - type: dir
        path: .
      - cargo-sources.json
