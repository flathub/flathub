app-id: com.github.marcopcabrera.HifiDvdPro
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: hifi-dvd-pro

finish-args:
  - --socket=x11
  - --socket=wayland
  - --filesystem=home
  - --device=all

modules:
  - name: hifi-dvd-pro
    buildsystem: simple
    build-commands:
      - install -D hifi-dvd-pro /app/bin/hifi-dvd-pro
      - install -D com.github.marcopcabrera.HifiDvdPro.desktop /app/share/applications/com.github.marcopcabrera.HifiDvdPro.desktop
      - install -D com.github.marcopcabrera.HifiDvdPro.metainfo.xml /app/share/metainfo/com.github.marcopcabrera.HifiDvdPro.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/marcopcabrera/hifi-dvd-pro/archive/refs/tags/v1.0.0.tar.gz
        sha256: 049bb29559a95046c174a7350ac296172c338755fa48aa062af566e8ee6687c6
