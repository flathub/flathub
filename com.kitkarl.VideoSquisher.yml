app-id: com.kitkarl.VideoSquisher
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: videosquisher


finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
# double check the ffmpeg attribution stuff
modules:
  - name: videosquisher
    buildsystem: simple
    build-commands:
      - cp -r VideoSquisher /app/
      - chmod +x /app/VideoSquisher/VideoSquisher
      - chmod +x /app/VideoSquisher/_internal/bin/ffmpeg /app/VideoSquisher/_internal/bin/ffprobe
      - install -Dm755 videosquisher /app/bin/videosquisher
      - sed -i 's/\r$//' /app/bin/videosquisher
      - install -Dm644 com.kitkarl.VideoSquisher.desktop /app/share/applications/com.kitkarl.VideoSquisher.desktop
      - install -Dm644 com.kitkarl.VideoSquisher.metainfo.xml /app/share/metainfo/com.kitkarl.VideoSquisher.metainfo.xml
      - install -Dm644 com.kitkarl.VideoSquisher-64.png /app/share/icons/hicolor/64x64/apps/com.kitkarl.VideoSquisher.png
      - install -Dm644 com.kitkarl.VideoSquisher-128.png /app/share/icons/hicolor/128x128/apps/com.kitkarl.VideoSquisher.png
      - install -Dm644 com.kitkarl.VideoSquisher-256.png /app/share/icons/hicolor/256x256/apps/com.kitkarl.VideoSquisher.png
      - install -Dm644 com.kitkarl.VideoSquisher-512.png /app/share/icons/hicolor/512x512/apps/com.kitkarl.VideoSquisher.png
      - install -Dm644 LICENSE-THIRD-PARTY /app/share/licenses/com.kitkarl.VideoSquisher/LICENSE
    sources:
      - type: archive
      # try to figure out static URL for the future
        url: https://download.kitkarl.com/uploads/squisher/linux_flatpak/videosquisher-flatpak-2.6.18.tar.xz
        sha256: ba599b0eb085520cfda9db47bd65b02a13a2f762dc5e227d1ccdb55d535995e5
        strip-components: 0
      - type: file
        path: videosquisher
      - type: file
        path: com.kitkarl.VideoSquisher.desktop
      - type: file
        path: com.kitkarl.VideoSquisher.metainfo.xml
      - type: file
        path: icons/com.kitkarl.VideoSquisher-64.png
      - type: file
        path: icons/com.kitkarl.VideoSquisher-128.png
      - type: file
        path: icons/com.kitkarl.VideoSquisher-256.png
      - type: file
        path: icons/com.kitkarl.VideoSquisher-512.png
      - type: file
        path: LICENSE-THIRD-PARTY
