app-id: com.ktechpit.omnidict
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: omnidict
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - /share/doc

modules:
  - name: omnidict
    buildsystem: cmake-ninja
    subdir: app
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DOMNIDICT_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/keshavbhatt/omnidict.git
        tag: v1.0.0
        commit: c4c84614f8cc5e52dd81e8ac5d98345c255f8fdb
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
