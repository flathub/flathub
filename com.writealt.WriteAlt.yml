id: com.writealt.WriteAlt
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: com.writealt.WriteAlt
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
separate-locales: false
tags:
  - proprietary
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
modules:
  - name: writealt
    buildsystem: simple
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 run-writealt.sh /app/bin/com.writealt.WriteAlt
      - install -Dm644 com.writealt.WriteAlt.desktop /app/share/applications/com.writealt.WriteAlt.desktop
      - install -Dm644 com.writealt.WriteAlt.metainfo.xml /app/share/metainfo/com.writealt.WriteAlt.metainfo.xml
      - install -Dm644 com.writealt.WriteAlt.png /app/share/icons/hicolor/512x512/apps/com.writealt.WriteAlt.png
    sources:
      - type: extra-data
        filename: WriteAlt.tar.gz
        url: https://github.com/salaheddinesalmi007/writealt/releases/download/v1.0.0/WriteAlt-1.0.0-linux-x64.tar.gz
        sha256: e39fbff3abe9c5e0b411e902f3f9aec669e5dc0ebaf7a663ecd8dabbdff827f7
        size: 142876561
        only-arches:
          - x86_64
      - type: extra-data
        filename: WriteAlt.tar.gz
        url: https://github.com/salaheddinesalmi007/writealt/releases/download/v1.0.0/WriteAlt-1.0.0-linux-arm64.tar.gz
        sha256: 22583714d9561ebff691a977cb7d019b05a98944dbef20d3dd9ced712032b71e
        size: 145587517
        only-arches:
          - aarch64
      - type: script
        dest-filename: apply_extra
        commands:
          - tar -xzf WriteAlt.tar.gz --strip-components=1
          - rm WriteAlt.tar.gz
          - chmod 0755 writealt chrome-sandbox chrome_crashpad_handler
      - type: file
        path: run-writealt.sh
      - type: file
        path: com.writealt.WriteAlt.desktop
      - type: file
        path: com.writealt.WriteAlt.metainfo.xml
      - type: file
        path: com.writealt.WriteAlt.png
