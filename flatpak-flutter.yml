id: com.invoiceninja.admin
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
command: admin
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.secrets
modules:
  - name: admin
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm22/bin:/run/build/admin/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      env:
        PUB_CACHE: /run/build/admin/.pub-cache
    build-commands:
      - FLUTTER=flutter tools/prepare_foss.sh --offline
      - flutter build linux --release --no-pub
      - cp -r $BUNDLE_PATH /app/com.invoiceninja.admin
      - mkdir -p /app/bin && ln -s /app/com.invoiceninja.admin/admin /app/bin/admin
      - install -Dm644 appimage/com.invoiceninja.admin.desktop -t /app/share/applications/
      - install -Dm644 appimage/com.invoiceninja.admin.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 snap/gui/invoiceninja.png /app/share/icons/hicolor/512x512/apps/com.invoiceninja.admin.png
    sources:
      - type: git
        url: https://github.com/invoiceninja/flutter.git
        tag: v5.1.23-flathub
        commit: 067d7a3727b4f1388551caf51b5b2e74d5b862dd
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.47.7
        dest: flutter
