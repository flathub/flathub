# Input manifest for flatpak-flutter — NOT the manifest Flathub builds.
#
# flatpak-flutter reads this, runs one observed build, and writes the real
# manifest next to it as com.ahmadre.hinata.yml together with generated/, which
# pins the Flutter SDK, every pub package, every crate and the patches that make
# the build work offline. Regenerate rather than hand-editing the output:
#
#   flatpak-flutter flatpak-flutter.yml
#
# Why a source build at all, when packaging/linux/flatpak/ in the app repo
# already produces a working Flatpak from a prebuilt bundle: Flathub requires
# source-available submissions to be built entirely from source, and Hinata is
# GPL-3.0. The prebuilt manifest stays as the local and AppImage recipe.
id: com.ahmadre.hinata

# 25.08 is the current stable Freedesktop runtime — published every August with
# a two-year support window, so supported until Aug 2027. It also carries almost
# everything this app shells out to: gtk3, zenity, gstreamer (base/good/bad/
# ugly/libav), libsecret and ffmpeg are all part of the platform image, which is
# why the module list below is short.
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
# Flutter's Linux toolchain builds with clang, which the base SDK does not ship.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: hinata

finish-args:
  # Wayland first, X11 only when there is no Wayland compositor. Deliberately
  # NOT `--socket=x11` alongside `--socket=wayland`: that grants X11 access even
  # on a Wayland session, which is a sandbox hole rather than a fallback.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 fallback needs it, and it is what lets the toolkit share memory with the
  # compositor instead of copying every frame.
  - --share=ipc
  # Impeller renders through OpenGL; without a GPU device this is llvmpipe.
  - --device=dri
  # The whole app is a client for a server the user names. Nothing works without
  # it, and there is no fixed host to narrow it to — Hinata is self-hosted.
  - --share=network
  # Voice comments: recording shells out to parecord (see the module below) and
  # playback goes through GStreamer, both of which talk to PulseAudio.
  - --socket=pulseaudio
  # flutter_secure_storage_linux keeps the session tokens in the Secret Service.
  # Lower-case name: the capital-S org.freedesktop.Secrets is a different, older
  # name and the linter rejects it.
  - --talk-name=org.freedesktop.secrets
  # Attachments. file_picker has no portal path on Linux: its Linux
  # implementation is pure Dart and shells out to zenity/qarma/kdialog, which
  # run INSIDE the sandbox and therefore only see the sandbox's filesystem. The
  # user's document folders, and deliberately not `home:ro` — read access to the
  # whole home is read access to ~/.ssh, ~/.gnupg and every browser profile,
  # none of which is ever an attachment.
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-desktop:ro
  # The one thing the app writes: share_plus throws UnimplementedError for files
  # on Linux, so a download goes straight into the XDG Downloads directory.
  - --filesystem=xdg-download:create

modules:
  # record_linux records by piping `parecord` into `ffmpeg`, and calls `pactl`
  # to enumerate input devices. ffmpeg IS part of the Freedesktop platform; the
  # PulseAudio *tools* are not — the runtime's libpulse element builds with
  # -Ddaemon=false and ships only the libraries. Without this module the mic
  # button opens, fails to spawn parecord, and records nothing.
  - name: pulseaudio-utils
    buildsystem: meson
    config-opts:
      - -Ddaemon=false
      - -Ddoxygen=false
      - -Dman=false
      - -Dtests=false
      - -Dgsettings=disabled
      - -Dglib=disabled
      - -Dgtk=disabled
      - -Dx11=disabled
      - -Ddbus=disabled
      - -Dalsa=disabled
      - -Djack=disabled
      - -Dbluez5=disabled
      - -Davahi=disabled
      - -Dasyncns=disabled
      - -Dopenssl=disabled
      - -Dsystemd=disabled
      - -Dudev=disabled
      - -Delogind=disabled
      - -Dgstreamer=disabled
      - -Dfftw=disabled
      - -Dorc=disabled
      - -Dsoxr=disabled
      - -Dspeex=disabled
      - -Dsamplerate=disabled
      - -Dwebrtc-aec=disabled
      - -Dlirc=disabled
      - -Dvalgrind=disabled
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake
      - /share/bash-completion
      - /share/zsh
      - '*.la'
    sources:
      - type: archive
        url: https://freedesktop.org/software/pulseaudio/releases/pulseaudio-17.0.tar.xz
        sha256: 053794d6671a3e397d849e478a80b82a63cb9d8ca296bd35b73317bb5ceb87b5

  - name: hinata
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm20/bin:/run/build/hinata/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        PUB_CACHE: /run/build/hinata/.pub-cache
    build-commands:
      # --no-pub because the offline pub cache is already in place: the pinned
      # sources are unpacked into $PUB_CACHE and setup-flutter.sh has run
      # `flutter pub get --offline` before this point.
      - flutter build linux --release --no-pub
      # The Flutter runner locates data/flutter_assets and lib/ relative to the
      # resolved path of its own executable, so the bundle stays together as one
      # directory and /app/bin/hinata is a symlink into it: ld.so expands $ORIGIN
      # after resolving symlinks, so the plugins' RPATH still points at the
      # bundle's lib/.
      - cp -r $BUNDLE_PATH /app/com.ahmadre.hinata
      - mkdir -p /app/bin && ln -s /app/com.ahmadre.hinata/hinata /app/bin/hinata
      # One desktop entry, one icon, one metainfo file — the same three the
      # AppImage recipe installs, from the app's own tree.
      - install -Dm644 packaging/linux/com.ahmadre.hinata.desktop
        /app/share/applications/com.ahmadre.hinata.desktop
      - install -Dm644 packaging/linux/com.ahmadre.hinata.metainfo.xml
        /app/share/metainfo/com.ahmadre.hinata.metainfo.xml
      - install -Dm644 packaging/linux/icons/hicolor/512x512/apps/com.ahmadre.hinata.png
        /app/share/icons/hicolor/512x512/apps/com.ahmadre.hinata.png
    sources:
      - type: git
        url: https://github.com/hinata-platform/hinata-app.git
        commit: c63a9405798c5af350a57d97943ed12a7eff6ef3
      # Pinned to the SDK the app is developed and released against — the same
      # version CI builds with. flatpak-flutter replaces this source with a
      # generated module that carries the engine artefacts as declared sources,
      # because the SDK downloads them on first use and the build has no network.
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.47.0
        dest: flutter
