id: org.selfprivacy.selfprivacy
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: selfprivacy
finish-args:
  - "--share=network"
  - "--share=ipc"
  - "--socket=fallback-x11"
  - "--socket=wayland"
  - "--own-name=org.selfprivacy.selfprivacy"
  - "--device=dri"
  - "--talk-name=org.freedesktop.secrets"
  - "--talk-name=org.freedesktop.portal.*"
  - "--filesystem=xdg-documents"
  - "--filesystem=xdg-download"
modules:
  - name: libsecret
    buildsystem: meson
    config-opts:
      - "-Dvapi=false"
      - "-Dgtk_doc=false"
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/libsecret
        tag: 0.21.7
  - name: libjsoncpp
    buildsystem: meson
    config-opts:
      - "--buildtype=release"
      - "--default-library=shared"
    sources:
      - type: git
        url: https://github.com/open-source-parsers/jsoncpp
        tag: 1.9.8
  - name: selfprivacy
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm20/bin:/run/build/app/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        PUB_CACHE: /run/build/app/.pub-cache
    build-commands:
      - flutter build linux --release --no-pub
      - cp -r $BUNDLE_PATH /app/org.selfprivacy.selfprivacy
      - mkdir -p /app/bin
      - ln -s /app/org.selfprivacy.selfprivacy/selfprivacy /app/bin/selfprivacy
      - install -Dm644 assets/images/icon/logo.svg /app/share/icons/hicolor/scalable/apps/org.selfprivacy.selfprivacy.svg
      - install -Dm644 assets/images/icon/logo_android.png /app/share/icons/hicolor/512x512/apps/org.selfprivacy.selfprivacy.png
      - install -Dm644 selfprivacy.desktop /app/share/applications/org.selfprivacy.selfprivacy.desktop
      - sed -i 's/Icon=selfprivacy/Icon=org\.selfprivacy\.selfprivacy/g' /app/share/applications/org.selfprivacy.selfprivacy.desktop
      - install -Dm644 selfprivacy.metainfo.xml /app/share/metainfo/org.selfprivacy.selfprivacy.metainfo.xml
      - sed -i 's/<id>selfprivacy<\/id>/<id>org\.selfprivacy\.selfprivacy<\/id>/g' /app/share/metainfo/org.selfprivacy.selfprivacy.metainfo.xml
      - sed -i 's/selfprivacy\.desktop/org\.selfprivacy\.selfprivacy\.desktop/g' /app/share/metainfo/org.selfprivacy.selfprivacy.metainfo.xml
    sources:
      - type: git
        url: https://git.selfprivacy.org/SelfPrivacy/selfprivacy.org.app.git
        tag: 0.13.7
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.35.7
        dest: flutter
