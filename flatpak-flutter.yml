# Input manifest for flatpak-flutter (https://github.com/TheAppgineer/flatpak-flutter).
# Running `flatpak-flutter.py --app-module flet-client --app-pubspec client/pubspec.yaml
# flatpak-flutter.yml` pre-processes this into the offline submission manifest
# (io.github.recol.dlss_updater.yml + pubspec-sources.json + flutter SDK module),
# in which the flet client is built from source on Flathub's sandboxed builders.
#
# Kept separate from the dev manifest: build_flathub.sh builds the client on the
# host for fast iteration; this file is the submission path.
id: io.github.recol.dlss_updater
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
# clang for the Flutter client build (the base SDK ships no clang)
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: dlss-updater
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network
  # Game libraries live anywhere the user put them; the app scans and
  # patches DLLs inside them. home:rw needs a linter exception at review
  # (finish-args-home-filesystem-access) - it also covers the app's own
  # config/cache dirs, which is why they aren't listed separately.
  - --filesystem=home:rw
  - --filesystem=/mnt:rw
  - --filesystem=/media:rw
  - --filesystem=/run/media:rw
  - --filesystem=~/.local/share/dlss-updater:create
  - --env=LD_LIBRARY_PATH=/app/lib64:/app/lib
  - --env=PYTHON_GIL=0
modules:
  - modules/cpython.json

  - generated/python-deps.json

  # flet's Flutter client, built from source, trimmed to core (see
  # patches/flet-client-trim.patch and trim_flet_client.py for the why).
  # The patch also rewrites client/pubspec.lock so the offline pub
  # resolution matches the trimmed dependency set.
  - name: flet-client
    buildsystem: simple
    build-options:
      # The generated flutter-sdk module installs the SDK (and its
      # setup-flutter.sh helper) into /var/lib/flutter; clang comes from
      # the llvm20 SDK extension. The offline pub sources extract into the
      # module build dir's .pub-cache.
      append-path: /usr/lib/sdk/llvm20/bin:/var/lib/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        PUB_CACHE: /run/build/flet-client/.pub-cache
    build-commands:
      - cd client && flutter build linux --release --no-pub
      - mkdir -p /app/share/flet-client
      - cp -r client/build/linux/x64/release/bundle/* /app/share/flet-client/
    sources:
      - type: git
        url: https://github.com/flet-dev/flet.git
        tag: v0.85.3
      - type: patch
        path: patches/flet-client-trim.patch
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.44.6
        dest: flutter

  - name: dlss-updater
    buildsystem: simple
    build-commands:
      - |
        SITE=$(/app/bin/python3.14t -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
        cp -r dlss_updater "$SITE/"
      - mkdir -p /app/share/dlss-updater
      - cp main.py /app/share/dlss-updater/main.py
      - install -Dm755 launcher.sh /app/bin/dlss-updater
      - |
        mkdir -p /app/share/metainfo
        sed 's/io\.github\.recol\.dlss-updater/io.github.recol.dlss_updater/g' \
            io.github.recol.dlss-updater.appdata.xml \
            > /app/share/metainfo/io.github.recol.dlss_updater.metainfo.xml
      - |
        sed -e 's/\r$//' -e 's/io\.github\.recol\.dlss-updater/io.github.recol.dlss_updater/g' \
            flatpak/io.github.recol.dlss-updater.desktop > /tmp/desktop.tmp
        install -Dm644 /tmp/desktop.tmp /app/share/applications/io.github.recol.dlss_updater.desktop
      - install -Dm644 appimagex_png.png /app/share/icons/hicolor/256x256/apps/io.github.recol.dlss_updater.png
    sources:
      # Pinned to the V4.3.1 version commit (release-then-commit convention:
      # the tag itself predates the Flathub groundwork, the commit carries it).
      - type: git
        url: https://github.com/Recol/DLSS-Updater.git
        commit: 9917f9978cd983ea827c4433bffe77b2ac0193e8
      - type: file
        path: launcher.sh
