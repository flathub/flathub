id: io.github.ismailhosenismailjames.al_quran_v3
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: al_quran_v3

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.GeoClue2
  - --env=LD_LIBRARY_PATH=/app/lib

modules:
  - name: libass
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz
        sha256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959

  - name: libplacebo
    buildsystem: meson
    build-options:
      env:
        PYTHONPATH: /run/build/libplacebo/_pydeps/markupsafe/src:/run/build/libplacebo/_pydeps/jinja2/src
    config-opts:
      - -Dtests=false
      - -Ddemos=false
      - -Dopengl=disabled
      - -Dvulkan=disabled
    sources:
      - type: archive
        url: https://code.videolan.org/videolan/libplacebo/-/archive/v7.349.0/libplacebo-v7.349.0.tar.gz
        sha256: 79120e685a1836344b51b13b6a5661622486a84e4d4a35f6c8d01679a20fbc86
      - type: archive
        url: https://files.pythonhosted.org/packages/38/9b/e422a865e1d5d57d0e509b4e0bf1c1a70a7f6382c29a5aa428df994c8bc8/markupsafe-3.0.4.tar.gz
        sha256: 2e9ad7dd851bf45fab9f75cbff4cb493fee9979e8d8c7c9c3ee119022518edd6
        dest: _pydeps/markupsafe
      - type: archive
        url: https://files.pythonhosted.org/packages/df/bf/f7da0350254c0ed7c72f3e33cef02e048281fec7ecec5f032d4aac52226b/jinja2-3.1.6.tar.gz
        sha256: 0137fb05990d35f1275a587e9aee6d56da821fc83491a0fb838183be43f66d6d
        dest: _pydeps/jinja2

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dtests=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dmanpage-build=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.39.0.tar.gz
        sha256: 2ca92437affb62c2b559b4419ea4785c70d023590500e8a52e95ea3ab4554683

  - name: al_quran_v3
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm20/bin:/run/build/al_quran_v3/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        PUB_CACHE: /run/build/al_quran_v3/.pub-cache
    build-commands:
      - flutter build linux --release --no-pub
      - cp -r $BUNDLE_PATH /app/io.github.ismailhosenismailjames.al_quran_v3
      - mkdir -p /app/bin
      - ln -s /app/io.github.ismailhosenismailjames.al_quran_v3/al_quran_v3 /app/bin/al_quran_v3
      - install -Dm644 linux/packaging/flatpak/io.github.ismailhosenismailjames.al_quran_v3.desktop /app/share/applications/io.github.ismailhosenismailjames.al_quran_v3.desktop
      - install -Dm644 linux/packaging/flatpak/io.github.ismailhosenismailjames.al_quran_v3.metainfo.xml /app/share/metainfo/io.github.ismailhosenismailjames.al_quran_v3.metainfo.xml
      - install -Dm644 assets/img/Quran_Logo_v3.png /app/share/icons/hicolor/512x512/apps/io.github.ismailhosenismailjames.al_quran_v3.png
    sources:
      - type: git
        url: https://github.com/IsmailHosenIsmailJames/al_quran_v3.git
        tag: v4.4.2
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.50.1
        dest: flutter
