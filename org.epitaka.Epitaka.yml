# ePitaka — Flathub submission manifest
# Upstream: https://github.com/dhammanana/epitaka_app
#
# This manifest is what Flathub's build farm compiles — Flathub does NOT
# accept prebuilt binaries. It builds the app from the git source below,
# so every new tag can be published automatically (see README.md).
#
# Pattern: org.freedesktop runtime + llvm sdk-extension + Flutter SDK
# module (the proven setup used by Flutter apps already on Flathub, e.g.
# flathub/app.towdow.TowDow). Generated code (.g.dart) is committed in
# the upstream repo, so no build_runner step is needed.

id: org.epitaka.Epitaka
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: epitaka

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network            # runtime translation/AI downloads
  - --socket=pulseaudio        # TTS + audio playback
  - --talk-name=org.freedesktop.Speech   # flutter_tts (speech-dispatcher)
  # audio_service MPRIS integration — only enable if the media controls
  # are actually used and needed inside the sandbox:
  # - --talk-name=org.mpris.MediaPlayer2.*

modules:
  # ------------------------------------------------------------
  # Flutter SDK (pinned to current stable 3.44.9, Dart 3.12.2 —
  # matches pubspec `sdk: ^3.12.2`). Bump this module when Flutter
  # releases newer stables; refresh the sha256 from
  # https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json
  # ------------------------------------------------------------
  - name: flutter-sdk
    buildsystem: simple
    build-commands:
      - mkdir -p /var/lib
      - cp -r flutter /var/lib
    sources:
      - type: archive
        url: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.9-stable.tar.xz
        sha256: a9120fa4a01048bdef438ddc3a2d4b7389662ea98a95db86eeaf10382bc4efcb

  # ------------------------------------------------------------
  # ePitaka itself
  # ------------------------------------------------------------
  - name: epitaka
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm20/bin:/var/lib/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        PUB_CACHE: /run/build/epitaka/.pub-cache
    build-commands:
      # The linux/ platform folder is generated by CI, not committed
      # (see .github/workflows/build_app.yml) — mirror that here.
      - bash -c '[ -d linux ] || flutter create --platforms=linux .'
      # Download the core DBs (epitaka, dpd-dictionary) from the URLs in
      # the checked-in translations manifest into assets/db, exactly like
      # the CI workflow does. Network is available during the build.
      - bash fetch-core-dbs.sh
      - flutter pub get
      - flutter build linux --release
      - install -Dm755 $BUNDLE_PATH/epitaka /app/bin/epitaka
      - cp -r $BUNDLE_PATH/lib /app/bin/lib
      - cp -r $BUNDLE_PATH/data /app/bin/data
      - install -Dm644 org.epitaka.Epitaka.desktop /app/share/applications/org.epitaka.Epitaka.desktop
      - install -Dm644 org.epitaka.Epitaka.metainfo.xml /app/share/metainfo/org.epitaka.Epitaka.metainfo.xml
      - install -Dm644 assets/icon.png /app/share/icons/hicolor/512x512/apps/org.epitaka.Epitaka.png
      - install -Dm644 LICENSE /app/share/licenses/org.epitaka.Epitaka/LICENSE
    sources:
      # Pinned tag + commit of the release to build. The external data
      # checker (runs on all flathub repos every ~2 h) reads the
      # x-checker-data below and opens an update PR automatically when a
      # newer v* tag is pushed upstream — merge it and the new version
      # gets built and published by Flathub. No CI changes needed.
      - type: git
        url: https://github.com/dhammanana/epitaka_app
        tag: v1.0.16
        commit: c8d3144ec97c33794657090d83d2ecd170d1d9da
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      # The three files below live in this flathub/ directory and are
      # committed to the flathub repo together with this manifest.
      - type: file
        path: org.epitaka.Epitaka.desktop
      - type: file
        path: org.epitaka.Epitaka.metainfo.xml
      - type: file
        path: fetch-core-dbs.sh
