# Fun Racer on Flathub. The game is a Godot 4.7 project: the Flathub Godot BaseApp (branch 4.7,
# Godot 4.7.2 export template built from source) runs the game's .pck, installed as
# /app/bin/godot-runner.pck so godot-runner loads it without arguments.
# The .pck is attached to the GitHub release (tools/release/build_linux.sh makes it).
id: io.github.YannickDurindel.FunRacer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.godotengine.godot.BaseApp
base-version: '4.7'
command: godot-runner

finish-args:
  # Windowing: native Wayland, X11 where there is no Wayland.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU (Vulkan) plus gamepads and wheels (/dev/input). --device=input would be narrower but
  # needs Flatpak >= 1.15.6, which older LTS distributions do not have.
  - --device=all
  - --socket=pulseaudio
  # Phone as a controller: the game serves a page and a WebSocket on the local network
  # (off until the player turns it on in Options -> Controls).
  - --share=network

modules:
  - name: fun-racer
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/YannickDurindel/FunRacer/releases/download/v0.1.0/fun-racer-0.1.0.pck
        sha256: 97f40b0ccfc67b7b1e321b40af7894d83b6d64a0196d634d6b8ffa738e91a088
        dest-filename: fun-racer.pck
      - type: file
        path: io.github.YannickDurindel.FunRacer.desktop
      - type: file
        path: io.github.YannickDurindel.FunRacer.metainfo.xml
      - type: file
        path: io.github.YannickDurindel.FunRacer.png
      # Licence texts, from the release tag (the game's MIT licence, the asset and data
      # credits, the font's OFL).
      - type: file
        url: https://raw.githubusercontent.com/YannickDurindel/FunRacer/v0.1.0/LICENSE
        sha256: cd057e5185edaf4c0b150ce442f81716ef6b6fcea14f948cfcf7c68d8ea745d4
      - type: file
        url: https://raw.githubusercontent.com/YannickDurindel/FunRacer/v0.1.0/CREDITS.md
        sha256: f46e122213d6f0aba0198602a2dd54af38517ce4d97f0aa0486f02ab46bf1321
      - type: file
        url: https://raw.githubusercontent.com/YannickDurindel/FunRacer/v0.1.0/assets/ui/fonts/OFL.txt
        sha256: 186d750eb496a4c17a76385f82be6aea2ac1cf2de074a811d63786cf374ea73f
    build-commands:
      - install -Dm644 fun-racer.pck ${FLATPAK_DEST}/bin/godot-runner.pck
      - install -Dm644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 ${FLATPAK_ID}.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID} LICENSE CREDITS.md
      - install -Dm644 OFL.txt ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/OFL-BarlowCondensed.txt
