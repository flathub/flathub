app-id: net.huangyuhui.hmcl
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: hmcl

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --env=_JAVA_AWT_WM_NONREPARENTING=1

cleanup:
  - /jre/man
  - "*.la"
  - "*.a"

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh
      - mkdir -p "$FLATPAK_DEST/share/licenses/$FLATPAK_ID/openjdk"
      - cp -a /usr/lib/sdk/openjdk21/jvm/openjdk-21/legal/. "$FLATPAK_DEST/share/licenses/$FLATPAK_ID/openjdk/"

  - name: openjfx
    buildsystem: simple
    build-commands:
      - mkdir -p /app/openjfx
      - cp -r lib /app/openjfx/lib
      - mkdir -p "$FLATPAK_DEST/share/licenses/$FLATPAK_ID/openjfx"
      - cp -a legal/. "$FLATPAK_DEST/share/licenses/$FLATPAK_ID/openjfx/"
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://download2.gluonhq.com/openjfx/21.0.11/openjfx-21.0.11_linux-x64_bin-sdk.zip
        sha256: 9a69b4074f22bdb051ca0ae8e9794750621ef815c7657ccc51f89ba81ef2b624
        x-checker-data:
          type: html
          url: https://gluonhq.com/products/javafx/openjfx-21-release-notes/
          version-pattern: Release Notes for JavaFX (21\.[0-9.]+)
          url-template: https://download2.gluonhq.com/openjfx/$version/openjfx-${version}_linux-x64_bin-sdk.zip
      - type: archive
        only-arches:
          - aarch64
        url: https://download2.gluonhq.com/openjfx/21.0.11/openjfx-21.0.11_linux-aarch64_bin-sdk.zip
        sha256: 830d08c92eb5974463092f781ae0c62f6e01394cc42828ed7902c6d074c0757e
        x-checker-data:
          type: html
          url: https://gluonhq.com/products/javafx/openjfx-21-release-notes/
          version-pattern: Release Notes for JavaFX (21\.[0-9.]+)
          url-template: https://download2.gluonhq.com/openjfx/$version/openjfx-${version}_linux-aarch64_bin-sdk.zip

  - name: hmcl
    buildsystem: simple
    license-files:
      - LICENSE
    build-commands:
      - install -Dm644 HMCL.jar /app/lib/hmcl/hmcl.jar
      - install -Dm755 hmcl /app/bin/hmcl
      - install -Dm644 net.huangyuhui.hmcl.desktop /app/share/applications/net.huangyuhui.hmcl.desktop
      - install -Dm644 net.huangyuhui.hmcl.metainfo.xml /app/share/metainfo/net.huangyuhui.hmcl.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/net.huangyuhui.hmcl.png
    sources:
      - type: file
        url: https://github.com/HMCL-dev/HMCL/releases/download/v3.13.2/HMCL-3.13.2.jar
        sha256: d8e2ed7f8edf98d88414e9231e20c28fdf6c7a2332db93e59910d214abbd5852
        dest-filename: HMCL.jar
        x-checker-data:
          type: json
          url: https://api.github.com/repos/HMCL-dev/HMCL/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("^HMCL-[0-9.]+\\.jar$")) | .browser_download_url
      - type: file
        url: https://raw.githubusercontent.com/HMCL-dev/HMCL/c9b1cfec5a7632d73502f81e2fba76d1179ff7cd/HMCL/src/main/resources/assets/img/icon@8x.png
        sha256: d4e56ae2e8c0d991dba01ef3124ef4d38918825f58728338a8bab5e78319306a
        dest-filename: icon.png
      - type: file
        url: https://raw.githubusercontent.com/HMCL-dev/HMCL/7820f748a0238d64f54ee2ceeec26c01f286e8d0/LICENSE
        sha256: 3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986
        dest-filename: LICENSE
      - type: file
        path: hmcl
      - type: file
        path: net.huangyuhui.hmcl.desktop
      - type: file
        path: net.huangyuhui.hmcl.metainfo.xml
