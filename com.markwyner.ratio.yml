app-id: com.markwyner.ratio
runtime: org.gnome.Platform
runtime-version: '50' # make sure gnome runtime version is current when I build
sdk: org.gnome.Sdk
command: ratio

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: ratio
    buildsystem: simple
    build-commands:
      - install -Dm755 ratio-launcher /app/bin/ratio
      - mkdir -p /app/share/ratio
      - cp -r ratio.py window.py contrast.py ui fonts icons /app/share/ratio/
      - install -Dm644 com.markwyner.ratio.desktop /app/share/applications/com.markwyner.ratio.desktop
      - install -Dm644 com.markwyner.ratio.metainfo.xml /app/share/metainfo/com.markwyner.ratio.metainfo.xml
      - mkdir -p /app/share/icons
      - cp -r icons/hicolor /app/share/icons/
    sources:
      - type: git
        url: https://codeberg.org/markwyner/ratio-for-linux.git
        tag: v1.0.1
        commit: 2235c462853454f4ba2ff092ff0a80b188990573
      - type: file
        path: com.markwyner.ratio.desktop
      - type: file
        path: com.markwyner.ratio.metainfo.xml
      - type: file
        path: ratio-launcher
