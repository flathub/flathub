app-id: com.markwyner.ratio
runtime: org.gnome.Platform
runtime-version: '50' # make sure gnome runtime version is current when I build
sdk: org.gnome.Sdk
command: ratio

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: ratio
    buildsystem: simple
    build-commands:
      - install -Dm755 flatpak/ratio-launcher /app/bin/ratio
      - mkdir -p /app/share/ratio
      - cp -r ratio.py window.py contrast.py ui fonts icons /app/share/ratio/
      - install -Dm644 flatpak/com.markwyner.ratio.desktop /app/share/applications/com.markwyner.ratio.desktop
      - install -Dm644 flatpak/com.markwyner.ratio.metainfo.xml /app/share/metainfo/com.markwyner.ratio.metainfo.xml
      - mkdir -p /app/share/icons
      - cp -r icons/hicolor /app/share/icons/
    sources:
      - type: git
        url: https://codeberg.org/markwyner/ratio-for-linux.git
        tag: v1.0.2
        commit: a971835684c31f7895a5586a87860434b256a6df
