app-id: io.github.HimanshuSharma_prog.weather_for_cosmic
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: weather_for_cosmic

finish-args:
  # Wayland display protocol
  - --socket=wayland
  # Fallback X11 display protocol
  - --socket=fallback-x11
  # Shared memory / IPC
  - --share=ipc
  # Hardware accelerated rendering
  - --device=dri
  # Network access for fetching weather telemetry and map tiles
  - --share=network
  # Persist COSMIC application configuration
  - --filesystem=xdg-config/cosmic:create

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/weather_for_cosmic/cargo
    RUST_BACKTRACE: '1'

modules:
  - name: weather_for_cosmic
    buildsystem: simple
    build-commands:
      # Build offline using pre-downloaded crates from cargo-sources.json
      - cargo build --release --offline --locked
      # Install binary
      - install -Dm0755 target/release/weather_for_cosmic /app/bin/weather_for_cosmic
      # Install desktop entry
      - install -Dm0644 target/xdgen/app.desktop /app/share/applications/io.github.HimanshuSharma_prog.weather_for_cosmic.desktop
      # Install AppStream metadata
      - install -Dm0644 target/xdgen/app.metainfo.xml /app/share/metainfo/io.github.HimanshuSharma_prog.weather_for_cosmic.metainfo.xml
      # Install multi-resolution icons
      - install -Dm0644 resources/icons/hicolor/scalable/apps/icon.svg /app/share/icons/hicolor/scalable/apps/io.github.HimanshuSharma_prog.weather_for_cosmic.svg
      - install -Dm0644 resources/icons/hicolor/512x512/apps/icon.png /app/share/icons/hicolor/512x512/apps/io.github.HimanshuSharma_prog.weather_for_cosmic.png
      - install -Dm0644 resources/icons/hicolor/256x256/apps/icon.png /app/share/icons/hicolor/256x256/apps/io.github.HimanshuSharma_prog.weather_for_cosmic.png
      - install -Dm0644 resources/icons/hicolor/128x128/apps/icon.png /app/share/icons/hicolor/128x128/apps/io.github.HimanshuSharma_prog.weather_for_cosmic.png
      - install -Dm0644 resources/icons/hicolor/64x64/apps/icon.png /app/share/icons/hicolor/64x64/apps/io.github.HimanshuSharma_prog.weather_for_cosmic.png
      - install -Dm0644 resources/icons/hicolor/48x48/apps/icon.png /app/share/icons/hicolor/48x48/apps/io.github.HimanshuSharma_prog.weather_for_cosmic.png
      - install -Dm0644 resources/icons/hicolor/32x32/apps/icon.png /app/share/icons/hicolor/32x32/apps/io.github.HimanshuSharma_prog.weather_for_cosmic.png
      - install -Dm0644 resources/icons/hicolor/24x24/apps/icon.png /app/share/icons/hicolor/24x24/apps/io.github.HimanshuSharma_prog.weather_for_cosmic.png
      - install -Dm0644 resources/icons/hicolor/16x16/apps/icon.png /app/share/icons/hicolor/16x16/apps/io.github.HimanshuSharma_prog.weather_for_cosmic.png
    sources:
      - type: git
        url: https://github.com/HimanshuSharma-prog/weather-forecast-for-cosmic.git
        tag: v0.1.0
      - cargo-sources.json
