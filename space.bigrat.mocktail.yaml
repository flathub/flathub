app-id: space.bigrat.mocktail
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: mocktail

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=com.feralinteractive.GameMode

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/cmake
  - /share/man
  - '*.a'
  - '*.la'

build-options:
  strip: true
  no-debuginfo: true

modules:
  - name: sdl3
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DSDL_SHARED=ON
      - -DSDL_STATIC=OFF
      - -DSDL_TESTS=OFF
      - -DSDL_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-3.4.10.tar.gz
        sha256: 12b34280415ec8418c864408b93d008a20a6530687ee613d60bfbd20411f2785

  - name: sdl3-ttf
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DSDLTTF_VENDORED=OFF
      - -DSDLTTF_SAMPLES=OFF
      - -DSDLTTF_PLUTOSVG=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_ttf/releases/download/release-3.2.2/SDL3_ttf-3.2.2.tar.gz
        sha256: 63547d58d0185c833213885b635a2c0548201cc8f301e6587c0be1a67e1e045d

  - name: nlohmann-json
    buildsystem: cmake-ninja
    config-opts:
      - -DJSON_BuildTests=OFF
    sources:
      - type: archive
        url: https://github.com/nlohmann/json/releases/download/v3.12.0/json.tar.xz
        sha256: 42f6e95cad6ec532fd372391373363b62a14af6d771056dbfc86160e6dfff7aa

  - name: utf8proc
    buildsystem: simple
    build-commands:
      - cmake -S . -B _build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app
        -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=ON -DUTF8PROC_ENABLE_TESTING=OFF
      - cmake --build _build -j${FLATPAK_BUILDER_N_JOBS}
      - cmake --install _build
    sources:
      - type: archive
        url: https://github.com/JuliaStrings/utf8proc/archive/refs/tags/v2.11.3.tar.gz
        sha256: abfed50b6d4da51345713661370290f4f4747263ee73dc90356299dfc7990c78

  - name: minizip
    buildsystem: simple
    build-commands:
      - cd contrib/minizip && autoreconf --force --install
      - cd contrib/minizip && ./configure --prefix=/app --disable-static --disable-demos
      - make -C contrib/minizip -j${FLATPAK_BUILDER_N_JOBS}
      - make -C contrib/minizip install
      - install -Dm644 contrib/minizip/ints.h /app/include/minizip/ints.h
    sources:
      - type: archive
        url: https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.xz
        sha256: d7a0654783a4da529d1bb793b7ad9c3318020af77667bcae35f95d0e42a792f3

  - name: capstone
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
      - -DCAPSTONE_BUILD_TESTS=OFF
      - -DCAPSTONE_BUILD_CSTOOL=OFF
      - -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF
      - -DCAPSTONE_X86_SUPPORT=ON
    sources:
      - type: archive
        url: https://github.com/capstone-engine/capstone/archive/refs/tags/5.0.9.tar.gz
        sha256: 0619da31af08152600af95c481527ef6d756c0a8404fca7544a4fdf6dfc2c0f9

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Ddefault_library=shared
      - -Dvulkan=enabled
      - -Dvk-proc-addr=enabled
      - -Dshaderc=enabled
      - -Dglslang=disabled
      - -Dopengl=disabled
      - -Dd3d11=disabled
      - -Dlcms=disabled
      - -Ddovi=disabled
      - -Dlibdovi=disabled
      - -Ddemos=false
      - -Dtests=false
      - -Dbench=false
      - -Dfuzz=false
      - -Dunwind=disabled
      - -Dxxhash=disabled
    sources:
      - type: archive
        url: https://github.com/haasn/libplacebo/archive/refs/tags/v7.360.1.tar.gz
        sha256: d05fdf90bea2f629eaa2d115e909fd356388ac639e54f77b87a018a6d76224bd

  - name: mocktail
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DMOCKTAIL_DEFAULT_COMPATIBILITY_MANIFEST=/app/share/mocktail/metadata/roblox_compatibility.json
      - -DMOCKTAIL_DEFAULT_SIGNING_TRUST_MANIFEST=/app/share/mocktail/metadata/roblox_signing_certificates.json
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://github.com/komaruworld/mocktail.git
        tag: 0.1.0
        commit: cb7d35de69293295d8a81609aba65fc075c91f2b
        x-checker-data:
          type: git
          is-main-source: true
