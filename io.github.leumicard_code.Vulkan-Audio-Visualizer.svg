<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- App icon squircle background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14182B"/>
      <stop offset="55%" stop-color="#0A0D18"/>
      <stop offset="100%" stop-color="#1A0B16"/>
    </linearGradient>

    <!-- Subtle top-edge inner sheen -->
    <linearGradient id="bevelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Ambient plasma glows -->
    <radialGradient id="crimsonGlow" cx="32%" cy="68%" r="55%">
      <stop offset="0%" stop-color="#FF2A5F" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#C81D4E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0A0D18" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="68%" cy="32%" r="52%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0A0D18" stop-opacity="0"/>
    </radialGradient>

    <!-- Spectrum equalizer bar gradient -->
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Foreground waveform gradient -->
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="35%" stop-color="#FB7185"/>
      <stop offset="52%" stop-color="#E0F2FE"/>
      <stop offset="72%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Outer shadow filter for wave neon glow -->
    <filter id="neonBlur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <clipPath id="squircleClip">
      <rect x="44" y="44" width="424" height="424" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <!-- Subtle drop shadow base -->
  <rect x="44" y="52" width="424" height="424" rx="96" ry="96" fill="#000000" fill-opacity="0.35"/>

  <!-- Main Icon Plate -->
  <g clip-path="url(#squircleClip)">
    <rect x="44" y="44" width="424" height="424" rx="96" ry="96" fill="url(#bgGrad)"/>
    <rect x="44" y="44" width="424" height="424" fill="url(#crimsonGlow)"/>
    <rect x="44" y="44" width="424" height="424" fill="url(#cyanGlow)"/>

    <!-- Subtle dark audio grid -->
    <g stroke="#94A3B8" stroke-opacity="0.06" stroke-width="2">
      <line x1="128" y1="44" x2="128" y2="468"/>
      <line x1="256" y1="44" x2="256" y2="468"/>
      <line x1="384" y1="44" x2="384" y2="468"/>
      <line x1="44" y1="150" x2="468" y2="150"/>
      <line x1="44" y1="256" x2="468" y2="256"/>
      <line x1="44" y1="362" x2="468" y2="362"/>
    </g>

    <!-- Background Starfield Particles -->
    <g>
      <circle cx="116" cy="112" r="4" fill="#38BDF8" fill-opacity="0.85"/>
      <circle cx="164" cy="90" r="2.5" fill="#F8FAFC" fill-opacity="0.7"/>
      <circle cx="348" cy="108" r="4.5" fill="#00E5FF" fill-opacity="0.9"/>
      <circle cx="404" cy="136" r="3" fill="#F472B6" fill-opacity="0.85"/>
      <circle cx="290" cy="130" r="2.5" fill="#FDE047" fill-opacity="0.8"/>
      <circle cx="102" cy="176" r="2.5" fill="#FB7185" fill-opacity="0.75"/>
      <circle cx="394" cy="296" r="3.5" fill="#38BDF8" fill-opacity="0.7"/>
      <circle cx="132" cy="396" r="3" fill="#F43F5E" fill-opacity="0.8"/>
      <circle cx="378" cy="404" r="2.5" fill="#67E8F9" fill-opacity="0.75"/>
    </g>

    <!-- Spectrum Equalizer Bars -->
    <g fill="url(#barGrad)" fill-opacity="0.72">
      <rect x="86"  y="296" width="22" height="128" rx="11"/>
      <rect x="122" y="246" width="22" height="178" rx="11"/>
      <rect x="158" y="198" width="22" height="226" rx="11"/>
      <rect x="194" y="262" width="22" height="162" rx="11"/>
      <rect x="230" y="314" width="22" height="110" rx="11"/>
      <rect x="266" y="248" width="22" height="176" rx="11"/>
      <rect x="302" y="176" width="22" height="248" rx="11"/>
      <rect x="338" y="218" width="22" height="206" rx="11"/>
      <rect x="374" y="274" width="22" height="150" rx="11"/>
      <rect x="410" y="318" width="22" height="106" rx="11"/>
    </g>

    <!-- Geometric Dual-Ring Audio Resonance -->
    <circle cx="256" cy="242" r="108" fill="none" stroke="url(#waveGrad)" stroke-opacity="0.24" stroke-width="5"/>
    <circle cx="256" cy="242" r="76" fill="none" stroke="#00E5FF" stroke-opacity="0.22" stroke-width="3" stroke-dasharray="16 12"/>

    <!-- Stylized 'V' Waveform Crest (Glow Layer) -->
    <path d="M 64 236 L 128 236 L 164 156 L 204 282 L 256 356 L 308 212 L 348 144 L 386 242 L 448 242"
          fill="none" stroke="url(#waveGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"
          stroke-opacity="0.65" filter="url(#neonBlur)"/>

    <!-- Stylized 'V' Waveform Crest (Crisp Core) -->
    <path d="M 64 236 L 128 236 L 164 156 L 204 282 L 256 356 L 308 212 L 348 144 L 386 242 L 448 242"
          fill="none" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- White Hot Center Highlight -->
    <path d="M 64 236 L 128 236 L 164 156 L 204 282 L 256 356 L 308 212 L 348 144 L 386 242 L 448 242"
          fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.88"/>
  </g>

  <!-- Crisp Squircle Border / Inner Bevel -->
  <rect x="46" y="46" width="420" height="420" rx="94" ry="94" fill="none" stroke="url(#bevelGrad)" stroke-width="4"/>
</svg>
