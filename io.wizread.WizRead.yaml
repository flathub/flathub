app-id: io.wizread.WizRead
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
separate-locales: false
command: wizread
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --share=ipc
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

modules:
  - name: wizread
    buildsystem: simple
    build-commands:
      - ar x wizread_*_amd64.deb
      - tar -xf data.tar.xz
      - mkdir -p /app/lib /app/bin
      - cp -R opt/WizRead /app/lib/WizRead
      - install -Dm755 wizread-wrapper.sh /app/bin/wizread
      - install -Dm644 io.wizread.WizRead.desktop /app/share/applications/io.wizread.WizRead.desktop
      - install -Dm644 io.wizread.WizRead.metainfo.xml /app/share/metainfo/io.wizread.WizRead.metainfo.xml
      - install -Dm644 icon_256.png /app/share/icons/hicolor/256x256/apps/io.wizread.WizRead.png
    sources:
      - type: file
        url: https://github.com/wizread/wizread-releases/releases/download/v1.0.15/wizread_1.0.15_amd64.deb
        sha256: caff199f799cb8a0c47b484ffc4856237a30717991d1fe8c364aba57de9d96df 

      - type: file
        url: https://raw.githubusercontent.com/wizread/wizread-flathub-upstream/main/wizread-wrapper.sh
        sha256: 9c60e753d43cf534411e0a530cb5bc921c2589fee6f99eaf8cb974059fef0628 

      - type: file
        url: https://raw.githubusercontent.com/wizread/wizread-flathub-upstream/main/io.wizread.WizRead.desktop
        sha256: 0eba18d7fbe906b413be3fb30e6ed853d782dfbcaa60d97fc8940d19bcc436cf 

      - type: file
        url: https://raw.githubusercontent.com/wizread/wizread-flathub-upstream/main/io.wizread.WizRead.metainfo.xml
        sha256: b98a4692b3cd1756f84e9579b231c579ce278197852dcd62f2f26aa9bd1ed57a 

      - type: file
        url: https://raw.githubusercontent.com/wizread/wizread-flathub-upstream/main/icon.png
        sha256: 7b949758ae49b99f25c53d577eeee453a39c14b449227fc7da277e720fa46a5c 
        dest-filename: icon_256.png
