app-id: com.bsun.SkyGapEscape
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: SkyGapEscape.sh

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio

modules:
  - name: sky-gap-escape
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - mkdir -p /app/share/applications
      - mkdir -p /app/share/metainfo
      - mkdir -p /app/share/icons/hicolor/256x256/apps
      - unzip SkyGapEscape-Linux.zip -d sky-gap-escape-linux
      - cp -r sky-gap-escape-linux/* /app/bin/
      - chmod +x /app/bin/SkyGapEscape
      - chmod +x /app/bin/SkyGapEscape.sh
      - chmod +x /app/bin/Engine/Binaries/Linux/UnrealGame-Linux-Shipping
      - install -Dm644 com.bsun.SkyGapEscape.desktop /app/share/applications/com.bsun.SkyGapEscape.desktop
      - install -Dm644 com.bsun.SkyGapEscape.metainfo.xml /app/share/metainfo/com.bsun.SkyGapEscape.metainfo.xml
      - install -Dm644 com.bsun.SkyGapEscape.png /app/share/icons/hicolor/256x256/apps/com.bsun.SkyGapEscape.png
    sources:
      - type: file
        url: https://github.com/Bsun7131/SkyGapEscape-Linux/releases/download/v1.0-linux/SkyGapEscape-Linux-UE5.6-SM5-UbuntuTested.zip
        sha256: 17af69dc93cc118e404937398f75f2d5a3dc5d79180c8e7413baed9338111645
        dest-filename: SkyGapEscape-Linux.zip
      - type: file
        path: com.bsun.SkyGapEscape.desktop
      - type: file
        path: com.bsun.SkyGapEscape.metainfo.xml
      - type: file
        path: com.bsun.SkyGapEscape.png
