app-id: org.tml.Tml
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: tml

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-data/applications:create

modules:
  - name: tml
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-build-isolation .
      - install -Dm644 packaging/org.tml.Tml.desktop
          /app/share/applications/org.tml.Tml.desktop
      - install -Dm644 packaging/flatpak/org.tml.Tml.metainfo.xml
          /app/share/metainfo/org.tml.Tml.metainfo.xml
      - install -Dm644 tml/data/icons/org.tml.Tml.svg
          /app/share/icons/hicolor/scalable/apps/org.tml.Tml.svg
      - install -Dm644 tml/data/icons/org.tml.Tml-symbolic.svg
          /app/share/icons/hicolor/symbolic/apps/org.tml.Tml-symbolic.svg
    sources:
      - type: git
        url: https://github.com/Security-Research-project/Tml.git
        tag: v0.1.0         
    build-options:
      build-args:
        - --share=network   
