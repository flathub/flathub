<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Shell'Naga</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2550"/>
      <stop offset="1" stop-color="#090d1f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d27a"/>
      <stop offset="1" stop-color="#c8902f"/>
    </linearGradient>
    <linearGradient id="psi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8f1ff"/>
      <stop offset="1" stop-color="#2fa8e8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bgGrad)"/>
  <polygon points="88,72 44,128 88,184 104,170 72,128 104,86" fill="url(#gold)"/>
  <polygon points="168,72 212,128 168,184 152,170 184,128 152,86" fill="url(#gold)"/>
  <g filter="url(#glow)">
    <polygon points="128,60 162,128 128,196 94,128" fill="url(#psi)"/>
  </g>
  <polyline points="94,128 128,144 162,128" fill="none" stroke="#e9fbff" stroke-width="4" stroke-linejoin="round" opacity="0.85"/>
  <line x1="128" y1="60" x2="128" y2="144" stroke="#e9fbff" stroke-width="4" opacity="0.55"/>
</svg>
