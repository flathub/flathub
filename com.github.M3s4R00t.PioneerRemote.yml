app-id: com.github.M3s4R00t.PioneerRemote
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: pioneer-remote-gnome.py

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.DBus
  - --filesystem=xdg-run/dconf
  - --socket=session-bus

modules:
  - name: pioneer-remote
    buildsystem: simple
    build-commands:
      - install -Dm755 pioneer-remote-gnome.py /app/bin/pioneer-remote-gnome.py
      - install -Dm644 pioneer-remote-gnome.desktop /app/share/applications/com.github.M3s4R00t.PioneerRemote.desktop
      - install -Dm644 pioneer-remote-gnome.png /app/share/icons/hicolor/256x256/apps/com.github.M3s4R00t.PioneerRemote.png
    sources:
      - type: git
        url: https://github.com/M3s4R00t/pioneer-remote.git
        branch: main
