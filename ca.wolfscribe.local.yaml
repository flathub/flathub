app-id: ca.wolfscribe.local
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: wolfscribe-local
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  # Only needed for optional cloud backup and "Check for updates"; the app is fully usable offline.
  - --share=network
  # Writing lives in the app's own sandboxed data folder; other folders are reached only through the system file picker.
  - --env=ELECTRON_TRASH=gio
modules:
  - name: wolfscribe-local
    buildsystem: simple
    build-commands:
      - mkdir -p /app/wolfscribe-local
      - cp -a tarball/. /app/wolfscribe-local/
      - install -Dm755 wolfscribe-local.sh /app/bin/wolfscribe-local
      - install -Dm644 ca.wolfscribe.local.desktop /app/share/applications/ca.wolfscribe.local.desktop
      - install -Dm644 ca.wolfscribe.local.metainfo.xml /app/share/metainfo/ca.wolfscribe.local.metainfo.xml
      - install -Dm644 ca.wolfscribe.local.png /app/share/icons/hicolor/512x512/apps/ca.wolfscribe.local.png
    sources:
      - type: archive
        url: https://mintarix.ca/__l5e/assets-v1/1978805d-f13e-48af-8040-f72a05a697af/wolfscribe-local-1.0.0-linux-x64.tar.gz
        sha256: 80d96de24f966e1001017c03d2647ccbdcd4b8fa22e868c7022adc4b530f8ba2
        strip-components: 1
        dest: tarball
      - type: file
        path: ca.wolfscribe.local.desktop
      - type: file
        path: ca.wolfscribe.local.metainfo.xml
      - type: file
        path: ca.wolfscribe.local.png
      - type: script
        dest-filename: wolfscribe-local.sh
        commands:
          - exec zypak-wrapper "/app/wolfscribe-local/Wolfscribe Local" "$@"
