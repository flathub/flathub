# Flatpak Manifest for DevTunes
# App ID: space.devtunes.player
# 
# To build this Flatpak locally:
# 1. Install flatpak and flatpak-builder
# 2. Install the freedesktop runtime: flatpak install flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08 org.electronjs.Electron2.BaseApp//23.08
# 3. Run: flatpak-builder --force-clean build-dir flathub/space.devtunes.player.yml
# 
# NOTE: This manifest is pre-configured for Flathub. It downloads the pre-built .deb package
# from your GitHub release. For local testing before publishing to GitHub, you can uncomment
# the local file source below and comment out the URL source.

app-id: space.devtunes.player
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '23.08'
command: space.devtunes.player

finish-args:
  # X11 + Wayland windowing APIs
  - --socket=wayland
  - --socket=fallback-x11
  # Audio server access (essential for music playback)
  - --socket=pulseaudio
  # Network access (essential for music streaming)
  - --share=network
  # GPU acceleration and IPC
  - --share=ipc
  - --device=dri
  # Desktop integration and notification services
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # Optional local file access for music files and configuration
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-config/DevTunes:create

modules:
  - name: dev-tunes
    buildsystem: simple
    build-commands:
      # Extract the Debian package contents
      - ar x dev-tunes_1.1.0_amd64.deb
      - tar xf data.tar.xz
      
      # Copy the Electron application payload into the Flatpak prefix
      - cp -r usr/lib/dev-tunes /app/main
      
      # Install our launch wrapper script
      - install -Dm755 space.devtunes.player.sh /app/bin/space.devtunes.player
      
      # Install the desktop entry file
      - install -Dm644 space.devtunes.player.desktop /app/share/applications/space.devtunes.player.desktop
      
      # Install the AppStream metainfo XML file
      - install -Dm644 space.devtunes.player.metainfo.xml /app/share/metainfo/space.devtunes.player.metainfo.xml
      
      # Install our application branding icon
      - install -Dm644 space.devtunes.player.png /app/share/icons/hicolor/512x512/apps/space.devtunes.player.png

    sources:
      # === FLATHUB / REMOTE SOURCE CONFIG ===
      # (This is what you will submit to Flathub. It downloads your GitHub release package)
      - type: file
        url: https://github.com/ghostmalik/dev-tunes/releases/download/v1.1.0/dev-tunes_1.1.0_amd64.deb
        sha256: c28f7438fb6475f76d80a0b7194ff77e0f8ac567acf06f605bc660391ceca576
        only-arches: [x86_64]

      # === LOCAL TESTING CONFIG (UNCOMMENT FOR LOCAL FLATPAK BUILDS) ===
      # (To test build locally before uploading to GitHub, comment out the URL block above
      # and uncomment the file block below to use your locally built .deb package)
      # - type: file
      #   path: ../dist/dev-tunes_1.1.0_amd64.deb
      #   dest-filename: dev-tunes_1.1.0_amd64.deb
      #   only-arches: [x86_64]
        
      - type: file
        path: space.devtunes.player.sh
        
      - type: file
        path: space.devtunes.player.desktop
        
      - type: file
        path: space.devtunes.player.metainfo.xml

      - type: file
        path: space.devtunes.player.png
