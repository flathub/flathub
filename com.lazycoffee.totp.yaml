app-id: com.lazycoffee.totp
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: lc_totp_app

finish-args:
  # X11 + Wayland graphics access
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

  # Network sync with totp.lazycoffee.com
  - --share=network

  # Secret Service API (libsecret / GNOME Keyring / KeePassXC Secret Service)
  - --talk-name=org.freedesktop.secrets

  # Desktop notifications
  - --talk-name=org.freedesktop.Notifications

  # User document directory for credentials export / import
  - --filesystem=xdg-documents:rw
  - --filesystem=xdg-download:rw

modules:
  - name: lazycoffee-totp
    buildsystem: simple
    build-commands:
      # Install bundle into /app
      - cp -r * /app/
      - install -Dm755 lc_totp_app /app/bin/lc_totp_app
      - install -Dm644 com.lazycoffee.totp.desktop /app/share/applications/com.lazycoffee.totp.desktop
      - install -Dm644 com.lazycoffee.totp.metainfo.xml /app/share/metainfo/com.lazycoffee.totp.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/com.lazycoffee.totp.png
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/com.lazycoffee.totp.png
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/com.lazycoffee.totp.png
    sources:
      # Precompiled release tarball for ARM64 Linux
      - type: archive
        only-arches: [aarch64]
        url: https://totp.lazycoffee.com/download/LazyCoffee-TOTP-Linux-arm64.tar.gz
        sha256: 3b30f0d0f8d2db34a87c7c09626b5ba936fce0a2ad0e5e9dade822e16ce62d03
      - type: file
        path: com.lazycoffee.totp.desktop
      - type: file
        path: com.lazycoffee.totp.metainfo.xml
      - type: file
        path: icons/512x512/com.lazycoffee.totp.png
        dest-filename: icon-512.png
      - type: file
        path: icons/256x256/com.lazycoffee.totp.png
        dest-filename: icon-256.png
      - type: file
        path: icons/128x128/com.lazycoffee.totp.png
        dest-filename: icon-128.png
