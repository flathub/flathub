app-id: com.lazycoffee.totp
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: lc_totp_app

finish-args:
  # X11 + Wayland graphics access
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

  # Network sync with totp.lazycoffee.com
  - --share=network

  # Secret Service API (libsecret / GNOME Keyring / KeePassXC Secret Service)
  - --talk-name=org.freedesktop.secrets

  # Desktop notifications
  - --talk-name=org.freedesktop.Notifications

  # Portal file chooser & open URI
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=org.freedesktop.portal.OpenURI

  # User document directory for credentials export / import
  - --filesystem=xdg-documents:rw
  - --filesystem=xdg-download:rw

modules:
  - name: lazycoffee-totp
    buildsystem: simple
    build-commands:
      # Install bundle into /app
      - cp -r * /app/
      - install -Dm755 lc_totp_app /app/bin/lc_totp_app
      - install -Dm644 com.lazycoffee.totp.desktop /app/share/applications/com.lazycoffee.totp.desktop
      - install -Dm644 com.lazycoffee.totp.metainfo.xml /app/share/metainfo/com.lazycoffee.totp.metainfo.xml
      - install -Dm644 icons/512x512/com.lazycoffee.totp.png /app/share/icons/hicolor/512x512/apps/com.lazycoffee.totp.png
      - install -Dm644 icons/256x256/com.lazycoffee.totp.png /app/share/icons/hicolor/256x256/apps/com.lazycoffee.totp.png
      - install -Dm644 icons/128x128/com.lazycoffee.totp.png /app/share/icons/hicolor/128x128/apps/com.lazycoffee.totp.png
    sources:
      # Multi-architecture distribution release tarballs
      - type: archive
        only-arches: [aarch64]
        url: https://totp.lazycoffee.com/downloads/LazyCoffee-TOTP-Linux-arm64.tar.gz
        sha256: 67bb6c14eb3729f1eb23bf94b14c4a620ce827d854adb24221f33cbf83c880cc
      - type: archive
        only-arches: [x86_64]
        url: https://totp.lazycoffee.com/downloads/LazyCoffee-TOTP-Linux-x86_64.tar.gz
        sha256: 92cc5a26672a1926ebf3867a4767af05863230d7f7859e15ccbc39c912e79fc3
      - type: file
        path: com.lazycoffee.totp.desktop
      - type: file
        path: com.lazycoffee.totp.metainfo.xml
      - type: dir
        path: icons
