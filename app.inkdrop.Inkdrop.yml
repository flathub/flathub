app-id: app.inkdrop.Inkdrop
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: inkdrop
separate-locales: false
tags:
  - proprietary

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  # keyring access
  - --talk-name=org.freedesktop.secrets
  # Tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  - --system-talk-name=org.freedesktop.login1

modules:
  - name: inkdrop
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 inkdrop.sh /app/bin/inkdrop
      - install -Dm644 -t /app/share/applications app.inkdrop.Inkdrop.desktop
      - install -Dm644 -t /app/share/metainfo app.inkdrop.Inkdrop.metainfo.xml
      - install -Dm644 app.inkdrop.Inkdrop.png
        /app/share/icons/hicolor/256x256/apps/app.inkdrop.Inkdrop.png
    sources:
      - type: extra-data
        only-arches:
          - x86_64
        filename: inkdrop.deb
        url: https://dist.inkdrop.app/releases/inkdrop-6.0.0-amd64-linux.deb
        sha256: 9d4b0bc203df66dc22fd246d10288e44f95e8124f3261df74355888fd1ed9932
        size: 103466588
        x-checker-data:
          type: electron-updater
          url: https://dist.inkdrop.app/releases/latest-linux.yml
          is-main-source: true

      - type: extra-data
        only-arches:
          - aarch64
        filename: inkdrop.deb
        url: https://dist.inkdrop.app/releases/inkdrop-6.0.0-arm64-linux.deb
        sha256: 7bcb68ce71a95eadcf348337b0bedd4ae3aa27cd73c08439008e7a72973a70a2
        size: 97934280
        x-checker-data:
          type: electron-updater
          url: https://dist.inkdrop.app/releases/latest-linux-arm64.yml

      - type: file
        path: apply_extra.sh

      - type: file
        path: inkdrop.sh

      - type: file
        path: app.inkdrop.Inkdrop.desktop

      - type: file
        path: app.inkdrop.Inkdrop.metainfo.xml

      - type: file
        path: app.inkdrop.Inkdrop.png
