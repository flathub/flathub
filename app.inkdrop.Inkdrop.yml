app-id: app.inkdrop.Inkdrop
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: inkdrop
separate-locales: false
tags:
  - proprietary

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  # keyring access
  - --talk-name=org.freedesktop.secrets
  # Tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  - --system-talk-name=org.freedesktop.login1

modules:
  - name: inkdrop
    buildsystem: simple
    build-commands:
      - cp -a inkdrop /app/inkdrop
      - install -Dm755 inkdrop.sh /app/bin/inkdrop
      - install -Dm644 -t /app/share/applications app.inkdrop.Inkdrop.desktop
      - install -Dm644 -t /app/share/metainfo app.inkdrop.Inkdrop.metainfo.xml
      - install -Dm644 app.inkdrop.Inkdrop.png
        /app/share/icons/hicolor/256x256/apps/app.inkdrop.Inkdrop.png
    sources:
      - type: archive
        only-arches:
          - x86_64
        dest: inkdrop
        strip-components: 0
        url: https://dist.inkdrop.app/releases/inkdrop-6.1.5-x64-linux.zip
        sha256: faa716c8f4ae2ca3a92cd3599cda00b8788928eceaf4aa8f3a652679069a5b94
        x-checker-data:
          type: json
          url: https://api.inkdrop.app/download/latest
          version-query: .version
          url-query: .links.linux[] | select(.arch == "x64" and .type == "zip") | .url
          is-main-source: true

      - type: archive
        only-arches:
          - aarch64
        dest: inkdrop
        strip-components: 0
        url: https://dist.inkdrop.app/releases/inkdrop-6.1.5-arm64-linux.zip
        sha256: 59b887bb6a9054b258f080ec8285d90522f3d050e87342ad639d973b474cab8a
        x-checker-data:
          type: json
          url: https://api.inkdrop.app/download/latest
          version-query: .version
          url-query: .links.linux[] | select(.arch == "arm64" and .type == "zip") | .url

      - type: file
        path: inkdrop.sh

      - type: file
        path: app.inkdrop.Inkdrop.desktop

      - type: file
        path: app.inkdrop.Inkdrop.metainfo.xml

      - type: file
        path: app.inkdrop.Inkdrop.png
