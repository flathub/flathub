app-id: app.inkdrop.Inkdrop
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: inkdrop
separate-locales: false
tags:
  - proprietary

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  # keyring access
  - --talk-name=org.freedesktop.secrets
  # Tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  - --system-talk-name=org.freedesktop.login1

modules:
  - name: inkdrop
    buildsystem: simple
    build-commands:
      - install -Dm644 -t /app/share/applications inkdrop/app.inkdrop.Inkdrop.desktop
      - install -Dm644 -t /app/share/metainfo inkdrop/app.inkdrop.Inkdrop.metainfo.xml
      - install -Dm644 inkdrop/app.inkdrop.Inkdrop.png
        /app/share/icons/hicolor/256x256/apps/app.inkdrop.Inkdrop.png
      - rm inkdrop/app.inkdrop.Inkdrop.*
      - cp -a inkdrop /app/inkdrop
      - install -Dm755 inkdrop.sh /app/bin/inkdrop
    sources:
      - type: archive
        only-arches:
          - x86_64
        dest: inkdrop
        strip-components: 0
        url: https://dist.inkdrop.app/releases/inkdrop-6.1.5-x64-linux.zip
        sha256: 4f13c6a00cabb44d509dafa49fc7db138b16acd300e6b393715b47e10541ad23
        x-checker-data:
          type: json
          url: https://api.inkdrop.app/download/latest
          version-query: .version
          url-query: .links.linux[] | select(.arch == "x64" and .type == "zip") | .url
          is-main-source: true

      - type: archive
        only-arches:
          - aarch64
        dest: inkdrop
        strip-components: 0
        url: https://dist.inkdrop.app/releases/inkdrop-6.1.5-arm64-linux.zip
        sha256: 672b525bdf82015645fd4905df27dd761c25a58f39849855d4e6a9e1eb62fb73
        x-checker-data:
          type: json
          url: https://api.inkdrop.app/download/latest
          version-query: .version
          url-query: .links.linux[] | select(.arch == "arm64" and .type == "zip") | .url

      - type: file
        path: inkdrop.sh
