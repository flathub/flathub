# Flatpak manifest for Raag (GNOME music player, Rust)
# Build:   flatpak-builder --user --install --force-clean build-dir io.github.taara_apps.Raag.yml
# Run:     flatpak run io.github.taara_apps.Raag

id: io.github.taara_apps.Raag
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: raag

finish-args:
  # Display
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Audio output
  - --socket=pulseaudio
  # Read the user's Music folder
  - --filesystem=xdg-music
  - --share=network
  - --filesystem=xdg-download
  - --system-talk-name=org.bluez
  - --talk-name=org.gnome.Settings

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/raag/cargo
    CARGO_NET_OFFLINE: 'true'

cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'

modules:
  - python-youtube.json
  - name: quickjs-ng
    buildsystem: cmake-ninja
    config-opts: 
    - -DCMAKE_BUILD_TYPE=Release
    - -DBUILD_SHARED_LIBS=OFF
    cleanup: 
      - /bin/qjsc
      - /include
      - /lib
      - /share
    sources:
      - type: archive
        url: https://github.com/quickjs-ng/quickjs/archive/refs/tags/v0.18.0.tar.gz
        sha256: 28bcd89aa3683fd2a946537e5ce3f11cc46b5cbf3383c7561aaef3df5ff9f1dd
  - name: raag
    buildsystem: meson
    config-opts:
    - --buildtype=release
    sources:
      - type: git 
        url: https://github.com/taara-apps/raag.git
        tag: v0.2.2
        commit: 807d8fb8433dc031ee4cebeec5d81af47142d99a
      # Offline crate sources. Generate with:
      #   python3 flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json
      - cargo-sources.json

