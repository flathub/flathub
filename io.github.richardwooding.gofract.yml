# Flathub submission manifest. Builds offline from a pinned git tag plus
# Go modules fetched from the module proxy with checksums (go.mod.yml,
# generated by flatpak-go-mod; see README.md here to regenerate).
app-id: io.github.richardwooding.gofract
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: gofract
finish-args:
  - --share=ipc
  # Ebitengine opens an X11 (XWayland) window on Linux and has no Wayland
  # backend, so only the X11 socket is granted.
  - --socket=x11
  - --device=dri
  # Saves go to ~/Pictures/gofract; -load and the L palette menu read from
  # there. The working directory is read-only in the sandbox.
  - --filesystem=xdg-pictures:create
modules:
  - name: gofract
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      env:
        GOFLAGS: -mod=vendor -trimpath -buildvcs=false
        GOTOOLCHAIN: local
        GOCACHE: /run/build/gofract/.gocache
    build-commands:
      - go build -ldflags "-s -w -X main.version=v$(grep -oE 'version=\"[0-9.]+\"' assets/io.github.richardwooding.gofract.metainfo.xml | head -1 | cut -d'\"' -f2)" -o /app/bin/gofract ./cmd/gofract
      - install -Dm644 assets/io.github.richardwooding.gofract.desktop /app/share/applications/io.github.richardwooding.gofract.desktop
      - install -Dm644 assets/io.github.richardwooding.gofract.metainfo.xml /app/share/metainfo/io.github.richardwooding.gofract.metainfo.xml
      - for s in 512 256 128 64 48 32; do install -Dm644 assets/icon-$s.png /app/share/icons/hicolor/${s}x${s}/apps/io.github.richardwooding.gofract.png; done
    sources:
      - type: git
        url: https://github.com/richardwooding/gofract.git
        tag: v0.3.0
        commit: 29a0b93fdbc296b66e41f13f23feb5ed9f957427
        x-checker-data:
          type: git
          tag-pattern: "^v([\\d.]+)$"
      - go.mod.yml
