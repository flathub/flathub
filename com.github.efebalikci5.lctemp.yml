app-id: com.github.efebalikci5.lctemp
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: lctemp
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=all
  - --filesystem=host

modules:
  - name: lctemp
    buildsystem: simple
    build-commands:
      - install -D -m 755 lctemp_monitor.py /app/bin/lctemp
      - install -D -m 644 lctemp.png /app/share/icons/hicolor/256x256/apps/com.github.efebalikci5.lctemp.png
      - install -D -m 644 LCTemp.desktop /app/share/applications/com.github.efebalikci5.lctemp.desktop
      - install -D -m 644 com.github.efebalikci5.lctemp.metainfo.xml /app/share/metainfo/com.github.efebalikci5.lctemp.metainfo.xml
    sources:
      - type: git
        url: https://github.com/Efebalikci5/LCTemp.git
        branch: main
