app-id: com.ktechpit.red
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: red
finish-args:
  - --device=all
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio

  - --own-name=org.mpris.MediaPlayer2.red
  - --talk-name=org.kde.StatusNotifierWatcher

  - --filesystem=/run/udev:ro
  - --filesystem=xdg-download

cleanup:
  - /bin/mksquashfs
  - /bin/unsquashfs
  - /bin/sqfscat
  - /bin/sqfstar

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - shared-modules/squashfs-tools/squashfs-tools.json

  - name: red
    buildsystem: simple
    build-commands:
      - unsquashfs -no-progress *.snap
      - install -Dm755 squashfs-root/usr/bin/red ${FLATPAK_DEST}/bin/red
      - install -Dm755 squashfs-root/usr/bin/deno ${FLATPAK_DEST}/bin/deno
      - cp -r squashfs-root/usr/share/icons ${FLATPAK_DEST}/share/
      - install -Dm644 squashfs-root/usr/share/applications/com.ktechpit.red.desktop ${FLATPAK_DEST}/share/applications/com.ktechpit.red.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} ${FLATPAK_DEST}/share/applications/com.ktechpit.red.desktop
      - install -Dm644 squashfs-root/usr/share/metainfo/com.ktechpit.red.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.ktechpit.red.metainfo.xml
    sources:
      # =========================
      # x86_64 (amd64) - stable
      # =========================
      - type: file
        url: https://api.snapcraft.io/api/v1/snaps/download/46Yk5UkQgwdukH9Fw6IeJOkGhyELYKtQ_54.snap
        sha256: 21eca01118e74fb96a99a65d7087ece0ea058f28d7599b26eb8be1b5a2b1f070
        only-arches:
          - x86_64

      # =========================
      # aarch64 (arm64) - stable
      # =========================
      - type: file
        url: https://api.snapcraft.io/api/v1/snaps/download/46Yk5UkQgwdukH9Fw6IeJOkGhyELYKtQ_53.snap
        sha256: 360acddd574b5145707c2272dd00459be0c569e957a32fccb761fb3f792f698b
        only-arches:
          - aarch64
