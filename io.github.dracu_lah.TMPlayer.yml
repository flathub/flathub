app-id: io.github.dracu_lah.TMPlayer
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: tmplayer

finish-args:
  # Wayland with fallback to X11
  - --socket=wayland
  - --socket=fallback-x11
  # Audio playback
  - --socket=pulseaudio
  # Hardware accelerated video rendering
  - --device=dri
  # Network access for media streaming
  - --share=network
  - --share=ipc

modules:
  - name: tmplayer
    buildsystem: simple
    build-commands:
      - cp -a bin lib share "${FLATPAK_DEST}/"
      - ln -s "${FLATPAK_DEST}/bin/TMPlayer" "${FLATPAK_DEST}/bin/tmplayer"
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/dracu-lah/TMPlayer/releases/download/v1.22.0/TMPlayer-1.22.0-linux-x64.tar.xz
        sha256: b43670b73ad9164a50efc770019cbf62913f821fd3642ea1ce41ac8bfb30d561
        x-checker-data:
          type: json
          url: https://api.github.com/repos/dracu-lah/TMPlayer/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "TMPlayer-" + $version + "-linux-x64.tar.xz") | .browser_download_url
          is-main-source: true
