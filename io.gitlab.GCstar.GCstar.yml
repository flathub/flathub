id: io.gitlab.GCstar.GCstar
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: gcstar

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  # - --filesystem=xdg-documents

modules:
  - name: perl
    no-autogen: true
    config-opts:
      - "-des"
      - "-Duseshrplib"
      - "-Dusethreads"
    build-options:
      # There would otherwise be compilation errors
      cflags: >-
        -fPIC -std=gnu17
        -Wno-error=implicit-function-declaration
        -Wno-error=implicit-int
        -Wno-error=incompatible-pointer-types
        -Wno-error=int-conversion
      ldflags: "-fpic"
    sources:
      - type: archive
        url: https://www.cpan.org/src/5.0/perl-5.40.4.tar.gz
        sha256: 3258564b644dc912f7367c4f49d6df77a855cdef9305c50801e03d09d39381af
      - type: shell
        commands:
          - "ln -s configure{.gnu,}"
    post-install:
      - "chmod -R u+w /app/lib/perl5"
    cleanup:
      - "/bin/corelist"
      - "/bin/cpan"
      - "/bin/enc2xs"
      - "/bin/encguess"
      - "/bin/h2ph"
      - "/bin/h2xs"
      - "/bin/instmodsh"
      - "/bin/json_pp"
      - "/bin/libnetcfg"
      - "/bin/perlbug"
      - "/bin/perldoc"
      - "/bin/perlivp"
      - "/bin/perlthanks"
      - "/bin/piconv"
      - "/bin/pl2pm"
      - "/bin/pod*"
      - "/bin/prove"
      - "/bin/ptar*"
      - "/bin/shasum"
      - "/bin/splain"
      - "/bin/xsubpp"
      - "/bin/zipdetails"
      - "/include"
      - "/man"
      - "*.pod"

  - name: libgd
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --with-jpeg
      - --with-png
      - --with-freetype
      - --without-tiff
      - --without-webp
      - --without-heif
      - --without-avif
      - --without-xpm
    sources:
      - type: archive
        url: https://github.com/libgd/libgd/releases/download/gd-2.3.3/libgd-2.3.3.tar.gz
        sha256: dd3f1f0bb016edcc0b2d082e8229c822ad1d02223511997c80461481759b1ed2

  # Installs the modules generated by flatpak-cpan-generator.
  - name: perl-libs
    buildsystem: simple
    build-commands:
      - "perl-libs/install.sh"
    build-options:
      cflags: >-
        -std=gnu17
        -Wno-error=implicit-function-declaration
        -Wno-error=implicit-int
        -Wno-error=incompatible-pointer-types
        -Wno-error=int-conversion
    post-install:
      - "chmod -Rf u+w /app/lib/perl5/site_perl"
    sources:
      - generated-sources.json
    cleanup:
      - "/bin"
      - "/man"

  - name: gcstar
    buildsystem: simple
    subdir: main
    sources:
      - type: git
        url: https://gitlab.com/GCstar/GCstar.git
        dest: main
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
        commit: 08c222270875700daa1ee2d11af981f961fa74f6
      - type: file
        path: io.gitlab.GCstar.GCstar.desktop
      - type: file
        path: io.gitlab.GCstar.GCstar.xml
      - type: file
        path: io.gitlab.GCstar.GCstar.metainfo.xml
    build-options:
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8
    build-commands:
      - cd gcstar && perl ./install --text --prefix="${FLATPAK_DEST}"
      - |
        icon_dir=./gcstar/share/gcstar/icons
        for i in 128x128 256x256; do
          install -Dm 644 ${icon_dir}/gcstar_${i}.png ${FLATPAK_DEST}/share/icons/hicolor/${i}/apps/${FLATPAK_ID}.png
        done
      - install -Dm 644 ../io.gitlab.GCstar.GCstar.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm 644 ../io.gitlab.GCstar.GCstar.xml ${FLATPAK_DEST}/share/mime/packages/${FLATPAK_ID}.xml
      - install -Dm 644 ../io.gitlab.GCstar.GCstar.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
