app-id: io.github.fossasia.PSLab-App
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: pslab

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-documents
  - --device=all
  - --share=network
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.UDisks2
  - --talk-name=org.bluez
  - --system-talk-name=org.freedesktop.NetworkManager
  - --env=LD_LIBRARY_PATH=/app/lib:/app/bin/lib

modules:
  - name: libusb
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/libusb/libusb.git
        tag: v1.0.27
        commit: d52e355daa09f17ce64819122cb067b8a2ee0d4b
        
  - name: pslab
    buildsystem: simple
    build-commands:
      - bsdtar -xf pslab-bin.rpm
      - mkdir -p /app/bin /app/share
      
      - cp -rv usr/bin/pslab /app/bin/
      
      - mkdir -p /app/bin/lib
      - cp -rv usr/lib/pslab/* /app/bin/lib/
      
      - mkdir -p /app/bin/data
      
      - find . -name "icudtl.dat" -exec cp -v {} /app/bin/data/ \;
      
      - find . -type d -name "flutter_assets" -exec cp -rv {} /app/bin/data/ \;
      
      - mkdir -p /app/share/applications
      - mv /app/share/applications/pslab.desktop /app/share/applications/io.github.fossasia.PSLab-App.desktop || true

      - desktop-file-edit --set-key=Exec --set-value=pslab /app/share/applications/io.github.fossasia.PSLab-App.desktop
      - desktop-file-edit --set-key=Icon --set-value=io.github.fossasia.PSLab-App /app/share/applications/io.github.fossasia.PSLab-App.desktop

      - find /app/share/icons/hicolor/ -name "pslab.png" -execdir mv {} io.github.fossasia.PSLab-App.png \;
      - find /app/share/icons/hicolor/ -name "pslab.svg" -execdir mv {} io.github.fossasia.PSLab-App.svg \;

      - chmod +x /app/bin/pslab
      
      - mkdir -p /app/share/metainfo
      - install -Dm644 io.github.fossasia.PSLab-App.metainfo.xml /app/share/metainfo/io.github.fossasia.PSLab-App.metainfo.xml
    sources:
      - type: file
        url: https://github.com/fossasia/pslab-app/raw/app/pslab-4.17.68-1.x86_64.rpm
        sha256: "54ff01919a583db413ace8a0669b372add2804b3b3cac6f7446fd4f76f366763"
        dest-filename: pslab-bin.rpm
      - type: file
        path: io.github.fossasia.PSLab-App.metainfo.xml
