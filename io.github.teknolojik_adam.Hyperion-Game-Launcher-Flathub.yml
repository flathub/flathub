app-id: io.github.teknolojik_adam.Hyperion-Game-Launcher-Flathub
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: hyperion

finish-args:
  - --share=network
  - --socket=x11
  - --share=ipc
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=~/Games

modules:
  - name: hyperion
    buildsystem: simple

    build-commands:
      - install -d /app/lib/hyperion
      - tar -xzf Hyperion-v0.1.0-linux-x64.tar.gz -C /app/lib/hyperion --strip-components=1
      - chmod -R go-w /app/lib/hyperion
      - install -Dm755 run-hyperion /app/bin/hyperion
      - install -Dm644 io.github.teknolojik_adam.Hyperion-Game-Launcher-Flathub.desktop /app/share/applications/io.github.teknolojik_adam.Hyperion-Game-Launcher-Flathub.desktop
      - install -Dm644 io.github.teknolojik_adam.Hyperion-Game-Launcher-Flathub.metainfo.xml /app/share/metainfo/io.github.teknolojik_adam.Hyperion-Game-Launcher-Flathub.metainfo.xml
      - install -Dm644 io.github.teknolojik_adam.Hyperion-Game-Launcher-Flathub.svg /app/share/icons/hicolor/scalable/apps/io.github.teknolojik_adam.Hyperion-Game-Launcher-Flathub.svg

    sources:
      - type: file
        url: https://github.com/Teknolojik-Adam/Hyperion-Game-Launcher-Flathub/releases/download/v0.1.0/Hyperion-v0.1.0-linux-x64.tar.gz
        sha256: f9cd7b713af28ac6124b3a73d36b59e0aafe31367655878c7237a6a4506e320a
        dest-filename: Hyperion-v0.1.0-linux-x64.tar.gz

      - type: file
        path: run-hyperion

      - type: file
        path: io.github.teknolojik_adam.Hyperion-Game-Launcher-Flathub.desktop

      - type: file
        path: io.github.teknolojik_adam.Hyperion-Game-Launcher-Flathub.metainfo.xml

      - type: file
        path: io.github.teknolojik_adam.Hyperion-Game-Launcher-Flathub.svg
