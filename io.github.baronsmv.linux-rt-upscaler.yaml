app-id: io.github.baronsmv.linux-rt-upscaler
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.10'
command: upscale-gui
finish-args:
  - --socket=x11
  - --device=dri
  - --share=ipc

modules:
  - python-dependencies.json

  - name: linux-rt-upscaler
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --prefix=/app --no-build-isolation .
      - install -Dm644 data/metainfo/io.github.baronsmv.linux-rt-upscaler.metainfo.xml /app/share/metainfo/io.github.baronsmv.linux-rt-upscaler.metainfo.xml
      - install -Dm644 data/applications/io.github.baronsmv.linux-rt-upscaler.desktop /app/share/applications/io.github.baronsmv.linux-rt-upscaler.desktop
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.baronsmv.linux-rt-upscaler.svg /app/share/icons/hicolor/scalable/apps/io.github.baronsmv.linux-rt-upscaler.svg
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.baronsmv.linux-rt-upscaler
    sources:
      - type: git
        url: https://github.com/baronsmv/linux-rt-upscaler.git
        commit: f9ab357ba8a562c865b02b1c9bef68f22e59a771

cleanup-commands:
  - /app/cleanup-BaseApp.sh
