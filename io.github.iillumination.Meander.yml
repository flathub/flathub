app-id: io.github.iillumination.Meander
runtime: org.gnome.Platform
runtime-version: '45'
sdk: org.gnome.Sdk
command: meander
separate-locales: false
finish-args:
  # Настройки доступа (sandbox)
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home # Дает доступ к файлам пользователя для сохранения/загрузки квестов

modules:
  - name: meander
    buildsystem: simple
    build-commands:
      # Распаковка AppImage
      - chmod +x Meander-linux-x64.AppImage
      - ./Meander-linux-x64.AppImage --appimage-extract
      
      # Установка бинарных файлов
      - mkdir -p /app/bin /app/meander
      - cp -r squashfs-root/* /app/meander/
      - ln -s /app/meander/AppRun /app/bin/meander
      
      # Установка ярлыка, метаданных и иконки
      - install -Dm644 io.github.iillumination.Meander.desktop -t /app/share/applications/
      - install -Dm644 io.github.iillumination.Meander.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 squashfs-root/canvas_app.png /app/share/icons/hicolor/512x512/apps/io.github.iillumination.Meander.png
    sources:
      - type: file
        url: https://github.com/IILLUMINATION/mnd/releases/download/v1.0.0/Meander-linux-x64.AppImage
        sha256: da75c1012f381d9eca5658ca483ddeffefc507b5f3d736ff7118892edf8a35b3
      - type: file
        path: io.github.iillumination.Meander.desktop
      - type: file
        path: io.github.iillumination.Meander.metainfo.xml