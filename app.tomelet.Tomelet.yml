app-id: app.tomelet.Tomelet
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: tomelet

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --own-name=org.mpris.MediaPlayer2.tomelet.*
  - --filesystem=xdg-run/speech-dispatcher

modules:
  - name: tomelet
    buildsystem: simple
    only-arches:
      - x86_64
    build-options:
      no-debuginfo: true
    build-commands:
      - install -d /app/bin
      - cp -a bundle /app/bundle
      - cp -a share /app/share
      - ln -s ../bundle/tomelet /app/bin/tomelet
    sources:
      - type: archive
        url: https://github.com/tomelet-org/tomelet-downloads/releases/download/app-v1.4.0%2B127/tomelet-1.4.0-linux-x86_64-flatpak.tar.gz
        sha256: 647526196145e22ddb3a8366061854ba58613ca970ce5f2623a57cc6375669c6
        strip-components: 0
