# PoktCode Flatpak manifest for Flathub
# Public binaries: https://github.com/poktweb/poktcode-releases
# App ID uses the public releases repo (poktweb.com not live yet).

app-id: io.github.poktweb.poktcode-releases
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: poktcode
separate-locales: false

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=all
  - --socket=pulseaudio
  - --share=network
  - --filesystem=xdg-run/gnupg:ro
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.freedesktop.Notifications
  - --env=ELECTRON_DISABLE_SANDBOX=1
  - --env=THEIA_NO_SPLASH=1
  - --env=ZYPAK_DISABLE_GPU_SANDBOX=1
  - --env=ELECTRON_PASSWORD_STORE=basic
  - --env=ELECTRON_OZONE_PLATFORM_HINT=x11
  - --env=THEIA_SHELL=/app/bin/poktcode-host-shell
  - --env=SHELL=/app/bin/poktcode-host-shell

modules:
  - name: poktcode
    buildsystem: simple
    build-commands:
      - install -Dm755 poktcode-wrapper.sh /app/bin/poktcode
      - install -Dm755 poktcode-host-shell /app/bin/poktcode-host-shell
      - mkdir -p /app/lib/io.github.poktweb.poktcode-releases
      - cp -a linux-unpacked/. /app/lib/io.github.poktweb.poktcode-releases/
      - chmod +x /app/lib/io.github.poktweb.poktcode-releases/poktcode.bin || true
      - chmod +x /app/lib/io.github.poktweb.poktcode-releases/chrome-sandbox || true
      - chmod +x /app/lib/io.github.poktweb.poktcode-releases/chrome_crashpad_handler || true
      - install -Dm644 io.github.poktweb.poktcode-releases.desktop /app/share/applications/io.github.poktweb.poktcode-releases.desktop
      - install -Dm644 io.github.poktweb.poktcode-releases.metainfo.xml /app/share/metainfo/io.github.poktweb.poktcode-releases.metainfo.xml
      - install -Dm644 icon-16.png /app/share/icons/hicolor/16x16/apps/io.github.poktweb.poktcode-releases.png
      - install -Dm644 icon-32.png /app/share/icons/hicolor/32x32/apps/io.github.poktweb.poktcode-releases.png
      - install -Dm644 icon-48.png /app/share/icons/hicolor/48x48/apps/io.github.poktweb.poktcode-releases.png
      - install -Dm644 icon-64.png /app/share/icons/hicolor/64x64/apps/io.github.poktweb.poktcode-releases.png
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/io.github.poktweb.poktcode-releases.png
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.poktweb.poktcode-releases.png
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.poktweb.poktcode-releases.png
      - install -Dm644 LICENSE /app/share/doc/io.github.poktweb.poktcode-releases/copyright
    sources:
      - type: archive
        url: https://github.com/poktweb/poktcode-releases/releases/download/v0.1.0/PoktCode-0.1.0-linux-x86_64.tar.xz
        sha256: da4f26179b2eee07fe8dc9f072fbb419336df15415fb4fe8df5028ebebf50857
        dest: linux-unpacked
        strip-components: 1
      - type: file
        path: poktcode-wrapper.sh
      - type: file
        path: poktcode-host-shell
      - type: file
        path: io.github.poktweb.poktcode-releases.desktop
      - type: file
        path: io.github.poktweb.poktcode-releases.metainfo.xml
      - type: file
        path: icons/16x16.png
        dest-filename: icon-16.png
      - type: file
        path: icons/32x32.png
        dest-filename: icon-32.png
      - type: file
        path: icons/48x48.png
        dest-filename: icon-48.png
      - type: file
        path: icons/64x64.png
        dest-filename: icon-64.png
      - type: file
        path: icons/128x128.png
        dest-filename: icon-128.png
      - type: file
        path: icons/256x256.png
        dest-filename: icon-256.png
      - type: file
        path: icons/512x512.png
        dest-filename: icon-512.png
      - type: file
        path: LICENSE
