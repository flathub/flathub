# Généré par desktop/scripts/package-manifests.mjs — ne pas modifier à la main.
# Application propriétaire : le .deb publié sur certyneo.com est téléchargé à
# l'installation (extra-data), puis déballé par apply_extra dans /app/extra.
app-id: com.certyneo.Reader
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: certyneo-reader
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Éditeur de documents : les « documents récents » se rouvrent par leur chemin
  # d'une session à l'autre, ce que le portail de documents ne garantit pas.
  - --filesystem=home
  # Jeton du compte Certyneo (libsecret) et icône de la zone de notification.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: certyneo-reader
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh ${FLATPAK_DEST}/bin/apply_extra
      - install -Dm755 certyneo-reader.sh ${FLATPAK_DEST}/bin/certyneo-reader
      - install -Dm644 policy.json ${FLATPAK_DEST}/etc/certyneo-reader/policy.json
      - install -Dm644 com.certyneo.Reader.desktop ${FLATPAK_DEST}/share/applications/com.certyneo.Reader.desktop
      - install -Dm644 com.certyneo.Reader.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.certyneo.Reader.metainfo.xml
      - install -Dm644 com.certyneo.Reader.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/com.certyneo.Reader.png
      - install -Dm644 com.certyneo.Reader.mime.xml ${FLATPAK_DEST}/share/mime/packages/com.certyneo.Reader.xml
    sources:
      - type: extra-data
        filename: reader.deb
        only-arches: [x86_64]
        url: https://certyneo.com/downloads/desktop/Certyneo-Reader-1.4.1-linux-amd64.deb
        sha256: ae861e0e0121ee86e6cd8cf1506a2fa1d59799098c075042619b8d71f165681c
        size: 111595788
        x-checker-data:
          type: json
          url: https://certyneo.com/downloads/desktop/releases.json
          version-query: '.[0].version'
          url-query: '"https://certyneo.com/downloads/desktop/Certyneo-Reader-" + $version + "-linux-amd64.deb"'
      - type: file
        path: apply_extra.sh
      - type: file
        path: certyneo-reader.sh
      - type: file
        path: policy.json
      - type: file
        path: com.certyneo.Reader.desktop
      - type: file
        path: com.certyneo.Reader.metainfo.xml
      - type: file
        path: com.certyneo.Reader.png
      - type: file
        path: com.certyneo.Reader.mime.xml
