# Flatpak manifest for Canon EOS Utility.
app-id: org.problem_child.CanonEOSUtility
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: canon-eos-utility

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download

modules:
  - name: python3-modules
    buildsystem: simple
    build-commands: []
    modules:
      - name: python3-zeroconf
        buildsystem: simple
        build-commands:
          - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
            --prefix=${FLATPAK_DEST} "zeroconf" --no-build-isolation
        sources:
          - type: file
            url: https://files.pythonhosted.org/packages/9c/1f/19ebc343cc71a7ffa78f17018535adc5cbdd87afb31d7c34874680148b32/ifaddr-0.2.0-py3-none-any.whl
            sha256: 085e0305cfe6f16ab12d72e2024030f5d52674afad6911bb1eee207177b8a748
          - type: file
            url: https://files.pythonhosted.org/packages/c4/1a/1fa076936c37d192c36ef122d46c6a9bf584c6f8eb693e8f1eabb814bd9e/zeroconf-0.151.5-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl
            sha256: 92d5f219f09a45bebf28ce40776dbc1f8a0697871ceda8b6b9f2ffe8209826fe
            only-arches:
              - x86_64
          - type: file
            url: https://files.pythonhosted.org/packages/67/27/0cacf5efeb9009efce1a10e7aefad942673f775f43aea0e425eb767da37e/zeroconf-0.151.5-cp313-cp313-manylinux2014_aarch64.manylinux_2_17_aarch64.manylinux_2_28_aarch64.whl
            sha256: f346b414b882ac0dee5beb55bc8bd6ad8c7415f26d6ab4629d91bfd6c5f30f62
            only-arches:
              - aarch64
      - name: python3-exif
        buildsystem: simple
        build-commands:
          - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
            --prefix=${FLATPAK_DEST} "exif" --no-build-isolation
        sources:
          - type: file
            url: https://files.pythonhosted.org/packages/67/07/a47a78be02b0a2d273358312f3e2eecc4981d4604f8a6e6b8ef27c1e9c2d/exif-1.6.1-py3-none-any.whl
            sha256: 2879830e2d8f0e5f1503110736bceb83a1e9c2121b32c23208c04284be5afbec
          - type: file
            url: https://files.pythonhosted.org/packages/2f/da/8a9bdf5d3ea4b13d3142e0c77d6e85e4c2668aef6e4b9d5e9a6619049bdc/plum_py-0.8.7-py3-none-any.whl
            sha256: d791f059ef159adbe3c3b036557b5b431fa07db226a9de106a74e5e57441741d

  - name: canon-eos-utility
    buildsystem: simple
    build-commands:
      - |
        PYVER=$(python3 -c "import sys;print('%d.%d' % sys.version_info[:2])")
        install -d "/app/lib/python${PYVER}/site-packages"
        cp -r src/canon_eos_utility "/app/lib/python${PYVER}/site-packages/"
      - |
        install -d /app/bin
        install -Dm755 packaging/flatpak/canon-eos-utility /app/bin/canon-eos-utility
      - install -Dm644 packaging/org.problem_child.CanonEOSUtility.desktop
        /app/share/applications/org.problem_child.CanonEOSUtility.desktop
      - install -Dm644 packaging/org.problem_child.CanonEOSUtility.metainfo.xml
        /app/share/metainfo/org.problem_child.CanonEOSUtility.metainfo.xml
      - install -Dm644 packaging/icons/org.problem_child.CanonEOSUtility.svg
        /app/share/icons/hicolor/scalable/apps/org.problem_child.CanonEOSUtility.svg
      - install -Dm644 LICENSE
        /app/share/licenses/org.problem_child.CanonEOSUtility/LICENSE
    sources:
      - type: git
        url: https://github.com/night199uk/canon-eos-utility-linux.git
        tag: v0.1.0
        commit: 7d7a403ac18a60320f6aa66ca0c25bc15fed41e3
