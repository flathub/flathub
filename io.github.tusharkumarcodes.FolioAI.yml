app-id: io.github.tusharkumarcodes.FolioAI
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: folio-ai

finish-args:
  # Display and Wayland / X11 rendering
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Inter-process communication
  - --share=ipc
  # Access local or remote Ollama instances
  - --share=network
  # Persist chat and note sessions
  - --filesystem=xdg-data/gtk_note_app:create

build-options:
  env:
    PYTHONPATH: /app/lib/python3.12/site-packages

modules:
  # Python Markdown dependency
  - name: python3-markdown
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} markdown
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/75/e6/1c7b7a48aa3f2c2a5d3c71a6c9c90a6c8c2903e5c73663b5f5e38f87257f/markdown-3.11.1-py3-none-any.whl
        sha256: f1fa378ba5d682900c9ecb55ccceacca936016dda7c3b27097e8ae03ff78feb5

  # Application Module
  - name: folio-ai
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/tusharkumarcodes/folio-ai.git
        tag: v0.1.0
        commit: 80cabcdec5db18f52e9b2b779bad7aa40c268db2
