id: io.github.ErnieBernie10.RDPilot

runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10

command: rdpilot

build-options:
  prepend-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  prepend-pkg-config-path: /usr/lib/sdk/dotnet10/lib/pkgconfig

finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --talk-name=org.freedesktop.secrets
  - --env=DOTNET_ROOT=/app/lib/dotnet

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/pkgconfig
  - '*.a'
  - '*.la'

modules:
  - name: dotnet
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/dotnet10/bin/install.sh

  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dintrospection=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dmanpage=false
      - -Dbash_completion=disabled
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/libsecret.git
        tag: '0.21.7'
        commit: 22d58b2cd018b9beaab46fcc31cc552fa05afc2b
    cleanup:
      - /share/gir-1.0
      - /share/vala

  - name: cjson
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_CJSON_TEST=OFF
      - -DBUILD_SHARED_AND_STATIC_LIBS=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/DaveGamble/cJSON.git
        tag: v1.7.19
        commit: c859b25da02955fef659d658b8f324b5cde87be3

  - name: freerdp
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_TESTING=OFF
      - -DWITH_CLIENT_COMMON=ON
      - -DWITH_CLIENT_CHANNELS=ON
      - -DWITH_CLIENT_SDL=OFF
      - -DWITH_CLIENT_SDL2=OFF
      - -DWITH_CLIENT_SDL3=OFF
      - -DWITH_X11=OFF
      - -DWITH_WAYLAND=OFF
      - -DWITH_SERVER=OFF
      - -DWITH_SAMPLE=OFF
      - -DWITH_SHADOW=OFF
      - -DWITH_PROXY=OFF
      - -DWITH_MANPAGES=OFF
      - -DWITH_WINPR_TOOLS=OFF
      - -DWITH_FFMPEG=ON
      - -DWITH_SWSCALE=ON
      - -DWITH_PULSE=OFF
      - -DWITH_ALSA=OFF
      - -DWITH_CUPS=OFF
      - -DWITH_PCSC=OFF
      - -DWITH_KRB5=OFF
      - -DWITH_AAD=OFF
      - -DWITH_WEBVIEW=OFF
      - -DWITH_URIPARSER=OFF
      - -DWITH_FUSE=OFF
      - -DWITH_OPUS=OFF
      - -DWITH_PKCS11=OFF
      - -DWITH_FDK_AAC=OFF
      - -DWITH_CAIRO=OFF
      - -DWITH_OPENCL=OFF
    sources:
      - type: git
        url: https://github.com/FreeRDP/FreeRDP.git
        tag: '3.30.0'
        commit: cc741756e3a07fe1e5f4661a59b2e4e85f1a148f
    cleanup:
      - /bin

  - name: rdpilot
    buildsystem: simple
    build-options:
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
        DOTNET_NOLOGO: '1'
    build-commands:
      - sh build.sh
    sources:
      - type: git
        url: https://github.com/ErnieBernie10/RDPilot.git
        tag: v1.3.0
        commit: 4f751c41a681488dc1a44c8589d62bad08f25573
      - type: file
        path: build.sh
      - type: file
        path: rdpilot.sh
      - type: file
        path: io.github.ErnieBernie10.RDPilot.desktop
      - type: file
        path: io.github.ErnieBernie10.RDPilot.metainfo.xml
      - nuget-sources.json
