app-id: io.github.grigio.carosello
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: carosello

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build-carosello/cargo

finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=ipc
  - --talk-name=org.freedesktop.secrets
  # Full filesystem access for image/video viewer
  - --filesystem=home
  # Thumbnail access
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd

modules:
  - name: carosello
    buildsystem: meson
    sources:
      - type: dir
        path: .
      - cargo-sources.json
