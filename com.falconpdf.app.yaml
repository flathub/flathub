app-id: com.falconpdf.app
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: falconpdf
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --share=network

modules:
  - name: libcrypt-compat
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --enable-obsolete-api=yes
      - --disable-xcrypt-compat-files
    sources:
      - type: archive
        url: https://github.com/besser82/libxcrypt/releases/download/v4.4.36/libxcrypt-4.4.36.tar.xz
        sha256: e5e1f4caee0a01de2aee26e3138807d6d3ca2b8e67287966d1fefd65e1fd8943
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/libcrypt.so
      - /share

  - name: falconpdf
    buildsystem: simple
    build-commands:
      - ar x falconpdf.deb
      - tar -xf data.tar.* -C .
      - mkdir -p ${FLATPAK_DEST}/opt
      - cp -r opt/FalconPDF ${FLATPAK_DEST}/opt/FalconPDF
      - install -Dm755 launcher.sh ${FLATPAK_DEST}/bin/falconpdf
      - install -Dm644 com.falconpdf.app.desktop ${FLATPAK_DEST}/share/applications/com.falconpdf.app.desktop
      - install -Dm644 com.falconpdf.app.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.falconpdf.app.metainfo.xml
      - |
        for px in 16 32 48 64 128 256 512; do
          if [ -f "usr/share/icons/hicolor/${px}x${px}/apps/falconpdf.png" ]; then
            install -Dm644 "usr/share/icons/hicolor/${px}x${px}/apps/falconpdf.png" \
              "${FLATPAK_DEST}/share/icons/hicolor/${px}x${px}/apps/com.falconpdf.app.png"
          fi
        done
    sources:
      - type: file
        url: https://github.com/avrapps/falcon-pdf-app/releases/download/2026.09/falconpdf-2026.9.0-linux-amd64.deb
        sha256: f9d49c516ee3307a8f7da54a5a4baa0abb5d4182a47bfa0c39387c36f537a7e8
        dest-filename: falconpdf.deb
      - type: script
        dest-filename: launcher.sh
        commands:
          - exec /app/opt/FalconPDF/falconpdf "$@"
      - type: file
        path: com.falconpdf.app.desktop
      - type: file
        path: com.falconpdf.app.metainfo.xml
