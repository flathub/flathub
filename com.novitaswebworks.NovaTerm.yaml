app-id: com.novitaswebworks.NovaTerm
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: novaterm
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=dri
  - --filesystem=home
build-options:
  env:
    WEBKIT_DISABLE_COMPOSITING_MODE: '1'
modules:
  - name: novaterm
    buildsystem: simple
    build-commands:
      # Pnpm/Cargo build commands would go here, utilizing the flatpak sources
      - cargo build --release --locked
      - install -Dm755 src-tauri/target/release/novaterm /app/bin/novaterm
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.novitaswebworks.NovaTerm.png
      - install -Dm644 src-tauri/icons/256x256.png /app/share/icons/hicolor/256x256/apps/com.novitaswebworks.NovaTerm.png
      - install -Dm644 src-tauri/icons/512x512.png /app/share/icons/hicolor/512x512/apps/com.novitaswebworks.NovaTerm.png
      - install -Dm644 com.novitaswebworks.NovaTerm.desktop /app/share/applications/com.novitaswebworks.NovaTerm.desktop
      - install -Dm644 com.novitaswebworks.NovaTerm.metainfo.xml /app/share/metainfo/com.novitaswebworks.NovaTerm.metainfo.xml
    sources:
      - type: git
        url: https://github.com/novitaswebworks/novaterm.git
        tag: v1.3.2
      - flatpak-node-sources.json
      - flatpak-cargo-sources.json
      - type: file
        path: com.novitaswebworks.NovaTerm.desktop
      - type: file
        path: com.novitaswebworks.NovaTerm.metainfo.xml
