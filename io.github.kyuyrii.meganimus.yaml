app-id: io.github.kyuyrii.meganimus
sdk: org.kde.Sdk
runtime: org.kde.Platform
runtime-version: '6.10'
command: meganimus
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.10'
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/mnt
  - --filesystem=/run/media
  - --filesystem=~/.var/app/org.winehq.Wine

modules:
  - name: Meganimus
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/Kyuyrii/Meganimus.git
        tag: '4.3'
        commit: 6dfe638890f32db8498df4dba49abbe549523ca1
    build-commands:
      - install -Dm755 meganimus /app/bin/meganimus
      - install -Dm644 io.github.kyuyrii.meganimus.desktop /app/share/applications/io.github.kyuyrii.meganimus.desktop
      - install -Dm644 io.github.kyuyrii.meganimus.svg /app/share/icons/hicolor/scalable/apps/io.github.kyuyrii.meganimus.svg
      - install -Dm644 metainfo/io.github.kyuyrii.meganimus.metainfo.xml /app/share/metainfo/io.github.kyuyrii.meganimus.metainfo.xml
      - install -Dm644 translation/*.toml -t /app/share/Meganimus/translation
    modules:
      - modules/python3-requests.yaml
      - modules/python3-tomlkit.yaml
