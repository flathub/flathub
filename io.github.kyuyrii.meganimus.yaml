app-id: io.github.kyuyrii.meganimus
sdk: org.kde.Sdk
runtime: org.kde.Platform
runtime-version: '6.11'
command: meganimus
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: Meganimus
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/Kyuyrii/Meganimus.git
        tag: '5.1'
        commit: 7300f8b621abb751f935e412f1430e256d40a68d
    build-commands:
      - make install PREFIX=/app
    modules:
      - modules/python3-requests.yaml
      - modules/python3-tomlkit.yaml
      - modules/python3-qtawesome.yaml