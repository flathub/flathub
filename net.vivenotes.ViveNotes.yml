id: net.vivenotes.ViveNotes
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk
  - org.freedesktop.Sdk.Extension.openjdk25
command: vivenotes
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri

modules:
  - name: jbr
    buildsystem: autotools
    no-autogen: true
    no-make-install: true
    build-options:
      no-debuginfo: true
      env:
        CC: /usr/bin/gcc
        CXX: /usr/bin/g++
    config-opts:
      - --with-boot-jdk=/usr/lib/sdk/openjdk25/jvm/openjdk-25
      - --with-debug-level=release
      - --with-native-debug-symbols=none
      - --with-vendor-name=JetBrains s.r.o.
      - --with-vendor-version-string=JBR-25.0.4.1+1-635.75-nomod
      - --with-vendor-url=https://www.jetbrains.com/
      - --with-vendor-bug-url=https://youtrack.jetbrains.com/issues/JBR
      - --with-vendor-vm-bug-url=https://youtrack.jetbrains.com/issues/JBR
      - --with-jvm-features=shenandoahgc
      - --with-version-pre=
      - --with-version-build=1
      - --with-version-opt=b635.75
      - --enable-cds=yes
      - --enable-ccache
      - --with-vulkan
      - --with-wayland-protocols=/usr/share/wayland-protocols
      - --disable-warnings-as-errors
    make-args:
      - -j1
      - images
      - CONF=linux-x86_64-server-release
      - JOBS=$(FLATPAK_BUILDER_N_JOBS)
    post-install:
      - >-
        build/linux-x86_64-server-release/images/jdk/bin/jlink
        --module-path build/linux-x86_64-server-release/images/jmods
        --add-modules "$(xargs < jb/project/tools/common/modules.list | sed 's/ //g')"
        --no-man-pages --generate-cds-archive
        --output ${FLATPAK_DEST}/jbr
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/jbr/LICENSE
    sources:
      - type: archive
        url: https://github.com/JetBrains/JetBrainsRuntime/archive/refs/tags/jbr-release-25.0.4.1b635.75.tar.gz
        sha256: afb004ea032fa934886a1239ebf0b13d91b86af73c4f23308c38ec7fd1575642

  - name: math-python
    buildsystem: simple
    build-commands:
      - python3 -m pip install --prefix=${FLATPAK_DEST} --no-index --no-deps --no-cache-dir *.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/a2/09/77d55d46fd61b4a135c444fc97158ef34a095e5681d0a6c10b75bf356191/sympy-1.14.0-py3-none-any.whl
        sha256: e091cc3e99d2141a0ba2847328f5479b05d94a6635cb96148ccb3f34671bd8f5
      - type: file
        url: https://files.pythonhosted.org/packages/43/e3/7d92a15f894aa0c9c4b49b8ee9ac9850d6e63b03c9c32c0367a13ae62209/mpmath-1.3.0-py3-none-any.whl
        sha256: a0b2b9fe80bbcd81a6647ff13108738cfb482d481d826cc0e02f5b35e5c88d2c
      - type: file
        url: https://files.pythonhosted.org/packages/b6/3a/4f2e9d67277cc255a17a34c1b54e02d939ca5991bc596dee3d63e587e512/antlr4_python3_runtime-4.11.1-py3-none-any.whl
        sha256: ff1954eda1ca9072c02bf500387d0c86cb549bef4dbb3b64f39468b547ec5f6b

  - name: libink
    buildsystem: cmake-ninja
    builddir: true
    subdir: byteink/native/cmake
    build-options:
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk25/jvm/openjdk-25
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DINK_SOURCE_DIR=/run/build/libink/ink
      - -DABSEIL_SOURCE_DIR=/run/build/libink/abseil-cpp
      - -DPROTOBUF_SOURCE_DIR=/run/build/libink/protobuf
      - -DZLIB_SOURCE_DIR=/run/build/libink/zlib
      - -DLIBTESS2_SOURCE_DIR=/run/build/libink/libtess2
    post-install:
      - install -Dm644 /run/build/libink/ink/LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/ink/LICENSE
      - install -Dm644 /run/build/libink/abseil-cpp/LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/abseil-cpp/LICENSE
      - install -Dm644 /run/build/libink/protobuf/LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/protobuf/LICENSE
      - install -Dm644 /run/build/libink/zlib/LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/zlib/LICENSE
      - install -Dm644 /run/build/libink/libtess2/LICENSE.txt ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/libtess2/LICENSE.txt
    sources:
      - type: git
        url: https://github.com/CrownByte0b/ByteInk.git
        commit: 019ebc81b0f43ca3ca81ea4596645c22dabd57b8
        dest: byteink
      - type: patch
        path: patches/byteink-install-libink.patch
        dest: byteink
      - type: git
        url: https://github.com/google/ink.git
        commit: 96e50239e1c8955f7e222301661b595847d7de83
        dest: ink
      - type: patch
        paths:
          - patches/ink/0001-link-linux-against-bullseye-sysroot.patch
          - patches/ink/0002-cross-compile-windows-with-zig.patch
          - patches/ink/0003-use-android-float-angle-arithmetic.patch
          - patches/ink/0004-use-android-float-magnitude-arithmetic.patch
          - patches/ink/0005-encode-with-android-gzip.patch
          - patches/ink/0006-add-owned-geometry-snapshots.patch
          - patches/ink/0007-add-raw-input-codec.patch
          - patches/ink/0008-add-rendering-attribute-snapshots.patch
        dest: ink
      - type: git
        url: https://github.com/memononen/libtess2.git
        commit: 446bae6dfb4c3efb43cb2764379574dcb4f0ee6c
        dest: libtess2
      - type: archive
        url: https://github.com/abseil/abseil-cpp/releases/download/20260526.0/abseil-cpp-20260526.0.tar.gz
        sha256: 6e1aee535473414164bf83e4ebc40240dec71a4701f8a642d906e95bea1aea0c
        dest: abseil-cpp
      - type: archive
        url: https://github.com/protocolbuffers/protobuf/releases/download/v33.5/protobuf-33.5.tar.gz
        sha256: c6c7c27fadc19d40ab2eaa23ff35debfe01f6494a8345559b9bb285ce4144dd1
        dest: protobuf
      - type: archive
        url: https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
        sha256: 9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23
        dest: zlib

  - name: vivenotes
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/openjdk/bin
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk/jvm/openjdk-27
        GRADLE_USER_HOME: /run/build/vivenotes/gradle-home
        VIVE_OFFLINE_REPOSITORY: /run/build/vivenotes/offline-repository
    build-commands:
      - rm gradle/gradle-daemon-jvm.properties
      - >-
        gradle-dist/bin/gradle --offline --no-daemon --no-configuration-cache
        --init-script packaging/flathub/offline-repository.init.gradle.kts
        -Porg.gradle.java.installations.auto-download=false
        -PbyteinkCompositePath=byteink
        -PbyteinkBundledPlatforms=linux-x86_64
        -PbyteinkLinuxLibrary=/app/lib/libink.so
        -Pvive.googleDesktopClientId=767091346691-f4qam7qkmglevkc70vr6vo4g2t139t6o.apps.googleusercontent.com
        :desktopApp:stageFlatpak
      - >-
        python3 -B packaging/flathub/install.py
        --version "$(sed -n 's/^version=//p' gradle.properties)"
        --date "$(git log -1 --no-show-signature --format=%cs)"
    sources:
      - type: git
        url: https://github.com/CrownByte0b/viveNotes-multiplataform.git
        commit: 194451a03b4e8a0e904a9e74f456713c81fe1b20
      - type: git
        url: https://github.com/CrownByte0b/ByteInk.git
        commit: 019ebc81b0f43ca3ca81ea4596645c22dabd57b8
        dest: byteink
      - type: archive
        url: https://services.gradle.org/distributions/gradle-9.8.2-bin.zip
        sha256: 21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607
        dest: gradle-dist
      - type: file
        path: vivenotes
        dest: packaging/flathub
      - maven-sources.json
