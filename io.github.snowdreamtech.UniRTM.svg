<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g stroke="#1E5095" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
    <rect x="192" y="256" width="640" height="576" rx="64" fill="#ffffff" />
    <line x1="192" y1="544" x2="832" y2="544" fill="none" />
    <line x1="512" y1="256" x2="512" y2="832" fill="none" />
    <path d="M 384 256 V 192 A 64 64 0 0 1 448 128 H 576 A 64 64 0 0 1 640 192 V 256" fill="none" />
  </g>

  <!-- Top Left: Shield (Blue) -->
  <g transform="translate(224, 272)">
    <g transform="translate(25.6, 25.6) scale(0.8)">
      <path d="M 128 24 L 48 56 V 120 C 48 172 80 208 128 232 C 176 208 208 172 208 120 V 56 Z" fill="none" stroke="#1E5095" stroke-width="40" stroke-linejoin="round" />
      <path d="M 88 128 L 112 152 L 168 96" fill="none" stroke="#1E5095" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Top Right: Gear (Orange) -->
  <g transform="translate(544, 272)">
    <g transform="translate(25.6, 25.6) scale(0.8)">
      <!-- Gear outer -->
      <path d="M 128 192 A 64 64 0 1 0 128 64 A 64 64 0 1 0 128 192 Z" fill="none" stroke="#EA580C" stroke-width="40" />
      <!-- Gear teeth -->
      <path d="M 128 48 V 16 M 128 208 V 240 M 72 72 L 49 49 M 184 184 L 207 207 M 48 128 H 16 M 208 128 H 240 M 72 184 L 49 207 M 184 72 L 207 49" stroke="#EA580C" stroke-width="40" stroke-linecap="round" />
      <!-- Play button inside gear -->
      <polygon points="108,104 108,152 156,128" fill="#EA580C" />
    </g>
  </g>

  <!-- Bottom Left: Chart (Cyan, Orange, Purple) -->
  <g transform="translate(224, 560)">
    <!-- Bars -->
    <rect x="48" y="136" width="32" height="80" fill="#28B6D4" rx="8" />
    <rect x="112" y="184" width="32" height="32" fill="#EA580C" rx="8" />
    <rect x="176" y="88" width="32" height="128" fill="#7C3AED" rx="8" />

    <!-- Line graph -->
    <path d="M 64 120 L 128 152 L 192 56" fill="none" stroke="#1E5095" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="64" cy="120" r="16" fill="#1E5095" />
    <circle cx="128" cy="152" r="16" fill="#1E5095" />
    <circle cx="192" cy="56" r="16" fill="#1E5095" />
  </g>

  <!-- Bottom Right: Cloud (Purple/Teal) -->
  <g transform="translate(544, 560)">
    <g transform="translate(25.6, 25.6) scale(0.8)">
      <!-- Arrows below cloud -->
      <g fill="#28B6D4">
        <!-- Down arrow -->
        <rect x="88" y="144" width="16" height="64" />
        <polygon points="96,256 72,208 120,208" />

        <!-- Up arrow -->
        <rect x="152" y="192" width="16" height="64" />
        <polygon points="160,144 136,192 184,192" />
      </g>
      <!-- Cloud shape -->
      <path d="M 80 112 A 32 32 0 0 1 80 48 A 48 48 0 0 1 176 48 A 32 32 0 0 1 176 112 Z" fill="#ffffff" stroke="#7C3AED" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
