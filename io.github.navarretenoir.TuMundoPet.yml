# tumundopet — manifiesto Flathub (compila desde el código). Desarrollado por Javiera Navarrete.
id: io.github.navarretenoir.TuMundoPet
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: tumundopet
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: tumundopet
    buildsystem: simple
    build-commands:
      - make -C desktop
      - install -Dm755 desktop/tumundopet /app/bin/tumundopet
      - install -Dm644 linux/io.github.navarretenoir.TuMundoPet.desktop /app/share/applications/io.github.navarretenoir.TuMundoPet.desktop
      - install -Dm644 linux/io.github.navarretenoir.TuMundoPet.metainfo.xml /app/share/metainfo/io.github.navarretenoir.TuMundoPet.metainfo.xml
      - install -Dm644 linux/io.github.navarretenoir.TuMundoPet.svg /app/share/icons/hicolor/scalable/apps/io.github.navarretenoir.TuMundoPet.svg
    sources:
      - type: git
        url: https://github.com/navarretenoir/tumundopet.git
        tag: v1.1.0
        commit: 0bb6504e2fd836e777c01b8f69d9a2684524c866
