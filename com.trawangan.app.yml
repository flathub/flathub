app-id: com.trawangan.app
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: trawangan

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
  env:
    CARGO_HOME: /run/build/trawangan/cargo
    npm_config_cache: /run/build/trawangan/npm-cache

modules:
  - name: trawangan
    buildsystem: simple
    build-commands:
      # Build frontend SvelteKit secara offline dari npm-cache
      - npm ci --offline --ignore-scripts
      - npm run build
      # Build backend Rust/Tauri secara offline dari cargo vendor
      - cargo build --manifest-path src-tauri/Cargo.toml --release --offline
      # Install biner, ikon, desktop entry, dan AppStream metadata
      - install -Dm755 src-tauri/target/release/tauri-app /app/bin/trawangan
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/com.trawangan.app.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.trawangan.app.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/com.trawangan.app.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.trawangan.app.png
      - install -Dm644 packaging/flatpak/com.trawangan.app.desktop /app/share/applications/com.trawangan.app.desktop
      - install -Dm644 packaging/flatpak/com.trawangan.app.metainfo.xml /app/share/metainfo/com.trawangan.app.metainfo.xml
    sources:
      - type: git
        url: https://github.com/KaleksananBarqi/trawangan.git
        commit: 7c53d0e04eea569f6f4849e79c6c42d6db3b98f3
      - node-sources.json
      - cargo-sources.json
