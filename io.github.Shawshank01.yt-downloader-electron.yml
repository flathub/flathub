app-id: io.github.Shawshank01.yt-downloader-electron
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: yt-downloader
separate-locales: false
finish-args:
  # Network access for downloading media and AI model APIs
  - --share=network
  # Display & IPC
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Audio
  - --socket=pulseaudio
  # Hardware GPU acceleration
  - --device=dri
  # Access to Downloads directory
  - --filesystem=xdg-download
  # Access to choose custom folders
  - --filesystem=home:ro
modules:
  - name: yt-downloader
    buildsystem: simple
    build-commands:
      # Extract AppImage
      - chmod +x yt-downloader.AppImage
      - ./yt-downloader.AppImage --appimage-extract
      # Install application bundle into /app/lib
      - install -d /app/lib/yt-downloader
      - cp -r squashfs-root/* /app/lib/yt-downloader/
      # Install wrapper script
      - install -D -m 755 yt-downloader.sh /app/bin/yt-downloader
      # Install desktop file, metainfo, and icon
      - install -D -m 644 io.github.Shawshank01.yt-downloader-electron.desktop /app/share/applications/io.github.Shawshank01.yt-downloader-electron.desktop
      - install -D -m 644 io.github.Shawshank01.yt-downloader-electron.metainfo.xml /app/share/metainfo/io.github.Shawshank01.yt-downloader-electron.metainfo.xml
      - install -D -m 644 io.github.Shawshank01.yt-downloader-electron.png /app/share/icons/hicolor/512x512/apps/io.github.Shawshank01.yt-downloader-electron.png
    sources:
      # Intel / AMD (x86_64)
      - type: file
        url: https://github.com/Shawshank01/yt-downloader-electron/releases/download/v4.5.1/YT-Downloader-linux-x86_64-4.5.1.AppImage
        sha256: f0231376f98e4383b0861f3b480d646e0a93d4d9c25df9d4c24f138a24f57f9b
        dest-filename: yt-downloader.AppImage
        only-arches: [x86_64]
      # ARM64 (aarch64)
      - type: file
        url: https://github.com/Shawshank01/yt-downloader-electron/releases/download/v4.5.1/YT-Downloader-linux-arm64-4.5.1.AppImage
        sha256: 77e3687ee147ae27fc598dadfebdc507f073ed6684cb862870bd5c6328cea28b
        dest-filename: yt-downloader.AppImage
        only-arches: [aarch64]
      - type: file
        path: yt-downloader.sh
      - type: file
        path: io.github.Shawshank01.yt-downloader-electron.desktop
      - type: file
        path: io.github.Shawshank01.yt-downloader-electron.metainfo.xml
      - type: file
        path: io.github.Shawshank01.yt-downloader-electron.png
