app-id: com.cbsalgo.CBSChat
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: cbschat
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all                                   # webcams for video calls
  - --filesystem=xdg-download                      # saving attachments
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets            # Electron safeStorage via libsecret
  - --talk-name=org.kde.kwalletd5                  # Electron safeStorage on Plasma 5
  - --talk-name=org.kde.kwalletd6                  # Electron safeStorage on Plasma 6
  - --talk-name=org.kde.StatusNotifierWatcher      # tray icon
  - --own-name=org.kde.StatusNotifierItem-2-1      # tray icon (Chromium registers this name inside the sandbox)
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=org.freedesktop.ScreenSaver        # idle detection during calls
modules:
  - name: cbschat
    buildsystem: simple
    build-options:
      no-debuginfo: true
      strip: false
    sources:
      - type: file
        url: https://cbschat.com/indir/dosyalar/2026.1124.170005/CBSChat-2026.1124.170005-linux-amd64.deb
        sha256: 03a8e349d0107115bd776b7e2b437861210e031cab68933bc6b5111850af87b4
        dest-filename: cbschat.deb
        only-arches:
          - x86_64
      - type: file
        path: cbschat.sh
      - type: file
        path: com.cbsalgo.CBSChat.desktop
      - type: file
        path: com.cbsalgo.CBSChat.metainfo.xml
    build-commands:
      - ar x cbschat.deb data.tar.xz
      - tar -xf data.tar.xz ./opt/CBSChat ./usr/share/icons
      - cp -a opt/CBSChat ${FLATPAK_DEST}/cbschat
      - rm -f ${FLATPAK_DEST}/cbschat/chrome-sandbox ${FLATPAK_DEST}/cbschat/cbschat-launcher
      - install -Dm755 cbschat.sh ${FLATPAK_DEST}/bin/cbschat
      - install -Dm644 com.cbsalgo.CBSChat.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 com.cbsalgo.CBSChat.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - for s in 16 32 48 64 128 256 512; do install -Dm644 usr/share/icons/hicolor/${s}x${s}/apps/cbschat.png ${FLATPAK_DEST}/share/icons/hicolor/${s}x${s}/apps/${FLATPAK_ID}.png; done
