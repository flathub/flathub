id: fr.cnil.PIA
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: pia
separate-locales: false

finish-args:
  # Display
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The PIA software needs network access for the optional client/server mode
  - --share=network

modules:
  - name: pia
    buildsystem: simple
    build-commands:
      # Install the unpacked Electron application
      - mkdir -p /app/main
      - cp -a app/. /app/main/
      # Make the Electron window match the fr.cnil.PIA desktop file
      - patch-electron-desktop-filename /app/main/resources/app.asar
      # Launcher wrapper (uses the Electron base-app zypak sandbox helper)
      - install -Dm755 pia.sh /app/bin/pia
      # Desktop integration files
      - install -Dm644 fr.cnil.PIA.desktop /app/share/applications/fr.cnil.PIA.desktop
      - install -Dm644 fr.cnil.PIA.metainfo.xml /app/share/metainfo/fr.cnil.PIA.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/fr.cnil.PIA.png
      - install -Dm644 PIA-LICENSE /app/share/licenses/fr.cnil.PIA/LICENSE
    sources:
      # Prebuilt application produced by `yarn electron:linux` (tar.gz target).
      # Update the version, url and sha256 for every release.
      - type: archive
        url: https://github.com/LINCnil/pia/releases/download/v4.1.1/pia-4.1.1.tar.gz
        sha256: 840c5c93334fe7902340c757408ef69ada0b3f33c44a8d070e0f4eaddad5e894
        strip-components: 1
        dest: app
      - type: file
        path: pia.sh
      - type: file
        url: https://raw.githubusercontent.com/LINCnil/pia/c4a0d38a04798b7dadd1c72ad223b4c4c20712f1/flatpak/fr.cnil.PIA.desktop
        sha256: 9a5ecae6b734db8256f3a106421cbca7deb180e25502e357b8653730094aa9e6
      - type: file
        url: https://raw.githubusercontent.com/LINCnil/pia/c4a0d38a04798b7dadd1c72ad223b4c4c20712f1/flatpak/fr.cnil.PIA.metainfo.xml
        sha256: 475bb6eb001316b4a3b92b7b700b31d7b76a6fff2e85fe2be2c85077698acba5
      - type: file
        url: https://raw.githubusercontent.com/LINCnil/pia/c4a0d38a04798b7dadd1c72ad223b4c4c20712f1/electron/icons/icon.png
        sha256: ebb71f7254f2c862d2277a527ed18746591305088086040b98e5fc9bc43a1529
        dest-filename: icon.png
      - type: file
        url: https://raw.githubusercontent.com/LINCnil/pia/c4a0d38a04798b7dadd1c72ad223b4c4c20712f1/LICENSE
        sha256: c05b0b2ce84cbc6457148985e2b065be862a441db1788bb036501ac8a741d1e7
        dest-filename: PIA-LICENSE
