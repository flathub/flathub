id: fr.cnil.PIA
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: pia
separate-locales: false

finish-args:
  # Display
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The PIA software needs network access for the optional client/server mode
  - --share=network

modules:
  - name: pia
    buildsystem: simple
    build-commands:
      # Install the unpacked Electron application
      - mkdir -p /app/main
      - cp -a app/. /app/main/
      # Make the Electron window match the fr.cnil.PIA desktop file
      - patch-electron-desktop-filename /app/main/resources/app.asar
      # Launcher wrapper (uses the Electron base-app zypak sandbox helper)
      - install -Dm755 pia.sh /app/bin/pia
      # Desktop integration files
      - install -Dm644 app/fr.cnil.PIA.desktop /app/share/applications/fr.cnil.PIA.desktop
      - install -Dm644 app/fr.cnil.PIA.metainfo.xml /app/share/metainfo/fr.cnil.PIA.metainfo.xml
      - install -Dm644 app/icon.png /app/share/icons/hicolor/512x512/apps/fr.cnil.PIA.png
      - install -Dm644 app/LICENSE /app/share/licenses/fr.cnil.PIA/LICENSE
    sources:
      # Prebuilt application produced by `yarn electron:linux:archives`.
      # Update the version, url and sha256 for every release.
      - type: archive
        url: https://github.com/LINCnil/pia/releases/download/v4.2.0/pia-4.2.0.tar.gz
        sha256: 0b8e474719aa505128e7406488cf7e6157323c736499dc7740788e8f603d835b
        only-arches: [x86_64]
        strip-components: 1
        dest: app
      - type: archive
        url: https://github.com/LINCnil/pia/releases/download/v4.2.0/pia-4.2.0-arm64.tar.gz
        sha256: c54d32dc53fd36f96865403da653cced6fb9269a87c1536677240962247c5a90
        only-arches: [aarch64]
        strip-components: 1
        dest: app
      - type: file
        path: pia.sh
