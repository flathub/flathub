app-id: io.github.samuelkriegerbonini_dev.AstroBurst
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: astroburst

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --env=WEBKIT_DISABLE_COMPOSITING_MODE=1

modules:
  - name: astroburst
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node20/bin:/usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/astroburst/cargo
        CARGO_NET_OFFLINE: 'true'
        XDG_CACHE_HOME: /run/build/astroburst/flatpak-node/cache
        npm_config_cache: /run/build/astroburst/flatpak-node/npm-cache
        npm_config_offline: 'true'
    sources:
      - type: git
        url: https://github.com/samuelkriegerbonini-dev/AstroBurst.git
        tag: v0.5.5.2
        commit: 3170e89bd647168c0dd753962dca458bb659cf33
      - node-sources.json
      - cargo-sources.json
      # pnpm vendored offline: the Flathub build runs with --unshare=network, so
      # corepack cannot fetch pnpm from registry.npmjs.org. Ship the pnpm CLI tarball.
      # Must be pnpm 10.x to match the offline store layout (store_version v10) that
      # flatpak-node-generator produced in node-sources.json.
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-10.28.0.tgz
        sha512: 05df71d1421f21399e053fde567cea34d446fa02c76571441bfc1c7956e98e363088982d940465fd34480d4d90a0668bc12362f8aa88000a64e83d0b0e47be48
        strip-components: 1
        dest: flatpak-node/pnpm
    build-commands:
      - install -d /app/bin
      - node flatpak-node/pnpm/bin/pnpm.cjs install --offline --frozen-lockfile
      - cargo --offline fetch --manifest-path src-tauri/Cargo.toml
      - node flatpak-node/pnpm/bin/pnpm.cjs tauri build --no-bundle
      - install -Dm755 src-tauri/target/release/astroburst /app/bin/astroburst
      - install -Dm644 data/io.github.samuelkriegerbonini_dev.AstroBurst.desktop /app/share/applications/io.github.samuelkriegerbonini_dev.AstroBurst.desktop
      # metainfo screenshots point at the v0.4.6 tag where 2 of 4 images 404; all 4 exist at v0.4.7.
      - sed -i 's|/AstroBurst/v0.4.6/|/AstroBurst/v0.4.7/|g' data/io.github.samuelkriegerbonini_dev.AstroBurst.metainfo.xml
      - install -Dm644 data/io.github.samuelkriegerbonini_dev.AstroBurst.metainfo.xml /app/share/metainfo/io.github.samuelkriegerbonini_dev.AstroBurst.metainfo.xml
      - install -Dm644 data/io.github.samuelkriegerbonini_dev.AstroBurst.xml /app/share/mime/packages/io.github.samuelkriegerbonini_dev.AstroBurst.xml
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.samuelkriegerbonini_dev.AstroBurst.png
      - install -Dm644 src-tauri/icons/256x256.png /app/share/icons/hicolor/256x256/apps/io.github.samuelkriegerbonini_dev.AstroBurst.png
      - install -Dm644 src-tauri/icons/512x512.png /app/share/icons/hicolor/512x512/apps/io.github.samuelkriegerbonini_dev.AstroBurst.png