app-id: com.aeroclipse.omoji
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: omoji

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: omoji
    buildsystem: simple
    build-commands:
      - install -D -m755 bin/omoji /app/bin/omoji
      - install -D -m644 com.aeroclipse.omoji.desktop /app/share/applications/com.aeroclipse.omoji.desktop
      - install -D -m644 com.aeroclipse.omoji.metainfo.xml /app/share/metainfo/com.aeroclipse.omoji.metainfo.xml
      - install -D -m644 app-logo.png /app/share/icons/hicolor/256x256/apps/com.aeroclipse.omoji.png
    sources:
      - type: git
        url: https://aeroclipse-bw.web.app
        tag: v1.2.6
        commit: 59f02e5314e2ee25fa12263306fc111b70b17cb9 # Replace with your actual full git commit SHA