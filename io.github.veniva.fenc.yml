id: io.github.veniva.fenc
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: file_encrypter

finish-args:
  # Display access and GPU rendering for the Flutter GTK runner.
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # The app browses and modifies files directly, without a portal folder picker.
  - --filesystem=home
  # Needed only if will use portals 
  #- --env=GTK_USE_PORTAL=1

modules:
  - name: file-encrypter
    buildsystem: simple
    build-commands:
      # The archive already contains the launcher, runtime bundle, metadata, icon, and license.
      - mkdir -p "${FLATPAK_DEST}"
      - cp -a bin lib share "${FLATPAK_DEST}/"
    sources:
      - type: archive
        url: https://github.com/veniva/fenc/releases/download/v1.1.5/fenc-1.1.5-linux-x86_64.tar.gz
        sha256: f9f0203663c5cf9ae25fdc465db7bc53702ab815f196622e056ad287ea6aea43
        strip-components: 1
