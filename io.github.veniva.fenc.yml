id: io.github.veniva.fenc
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: file_encrypter

finish-args:
  # Display access and GPU rendering for the Flutter GTK runner.
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # The app browses and modifies files directly, without a portal folder picker.
  - --filesystem=home
  - --env=FONTCONFIG_FILE=/app/share/fontconfig/io.github.veniva.fenc.conf
  # Needed only if will use portals 
  #- --env=GTK_USE_PORTAL=1

modules:
  - name: file-encrypter
    buildsystem: simple
    build-commands:
      # The archive already contains the launcher, runtime bundle, metadata, icon, and license.
      - mkdir -p "${FLATPAK_DEST}"
      - cp -a bin lib share "${FLATPAK_DEST}/"
    sources:
      - type: archive
        url: https://github.com/veniva/fenc/releases/download/v1.1.5/fenc-1.1.5-linux-x86_64-flatpak.tar.gz
        sha256: df0f968ed1111f4d0d38468a50a5d8cfb9b1cf6e072ac93da53f2a454ba43f35
        strip-components: 1
