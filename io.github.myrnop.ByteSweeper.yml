id: io.github.myrnop.ByteSweeper
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: bytesweeper

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: bytesweeper
    buildsystem: simple
    build-commands:
      - install -Dm755 ByteSweeper.py /app/bin/bytesweeper
      - install -Dm644 io.github.myrnop.ByteSweeper.desktop /app/share/applications/io.github.myrnop.ByteSweeper.desktop
      - install -Dm644 io.github.myrnop.ByteSweeper.metainfo.xml /app/share/metainfo/io.github.myrnop.ByteSweeper.metainfo.xml
      - install -Dm644 io.github.myrnop.ByteSweeper.svg /app/share/icons/hicolor/scalable/apps/io.github.myrnop.ByteSweeper.svg
    sources:
      - type: git
        url: https://github.com/myrnop/ByteSweeper.git
        commit: 588ebc15a276d2f524e8962832b14a7a59facd13