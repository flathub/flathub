id: io.github.DarkPhilosophy.v
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: vencord-forge
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Downloads Vencord's source, Node.js, pnpm and OpenAsar to build the selected Vencord.
  - --share=network
  # Restricted mode: no host commands. Forge installs only into Discord installed as a per-user
  # Flatpak, whose files belong to the user: its packaged app (Discord's startup files) and the
  # Vencord runtime beside Discord's own data, where Discord's sandbox can read it.
  - --env=FORGE_SANDBOX_MODE=filesystem
  - --filesystem=~/.local/share/flatpak/app/com.discordapp.Discord
  - --filesystem=~/.var/app/com.discordapp.Discord/config/Vencord:create
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/vencord-forge/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: vencord-forge
    buildsystem: simple
    subdir: forge
    build-commands:
      - cargo --offline build --release --locked -p vencord-forge
      - install -Dm755 target/release/vencord-forge -t /app/bin
      - install -Dm644 gui/assets/icon.svg /app/share/icons/hicolor/scalable/apps/io.github.DarkPhilosophy.v.svg
      - install -Dm644 ../packaging/flatpak/io.github.DarkPhilosophy.v.desktop -t /app/share/applications
      - install -Dm644 ../packaging/flatpak/io.github.DarkPhilosophy.v.metainfo.xml -t /app/share/metainfo
    sources:
      - type: git
        url: https://github.com/DarkPhilosophy/v.git
        tag: forge-v0.1.3
        commit: 7f416e6345fd807c1ae3343361c5f787c993a250
      - cargo-sources.json
