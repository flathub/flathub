id: io.github.DarkPhilosophy.v
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: vencord-forge
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Downloads Vencord's source, Node.js, pnpm and OpenAsar to build the selected Vencord.
  - --share=network
  # The Vencord runtime and the saved plugin selection, which Discord loads from here.
  - --filesystem=xdg-config/Vencord:create
  # Discord's own files are outside the sandbox (/opt, /var/lib/flatpak, ~/.config/discord*):
  # detecting Discord and replacing its startup files run on the host through flatpak-spawn,
  # with pkexec when they are system-owned.
  - --talk-name=org.freedesktop.Flatpak
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/vencord-forge/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: vencord-forge
    buildsystem: simple
    subdir: forge
    build-commands:
      - cargo --offline build --release --locked -p vencord-forge
      - install -Dm755 target/release/vencord-forge -t /app/bin
      - install -Dm644 gui/assets/icon.svg /app/share/icons/hicolor/scalable/apps/io.github.DarkPhilosophy.v.svg
      - install -Dm644 ../packaging/flatpak/io.github.DarkPhilosophy.v.desktop -t /app/share/applications
      - install -Dm644 ../packaging/flatpak/io.github.DarkPhilosophy.v.metainfo.xml -t /app/share/metainfo
    sources:
      - type: git
        url: https://github.com/DarkPhilosophy/v.git
        tag: forge-v0.1.0
        commit: 7576b8852de43c7ade1322f0dea853418ada0227
      - cargo-sources.json
