app-id: com.buga.mmgenerator
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: mm-generator

finish-args:
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh

  - name: mm-generator
    buildsystem: simple
    build-commands:
      # Install distribution binaries and libraries
      - install -d /app/lib/mm-generator
      - cp -r bin /app/lib/mm-generator/
      - cp -r lib /app/lib/mm-generator/
      
      # Install launch wrapper
      - install -D -m 755 mm-generator-wrapper.sh /app/bin/mm-generator
      
      # Install desktop integration and icons
      - install -D -m 644 com.buga.mmgenerator.desktop /app/share/applications/com.buga.mmgenerator.desktop
      - install -D -m 644 com.buga.mmgenerator.metainfo.xml /app/share/metainfo/com.buga.mmgenerator.metainfo.xml
      - install -D -m 644 com.buga.mmgenerator.svg /app/share/icons/hicolor/scalable/apps/com.buga.mmgenerator.svg

    sources:
      - type: archive
        url: https://github.com/AlfonsoFichas-bit/mm-generator/releases/download/v1.0.0/mm-generator-1.0.0.tar.gz
        sha256: 2968cfdc2d4d664da2d4091ed9c9680ea54cb1691d7e68b6499555f5546ea02a
      - type: file
        path: mm-generator-wrapper.sh
      - type: file
        path: com.buga.mmgenerator.desktop
      - type: file
        path: com.buga.mmgenerator.metainfo.xml
      - type: file
        path: com.buga.mmgenerator.svg
