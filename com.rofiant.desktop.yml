app-id: com.rofiant.desktop
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: desktop
add-build-extensions:
  org.freedesktop.Sdk.Extension.rust-stable:
    directory: lib/sdk/rust-stable
    version: '25.08'
    remove-after-build: true
  org.freedesktop.Sdk.Extension.node24:
    directory: lib/sdk/node24
    version: '25.08'
    remove-after-build: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: kirobot
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin:/run/build/kirobot/pnpm-standalone
      env:
        CARGO_HOME: /run/build/kirobot/cargo
        CARGO_NET_OFFLINE: 'true'
        VITE_API_URL: https://kirobots-backend-production.up.railway.app
        VITE_SUPABASE_URL: https://xovrsykaklfydrnvicps.supabase.co
        VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvdnJzeWtha2xmeWRybnZpY3BzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxOTExMzYsImV4cCI6MjEwMjc2NzEzNn0.Tbsh5xGOBx2ORrzvYqiPbHqWk3z1qlm9GeG85jVRZf0
        VITE_HCAPTCHA_SITE_KEY: cb54660a-d710-4468-9c86-447a3e30e7a0
    build-commands:
      - cd apps/desktop && pnpm install --offline --frozen-lockfile --trust-lockfile --store-dir /run/build/kirobot/flatpak-node/pnpm-store
      - cd apps/desktop && pnpm build
      - cd apps/desktop/src-tauri && cargo build --offline --release
      - install -Dm755 apps/desktop/src-tauri/target/release/desktop ${FLATPAK_DEST}/bin/desktop
      - install -Dm644 apps/desktop/src-tauri/icons/32x32.png ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/com.rofiant.desktop.png
      - install -Dm644 apps/desktop/src-tauri/icons/128x128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/com.rofiant.desktop.png
      - install -Dm644 "apps/desktop/src-tauri/icons/128x128@2x.png" ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/com.rofiant.desktop.png
      - install -Dm644 apps/desktop/src-tauri/icons/icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/com.rofiant.desktop.png
      - install -Dm644 com.rofiant.desktop.desktop ${FLATPAK_DEST}/share/applications/com.rofiant.desktop.desktop
      - install -Dm644 com.rofiant.desktop.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.rofiant.desktop.metainfo.xml
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/com.rofiant.desktop/LICENSE
    sources:
      - type: git
        url: https://github.com/RofiantAI/Rofiant.git
        commit: 76b4b6dd5f7a389b6312ab5b9d08af0dd8a1a688
      - type: archive
        url: https://github.com/pnpm/pnpm/releases/download/v11.3.0/pnpm-linux-x64.tar.gz
        sha256: 6eb506b53297eb1186ba0cbff1577bb26d17713835a01a5342dcafae550827ce
        dest: pnpm-standalone
        strip-components: 0
      - type: file
        path: com.rofiant.desktop.desktop
      - type: file
        path: com.rofiant.desktop.metainfo.xml
      - cargo-sources.json
      - generated-sources.json
