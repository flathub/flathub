app-id: io.github.rizwanmehboob.Presence
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: presence

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --device=all
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/mnt
  - --filesystem=xdg-download
  - --system-talk-name=org.freedesktop.UDisks2

modules:
  - name: presence
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DPRESENCE_INSTALL_POLKIT=OFF
    post-install:
      - install -Dm644 screenshots/main-window.png /app/share/app-info/media/io/github/rizwanmehboob/Presence/screenshots/main-window.png
      - install -Dm644 screenshots/options.png /app/share/app-info/media/io/github/rizwanmehboob/Presence/screenshots/options.png
    sources:
      - type: archive
        url: https://github.com/rizwanmehboob/presence/archive/refs/tags/v1.0.0.tar.gz
        sha256: fe68aef445b7407f95961988ebd66147595687932c3fdccca1bdbabd344e8ddd
