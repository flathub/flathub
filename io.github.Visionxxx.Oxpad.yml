app-id: io.github.Visionxxx.Oxpad
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: oxpad-gui
finish-args:
  # egui window (X11/Wayland + GPU); file dialogs go through XDG portals
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/oxpad/cargo
modules:
  - name: oxpad
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo --offline build --release
      - install -Dm755 target/release/oxpad-gui /app/bin/oxpad-gui
      - install -Dm755 target/release/oxpad /app/bin/oxpad
      - install -Dm644 assets/oxpad.svg /app/share/icons/hicolor/scalable/apps/io.github.Visionxxx.Oxpad.svg
      - install -Dm644 assets/oxpad-256.png /app/share/icons/hicolor/256x256/apps/io.github.Visionxxx.Oxpad.png
      - sed 's/^Icon=oxpad$/Icon=io.github.Visionxxx.Oxpad/' assets/oxpad.desktop > io.github.Visionxxx.Oxpad.desktop
      - install -Dm644 io.github.Visionxxx.Oxpad.desktop /app/share/applications/io.github.Visionxxx.Oxpad.desktop
      - install -Dm644 io.github.Visionxxx.Oxpad.metainfo.xml /app/share/metainfo/io.github.Visionxxx.Oxpad.metainfo.xml
    sources:
      - type: git
        url: https://github.com/Visionxxx/oxpad.git
        tag: v0.3.1
        commit: 8788643b48b6c17c0069d65a5eff81b9719a601a
      - cargo-sources.json
