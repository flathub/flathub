# =============================================================================
# 群侠集结 - Flatpak 应用清单 (上架 Flathub 用, 闭源/预编译二进制)
# -----------------------------------------------------------------------------
# App ID: net.de5.qunxia.dream
#   反向域名, 基于你注册的域名 qunxia.de5.net (反向 = net.de5.qunxia)
#   再加产品名 dream => net.de5.qunxia.dream。Flathub 要求 ID 来自你控制的域名,
#   且每一段(标签)都不能以数字开头 (net/de5/qunxia/dream 均合法)。
#
# 闭源(预编译)发布说明:
#   * 二进制不是现场编译, 而是【预编译】产物 (在 Flatpak 25.08 SDK / 宿主
#     aarch64 交叉编译器产出, 见 build-sdl3*.sh / build-launcher*.sh /
#     build-dylib*.sh)。上架 Flathub 不能引用本地路径, 故改为 type: extra-data
#     从你自己的托管地址下载预编译 tar 包 (sha256 校验), 安装时由终端用户拉取。
#   * runtime 选 25.08 (支持到 2027-09-01); 26.08 发版后可改 runtime-version。
#   * 游戏数据(~2GB)不在二进制包内: 请改用 extra-data 在 install 时下载大包,
#     或引导用户在启动器内导入(沙箱内库目录落在 ~/.var/app/<id>/)。
#   * 已移除 --filesystem=host (Flathub 安全审查硬性要求)。
#
# 本地验证构建 (仍可用, 此时需把 extra-data 换回 type:dir 指向 output/.../flatpak):
#   flatpak-builder --user --install --force-clean build-flatpak net.de5.qunxia.dream.yml
#   flatpak run net.de5.qunxia.dream
#
# 提交 Flathub:
#   1) 把本清单与 .desktop/.metainfo.xml/icon.svg 放进你 fork 的
#      flathub/flathub 仓库的 apps/net.de5.qunxia.dream/ 目录
#      (清单文件名 = net.de5.qunxia.dream.yml)
#   2) 在 qunxia.de5.net/releases/ 托管两个 tar 包 (见 make-bin-tar.sh)
#   3) 跑 make-bin-tar.sh 会自动生成 release/ 文件夹 (含本清单, 已填好
#      sha256 与版本), 把 release/ 的 4 个文件提交到 apps/net.de5.qunxia.dream/
#   4) 提 PR 到 flathub/flathub, 等 Flathub 机器人构建 + 人工审核
# =============================================================================

app-id: net.de5.qunxia.dream
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: qunxia_launcher
license: Proprietary

# 跳过 debuginfo 分离 (预编译二进制已带调试信息, 分离与否不影响运行)
build-options:
  no-debuginfo: true

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=wayland
  - --socket=x11
  - --socket=pulseaudio
  - --share=network                       # 下载/更新游戏、联机

modules:
  - name: dreamjianghu
    buildsystem: simple
    sources:
      # ---- 闭源预编译二进制: x86_64 ----
      - type: extra-data
        only-arches: [x86_64]
        filename: dreamjianghu-bin.tar.gz
        url: https://qunxia.de5.net/releases/dreamjianghu-linux-amd64-1.0.0.tar.gz
        sha256: 33671f3cf2452d05fb658039963ec3dd9e1772b7c14643408fe6163f44deeb42
        x-checker-data:
          type: html
          url: https://qunxia.de5.net/releases/
          version-pattern: 'dreamjianghu-linux-amd64-([0-9.]+)\.tar\.gz'
          url-pattern: 'dreamjianghu-linux-amd64-([0-9.]+)\.tar\.gz'
      # ---- 闭源预编译二进制: aarch64 ----
      - type: extra-data
        only-arches: [aarch64]
        filename: dreamjianghu-bin.tar.gz
        url: https://qunxia.de5.net/releases/dreamjianghu-linux-aarch64-1.0.0.tar.gz
        sha256: c4bd189891452503b80f68db14c72d1ef54cd933397af62226f9d6bba12da93b
        x-checker-data:
          type: html
          url: https://qunxia.de5.net/releases/
          version-pattern: 'dreamjianghu-linux-aarch64-([0-9.]+)\.tar\.gz'
          url-pattern: 'dreamjianghu-linux-aarch64-([0-9.]+)\.tar\.gz'
      # ---- 元数据 (随仓库提交) ----
      - type: file
        path: net.de5.qunxia.dream.desktop
      - type: file
        path: net.de5.qunxia.dream.metainfo.xml
      - type: file
        path: icon.svg
    build-commands:
      # 解包预编译二进制 (tar 内顶层即为下面的文件)
      - tar -xzf dreamjianghu-bin.tar.gz
      # 启动器 + 4 个运行时 dylib (同目录, 经 $ORIGIN 互相定位)
      - install -Dm755 -t /app/bin qunxia_launcher
      - install -Dm755 -t /app/bin libqunxia.so libqunxia52.so libqunxia54.so
      # 共享 SDL3 (动态库, 启动器与 dylib 共用同一实例, 避免点封面冻屏)
      - install -Dm755 -t /app/bin libSDL3.so
      - ln -sf libSDL3.so /app/bin/libSDL3.so.0
      # 字体必须和二进制同目录 (UI.mm 用 SDL_GetBasePath()+"font.ttf")
      - install -Dm644 -t /app/bin font.ttf Font-Awesome.otf
      # 元数据
      - install -Dm644 -t /app/share/applications net.de5.qunxia.dream.desktop
      - install -Dm644 -t /app/share/metainfo net.de5.qunxia.dream.metainfo.xml
      - install -Dm644 -t /app/share/icons/hicolor/scalable/apps icon.svg
      - ln -sf /app/share/icons/hicolor/scalable/apps/icon.svg /app/share/icons/hicolor/scalable/apps/net.de5.qunxia.dream.svg
