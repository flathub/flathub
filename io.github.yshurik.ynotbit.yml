app-id: io.github.yshurik.ynotbit
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: ynotbit
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la
  - /bin/sqlcipher
  - /share/man
modules:
  - name: tcl
    buildsystem: simple
    subdir: unix
    build-commands:
      - sed -i '/chmod 555/d' Makefile.in
      - ./configure --prefix=/app
      - make -j$FLATPAK_BUILDER_N_JOBS
      - make install
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tcl8.6.16-src.tar.gz
        sha256: 91cb8fa61771c63c262efb553059b7c7ad6757afa5857af6265e4b0bdc2a14a5

  - name: libsodium
    config-opts:
      - --disable-shared
      - --with-pic
    sources:
      - type: archive
        url: https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz
        sha256: ebb65ef6ca439333c2bb41a0c1990587288da07f6c7fd07cb3a18cc18d30ce19

  - name: sqlcipher
    config-opts:
      - --disable-shared
      - --with-pic
      - --enable-tempstore=yes
      - CFLAGS=-DSQLITE_HAS_CODEC
      - LDFLAGS=-lcrypto
    sources:
      - type: git
        url: https://github.com/sqlcipher/sqlcipher.git
        tag: v4.6.1
        commit: c5bd336ece77922433aaf6d6fe8cf203b0c299d5

  - name: ynotbit
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DYNOTBIT_APP_ONLY=ON
      - -DYNOTBIT_APP_ID=io.github.yshurik.ynotbit
    sources:
      - type: git
        url: https://github.com/yshurik/ynotbit.git
        tag: v0.8.3
        commit: dda1f1f569f234666f05aef0ebd92be7965abbcc
