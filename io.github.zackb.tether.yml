# Flathub manifest for tether. Submitted to github.com/flathub; bump tag and commit per release.

app-id: io.github.zackb.tether
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: tether-gtk
rename-desktop-file: tether-gtk.desktop
rename-icon: tether

finish-args:
  - --share=network # mDNS discovery and the mTLS listener
  - --socket=wayland
  - --system-talk-name=org.bluez # adapter, devices, GATT for ANCS
  - --system-talk-name=org.freedesktop.Avahi # Bonjour, so the iPhone finds this PC
  - --talk-name=org.bluez.obex # MAP messages and PBAP contacts
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets # the key for the encrypted message store
  - --filesystem=xdg-download # where received files go
  - --filesystem=xdg-run/tether:create
  - --allow=bluetooth
  - --filesystem=~/.mozilla/native-messaging-hosts:create
  - --filesystem=~/.thunderbird/native-messaging-hosts:create
  - --filesystem=~/.betterbird/native-messaging-hosts:create
  - --filesystem=~/.config/chromium/NativeMessagingHosts:create
  - --filesystem=~/.config/google-chrome/NativeMessagingHosts:create
  - --filesystem=~/.var/app/org.mozilla.firefox/.mozilla/native-messaging-hosts:create
  - --filesystem=~/.var/app/org.mozilla.Thunderbird/.thunderbird/native-messaging-hosts:create
  - --filesystem=~/.var/app/eu.betterbird.Betterbird/.betterbird/native-messaging-hosts:create
  - --filesystem=~/.var/app/org.chromium.Chromium/config/chromium/NativeMessagingHosts:create
  - --filesystem=~/.var/app/com.google.Chrome/config/google-chrome/NativeMessagingHosts:create

modules:
  - name: gtk-layer-shell
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
    sources:
      - type: archive
        url: https://github.com/wmww/gtk-layer-shell/archive/refs/tags/v0.10.1.tar.gz
        sha256: 88c3a3e0a5300532f3d368d5df64838a87f1fb85273f22d41df0a6b8d0ec59c6

  - name: bluez-btmgmt
    buildsystem: autotools
    config-opts:
      - --disable-systemd
      - --disable-udev
      - --disable-cups
      - --disable-obex
      - --disable-monitor
      - --disable-manpages
      - --enable-tools
      - --enable-library
    no-make-install: true
    post-install:
      - install -Dm755 tools/btmgmt /app/bin/btmgmt
    sources:
      - type: archive
        url: https://www.kernel.org/pub/linux/bluetooth/bluez-5.87.tar.xz
        sha256: 26bdcf2cebd7310c6f598850606b037ef0c515fe6608ebc54d22c50c4c32b35f

  - name: tether
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DTETHER_BUILD_EXTENSIONS=OFF
      - -DTETHER_BUILD_TUI=OFF
      - -DTETHER_CAMERA=OFF
      - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - -DFETCHCONTENT_SOURCE_DIR_JSON=/run/build/tether/_deps/json
      - -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST=/run/build/tether/_deps/googletest
    post-install:
      - rm -rf /app/share/icons/hicolor/1024x1024
    sources:
      - type: git
        url: https://github.com/zackb/tether.git
        tag: v0.3.5
        commit: 3d8c84a1c9974d27c14d246977308854f5c2b9be
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      # FetchContent dependencies, since Flathub builds have no network
      - type: archive
        url: https://github.com/nlohmann/json/archive/refs/tags/v3.12.0.tar.gz
        sha256: 4b92eb0c06d10683f7447ce9406cb97cd4b453be18d7279320f7b2f025c10187
        dest: _deps/json
      - type: archive
        url: https://github.com/google/googletest/archive/refs/tags/v1.17.0.tar.gz
        sha256: 65fab701d9829d38cb77c14acdc431d2108bfdbf8979e40eb8ae567edf10b27c
        dest: _deps/googletest
