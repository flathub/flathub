app-id: io.github.zeravrix.ZERAVRIX
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: zeravrix
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents
  - --env=JAVA_HOME=/usr/lib/sdk/openjdk21
  - --env=PATH=/app/bin:/usr/bin:/usr/lib/sdk/openjdk21/bin

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/enable.sh

  - name: zeravrix
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib/zeravrix /app/share/applications /app/share/metainfo /app/share/icons/hicolor/256x256/apps /app/share/icons/hicolor/512x512/apps /app/share/icons/hicolor/1024x1024/apps
      - cp -r zeravrix-1.7.2-linux/app/* /app/lib/zeravrix/
      - install -m 755 zeravrix-flatpak.sh /app/bin/zeravrix
      - install -m 644 io.github.zeravrix.ZERAVRIX.desktop /app/share/applications/io.github.zeravrix.ZERAVRIX.desktop
      - install -m 644 io.github.zeravrix.ZERAVRIX.metainfo.xml /app/share/metainfo/io.github.zeravrix.ZERAVRIX.metainfo.xml
      - install -m 644 io.github.zeravrix.ZERAVRIX.png /app/share/icons/hicolor/1024x1024/apps/io.github.zeravrix.ZERAVRIX.png
      - install -m 644 io.github.zeravrix.ZERAVRIX.png /app/share/icons/hicolor/512x512/apps/io.github.zeravrix.ZERAVRIX.png
      - install -m 644 io.github.zeravrix.ZERAVRIX.png /app/share/icons/hicolor/256x256/apps/io.github.zeravrix.ZERAVRIX.png
    sources:
      - type: archive
        url: https://github.com/zeravrix/ZERAVRIX-PC/releases/download/v1.7.2/ZERAVRIX-1.7.2-Linux-Fedora.tar.gz
        sha256: cc06c645b1790edb7ea956c17b7c03bb657fca43ac646ddaf4e8534789c517f4
      - type: file
        path: zeravrix-flatpak.sh
      - type: file
        path: io.github.zeravrix.ZERAVRIX.desktop
      - type: file
        path: io.github.zeravrix.ZERAVRIX.metainfo.xml
      - type: file
        path: io.github.zeravrix.ZERAVRIX.png
