app-id: io.github.soccervortex.backhome
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: backhome
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/mnt
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
modules:
  - name: borgbackup
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app borgbackup
    sources:
      - type: archive
        url: https://github.com/borgbackup/borg/releases/download/1.4.0/borgbackup-1.4.0.tar.gz
        sha256: c54c45155643fa66fed7f9ff2d134ea0a58d0ac197c18781ddc2fb236bf6ed29

  - name: backhome
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app .
      - install -Dm644 backhome/data/backhome.desktop /app/share/applications/io.github.soccervortex.backhome.desktop
      - install -Dm644 backhome/data/icons/backhome.svg /app/share/icons/hicolor/scalable/apps/io.github.soccervortex.backhome.svg
      - install -Dm644 backhome/data/io.github.soccervortex.backhome.metainfo.xml /app/share/metainfo/io.github.soccervortex.backhome.metainfo.xml
    sources:
      - type: git
        url: https://github.com/soccervortex/backhome.git
        commit: 7016e0054326439888a5bcc775e156ba53fe7ede
