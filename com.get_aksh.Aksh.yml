id: com.get_aksh.Aksh
runtime: org.gnome.Platform 
runtime-version: '50'
sdk: org.gnome.Sdk
command: aksh
build-options:
  strip: false
  no-debuginfo: true
finish-args:
  - --share=ipc # X11 + XShm access
  - --socket=wayland # Wayland access
  - --socket=fallback-x11
  - --device=dri # GPU acceleration if needed
  - --share=network # network access for "check updates" and sync service
modules:
  - name: aksh_app
    buildsystem: simple
    build-commands:
      - install -Dm755 aksh /app/bin/aksh
      - install -Dm755 petite.boot /app/bin/petite.boot
      - install -Dm755 aksh.boot /app/bin/aksh.boot
      - mkdir -p /app/share/licenses/com.get_aksh.Aksh/aksh_app /app/share/icons
      - cp -a licenses/. /app/share/licenses/com.get_aksh.Aksh/aksh_app/
      - cp -a icons/hicolor/. /app/share/icons/hicolor/
      - install -Dm644 icons/aksh.png /app/share/icons/hicolor/512x512/apps/com.get_aksh.Aksh.png
      - install -Dm644 com.get_aksh.Aksh.desktop /app/share/applications/com.get_aksh.Aksh.desktop
      - install -Dm644 com.get_aksh.Aksh.metainfo.xml /app/share/metainfo/com.get_aksh.Aksh.metainfo.xml
    sources:
      - type: archive
        url: https://get-aksh.com/releases/aksh-flatpak-alpha-2-x86_64.tar.gz
        sha256: 7e57504dcf3265a165928e54f4af8a5265e3b2d4b8007c2321c5813b1096a343
        strip-components: 0
