id: com.get_aksh.Aksh
runtime: org.gnome.Platform 
runtime-version: '50'
sdk: org.gnome.Sdk
command: aksh
build-options:
  strip: false
  no-debuginfo: true
finish-args:
  - --share=ipc # X11 + XShm access
  - --socket=wayland # Wayland access
  - --socket=fallback-x11
  - --device=dri # GPU acceleration if needed
  - --share=network # Needs to talk to the network:
  - --filesystem=xdg-documents # Needs to save files locally
modules:
  - name: aksh_app
    buildsystem: simple
    build-commands:
      - install -Dm755 aksh /app/bin/aksh
      - install -Dm755 petite.boot /app/bin/petite.boot
      - install -Dm755 aksh.boot /app/bin/aksh.boot
      - mkdir -p /app/icons /app/licenses
      - cp -a icons/. /app/icons/
      - cp -a licenses/. /app/licenses/
      - mkdir -p /app/share/licenses/com.get_aksh.Aksh/aksh_app
      - cp -a licenses/. /app/share/licenses/com.get_aksh.Aksh/aksh_app/
      - mkdir -p /app/share/icons/hicolor/scalable/apps/
      - cp -a /app/icons/hicolor/. /app/share/icons/hicolor/
      - cp -r /app/icons/*.svg /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 /app/icons/aksh.png /app/share/icons/hicolor/512x512/apps/com.get_aksh.Aksh.png
      - install -Dm644 com.get_aksh.Aksh.desktop /app/share/applications/com.get_aksh.Aksh.desktop
      - install -Dm644 com.get_aksh.Aksh.metainfo.xml /app/share/metainfo/com.get_aksh.Aksh.metainfo.xml
    sources:
      - type: archive
        url: https://get-aksh.com/releases/aksh-flatpak-alpha-1_x86.tar.gz
        sha256: 3730081915dd738990231a43a80bdb75349e92a235c4615e0f134d669fcf073d
        strip-components: 0
