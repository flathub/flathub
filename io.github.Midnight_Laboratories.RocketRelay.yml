app-id: io.github.Midnight_Laboratories.RocketRelay
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: rocketrelay

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --share=ipc

modules:
  - name: rocketrelay
    buildsystem: simple
    build-commands:
      - install -Dm755 rocketrelay-launcher.sh /app/bin/rocketrelay
      - install -Dm644 io.github.Midnight_Laboratories.RocketRelay.desktop /app/share/applications/io.github.Midnight_Laboratories.RocketRelay.desktop
      - install -Dm644 io.github.Midnight_Laboratories.RocketRelay.metainfo.xml /app/share/metainfo/io.github.Midnight_Laboratories.RocketRelay.metainfo.xml
      - install -Dm644 io.github.Midnight_Laboratories.RocketRelay.png /app/share/icons/hicolor/512x512/apps/io.github.Midnight_Laboratories.RocketRelay.png
    sources:
      # extra-data is fetched by the Flatpak client at install time as a raw
      # file placed at /app/extra/<filename> — never unpacked, and never
      # visible to build-commands above. rocketrelay-launcher.sh unpacks it
      # into the app's writable data dir on first run instead.
      - type: extra-data
        filename: RocketRelay-Linux.tar.gz
        url: https://github.com/Midnight-Laboratories/RocketRelay/releases/download/v1.0.1/RocketRelay-Linux-v1.0.1.tar.gz
        sha256: 6a4ef8fca15bb156d6b7371f3ee4e58e84c0cfbe882f19d026f21883ec64f1fc
        size: 35823874
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Midnight-Laboratories/RocketRelay/releases/latest
          version-query: .tag_name | sub("^v";"")
          url-query: .assets[] | select(.name == "RocketRelay-Linux-v" + $version + ".tar.gz") | .browser_download_url
      - type: file
        path: rocketrelay-launcher.sh
      - type: file
        path: io.github.Midnight_Laboratories.RocketRelay.desktop
      - type: file
        path: io.github.Midnight_Laboratories.RocketRelay.metainfo.xml
      - type: file
        path: io.github.Midnight_Laboratories.RocketRelay.png
