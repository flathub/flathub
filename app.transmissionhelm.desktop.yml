# Flathub manifest. Builds from the released Linux zip; the Electron base app provides the runtime deps.
app-id: app.transmissionhelm.desktop
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: transmission-helm
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-download
  - --env=ELECTRON_TRASH=gio
modules:
  - name: transmission-helm
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/transmission-helm /app/bin /app/share/applications /app/share/icons/hicolor/512x512/apps /app/share/metainfo
      - cp -a app/. /app/lib/transmission-helm/
      - install -Dm755 transmission-helm.sh /app/bin/transmission-helm
      - install -Dm644 app.transmissionhelm.desktop.desktop /app/share/applications/
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/app.transmissionhelm.desktop.png
      - install -Dm644 app.transmissionhelm.desktop.metainfo.xml /app/share/metainfo/
    sources:
      - type: archive
        url: https://github.com/transmission-helm/transmission-helm/releases/download/v0.1.0/transmission-helm-0.1.0.tar.gz
        sha256: 412c1cd2b443bbb042ba3b92ded57453e6b5ec3b46ee28cf4c5d168b9847d3d4
        dest: app
        strip-components: 1
      - type: script
        dest-filename: transmission-helm.sh
        commands:
          - exec zypak-wrapper /app/lib/transmission-helm/transmission-helm "$@"
      - type: file
        path: app.transmissionhelm.desktop.desktop
      - type: file
        path: app.transmissionhelm.desktop.metainfo.xml
      - type: file
        path: icon.png
