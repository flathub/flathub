app-id: dev.murtazapatel.ArchCalc
runtime: org.gnome.Platform
runtime-version: '45'
sdk: org.gnome.Sdk
command: archcalc
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
modules:
  - name: archcalc
    buildsystem: simple
    build-commands:
      - ar x archcalc.deb
      - tar xf data.tar.*
      - mkdir -p /app/bin
      - mv usr/bin/archcalc /app/bin/
      - cp -r usr/share /app/
      # Rename desktop file and fix keys
      - mv /app/share/applications/archcalc.desktop /app/share/applications/dev.murtazapatel.ArchCalc.desktop
      - sed -i 's/Icon=archcalc/Icon=dev.murtazapatel.ArchCalc/g' /app/share/applications/dev.murtazapatel.ArchCalc.desktop
      - sed -i 's/Exec=archcalc/Exec=archcalc/g' /app/share/applications/dev.murtazapatel.ArchCalc.desktop
      # Rename icons
      - for size in 32x32 128x128 256x256; do if [ -f /app/share/icons/hicolor/${size}/apps/archcalc.png ]; then mv /app/share/icons/hicolor/${size}/apps/archcalc.png /app/share/icons/hicolor/${size}/apps/dev.murtazapatel.ArchCalc.png; fi; done
      # Install AppStream metadata
      - mkdir -p /app/share/metainfo
      - install -Dm644 dev.murtazapatel.ArchCalc.metainfo.xml /app/share/metainfo/dev.murtazapatel.ArchCalc.metainfo.xml
    sources:
      - type: file
        url: https://github.com/murtazapatel89100/ArchCalc/releases/download/v0.4.2/archcalc_0.4.2_amd64.deb
        dest-filename: archcalc.deb
        sha256: 60c29c9c5b2bfa1df31dbf3b7f3f6e19627c25707b62393d6954208e13a181c2
        x-checker-data:
          type: json
          url: https://api.github.com/repos/murtazapatel89100/ArchCalc/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | endswith(".deb")) | .browser_download_url
      - type: file
        path: dev.murtazapatel.ArchCalc.metainfo.xml
