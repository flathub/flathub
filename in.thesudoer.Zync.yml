# Zync SSH workspace — Flathub submission
# https://github.com/zync-sh/zync
#
# Binary package from the official GitHub release .deb (same approach as AUR zync-bin).

id: in.thesudoer.Zync
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: zync

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=ssh-auth
  - --filesystem=home

modules:
  - name: zync
    buildsystem: simple
    sources:
      - type: file
        path: in.thesudoer.Zync.metainfo.xml
      - type: file
        url: https://github.com/zync-sh/zync/releases/download/v2.22.5/zync_2.22.5_amd64.deb
        sha256: bee683efa49424e6e7e15e3f72a2b24a695760d698ce2f7d87d5f04dc1163224
        only-arches: [x86_64]
    build-commands:
      - set -euo pipefail
      - mkdir -p deb-extract
      - ar -x *.deb --output deb-extract
      - tar -C deb-extract -xf deb-extract/data.tar.*
      - install -Dm755 deb-extract/usr/bin/zync /app/bin/zync
      - |
        if [ -d deb-extract/usr/lib/zync ]; then
          mkdir -p /app/lib/zync
          cp -a deb-extract/usr/lib/zync/. /app/lib/zync/
          find /app/lib/zync -type f -exec chmod 644 {} \;
        fi
      - sed -i 's/^Icon=.*/Icon=in.thesudoer.Zync/' deb-extract/usr/share/applications/zync.desktop
      - desktop-file-edit --set-key=Categories --set-value='Network;RemoteAccess;TerminalEmulator;' deb-extract/usr/share/applications/zync.desktop || true
      - install -Dm644 deb-extract/usr/share/applications/zync.desktop /app/share/applications/in.thesudoer.Zync.desktop
      - install -Dm644 deb-extract/usr/share/icons/hicolor/128x128/apps/zync.png /app/share/icons/hicolor/128x128/apps/in.thesudoer.Zync.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/32x32/apps/zync.png /app/share/icons/hicolor/32x32/apps/in.thesudoer.Zync.png
      - install -Dm644 in.thesudoer.Zync.metainfo.xml /app/share/metainfo/in.thesudoer.Zync.metainfo.xml
