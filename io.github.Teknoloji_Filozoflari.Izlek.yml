id: io.github.Teknoloji_Filozoflari.Izlek
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: izlek
cleanup:
  - /bin/maturin
  - /lib/python3.13/site-packages/maturin
finish-args:
  # TMDB API and poster downloads.
  - --share=network
  # Native Wayland first, with X11/XWayland fallback and accelerated Qt rendering.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - name: maturin
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/maturin/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --locked --offline --bin maturin
      - install -Dm755 target/release/maturin /app/bin/maturin
      - install -d /app/lib/python3.13/site-packages
      - cp -a maturin /app/lib/python3.13/site-packages/maturin
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/b9/c8/22e5e21b2679c9bce6415ca578034ca2cc9316be0642ae21e051a2d5198c/maturin-1.15.0.tar.gz
        sha256: 94b26cc8e8aba61a5f2099715fe640e18c5f678e9a500408b38761263954228a
      - maturin-cargo-sources.json
  - python3-source-dependencies.json
  - name: izlek
    buildsystem: simple
    build-commands:
      - install -d /app/lib/python3.13/site-packages
      - cp -a source/src/cinetrack /app/lib/python3.13/site-packages/cinetrack
      - install -Dm755 source/packaging/flatpak/izlek-launcher /app/bin/izlek
      - install -Dm644 source/packaging/flatpak/io.github.Teknoloji_Filozoflari.Izlek.desktop /app/share/applications/io.github.Teknoloji_Filozoflari.Izlek.desktop
      - install -Dm644 source/packaging/flatpak/io.github.Teknoloji_Filozoflari.Izlek.metainfo.xml /app/share/metainfo/io.github.Teknoloji_Filozoflari.Izlek.metainfo.xml
      - install -Dm644 source/packaging/flatpak/io.github.Teknoloji_Filozoflari.Izlek.svg /app/share/icons/hicolor/scalable/apps/io.github.Teknoloji_Filozoflari.Izlek.svg
      - install -Dm644 source/LICENSE /app/share/licenses/io.github.Teknoloji_Filozoflari.Izlek/LICENSE
    sources:
      # Immutable v0.1.0 release source.
      - type: git
        url: https://github.com/Teknoloji-Filozoflari/Izlek.git
        tag: v0.1.0
        commit: 2ac95efe49c8d61fc5bbdf74c9558cd227f76363
        dest: source
