app-id: io.github.leandrostanger.universidadelivre
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: run.sh
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

build-options:
  append-path: /usr/lib/sdk/node24/bin
  env:
    NPM_CONFIG_LOGLEVEL: info

modules:
  - name: universidade-livre
    buildsystem: simple
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/universidade-livre/flatpak-node/cache
        npm_config_cache: /run/build/universidade-livre/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      - cd source && npm ci --offline --no-audit --no-fund
      - cd source && . ../flatpak-node/electron-builder-arch-args.sh && npm run dist -- "$ELECTRON_BUILDER_ARCH_ARGS" --linux --dir
      - install -d /app/main
      - cp -a source/release/linux-unpacked/. /app/main/
      - install -Dm755 run.sh /app/bin/run.sh
      - install -Dm644 source/packaging/flatpak/io.github.leandrostanger.universidadelivre.desktop /app/share/applications/io.github.leandrostanger.universidadelivre.desktop
      - install -Dm644 source/packaging/flatpak/io.github.leandrostanger.universidadelivre.png /app/share/icons/hicolor/128x128/apps/io.github.leandrostanger.universidadelivre.png
      - install -Dm644 source/packaging/flatpak/io.github.leandrostanger.universidadelivre.metainfo.xml /app/share/metainfo/io.github.leandrostanger.universidadelivre.metainfo.xml
    sources:
      - type: archive
        url: https://codeload.github.com/LeandroStanger/UniversidadeLivre/tar.gz/983cc9d99bc8105fffefc2ae3d2bb3a09eca0110
        sha256: 9cdb62887917fb2d411ccba637d8872c17214139435b495c4e1a2bc16e8a264f
        dest: source
      - generated-sources.json
      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper.sh /app/main/universidade-livre-desktop "$@"
