app-id: sh.lerd.Desktop
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: sh.lerd.Desktop
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: lerd-desktop
    buildsystem: simple
    build-commands:
      - mkdir -p /app/main
      - cp -a src gate assets package.json electron /app/main/
      - install -Dm755 flatpak/zypak-wrapper.sh /app/bin/sh.lerd.Desktop
      - install -Dm644 flatpak/sh.lerd.Desktop.desktop /app/share/applications/sh.lerd.Desktop.desktop
      - install -Dm644 flatpak/sh.lerd.Desktop.metainfo.xml /app/share/metainfo/sh.lerd.Desktop.metainfo.xml
      - install -Dm644 assets/icon.png /app/share/icons/hicolor/512x512/apps/sh.lerd.Desktop.png
    sources:
      - type: git
        url: https://github.com/lerd-env/lerd-desktop.git
        tag: v0.1.6
        commit: be6be8e64d757fa79febac2b56015262db9832ac
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/electron/electron/releases/download/v44.7.0/electron-v44.7.0-linux-x64.zip
        sha256: 3ae7d5bdad61c664486c6ab61361dd084d064c8c08af8d13a687096e18ce555a
        dest: electron
        strip-components: 0
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/electron/electron/releases/download/v44.7.0/electron-v44.7.0-linux-arm64.zip
        sha256: 9cd736d1f5873839553c3fa6c8c5e57635ec4a399cc2d32e79c82a02d9cd2258
        dest: electron
        strip-components: 0
