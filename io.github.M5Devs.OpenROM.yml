app-id: io.github.M5Devs.OpenROM
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: gui

# The freedesktop 24.08 SDK no longer ships the standalone `appstream-compose`
# binary that flatpak-builder 1.2.x (Ubuntu 22.04) still invokes during cleanup,
# which aborted the build. AppStream metadata is already generated by Flathub
# for published apps, so skip the in-build compose step.
appstream-compose: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --filesystem=home
  - --device=dri

modules:
  - name: openrom
    buildsystem: simple

    build-commands:
      # Install the pre-built Flutter bundle.
      - mkdir -p /app
      - cp -r flatpak-build/bundle/. /app/

      # Make the GUI executable available as the Flatpak command.
      - mkdir -p /app/bin
      - ln -sf /app/gui /app/bin/gui

      # Install the Dart core backend.
      - install -Dm755 flatpak-build/openrom-core /app/bin/openrom-core
      - install -Dm644 VERSION /app/bin/VERSION
      # Also place VERSION next to the GUI binary so the app can read its version.
      - install -Dm644 VERSION /app/VERSION

      # Install conversion and patching tools.
      - install -Dm755 assets/linux/x86_64/chdman /app/bin/chdman
      - install -Dm755 assets/linux/x86_64/ecm /app/bin/ecm
      - install -Dm755 assets/linux/x86_64/unecm /app/bin/unecm
      - install -Dm755 assets/linux/x86_64/maxcso /app/bin/maxcso
      - install -Dm755 assets/linux/x86_64/extract-xiso /app/bin/extract-xiso
      - install -Dm755 assets/linux/x86_64/nodtool /app/bin/nodtool
      - install -Dm755 assets/linux/x86_64/xdelta3 /app/bin/xdelta3
      - install -Dm755 assets/linux/x86_64/saturn-patcher /app/bin/saturn-patcher

      # NKit ships as a single self-contained binary.
      - install -Dm755 assets/linux/x86_64/nkit /app/bin/nkit

      # Install desktop integration files.
      - install -Dm644 flatpak/io.github.M5Devs.OpenROM.desktop /app/share/applications/io.github.M5Devs.OpenROM.desktop
      - install -Dm644 assets/icons/icon.png /app/share/icons/hicolor/256x256/apps/io.github.M5Devs.OpenROM.png
      - install -Dm644 flatpak/io.github.M5Devs.OpenROM.metainfo.xml /app/share/metainfo/io.github.M5Devs.OpenROM.metainfo.xml

    sources:
      - type: dir
        path: ..
