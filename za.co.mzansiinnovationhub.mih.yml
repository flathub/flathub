app-id: za.co.mzansiinnovationhub.mih
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: mih
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: pdfium
    buildsystem: simple
    build-commands:
      - mkdir -p /app/src/pdfium/
      - cp -r * /app/src/pdfium/
    sources:
      - type: archive
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7881/pdfium-linux-x64.tgz
        sha256: 1470e21b8b4a3b4ad7f85684e2da11d94f3b69a86d81dee11b9b6709d927ac1d
        only-arches: [x86_64]
        strip-components: 0
      - type: archive
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7881/pdfium-linux-arm64.tgz
        sha256: ee7f7b7d5468958336a818c1cd580bdd20972846b7377b13f9a923d92d1d4674
        only-arches: [aarch64]
        strip-components: 0

  - flutter-sdk-3.44.1.json
  - name: mih
    buildsystem: simple
    subdir: mih_ui
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm20/bin:/var/lib/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        PUB_CACHE: /run/build/mih/.pub-cache
    build-commands:
      - mkdir -p "$BUNDLE_PATH/../pdfium-src/"
      - cp -r /app/src/pdfium/* "$BUNDLE_PATH/../pdfium-src/"
      - flutter pub get --offline
      - flutter build linux --release --no-pub -t lib/main_prod.dart
      - mkdir -p /app/mih
      - cp -r "$BUNDLE_PATH"/. /app/mih/
      - install -Dm755 flatpak/mih-wrapper.sh /app/bin/mih
      - install -Dm644 app/share/metainfo/za.co.mzansiinnovationhub.mih.metainfo.xml /app/share/metainfo/za.co.mzansiinnovationhub.mih.metainfo.xml
      - install -Dm644 app/share/applications/za.co.mzansiinnovationhub.mih.desktop /app/share/applications/za.co.mzansiinnovationhub.mih.desktop
      - install -Dm644 app/share/icons/hicolor/256x256/apps/za.co.mzansiinnovationhub.mih.png /app/share/icons/hicolor/256x256/apps/za.co.mzansiinnovationhub.mih.png
    sources:
      - type: git
        url: https://github.com/yaso-meth/mih-project.git
        tag: 6e4f18fbc632d15df4e923a8d4c7d1be2286819a
        commit: 6e4f18fbc632d15df4e923a8d4c7d1be2286819a
      - pubspec-sources.json
