id: io.github.adam0307a.DiyarDesk
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: deskland-linux
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.deskland.GnomeShell
  - --filesystem=xdg-desktop:ro
  - --filesystem=xdg-pictures/DiyarDesk:create
  - --filesystem=xdg-config/deskland:create
modules:
  - name: diyardesk
    buildsystem: simple
    build-commands:
      - install -d /app/lib/deskland/linux/deskland_linux /app/lib/deskland/prototype /app/bin
      - install -d /app/share/applications /app/share/icons/hicolor/scalable/apps /app/share/metainfo
      - cp -a linux/deskland_linux/. /app/lib/deskland/linux/deskland_linux/
      - cp -a prototype/. /app/lib/deskland/prototype/
      - sed 's/^Icon=.*/Icon=io.github.adam0307a.DiyarDesk/' linux/packaging/deskland.desktop > /app/share/applications/io.github.adam0307a.DiyarDesk.desktop
      - chmod 644 /app/share/applications/io.github.adam0307a.DiyarDesk.desktop
      - install -m 644 linux/packaging/deskland.svg /app/share/icons/hicolor/scalable/apps/io.github.adam0307a.DiyarDesk.svg
      - install -m 644 io.github.adam0307a.DiyarDesk.metainfo.xml /app/share/metainfo/io.github.adam0307a.DiyarDesk.metainfo.xml
      - |
        cat > /app/bin/deskland-linux <<'EOF'
        #!/bin/sh
        export PYTHONPATH="/app/lib/deskland/linux${PYTHONPATH:+:$PYTHONPATH}"
        export DESKLAND_PROTOTYPE="${DESKLAND_PROTOTYPE:-/app/lib/deskland/prototype}"
        exec python3 -m deskland_linux "$@"
        EOF
      - chmod 755 /app/bin/deskland-linux
      - install -m 755 linux/bin/diyardesk-ctl /app/bin/diyardesk-ctl
    sources:
      - type: git
        url: https://github.com/adam0307a/DiyarDesk.git
        tag: v0.5.3
        commit: d9ac4be96036572f781942bb0af4f489944cf731
      - type: file
        path: io.github.adam0307a.DiyarDesk.metainfo.xml
