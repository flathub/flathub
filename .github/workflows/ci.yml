name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

env:
  MODEL_URL: https://github.com/thedavidweng/openkara-models/releases/download/model-v1.0.0/htdemucs.onnx
  MODEL_SHA256: 66eebc928e4a9f7e5b837605794f4db2b91748f163b0bcbc8f29a526ffe5607e

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            patchelf \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Download separation model (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/setup.sh

      - name: Download separation model (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $modelPath = Join-Path $env:GITHUB_WORKSPACE "src-tauri/models/htdemucs.onnx"
          $modelDir = Split-Path $modelPath
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null

          function Get-ModelSha256([string]$path) {
            return (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          }

          if (Test-Path $modelPath) {
            if ((Get-ModelSha256 $modelPath) -eq $env:MODEL_SHA256) {
              Write-Host "Model already present and verified at $modelPath"
              exit 0
            }

            Remove-Item $modelPath -Force
          }

          $tmpPath = "$modelPath.download"
          Invoke-WebRequest -Uri $env:MODEL_URL -OutFile $tmpPath
          $downloadedSha = Get-ModelSha256 $tmpPath

          if ($downloadedSha -ne $env:MODEL_SHA256) {
            Remove-Item $tmpPath -Force -ErrorAction SilentlyContinue
            throw "Downloaded model checksum mismatch. Expected $env:MODEL_SHA256 got $downloadedSha"
          }

          Move-Item -Force $tmpPath $modelPath

      # ort-sys's `copy-dylibs` feature places runtime DLLs (e.g. DirectML.dll)
      # into target/debug via file copy when symlinks are unavailable (no
      # Developer Mode on GitHub-hosted runners). It deliberately skips the
      # deps/ and examples/ directories in that fallback path, so test
      # binaries that run from target/debug/deps cannot find the DLLs.
      # Fix: pre-build the test binaries, then mirror the DLLs into deps/.
      - name: Stage ORT runtime DLLs for Rust tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:GITHUB_WORKSPACE "src-tauri")
          cargo test --no-run 2>&1

          $debugDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/debug"
          $depsDir  = Join-Path $debugDir "deps"
          New-Item -ItemType Directory -Force -Path $depsDir | Out-Null

          $dlls = Get-ChildItem -Path $debugDir -Filter "*.dll" -File
          if ($dlls) {
            foreach ($dll in $dlls) {
              $dest = Join-Path $depsDir $dll.Name
              Copy-Item -Force $dll.FullName $dest
              Write-Host "Staged $($dll.Name) -> deps/"
            }
          } else {
            Write-Host "No DLLs found in target/debug – nothing to stage"
          }

      - name: Lint frontend
        run: pnpm lint

      - name: Verify formatting
        run: pnpm format

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test -q

      - name: Validate Tauri build
        run: pnpm tauri build --debug --no-bundle --ci
