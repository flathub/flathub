name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

env:
  MODEL_URL: https://github.com/thedavidweng/openkara-models/releases/download/model-v1.0.0/htdemucs.onnx
  MODEL_SHA256: 66eebc928e4a9f7e5b837605794f4db2b91748f163b0bcbc8f29a526ffe5607e

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            patchelf \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Download separation model (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/setup.sh

      - name: Download separation model (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $modelPath = Join-Path $env:GITHUB_WORKSPACE "src-tauri/models/htdemucs.onnx"
          $modelDir = Split-Path $modelPath
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null

          function Get-ModelSha256([string]$path) {
            return (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          }

          if (Test-Path $modelPath) {
            if ((Get-ModelSha256 $modelPath) -eq $env:MODEL_SHA256) {
              Write-Host "Model already present and verified at $modelPath"
              exit 0
            }

            Remove-Item $modelPath -Force
          }

          $tmpPath = "$modelPath.download"
          Invoke-WebRequest -Uri $env:MODEL_URL -OutFile $tmpPath
          $downloadedSha = Get-ModelSha256 $tmpPath

          if ($downloadedSha -ne $env:MODEL_SHA256) {
            Remove-Item $tmpPath -Force -ErrorAction SilentlyContinue
            throw "Downloaded model checksum mismatch. Expected $env:MODEL_SHA256 got $downloadedSha"
          }

          Move-Item -Force $tmpPath $modelPath

      # pyke's prebuilt onnxruntime.lib for Windows is compiled with DirectML
      # baked in, creating a hard runtime dependency on DirectML.dll.  The
      # dfbin cache contains only the static lib, and the system-provided
      # DirectML.dll on Windows Server runners is too old (missing exports
      # needed by ORT 1.24.2), causing STATUS_ENTRYPOINT_NOT_FOUND.
      #
      # Fix: download the exact DirectML redistributable that ORT 1.24.2 was
      # built against (Microsoft.AI.DirectML 1.15.4, per cmake/external/
      # dml.cmake) and stage the correct DLL next to the test binary.
      - name: Stage ORT runtime DLLs for Rust tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:GITHUB_WORKSPACE "src-tauri")
          cargo test --no-run 2>&1

          $depsDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/debug/deps"
          New-Item -ItemType Directory -Force -Path $depsDir | Out-Null

          # ---- DirectML redistributable (v1.15.4, matches ORT 1.24.2) ----
          $dmlPkg = Join-Path $env:RUNNER_TEMP "directml.zip"
          $dmlDir = Join-Path $env:RUNNER_TEMP "directml"
          Invoke-WebRequest `
            -Uri "https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4" `
            -OutFile $dmlPkg
          Expand-Archive -Force -Path $dmlPkg -DestinationPath $dmlDir

          $dmlDll = Join-Path $dmlDir "bin/x64-win/DirectML.dll"
          if (Test-Path $dmlDll) {
            $dest = Join-Path $depsDir "DirectML.dll"
            if (Test-Path $dest) { Remove-Item $dest -Force }
            Copy-Item $dmlDll $dest
            Write-Host "Staged DirectML.dll (v1.15.4) -> deps/"
          } else {
            throw "DirectML.dll not found in NuGet package"
          }

          # ---- Copy any extra DLLs from the ort-sys dfbin cache ----
          $buildOutputFiles = Get-ChildItem `
            -Path (Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/debug/build") `
            -Filter output `
            -File `
            -Recurse | Where-Object { $_.FullName -match "ort-sys-" }

          foreach ($f in @($buildOutputFiles)) {
            foreach ($line in Get-Content $f.FullName) {
              if ($line -match "^cargo:rustc-link-search=native=(.+)$") {
                $dir = $Matches[1]
                if (-not (Test-Path $dir)) { continue }
                Get-ChildItem -Path $dir -Filter "*.dll" -File -ErrorAction SilentlyContinue |
                  ForEach-Object {
                    $dest = Join-Path $depsDir $_.Name
                    if (-not (Test-Path $dest)) {
                      Copy-Item $_.FullName $dest
                      Write-Host "Staged $($_.Name) from dfbin -> deps/"
                    }
                  }
              }
            }
          }

      - name: Lint frontend
        run: pnpm lint

      - name: Verify formatting
        run: pnpm format

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test -q

      - name: Validate Tauri build
        run: pnpm tauri build --debug --no-bundle --ci
