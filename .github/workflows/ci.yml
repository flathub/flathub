name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

env:
  MODEL_URL: https://github.com/thedavidweng/openkara-models/releases/download/model-v1.0.0/htdemucs.onnx
  MODEL_SHA256: 66eebc928e4a9f7e5b837605794f4db2b91748f163b0bcbc8f29a526ffe5607e

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            patchelf \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Download separation model (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/setup.sh

      - name: Download separation model (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $modelPath = Join-Path $env:GITHUB_WORKSPACE "src-tauri/models/htdemucs.onnx"
          $modelDir = Split-Path $modelPath
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null

          function Get-ModelSha256([string]$path) {
            return (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          }

          if (Test-Path $modelPath) {
            if ((Get-ModelSha256 $modelPath) -eq $env:MODEL_SHA256) {
              Write-Host "Model already present and verified at $modelPath"
              exit 0
            }

            Remove-Item $modelPath -Force
          }

          $tmpPath = "$modelPath.download"
          Invoke-WebRequest -Uri $env:MODEL_URL -OutFile $tmpPath
          $downloadedSha = Get-ModelSha256 $tmpPath

          if ($downloadedSha -ne $env:MODEL_SHA256) {
            Remove-Item $tmpPath -Force -ErrorAction SilentlyContinue
            throw "Downloaded model checksum mismatch. Expected $env:MODEL_SHA256 got $downloadedSha"
          }

          Move-Item -Force $tmpPath $modelPath

      # pyke's prebuilt onnxruntime.lib statically bakes in DirectML,
      # creating hard load-time dependencies on DirectML.dll, D3D12.dll,
      # DXCore.dll, etc.  Windows Server runners ship outdated system
      # versions of these DLLs (including a WinML onnxruntime.dll in
      # System32 that can shadow the static link).  Fix: stage matching
      # redistributable DLLs from official NuGet packages next to the
      # test binary so they are found first by the Windows loader.
      - name: Stage ORT runtime DLLs for Rust tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:GITHUB_WORKSPACE "src-tauri")
          cargo test --no-run 2>&1

          $depsDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/debug/deps"
          New-Item -ItemType Directory -Force -Path $depsDir | Out-Null

          # ---- 1. Official ORT 1.24.2 DirectML package ----
          # Provides onnxruntime.dll (shadows the incompatible WinML
          # system copy in System32) and DirectML.dll (matched version).
          $ortPkg = Join-Path $env:RUNNER_TEMP "ort-dml.zip"
          $ortDir = Join-Path $env:RUNNER_TEMP "ort-dml"
          Invoke-WebRequest `
            -Uri "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.DirectML/1.24.2" `
            -OutFile $ortPkg
          Expand-Archive -Force -Path $ortPkg -DestinationPath $ortDir

          foreach ($dll in Get-ChildItem "$ortDir/runtimes/win-x64/native" -Filter "*.dll" -ErrorAction SilentlyContinue) {
            $dest = Join-Path $depsDir $dll.Name
            if (Test-Path $dest) { Remove-Item $dest -Force }
            Copy-Item $dll.FullName $dest
            Write-Host "Staged $($dll.Name) (ORT DirectML) -> deps/"
          }

          # ---- 2. DirectX 12 Agility SDK ----
          # Provides D3D12Core.dll so the test binary can use a modern
          # D3D12 runtime even on Windows Server 2022 where the inbox
          # GPU stack may lack newer API entry points.
          $d3dPkg = Join-Path $env:RUNNER_TEMP "d3d12.zip"
          $d3dDir = Join-Path $env:RUNNER_TEMP "d3d12"
          Invoke-WebRequest `
            -Uri "https://www.nuget.org/api/v2/package/Microsoft.Direct3D.D3D12/1.619.1" `
            -OutFile $d3dPkg
          Expand-Archive -Force -Path $d3dPkg -DestinationPath $d3dDir

          # Agility SDK expects D3D12Core.dll in a D3D12/ subdir next
          # to the executable, or directly alongside it.
          $d3d12Sub = Join-Path $depsDir "D3D12"
          New-Item -ItemType Directory -Force -Path $d3d12Sub | Out-Null
          foreach ($dll in Get-ChildItem "$d3dDir/build/native/bin/x64" -Filter "*.dll" -ErrorAction SilentlyContinue) {
            Copy-Item $dll.FullName (Join-Path $d3d12Sub $dll.Name) -Force
            # Also place directly in deps/ as fallback
            Copy-Item $dll.FullName (Join-Path $depsDir $dll.Name) -Force
            Write-Host "Staged $($dll.Name) (D3D12 Agility SDK) -> deps/"
          }

          Write-Host "`nAll DLLs staged in deps/:"
          Get-ChildItem $depsDir -Filter "*.dll" -File |
            ForEach-Object { Write-Host "  $($_.Name)  ($($_.Length) bytes)" }

      - name: Lint frontend
        run: pnpm lint

      - name: Verify formatting
        run: pnpm format

      - name: Run Rust tests
        working-directory: src-tauri
        shell: pwsh
        run: |
          $depsDir = Resolve-Path "target/debug/deps"
          $env:PATH = "$depsDir;$env:PATH"
          cargo test -q

      - name: Validate Tauri build
        run: pnpm tauri build --debug --no-bundle --ci
