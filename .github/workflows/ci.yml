name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

env:
  MODEL_URL: https://github.com/thedavidweng/openkara-models/releases/download/model-v1.0.0/htdemucs.onnx
  MODEL_SHA256: 66eebc928e4a9f7e5b837605794f4db2b91748f163b0bcbc8f29a526ffe5607e

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            patchelf \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Download separation model (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/setup.sh

      - name: Download separation model (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $modelPath = Join-Path $env:GITHUB_WORKSPACE "src-tauri/models/htdemucs.onnx"
          $modelDir = Split-Path $modelPath
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null

          function Get-ModelSha256([string]$path) {
            return (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          }

          if (Test-Path $modelPath) {
            if ((Get-ModelSha256 $modelPath) -eq $env:MODEL_SHA256) {
              Write-Host "Model already present and verified at $modelPath"
              exit 0
            }

            Remove-Item $modelPath -Force
          }

          $tmpPath = "$modelPath.download"
          Invoke-WebRequest -Uri $env:MODEL_URL -OutFile $tmpPath
          $downloadedSha = Get-ModelSha256 $tmpPath

          if ($downloadedSha -ne $env:MODEL_SHA256) {
            Remove-Item $tmpPath -Force -ErrorAction SilentlyContinue
            throw "Downloaded model checksum mismatch. Expected $env:MODEL_SHA256 got $downloadedSha"
          }

          Move-Item -Force $tmpPath $modelPath

      - name: Build Rust test binaries (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --no-run

      - name: Copy ONNX Runtime DLLs for Rust tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $depsDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/debug/deps"
          New-Item -ItemType Directory -Force -Path $depsDir | Out-Null

          $buildOutputFiles = Get-ChildItem `
            -Path (Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/debug/build") `
            -Filter output `
            -File `
            -Recurse | Where-Object { $_.FullName -match "ort-sys-" }

          if (-not $buildOutputFiles) {
            throw "No ort-sys build-script output files were found under src-tauri/target/debug/build"
          }

          $nativeSearchDirs = @()
          foreach ($buildOutputFile in $buildOutputFiles) {
            foreach ($line in Get-Content $buildOutputFile.FullName) {
              if ($line -match "^cargo:rustc-link-search=native=(.+)$") {
                $nativeSearchDirs += $Matches[1]
              }
            }
          }

          $nativeSearchDirs = $nativeSearchDirs | Select-Object -Unique
          if (-not $nativeSearchDirs) {
            throw "ort-sys did not emit any native link-search directories"
          }

          Write-Host "ort-sys native link-search directories:"
          foreach ($nativeSearchDir in $nativeSearchDirs) {
            Write-Host "  - $nativeSearchDir"
          }

          $ortRuntimeDirs = foreach ($nativeSearchDir in $nativeSearchDirs) {
            $onnxRuntimeDll = Join-Path $nativeSearchDir "onnxruntime.dll"
            if (Test-Path $onnxRuntimeDll) {
              $nativeSearchDir
            }
          }

          $ortRuntimeDirs = $ortRuntimeDirs | Select-Object -Unique
          if (-not $ortRuntimeDirs) {
            throw "No ORT runtime directory was found among: $($nativeSearchDirs -join ', ')"
          }

          if ($ortRuntimeDirs.Count -ne 1) {
            throw "Expected exactly one ORT runtime directory, found: $($ortRuntimeDirs -join ', ')"
          }

          $ortRuntimeDir = $ortRuntimeDirs[0]
          Write-Host "Selected ORT runtime directory: $ortRuntimeDir"

          $sourceDlls = Get-ChildItem -Path $ortRuntimeDir -Filter "*.dll" -File | Sort-Object Name
          if (-not $sourceDlls) {
            throw "No DLLs were found in selected ORT runtime directory: $ortRuntimeDir"
          }

          Write-Host "ORT runtime DLLs in source directory:"
          foreach ($sourceDll in $sourceDlls) {
            $sourceHash = (Get-FileHash -Algorithm SHA256 $sourceDll.FullName).Hash.ToLowerInvariant()
            $sourceVersion = $sourceDll.VersionInfo.FileVersion
            Write-Host "  - $($sourceDll.Name) | $sourceVersion | $sourceHash | $($sourceDll.FullName)"
          }

          $resolvedDepsDir = [System.IO.Path]::GetFullPath($depsDir)
          $stagedTargets = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($dll in $sourceDlls) {
            $sourcePath = [System.IO.Path]::GetFullPath($dll.FullName)
            $targetPath = [System.IO.Path]::GetFullPath((Join-Path $depsDir $dll.Name))

            if ($sourcePath -ieq $targetPath) {
              continue
            }

            if ($sourcePath.StartsWith($resolvedDepsDir, [System.StringComparison]::OrdinalIgnoreCase)) {
              continue
            }

            if (-not $stagedTargets.Add($targetPath)) {
              continue
            }

            if (Test-Path $targetPath) {
              Remove-Item $targetPath -Force
            }

            Copy-Item -Force $sourcePath $targetPath
          }

          $stagedDlls = Get-ChildItem -Path $depsDir -Filter "*.dll" -File |
            Where-Object { $_.Name -in $sourceDlls.Name } |
            Sort-Object Name

          if (-not $stagedDlls) {
            throw "ORT DLL staging produced no files in $depsDir"
          }

          Write-Host "ORT runtime DLLs staged in deps:"
          foreach ($stagedDll in $stagedDlls) {
            $stagedHash = (Get-FileHash -Algorithm SHA256 $stagedDll.FullName).Hash.ToLowerInvariant()
            $stagedVersion = $stagedDll.VersionInfo.FileVersion
            Write-Host "  - $($stagedDll.Name) | $stagedVersion | $stagedHash | $($stagedDll.FullName)"
          }

      - name: Lint frontend
        run: pnpm lint

      - name: Verify formatting
        run: pnpm format

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test -q

      - name: Validate Tauri build
        run: pnpm tauri build --debug --no-bundle --ci
