name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        type: string
      notes:
        description: "Extra release notes (appended after default text)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  publish:
    name: Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: macOS (Intel)
            os: macos-14
            args: --target x86_64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            ort_dylib: true
          - name: Windows
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: Linux
            os: ubuntu-24.04
            args: ""
            rust_targets: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            patchelf \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Download ONNX Runtime for Intel Mac cross-compile
        if: matrix.ort_dylib
        run: |
          ORT_VERSION="1.20.1"
          curl -L -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-x86_64-${ORT_VERSION}.tgz"
          mkdir -p ${{ github.workspace }}/ort-x64
          tar -xzf ort.tgz --strip-components=1 -C ${{ github.workspace }}/ort-x64
          echo "ORT_LIB_LOCATION=${{ github.workspace }}/ort-x64/lib" >> $GITHUB_ENV
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> $GITHUB_ENV

          # Inject macOS.frameworks into tauri.conf.json so the dylib is bundled inside .app
          ORT_DYLIB=$(ls ${{ github.workspace }}/ort-x64/lib/libonnxruntime.*.dylib | head -1)
          jq --arg dylib "$ORT_DYLIB" '.bundle.macOS.frameworks = [$dylib]' \
            src-tauri/tauri.conf.json > src-tauri/tauri.conf.tmp \
            && mv src-tauri/tauri.conf.tmp src-tauri/tauri.conf.json

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ github.event.inputs.version }}
          releaseName: OpenKara v${{ github.event.inputs.version }}
          releaseBody: |
            See the assets below to download and install this version of OpenKara.
            ${{ github.event.inputs.notes }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          tauriScript: pnpm tauri
