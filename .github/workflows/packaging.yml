name: Packaging

on:
  pull_request:
    paths:
      - ".github/workflows/packaging.yml"
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "scripts/render-*.mjs"
      - "scripts/release-metadata.mjs"
      - "src-tauri/tauri.conf.json"
  push:
    branches: ["main", "codex/**"]
    paths:
      - ".github/workflows/packaging.yml"
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "scripts/render-*.mjs"
      - "scripts/release-metadata.mjs"
      - "src-tauri/tauri.conf.json"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-winget:
    name: Validate WinGet manifests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Render WinGet manifests from current public release
        run: |
          node scripts/render-winget-manifests.mjs --version 0.1.0 --output ${{ github.workspace }}/dist/winget

      - name: Install latest WinGet client
        shell: pwsh
        run: |
          $progressPreference = 'silentlyContinue'
          # GitHub Windows images no longer resolve the legacy NuGet PackageProvider bootstrap reliably.
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery -Scope CurrentUser | Out-Null
          Import-Module Microsoft.WinGet.Client
          Repair-WinGetPackageManager -Force -Latest
          winget --version

      - name: Validate WinGet manifests
        shell: pwsh
        run: |
          winget validate --manifest "$env:GITHUB_WORKSPACE/dist/winget/t/thedavidweng/OpenKara/0.1.0"

  validate-flatpak:
    name: Validate Flatpak metadata
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install metadata validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream flatpak-builder

      - name: Render Flatpak manifests from current public release
        run: |
          node scripts/render-flatpak-manifest.mjs \
            --version 0.1.0 \
            --output "${{ github.workspace }}/dist/flatpak" \
            --screenshot-base-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/packaging/flatpak/screenshots"

      - name: Validate AppStream metadata
        run: |
          appstreamcli validate "${{ github.workspace }}/dist/flatpak/io.github.thedavidweng.OpenKara/io.github.thedavidweng.OpenKara.metainfo.xml"

      - name: Validate Flatpak manifest syntax
        run: |
          flatpak-builder --show-manifest "${{ github.workspace }}/dist/flatpak/io.github.thedavidweng.OpenKara/io.github.thedavidweng.OpenKara.yml" > /dev/null
