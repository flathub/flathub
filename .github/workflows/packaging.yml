name: Packaging

on:
  pull_request:
    paths:
      - ".github/workflows/packaging.yml"
      - ".github/workflows/release.yml"
      - "package.json"
      - "packaging/**"
      - "pnpm-lock.yaml"
      - "scripts/prepare-onnx-runtime.mjs"
      - "scripts/render-*.mjs"
      - "scripts/release-metadata.mjs"
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
      - "src-tauri/tauri.conf.json"
      - "tests/flatpak-packaging.test.ts"
  push:
    branches: ["main", "codex/**"]
    paths:
      - ".github/workflows/packaging.yml"
      - ".github/workflows/release.yml"
      - "package.json"
      - "packaging/**"
      - "pnpm-lock.yaml"
      - "scripts/prepare-onnx-runtime.mjs"
      - "scripts/render-*.mjs"
      - "scripts/release-metadata.mjs"
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
      - "src-tauri/tauri.conf.json"
      - "tests/flatpak-packaging.test.ts"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-winget:
    name: Validate WinGet manifests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve latest public release version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 1 --json tagName --jq '.[0].tagName | sub("^v"; "")')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Render WinGet manifests from current public release
        run: |
          node scripts/render-winget-manifests.mjs --version "${{ steps.release.outputs.version }}" --output ${{ github.workspace }}/dist/winget

      - name: Install latest WinGet client
        shell: pwsh
        run: |
          $progressPreference = 'silentlyContinue'
          # GitHub Windows images no longer resolve the legacy NuGet PackageProvider bootstrap reliably.
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery -Scope CurrentUser | Out-Null
          Import-Module Microsoft.WinGet.Client
          Repair-WinGetPackageManager -Force -Latest
          winget --version

      - name: Validate WinGet manifests
        shell: pwsh
        run: |
          winget validate --manifest "$env:GITHUB_WORKSPACE/dist/winget/t/thedavidweng/OpenKara/${{ steps.release.outputs.version }}"

  validate-flatpak:
    name: Validate Flatpak metadata
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Flatpak validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Validate Flatpak packaging invariants
        run: pnpm test tests/flatpak-packaging.test.ts

      - name: Validate upstream AppStream metadata
        run: |
          appstreamcli validate packaging/flatpak/io.github.thedavidweng.OpenKara.metainfo.xml

      - name: Render Flatpak manifests from current checkout
        env:
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          node scripts/render-flatpak-manifest.mjs \
            --version "${version}" \
            --source-url "https://github.com/${SOURCE_REPO}/archive/${SOURCE_SHA}.tar.gz" \
            --output "${{ github.workspace }}/dist/flatpak"

      - name: Validate Flatpak manifest syntax
        run: |
          flatpak-builder --show-manifest "${{ github.workspace }}/dist/flatpak/io.github.thedavidweng.OpenKara/io.github.thedavidweng.OpenKara.yml" > /dev/null

      - name: Validate Flatpak dependency source downloads
        run: |
          flatpak-builder --user --force-clean --install-deps-from=flathub --download-only "${{ github.workspace }}/flatpak-build" "${{ github.workspace }}/dist/flatpak/io.github.thedavidweng.OpenKara/io.github.thedavidweng.OpenKara.yml"
