# The "Check for updates" workflow of the Pear docs' "Automate new releases", for the app's
# repository on Flathub (flathub/dev.ciranda.Capy), after Keet's
# (github.com/flathub/io.keet.Keet/blob/master/.github/workflows/update.yml): run it from the
# Actions tab and the external data checker opens a PR for the newest capy-releases release.
# flathub.json opts out of the central checker, which runs every 4 hours
name: Check for updates
on:
  workflow_dispatch: {}
jobs:
  flatpak-external-data-checker:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'flathub'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        env:
          GIT_AUTHOR_NAME: Flatpak External Data Checker
          GIT_COMMITTER_NAME: Flatpak External Data Checker
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --never-fork dev.ciranda.Capy.yml
