name: Check and Update Upstream HMCL

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/workflows/update.py

      - name: Commit and push changes
        run: |
          if ! git diff --quiet io.github.theoninesixy.HMCL.yml io.github.theoninesixy.HMCL.metainfo.xml; then
            echo "[INFO] Changes detected, committing and pushing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add io.github.theoninesixy.HMCL.yml io.github.theoninesixy.HMCL.metainfo.xml
            git commit -m "[AUTO] Sync upstream HMCL to latest release"
            git push origin HEAD:main
            echo "[INFO] Push completed successfully."
          else
            echo "[INFO] No changes detected. All files are up to date."
          fi