name: Check for updates

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Get latest tag
        id: get-tag
        run: |
          TAG=$(curl -s https://api.github.com/repos/CCBlueX/LiquidLauncher/releases/latest | jq -r '.tag_name')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: CCBlueX/LiquidLauncher
          path: liquidlauncher
          ref: ${{ steps.get-tag.outputs.tag }}

      - uses: actions/checkout@v4
        with:
          repository: flatpak/flatpak-builder-tools
          path: flatpak-builder-tools
          ref: 74697c75b630d7330e77250fc13cb5ea688d9479

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate sources
        run: |
          pip install tomlkit aiohttp ./flatpak-builder-tools/node
          python3 flatpak-builder-tools/cargo/flatpak-cargo-generator.py liquidlauncher/src-tauri/Cargo.lock -o cargo-sources.json
          flatpak-node-generator yarn liquidlauncher/yarn.lock -o node-sources.json

      - name: Commit sources
        run: |
          printf '%s\n' liquidlauncher flatpak-builder-tools >> .git/info/exclude
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cargo-sources.json node-sources.json
          git diff --cached --quiet || git commit -m "chore: update sources for ${{ steps.get-tag.outputs.tag }}"

      - uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        env:
          GIT_AUTHOR_NAME: Flatpak External Data Checker
          GIT_COMMITTER_NAME: Flatpak External Data Checker
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --never-fork net.ccbluex.liquidlauncher.yml
