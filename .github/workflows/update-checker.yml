name: Automatic update
on:
  repository_dispatch:
    types: [aster-release]

jobs:
  flatpak-external-data-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        branch: [ master ]

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ matrix.branch }}
      - name: Flatpak External Data Checker
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        with:
          args: --update --edit-only org.astermail.Mail.yml
      - name: Generate Sources
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3
          ./generate-sources.sh
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer: Flatpak External Data Checker <41898282+github-actions[bot]@users.noreply.github.com>
          author: Flatpak External Data Checker <41898282+github-actions[bot]@users.noreply.github.com>
          base: master
          branch: update-master
          branch-suffix: short-commit-hash
          delete-branch: true
          commit-message: |
            update: astermail and offline sources
          title: |
            Automatic Aster-Mail source re-generation and update
          body: |
            This pull request was automatically generated by a automatic workflow started by a repository dispatch.

            Runs [Flatpak External Data Checker](https://github.com/flathub-infra/flatpak-external-data-checker) to update the upstream source and re-generates source metadata using generate-sources.sh.
