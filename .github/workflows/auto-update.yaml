name: Auto update

on:
  push:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup environment variables
        run: |
          echo "FLATPAK_BUILDER_TOOLS_DIR=/tmp/flatpak-builder-tools" >> $GITHUB_ENV
          APP_URL="$(yq '.modules[0].sources[] | select(.url | test("archive/v.*\\.tar\\.gz")) | .url' app.legcord.Legcord.yaml)"
          APP_VERSION=$(echo "$APP_URL" | sed -E 's|.*/v([0-9.]+)\.tar\.gz|\1|')
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Setup flatpak-builder-tools
        run: |
          git clone --depth=1 https://github.com/flatpak/flatpak-builder-tools ${FLATPAK_BUILDER_TOOLS_DIR}
          pip install --user pipx && pipx install ${FLATPAK_BUILDER_TOOLS_DIR}/node
          pip install --user toml aiohttp

    #   - name: Update Node.js generated sources
    #     run: |
    #       git clone https://github.com/Legcord/Legcord.git --depth=1 --branch=${APP_VERSION} /tmp/app

    #       flatpak-node-generator pnpm /tmp/app/pnpm-lock.yaml --node-sdk-extension org.freedesktop.Sdk.Extension.node26 --electron-node-headers -o generated-sources.json

      - name: Fetch generated-sources.json from release
        uses: robinraju/release-downloader@v1
        with:
            repository: 'Legcord/Legcord'
            tag: ${{ env.APP_VERSION }}
            fileName: 'generated-sources.json'

      - name: Commit updates
        run: |
          set -e

          [[ ! $(git status --porcelain) ]] && exit 0

          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config user.name "Workflow trigger"

          git add generated-sources.json
          git commit -m 'Update generated sources'

          git push https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}