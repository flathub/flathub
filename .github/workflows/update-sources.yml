name: Update generated sources on version bump

# Fires automatically when Flathub's external-data-checker pushes a
# version-bump commit that touches the manifest (tag + dist URL change).
# Also available as a manual workflow_dispatch for re-runs and debugging.
on:
  push:
    branches-ignore:
      - master
    paths:
      - me.proton.Authenticator.yml
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to regenerate sources on (defaults to current branch)
        required: false

# Serialise runs per branch so two rapid pushes don't both try to commit.
# A newer push supersedes an older in-progress run.
concurrency:
  group: update-sources-${{ inputs.branch || github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 2

      - name: Check whether regeneration is needed
        id: need-regen
        run: |
          NEW_TAG=$(grep -oP '(?<=tag: )proton-authenticator@[\d.]+' me.proton.Authenticator.yml || true)
          PREV_TAG=$(git show HEAD~1:me.proton.Authenticator.yml 2>/dev/null \
            | grep -oP '(?<=tag: )proton-authenticator@[\d.]+' || true)
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$NEW_TAG" ]; then
            echo "No tag found in manifest — skipping." >&2
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif [ "$NEW_TAG" = "$PREV_TAG" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "Tag unchanged ($NEW_TAG) — skipping." >&2
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag changed: $PREV_TAG -> $NEW_TAG — regenerating." >&2
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.need-regen.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install generators
        if: steps.need-regen.outputs.needed == 'true'
        run: |
          pip install --quiet aiohttp==3.13.5 tomlkit==0.15.0 \
            'flatpak_node_generator @ git+https://github.com/flatpak/flatpak-builder-tools@41c20aa10819cdb2a4f3ca171758a96d1955c018#subdirectory=node'
          mkdir -p _tools
          wget -q -O _tools/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/f03a673abe6ce189cea1c2857e2b44af2dd79d1f/cargo/flatpak-cargo-generator.py
          echo 'b373c8ab1a05378ec5d8ed0645c7b127bcec7d2f7a1798694fbc627d570d856c  _tools/flatpak-cargo-generator.py' | sha256sum -c

      - name: Regenerate cargo and node sources
        if: steps.need-regen.outputs.needed == 'true'
        env:
          FLATPAK_CARGO_GENERATOR: _tools/flatpak-cargo-generator.py
        run: |
          export FLATPAK_CARGO_GENERATOR="$PWD/$FLATPAK_CARGO_GENERATOR"
          tools/update-sources.sh "${{ steps.need-regen.outputs.new_tag }}"

      - name: Commit and push
        if: steps.need-regen.outputs.needed == 'true'
        run: |
          TAG="${{ steps.need-regen.outputs.new_tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cargo-sources.json node-sources.json
          if git diff --cached --quiet; then
            echo "Nothing changed — nothing to commit."
          else
            git commit -m "ci: regenerate cargo and node sources for $TAG"
            # Rebase onto any commits that landed while we were generating
            # (e.g. a second external-data-checker push) before pushing,
            # so we never hit a non-fast-forward rejection.
            git fetch origin
            git rebase origin/$(git rev-parse --abbrev-ref HEAD)
            git push
          fi
