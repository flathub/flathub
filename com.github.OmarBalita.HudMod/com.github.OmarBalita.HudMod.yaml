id: com.github.OmarBalita.HudMod
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: hudmod
finish-args:
  - --share=ipc
    - --socket=x11
      - --socket=wayland
        - --socket=pulseaudio
          - --device=dri
            - --filesystem=host
            modules:
              - name: hudmod
                  buildsystem: simple
                      build-commands:
                            - install -d /app/bin /app/share/applications /app/share/icons/hicolor/256x256/apps
                                  - install -m 755 HudMod.x86_64 /app/bin/hudmod
                                        - install -m 644 com.github.OmarBalita.HudMod.desktop /app/share/applications/com.github.OmarBalita.HudMod.desktop
                                              - install -m 644 logo.png /app/share/icons/hicolor/256x256/apps/com.github.OmarBalita.HudMod.png
                                                  sources:
                                                        - type: file
                                                                url: https://github.com/OmarBalita/HudMod-Public/releases/download/alpha/HudMod.x86_64
                                                                        sha256: "0019dfc4b32d63c1392aa264aed2253c1e0c2fb09216f8e2cc269bbfb8bb49b5"
                                                                              - type: file
                                                                                      url: https://raw.githubusercontent.com/OmarBalita/HudMod-Public/main/Asset/Icons/App/logo.png
                                                                                              sha256: "457cc95c91f5880c9fa6c75cf05a08c0462a8646418ab3cd876d587ba0e528fe"
                                                                                                    - type: file
                                                                                                            url: https://raw.githubusercontent.com/OmarBalita/HudMod-Public/main/com.github.OmarBalita.HudMod.desktop
                                                                                                                    sha256: "80d5b98ee68d597a6d7469c3eeb9e5683d8f95962d674839021584ca33589e84"
                                                                                                                    