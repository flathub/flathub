app-id: com.datlasdb.Datlas
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: datlas

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --env=QT_QPA_PLATFORMTHEME=xdgdesktopportal

modules:
  - name: datlas
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/cendyandreoli/datlas-releases/releases/download/v0.3.39/Datlas-0.3.39-linux-x86_64.tar.gz
        sha256: 2b9b551b4d20a65347f86a4ea0a181fb7311a89fba6ca09fde0e680feaa3a282
        x-checker-data:
          type: json
          url: https://api.github.com/repos/cendyandreoli/datlas-releases/releases/latest
          version-query: '.tag_name | sub("^v"; "")'
          url-query: '.assets[] | select(.name | endswith("-linux-x86_64.tar.gz")) | .browser_download_url'
      - type: file
        path: com.datlasdb.Datlas.png
        dest-filename: datlas-icon.png
    build-commands:
      - install -d /app/bin /app/lib/datlas
      - install -m755 datlas /app/lib/datlas/datlas
      - cp -a _internal /app/lib/datlas/
      - install -m644 THIRD_PARTY_NOTICES.txt /app/lib/datlas/THIRD_PARTY_NOTICES.txt
      - ln -s ../lib/datlas/datlas /app/bin/datlas
      - install -Dm644 com.datlasdb.Datlas.desktop /app/share/applications/com.datlasdb.Datlas.desktop
      - install -Dm644 com.datlasdb.Datlas.metainfo.xml /app/share/metainfo/com.datlasdb.Datlas.metainfo.xml
      - install -Dm644 datlas-icon.png /app/share/icons/hicolor/512x512/apps/com.datlasdb.Datlas.png
