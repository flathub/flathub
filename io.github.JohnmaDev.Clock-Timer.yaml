app-id: io.github.JohnmaDev.Clock-Timer
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: clock-timer

cleanup-commands:
  - /app/cleanup-BaseApp.sh

build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: clock-timer
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/share/clock-timer /app/share/applications /app/share/metainfo /app/share/icons/hicolor/512x512/apps
      - cp -r app /app/share/clock-timer/
      - install -D -m644 icon.png /app/share/clock-timer/icon.png
      - install -D -m755 main.py /app/share/clock-timer/main.py
      # Launcher
      - |
        cat << 'EOF' > /app/bin/clock-timer
        #!/bin/sh
        exec python3 /app/share/clock-timer/main.py "$@"
        EOF
      - chmod +x /app/bin/clock-timer
      # Desktop, metainfo, and icon
      - install -D -m644 io.github.JohnmaDev.Clock-Timer.desktop /app/share/applications/io.github.JohnmaDev.Clock-Timer.desktop
      - install -D -m644 io.github.JohnmaDev.Clock-Timer.metainfo.xml /app/share/metainfo/io.github.JohnmaDev.Clock-Timer.metainfo.xml
      - install -D -m644 io.github.JohnmaDev.Clock-Timer.png /app/share/icons/hicolor/512x512/apps/io.github.JohnmaDev.Clock-Timer.png
    sources:
      - type: git
        url: https://github.com/JohnmaDev/Clock-Timer.git
        tag: v1.0.0
        commit: 77c193ee7e41b79402105651912d7c39e737d142
