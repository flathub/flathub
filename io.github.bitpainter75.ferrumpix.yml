app-id: io.github.bitpainter75.ferrumpix
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: ferrumpix

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download
  - --filesystem=xdg-desktop
  - --filesystem=xdg-videos
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  - --filesystem=xdg-run/gvfs

modules:
  - name: libraw
    buildsystem: autotools
    config-opts:
      - --disable-examples
      - --disable-static
      - --enable-zlib
      - --enable-jpeg
      - --enable-lcms
      - --enable-openmp
    sources:
      - type: archive
        url: https://www.libraw.org/data/LibRaw-0.22.2.tar.gz
        sha256: de86b035655accff8d4010f1a221fdf50d353cb7b1422ba26f14a0db92612cfa
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.la
      - /share

  - name: libXpresent
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://xorg.freedesktop.org/archive/individual/lib/libXpresent-1.0.2.tar.xz
        sha256: 4e5b21b4812206a4b223013606ae31170502c1043038777a1ef8f70c09d37602
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.la
      - /share/man
      - /share/doc

  - name: libass
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-libunibreak
      - --enable-fontconfig
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.la

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dvulkan=disabled
      - -Dglslang=disabled
      - -Dshaderc=disabled
      - -Dopengl=enabled
      - -Dlcms=enabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
    cleanup:
      - /include
      - /lib/pkgconfig

  - name: mpv
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dx11=enabled
      - -Dgl=enabled
      - -Degl=enabled
      - -Degl-x11=enabled
      - -Dpulse=enabled
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dspirv-cross=disabled
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dlibarchive=disabled
      - -Dlibbluray=disabled
      - -Ddvdnav=disabled
      - -Dcdda=disabled
      - -Duchardet=disabled
      - -Drubberband=disabled
      - -Dzimg=disabled
      - -Dvapoursynth=disabled
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dpdf-build=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/doc

  - name: ferrumpix
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/dotnet10/bin
      prepend-ld-library-path: /usr/lib/sdk/dotnet10/lib
      env:
        DOTNET_ROOT: /usr/lib/sdk/dotnet10/lib
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        DOTNET_NOLOGO: '1'
        NUGET_PACKAGES: /run/build/ferrumpix/nuget-cache

    build-commands:
      - |
        case "$FLATPAK_ARCH" in
        x86_64) RID=linux-x64 ;;
        aarch64) RID=linux-arm64 ;;
        *) echo "Unsupported architecture: $FLATPAK_ARCH"; exit 1 ;;
        esac
        dotnet publish FerrumPix.vbproj \
        -c Release \
        -r "$RID" \
        --self-contained true \
        -p:PublishSingleFile=true \
        -p:PublishReadyToRun=true \
        -p:DebugType=None \
        -p:RuntimeIdentifiers="$RID" \
        -p:InformationalVersion="$(cat VERSION)" \
        --source ./nuget-sources \
        -o publish \
        --nologo

      - install -d /app/lib/ferrumpix
      - cp -r publish/. /app/lib/ferrumpix/
      - chmod +x /app/lib/ferrumpix/FerrumPix
      - install -Dm644 LICENSE /app/lib/ferrumpix/LICENSE
      - install -Dm644 flatpak/THIRD-PARTY-NOTICES.txt /app/lib/ferrumpix/THIRD-PARTY-NOTICES.txt
      - install -Dm755 flatpak/launcher.sh /app/bin/ferrumpix
      - install -Dm644 flatpak/io.github.bitpainter75.ferrumpix.desktop /app/share/applications/io.github.bitpainter75.ferrumpix.desktop
      - install -Dm644 flatpak/icon.png /app/share/icons/hicolor/256x256/apps/io.github.bitpainter75.ferrumpix.png
      - install -Dm644 flatpak/io.github.bitpainter75.ferrumpix.metainfo.xml /app/share/metainfo/io.github.bitpainter75.ferrumpix.metainfo.xml
      - install -Dm644 flatpak/libraw/LICENSE.LGPL-2.1.txt /app/share/licenses/io.github.bitpainter75.ferrumpix/libraw/LICENSE.LGPL-2.1.txt
      - install -Dm644 flatpak/libraw/THIRD-PARTY-libraw.txt /app/share/licenses/io.github.bitpainter75.ferrumpix/libraw/THIRD-PARTY-libraw.txt
    cleanup:
      - /lib/ferrumpix/*.dll
      - /lib/ferrumpix/*.a
    sources:
      - type: git
        url: https://github.com/Bitpainter75/FerrumPix.git
        tag: '0.9.71-1'
        commit: 6f28034c74db095cc392b395c58456564d5f079a
      - nuget-sources.json
