app-id: com.tercad.tlum
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: tlum
separate-locales: false
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --share=ipc
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - '*.a'
  - '*.la'
modules:
  - name: portaudio
    buildsystem: autotools
    config-opts:
      - --without-jack
    sources:
      - type: archive
        url: https://files.portaudio.com/archives/pa_stable_v190700_20210406.tgz
        sha256: 47efbf42c77c19a05d22e627d42873e991ec0c1357219c0d74ce6a2948cb2def

  - name: SDL2_image
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DSDL2IMAGE_SAMPLES=OFF
      - -DSDL2IMAGE_VENDORED=OFF
      - -DSDL2IMAGE_AVIF=OFF
      - -DSDL2IMAGE_JXL=OFF
      - -DSDL2IMAGE_WEBP=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.12/SDL2_image-2.8.12.tar.gz
        sha256: 393f5efb50536ec13ca4f4affb69cc9966d3c3f969e6c5e701faddf9f9785381

  - name: SDL2_ttf
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DSDL2TTF_SAMPLES=OFF
      - -DSDL2TTF_VENDORED=OFF
      - -DSDL2TTF_HARFBUZZ=ON
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.24.0/SDL2_ttf-2.24.0.tar.gz
        sha256: 0b2bf1e7b6568adbdbc9bb924643f79d9dedafe061fa1ed687d1d9ac4e453bfd

  - python3-modules.json

  - name: tlum
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/tlum
      - cp -r main.py src assets /app/share/tlum/
      - python3 -m compileall -q /app/share/tlum
      - install -Dm755 linux-flatpak/tlum.sh /app/bin/tlum
      - install -Dm644 com.tercad.tlum.svg /app/share/icons/hicolor/scalable/apps/com.tercad.tlum.svg
      - install -Dm644 com.tercad.tlum.desktop /app/share/applications/com.tercad.tlum.desktop
      - install -Dm644 com.tercad.tlum.metainfo.xml /app/share/metainfo/com.tercad.tlum.metainfo.xml
    sources:
      - type: git
        url: https://github.com/lyskouski/app-language.git
        tag: v0.6.6
        commit: '2339c8347d8e824d9c779eea1b6cb98c081c3b7d'
      - type: file
        path: com.tercad.tlum.metainfo.xml
