app-id: com.tercad.tlum
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: tlum
build-options:
  libdir: lib
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --share=ipc
  - --device=dri
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - '*.a'
  - '*.la'
modules:
  - name: portaudio
    buildsystem: autotools
    build-options:
      libdir: /app/lib
    config-opts:
      - --without-jack
    sources:
      - type: archive
        url: https://files.portaudio.com/archives/pa_stable_v190700_20210406.tgz
        sha256: 47efbf42c77c19a05d22e627d42873e991ec0c1357219c0d74ce6a2948cb2def

  - shared-modules/SDL2/SDL2_image.json

  - shared-modules/SDL2/SDL2_ttf.json

  - shared-modules/SDL2/SDL2_mixer.json

  - python3-modules.json

  - name: tlum
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/tlum
      - cp -r main.py src assets /app/share/tlum/
      - python3 -m compileall -q /app/share/tlum
      - install -Dm755 linux-flatpak/tlum.sh /app/bin/tlum
      - install -Dm644 com.tercad.tlum.svg /app/share/icons/hicolor/scalable/apps/com.tercad.tlum.svg
      - install -Dm644 com.tercad.tlum.desktop /app/share/applications/com.tercad.tlum.desktop
      - install -Dm644 linux-flatpak/com.tercad.tlum.metainfo.xml /app/share/metainfo/com.tercad.tlum.metainfo.xml
    sources:
      - type: git
        url: https://github.com/lyskouski/app-language.git
        tag: v0.6.9
        commit: '90d9f0ce8b315712ff819bb3fecc36ab44aba2aa'
