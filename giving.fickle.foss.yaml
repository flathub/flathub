---
# Flatpak manifest for Fickle FOSS
# https://github.com/benopotamus/fickle-foss
#
# Build with:
#   flatpak-builder --user --force-clean --install builddir giving.fickle.foss.yaml
#   flatpak run giving.fickle.foss
#
# Or bundle a redistributable .flatpak with:
#   flatpak build-export repo builddir
#   flatpak build-bundle repo giving.fickle.foss.flatpak giving.fickle.foss
#
id: giving.fickle.foss
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: fickle-foss

separate-locales: false

finish-args:
  - --share=ipc
  # Display: prefer Wayland, fall back to X11, enable GPU.
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # The main Fickle FOSS data directory. It contains
  #   * fickle-foss.db (stores records of dates that apps were run, and donations saved)
  #   * ignore-list (a list of apps that should not be displayed in Fickle FOSS (intended to hide apps that don't accept donations such as Steam))
  #   * queue (a record of apps used by date)
  #   * app-icons-cache (a copy of app icons).
  #
  # The app-icons-cache (and the queue file) is populated by the Fickle FOSS Tracker Gnome Extension. This is necessary because icons for apps that were installed by a system package manager are stored under the `/usr/ directory - which is "reserved by Flatpak". Copying icons means a Flatpak installed version of Fickle FOSS can display app icons as required.
  - --filesystem=home/.local/share/fickle-foss

modules:
  - name: fickle-foss
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/benopotamus/fickle-foss.git
        tag: v0.1.4
        commit: 000c634e591d06fda15f3faf801e4b48ade3eef6
