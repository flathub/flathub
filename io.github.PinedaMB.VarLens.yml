app-id: io.github.PinedaMB.VarLens
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: varlens

finish-args:
  # Wayland & X11 fallback
  - --socket=fallback-x11
  - --socket=wayland
  # OpenGL / GPU rendering
  - --device=dri
  # Allow opening/saving local files through file pickers
  - --filesystem=host:ro

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/varlens/cargo-home

modules:
  - name: varlens
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/varlens /app/bin/varlens
      - install -Dm644 data/io.github.PinedaMB.VarLens.desktop /app/share/applications/io.github.PinedaMB.VarLens.desktop
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.PinedaMB.VarLens.svg /app/share/icons/hicolor/scalable/apps/io.github.PinedaMB.VarLens.svg
      - install -Dm644 data/io.github.PinedaMB.VarLens.metainfo.xml /app/share/metainfo/io.github.PinedaMB.VarLens.metainfo.xml
    sources:
      - type: git
        url: https://github.com/PinedaMB/VarLens.git
        tag: v1.0.0
      - cargo-sources.json
