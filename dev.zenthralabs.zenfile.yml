app-id: dev.zenthralabs.zenfile
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: file-manager
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
finish-args:
  # GUI / Windowing sockets
  - --socket=wayland
  - --socket=fallback-x11
  # GPU acceleration (required for Zenthra's GPU rendering)
  - --device=dri
  # Full filesystem access (essential for a file manager)
  - --filesystem=host
  # Spawning external apps (to open files on the host system)
  - --talk-name=org.freedesktop.portal.Flatpak
  # Access external drives/USB devices
  - --device=all
  # Show notifications (if ZenFile sends notifications)
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: zenfile
    buildsystem: simple
    build-commands:
      # Build the rust binary offline using the vendored dependencies
      - cargo --offline build --release
      # Install binary
      - install -Dm755 target/release/file-manager /app/bin/file-manager
      # Install desktop file and app icon
      - install -Dm644 dev.zenthralabs.zenfile.desktop /app/share/applications/dev.zenthralabs.zenfile.desktop
      - install -Dm644 dev.zenthralabs.zenfile.png /app/share/icons/hicolor/512x512/apps/dev.zenthralabs.zenfile.png
      # Install AppStream metadata
      - install -Dm644 dev.zenthralabs.zenfile.metainfo.xml /app/share/metainfo/dev.zenthralabs.zenfile.metainfo.xml
    sources:
      - type: dir
        path: ..
      # The generated offline sources list for cargo build
      - type: file
        path: generated-sources.json
