id: com.timopartl.workinghours
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: WorkingHours
finish-args:
  - --share=ipc
  - --socket=x11 # Native Wayland cannot yet raise an existing window (Avalonia #21943).
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: workinghours
    buildsystem: simple
    build-commands: [cp -a bin lib share /app/]
    sources:
      - type: archive
        url: https://apps.timopartl.com/linux/workinghours/WorkingHours-2.19.5-linux-x64.tar.xz
        sha256: 9aec029311e4ae849b946837197403e2ba37ba203eeeaa83f763926749965f08
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://apps.timopartl.com/linux/workinghours/latest.json
          version-query: .version
          url-query: .archives.x86_64
          update-group: workinghours
      - type: archive
        url: https://apps.timopartl.com/linux/workinghours/WorkingHours-2.19.5-linux-arm64.tar.xz
        sha256: d211cd0edc602d2d844cc8bcc89136a2444697ba1cf055276274660521399ee8
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://apps.timopartl.com/linux/workinghours/latest.json
          version-query: .version
          url-query: .archives.aarch64
          update-group: workinghours
