id: com.timopartl.workinghours
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: WorkingHours
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: workinghours
    buildsystem: simple
    build-commands: [cp -a bin lib share /app/]
    sources:
      - type: archive
        url: https://apps.timopartl.com/linux/workinghours/WorkingHours-2.19.6-linux-x64.tar.xz
        sha256: dcaa35d7cf8d94a80fdda1125324394e37236c6704b0717cae0c1e8aa72adc05
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://apps.timopartl.com/linux/workinghours/latest.json
          version-query: .version
          url-query: .archives.x86_64
          update-group: workinghours
      - type: archive
        url: https://apps.timopartl.com/linux/workinghours/WorkingHours-2.19.6-linux-arm64.tar.xz
        sha256: 700d170522b77d14b278e89e4fef7297f74510abbeed33b50fe93353fc2053db
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://apps.timopartl.com/linux/workinghours/latest.json
          version-query: .version
          url-query: .archives.aarch64
          update-group: workinghours
