id: nz.net.jonesie.Costree
runtime: org.freedesktop.Platform
runtime-version: "25.08"
base: com.system76.Cosmic.BaseApp
base-version: stable
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: costree
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # CosTree's purpose is measuring/renaming/deleting arbitrary paths on
  # disk, not just its own sandbox — same justification org.gnome.baobab
  # uses for the same permission.
  - --filesystem=host
  # Lets CosTree also measure other Flatpak apps' data directories.
  - --filesystem=~/.var/app
  # Where cosmic_config persists CosTree's settings (see config_handle in
  # src/app.rs).
  - --filesystem=xdg-config/cosmic:rw
  # Standard libcosmic theme-following integration.
  - --talk-name=com.system76.CosmicSettingsDaemon
  # Needed for flatpak-spawn --host, used by open_in_files() in
  # src/app/tasks.rs to launch cosmic-files/xdg-open on the host.
  - --talk-name=org.freedesktop.Flatpak
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/costree/cargo
modules:
  - name: costree
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --verbose
      - install -Dm0755 ./target/release/costree /app/bin/costree
      - install -Dm0644 ./packaging/icons/nz.net.jonesie.Costree.svg /app/share/icons/hicolor/scalable/apps/nz.net.jonesie.Costree.svg
      - install -Dm0644 ./packaging/nz.net.jonesie.Costree.metainfo.xml /app/share/metainfo/nz.net.jonesie.Costree.metainfo.xml
      - install -Dm0644 ./packaging/nz.net.jonesie.Costree.desktop /app/share/applications/nz.net.jonesie.Costree.desktop
    sources:
      - type: git
        url: https://github.com/Jonesie/costree.git
        commit: 3492c956d39d95b269eda4267f96faac10d2eae4
      - cargo-sources.json
