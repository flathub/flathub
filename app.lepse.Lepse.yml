id: app.lepse.Lepse
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: lepse
finish-args:
  - "--socket=wayland"
  - "--socket=fallback-x11"
  - "--socket=pulseaudio"
  - "--device=dri"
  - "--share=network"
  - "--share=ipc"
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: "/usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin"
modules:
  - shared-modules/libappindicator/libappindicator-gtk3-12.10.json
  - name: lepse
    buildsystem: simple
    build-options:
      env:
        HOME: /run/build/lepse
        CARGO_HOME: /run/build/lepse/cargo
        CARGO_NET_OFFLINE: "true"
        XDG_CACHE_HOME: /run/build/lepse/flatpak-node/cache
        XDG_DATA_HOME: /run/build/lepse/flatpak-node/data
    sources:
      - type: git
        url: "https://github.com/aervxa/lepse.git"
        tag: v0.2.1
        commit: 2a2da39e6bafd5cecfcc26ca2ee5352378585253 # v0.2.1 latest commit (maybe redundant??)
      - cargo-sources.json
      - node-sources.json
      - type: archive
        url: "https://registry.npmjs.org/pnpm/-/pnpm-10.25.0.tgz"
        sha512: >-
          5e82639027af37cf832061bcc6d639c219634488e0f2baebe785028a793de7b525ffcd3f7ff574f5e9860654e098fe852ba8ac5dd5cefe1767d23a020a92f501
        dest: pnpm
    build-commands:
      - >-
        cargo --offline fetch --manifest-path apps/lachesis/src-tauri/Cargo.toml
        --verbose
      - >-
        node ./pnpm/bin/pnpm.cjs install --offline --frozen-lockfile --filter
        @lepse/lachesis...
      - >-
        node ./pnpm/bin/pnpm.cjs --filter @lepse/lachesis tbuild -b deb -c
        '{"bundle": { "createUpdaterArtifacts": false }}'
      - >-
        install -Dm755
        apps/lachesis/src-tauri/target/release/bundle/deb/*/data/usr/bin/lepse
        /app/bin/lepse
      - >-
        install -Dm644
        apps/lachesis/src-tauri/target/release/bundle/deb/*/data/usr/share/applications/lepse.desktop
        /app/share/applications/app.lepse.Lepse.desktop
      - >-
        install -Dm644
        apps/lachesis/src-tauri/target/release/bundle/deb/*/data/usr/share/icons/hicolor/128x128/apps/lepse.png
        /app/share/icons/hicolor/128x128/apps/lepse.png
      - >-
        install -Dm644
        apps/lachesis/src-tauri/target/release/bundle/deb/*/data/usr/share/icons/hicolor/32x32/apps/lepse.png
        /app/share/icons/hicolor/32x32/apps/lepse.png
      - >-
        install -Dm644
        apps/lachesis/src-tauri/target/release/bundle/deb/*/data/usr/share/icons/hicolor/256x256@2/apps/lepse.png
        /app/share/icons/hicolor/512x512/apps/lepse.png
      - >-
        install -Dm644
        apps/lachesis/src-tauri/target/release/bundle/deb/*/data/usr/share/metainfo/app.lepse.Lepse.metainfo.xml
        /app/share/metainfo/app.lepse.Lepse.metainfo.xml
