app-id: tech.rethunk.Mortar
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: mortar
finish-args:
  # The WebKitGTK window, and controllers for gamepad navigation. The input device type needs Flatpak 1.16, and
  # Ubuntu 24.04 and Debian 12 ship older than that; so this grants every device (which includes the GPU.)
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=all
  # Mod downloads and catalog updates.
  - --share=network
  # Steam libraries: native, Debian and Ubuntu's (~/.steam/debian-installation), the Snap and the Flatpak.
  - --filesystem=xdg-data/Steam
  - --filesystem=~/.steam
  - --filesystem=~/snap/steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam
  # Heroic: we read its configs to find what it installed. The Flatpak gets its own folder too.
  - --filesystem=xdg-config/heroic:ro
  - --filesystem=~/snap/heroic:ro
  - --filesystem=~/.var/app/com.heroicgameslauncher.hgl
  # Lutris: we read its game configs (older releases keep them under xdg-config.) The Flatpak gets its own folder too.
  - --filesystem=xdg-data/lutris:ro
  - --filesystem=xdg-config/lutris:ro
  - --filesystem=~/.var/app/net.lutris.Lutris
  # Bottles: native and Flatpak.
  - --filesystem=xdg-data/bottles
  - --filesystem=~/.var/app/com.usebottles.bottles/data/bottles
  # Where GOG installs by default, and ~/Games for Heroic and Lutris.
  - --filesystem=~/GOG Games
  - --filesystem=~/Games
  # Game libraries on other drives. Removable drives mount under /run/media on Fedora and Arch, /media on Debian and Ubuntu.
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/mnt
  # Stardew Valley's saves, for save backups and the per-save mod list.
  - --filesystem=xdg-config/StardewValley
  # Mod archives you downloaded by hand.
  - --filesystem=xdg-download
  # We read r2modman's and Gale's data folders so Import can bring their profiles over.
  - --filesystem=xdg-config/r2modmanPlus-local:ro
  - --filesystem=xdg-data/com.kesomannen.gale:ro
  # The tray icon talks to this name directly (no portal); notifications go through the Notification portal.
  - --talk-name=org.kde.StatusNotifierWatcher
  # The tray item's name has the process id in it, which is 2 inside the sandbox.
  - --own-name=org.kde.StatusNotifierItem-2-1
  # flatpak-spawn --host: without it we can't start a game through the host's Steam or launcher.
  - --talk-name=org.freedesktop.Flatpak
# Develop builds mods with Flathub's .NET SDK. no-autodownload leaves the 700 MB extension to the player, and Develop's
# Prerequisites prints the install command; its branch is the freedesktop release the GNOME runtime sits on.
add-extensions:
  org.freedesktop.Sdk.Extension.dotnet10:
    directory: extensions/dotnet10
    version: "26.08"
    no-autodownload: true
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
  - org.freedesktop.Sdk.Extension.node24
modules:
  - name: mortar
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin:/usr/lib/sdk/node24/bin
      env:
        GOPROXY: file:///run/build/mortar/goproxy
        GOMODCACHE: /run/build/mortar/gomodcache
        GOSUMDB: "off"
        GOTOOLCHAIN: local
        GOFLAGS: -modcacherw
        XDG_CACHE_HOME: /run/build/mortar/flatpak-node/cache
        # package.json pins bun in packageManager, and yarn 1's Corepack guard won't run under that without this.
        SKIP_YARN_COREPACK_CHECK: "1"
    build-commands:
      - install -d /app/extensions/dotnet10
      # We build the Wails CLI from the fork go.mod pins; it generates the frontend's TypeScript bindings.
      - go mod download github.com/wailsapp/wails/v3
      - go build -C "$(go list -m -f '{{.Dir}}' github.com/wailsapp/wails/v3)" -o /run/build/mortar/tools/wails3 ./cmd/wails3
      - /run/build/mortar/tools/wails3 generate bindings -clean=true -ts -i
      # package.json's `bindings` script runs this rewrite with bun, and the SDK doesn't ship bun.
      - node scripts/erasable-bindings.ts
      # Same trim render.sh did before it wrote yarn.lock (only the app's packages.)
      - node build/linux/flathub/app-packages.ts
      # The build's HOME isn't writable, so `yarn config set` wouldn't stick; a project .yarnrc does.
      - echo 'yarn-offline-mirror "/run/build/mortar/flatpak-node/yarn-mirror"' >.yarnrc
      - yarn install --offline --frozen-lockfile --ignore-scripts
      # Credits and notices are committed; we compile the Lingui catalogs from the .po files.
      - cd frontend && ../node_modules/.bin/lingui compile --typescript && ../node_modules/.bin/vite build --mode production
      - >-
        go build -buildmode=pie -tags production -trimpath -buildvcs=false -o /app/bin/mortar
        -ldflags="-w -s -X main.packaged=flatpak -X github.com/Rethunk-Tech/mortar/internal/nxm.packaged=flatpak -extldflags '-Wl,-z,relro,-z,now'"
      - install -Dm644 build/linux/tech.rethunk.Mortar.desktop /app/share/applications/tech.rethunk.Mortar.desktop
      - install -Dm644 build/linux/mime/mortar.xml /app/share/mime/packages/tech.rethunk.Mortar.xml
      - install -Dm644 build/linux/tech.rethunk.Mortar.metainfo.xml /app/share/metainfo/tech.rethunk.Mortar.metainfo.xml
      - install -Dm644 build/linux/icons/tech.rethunk.Mortar-512.png /app/share/icons/hicolor/512x512/apps/tech.rethunk.Mortar.png
      - install -Dm644 build/linux/icons/tech.rethunk.Mortar-256.png /app/share/icons/hicolor/256x256/apps/tech.rethunk.Mortar.png
      - install -Dm644 build/appicon.svg /app/share/icons/hicolor/scalable/apps/tech.rethunk.Mortar.svg
      - install -Dm644 LICENSE /app/share/doc/mortar/LICENSE
      - install -Dm644 THIRD_PARTY_NOTICES /app/share/doc/mortar/THIRD_PARTY_NOTICES
    sources:
      - type: git
        url: https://github.com/Rethunk-Tech/mortar.git
        tag: v0.6.0
        commit: "6ce65893eca4b6e88b6b3e48922c05a1a6b7b089"
      - type: file
        path: yarn.lock
      - go-sources.json
      - node-sources.json
