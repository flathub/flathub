app-id: com.ritwiktakkar.russet
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: russet

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.freedesktop.Notifications
  - --system-talk-name=org.freedesktop.hostname1
  - --env=RUST_BACKTRACE=1

modules:
  - name: russet
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 russet-launcher /app/bin/russet
      - install -Dm644 com.ritwiktakkar.russet.desktop
        /app/share/applications/com.ritwiktakkar.russet.desktop
      - install -Dm644 com.ritwiktakkar.russet.png
        /app/share/icons/hicolor/512x512/apps/com.ritwiktakkar.russet.png
      - install -Dm644 com.ritwiktakkar.russet.metainfo.xml
        /app/share/metainfo/com.ritwiktakkar.russet.metainfo.xml
    sources:
      - type: extra-data
        filename: russet.tar.gz
        url: https://github.com/ritwiktakkar/russet-flatpak/releases/download/v2026.5.16/russet-2026.5.16-x86_64.tar.gz
        sha256: "2e818d291e7b495c539d3954aef562451080efa1c3ee251c7fe9d8f06248b28e"
        size: 30674617
      - type: script
        dest-filename: apply_extra
        commands:
          - set -e
          - cd /app/extra
          - tar -xzf russet.tar.gz
          - rm russet.tar.gz
          - chmod 755 russet
      - type: script
        dest-filename: russet-launcher
        commands:
          - exec /app/extra/russet "$@"
      - type: file
        path: com.ritwiktakkar.russet.desktop
      - type: file
        path: com.ritwiktakkar.russet.png
      - type: file
        path: com.ritwiktakkar.russet.metainfo.xml
