# Packaging for the existing MyMusik 1.2.8 x86_64 release.
app-id: app.mymusik.MyMusik
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: DesktopApp
default-branch: stable
separate-locales: false

finish-args:
  # The published Qt build includes the xcb platform plugin.
  - --socket=x11
  - --share=ipc
  # Rendering and audio output.
  - --device=dri
  - --socket=pulseaudio
  # Optional cloud services and local device connections.
  - --share=network
  # Local music import, playback and editing.
  - --filesystem=xdg-music
  # System credential storage and desktop media controls.
  - --talk-name=org.freedesktop.secrets
  - --own-name=org.mpris.MediaPlayer2.mymusik
  - --own-name=org.mpris.MediaPlayer2.mymusik.*
  - --env=QT_QPA_PLATFORMTHEME=xdgdesktopportal

build-options:
  # Preserve the publisher's prebuilt executable and libraries.
  strip: false
  no-debuginfo: true

modules:
  - name: mymusik-published-binary
    buildsystem: simple
    build-commands:
      - |
        if [ "$FLATPAK_ARCH" != "x86_64" ]; then
          echo "MyMusik 1.2.8 requires the x86_64 AppImage." >&2
          exit 1
        fi
      - chmod +x MyMusik.AppImage
      - ./MyMusik.AppImage --appimage-extract >/dev/null
      - install -d /app/opt/mymusik
      - cp -a squashfs-root/usr /app/opt/mymusik/
      - install -Dm755 mymusik /app/bin/DesktopApp
      - install -Dm644 app.mymusik.MyMusik.desktop /app/share/applications/app.mymusik.MyMusik.desktop
      - install -Dm644 app.mymusik.MyMusik.metainfo.xml /app/share/metainfo/app.mymusik.MyMusik.metainfo.xml
      - install -Dm644 app.mymusik.MyMusik.png /app/share/icons/hicolor/512x512/apps/app.mymusik.MyMusik.png
      - install -d /app/share/licenses/app.mymusik.MyMusik
      - cp -a squashfs-root/usr/bin/licenses /app/share/licenses/app.mymusik.MyMusik/third-party
    sources:
      # Update the release version, source hash and metainfo together.
      - type: file
        url: https://shaggai.net/linux/flatpak/mymusik/1.2.8/d07fbd3880e8/MyMusik-x86_64.AppImage
        sha256: d07fbd3880e8c3ff3944d1efd65953b35c4495d92f28ffa7785c7e72ae85d2e5
        dest-filename: MyMusik.AppImage
      - type: file
        path: local-draft/mymusik
      - type: archive
        url: https://shaggai.net/linux/flatpak/mymusik/1.2.8/metadata-6230d733bf3d/MyMusik-1.2.8-metadata.tar.xz
        sha256: 6230d733bf3dcb0bf7e0380c6b90d98d2ce4c4ea73eebbd616753f1d38c97fbd
        strip-components: 0
