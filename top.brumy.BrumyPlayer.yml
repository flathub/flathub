id: top.brumy.BrumyPlayer
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: brumy-player-native
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: brumy-player
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/brumy-player/.cargo-home
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --locked --offline
      - install -Dm755 target/release/brumy-player-native -t /app/bin/
      - install -Dm644 resources/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 resources/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 resources/${FLATPAK_ID}.png -t /app/share/icons/hicolor/512x512/apps/
      - install -Dm644 LICENSE -t /app/share/licenses/${FLATPAK_ID}/  
    sources:
      - type: archive
        url: https://brumy.top/releases/brumy-player-native-2.2.1-source.tar.xz
        sha256: 1fa5cbd4c145e2b6890a97bb74f8f139a16945ed7f4adde7a1db3f9c5ffb29c1
        strip-components: 1
