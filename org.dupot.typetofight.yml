app-id: org.dupot.typetofight
base: org.godotengine.godot.BaseApp
base-version: '4.7'
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: typetofight
finish-args:
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: typetofight
    buildsystem: simple

    build-commands:
      - install -Dm755 typetofight.sh /app/bin/typetofight
      - install -Dm644 gameArchive/dupotTypeToFight.pck /app/bin/typetofight.pck
      - install -Dm644 gameArchive/icons/16x16.png $FLATPAK_DEST/share/icons/hicolor/16x16/apps/org.dupot.typetofight.png
      - install -Dm644 gameArchive/icons/24x24.png $FLATPAK_DEST/share/icons/hicolor/24x24/apps/org.dupot.typetofight.png
      - install -Dm644 gameArchive/icons/32x32.png $FLATPAK_DEST/share/icons/hicolor/32x32/apps/org.dupot.typetofight.png
      - install -Dm644 gameArchive/icons/48x48.png $FLATPAK_DEST/share/icons/hicolor/48x48/apps/org.dupot.typetofight.png
      - install -Dm644 gameArchive/icons/64x64.png $FLATPAK_DEST/share/icons/hicolor/64x64/apps/org.dupot.typetofight.png
      - install -Dm644 gameArchive/icons/128x128.png $FLATPAK_DEST/share/icons/hicolor/128x128/apps/org.dupot.typetofight.png
      - install -Dm644 gameArchive/icons/256x256.png $FLATPAK_DEST/share/icons/hicolor/256x256/apps/org.dupot.typetofight.png
      - install -Dm644 gameArchive/icons/512x512.png $FLATPAK_DEST/share/icons/hicolor/512x512/apps/org.dupot.typetofight.png
      - install -Dm644 gameArchive/${FLATPAK_ID}.desktop $FLATPAK_DEST/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 gameArchive/${FLATPAK_ID}.appdata.xml $FLATPAK_DEST/share/metainfo/${FLATPAK_ID}.metainfo.xml

    sources:
      - type: archive
        dest: gameArchive
        url: https://github.com/imikado/dupotTypeToFight/releases/download/1.0.0/bundle.tar.gz
        sha256: 2702117bf0d7b596c210105882598613b56df82bc4e2d8683437ce279c22c3b9

      - type: script
        dest-filename: typetofight.sh
        commands:
          - cd /app/bin/
          - /app/bin/godot-runner --main-pack /app/bin/typetofight.pck "$@"