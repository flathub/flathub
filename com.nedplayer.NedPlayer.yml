id: com.nedplayer.NedPlayer
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: nedplayer
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-download
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'
modules:
  - name: libass
    post-install:
      - install -Dm644 /run/build/libass/COPYING /app/share/licenses/libass/COPYING
    config-opts:
      - --disable-static
      - --disable-asm
    sources:
      - type: git
        url: https://github.com/libass/libass
        tag: 0.17.5
        commit: 4a05d8127f525943ebf45fdc6497c9e665947f0d

  - name: ffmpeg
    config-opts:
      - --disable-static
      - --enable-shared
      - --disable-debug
      - --disable-doc
      - --disable-programs
      - --disable-gpl
      - --disable-nonfree
      - --enable-gnutls
      - --enable-libass
      - --enable-libdav1d
      - --enable-libvpx
      - --enable-libopus
      - --disable-encoders
      - --enable-encoder=png,mjpeg
    post-install:
      - install -Dm644 /run/build/ffmpeg/COPYING.LGPLv2.1 /app/share/licenses/ffmpeg/COPYING.LGPLv2.1
      - install -Dm644 /run/build/ffmpeg/LICENSE.md /app/share/licenses/ffmpeg/LICENSE.md
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n8.1.3
        commit: 1041abdc962f4cc4f394aa8de9dc5236c0c3b9e7

  - name: libplacebo
    post-install:
      - install -Dm644 /run/build/libplacebo/LICENSE /app/share/licenses/libplacebo/LICENSE
    buildsystem: meson
    config-opts:
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.387.0
        commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65

  - name: mpv
    post-install:
      - install -Dm644 /run/build/mpv/Copyright /app/share/licenses/mpv/Copyright
      - install -Dm644 /run/build/mpv/LICENSE.LGPL /app/share/licenses/mpv/LICENSE.LGPL
      - install -Dm644 /run/build/mpv/LICENSE.GPL /app/share/licenses/mpv/LICENSE.GPL
    buildsystem: meson
    config-opts:
      - -Dgpl=false
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dpdf-build=disabled
      - -Dpipewire=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413

  - name: nedplayer
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - cp -a nedplayer /app/
      - ln -sf ../nedplayer/nedplayer /app/bin/nedplayer
      - cp -a share /app/
      - install -Dm644 LICENSE -t /app/share/licenses/${FLATPAK_ID}
    sources:
      - type: archive
        url: https://github.com/alperokur/nedplayer-linux/releases/download/v1.0.31/NedPlayer-1.0.31-linux-x86_64.tar.gz
        sha256: 7db99a9bcf39c6550097d8602e140d17873a6c49baa8fd316366a2cb70c1a01e
        strip-components: 0
