app-id: io.github.win12_online.win12_desktop

runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk

command: win12-desktop

finish-args:
  # 网络
  - --share=network

  # 显示
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc

  # GPU
  - --device=dri

  # 音频
  - --socket=pulseaudio

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/win12-desktop/cargo

modules:
  - name: iputils
    buildsystem: meson

    config-opts:
      - -DSKIP_TESTS=true
      - -DBUILD_ARPING=false
      - -DBUILD_CLOCKDIFF=false
      - -DBUILD_PING=true
      - -DBUILD_TRACEPATH=false
      - -DUSE_IDN=false

    build-commands:
      - mkdir -p /app/bin
      - ln -s ping /app/bin/ping6

    sources:
      - type: git
        url: https://github.com/iputils/iputils.git
        commit: 4b9da8dbf980bac86e2b831668a3aeba9aefdd68

  - name: win12-desktop
    buildsystem: simple

    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/win12-desktop/cargo
        CARGO_NET_OFFLINE: "true"

    build-commands:
      - cd tauri/src-tauri && cargo build --release --locked --offline
      - install -Dm755 tauri/src-tauri/target/release/win12-desktop
          /app/bin/win12-desktop

      - install -Dm644 io.github.win12_online.win12_desktop.desktop
          /app/share/applications/io.github.win12_online.win12_desktop.desktop

      - install -Dm644 io.github.win12_online.win12_desktop.metainfo.xml
          /app/share/metainfo/io.github.win12_online.win12_desktop.metainfo.xml

      - install -Dm644 tauri/src-tauri/icons/128x128.png
          /app/share/icons/hicolor/128x128/apps/io.github.win12_online.win12_desktop.png

      - install -Dm644 tauri/src-tauri/icons/128x128@2x.png
          /app/share/icons/hicolor/256x256/apps/io.github.win12_online.win12_desktop.png

    sources:
      - type: dir
        path: .

      - cargo-sources.json