app-id: io.github.phase1geo.textshine
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
base: io.elementary.BaseApp
base-version: tanit-26.08
command: io.github.phase1geo.textshine
finish-args:
  - '--share=ipc'
  - '--socket=fallback-x11'
  - '--socket=wayland'
  - '--device=dri'
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - shared-modules/intltool/intltool-0.51.json

  - name: libmarkdown
    buildsystem: simple
    build-commands:
      - ./configure.sh --shared --prefix=/app --pkg-config
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - sed -e 's|/sbin/ldconfig|/sbin/ldconfig -n|' -i librarian.sh
      - make install
    sources:
      - type: archive
        url: https://github.com/Orc/discount/archive/refs/tags/v2.2.4.tar.gz
        sha256: 918905377e6ed3d0a7158cac0a4a18ed3c4cc0cad8ee95dddd82cb86ba9dd044

  - name: gtkspell
    config-opts:
      - --disable-gtk-doc
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/gtkspell/gtkspell3-3.0.10.tar.xz
        sha256: b040f63836b347eb344f5542443dc254621805072f7141d49c067ecb5a375732
    post-install:
      - install -p -D -m 0644 "COPYING" -t "${FLATPAK_DEST}/share/licenses/gtkspell/";

  - name: textshine
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/phase1geo/TextShine.git
        tag: 3.0.0
        commit: 6e95545b14fb2a616bf32815920739f0ff733de4
        x-checker-data:
          type: json
          url: https://api.github.com/repos/phase1geo/TextShine/releases/latest
          tag-query: .tag_name
          version-query: .tag_name
          timestamp-query: .published_at
