app-id: org.batuque.Batuque
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: batuque

finish-args:
  # Wayland and X11 fallback
  - --socket=wayland
  - --socket=fallback-x11
  # Hardware acceleration and IPC
  - --share=ipc
  - --device=dri
  # Network access for NAS shares (SMB/NFS/WebDAV) and metadata/cover fetching
  - --share=network
  # Full filesystem access to scan music collections from any internal/external drive
  # and synchronize to portable DAPs / USB devices mounted under /run/media, /media, etc.
  - --filesystem=host
  # GVFS and volume monitoring for plug-and-play DAP detection
  - --talk-name=org.gtk.vfs.*
  - --system-talk-name=org.freedesktop.UDisks2

modules:
  # ffmpeg for on-the-fly audio transcoding and volume normalization
  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --prefix=/app
      - --disable-debug
      - --disable-doc
      - --disable-static
      - --enable-shared
      - --enable-gpl
      - --enable-version3
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz
        sha256: 40973d44970dbc83ef302b0609f2e74982be2d85916dd2ee7472d30678a7abe6

  # Python dependencies: Mutagen
  - name: python3-mutagen
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "mutagen"
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/df/70/1675da133ea92227da41bf5b24e1c66be597ff736a1533ade41da986852f/mutagen-1.48.1.tar.gz
        sha256: 8f95637ab9f6f305cec6bd1294e197debe207998e3e068596563c74f86b0a173

  # Python dependencies: Pillow
  - name: python3-pillow
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "pillow"
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/ce/a4/9cc30690a394a8305e8be4c9036aa16d0dfddadd09079860b582f562496d/pillow-13.0.0.tar.gz
        sha256: cdcd1ba258178f7356d74170c9a81ba4eab6a5d55748bc402a5a2a6fe6be3510

  # Main Application: Batuque
  - name: batuque
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} .
      - install -Dm644 data/org.batuque.Batuque.desktop ${FLATPAK_DEST}/share/applications/org.batuque.Batuque.desktop
      - install -Dm644 data/org.batuque.Batuque.metainfo.xml ${FLATPAK_DEST}/share/metainfo/org.batuque.Batuque.metainfo.xml
      - install -Dm644 data/icons/org.batuque.Batuque.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/org.batuque.Batuque.svg
    sources:
      - type: git
        url: https://github.com/burillomom/batuque.git
        tag: v0.1.0
