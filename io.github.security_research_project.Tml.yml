app-id: io.github.security_research_project.Tml
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: tml

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-data/applications:create

modules:
  - name: python3-requests
    buildsystem: simple

    build-commands:
      - pip3 install --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} requests

    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/6d/44/f5da03a8ef95d369145c5bb53050e7877c9f3d312e128605fd9504829143/setuptools-84.0.0.tar.gz
        sha256: f4695c21257f0d9b537ec2692c941d02ee143b7cc1276941349a546573b2ef73
        x-checker-data:
          type: pypi
          name: setuptools

      - type: file
        url: https://files.pythonhosted.org/packages/d0/20/50ed6bdf27dec98b568a8ae25dc599f35baa3d9709f9e83fd1edb56b9a90/wheel-0.48.0.tar.gz
        sha256: 94800765601e9171bf5d58d066e640662842bcedcbab982b2c90787a2c987322
        x-checker-data:
          type: pypi
          name: wheel

      - type: file
        url: https://files.pythonhosted.org/packages/46/ef/34533186e76c526d9ec17a1ad9a10c7354cbfb20f51583cc36dfe4bdccd0/flit_core-4.0.2.tar.gz
        sha256: b6929defd93884b584d7c87829e0e7b5c26ed6be17b0b873979019314aa841c8
        x-checker-data:
          type: pypi
          name: flit_core

      - type: file
        url: https://files.pythonhosted.org/packages/5f/f7/abb373e5757eaec4b922b92f97ec8d6d7e057cf06778247604fbc4e7c3f3/idna-3.19.tar.gz
        sha256: 5e0811a4383b21dc5838069f801c4fb62113b7447663d2530d2bd6e77b49bf15
        x-checker-data:
          type: pypi
          name: idna

      - type: file
        url: https://files.pythonhosted.org/packages/ac/c3/e2a2b89f2d3e2179abd6d00ebd70bff6273f37fb3e0cc209f48b39d00cbf/requests-2.34.2.tar.gz
        sha256: f288924cae4e29463698d6d60bc6a4da69c89185ad1e0bcc4104f584e960b9ed
        x-checker-data:
          type: pypi
          name: requests

      - type: file
        url: https://files.pythonhosted.org/packages/a3/c2/24167ea9858356b47a87a50d39908bfdb72ceeefe0041586e704e5376b3a/certifi-2026.7.22.tar.gz
        sha256: 741e2c3b351ddf169a738da9f2c048608ff7f2c5cc02f1ebc6b118bb090d5d55
        x-checker-data:
          type: pypi
          name: certifi

      - type: file
        url: https://files.pythonhosted.org/packages/e4/e8/6ff5e6bc22095cfc59b6ea711b687e2b7ed4bdb373f7eeec370a97d7392f/urllib3-1.26.20.tar.gz
        sha256: 40c2dc0c681e47eb8f90e7e27bf6ff7df2e677421fd46756da1161c39ca70d32
        x-checker-data:
          type: pypi
          name: urllib3

