# Flathub manifest for Botlyx Tutor (Linux, clean install — bundles WebKitGTK).
#
# Builds from the published Debian package so the GNOME runtime provides
# WebKitGTK 4.1, avoiding the libwebkit2gtk-4.1 dependency problems users hit
# with the raw .AppImage/.deb. Submit this to https://github.com/flathub/flathub
# (see docs/go-to-market/flathub.md).
id: com.botlyx.tutor
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: botlyx-tutor-desktop

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  # AI providers, license activation and the updater need outbound network.
  - --share=network
  # OS keyring (Secret Service) for storing the auth token and AI provider keys.
  - --talk-name=org.freedesktop.secrets
  # WebKitGTK's DMABUF renderer causes a blank white window on many setups
  # (notably hybrid Intel+NVIDIA laptops). Disabling it forces a renderer that
  # works everywhere, at a negligible cost for a document app.
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  # Read user documents the reader imports (file dialog uses the XDG portal,
  # but read-only access to common dirs is a safe fallback).
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-download:ro

modules:
  - name: botlyx-tutor
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/Agongnonsadev/botlyx-tutor-releases/releases/download/desktop-v0.1.0/Botlyx-Tutor_0.1.0_amd64.deb
        sha256: 9cae8f84ac953be1a30c19ba207a693a7fea0ed71091051f803e29f375e99c81
      - type: file
        path: com.botlyx.tutor.metainfo.xml
    build-commands:
      # Unpack the .deb (ar archive -> data.tar.gz).
      - ar -x *.deb
      - tar -xf data.tar.gz
      # Binary.
      - install -Dm755 usr/bin/botlyx-tutor-desktop /app/bin/botlyx-tutor-desktop
      # Desktop entry: rename to the app id, fix icon name and add categories.
      - sed -i 's/^Icon=.*/Icon=com.botlyx.tutor/' "usr/share/applications/Botlyx Tutor.desktop"
      - sed -i 's/^Categories=.*/Categories=Education;Office;Utility;/' "usr/share/applications/Botlyx Tutor.desktop"
      - install -Dm644 "usr/share/applications/Botlyx Tutor.desktop" /app/share/applications/com.botlyx.tutor.desktop
      # Icons (rename to the app id).
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/botlyx-tutor-desktop.png /app/share/icons/hicolor/32x32/apps/com.botlyx.tutor.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/botlyx-tutor-desktop.png /app/share/icons/hicolor/128x128/apps/com.botlyx.tutor.png
      - install -Dm644 "usr/share/icons/hicolor/256x256@2/apps/botlyx-tutor-desktop.png" /app/share/icons/hicolor/256x256@2/apps/com.botlyx.tutor.png
      # AppStream metadata.
      - install -Dm644 com.botlyx.tutor.metainfo.xml /app/share/metainfo/com.botlyx.tutor.metainfo.xml
