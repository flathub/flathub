app-id: app.bakingpowder.BakingPowder
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: baking-powder
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
modules:
  - name: baking-powder
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - install -Dm755 baking-powder /app/bin/baking-powder
      - install -Dm644 app.bakingpowder.BakingPowder.desktop /app/share/applications/app.bakingpowder.BakingPowder.desktop
      - install -Dm644 app.bakingpowder.BakingPowder.metainfo.xml /app/share/metainfo/app.bakingpowder.BakingPowder.metainfo.xml
      - for size in 16 32 48 64 128 256 512; do install -Dm644 icons/$size.png /app/share/icons/hicolor/${size}x${size}/apps/app.bakingpowder.BakingPowder.png; done
      - install -Dm644 icons/app.bakingpowder.BakingPowder.svg /app/share/icons/hicolor/scalable/apps/app.bakingpowder.BakingPowder.svg
    sources:
      - type: archive
        url: https://bakingpowder.app/linux/baking-powder-1.0.1-x86_64.tar.gz
        sha256: 4180319325025d68e29f16734ca652e35f39066081dd95395c0bdf57587a41f7
