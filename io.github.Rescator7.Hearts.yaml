id: io.github.Rescator7.Hearts
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: Hearts

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --share=network

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/pkgconfig
  - '*.a'
  - '*.la'

modules:
  - name: allegro5
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSHARED=on
      - -DWANT_DOCS=off
      - -DWANT_EXAMPLES=off
      - -DWANT_DEMO=off
      - -DWANT_TESTS=off
      - -DWANT_VIDEO=off
      - -DWANT_PHYSFS=off
      - -DWANT_NATIVE_DIALOG=off
      - -DWANT_PRIMITIVES=off
      - -DWANT_IMAGE=off
      - -DWANT_FONT=off
      - -DWANT_TTF=off
      - -DWANT_COLOR=off
      - -DWANT_MEMFILE=on
      - -DWANT_AUDIO=on
      - -DWANT_ACODEC=on
    sources:
      - type: archive
        url: https://github.com/liballeg/allegro5/releases/download/5.2.11.3/allegro-5.2.11.3.tar.gz
        sha256: aba4679a5b1f2bf62482eba6e8814a94de7ffc86de5f8587ba199fcc61b4a04f

  - name: Hearts
    buildsystem: simple
    build-commands:
      - sed -i '/QMAKE_LFLAGS += -no-pie/d' Hearts.pro
      - sed -i '/^DEFINES +=/ s/ DEBUG//' Hearts.pro
      - qmake Hearts.pro "QMAKE_LFLAGS+=-L/app/lib"
      - make -j$(nproc)
      - install -Dm755 Hearts /app/bin/hearts.bin
      - install -Dm755 hearts-wrapper.sh /app/bin/Hearts
      - install -Dm644 io.github.Rescator7.Hearts.svg /app/share/icons/hicolor/scalable/apps/io.github.Rescator7.Hearts.svg
      - install -Dm644 io.github.Rescator7.Hearts.desktop /app/share/applications/io.github.Rescator7.Hearts.desktop
      - install -Dm644 io.github.Rescator7.Hearts.metainfo.xml /app/share/metainfo/io.github.Rescator7.Hearts.metainfo.xml
    sources:
      - type: git
        url: https://github.com/Rescator7/Hearts.git
        tag: v1.9.6
        commit: c79a910a921bd1769e45f7a8387a2975da8368de
      - type: file
        path: io.github.Rescator7.Hearts.desktop
      - type: file
        path: io.github.Rescator7.Hearts.metainfo.xml
      - type: file
        path: io.github.Rescator7.Hearts.svg
      - type: file
        path: hearts-wrapper.sh
