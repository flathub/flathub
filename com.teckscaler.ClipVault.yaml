app-id: com.teckscaler.ClipVault
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: clipvault

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Notifications

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - '*.la'
  - '*.a'

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: python3-pyperclip
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "pyperclip-1.11.0-py3-none-any.whl"
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/df/80/fc9d01d5ed37ba4c42ca2b55b4339ae6e200b456be3a1aaddf4a9fa99b8c/pyperclip-1.11.0-py3-none-any.whl
        sha256: 299403e9ff44581cb9ba2ffeed69c7aa96a008622ad0c46cb575ca75b5b84273

  - name: clipvault
    buildsystem: simple
    build-commands:
      # Application source tree
      - install -dm755 /app/share/clipvault/services /app/share/clipvault/ui /app/bin
      - install -m644 main.py /app/share/clipvault/
      - cp -r services/*.py /app/share/clipvault/services/
      - cp -r ui/*.py /app/share/clipvault/ui/

      # Launcher
      - install -m755 data/clipvault.sh /app/bin/clipvault
      - ln -sf clipvault /app/bin/com.teckscaler.ClipVault

      # Desktop, AppStream metadata, and icons from upstream data/
      - install -Dm644 data/com.teckscaler.ClipVault.desktop /app/share/applications/com.teckscaler.ClipVault.desktop
      - install -Dm644 data/com.teckscaler.ClipVault.metainfo.xml /app/share/metainfo/com.teckscaler.ClipVault.metainfo.xml
      - install -Dm644 data/icons/com.teckscaler.ClipVault.svg /app/share/icons/hicolor/scalable/apps/com.teckscaler.ClipVault.svg
      - install -Dm644 data/icons/com.teckscaler.ClipVault.png /app/share/icons/hicolor/512x512/apps/com.teckscaler.ClipVault.png

      # License installation
      - install -Dm644 LICENSE /app/share/licenses/com.teckscaler.ClipVault/LICENSE
    sources:
      - type: git
        url: https://github.com/rajatpateldm-web/ubuntu-clipboard-manager.git
        tag: v1.1.0
        commit: 9b73f701dfd58da7d60656a7ab5e31b0abf3a275
