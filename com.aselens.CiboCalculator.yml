app-id: com.aselens.CiboCalculator
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: cibo-calculator

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: cibo-calculator
    buildsystem: simple
    build-commands:
      # Create directory structure
      - install -d /app/lib/cibo-calculator
      - install -d /app/bin
      - install -d /app/share/applications
      - install -d /app/share/metainfo
      - install -d /app/share/icons/hicolor/scalable/apps
      - install -d /app/share/icons/hicolor/256x256/apps

      # Copy source files to application directory
      - cp -r * /app/lib/cibo-calculator/

      # Install launcher script
      - |
        cat << 'EOF' > /app/bin/cibo-calculator
        #!/bin/sh
        exec zypak-wrapper /app/lib/cibo-calculator/node_modules/electron/dist/electron /app/lib/cibo-calculator "$@"
        EOF
      - chmod +x /app/bin/cibo-calculator

      # Install desktop integration files
      - install -Dm644 com.aselens.CiboCalculator.desktop /app/share/applications/com.aselens.CiboCalculator.desktop
      - install -Dm644 com.aselens.CiboCalculator.metainfo.xml /app/share/metainfo/com.aselens.CiboCalculator.metainfo.xml
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/com.aselens.CiboCalculator.svg
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/com.aselens.CiboCalculator.png

    sources:
      - type: git
        url: https://github.com/aselens-software/cibo-calculator.git
        commit: 57e1a454c1fd05e3897e1b46ce364549bfd0dff3
      - type: file
        path: com.aselens.CiboCalculator.desktop
      - type: file
        path: com.aselens.CiboCalculator.metainfo.xml
