# Flatpak manifest used by `scripts/build.sh -p lin -s flatpak`.
# UNTESTED scaffold: adjust runtime-version to the KDE runtime installed on your machine
# (`flatpak list --runtime | grep org.kde.Platform`). Builds inside the sandbox with network access
# (fine for local bundles; Flathub would need vendored cargo sources instead).
app-id: io.openbc.OpenBC
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: openbc
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri          # 3D compare uses OpenGL
  - --share=network       # SFTP / FTP remote browsing
  - --filesystem=host     # comparing arbitrary folders is the point of the app
  - --socket=pulseaudio   # media compare playback
modules:
  - name: openbc
    buildsystem: cmake-ninja
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/openbc/cargo
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ../..
        skip:        # keep the source checksum stable so flatpak-builder can cache-hit
          - build
          - target
          - .git
          - .flatpak-builder
