id: com.richwhitehouse.BigInstinct
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: biginstinct
separate-locales: false
finish-args:
  - --device=all
  - --persist=.biginstinct_userdata
  - --filesystem=home
  - --filesystem=host:ro
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland
  - --allow=bluetooth
modules:
  - name: biginstinct
    buildsystem: simple
    build-commands:
      - install -Dm 0755 biginstinct ${FLATPAK_DEST}/bin/biginstinct
      - install -Dm 0644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm 0644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm 0644 biginstinct-icon.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - cp ReadMe.txt ${FLATPAK_DEST}/bin/
      - cp -r Data ${FLATPAK_DEST}/bin/
      - cp -r Scripts ${FLATPAK_DEST}/bin/
      - cp -r Strings ${FLATPAK_DEST}/bin/
      - cp -r plugins ${FLATPAK_DEST}/bin/
    sources:
      - type: archive
        only-arches:
          - aarch64
        url: https://www.richwhitehouse.com/ki/builds/BigInstinct_LinuxARM64_v10.tar.gz
        sha256: 5c29befbabefa6f65c60149de670e382101a315f41a20cdd2e738d59268c1629
      - type: archive
        only-arches:
          - x86_64
        url: https://www.richwhitehouse.com/ki/builds/BigInstinct_Linux64_v10.tar.gz
        sha256: 38c66aa170cb33365d0ece9c8dab11641594f80baa1ceb5c3632210587cbaf43
      - type: file
        path: com.richwhitehouse.BigInstinct.desktop
      - type: file
        path: com.richwhitehouse.BigInstinct.metainfo.xml
