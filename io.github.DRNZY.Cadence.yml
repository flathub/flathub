app-id: io.github.DRNZY.Cadence
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: cadence
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-download:ro
  - --talk-name=org.freedesktop.Notifications
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: cadence
    buildsystem: simple
    sources:
      - type: file
        dest-filename: cadence.deb
        only-arches: [x86_64]
        url: https://github.com/DRNZY/Cadence/releases/download/v3.0.0/cadence_3.0.0_amd64.deb
        sha256: 437099a98297402119452962f2a779788f68766a64ac41900dae7be49de7aca9
        x-checker-data:
          type: json
          url: https://api.github.com/repos/DRNZY/Cadence/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: .assets | map(.browser_download_url | select(endswith("_amd64.deb"))) | first

      - type: file
        path: cadence.sh

      - type: file
        path: io.github.DRNZY.Cadence.desktop

      - type: file
        path: io.github.DRNZY.Cadence.metainfo.xml

      - type: file
        path: LICENSE

      - type: file
        path: icons/icon-64.png

      - type: file
        path: icons/icon-128.png

      - type: file
        path: icons/icon-256.png

      - type: file
        path: icons/icon-512.png

    build-commands:
      - ar x cadence.deb
      - rm -f cadence.deb
      - tar -xf data.tar.xz
      - rm -f control.tar.gz data.tar.xz debian-binary

      - mkdir -p /app/cadence
      - cp -a opt/Cadence/* /app/cadence/
      - rm -rf opt usr

      - install -Dm755 cadence.sh /app/bin/cadence
      - install -Dm644 io.github.DRNZY.Cadence.desktop -t /app/share/applications/
      - install -Dm644 io.github.DRNZY.Cadence.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.DRNZY.Cadence/

      - install -Dm644 icon-64.png /app/share/icons/hicolor/64x64/apps/io.github.DRNZY.Cadence.png
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/io.github.DRNZY.Cadence.png
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.DRNZY.Cadence.png
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.DRNZY.Cadence.png

      - patch-electron-desktop-filename /app/cadence/resources/app.asar
