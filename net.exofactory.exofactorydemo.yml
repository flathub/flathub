app-id: net.exofactory.exofactorydemo
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: exofactory
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  - --share=network
  - --device-if=all:!has-input-device
  - --device=dri
  - --device=input
modules:
  - name: exofactory
    buildsystem: simple
    build-commands:
      - install -Dm755 exofactory /app/bin/exofactory
      - install -Dm644 net.exofactory.exofactorydemo.desktop /app/share/applications/net.exofactory.exofactorydemo.desktop
      - install -Dm644 net.exofactory.exofactorydemo.metainfo.xml /app/share/metainfo/net.exofactory.exofactorydemo.metainfo.xml
      - install -Dm644 icons/128.png /app/share/icons/hicolor/128x128/apps/net.exofactory.exofactorydemo.png
      - install -Dm644 icons/256.png /app/share/icons/hicolor/256x256/apps/net.exofactory.exofactorydemo.png
      - install -Dm644 icons/512.png /app/share/icons/hicolor/512x512/apps/net.exofactory.exofactorydemo.png
      - install -Dm644 LICENCE /app/share/licenses/net.exofactory.exofactorydemo/LICENCE
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://flathub-assets.exofactory.net/builds/exofactory-linux-x86_64-536f168f0c2c.tar.gz
        sha256: '435cf7f1aa5a693e301b7aec6973bcee75fea6271f9eb6f2d2991efa880f5ead'
        strip-components: 0
      - type: archive
        only-arches: [aarch64]
        url: https://flathub-assets.exofactory.net/builds/exofactory-linux-aarch64-536f168f0c2c.tar.gz
        sha256: '89bad2105afdafe92d62be03af979c1ac6cd8e21dd9ae797bebe670c9ffd6f26'
        strip-components: 0
