app-id: net.exofactory.exofactorydemo
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: exofactory
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  - --share=network
  - --device-if=all:!has-input-device
  - --device=dri
  - --device=input
modules:
  - name: exofactory
    buildsystem: simple
    build-commands:
      - install -Dm755 exofactory /app/bin/exofactory
      - install -Dm644 ${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 icons/128.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 icons/256.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 icons/512.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm644 LICENCE /app/share/licenses/${FLATPAK_ID}/LICENCE
    sources:
      - type: archive
        url: https://flathub-assets.exofactory.net/builds/exofactory-linux-x86_64-7c3f29aa138b.tar.gz
        sha256: dcde22a26cbcfabe95a483f974a343531085f40a12d838da8f23b307da9baf8e
        only-arches: [x86_64]
        strip-components: 0
      - type: archive
        url: https://flathub-assets.exofactory.net/builds/exofactory-linux-aarch64-7c3f29aa138b.tar.gz
        sha256: 'd9f52e4be1386fbf5799a274aacadb0a4d0e6b1beb476f2a4a7874e6a40d461c'
        only-arches: [aarch64]
        strip-components: 0
