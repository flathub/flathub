id: io.github.n1ghthill.soundsgood
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: soundsgood

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --filesystem=xdg-music:ro
  - --own-name=org.mpris.MediaPlayer2.SoundsGood

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man

modules:
  - name: soundsgood
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/N1ghthill/soundsgood.git
        tag: v0.1.1
        commit: 039b6a32ef34efa05135d78febda1ca46a84b34e
