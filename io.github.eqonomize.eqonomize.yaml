app-id: io.github.eqonomize.eqonomize
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: eqonomize
rename-desktop-file: eqonomize.desktop
rename-icon: eqonomize
copy-icon: true
finish-args:
  - --device=dri
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # Network access
  # for exchange rates updates
  - --share=network
modules:

  - name: eqonomize
    buildsystem: qmake
    sources:
      - type: archive
        url: https://github.com/Eqonomize/eqonomize/releases/download/v1.5.12/eqonomize-1.5.12.tar.gz
        sha256: de4c15d614fef38d65212235f60b904470152f30dc12073dac522dbae7e5ec4d
      - type: patch
        path: eqonomize-appdata.patch