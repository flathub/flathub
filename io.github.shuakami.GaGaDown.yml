app-id: io.github.shuakami.GaGaDown
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: GagaDown
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: gagadown
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/gagadown/cargo
        AWS_LC_SYS_CMAKE_BUILDER: '1'
    build-commands:
      - cargo build --release --offline -p gagadown-app
      - install -D target/release/GagaDown /app/bin/GagaDown
      - install -D packaging/flatpak/io.github.shuakami.GaGaDown.desktop /app/share/applications/io.github.shuakami.GaGaDown.desktop
      - install -D packaging/flatpak/io.github.shuakami.GaGaDown.metainfo.xml /app/share/metainfo/io.github.shuakami.GaGaDown.metainfo.xml
      - install -D packaging/flatpak/io.github.shuakami.GaGaDown.png /app/share/icons/hicolor/512x512/apps/io.github.shuakami.GaGaDown.png
      - install -D packaging/flatpak/NotoSansCJK-LICENSE.txt /app/share/licenses/io.github.shuakami.GaGaDown/NotoSansCJK-LICENSE.txt
    sources:
      - type: archive
        url: https://github.com/shuakami/gagadown/archive/refs/tags/v0.1.11.tar.gz
        sha256: 34a281ab6e72ba5060648f07bad36c2e723306f5c56f7ccca1894e65ee5df354
        x-checker-data:
          type: json
          url: https://api.github.com/repos/shuakami/gagadown/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/shuakami/gagadown/archive/refs/tags/" + .tag_name + ".tar.gz"'
          is-main-source: true
      - cargo-sources.json
