id: io.github.vysocavnu.skybee
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: skybee
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # system notifications and the tray icon
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # «Save photo» puts files into Downloads
  - --filesystem=xdg-download
modules:
  - name: skybee
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/vysocavnu/skybee/releases/download/v0.4.0/Skybee-0.4.0-linux-x64.tar.gz
        sha256: 9b3ce8dfcebd0b41d7fa3cdaae9f4bd954c14993fc1c7cfd7523954eb85b4078
        dest: skybee
      - type: file
        url: https://github.com/vysocavnu/skybee/releases/download/v0.4.0/io.github.vysocavnu.skybee.desktop
        sha256: 54140f3d12e0a6828ac1584b32052a9453075cfaeafbbdce4677509c47661dda
      - type: file
        url: https://github.com/vysocavnu/skybee/releases/download/v0.4.0/io.github.vysocavnu.skybee.metainfo.xml
        sha256: 7e7dad4fac730cb5e4cc845e669ae68c9928047c2833804d02b8d67ab326c435
      - type: file
        url: https://github.com/vysocavnu/skybee/releases/download/v0.4.0/icon-512.png
        sha256: 9214501351e73af00b986726db62e5eceee984419966abc76f080a808833d696
      - type: script
        dest-filename: skybee.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/skybee/skybee --ozone-platform-hint=auto --enable-features=WaylandWindowDecorations "$@"
    build-commands:
      - cp -a skybee /app/skybee
      - rm -f /app/skybee/chrome-sandbox
      - install -Dm755 skybee.sh /app/bin/skybee
      - install -Dm644 io.github.vysocavnu.skybee.desktop /app/share/applications/io.github.vysocavnu.skybee.desktop
      - install -Dm644 io.github.vysocavnu.skybee.metainfo.xml /app/share/metainfo/io.github.vysocavnu.skybee.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.vysocavnu.skybee.png
