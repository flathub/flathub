id: org.github.Romix.GEN
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: GEN

finish-args:
  - --socket=wayland
  - --socket=x11
  - --filesystem=host

modules:
  - name: GEN
    buildsystem: qmake
    sources:
      - type: git
        url: https://github.com/Romix/GEN-GraphicalEasyNotebook.git
