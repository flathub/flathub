app-id: com.fosslife.waterfowl
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: waterfowl

# The GNOME runtime ships GTK3 + WebKitGTK (webkit2gtk-4.1), which is exactly what
# the prebuilt Tauri binary links against — so we repackage the released .deb instead
# of compiling Tauri from source (the build sandbox has no network for cargo/npm).

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network        # Waterfowl connects to remote PostgreSQL servers

modules:
  - name: waterfowl
    buildsystem: simple
    build-commands:
      # Unpack the Debian package: ar archive containing a gzip'd data tarball.
      - ar x waterfowl.deb
      - tar -xf data.tar.gz
      # Binary
      - install -Dm755 usr/bin/waterfowl /app/bin/waterfowl
      # Icons — renamed to the Flatpak app-id (Flathub requirement)
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/waterfowl.png      /app/share/icons/hicolor/32x32/apps/com.fosslife.waterfowl.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/waterfowl.png    /app/share/icons/hicolor/128x128/apps/com.fosslife.waterfowl.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/waterfowl.png  /app/share/icons/hicolor/256x256@2/apps/com.fosslife.waterfowl.png
      # Our corrected, app-id-named desktop + AppStream files (NOT the deb's defaults)
      - install -Dm644 com.fosslife.waterfowl.desktop       /app/share/applications/com.fosslife.waterfowl.desktop
      - install -Dm644 com.fosslife.waterfowl.metainfo.xml  /app/share/metainfo/com.fosslife.waterfowl.metainfo.xml
    sources:
      - type: file
        url: https://github.com/fosslife/waterfowl/releases/download/Waterfowl-v0.2.2/waterfowl_0.2.2_amd64.deb
        sha256: d075e7a989179fe0deebc0694e9614a749d5dd3eb1204896f034b5ffaa0e8757
        dest-filename: waterfowl.deb
      - type: file
        path: com.fosslife.waterfowl.desktop
      - type: file
        path: com.fosslife.waterfowl.metainfo.xml
