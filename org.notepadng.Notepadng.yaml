id: org.notepadng.Notepadng
runtime: org.kde.Platform
runtime-version: 6.10
sdk: org.kde.Sdk
command: notepadng
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man

modules:
  - name: libqscintilla
    buildsystem: qmake
    subdir: src
    cleanup:
      - /mkspecs
      - /qsci
      - /lib/qt5
      - /share/qt5/qsci
    sources:
      - type: archive
        url: https://www.riverbankcomputing.com/static/Downloads/QScintilla/2.14.1/QScintilla_src-2.14.1.tar.gz
        sha256: dfe13c6acc9d85dfcba76ccc8061e71a223957a6c02f3c343b30a9d43a4cdd4d
      - type: patch
        path: patches/qscintilla-lib-paths.patch

  - name: uchardet
    buildsystem: cmake-ninja
    config-opts:
      # uchardet declares compatibility with cmake 3.1, but newer runtime provides cmake 4.0+,
      # which removed compatibility with eveything below cmake 3.5. Use compatibility option
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_BINARY=OFF
      - -DBUILD_STATIC=OFF
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
        sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0

  - name: notepadng
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_VARIANT=Flatpak
    sources:
      - type: git
        url: https://github.com/kravich/notepadng.git
        tag: 0.1.0
        commit: 6a8c03ef99d6adf52d4929af399d561a621d66d7
