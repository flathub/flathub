app-id: com.sorexclient.launcher
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: sorex-launcher
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.Desktop
modules:
  - name: sorex-launcher
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
      env:
        XDG_CACHE_HOME: /run/build/sorex-launcher/flatpak-node/cache
        npm_config_cache: /run/build/sorex-launcher/flatpak-node/npm-cache
    build-commands:
      - npm install --offline
      - npm run build:vite
      - npx electron-builder --linux dir
      - install -d /app/lib/sorex-launcher
      - install -d /app/bin
      - cp -a release/linux-unpacked/. /app/lib/sorex-launcher/
      - chmod 755 /app/lib/sorex-launcher/sorex-launcher
      - install -Dm755 flatpak/sorex-launcher-wrapper /app/bin/sorex-launcher
      - install -Dm644 flatpak/com.sorexclient.launcher.desktop /app/share/applications/com.sorexclient.launcher.desktop
      - install -Dm644 flatpak/com.sorexclient.launcher.metainfo.xml /app/share/metainfo/com.sorexclient.launcher.metainfo.xml
      - install -Dm644 flatpak/com.sorexclient.launcher.png /app/share/icons/hicolor/512x512/apps/com.sorexclient.launcher.png
    sources:
      - type: git
        url: https://github.com/SorexClient/SorexLauncher.git
        commit: 690995d
      - generated-sources.json