app-id: io.github.moimaian.GitFace
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: gitface

# GitFace fala com git/gh/ssh/pkexec já instalados no sistema real (não
# empacotamos essas ferramentas dentro do sandbox) — por isso precisa de
# --filesystem=host (ver bin/sandbox.py e ~/.ssh) e --talk-name para poder
# usar flatpak-spawn --host. Sem X11/Wayland/DRI a interface Qt não abre.
finish-args:
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak

modules:
  # Gerado com flatpak-pip-generator (pacote flatpak-pip-generator do PyPI)
  # + hashes conferidos manualmente contra os wheels reais baixados do
  # PyPI (ver conversa/registro de build). Se a versão do PySide6 mudar,
  # regenerar este arquivo.
  - pyside6-sources.yaml

  - name: gitface
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/gitface
      - cp -r bin ui midia /app/share/gitface/
      - find /app/share/gitface -name __pycache__ -type d -prune -exec rm -rf {} \;
      - install -Dm755 flatpak/gitface-wrapper /app/bin/gitface
      - install -Dm644 flatpak/io.github.moimaian.GitFace.desktop
        /app/share/applications/io.github.moimaian.GitFace.desktop
      - install -Dm644 flatpak/io.github.moimaian.GitFace.metainfo.xml
        /app/share/metainfo/io.github.moimaian.GitFace.metainfo.xml
      - install -Dm644 flatpak/icon-512.png
        /app/share/icons/hicolor/512x512/apps/io.github.moimaian.GitFace.png
    sources:
      - type: git
        url: https://github.com/moimaian/GitFace.git
        tag: v1.0
