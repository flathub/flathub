app-id: io.github.thevixcho.ProyecThor
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: proyecthor

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network

modules:
  - name: nlohmann-json
    buildsystem: cmake-ninja
    config-opts:
      - -DJSON_BuildTests=OFF
    sources:
      - type: git
        url: https://github.com/nlohmann/json.git
        tag: v3.11.3
        commit: 9cca280a4d0ccf0c08f47a99aa71d1b0e52f8d03

  - name: glm
    buildsystem: cmake-ninja
    config-opts:
      - -DGLM_BUILD_TESTS=OFF
      - -DGLM_BUILD_INSTALL=ON
      - -DBUILD_SHARED_LIBS=OFF
    sources:
      - type: git
        url: https://github.com/g-truc/glm.git
        tag: 1.0.1
        commit: 0af55ccecd98d4e5a8d1fad7de25ba429d60e863

  - name: glfw
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DGLFW_BUILD_EXAMPLES=OFF
      - -DGLFW_BUILD_TESTS=OFF
      - -DGLFW_BUILD_DOCS=OFF
      - -DGLFW_BUILD_X11=ON
      - -DGLFW_BUILD_WAYLAND=ON
    sources:
      - type: git
        url: https://github.com/glfw/glfw.git
        tag: '3.4'
        commit: a74efa0d5628b74adc0426af4c5710e287fa7c2c

  - name: proyecthor
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/TheVixcho/ProyecThor.git
        tag: v1.0.3
        commit: af003257c1af5549b47632bd696d8d9475d6d78a