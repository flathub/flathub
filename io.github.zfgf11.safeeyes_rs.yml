app-id: io.github.zfgf11.safeeyes_rs
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: safeeyes-rs

finish-args:
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.Mutter.IdleMonitor
  - --system-talk-name=org.freedesktop.login1

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/safeeyes-rs/cargo

modules:
  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts:
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
      - -Dsmoke-tests=false
      - -Dintrospection=false
      - -Dvapi=false
    sources:
      - type: archive
        url: https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.3.0.tar.gz
        sha256: 1ebb01ab14e98afd1727f68f64981c37bd23305b1f131f5667c02b94cf593192

  - name: safeeyes-rs
    buildsystem: simple
    build-commands:
      - cargo --offline build --release
      - install -Dm755 target/release/safeeyes-rs /app/bin/safeeyes-rs
      - install -Dm644 packaging/flathub/io.github.zfgf11.safeeyes_rs.desktop /app/share/applications/io.github.zfgf11.safeeyes_rs.desktop
      - install -Dm644 packaging/flathub/io.github.zfgf11.safeeyes_rs.metainfo.xml /app/share/metainfo/io.github.zfgf11.safeeyes_rs.metainfo.xml
      - install -Dm644 packaging/flathub/io.github.zfgf11.safeeyes_rs.svg /app/share/icons/hicolor/scalable/apps/io.github.zfgf11.safeeyes_rs.svg
      - install -Dm644 assets/sounds/break-start.wav /app/share/safeeyes-rs/sounds/break-start.wav
      - install -Dm644 assets/sounds/break-end.wav /app/share/safeeyes-rs/sounds/break-end.wav
    sources:
      - type: archive
        url: https://github.com/zfgf11/safeeyes-rs/archive/refs/tags/v0.1.4.tar.gz
        sha256: 0d6ad5540a19f1efdb5dbbf4383aed81f50f6bfb1cf03682e8f81934143d5d5f
        x-checker-data:
          type: git
          url: https://github.com/zfgf11/safeeyes-rs.git
          tag-pattern: ^v([\d.]+)$
      - cargo-sources.json
