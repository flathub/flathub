id: com.google.Antigravity
runtime: org.freedesktop.Sdk
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: antigravity
separate-locales: false

tags:
  - proprietary

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --socket=ssh-auth
  - --device=all
  - --allow=devel
  - --filesystem=host
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: antigravity
    buildsystem: simple
    build-commands:
      - install -Dm755 antigravity.sh /app/bin/antigravity
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm644 com.google.Antigravity.desktop /app/share/applications/com.google.Antigravity.desktop
      - install -Dm644 com.google.Antigravity.metainfo.xml /app/share/metainfo/com.google.Antigravity.metainfo.xml
      - install -Dm644 com.google.Antigravity.png /app/share/icons/hicolor/512x512/apps/com.google.Antigravity.png
      - mkdir -p /app/share/licenses/com.google.Antigravity
      - ln -s /app/extra/LICENSE.electron.txt /app/share/licenses/com.google.Antigravity/LICENSE.electron.txt
      - ln -s /app/extra/LICENSES.chromium.html /app/share/licenses/com.google.Antigravity/LICENSES.chromium.html
    sources:
      - type: extra-data
        url: https://storage.googleapis.com/antigravity-public/antigravity-hub/2.22.0-5446056071266304/linux-x64/Antigravity.tar.gz
        sha256: ec09473e3b12be43538c19f9992960d7a2549cdecd31c8c35c69af77fe3aa4f1
        size: 180243767
        filename: Antigravity.tar.gz
        only-arches:
          - x86_64

      - type: extra-data
        url: https://storage.googleapis.com/antigravity-public/antigravity-hub/2.22.0-5446056071266304/linux-arm/Antigravity.tar.gz
        sha256: 746fae102b552b6c0186516a9bd8a845f397b82b27889f37f748ce698cfd0a60
        size: 178116821
        filename: Antigravity.tar.gz
        only-arches:
          - aarch64

      - type: file
        path: antigravity.sh

      - type: file
        path: apply_extra.sh

      - type: file
        path: com.google.Antigravity.desktop

      - type: file
        path: com.google.Antigravity.metainfo.xml

      - type: file
        path: com.google.Antigravity.png

  - name: host-spawn
    buildsystem: simple
    build-commands:
      - install -Dm755 host-spawn /app/bin/host-spawn
    sources:
      - type: file
        url: https://github.com/1player/host-spawn/releases/download/v1.6.2/host-spawn-x86_64
        sha256: 077bc09a087292447ba17cfe2156a93f71bf56c4c6be8e38d3abe65c1240f34c
        dest-filename: host-spawn
        only-arches: [x86_64]

      - type: file
        url: https://github.com/1player/host-spawn/releases/download/v1.6.2/host-spawn-aarch64
        sha256: 8b30215b0b6b66c8c34a3e22d372dd39020295cd0904608bc2c5f5ecff829e5f
        dest-filename: host-spawn
        only-arches: [aarch64]
