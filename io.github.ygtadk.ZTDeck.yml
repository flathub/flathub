app-id: io.github.ygtadk.ZTDeck
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: ztdeck

finish-args:
  # Windowing
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The ZeroTier control API lives on 127.0.0.1:9993
  - --share=network
  # Read-only access to the user's copy of the service token, nothing else
  - --filesystem=~/.zeroTierOneAuthToken:ro

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - '*.la'
  - '*.a'

modules:
  - name: ztdeck
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/ygtadk/ztdeck.git
        tag: v0.1.0
        commit: 6c932c892de964e3ddeccc70c8c98678e6fe7835
