<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D0F2C" />
      <stop offset="0.55" stop-color="#240E1E" />
      <stop offset="1" stop-color="#120712" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.92" r="0.75">
      <stop offset="0" stop-color="#FF2D55" stop-opacity="0.5" />
      <stop offset="0.6" stop-color="#FF2D55" stop-opacity="0.06" />
      <stop offset="1" stop-color="#FF2D55" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="shine" cx="0.35" cy="0.32" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="front" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FF6E93" />
      <stop offset="0.45" stop-color="#FF2D55" />
      <stop offset="1" stop-color="#C1123C" />
    </linearGradient>
    <linearGradient id="back" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FF9DBB" />
      <stop offset="0.5" stop-color="#FF5CA8" />
      <stop offset="1" stop-color="#C1307A" />
    </linearGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="116" ry="116" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)" />
    <rect x="0" y="0" width="512" height="512" fill="url(#glow)" />

    <!-- marca das cerejas -->
    <g transform="translate(64 62) scale(8)">
      <!-- cereja menor (atrás) -->
      <circle cx="31" cy="28" r="7.5" fill="url(#back)" />
      <circle cx="28.6" cy="25.4" r="2.2" fill="#FFFFFF" fill-opacity="0.18" />
      <!-- hastes em Y -->
      <path d="M20 24c0-6.5 3.2-10 9.5-11.5M32.5 22.5c0-5.5-2-9-3.5-10.5"
            fill="none" stroke="#6FD24B" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" />
      <!-- folha -->
      <path d="M29 13c4.5-4.5 12-3.5 15 2.5-6.5 3.5-12 1.5-15-2.5Z" fill="#7ED957" />
      <!-- cereja maior (frente) -->
      <circle cx="18" cy="31" r="10.5" fill="url(#front)" />
      <circle cx="18" cy="31" r="10.5" fill="url(#shine)" />
      <!-- brilho pontual -->
      <circle cx="14.2" cy="26.8" r="1.9" fill="#FFFFFF" fill-opacity="0.6" />
      <!-- play -->
      <path d="M14.5 27v8.5l7.5-4.25-7.5-4.25Z" fill="#FFFFFF" />
    </g>
  </g>
</svg>
