app-id: me.kizuri_studio.CerejaPlay
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: cerejaplay
separate-locales: false

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=ipc
  - --share=network
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: cerejaplay
    buildsystem: simple
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      # O release oficial do Linux é um .deb com o app em /opt/CerejaPlay.
      - ar x cerejaplay.deb
      - mkdir -p /app/cerejaplay /tmp/deb
      - tar -xf data.tar.* -C /tmp/deb
      - cp -a /tmp/deb/opt/CerejaPlay/. /app/cerejaplay/
      # O sandbox do Flatpak usa o zypak, então o chrome-sandbox setuid sai fora.
      - rm -rf /tmp/deb /app/cerejaplay/chrome-sandbox
      - install -Dm755 cerejaplay-run.sh /app/bin/cerejaplay
      - install -Dm644 me.kizuri_studio.CerejaPlay.desktop /app/share/applications/me.kizuri_studio.CerejaPlay.desktop
      - install -Dm644 me.kizuri_studio.CerejaPlay.metainfo.xml /app/share/metainfo/me.kizuri_studio.CerejaPlay.metainfo.xml
      - install -Dm644 me.kizuri_studio.CerejaPlay.png /app/share/icons/hicolor/512x512/apps/me.kizuri_studio.CerejaPlay.png
      - install -Dm644 me.kizuri_studio.CerejaPlay.svg /app/share/icons/hicolor/scalable/apps/me.kizuri_studio.CerejaPlay.svg
    sources:
      # Artefato oficial e público (não expõe o código do app, que é privado).
      - type: file
        url: https://github.com/Brunim757/cerejaplay-releases/releases/download/linux-latest/CerejaPlay-linux.deb
        sha256: 55f4f4b6e89915b22c7b1c9c388308a4da35f67f81573f2dbbe0c1cf46536465
        dest-filename: cerejaplay.deb
        only-arches:
          - x86_64
      - type: script
        dest-filename: cerejaplay-run.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/cerejaplay/cerejaplay-desktop.bin "$@"
      - type: file
        path: me.kizuri_studio.CerejaPlay.desktop
      - type: file
        path: me.kizuri_studio.CerejaPlay.metainfo.xml
      - type: file
        path: me.kizuri_studio.CerejaPlay.png
      - type: file
        path: me.kizuri_studio.CerejaPlay.svg
