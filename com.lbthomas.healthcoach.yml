id: com.lbthomas.healthcoach
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: HealthCoach

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri

  - --share=network

  - --filesystem=xdg-documents
  - --filesystem=xdg-download

modules:
  - name: healthcoach
    buildsystem: simple
    build-commands:
      - cp -r HealthCoach/bin /app/
      - cp -r HealthCoach/lib /app/
      - install -D -m 0644 HealthCoach/scales.png /app/share/icons/hicolor/256x256/apps/com.lbthomas.healthcoach.png
      - install -D -m 0644 com.lbthomas.healthcoach.desktop /app/share/applications/com.lbthomas.healthcoach.desktop
      - install -D -m 0644 com.lbthomas.healthcoach.metainfo.xml /app/share/metainfo/com.lbthomas.healthcoach.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/bigtlb/healthcoach/releases/download/v0.9.10/HealthCoach-0.9.10-linux-x64.tar.gz
        sha256: PUT_HEALTHCOACH_0_9_8_TARBALL_SHA256_HERE

      - type: file
        path: com.lbthomas.healthcoach.desktop

      - type: file
        path: com.lbthomas.healthcoach.metainfo.xml