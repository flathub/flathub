id: "com.dbeaver.DBeaverLite"
command: dbeaverw

# We're using GNOME and not freedesktop-sdk because GNOME comes with
# libsecret (needed for https://dbeaver.com/docs/dbeaver/Integrated-Security/) and
# webkitgtk (needed at least for https://dbeaver.com/docs/dbeaver/Working-with-Spatial-GIS-data/). On top of that, DBeaver uses SWT, which,
# in turn, uses GTK, so this all kinda makes sense.
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk

# Keep finish-args in the alphabetical order, please!
finish-args:
  - --filesystem=home
  - --share=network
  - --socket=fallback-x11
  # '--share=ipc' is required by X11
  - --share=ipc
  - --socket=wayland
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.FileManager1

modules:
  - name: dbeaver
    buildsystem: simple
    build-commands:
      - tar xzf dbeaver.tar.gz -C /app
      # flatpak-builder chokes on these files while doing 'eu-strip --remove-comment --reloc-debug-sections'
      - rm -rf /app/dbeaver/plugins/com.sun.jna_*/com/sun/jna/sunos-*
      # Patch .ini so DBeaver knows it's installed via flatpak
      - echo '-Ddbeaver.distribution.type=flatpak' >> /app/dbeaver/dbeaver.ini
      # Copy launcher script
      - install -Dm500 dbeaverw /app/bin/dbeaverw
      # Icon
      - install -Dm400 icon.svg /app/share/icons/hicolor/scalable/apps/com.dbeaver.DBeaverLite.svg
      # Install .desktop file and tweak it a bit
      - install -Dm400 /app/dbeaver/dbeaver-le.desktop /app/share/applications/com.dbeaver.DBeaverLite.desktop
      - desktop-file-edit --set-key=Name --set-value='DBeaver Lite' /app/share/applications/com.dbeaver.DBeaverLite.desktop
      - desktop-file-edit --set-icon=com.dbeaver.DBeaverLite /app/share/applications/com.dbeaver.DBeaverLite.desktop
      - desktop-file-edit --set-key=Exec --set-value='/app/bin/dbeaverw' /app/share/applications/com.dbeaver.DBeaverLite.desktop
      - desktop-file-validate /app/share/applications/com.dbeaver.DBeaverLite.desktop
      # AppStream stuff
      - install -Dm400 com.dbeaver.DBeaverLite.appdata.xml /app/share/metainfo/com.dbeaver.DBeaverLite.appdata.xml

    sources:
      - type: file
        path: dbeaverw
      - type: file
        path: "com.dbeaver.DBeaverLite.appdata.xml"
      - type: file
        path: icon.svg
      - type: file
        dest-filename: dbeaver.tar.gz
        only-arches:
          - aarch64
        url: https://downloads.dbeaver.net/lite/26.0.0/dbeaver-le-26.0.0-linux-aarch64.tar.gz
        sha256: d0c01c11b2bd5414c4d0ccaa6794513a034eba0ebd92c3a868ec56a9d202072b
        x-checker-data:
          type: rotating-url
          url: https://dbeaver.com/files/dbeaver-le-latest-linux-aarch64.tar.gz
          pattern: https://downloads.dbeaver.net/lite/([0-9.]+)/dbeaver-le-([0-9.]+)-linux-aarch64.tar.gz
      - type: file
        dest-filename: dbeaver.tar.gz
        only-arches:
          - x86_64
        url: https://downloads.dbeaver.net/lite/26.0.0/dbeaver-le-26.0.0-linux-x86_64.tar.gz
        sha256: 67933e2bbba8405c3ae4fda9b8b268acfc8730465c9808abb166dc9cf1429d24
        x-checker-data:
          type: rotating-url
          url: https://dbeaver.com/files/dbeaver-le-latest-linux-x86_64.tar.gz
          pattern: https://downloads.dbeaver.net/lite/([0-9.]+)/dbeaver-le-([0-9.]+)-linux-x86_64.tar.gz
