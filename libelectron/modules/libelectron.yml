name: libelectron
buildsystem: simple
build-options:
  append-path: /usr/lib/sdk/node22/bin
  env:
    XDG_CACHE_HOME: /run/build/libelectron/flatpak-node/cache
    npm_config_cache: /run/build/libelectron/flatpak-node/npm-cache
    npm_config_nodedir: /usr/lib/sdk/node22
build-commands:
  - install -dm755 /app/opt/libelectron
  - cp -a libelectron/. /app/opt/libelectron/
  - install -Dm644 package-lock.json /app/opt/libelectron/package-lock.json
  - npm install --legacy-peer-deps --omit=dev --offline --prefix /app/opt/libelectron
  - printf '2026.5\n' > /app/opt/libelectron/version.txt
  - install -dm755 /app/opt/libelectron/libsplash
  - cp -a libsplash/. /app/opt/libelectron/libsplash/
  - install -dm755 /app/opt/libelectron/libadblock
  - cp -a libadblock/. /app/opt/libelectron/libadblock/
  - install -dm755 /app/opt/libelectron/libuseragent
  - cp -a libuseragent/. /app/opt/libelectron/libuseragent/
  - ln -sf /app/bin/libelectronmeta /app/opt/libelectron/electron
  - sh -c 'install -Dm644 LICENSE "/app/share/licenses/${FLATPAK_ID}/libelectron/LICENSE"'
sources:
  - ../generated-sources.json
  - type: file
    path: ../package-lock.json
  - type: file
    path: ../LICENSE
  - type: archive
    url: https://gitlab.com/linuxbombay/libelectron/libelectron/-/archive/2026.5/libelectron-2026.5.tar.bz2
    sha256: 51b7313fc2e0512190548964c967fee9794bb8c376a216a97ff3b3f194b064a1
    dest: libelectron
    strip-components: 1
  - type: archive
    url: https://gitlab.com/linuxbombay/libelectron/libsplash/-/archive/1.1/libsplash-1.1.tar.bz2
    sha256: 25b84c3f7ae144409afb7bb8fee64cbd0b44ed78d3c6d6246feb66282936a3f4
    dest: libsplash
    strip-components: 1
  - type: archive
    url: https://gitlab.com/linuxbombay/libelectron/libadblock/libadblock/-/archive/1.5/libadblock-1.5.tar.bz2
    sha256: 1c210ee8b378ce5b9491bc33eb09fc6d6d2b913ded5cb4ac41738fd07a7579b3
    dest: libadblock
    strip-components: 1
  - type: archive
    url: https://gitlab.com/linuxbombay/libelectron/libuseragent/-/archive/151.0.0.0/libuseragent-151.0.0.0.tar.bz2
    sha256: 239d663ca06632841e1d02e99f3390ed5a7e112c56143049e06a043f6890d22f
    dest: libuseragent
    strip-components: 1
