app-id: io.gitlab.linuxbombay.LibElectron
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: libelectron-flatpak-info
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
modules:
  - modules/libelectron.yml
  - name: libelectron-flatpak-info
    buildsystem: simple
    build-commands:
      - install -Dm755 libelectron-flatpak-info /app/bin/libelectron-flatpak-info
    sources:
      - type: script
        dest-filename: libelectron-flatpak-info
        commands:
          - 'printf "LibElectron %s is installed in /app/opt/libelectron\\n" "$(cat /app/opt/libelectron/version.txt)"'
          - 'printf "This Flatpak is a validation wrapper. Include modules/libelectron.yml in consuming app manifests.\\n"'
