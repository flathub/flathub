id: io.github.muchobliged.SimpleDoomLauncher
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: SimpleDoomLauncher
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=home
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/mnt

modules:
  - name: nim
    buildsystem: simple
    sources:
      - type: archive
        url: https://nim-lang.org/download/nim-2.2.10-linux_x64.tar.xz
        sha256: 0a3a38752e97e9d44aa479b3a7b37336dfe0176daf22ee5b5218ad0991ecd211
        dest: nim-sdk
    build-commands:
      - mkdir -p /app/libexec/nim
      - mkdir -p /app/bin
      - cp -r nim-sdk/* /app/libexec/nim/
      - ln -s /app/libexec/nim/bin/nim /app/bin/nim
      - ln -s /app/libexec/nim/bin/nimble /app/bin/nimble

  - name: SimpleDoomLauncher
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/muchobliged/SimpleDoomLauncher
        tag: v1.21
        commit: 1c0f7e9938ccfb62525222fbc9539a33c2aae1dd

      - type: git
        url: https://github.com/nimgl/nimgl
        tag: 1.3.2
        commit: 309d6ed8164ad184ed5bbb171c9f3d9d1c11ff81
        dest: nimble-cache/pkgs/nimgl-1.3.2

      - type: git
        url: https://github.com/Patitotective/tinydialogs
        tag: 1.1.2
        commit: c8d2450501a01ef02edd100629e5c716f3cfacba
        dest: nimble-cache/pkgs/tinydialogs-1.1.2

    build-commands:
      - >
        nim cpp
        -d:release
        -d:strip
        -d:lto
        --opt:size
        --path:nimble-cache/pkgs/nimgl-1.3.2/src
        --path:nimble-cache/pkgs/tinydialogs-1.1.2/src
        src/SimpleDoomLauncher.nim

      - install -Dm755 src/SimpleDoomLauncher /app/bin/SimpleDoomLauncher
      - install -Dm644 assets/appdata/io.github.muchobliged.SimpleDoomLauncher.desktop /app/share/applications/io.github.muchobliged.SimpleDoomLauncher.desktop
      - install -Dm644 assets/appdata/io.github.muchobliged.SimpleDoomLauncher.png /app/share/icons/hicolor/256x256/apps/io.github.muchobliged.SimpleDoomLauncher.png
      - install -Dm644 assets/appdata/io.github.muchobliged.SimpleDoomLauncher.metainfo.xml /app/share/metainfo/io.github.muchobliged.SimpleDoomLauncher.metainfo.xml
