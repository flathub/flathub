app-id: io.github.arturzailer779_droid.dlna-video-server
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: dlna-server
cleanup-commands:
  - /app/cleanup-BaseApp.sh
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-pictures:ro
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.kde.StatusNotifierWatcher
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
modules:
  - name: libid3tag
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/mad/libid3tag/0.15.1b/libid3tag-0.15.1b.tar.gz
        sha256: 63da4f6e7997278f8a3fef4c6a372d342f705051d1eeb6a46a86b03610e26151
  - name: minidlna
    buildsystem: autotools
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/minidlna/minidlna/1.3.3/minidlna-1.3.3.tar.gz
        sha256: 39026c6d4a139b9180192d1c37225aa3376fdf4f1a74d7debbdbb693d996afa4
      - type: shell
        commands:
          - sed -i "s/s->codecpar->channels/s->codecpar->ch_layout.nb_channels/g" libav.h
  - name: dlna-server
    buildsystem: simple
    build-commands:
      - install -d /app/share/dlna-server
      - cp -r app assets main.py /app/share/dlna-server/
      - printf "#!/bin/sh\nexec python3 /app/share/dlna-server/main.py \"\$@\"\n" > /app/bin/dlna-server
      - chmod 755 /app/bin/dlna-server
      - install -Dm644 data/io.github.arturzailer779_droid.dlna-video-server.desktop /app/share/applications/io.github.arturzailer779_droid.dlna-video-server.desktop
      - install -Dm644 data/io.github.arturzailer779_droid.dlna-video-server.metainfo.xml /app/share/metainfo/io.github.arturzailer779_droid.dlna-video-server.metainfo.xml
      - install -Dm644 data/icons/64x64/io.github.arturzailer779_droid.dlna-video-server.png /app/share/icons/hicolor/64x64/apps/io.github.arturzailer779_droid.dlna-video-server.png
      - install -Dm644 data/icons/512x512/io.github.arturzailer779_droid.dlna-video-server.png /app/share/icons/hicolor/512x512/apps/io.github.arturzailer779_droid.dlna-video-server.png
    sources:
      - type: git
        url: https://github.com/arturzailer779-droid/dlna-video-server.git
        tag: v1.5
        commit: 7cd617748ff1af3b753c8bedd400cc5ee9dd7537
