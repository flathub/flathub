# Flathub manifest for Hotel Anvelope (proprietary, redistributable binary from the public downloads repo).
# The x86_64 tarball is built by .github/workflows/linux.yml in the private source repository and
# published by publish-release.sh to github.com/krakiun/hotel-anvelope-releases.
app-id: app.anvelope.HotelAnvelope
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
command: hotel-anvelope

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  # printing QR labels and receipts
  - --socket=cups
  # exports (CSV/Excel/PDF) and imports chosen by the user
  - --filesystem=xdg-download
  # opening links (website, privacy policy) in the user's browser
  - --talk-name=org.freedesktop.portal.OpenURI

modules:
  - name: hotel-anvelope
    buildsystem: simple
    build-commands:
      - install -Dm755 usr/bin/depozit-anvelope /app/bin/hotel-anvelope
      # the desktop entry from the .deb is rewritten so Exec/Icon match the Flatpak app id
      - sed -i -e 's|^Exec=.*|Exec=hotel-anvelope %U|' -e 's|^Icon=.*|Icon=app.anvelope.HotelAnvelope|'
        usr/share/applications/app.anvelope.HotelAnvelope.desktop
      - install -Dm644 usr/share/applications/app.anvelope.HotelAnvelope.desktop
        /app/share/applications/app.anvelope.HotelAnvelope.desktop
      - install -Dm644 app.anvelope.HotelAnvelope.metainfo.xml
        /app/share/metainfo/app.anvelope.HotelAnvelope.metainfo.xml
      # Tauri's .deb ships 32x32, 128x128 and 256x256@2 (= 512 px); map them to plain hicolor sizes.
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/depozit-anvelope.png
        /app/share/icons/hicolor/32x32/apps/app.anvelope.HotelAnvelope.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/depozit-anvelope.png
        /app/share/icons/hicolor/128x128/apps/app.anvelope.HotelAnvelope.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/depozit-anvelope.png
        /app/share/icons/hicolor/512x512/apps/app.anvelope.HotelAnvelope.png
    sources:
      - type: archive
        url: https://github.com/krakiun/hotel-anvelope-releases/releases/download/v1.0.0/hotel-anvelope-1.0.0-linux-x86_64.tar.gz
        sha256: 4097e7c9647b6cb7b3b8993f54c1f51952dfab2e898a19c240f83cb62204677a
        only-arches: [x86_64]
      - type: file
        path: app.anvelope.HotelAnvelope.metainfo.xml
