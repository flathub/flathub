<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Flat Shadow for subtle depth conforming to GNOME HIG -->
    <filter id="flat-shadow" x="-5%" y="-3%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.22" />
    </filter>
    <filter id="badge-shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Main Launcher Card (Squircle in GNOME Blue) -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="#3584E4" filter="url(#flat-shadow)" />

  <!-- Subtle Bottom Edge Darker Flat Accent (HIG style) -->
  <path d="M 48,368 C 48,421 91,464 144,464 L 368,464 C 421,464 464,421 464,368 L 464,352 L 48,352 Z" fill="#1C71D8" opacity="0.4" />

  <!-- App Menu Grid Elements -->
  <!-- Top row: two app window tiles -->
  <rect x="110" y="112" width="56" height="56" rx="14" fill="#FFFFFF" opacity="0.95" />
  <rect x="194" y="112" width="56" height="56" rx="14" fill="#FFFFFF" opacity="0.95" />

  <!-- Launch Arrow (Shortcut to desktop menu) -->
  <!-- Diagonal arrow pointing top-right -->
  <path d="M 286,226 L 358,154 M 358,154 L 284,154 M 358,154 L 358,228"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Grid Row 2 -->
  <rect x="122" y="206" width="32" height="32" rx="8" fill="#FFFFFF" opacity="0.9" />
  <rect x="182" y="206" width="32" height="32" rx="8" fill="#FFFFFF" opacity="0.9" />

  <!-- Grid Row 3 -->
  <rect x="122" y="266" width="32" height="32" rx="8" fill="#FFFFFF" opacity="0.9" />
  <rect x="182" y="266" width="32" height="32" rx="8" fill="#FFFFFF" opacity="0.9" />
  <rect x="242" y="266" width="32" height="32" rx="8" fill="#FFFFFF" opacity="0.9" />
  <rect x="302" y="266" width="32" height="32" rx="8" fill="#FFFFFF" opacity="0.9" />

  <!-- Grid Row 4 -->
  <rect x="110" y="326" width="56" height="56" rx="14" fill="#FFFFFF" opacity="0.95" />
  <rect x="182" y="338" width="32" height="32" rx="8" fill="#FFFFFF" opacity="0.9" />
  <rect x="242" y="338" width="32" height="32" rx="8" fill="#FFFFFF" opacity="0.9" />

  <!-- Action Badge: "Add to Menu" (Emerald Green with White Plus) -->
  <g filter="url(#badge-shadow)">
    <circle cx="376" cy="376" r="92" fill="#26A269" />
    <!-- White Plus Symbol -->
    <path d="M 376,324 L 376,428 M 324,376 L 428,376"
          stroke="#FFFFFF"
          stroke-width="26"
          stroke-linecap="round" />
  </g>
</svg>
