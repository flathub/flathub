id: net.nontrivial.ccwww
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
only-arches:
  - x86_64
command: ccwww
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
modules:
  - name: ccwww
    buildsystem: simple
    build-commands:
      # Install the contents of the downloaded tarball
      - mkdir -p /app/bin
      - cp ccwww /app/bin/
      - cp -r lib /app/bin/
      - cp -r data /app/bin/
      - chmod +x /app/bin/ccwww

      # Install systemic assets so Linux recognizes the app environment
      - install -Dm644 net.nontrivial.ccwww.desktop /app/share/applications/net.nontrivial.ccwww.desktop
      - install -Dm644 net.nontrivial.ccwww.metainfo.xml /app/share/metainfo/net.nontrivial.ccwww.metainfo.xml
      - install -Dm644 net.nontrivial.ccwww.png /app/share/icons/hicolor/256x256/apps/net.nontrivial.ccwww.png

    sources:
      # Points directly to the release binary archive processed by Codemagic
      - type: archive
        url: https://github.com/jbearden0/ccwww.nontrivial.net/releases/download/v2.0.6/ccwww-linux.tar.gz
        sha256: "c79f580a4ab407152d592acbcb763043f2d9cff48bd49fcf6be1c985be949bd8"
        strip-components: 0

      # Pull structural configuration assets right from the public git tree
      - type: file
        path: net.nontrivial.ccwww.desktop
      - type: file
        path: net.nontrivial.ccwww.metainfo.xml
      - type: file
        path: net.nontrivial.ccwww.png
