app-id: io.github.darkpurpleof.DarkPurpleOFsWebsite
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: darkpurpleofswebsite

finish-args:
  - --share=ipc                   
  - --share=network               
  - --socket=x11                  
  - --device=dri                  
  - --socket=pulseaudio           
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-download
  - --filesystem=xdg-config/darkpurpleofswebsite
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  - --filesystem=home/.darkpurpleof
  - --filesystem=home/.darkpurpleofswebsite
  - --filesystem=home/.java

modules:
  - name: git
    buildsystem: simple
    build-options:
      no-debuginfo: true
    build-commands:
      - make -j$FLATPAK_BUILDER_N_JOBS prefix=/app NO_PERL=1 NO_RUST=1 NO_TCLTK=1 NO_GETTEXT=1 NO_PYTHON=1 NO_INSTALL_HARDLINKS=1 all
      - make prefix=/app NO_PERL=1 NO_RUST=1 NO_TCLTK=1 NO_GETTEXT=1 NO_PYTHON=1 NO_INSTALL_HARDLINKS=1 install
    sources:
      - type: git
        url: https://github.com/git/git.git
        tag: v2.56.0
        commit: a018953688f1b10bddf91bff8747068f5f4746a4

  - name: darkpurpleofswebsite
    buildsystem: simple
    build-options:
      strip: false              
      no-debuginfo: true
    build-commands:
      - mkdir -p /app/opt/darkpurpleofswebsite
      - cp -a bin lib /app/opt/darkpurpleofswebsite/

      - install -Dm755 launcher.sh /app/bin/darkpurpleofswebsite

      - install -Dm644 io.github.darkpurpleof.DarkPurpleOFsWebsite.desktop  /app/share/applications/io.github.darkpurpleof.DarkPurpleOFsWebsite.desktop
      - install -Dm644 io.github.darkpurpleof.DarkPurpleOFsWebsite.metainfo.xml /app/share/metainfo/io.github.darkpurpleof.DarkPurpleOFsWebsite.metainfo.xml
      - install -Dm644 io.github.darkpurpleof.DarkPurpleOFsWebsite.xml      /app/share/mime/packages/io.github.darkpurpleof.DarkPurpleOFsWebsite.xml
      - install -Dm644 io.github.darkpurpleof.DarkPurpleOFsWebsite.png      /app/share/icons/hicolor/256x256/apps/io.github.darkpurpleof.DarkPurpleOFsWebsite.png

    sources:
      - type: archive
        url: https://github.com/darkpurpleof/darkpurpleofs-website-pc/releases/download/1.0/DarkPurpleOFsWebsite-linux-x64.tar.gz
        sha256: ee7886d03515dfb4ef25adc666f380131c52f12ef6352f75a1e404e4af8d9acb
        strip-components: 1

      - type: file
        path: launcher.sh
      - type: file
        path: io.github.darkpurpleof.DarkPurpleOFsWebsite.desktop
      - type: file
        path: io.github.darkpurpleof.DarkPurpleOFsWebsite.metainfo.xml
      - type: file
        path: io.github.darkpurpleof.DarkPurpleOFsWebsite.xml
      - type: file
        path: io.github.darkpurpleof.DarkPurpleOFsWebsite.png
