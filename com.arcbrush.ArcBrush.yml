app-id: com.arcbrush.ArcBrush
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: arcbrush

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  # Projects span a .arcb file + sidecar .arcb_data/ dir + sibling images;
  # portal grants can't express that. Justification in PR.
  - --filesystem=host

modules:
  # libsecret: Platform ships the .so but not the secret-tool CLI.
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Dvapi=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.7.tar.xz
        sha256: 6b452e4750590a2b5617adc40026f28d2f4903de15f1250e1d1c40bfd68ed55e

  - name: arcbrush
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 arcbrush-wrapper.sh /app/bin/arcbrush
      - install -Dm644 com.arcbrush.ArcBrush.desktop /app/share/applications/com.arcbrush.ArcBrush.desktop
      - install -Dm644 com.arcbrush.ArcBrush.metainfo.xml /app/share/metainfo/com.arcbrush.ArcBrush.metainfo.xml
      - install -Dm644 icons/128x128/apps/com.arcbrush.ArcBrush.png /app/share/icons/hicolor/128x128/apps/com.arcbrush.ArcBrush.png
      - install -Dm644 icons/256x256/apps/com.arcbrush.ArcBrush.png /app/share/icons/hicolor/256x256/apps/com.arcbrush.ArcBrush.png
      - install -Dm644 mime/arcbrush.xml /app/share/mime/packages/com.arcbrush.ArcBrush.xml
      - for s in 16 24 32 48 64 128 256; do install -Dm644 icons/${s}x${s}/mimetypes/com.arcbrush.ArcBrush-document.png /app/share/icons/hicolor/${s}x${s}/mimetypes/com.arcbrush.ArcBrush-document.png; done
    sources:
      # tar.gz of the usr/ tree (the AppImage can't self-extract in the
      # sandbox). url-query derives the .tar.gz URL from the AppImage URL.
      - type: extra-data
        filename: arcbrush.tar.gz
        url: https://arcbrush.com/downloads/ArcBrush-1.3.1-x86_64.tar.gz
        sha256: 5540d883550e2b5001341ebd804e4ac0d00c8065453bd3d50baa35d2b19291a2
        size: 12012162
        x-checker-data:
          type: json
          url: https://api.arcbrush.com/api/version?platform=linux
          version-query: .version
          url-query: '.download_url | sub("-x86_64\\.AppImage$"; "-x86_64.tar.gz")'
      - type: script
        dest-filename: apply_extra.sh
        commands:
          - set -e
          - bsdtar -xf arcbrush.tar.gz
          - rm arcbrush.tar.gz
      - type: script
        dest-filename: arcbrush-wrapper.sh
        commands:
          - exec /app/extra/usr/bin/arcbrush "$@"
      # Document icon uses an app-id-prefixed name so flatpak exports it.
      - type: file
        path: com.arcbrush.ArcBrush.desktop
      - type: file
        path: com.arcbrush.ArcBrush.metainfo.xml
      - type: file
        path: mime/arcbrush.xml
        dest: mime
      - type: file
        path: icons/128x128/apps/com.arcbrush.ArcBrush.png
        dest: icons/128x128/apps
      - type: file
        path: icons/256x256/apps/com.arcbrush.ArcBrush.png
        dest: icons/256x256/apps
      - type: file
        path: icons/16x16/mimetypes/com.arcbrush.ArcBrush-document.png
        dest: icons/16x16/mimetypes
      - type: file
        path: icons/24x24/mimetypes/com.arcbrush.ArcBrush-document.png
        dest: icons/24x24/mimetypes
      - type: file
        path: icons/32x32/mimetypes/com.arcbrush.ArcBrush-document.png
        dest: icons/32x32/mimetypes
      - type: file
        path: icons/48x48/mimetypes/com.arcbrush.ArcBrush-document.png
        dest: icons/48x48/mimetypes
      - type: file
        path: icons/64x64/mimetypes/com.arcbrush.ArcBrush-document.png
        dest: icons/64x64/mimetypes
      - type: file
        path: icons/128x128/mimetypes/com.arcbrush.ArcBrush-document.png
        dest: icons/128x128/mimetypes
      - type: file
        path: icons/256x256/mimetypes/com.arcbrush.ArcBrush-document.png
        dest: icons/256x256/mimetypes
