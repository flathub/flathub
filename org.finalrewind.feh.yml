app-id: org.finalrewind.feh
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: feh

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --filesystem=xdg-pictures:rw
  - --filesystem=host:ro

rename-desktop-file: feh.desktop
rename-icon: feh

cleanup:
  - /share/feh/fonts/yudit.ttf

modules:
  - name: imlib2
    buildsystem: autotools
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/enlightenment/imlib2-src/1.12.6/imlib2-1.12.6.tar.xz
        sha256: 250f9752f69dc522e529a81aaa9395705f7fc312ff2453e5de59ac2ba1f2858f
        x-checker-data:
          type: anitya
          is-main-source: true
          project-id: 21676
          url-template: https://downloads.sourceforge.net/project/enlightenment/imlib2-src/$version/imlib2-$version.tar.xz

  - name: feh
    buildsystem: simple
    build-commands:
      - make PREFIX=/app curl=1 exif=1 help=1 magic=1 xinerama=1
      - make install PREFIX=/app
    sources:
      - type: git
        url: http://git.finalrewind.org/derf/feh
        tag: 3.12.2
        commit: c5e05ad638e819f0f9852df9b33400ca63662d19
        x-checker-data:
          type: anitya
          is-main-source: true
          project-id: 790
          tag-template: $version
      - type: patch
        path: feh-1.10.1-dejavu.patch
