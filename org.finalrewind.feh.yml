app-id: org.finalrewind.feh
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: feh

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --filesystem=xdg-pictures:rw
  - --filesystem=host:ro

modules:
  - name: imlib2
    buildsystem: autotools
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/enlightenment/imlib2-1.12.6.tar.xz
        sha256: 250f9752f69dc522e529a81aaa9395705f7fc312ff2453e5de59ac2ba1f2858f

  - name: feh
    buildsystem: simple
    build-commands:
      - patch -p1 < feh-1.10.1-dejavu.patch
      - make PREFIX=/app curl=1 exif=1 help=1 magic=1 xinerama=1
      - make install PREFIX=/app
      - mv /app/share/icons/hicolor/scalable/apps/feh.svg /app/share/icons/hicolor/scalable/apps/org.finalrewind.feh.svg
      - mv /app/share/icons/hicolor/48x48/apps/feh.png /app/share/icons/hicolor/48x48/apps/org.finalrewind.feh.png
      - mv /app/share/applications/feh.desktop /app/share/applications/org.finalrewind.feh.desktop
      - sed -i 's/^Icon=feh/Icon=org.finalrewind.feh/' /app/share/applications/org.finalrewind.feh.desktop
      - rm -f /app/share/feh/fonts/yudit.ttf
    sources:
      - type: archive
        url: https://feh.finalrewind.org/feh-3.12.2.tar.bz2
        sha256: 7ce358b18a7f37bcc97a09b4efd89fdadd54cd8e7032db345f61e66dd04b1c3f
      - type: file
        path: feh-1.10.1-dejavu.patch

