  - name: genesis
    buildsystem: simple
    build-commands:
      - pip3 install --no-cache-dir --prefix=/app --no-build-isolation --no-deps .
      - install -Dm644 assets/io.github.Faisal_Fayaz.genesis.metainfo.xml /app/share/metainfo/io.github.Faisal_Fayaz.genesis.metainfo.xml
      - install -Dm644 assets/genesis.svg /app/share/icons/hicolor/scalable/apps/io.github.Faisal_Fayaz.genesis.svg
      - install -Dm644 assets/genesis.desktop /app/share/applications/io.github.Faisal_Fayaz.genesis.desktop
      - sed -i 's/^Exec=.*/Exec=genesis app/' /app/share/applications/io.github.Faisal_Fayaz.genesis.desktop
      - sed -i 's/^Icon=.*/Icon=io.github.Faisal_Fayaz.genesis/' /app/share/applications/io.github.Faisal_Fayaz.genesis.desktop
    sources:
