# Flatpak manifest for Genesis.
#
# Build locally with:
#   flatpak-builder --user --install build-dir flatpak/io.github.Faisal_Fayaz.genesis.yml
#
# - Python wheels arrive as sha256-verified file sources (offline-safe
#   builds, Flathub-compatible), one per architecture. requirements.txt
#   stays the dev lockfile; the runtime pins are mirrored here — keep them
#   in step.
# - The genesis module installs with --no-build-isolation --no-deps: the
#   SDK provides setuptools and numpy/pillow are already in place, so the
#   build needs no network at all.
# - Wallpaper-apply under the sandbox talks to the settings daemon
#   (--talk-name=ca.desrt.dconf) instead of touching the dconf database
#   files: narrower than filesystem access, and the lint-clean way to reach
#   the wallpaper keys. The daily timer itself stays host-side via
#   `flatpak run --command=genesis io.github.Faisal_Fayaz.genesis daily`.

app-id: io.github.Faisal_Fayaz.genesis
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: genesis
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=ca.desrt.dconf
modules:
  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-cache-dir --prefix=/app --no-index --find-links=.
        numpy==2.5.3 pillow==11.3.0
    sources:
      # cp312 wheels (GNOME 48 SDK) and cp313 wheels (GNOME 50 SDK): pip
      # selects by interpreter tag, so one manifest serves both runtimes.
