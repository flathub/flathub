app-id: jp.nonbili.meron
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable
command: meron
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup-commands:
  - ffmpeg -nostdin -loglevel error -i /app/share/icons/hicolor/512x512/apps/jp.nonbili.meron.png -vf scale=512:512 -frames:v 1 /tmp/jp.nonbili.meron.png && install -Dm644 /tmp/jp.nonbili.meron.png /app/share/icons/hicolor/512x512/apps/jp.nonbili.meron.png

modules:
  - name: meron
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin:/usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin:/run/build/meron/bin
      env:
        CARGO_HOME: /run/build/meron/cargo
        CARGO_NET_OFFLINE: 'true'
        GOPATH: /run/build/meron/go
        GOFLAGS: -mod=vendor
    build-commands:
      - cargo build --offline --locked --release --manifest-path meron-core/Cargo.toml
      - mkdir -p build/sidecar
      - cp meron-core/target/release/meron-core build/sidecar/meron-core
      - HOME=$PWD yarn config --offline set yarn-offline-mirror $FLATPAK_BUILDER_BUILDDIR/flatpak-node/yarn-mirror
      - cd frontend && yarn install --offline --frozen-lockfile --ignore-scripts
      - cd frontend && bun run build
      - go build -mod=vendor -tags "embed_sidecar production webkit2_41" -o /app/bin/meron .
      - install -Dm644 metadata/flatpak/jp.nonbili.meron.metainfo.xml /app/share/metainfo/jp.nonbili.meron.metainfo.xml
      - install -Dm644 metadata/flatpak/jp.nonbili.meron.desktop /app/share/applications/jp.nonbili.meron.desktop
      - install -Dm644 build/appicon.png /app/share/icons/hicolor/512x512/apps/jp.nonbili.meron.png
    sources:
      - type: archive
        url: https://github.com/nonbili/meron/archive/refs/tags/v0.1.9.tar.gz
        sha256: c37e252f70ed1fcaed4136268b5aa0e5658c3ccf68621ec08d34d350ef43bf1f

      - type: archive
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.1/bun-linux-x64.zip
        sha256: 400824c82bfcc0854365bcada11cf53d7384ecb1e2c3da0e2c0a2c6a527d5629
        dest: bin
        only-arches: [x86_64]

      - type: archive
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.1/bun-linux-aarch64.zip
        sha256: 65666a18439e891e5751b666103fe591a8519f11b66ec4bd8654c5515d4fff8a
        dest: bin
        only-arches: [aarch64]

      - type: file
        path: yarn.lock
        dest: frontend

      - cargo-sources.json
      - go-sources.yml
      - yarn-sources.json
