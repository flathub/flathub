# Flatpak manifest for Mariner — generated by `node-gtk flatpak`.
# Flathub submission manifest: sources are fetched from the release tarball.
# Reference: doc/bundling.md. Regenerate rather than editing where possible;
# persistent settings (finish-args etc.) belong in package.json "bundle".
app-id: io.github.romgrk.mariner
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node26
command: io.github.romgrk.mariner
finish-args:
  - '--socket=wayland'
  - '--socket=fallback-x11'
  - '--share=ipc'
  - '--device=dri'
  - '--filesystem=host'
modules:
  - name: mariner
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node26/bin
    build-commands:
      # the app: staged offline by `node-gtk flatpak` (files + production
      # node_modules); nothing is fetched from npm here
      - mkdir -p /app/main && cp -a app/. /app/main/
      # the node-gtk addon, compiled against the runtime's GTK
      - 'cd /app/main/node_modules/node-gtk && B=$PWD/lib/binding/node-v$(node -p process.versions.modules)-linux-$(node -p process.arch) && node /usr/lib/sdk/node26/lib/node_modules/npm/node_modules/node-gyp/bin/node-gyp.js rebuild --nodedir=/usr/lib/sdk/node26 -- -Dmodule_name=node_gtk -Dmodule_path=$B && rm -rf build src binding.gyp ../nan'
      # the node runtime (the Platform does not ship one)
      - install -Dm755 /usr/lib/sdk/node26/bin/node /app/bin/node
      # launcher + desktop integration
      - install -Dm755 launcher.sh /app/bin/io.github.romgrk.mariner
      - install -Dm644 io.github.romgrk.mariner.desktop /app/share/applications/io.github.romgrk.mariner.desktop
      - install -Dm644 io.github.romgrk.mariner.metainfo.xml /app/share/metainfo/io.github.romgrk.mariner.metainfo.xml
      - 'mkdir -p /app/share/icons && cp -a icons/. /app/share/icons/'
    sources:
      - type: archive
        url: https://github.com/romgrk/mariner/releases/download/v0.0.1/Mariner-0.0.1-flatpak-src.tar.gz
        sha256: d7cdd52659caf26d4ccd88d2193c1df063351a55a3895e4cb35caa465f65efac
