app-id: io.github.watereverywhere.TrayNotepad
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: main.py
finish-args:
  - --socket=x11
  - --share=ipc
  - --filesystem=~/.local/share/tray-notepad:create
modules:
  - name: tray-notepad
    buildsystem: simple
    build-commands:
      - install -D main.py /app/bin/main.py
      - chmod +x /app/bin/main.py
    sources:
      - type: file
        path: src/main.py
