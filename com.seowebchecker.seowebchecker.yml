app-id: com.seowebchecker.seowebchecker
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: seowebchecker
finish-args:
  - --share=network
  - --filesystem=home

modules:
  - name: nodejs
    buildsystem: simple
    build-commands:
      - cp -a * /app/
    sources:
      - type: archive
        url: https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.xz
        sha256: 4543670b589593f8fa5f106111fd5139081da42bb165a9239f05195e405f240a
        only-arches: [x86_64]
      - type: archive
        url: https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-arm64.tar.xz
        sha256: a9ce85675ba33f00527f6234d90000946c0936fb4fca605f1891bb5f4fe6fb0a
        only-arches: [aarch64]

  - name: seowebchecker
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/node_modules/seowebchecker
      - cp -r * /app/lib/node_modules/seowebchecker/
      - mkdir -p /app/bin
      - ln -s /app/lib/node_modules/seowebchecker/bin/cli.js /app/bin/seowebchecker
      - ln -s /app/lib/node_modules/seowebchecker/bin/cli.js /app/bin/seowebchecker-audit
      - install -Dm644 com.seowebchecker.seowebchecker.desktop /app/share/applications/com.seowebchecker.seowebchecker.desktop
      - install -Dm644 com.seowebchecker.seowebchecker.metainfo.xml /app/share/metainfo/com.seowebchecker.seowebchecker.metainfo.xml
      - install -Dm644 com.seowebchecker.seowebchecker.png /app/share/icons/hicolor/128x128/apps/com.seowebchecker.seowebchecker.png
    sources:
      - type: archive
        url: https://registry.npmjs.org/seowebchecker-seoaudit-sdk/-/seowebchecker-seoaudit-sdk-1.0.1.tgz
        sha256: 1f7844c86c6287fcaa7a149508f353deea5d3cdf24b8778704fa784e1d1f2c51
      - type: file
        path: com.seowebchecker.seowebchecker.desktop
      - type: file
        path: com.seowebchecker.seowebchecker.metainfo.xml
      - type: file
        path: com.seowebchecker.seowebchecker.png
