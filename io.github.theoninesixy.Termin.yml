app-id: io.github.theoninesixy.Termin
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: termin

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=all
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=ca.desrt.dconf
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --filesystem=xdg-data/fonts:ro
  - --filesystem=~/.local/share/fonts:ro
  - --filesystem=host

modules:
  - name: vte
    buildsystem: meson
    config-opts:
      - -Dgtk3=false
      - -Dgtk4=true
      - -Dvapi=false
      - -Dgir=true
      - -Ddocs=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/vte.git
        tag: 0.78.3
        commit: 6f293fa50a52c79a47642875a534dacaf3913a55

  - name: termin
    buildsystem: simple
    build-commands:
      - install -Dm755 app.py /app/bin/termin
      - install -Dm644 io.github.theoninesixy.Termin.desktop /app/share/applications/io.github.theoninesixy.Termin.desktop
      - install -Dm644 io.github.theoninesixy.Termin.metainfo.xml /app/share/metainfo/io.github.theoninesixy.Termin.metainfo.xml
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/io.github.theoninesixy.Termin.svg
    sources:
      - type: file
        path: app.py
      - type: file
        path: io.github.theoninesixy.Termin.desktop
      - type: file
        path: io.github.theoninesixy.Termin.metainfo.xml
      - type: file
        path: icon.svg