app-id: io.github.theoninesixy.Termin
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: termin

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: host-spawn
    buildsystem: simple
    build-commands:
      - install -Dm755 host-spawn /app/bin/host-spawn
    sources:
      - type: file
        url: https://github.com/1player/host-spawn/releases/download/v1.6.2/host-spawn-x86_64
        sha256: 077bc09a087292447ba17cfe2156a93f71bf56c4c6be8e38d3abe65c1240f34c
        dest-filename: host-spawn
        only-arches: [x86_64]
      - type: file
        url: https://github.com/1player/host-spawn/releases/download/v1.6.2/host-spawn-aarch64
        sha256: 8b30215b0b6b66c8c34a3e22d372dd39020295cd0904608bc2c5f5ecff829e5f
        dest-filename: host-spawn
        only-arches: [aarch64]

  - name: vte
    buildsystem: meson
    config-opts:
      - -Dgtk3=false
      - -Dgtk4=true
      - -Dvapi=false
      - -Dgir=true
      - -Ddocs=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/vte.git
        tag: 0.78.3
        commit: 6f293fa50a52c79a47642875a534dacaf3913a55

  - name: termin
    buildsystem: simple
    build-commands:
      - install -Dm755 app.py /app/bin/termin
      - install -Dm644 io.github.theoninesixy.Termin.desktop /app/share/applications/io.github.theoninesixy.Termin.desktop
      - install -Dm644 io.github.theoninesixy.Termin.metainfo.xml /app/share/metainfo/io.github.theoninesixy.Termin.metainfo.xml
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/io.github.theoninesixy.Termin.svg
    sources:
      - type: git
        url: https://github.com/TheOninesixY/Termin.git
        branch: main
