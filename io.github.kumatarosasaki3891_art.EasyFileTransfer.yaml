app-id: io.github.kumatarosasaki3891_art.EasyFileTransfer
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: EasyFileTransfer.Linux

finish-args:
  # Avalonia UI / Wayland / X11
  - --socket=x11
  - --share=ipc
  - --device=dri
  # ネットワーク通信（ローカルWi-Fiでのファイル転送HTTPサーバー動作）
  - --share=network
  # ダウンロードフォルダーへのアクセス（受信ファイルの保存および共有ファイルの読み込み）
  - --filesystem=xdg-download
  # ポータル連携（ファイル選択ダイアログ、既定アプリでのフォルダー/ファイル起動）
  #- --talk-name=org.freedesktop.portal.Desktop

sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10

build-options:
  prepend-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  prepend-pkg-config-path: /usr/lib/sdk/dotnet10/lib/pkgconfig
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

modules:
  - name: easyfiletransfer
    buildsystem: simple
    build-commands:
      # 事前取得した NuGet パッケージ（nuget-sources）を参照して自己完結バイナリを発行
      - dotnet publish EasyFileTransfer.Linux/EasyFileTransfer.Linux.csproj -c Release -r linux-x64 --self-contained true --source ./nuget-sources -o /app/lib/EasyFileTransfer

      # 起動コマンド (/app/bin/EasyFileTransfer.Linux) のシンボリックリンク作成
      - install -d /app/bin
      - ln -s /app/lib/EasyFileTransfer/EasyFileTransfer.Linux /app/bin/EasyFileTransfer.Linux

      # .desktop ファイルのインストール
      - install -Dm644 io.github.kumatarosasaki3891_art.EasyFileTransfer.desktop /app/share/applications/io.github.kumatarosasaki3891_art.EasyFileTransfer.desktop

      # metainfo.xml のインストール
      - install -Dm644 io.github.kumatarosasaki3891_art.EasyFileTransfer.metainfo.xml /app/share/metainfo/io.github.kumatarosasaki3891_art.EasyFileTransfer.metainfo.xml

      # アプリアイコン (256x256) のインストール
      - install -Dm644 EasyFileTransfer.Linux/Assets/title_icon.png /app/share/icons/hicolor/256x256/apps/io.github.kumatarosasaki3891_art.EasyFileTransfer.png

    sources:
      # Flathub 審査・本番ビルド用（タグおよびコミットSHA固定）
      - type: git
        url: https://github.com/kumatarosasaki3891-art/EasyFileTransfer.git
        tag: v1.1.0
        commit: 7a4f82fbe7fe018d3f3aef211f6aadbce1819275
      # オフラインビルド用 NuGet パッケージ定義
      - nuget-sources.json
