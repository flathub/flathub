id: it.vaillant86.Forma
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: Forma
finish-args:
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0

modules:
  - name: godot-runtime
    buildsystem: simple
    build-commands:
      # Rinominiamo e installiamo il template di esportazione come binario principale del gioco
      - install -Dm755 godot-linux-template /app/bin/Forma-bin
    sources:
      - type: file
        url: https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
        dest-filename: templates.zip
        sha256: d241901c80f4f9d45e75da621379963e6ef82db45bf4c329b35da3c23315998f
      - type: shell
        commands:
          # Estraiamo solo il binario standard per Linux a 64-bit dai template ufficiali
          - unzip templates.zip templates/linux_release.x86_64
          - mv templates/linux_release.x86_64 godot-linux-template

  - name: forma
    buildsystem: simple
    build-commands:
      # Creiamo una cartella temporanea per preparare l'esportazione dei file
      - mkdir -p /app/share/forma/
      - cp -r * /app/share/forma/
      
      # Creiamo lo script di avvio che lancia il runtime di Godot puntando alla cartella del progetto
      - echo -e '#!/bin/sh\nexec /app/bin/Forma-bin --main-pack /app/share/forma' > /app/bin/Forma
      - chmod +x /app/bin/Forma
      
      # Installiamo metadati, desktop entry e icone
      - install -Dm644 flatpak-assets/it.vaillant86.Forma.desktop /app/share/applications/it.vaillant86.Forma.desktop
      - install -Dm644 flatpak-assets/it.vaillant86.Forma.metainfo.xml /app/share/metainfo/it.vaillant86.Forma.metainfo.xml
      - install -Dm644 flatpak-assets/it.vaillant86.Forma.png /app/share/icons/hicolor/512x512/apps/it.vaillant86.Forma.png
    sources:
      - type: git
        url: https://github.com/vaillant86/forma.git
        tag: main
