id: io.github.agstweb.indiepopradio
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: indiepop-radio
finish-args:
  - --share=network
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: audio-app
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/agstweb/indiepopradio/archive/refs/tags/v1.3.7.tar.gz
        sha256: cbef33e97fd6522bcfc3810d1ba332ffd0c477d8d12255a7e8062a7122552752
    build-commands:
      - make
      - make install PREFIX=/app
