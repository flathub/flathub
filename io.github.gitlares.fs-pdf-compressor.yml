app-id: io.github.gitlares.fs-pdf-compressor
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: fs-pdf-compressor

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=xdg-documents:rw

modules:
  - name: ghostscript
    buildsystem: autotools
    config-opts:
      - --disable-cups
      - --disable-gtk
    sources:
      - type: archive
        url: https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10071/ghostscript-10.07.1.tar.gz
        sha256: 2fc74362f9be6fae1b0a65d38fdcfd4f0b518cc3b07c5581fb661eb4d2e15251

  - name: fs-pdf-compressor
    buildsystem: simple
    build-commands:
      - install -d /app/lib/fs-pdf-compressor
      - cp -a fs_pdf_compressor linux_app.py assets /app/lib/fs-pdf-compressor/
      - install -Dm755 fs-pdf-compressor /app/bin/fs-pdf-compressor
      - install -Dm644 io.github.gitlares.fs-pdf-compressor.desktop /app/share/applications/io.github.gitlares.fs-pdf-compressor.desktop
      - install -Dm644 io.github.gitlares.fs-pdf-compressor.metainfo.xml /app/share/metainfo/io.github.gitlares.fs-pdf-compressor.metainfo.xml
      - install -Dm644 io.github.gitlares.fs-pdf-compressor.png /app/share/icons/hicolor/512x512/apps/io.github.gitlares.fs-pdf-compressor.png
      - install -Dm644 LICENSE /app/share/licenses/io.github.gitlares.fs-pdf-compressor/LICENSE
    sources:
      - type: git
        url: https://github.com/gitlares/fs-pdf-compressor.git
        tag: v1.0.9
        commit: c5cf6dccbc3989b7bc3350c54e421079f5a42643
      - type: patch
        path: flatpak-disable-updates.patch
      - type: file
        path: fs-pdf-compressor
      - type: file
        path: io.github.gitlares.fs-pdf-compressor.desktop
      - type: file
        path: io.github.gitlares.fs-pdf-compressor.metainfo.xml
      - type: file
        path: io.github.gitlares.fs-pdf-compressor.png
