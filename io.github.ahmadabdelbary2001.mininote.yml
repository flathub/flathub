app-id: io.github.ahmadabdelbary2001.mininote

runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk

command: mininotes

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: mininotes

    buildsystem: cmake-ninja

    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DMININOTES_BUILD_TESTS=OFF
      - -DMININOTES_PACKAGE=ON
      - -DMININOTES_FLATPAK=ON

    sources:
      - type: git
        url: https://github.com/ahmadabdelbary2001/mininote.git
        commit: 6cc6c7c3b73825e8ffae2c5efee946cf1a53a6cb
        tag: v0.2.11
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
