  - name: kiptv
    buildsystem: simple
    build-commands:
      - install -Dm755 flatpak/kiptv.sh /app/bin/kiptv
      - install -d /app/share/kiptv
      - cp -r backend qml main.py BreezeDark.colors /app/share/kiptv/
      # Compile .ts → .qm so the QTranslator at runtime can load them.
      # `|| true` keeps the build going if a particular .ts is malformed;
      # the app falls back to English if its .qm isn't there.
      - install -d /app/share/kiptv/translations
      - |
        for ts in translations/*.ts; do
          [ -f "$ts" ] || continue
          out="/app/share/kiptv/translations/$(basename "${ts%.ts}").qm"
          pyside6-lrelease "$ts" -qm "$out" || true
        done
      - install -Dm644 flatpak/org.codeberg.marquisdesade.kiptv.desktop
          /app/share/applications/org.codeberg.marquisdesade.kiptv.desktop
      - install -Dm644 flatpak/org.codeberg.marquisdesade.kiptv.metainfo.xml
          /app/share/metainfo/org.codeberg.marquisdesade.kiptv.metainfo.xml
      - install -Dm644 flatpak/org.codeberg.marquisdesade.kiptv.svg
          /app/share/icons/hicolor/scalable/apps/org.codeberg.marquisdesade.kiptv.svg
    sources:
      - type: git
        url: https://codeberg.org/marquisdesade/kiptv.git
        tag: v0.7.0
        commit: 19494092f998c1c790a9fbfd8a421b5cfd6594e1
