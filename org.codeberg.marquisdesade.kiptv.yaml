# Flathub submission manifest — identical to the in-repo development
# manifest except the app source is the v0.7.0 git tag and the Python
# dependencies are pinned PyPI wheels instead of a local wheel dir.
app-id: org.codeberg.marquisdesade.kiptv
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.10'
command: kiptv
separate-locales: false

build-options:
  env:
    PYTHONDONTWRITEBYTECODE: '1'

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.portal.Desktop
  - --env=QML_IMPORT_PATH=/usr/lib/qml

modules:

  - name: jinja2
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-build-isolation --ignore-installed jinja2-3.1.6-py3-none-any.whl MarkupSafe-3.0.2-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
