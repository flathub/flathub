app-id: in.courseways.StudyAndRevisionPlanner
branch: beta
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '23.08'
command: run.sh
separate-locales: false

finish-args:
  # Network access for Firebase/Supabase
  - --share=network
  # Display servers
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  # Audio/Video
  - --socket=pulseaudio
  - --device=dri
  # File system
  - --filesystem=xdg-documents

modules:
  - name: study-planner
    buildsystem: simple
    build-commands:
      - install -Dm755 run.sh /app/bin/run.sh
      - chmod +x app.AppImage
      - ./app.AppImage --appimage-extract
      - cp -r squashfs-root/* /app/bin/
      - rm -rf squashfs-root
    sources:
      # TODO: Update this URL to point to your Cloudflare R2 direct download link for the AppImage
      # Flathub needs this to download the binary.
      - type: file
        url: "https://pub-cb6f114918184c04ad1f56d2a0d93ea8.r2.dev/v1.0.10/Study%20and%20Revision%20Spaced%20Repetition-1.0.10.AppImage"
        sha256: "174ec8741f57b9a79ab415f758427aa7880acbe56d1b00c427d187c37cc9ecf9"
        dest-filename: app.AppImage
      - type: script
        dest-filename: run.sh
        commands:
          # Electron apps require zypak-wrapper to run their internal Chromium sandbox inside a Flatpak sandbox.
          # Change "study-revision-planner" below to the exact name of the executable inside your extracted AppImage
          - zypak-wrapper /app/bin/study-revision-planner "$@"
      - type: file
        path: in.courseways.StudyAndRevisionPlanner.desktop
      - type: file
        path: in.courseways.StudyAndRevisionPlanner.metainfo.xml
      - type: file
        path: in.courseways.StudyAndRevisionPlanner.png

    post-install:
      - install -Dm644 in.courseways.StudyAndRevisionPlanner.desktop /app/share/applications/in.courseways.StudyAndRevisionPlanner.desktop
      - install -Dm644 in.courseways.StudyAndRevisionPlanner.metainfo.xml /app/share/metainfo/in.courseways.StudyAndRevisionPlanner.metainfo.xml
      - install -Dm644 in.courseways.StudyAndRevisionPlanner.png /app/share/icons/hicolor/512x512/apps/in.courseways.StudyAndRevisionPlanner.png
