id: me.proton.Authenticator
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: proton-authenticator
rename-desktop-file: Proton Authenticator.desktop
rename-icon: proton-authenticator

finish-args:
  - --device=dri

  - --share=network

  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: proton-authenticator
    buildsystem: simple
    build-commands:
      - cp -r ./bin ./share -t /app
      - install -D -m 644 me.proton.Authenticator.metainfo.xml -t /app/share/metainfo
    sources:
      - type: file
        path: me.proton.Authenticator.metainfo.xml

      - type: archive
        only-arches: [x86_64]
        url: https://proton.me/download/authenticator/linux/ProtonAuthenticator-1.1.6-1.x86_64.rpm
        sha256: 844c80851e7d2cbe41d18ab9913d5010d19459bea4c8ce773d34bf33a27a3d36
