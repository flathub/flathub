app-id: io.github.shafayeatt1995.XorinPlayer
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: xorin-player

finish-args:
  # Display & Windowing
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Audio
  - --socket=pulseaudio
  # Media Filesystem access
  - --filesystem=host:ro
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-download:ro

modules:
  - name: xorin-player
    buildsystem: simple
    build-commands:
      # Binary
      - install -Dm755 xorin-player /app/bin/xorin-player
      # Desktop file
      - install -Dm644 io.github.shafayeatt1995.XorinPlayer.desktop /app/share/applications/io.github.shafayeatt1995.XorinPlayer.desktop
      # AppStream Metadata
      - install -Dm644 io.github.shafayeatt1995.XorinPlayer.metainfo.xml /app/share/metainfo/io.github.shafayeatt1995.XorinPlayer.metainfo.xml
      # Icon
      - install -Dm644 icon_512.png /app/share/icons/hicolor/512x512/apps/io.github.shafayeatt1995.XorinPlayer.png
    sources:
      - type: archive
        url: https://github.com/shafayeatt1995/music_player/releases/download/v1.0.0/xorin-player-linux-x86_64.tar.gz
        sha256: 3fc06e5da780824cf40762cf1d5a7114c000ff9f925fdbca15f8ba5938d22359
        only-arches: [x86_64]
      - type: file
        path: io.github.shafayeatt1995.XorinPlayer.desktop
      - type: file
        path: io.github.shafayeatt1995.XorinPlayer.metainfo.xml
      - type: file
        path: icon_512.png
