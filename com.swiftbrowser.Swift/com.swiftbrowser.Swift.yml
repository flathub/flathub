app-id: com.swiftbrowser.Swift
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: swift-browser
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --env=ELECTRON_DISABLE_SANDBOX=1

modules:
  - name: swift-browser
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/swift-browser
      - cp -a swift-browser-linux-x64/. /app/lib/swift-browser/ 2>/dev/null || true
      - cp -a swift-browser-linux-arm64/. /app/lib/swift-browser/ 2>/dev/null || true
      - install -Dm755 swift-browser-wrapper /app/bin/swift-browser
      - install -Dm644 com.swiftbrowser.Swift.desktop /app/share/applications/com.swiftbrowser.Swift.desktop
      - install -Dm644 com.swiftbrowser.Swift.metainfo.xml /app/share/metainfo/com.swiftbrowser.Swift.metainfo.xml
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/com.swiftbrowser.Swift.png
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/com.swiftbrowser.Swift.png
    sources:
      - type: archive
        url: https://github.com/404henryyynotfound/swift-browser/releases/download/v1.0.0/swift-browser-linux-x64.tar.gz
        sha256: SHA256_X64
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/404henryyynotfound/swift-browser/releases/download/v1.0.0/swift-browser-linux-arm64.tar.gz
        sha256: SHA256_ARM64
        only-arches:
          - aarch64
      - type: file
        path: swift-browser-wrapper
      - type: file
        path: com.swiftbrowser.Swift.desktop
      - type: file
        path: com.swiftbrowser.Swift.metainfo.xml
      - type: file
        path: icon-128.png
      - type: file
        path: icon-256.png
