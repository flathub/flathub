id: org.freedesktop.Sdk.Extension.ghc914
branch: '25.08'
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
build-extension: true
sdk: org.freedesktop.Sdk
separate-locales: false
build-options:
  prefix: /usr/lib/sdk/ghc914
modules:
  - name: ghc
    buildsystem: autotools
    make-args:
      - install
    sources:
      - type: archive
        only-arches:
          - aarch64
        url: https://downloads.haskell.org/ghc/9.14.1/ghc-9.14.1-aarch64-deb12-linux.tar.xz
        sha256: 6aa27a377451851c851eefdd869e8f5a9217b02ce66c6ca9b418b72efee28427
      - type: archive
        only-arches:
          - x86_64
        url: https://downloads.haskell.org/ghc/9.14.1/ghc-9.14.1-x86_64-deb12-linux.tar.xz
        sha256: 60f7ab75f28df892729fbaff3a54f58ee3ad7e731929f1b2f3eb0208f73de841
    no-make-install: true

  - name: libtinfo
    buildsystem: simple
    build-commands:
      - ./configure --with-shared --without-normal --without-debug --without-cxx-binding
        --without-ada --without-progs --without-tests --without-manpages --with-termlib=tinfo
        --with-versioned-syms
      - make -C include
      - make -C ncurses -j${FLATPAK_BUILDER_N_JOBS}
      - libdir=$(echo ${FLATPAK_DEST}/lib/ghc-*/lib/*-linux-ghc-*/) && test -d "$libdir"
        && cp -P lib/libtinfo.so.6* "$libdir"
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/ncurses/ncurses-6.6.tar.gz
        sha256: 355b4cbbed880b0381a04c46617b7656e362585d52e9cf84a67e2009b749ff11

  - name: cabal
    buildsystem: simple
    sources:
      - type: archive
        only-arches:
          - aarch64
        url: https://downloads.haskell.org/cabal/cabal-install-3.18.2.0/cabal-install-3.18.2.0-aarch64-linux-unknown.tar.xz
        strip-components: 0
        sha256: e4d940131ab0b78943a4b5ce64a9ef5acc452ea849df197787eaeecb1c3bf276
      - type: archive
        only-arches:
          - x86_64
        url: https://downloads.haskell.org/cabal/cabal-install-3.18.2.0/cabal-install-3.18.2.0-x86_64-linux-unknown.tar.xz
        strip-components: 0
        sha256: b4f4c83135da77cfc18ccd6056398ca714a2dad86d5f635621ffdda8f9afe587
    build-commands:
      - install -Dm755 ./cabal -t ${FLATPAK_DEST}/bin/

  - name: scripts
    buildsystem: simple
    sources:
      - type: script
        commands:
          - export PATH=$PATH:/usr/lib/sdk/ghc914/bin
        dest-filename: enable.sh
    build-commands:
      - install -Dm755 enable.sh -t ${FLATPAK_DEST}/

  - name: metainfo
    buildsystem: simple
    build-commands:
      - install -Dm644 org.freedesktop.Sdk.Extension.ghc914.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.ghc914.metainfo.xml
