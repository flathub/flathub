app-id: io.github.SitholeWB.TradingPlatform
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: trading-platform-wrapper
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri

modules:
  - name: trading-platform
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - mkdir -p /app/main
      - cp -r linux-unpacked/* /app/main/
      - chmod +x /app/main/trading-platform
      - chmod +x /app/main/resources/backend/TradingPlatform.Api
      - install -Dm755 run.sh /app/bin/trading-platform-wrapper
      - install -Dm644 io.github.SitholeWB.TradingPlatform.desktop /app/share/applications/io.github.SitholeWB.TradingPlatform.desktop
      - install -Dm644 io.github.SitholeWB.TradingPlatform.metainfo.xml /app/share/metainfo/io.github.SitholeWB.TradingPlatform.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.SitholeWB.TradingPlatform.png
    sources:
      - type: archive
        url: https://github.com/SitholeWB/trading-platform/releases/download/v2.0.1/trading-platform-2.0.1-linux-x64.tar.gz
        sha256: 3fe68065647c48e18d0b964e5258f76d9f8e78e6074b99324a8b94afc76b568a
        strip-components: 0
        only-arches:
          - x86_64
      - type: file
        path: run.sh
      - type: file
        path: io.github.SitholeWB.TradingPlatform.desktop
      - type: file
        path: io.github.SitholeWB.TradingPlatform.metainfo.xml
