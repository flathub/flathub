app-id: studio.screenix.Screenix
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
tags:
  - proprietary

command: screenix-gui

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  - --share=network
  - --device=all
  - --filesystem=/sys/class/video4linux:ro
  - --persist=.config/screenix
  - --filesystem=xdg-videos:create
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.gnome.Mutter.DisplayConfig
  - --talk-name=studio.screenix.CursorBridge

modules:

  - name: wf-recorder
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/ammen99/wf-recorder.git
        tag: v0.6.0
        commit: ca103be2473db0983baf74e17b291385c3c79d79

  - name: grim
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/emersion/grim.git
        tag: v1.4.1
        commit: 1f79ee93928a8c4fe583166ee833dce76f311f6d

  - name: wlr-randr
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/emersion/wlr-randr.git
        tag: v0.5.0
        commit: 4e239ef2317235d35b2693a55efadc23153a037a

  - name: xinput
    buildsystem: autotools
    cleanup:
      - /share/man
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/xorg/app/xinput.git
        tag: xinput-1.6.4
        commit: b6092488058da39754ece13475aab53616397af7

  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: pipewire
    buildsystem: meson
    config-opts:
      - -Ddocs=disabled
      - -Dman=disabled
      - -Dexamples=disabled
      - -Dtest=disabled
      - -Dinstalled_tests=disabled
      - -Dgstreamer=disabled
      - -Dgstreamer-device-provider=disabled
      - -Dlibsystemd=disabled
      - -Dlogind=disabled
      - -Dsystemd-system-service=disabled
      - -Dsystemd-user-service=disabled
      - -Dpipewire-alsa=disabled
      - -Dpipewire-jack=disabled
      - -Dpipewire-v4l2=disabled
      - -Dalsa=disabled
      - -Djack=disabled
      - -Dlibpulse=disabled
      - -Dv4l2=disabled
      - -Dbluez5=disabled
      - -Dffmpeg=disabled
      - -Dlibcamera=disabled
      - -Dsession-managers=[]
      - -Dudev=disabled
      - -Davahi=disabled
      - -Dsdl2=disabled
      - -Dsndfile=disabled
      - -Dpw-cat=disabled
      - -Dx11=disabled
      - -Dx11-xfixes=disabled
      - -Draop=disabled
      - -Dlv2=disabled
      - -Decho-cancel-webrtc=disabled
      - -Dlibusb=disabled
      - -Droc=disabled
      - -Dopus=disabled
      - -Debur128=disabled
      - -Dfftw=disabled
      - -Donnxruntime=disabled
      - -Dlibmysofa=disabled
      - -Dselinux=disabled
      - -Davb=disabled
      - -Drlimits-install=false
      - -Dpam-defaults-install=false
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/pipewire/pipewire.git
        tag: 1.6.2
        commit: 95da54a482b68475958bbc3fa572a9c20df0df74

  - name: screenix
    buildsystem: simple

    build-commands:
      - install -Dm644 studio.screenix.Screenix.desktop
          /app/share/applications/studio.screenix.Screenix.desktop
      - install -Dm644 studio.screenix.Screenix.metainfo.xml
          /app/share/metainfo/studio.screenix.Screenix.metainfo.xml
      - install -Dm644 icon-256.png
          /app/share/icons/hicolor/256x256/apps/studio.screenix.Screenix.png
      - install -Dm755 apply_extra /app/bin/apply_extra
      - ln -s /app/extra/usr/bin/screenix-gui /app/bin/screenix-gui

    sources:
      - type: file
        path: studio.screenix.Screenix.desktop
      - type: file
        path: studio.screenix.Screenix.metainfo.xml
      - type: file
        path: icons/256x256.png
        dest-filename: icon-256.png
      - type: script
        dest-filename: apply_extra
        commands:
          - bsdtar --to-stdout -xf screenix.deb 'data.tar.*' | bsdtar -xf -
          - rm screenix.deb
      - type: extra-data
        filename: screenix.deb
        only-arches:
          - x86_64
        url: https://github.com/mathisdev7/screenix-releases/releases/download/v1.1.7/Screenix_1.1.7_amd64.deb
        sha256: d9123a2ea7f964e3bb235bce12996cb6fdad23fdcb8c392eedfa0e01f7ee5e40
        size: 19544824
