app-id: my.hamradio.HamClock
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: hamclock

finish-args:
  - --share=ipc
  - --socket=x11
  - --share=network
  - --device=all
  - --filesystem=~/.hamclock:create

modules:
  - name: esphamclock
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib/hamclock /app/share/applications /app/share/icons/hicolor/128x128/apps /app/share/metainfo /app/share/man/man1
      - install -m 755 packaging/hamclock-launcher.sh /app/bin/hamclock
      - install -m 644 flatpak/my.hamradio.HamClock.desktop /app/share/applications/
      - install -m 644 flatpak/my.hamradio.HamClock.png /app/share/icons/hicolor/128x128/apps/
      - install -m 644 flatpak/my.hamradio.HamClock.metainfo.xml /app/share/metainfo/
      - gzip -c deploy/hamclock.1 > /app/share/man/man1/hamclock.1.gz
      - make clean && make hamclock-800x480 -j$FLATPAK_BUILDER_N_JOBS && cp hamclock-800x480 /app/lib/hamclock/
      - make clean && make hamclock-1600x960 -j$FLATPAK_BUILDER_N_JOBS && cp hamclock-1600x960 /app/lib/hamclock/
      - make clean && make hamclock-2400x1440 -j$FLATPAK_BUILDER_N_JOBS && cp hamclock-2400x1440 /app/lib/hamclock/
      - make clean && make hamclock-3200x1920 -j$FLATPAK_BUILDER_N_JOBS && cp hamclock-3200x1920 /app/lib/hamclock/
      - make clean && make hamclock-web-800x480 -j$FLATPAK_BUILDER_N_JOBS && cp hamclock-web-800x480 /app/lib/hamclock/
      - make clean && make hamclock-web-1600x960 -j$FLATPAK_BUILDER_N_JOBS && cp hamclock-web-1600x960 /app/lib/hamclock/
    sources:
      - type: git
        url: https://github.com/9M2PJU/9M2PJU-HamClock-Installer.git
        tag: v4.29
        commit: 2af0def9f2f3293dae918728de9d7d2786a89fea
