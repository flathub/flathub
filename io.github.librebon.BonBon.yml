id: io.github.librebon.BonBon
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: bonbon
finish-args:
  # Wayland first, X11 only as a fallback (not both --socket=x11 and wayland).
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU rendering. Do not use --device=all.
  - --device=dri
  # Graphics tablet / stylus via /dev/input. Requires Flatpak 1.16+.
  - --device=input
  - --require-version=1.16.0
  # File open/save goes through the portal. These XDG dirs cover the usual
  # places an image editor reads and writes without granting $HOME.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - /share/pkgconfig
  - "*.a"
  - "*.la"
  - /bin/patchelf
  - /bin/4channels
  - /bin/dcraw_emu
  - /bin/dcraw_half
  - /bin/half_mt
  - /bin/mem_image
  - /bin/multirender_test
  - /bin/postprocessing_benchmark
  - /bin/raw-identify
  - /bin/rawtextdump
  - /bin/simple_dcraw
  - /bin/unprocessed_raw
  - /bin/libdeflate-gunzip
  - /bin/libdeflate-gzip
  - /bin/zopfli
  - /bin/zopflipng

modules:
  - name: imath
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://github.com/AcademySoftwareFoundation/Imath/archive/refs/tags/v3.1.12.tar.gz
        sha256: 8a1bc258f3149b5729c2f4f8ffd337c0e57f09096e4ba9784329f40c4a9035da
        dest-filename: Imath-3.1.12.tar.gz
        x-checker-data:
          type: anitya
          project-id: 18321
          stable-only: true
          url-template: https://github.com/AcademySoftwareFoundation/Imath/archive/refs/tags/v$version.tar.gz


  - name: libdeflate
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DLIBDEFLATE_BUILD_SHARED_LIB=ON
      - -DLIBDEFLATE_BUILD_STATIC_LIB=OFF
    sources:
      - type: archive
        url: https://github.com/ebiggers/libdeflate/archive/refs/tags/v1.18.tar.gz
        sha256: 225d982bcaf553221c76726358d2ea139bb34913180b20823c782cede060affd
        dest-filename: libdeflate-1.18.tar.gz
        x-checker-data:
          type: anitya
          project-id: 235194
          stable-only: true
          url-template: https://github.com/ebiggers/libdeflate/archive/refs/tags/v$version.tar.gz

  - name: openexr
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TESTING=OFF
      - -DOPENEXR_BUILD_TOOLS=OFF
      - -DOPENEXR_INSTALL_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://github.com/AcademySoftwareFoundation/openexr/archive/refs/tags/v3.2.4.tar.gz
        sha256: 81e6518f2c4656fdeaf18a018f135e96a96e7f66dbe1c1f05860dd94772176cc
        dest-filename: openexr-3.2.4.tar.gz
        x-checker-data:
          type: anitya
          project-id: 120
          stable-only: true
          url-template: https://github.com/AcademySoftwareFoundation/openexr/archive/refs/tags/v$version.tar.gz

  - name: libraw
    config-opts:
      - --disable-static
      - --enable-shared
    sources:
      - type: archive
        url: https://www.libraw.org/data/LibRaw-0.21.4.tar.gz
        sha256: 6be43f19397e43214ff56aab056bf3ff4925ca14012ce5a1538a172406a09e63
        x-checker-data:
          type: anitya
          project-id: 1805
          stable-only: true
          url-template: https://www.libraw.org/data/LibRaw-$version.tar.gz

  - name: libimagequant
    buildsystem: simple
    build-commands:
      - ./configure --prefix=${FLATPAK_DEST} --with-openmp=no
      - make -j$FLATPAK_BUILDER_N_JOBS shared
      - make PREFIX=${FLATPAK_DEST} install
    sources:
      - type: archive
        url: https://github.com/ImageOptim/libimagequant/archive/2.18.0.tar.gz
        sha256: 790d2593a587f9a27cec6245ee7a212b34b0aa63cac6383e550eda01236be636
        dest-filename: libimagequant-2.18.0.tar.gz

  - name: zopfli
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SHARED_LIBS=ON
      - -DZOPFLI_BUILD_SHARED=ON
    post-install:
      - mkdir -p ${FLATPAK_DEST}/include/zopfli
      - mv ${FLATPAK_DEST}/include/zopflipng_lib.h ${FLATPAK_DEST}/include/zopfli/
      - mv ${FLATPAK_DEST}/include/zopfli.h ${FLATPAK_DEST}/include/zopfli/
    sources:
      - type: archive
        url: https://github.com/google/zopfli/archive/refs/tags/zopfli-1.0.3.tar.gz
        sha256: e955a7739f71af37ef3349c4fa141c648e8775bceb2195be07e86f8e638814bd
        dest-filename: zopfli-1.0.3.tar.gz


  # Build-time only: CMake uses patchelf to rename the vendored mozjpeg/jpegli
  # SONAMEs (liblw-mozjpeg.so / liblw-jpegli.so). Removed from the final
  # /app by cleanup.
  - name: patchelf
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/NixOS/patchelf/releases/download/0.19.3/patchelf-0.19.3.tar.gz
        sha256: fac76a3c0b730e8d53ea1d10cd6015322d78c9900af91736f2cca51d5837b612
        x-checker-data:
          type: json
          url: https://api.github.com/repos/NixOS/patchelf/releases/latest
          version-query: .tag_name
          url-query: '"https://github.com/NixOS/patchelf/releases/download/" + $version + "/patchelf-" + $version + ".tar.gz"'

  - name: bonbon
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DLW_BRAND=Bonbon
    sources:
      - type: git
        url: https://github.com/librebon/BonBon.git
        tag: bonbon-0.3.37-Linux
        commit: 058d6436d10f09edea6b65cfbbab0912c869da15
