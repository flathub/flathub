app-id: io.github.garrett_webb.terminalpolyominos
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: terminalpolyominos-gui

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib64/pkgconfig
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc

modules:
  - name: fast-float
    buildsystem: cmake-ninja
    config-opts:
      - -DFASTFLOAT_TEST=OFF
    sources:
      - type: archive
        url: https://github.com/fastfloat/fast_float/archive/refs/tags/v8.2.10.tar.gz
        sha256: 76f958dd97b1cf4d8862d1f0986a47d4bdfa8845252bae15ef0f40de3b95961f

  - name: vte
    buildsystem: meson
    config-opts:
      - -Dglade=false
      - -Dgtk3=false
      - -Dgtk4=true
      - -Dvapi=false
      - -Dicu=false
      - -Dgir=false
      - -Ddocs=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/vte/0.80/vte-0.80.5.tar.xz
        sha256: 58a4e00ab5d4a95b4be4dc57b48308deafd72d6839dbbd076648fa353321cc41

  - name: terminalpolyominos
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DTP_BUILD_GUI=ON
    sources:
      - type: git
        url: https://github.com/Garrett-Webb/terminalpolyominos.git
        commit: a99cb9331bce525743b920138a10b705dc00d483
