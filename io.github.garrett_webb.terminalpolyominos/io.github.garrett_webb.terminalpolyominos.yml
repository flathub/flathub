app-id: io.github.garrett_webb.terminalpolyominos
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: terminalpolyominos-gui

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib64/pkgconfig
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

finish-args:
  - --filesystem=xdg-config/tpoly:create
  - --filesystem=xdg-data/tpoly:create
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc

modules:
  - name: fast-float
    buildsystem: cmake-ninja
    config-opts:
      - -DFASTFLOAT_TEST=OFF
    sources:
      - type: archive
        url: https://github.com/fastfloat/fast_float/archive/refs/tags/v8.2.10.tar.gz
        sha256: 76f958dd97b1cf4d8862d1f0986a47d4bdfa8845252bae15ef0f40de3b95961f

  - name: vte
    buildsystem: meson
    config-opts:
      - -Dglade=false
      - -Dgtk3=false
      - -Dgtk4=true
      - -Dvapi=false
      - -Dicu=false
      - -Dgir=false
      - -Ddocs=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/vte/0.80/vte-0.80.5.tar.xz
        sha256: 58a4e00ab5d4a95b4be4dc57b48308deafd72d6839dbbd076648fa353321cc41

  - name: terminalpolyominos
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DTP_BUILD_GUI=ON
    sources:
      - type: git
        url: https://github.com/Garrett-Webb/terminalpolyominos.git
        commit: 71b748a07b4b1a5a072e8942adda7ebdbfec3015
    post-install:
      - install -Dm644 packaging/flatpak/io.github.garrett_webb.terminalpolyominos.desktop
        -t /app/share/applications/
      - install -Dm644 packaging/flatpak/io.github.garrett_webb.terminalpolyominos-terminal.desktop
        -t /app/share/applications/
      - install -Dm644 packaging/flatpak/io.github.garrett_webb.terminalpolyominos.metainfo.xml
        -t /app/share/metainfo/
      - |
        APP_ID=io.github.garrett_webb.terminalpolyominos
        ICON_DIR=packaging/flatpak/icons
        if test -f "$ICON_DIR/${APP_ID}.svg"; then
          install -Dm644 "$ICON_DIR/${APP_ID}.svg" \
            /app/share/icons/hicolor/scalable/apps/${APP_ID}.svg
        elif test -f "$ICON_DIR/${APP_ID}.png"; then
          for size in 128 256 512; do
            src="$ICON_DIR/${APP_ID}.png"
            if test -f "$ICON_DIR/${APP_ID}-${size}.png"; then
              src="$ICON_DIR/${APP_ID}-${size}.png"
            elif test "$size" != 256 && command -v convert >/dev/null 2>&1; then
              convert "$ICON_DIR/${APP_ID}.png" -resize "${size}x${size}" "/tmp/icon-${size}.png"
              src="/tmp/icon-${size}.png"
            elif test "$size" != 256; then
              continue
            fi
            install -Dm644 "$src" \
              "/app/share/icons/hicolor/${size}x${size}/apps/${APP_ID}.png"
          done
        else
          echo "No icon in $ICON_DIR" >&2
          exit 1
        fi
