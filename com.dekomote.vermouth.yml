app-id: com.dekomote.vermouth
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: vermouth

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
  - --allow=devel
  - --allow=per-app-dev-shm

modules:
  - name: vermouth
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/dekomote/vermouth.git
        tag: v1.8.2
        commit: 62387df135b5e0bff04fb7142e708a08fa62f0c1
