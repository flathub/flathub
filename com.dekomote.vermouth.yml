app-id: com.dekomote.vermouth
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: vermouth

finish-args:
  # Needed for the app itself
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  # Needed for the games
  - --socket=pulseaudio
  - --device=dri
  - --device=input
  # Needed for finding the steam runtimes
  - --filesystem=home
  # Needed for the bwrap used by the proton/umu
  - --allow=devel
  - --allow=per-app-dev-shm

modules:
  - name: vermouth
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/dekomote/vermouth.git
        tag: v1.8.2
