app-id: io.github.N3kosempai.klia-scaler-player
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: klia-scaler-player
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager
  - --own-name=org.mpris.MediaPlayer2.klia_scaler_player
modules:
  - name: klia-scaler-player
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/klia-scaler-player /app/bin/klia-scaler-player
      - cp -a lib/. /app/lib/
      - cp -a share/. /app/share/
    sources:
      - type: archive
        url: https://github.com/N3koSempai/klia-scaler-player/releases/download/v1.3.5/klia-scaler-player-1.3.5-x86_64.tar.gz
        sha256: eb3b15a51a75d78947fc48fade0081721329fe28a6a75cf5b9919012281d1a02
        strip-components: 0
