app-id: io.github.N3kosempai.klia-scaler-player
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: klia-scaler-player
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  # Inhibición de reposo mientras se reproduce
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager
  # MPRIS: teclas multimedia y widgets del escritorio
  - --own-name=org.mpris.MediaPlayer2.klia_scaler_player
modules:
  # El tarball trae el binario ya compilado más libmpv (mpv + PR #18607),
  # libplacebo y libass, construidos contra org.gnome.Platform//49.
  # Mismo layout que /app: bin/, lib/, share/.
  - name: klia-scaler-player
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/klia-scaler-player /app/bin/klia-scaler-player
      - cp -a lib/. /app/lib/
      - cp -a share/. /app/share/
    sources:
      - type: archive
        url: https://github.com/N3koSempai/klia-scaler-player/releases/download/v1.3.4/klia-scaler-player-1.3.4-x86_64.tar.gz
        sha256: 0fb5d90571ba89d99b809f6d0d452538e815b96c107d14dc41dd4b38cefd3145
        strip-components: 0
