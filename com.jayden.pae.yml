app-id: com.jayden.pae

runtime: org.gnome.Sdk
runtime-version: "49"
sdk: org.gnome.Sdk
command: pae

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: pae
    buildsystem: simple

    build-commands:
      - mkdir -p .cargo
      - cp cargo/config.toml .cargo/config.toml
      - cargo build --release --offline

      - install -Dm755 target/release/PAE /app/bin/pae

      - install -Dm644 flatpak/com.jayden.pae.desktop /app/share/applications/com.jayden.pae.desktop

      - install -Dm644 flatpak/com.jayden.pae.metainfo.xml /app/share/metainfo/com.jayden.pae.metainfo.xml

      - install -Dm644 assets/icons/hicolor/512x512/apps/com.jayden.pae.png /app/share/icons/hicolor/512x512/apps/com.jayden.pae.png

    sources:
      - type: archive
        url: https://github.com/needforkies/pae/archive/refs/tags/v0.1.0.tar.gz
        sha256: 5cb63c27ff002edf2e1a14287735e561cca64c060d00402b36ac8fe00765c23a
