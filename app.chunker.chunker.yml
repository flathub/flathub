id: app.chunker.chunker
runtime: org.freedesktop.Platform
runtime-version: "25.08"
base: "org.electronjs.Electron2.BaseApp"
base-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - "org.freedesktop.Sdk.Extension.openjdk17"
  - "org.freedesktop.Sdk.Extension.node24"
command: app.chunker.chunker
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --env=ELECTRON_TRASH=gio
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin
  - --env=JAVA_HOME=/app/jre
modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - "/usr/lib/sdk/openjdk17/install.sh"
      - "/usr/lib/sdk/node24/enable.sh"
  - name: chunker
    buildsystem: simple
    build-options:
     env:
        PATH: /app/bin:/usr/bin:/usr/lib/sdk/node24/bin:/usr/lib/sdk/openjdk17/bin
        JAVA_HOME: /usr/lib/sdk/openjdk17/jvm/openjdk-17
        XDG_CACHE_HOME: /run/build/chunker/flatpak-node/cache
    build-commands:
      - "chmod +x ./gradlew"
      - "./gradlew build --no-daemon --offline --console=plain"
      - "mkdir -p /app/chunker"
      - "cp -r build/libs/linux/linux-unpacked/* /app/chunker"
      - "patch-desktop-filename /app/chunker/resources/app.asar"
      - "chmod +x /app/chunker/chunker-electron"
      - "chmod +x /app/chunker/resources/chunker-cli/bin/chunker-cli"
      - "install -Dm755 chunker.sh /app/bin/${FLATPAK_ID}"
      - "install -Dm644 /app/chunker/resources/flathub/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml"
      - "install -Dm644 /app/chunker/resources/flathub/${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop"
      - "install -Dm644 /app/chunker/resources/flathub/logo.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png"
    sources:
      - type: git
        url: https://github.com/HiveGamesOSS/Chunker
        tag: 1.18.1
        commit: c428524b
        x-checker-data:
          - type: git
            version-scheme: semantic
      - type: file
        path: chunker.sh
      - type: patch
        paths:
          - patches/dir-target-only.patch
          - patches/local-dependencies.patch
      - type: file
        url: "https://services.gradle.org/distributions/gradle-9.5.1-bin.zip"
        sha256: "bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f"
        dest: "gradle/wrapper"
        dest-filename: "gradle-bin.zip"
      - cli-dependencies-sources.json
      - app-dependencies-sources.json
      - npm-dependencies-sources.json
