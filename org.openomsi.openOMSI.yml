app-id: org.openomsi.openOMSI
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: openomsi
finish-args:
  # required for multiplayer
  - --share=network
  # persist user settings and logs
  - --persist=.openomsi
  # required for rendering
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # required for audio
  - --socket=pulseaudio
modules:
  - name: openOMSI
    buildsystem: simple
    build-commands:
      # Rewrite the Icon line inside the desktop file to match your App ID
      - sed -i 's/^Icon=.*$/Icon=org.openomsi.openOMSI/' openomsi.desktop
      # Install all required files
      - install -Dm 644 openomsi.desktop /app/share/applications/org.openomsi.openOMSI.desktop
      - install -Dm 644 openomsi.png /app/share/icons/hicolor/256x256/apps/org.openomsi.openOMSI.png
      - install -Dm 644 -t /app/share/metainfo org.openomsi.openOMSI.metainfo.xml
      - install -Dm 755 openomsi-launcher /app/bin/openomsi-launcher
      - sh -c 'install -Dm 755 -t /app/lib *.so || true' # Some variants don't have the steamapi
      - install -Dm 755 openomsi-launcher-app /app/bin/openomsi-launcher-app
      - install -Dm 755 openomsi /app/bin/openomsi
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/openOMSI-org/openOMSI/releases/download/v0.3.37/openOMSI-0.3.37-linux-x64.zip
        sha256: 93e760a78662ce2dc28bec4eaffc4b1eee9217a9fd5c743bb662dc8e8c9ee8cd
        x-checker-data:
          type: json
          url: https://api.github.com/repos/openOMSI-org/openOMSI/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="openOMSI-" + $version + "-linux-x64.zip")
            | .browser_download_url
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/openOMSI-org/openOMSI/releases/download/v0.3.37/openOMSI-0.3.37-linux-arm64.zip
        sha256: c32b17ff37a66b52c7f0ae9b7b1cf8e461f2bfe8fb6e9ae56dae1e85291bb70f
        x-checker-data:
          type: json
          url: https://api.github.com/repos/openOMSI-org/openOMSI/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="openOMSI-" + $version + "-linux-arm64.zip")
            | .browser_download_url
      - type: file
        path: org.openomsi.openOMSI.metainfo.xml
