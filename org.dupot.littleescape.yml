app-id: org.dupot.littleescape
base: org.godotengine.godot.BaseApp
base-version: '4.7'
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: littleescape
finish-args:
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: littleescape
    buildsystem: simple

    build-commands:
      - install -Dm755 littleescape.sh /app/bin/littleescape
      - install -Dm644 gameArchive/dupotLittleEscape.pck /app/bin/littleescape.pck
      - install -Dm644 gameArchive/icons/16x16.png $FLATPAK_DEST/share/icons/hicolor/16x16/apps/org.dupot.littleescape.png
      - install -Dm644 gameArchive/icons/24x24.png $FLATPAK_DEST/share/icons/hicolor/24x24/apps/org.dupot.littleescape.png
      - install -Dm644 gameArchive/icons/32x32.png $FLATPAK_DEST/share/icons/hicolor/32x32/apps/org.dupot.littleescape.png
      - install -Dm644 gameArchive/icons/48x48.png $FLATPAK_DEST/share/icons/hicolor/48x48/apps/org.dupot.littleescape.png
      - install -Dm644 gameArchive/icons/64x64.png $FLATPAK_DEST/share/icons/hicolor/64x64/apps/org.dupot.littleescape.png
      - install -Dm644 gameArchive/icons/128x128.png $FLATPAK_DEST/share/icons/hicolor/128x128/apps/org.dupot.littleescape.png
      - install -Dm644 gameArchive/icons/256x256.png $FLATPAK_DEST/share/icons/hicolor/256x256/apps/org.dupot.littleescape.png
      - install -Dm644 gameArchive/icons/512x512.png $FLATPAK_DEST/share/icons/hicolor/512x512/apps/org.dupot.littleescape.png
      - install -Dm644 gameArchive/${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-key=StartupWMClass --set-value=LittleEscape /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 gameArchive/${FLATPAK_ID}.appdata.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml

    sources:
      - type: archive
        dest: gameArchive
        url: https://github.com/imikado/dupotLittleEscape/releases/download/1.0.1/bundle.tar.gz
        sha256: 329a71c56f5fd1b843181dde223cb9061e06296a58af17865aa14c4aaa9ef0d1

      - type: script
        dest-filename: littleescape.sh
        commands:
          - cd /app/bin/
          - /app/bin/godot-runner --main-pack /app/bin/littleescape.pck "$@"
