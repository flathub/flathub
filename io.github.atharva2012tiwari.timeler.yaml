app-id: io.github.atharva2012tiwari.timeler
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: timeler

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio

modules:
  - name: timeler
    buildsystem: simple
    build-commands:
      # Binary and Flutter data bundle
      - install -D -m 0755 timeler /app/bin/timeler
      - cp -r data/ /app/bin/
      - cp -r lib/ /app/bin/
      # Desktop entry and metadata
      - install -D -m 0644 io.github.atharva2012tiwari.timeler.desktop /app/share/applications/io.github.atharva2012tiwari.timeler.desktop
      - install -D -m 0644 io.github.atharva2012tiwari.timeler.metainfo.xml /app/share/metainfo/io.github.atharva2012tiwari.timeler.metainfo.xml
      # Scalable Vector Icon & PNG for GNOME
      - install -D -m 0644 io.github.atharva2012tiwari.timeler.svg /app/share/icons/hicolor/scalable/apps/io.github.atharva2012tiwari.timeler.svg
      - install -D -m 0644 io.github.atharva2012tiwari.timeler.png /app/share/icons/hicolor/512x512/apps/io.github.atharva2012tiwari.timeler.png
    sources:
      - type: archive
        url: https://github.com/atharva2012tiwari/timeler/releases/download/v1.0.0/timeler-linux-x64.tar.gz
        sha256: 56c17f8ca810d2aed62030583bab17babfdfef7c2bb58c392e7432a39279dc5c
      - type: file
        path: io.github.atharva2012tiwari.timeler.desktop
      - type: file
        path: io.github.atharva2012tiwari.timeler.metainfo.xml
      - type: file
        path: io.github.atharva2012tiwari.timeler.svg
      - type: file
        path: io.github.atharva2012tiwari.timeler.png
