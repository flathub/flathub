# Flathub submission manifest: sources are pinned to release tags.
app-id: io.github.finotilucas.requesthub
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: requesthub

finish-args:
  # HTTP client
  - --share=network
  # GUI
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
  - '*.la'

modules:
  - name: cjson
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DENABLE_CJSON_TEST=Off
      - -DENABLE_CUSTOM_COMPILER_FLAGS=Off
    sources:
      - type: git
        url: https://github.com/DaveGamble/cJSON.git
        tag: v1.7.18
        commit: acc76239bee01d8e9c858ae2cab296704e52d916

  - name: libyaml
    buildsystem: autotools
    sources:
      - type: archive
        url: https://pyyaml.org/download/libyaml/yaml-0.2.5.tar.gz
        sha256: c642ae9b75fee120b2d96c712538bd2cf283228d2337df2cf2988e3c02678ef4

  - name: requesthub
    buildsystem: simple
    build-commands:
      - make release
      - make install PREFIX=/app
    sources:
      - type: git
        url: https://github.com/finotilucas/requesthub.git
        tag: v0.1.2
        commit: 25d8f311d7160f7d8660b3212b2f49c56680770d
