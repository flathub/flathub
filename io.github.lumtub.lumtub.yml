# Flatpak of the Linux release: the AppImage's files under /app/lumtub,
# started through its AppRun, on the freedesktop runtime. Lumtub's own
# updater stays off here (it only replaces an AppImage); Flatpak updates it.
# packaging/update-manifests.sh fills in the URLs and SHA-256 values.
app-id: io.github.lumtub.lumtub
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: lumtub
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Downloads, and screenshots of the video
  - --filesystem=xdg-download
  - --filesystem=xdg-videos
  - --filesystem=xdg-pictures
  # Media keys and the desktop's media controls (MPRIS)
  - --own-name=org.mpris.MediaPlayer2.lumtub.*
  # The tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  # Minimize to tray on KDE Plasma
  - --talk-name=org.kde.KWin
  # The sign-in is kept in the desktop's keyring
  - --talk-name=org.freedesktop.secrets
modules:
  - name: lumtub
    buildsystem: simple
    # Prebuilt and already stripped: left as the AppImage has them.
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      - chmod +x lumtub.AppImage
      - ./lumtub.AppImage --appimage-extract > /dev/null
      - mkdir -p /app/lumtub
      - cp -a squashfs-root/usr squashfs-root/AppRun /app/lumtub/
      - chmod -R u=rwX,go=rX /app/lumtub
      - install -Dm755 lumtub.sh /app/bin/lumtub
      - install -Dm644 io.github.lumtub.lumtub.desktop /app/share/applications/io.github.lumtub.lumtub.desktop
      - install -Dm644 lumtub.png /app/share/icons/hicolor/256x256/apps/io.github.lumtub.lumtub.png
      - install -Dm644 io.github.lumtub.lumtub.metainfo.xml /app/share/metainfo/io.github.lumtub.lumtub.metainfo.xml
    sources:
      - type: file
        only-arches: [x86_64]
        dest-filename: lumtub.AppImage
        url: https://github.com/0x696c757a696f/lumtub/releases/download/v0.2.49-17fb352/Lumtub_0.2.49-17fb352_linux-x64.AppImage
        sha256: da533794cf11e05de04ecce99fa805eb1316b6234111aa446d47914c23875404
        x-checker-data:
          type: json
          url: https://api.github.com/repos/0x696c757a696f/lumtub/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '.assets[] | select(.name | endswith("_linux-x64.AppImage")) | .browser_download_url'
      - type: file
        only-arches: [aarch64]
        dest-filename: lumtub.AppImage
        url: https://github.com/0x696c757a696f/lumtub/releases/download/v0.2.49-17fb352/Lumtub_0.2.49-17fb352_linux-arm64.AppImage
        sha256: 24b50afac1d0c175359fad20c71a32a298d51c203c85c9b9561212c383fc959f
        x-checker-data:
          type: json
          url: https://api.github.com/repos/0x696c757a696f/lumtub/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '.assets[] | select(.name | endswith("_linux-arm64.AppImage")) | .browser_download_url'
      - type: file
        path: io.github.lumtub.lumtub.desktop
      - type: file
        path: io.github.lumtub.lumtub.metainfo.xml
      - type: file
        path: lumtub.png
      - type: script
        dest-filename: lumtub.sh
        commands:
          - exec /app/lumtub/AppRun "$@"
