id: app.mytvplayer.MyTvPlayer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: mytvplayer
separate-locales: false

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --talk-name=org.freedesktop.Notifications


modules:
  - name: mytvplayer
    buildsystem: simple
    build-commands:
    - mkdir -p /app/lib/mytvplayer /app/bin /app/share
    - cp -a mytvplayer mtp-ffmpeg lib data /app/lib/mytvplayer/
    - cp -a share/licenses /app/share/
    - chmod 0755 /app/lib/mytvplayer/mytvplayer /app/lib/mytvplayer/mtp-ffmpeg
    - ln -s ../lib/mytvplayer/mytvplayer /app/bin/mytvplayer
    - install -Dm644 share/applications/app.mytvplayer.MyTvPlayer.desktop -t /app/share/applications/
    - install -Dm644 share/metainfo/app.mytvplayer.MyTvPlayer.metainfo.xml -t /app/share/metainfo/
    - install -Dm644 share/icons/hicolor/scalable/apps/app.mytvplayer.MyTvPlayer.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: archive
        url: https://downloads.mytvplayer.app/flathub/1.0.4/mytvplayer-1.0.4-linux-x86_64.tar.xz
        sha256: 3e8d3600fa25112092d204c533a1f52271c7453be695df8989a374de8cf44465
        only-arches:
          - x86_64