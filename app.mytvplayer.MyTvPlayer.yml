id: app.mytvplayer.MyTvPlayer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: mytvplayer
separate-locales: false

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network


modules:
  - name: mytvplayer
    buildsystem: simple
    build-commands:
    - mkdir -p /app/lib/mytvplayer /app/bin /app/share
    - cp -a mytvplayer mtp-ffmpeg lib data /app/lib/mytvplayer/
    - cp -a share/licenses /app/share/
    - chmod 0755 /app/lib/mytvplayer/mytvplayer /app/lib/mytvplayer/mtp-ffmpeg
    - ln -s ../lib/mytvplayer/mytvplayer /app/bin/mytvplayer
    - install -Dm644 share/applications/app.mytvplayer.MyTvPlayer.desktop -t /app/share/applications/
    - install -Dm644 share/metainfo/app.mytvplayer.MyTvPlayer.metainfo.xml -t /app/share/metainfo/
    - install -Dm644 share/icons/hicolor/scalable/apps/app.mytvplayer.MyTvPlayer.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: archive
        url: https://downloads.mytvplayer.app/flathub/1.0.5/mytvplayer-1.0.5-linux-x86_64.tar.xz
        sha256: 4c808b0f57b2942b21c919b595d48b5d2f6e777df11c87be0a53b27af49af7f1
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://downloads.mytvplayer.app/flathub/latest.json
          version-query: .version
          url-query: .x86_64.url
          timestamp-query: .date
          update-group: mytvplayer
      - type: archive
        url: https://downloads.mytvplayer.app/flathub/1.0.5/mytvplayer-1.0.5-linux-aarch64.tar.xz
        sha256: 1c17b5feb2b8371beb5c1f1a5abe3082778cdf016bcf20373a548d7390606aa3
        only-arches:
          - aarch64
        x-checker-data:
          type: json
          url: https://downloads.mytvplayer.app/flathub/latest.json
          version-query: .version
          url-query: .aarch64.url
          timestamp-query: .date
          update-group: mytvplayer