app-id: io.github.adamboa000.Paint
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: paint-linux

modules:
  - name: python3-pyqt6
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-build-isolation --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} PyQt6

  - name: paint
    buildsystem: simple
    build-commands:
      - install -D main.py ${FLATPAK_DEST}/bin/paint-linux
      - install -D io.github.adamboa000.Paint.desktop ${FLATPAK_DEST}/share/applications/io.github.adamboa000.Paint.desktop
      - install -D io.github.adamboa000.Paint.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.adamboa000.Paint.metainfo.xml
      - install -D io.github.adamboa000.Paint.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/io.github.adamboa000.Paint.png
    sources:
      - type: dir
        path: .
