app-id: io.github.Aevlabs.Traka
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: traka

finish-args:
  # Windowing
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Network — CalDAV sync, update checks
  - --share=network
  # System tray (StatusNotifier protocol — KDE and GNOME+AppIndicator)
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  # Desktop notifications
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
  env:
    CARGO_HOME: /run/build/traka/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: traka
    buildsystem: simple
    build-options:
      env:
        npm_config_offline: 'true'
        PNPM_HOME: /run/build/traka/pnpm
    build-commands:
      # Install pnpm binary (pre-downloaded via sources)
      - install -Dm755 pnpm-bin /usr/local/bin/pnpm
      # Install frontend dependencies (offline — pnpm store populated by node-sources.json)
      - HOME=/run/build/traka pnpm install --frozen-lockfile --offline
      # Build the React frontend (outputs to dist/)
      - HOME=/run/build/traka pnpm build
      # Compile the Rust backend (offline, using vendored crates)
      - cargo build --release --manifest-path src-tauri/Cargo.toml
      # Install binary
      - install -Dm755 src-tauri/target/release/traka /app/bin/traka
      # Desktop integration files
      - install -Dm644 flatpak/io.github.Aevlabs.Traka.desktop
          /app/share/applications/io.github.Aevlabs.Traka.desktop
      - install -Dm644 flatpak/io.github.Aevlabs.Traka.metainfo.xml
          /app/share/metainfo/io.github.Aevlabs.Traka.metainfo.xml
      # Icons — all hicolor sizes
      - install -Dm644 src-tauri/icons/32x32.png
          /app/share/icons/hicolor/32x32/apps/io.github.Aevlabs.Traka.png
      - install -Dm644 src-tauri/icons/64x64.png
          /app/share/icons/hicolor/64x64/apps/io.github.Aevlabs.Traka.png
      - install -Dm644 src-tauri/icons/128x128.png
          /app/share/icons/hicolor/128x128/apps/io.github.Aevlabs.Traka.png
      - install -Dm644 src-tauri/icons/256x256.png
          /app/share/icons/hicolor/256x256/apps/io.github.Aevlabs.Traka.png
      - install -Dm644 src-tauri/icons/icon.png
          /app/share/icons/hicolor/512x512/apps/io.github.Aevlabs.Traka.png
    sources:
      - type: git
        url: https://github.com/Aevlabs/Traka.git
        tag: v1.0.0
        commit: 92cfb73e46364eaa03540b72954ca387baae3b1c
      # Cargo config to enable vendored offline crate sources
      - type: inline
        contents: |
          [source.crates-io]
          replace-with = "vendored-sources"

          [source.vendored-sources]
          directory = "cargo/vendor"
        dest: .cargo
        dest-filename: config.toml
      # pnpm binary — architecture-specific standalone executables
      - type: file
        url: https://github.com/pnpm/pnpm/releases/download/v10.29.3/pnpm-linux-x64
        sha256: 2fc98db127c611be0c110af11b5b72759f7d736893dddc81df73b7b59b30f15a
        dest-filename: pnpm-bin
        only-arches: [x86_64]
      - type: file
        url: https://github.com/pnpm/pnpm/releases/download/v10.29.3/pnpm-linux-arm64
        sha256: ae70208882b2c5229e143de2454fc4f778b2d2ae959a2e48ec76a6c26e8b3127
        dest-filename: pnpm-bin
        only-arches: [aarch64]
      # Vendored crate sources — generated by flatpak-cargo-generator
      - cargo-sources.json
      # Vendored npm sources — generated by flatpak-node-generator pnpm
      - node-sources.json
