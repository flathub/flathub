app-id: io.github.valheim.modmanager
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: valheim-mod-manager
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: valheim-mod-manager
    buildsystem: simple
    build-commands:
      # Création des répertoires
      - mkdir -p /app/bin /app/share/applications /app/share/metainfo /app/share/icons/hicolor/scalable/apps /app/share/fonts
      # Wrapper
      - echo '#!/bin/sh' > /app/bin/valheim-mod-manager
      - echo 'export PYTHONPATH=$PYTHONPATH:/app/lib/python3.10/site-packages' >> /app/bin/valheim-mod-manager
      - echo 'exec python3 /app/bin/main.py "$@"' >> /app/bin/valheim-mod-manager
      - chmod +x /app/bin/valheim-mod-manager
      # Copie des fichiers
      - install -Dm755 main.py /app/bin/main.py
      - mkdir -p /app/lib/python3.10/site-packages
      - cp -r vmm /app/lib/python3.10/site-packages/
      - install -Dm644 io.github.valheim.modmanager.desktop /app/share/applications/io.github.valheim.modmanager.desktop
      - install -Dm644 io.github.valheim.modmanager.metainfo.xml /app/share/metainfo/io.github.valheim.modmanager.metainfo.xml
      - install -Dm644 vmm/icons/hicolor/scalable/apps/io.github.valheim.modmanager.png /app/share/icons/hicolor/scalable/apps/io.github.valheim.modmanager.png



    sources:
      - type: dir
        path: .
