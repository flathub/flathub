id: chat.moin.moin
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: moin
finish-args:
  # Single-instance handoff and Wayland/X11 clients need the shared IPC namespace.
  - --share=ipc
  # Peer-to-peer calls and the coordinator connection.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  # Microphone capture and playback.
  - --socket=pulseaudio
  # GPU: rendering, plus VAAPI/NVENC hardware video. Also exposes /dev/nvidia*.
  - --device=dri
modules:
  - name: moin
    buildsystem: simple
    build-commands:
      - cp -a lib share /app/
      - install -d /app/bin
      # The Flutter runner resolves data/ and lib/ from its own path, and the
      # executable keeps RPATH $ORIGIN/lib, so a symlink is enough.
      - ln -s /app/lib/moin/moin_flutter /app/bin/moin
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://moin.chat/downloads/linux/0.1.0/moin-0.1.0-linux-x86_64.tar.xz
        sha256: '840c4c92358a1af96e3bc27e858616c1e97649d97abc240170324d60e4485b76'
        # The tarball root is already the /app layout.
        strip-components: 0
