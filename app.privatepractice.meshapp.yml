app-id: app.privatepractice.meshapp
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk25
command: MeshApp

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=all
  - --allow=bluetooth
  - --system-talk-name=org.bluez
  - --filesystem=xdg-documents:create
  - --filesystem=xdg-download:create
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin
  - --env=JAVA_HOME=/app/jre

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk25/install.sh

  - name: meshapp
    buildsystem: simple
    build-options:
      env:
        GRADLE_USER_HOME: /run/build/meshapp/gradle-home
        JAVA_HOME: /usr/lib/sdk/openjdk25/jvm/openjdk-25
        PATH: /app/bin:/usr/bin:/usr/lib/sdk/openjdk25/bin
    build-commands:
      - |
        set -eu
        gradle-dist/bin/gradle --offline --no-daemon installDist \
          -PmeshappJavaVersion=25 \
          -PmeshappJavaReleaseVersion=25 \
          -PmeshappJavaFxPlatform=linux
      - install -d /app/meshapp
      - cp -a build/install/MeshApp/. /app/meshapp/
      - install -Dm755 src/flatpak/MeshApp /app/bin/MeshApp
      - install -Dm644 src/flatpak/app.privatepractice.meshapp.desktop /app/share/applications/app.privatepractice.meshapp.desktop
      - install -Dm644 src/flatpak/app.privatepractice.meshapp.metainfo.xml /app/share/metainfo/app.privatepractice.meshapp.metainfo.xml
      - install -Dm644 src/main/resources/logo/icon_512.png /app/share/icons/hicolor/512x512/apps/app.privatepractice.meshapp.png
      - install -Dm644 src/main/resources/logo/icon_256.png /app/share/icons/hicolor/256x256/apps/app.privatepractice.meshapp.png
      - install -Dm644 src/main/resources/logo/icon_128.png /app/share/icons/hicolor/128x128/apps/app.privatepractice.meshapp.png
      - install -Dm644 LICENSE /app/share/licenses/app.privatepractice.meshapp/LICENSE
      - install -Dm644 src/main/resources/emoji/LICENSE /app/share/licenses/app.privatepractice.meshapp/emoji/LICENSE
      - install -Dm644 src/main/resources/emoji/LICENSE-GRAPHICS /app/share/licenses/app.privatepractice.meshapp/emoji/LICENSE-GRAPHICS
      - install -Dm644 src/main/resources/emoji/SOURCE.txt /app/share/licenses/app.privatepractice.meshapp/emoji/SOURCE.txt
    sources:
      - type: git
        url: https://git.privatepractice.app/covox/meshapp.git
        tag: v2.1.10
        commit: fdb87d10c9917cc9b4a2b24d1ea428952b45b010
      - type: archive
        url: https://services.gradle.org/distributions/gradle-9.4.1-bin.zip
        sha256: 2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb
        dest: gradle-dist
      - flatpak-sources-x86_64.json
      - flatpak-sources-foojay.json
