app-id: com.livemcq.livemcq
runtime: org.gnome.Platform
# GNOME 51 is the current stable release (52 is due 2027-03-17); confirm it is listed on Flathub and ships libwebkit2gtk-4.1
runtime-version: '51'
sdk: org.gnome.Sdk
command: livemcq

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: livemcq
    buildsystem: simple
    build-commands:
      # unpack the .deb (an ar archive holding data.tar.gz)
      - ar x livemcq.deb
      - tar -xzf data.tar.gz
      - install -Dm755 usr/bin/app /app/bin/livemcq
      - install -Dm644 com.livemcq.livemcq.png /app/share/icons/hicolor/512x512/apps/com.livemcq.livemcq.png
      - install -Dm644 com.livemcq.livemcq.desktop /app/share/applications/com.livemcq.livemcq.desktop
      - install -Dm644 com.livemcq.livemcq.metainfo.xml /app/share/metainfo/com.livemcq.livemcq.metainfo.xml
    sources:
      - type: file
        url: https://assets.livemcq.com/apks/linux-distributions/LiveMCQ_6.4.13_amd64.deb
        sha256: d4a9373c9de5eea52d8518609ffb46f1b4f9ae97ace4c21806e698eca4ff926b
        dest-filename: livemcq.deb
      - type: file
        path: com.livemcq.livemcq.png
      - type: file
        path: com.livemcq.livemcq.desktop
      - type: file
        path: com.livemcq.livemcq.metainfo.xml
