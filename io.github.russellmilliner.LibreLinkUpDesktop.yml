app-id: io.github.russellmilliner.LibreLinkUpDesktop
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm22
command: librelinkup-kde
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-config/kdeglobals:ro
modules:
  - name: librelinkup-kde
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin
      env:
        CARGO_HOME: /run/build/librelinkup-kde/cargo
        LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib
        QMAKE: /usr/bin/qmake
        QT_VERSION_MAJOR: '6'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 ./target/release/librelinkup-kde -t /app/bin/
      - install -Dm644 ./data/io.github.russellmilliner.LibreLinkUpDesktop.desktop -t /app/share/applications/
      - install -Dm644 ./data/io.github.russellmilliner.LibreLinkUpDesktop.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 ./data/icons/io.github.russellmilliner.LibreLinkUpDesktop.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 ./LICENSE ./NOTICE -t /app/share/licenses/io.github.russellmilliner.LibreLinkUpDesktop/
    sources:
      - type: git
        url: https://github.com/russellmilliner/librelinkup-rust-desktop.git
        tag: v0.2.0
        commit: f989cf35355199fa971691bf92541e7daf6bb516
      - cargo-sources.json
