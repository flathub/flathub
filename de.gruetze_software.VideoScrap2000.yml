id: de.gruetze_software.VideoScrap2000

runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk

command: videoscrap2000

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: libzen
    subdir: Project/GNU/Library
    config-opts:
      - --enable-shared
      - --disable-static
    sources:
      - type: archive
        url: https://mediaarea.net/download/source/libzen/0.4.41/libzen_0.4.41.tar.xz
        sha256: 933bad3b7ecd29dc6bdc88a83645c83dfd098c15b0b90d6177a37fa1536704e8

  - name: libmediainfo
    subdir: Project/GNU/Library
    config-opts:
      - --enable-shared
      - --disable-static
      - --with-libcurl
    sources:
      - type: archive
        url: https://mediaarea.net/download/source/libmediainfo/26.10/libmediainfo_26.10.tar.xz
        sha256: a806fd36592549a03e810486f415a6858d4d8f14066bfbe97b32a447cd5eb590

  - name: videoscrap2000
    buildsystem: simple

    sources:
      - type: archive
        url: https://github.com/gruetze-software/VideoScrap2000/releases/download/v1.4.1/VideoScrap2000-1.4.0-linux-x64.tar.gz
        sha256: a58a7036031bc5c9498ae2a572a3b93f52beb5ef78d304f7c70473dca9a83a8f
        strip-components: 0
        only-arches:
          - x86_64

      - type: archive
        url: https://github.com/gruetze-software/VideoScrap2000/releases/download/v1.4.0/VideoScrap2000-1.4.1-linux-arm64.tar.gz
        sha256: 0b6f0d5ae9c730c972a4d63eb06c5dbf81cdfb912f9758aca26846865ac9f4b1
        strip-components: 0
        only-arches:
          - aarch64

      - type: git
        url: https://github.com/gruetze-software/VideoScrap2000.git
        commit: 748a401ae9cb17acf704074fe8ed1280a8cd979b
        dest: repo

    build-commands:
      - install -d /app/lib/videoscrap2000
      - cp -a VideoScrap2000/. /app/lib/videoscrap2000/
      - rm -f /app/lib/videoscrap2000/libmediainfo.so*
      - rm -f /app/lib/videoscrap2000/libzen.so*
      - ln -sf /app/lib/libmediainfo.so /app/lib/videoscrap2000/libmediainfo.so
      - ln -sf /app/lib/libzen.so.0 /app/lib/videoscrap2000/libzen.so.0
      - install -d /app/bin
      - |
        cat >/app/bin/videoscrap2000 <<'EOF'
        #!/bin/sh
        export LD_LIBRARY_PATH="/app/lib/videoscrap2000:/app/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        exec /app/lib/videoscrap2000/VideoScrap2000 "$@"
        EOF
      - chmod 755 /app/bin/videoscrap2000
      - install -Dm644 repo/branding/linux/de.gruetze_software.VideoScrap2000.desktop /app/share/applications/de.gruetze_software.VideoScrap2000.desktop
      - install -Dm644 repo/branding/linux/de.gruetze_software.VideoScrap2000.metainfo.xml /app/share/metainfo/de.gruetze_software.VideoScrap2000.metainfo.xml
      - install -Dm644 repo/MovieScrap2000/Assets/videoscrap-2000.png /app/share/icons/hicolor/256x256/apps/de.gruetze_software.VideoScrap2000.png
      - install -Dm644 repo/LICENSE /app/share/licenses/de.gruetze_software.VideoScrap2000/LICENSE
      - install -Dm644 repo/THIRD-PARTY-NOTICES.md /app/share/licenses/de.gruetze_software.VideoScrap2000/THIRD-PARTY-NOTICES.md
