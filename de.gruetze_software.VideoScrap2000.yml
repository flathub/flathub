id: de.gruetze_software.VideoScrap2000
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: videoscrap2000
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: libzen
    buildsystem: autotools
    subdir: Project/GNU/Library
    config-opts:
      - --enable-shared
      - --disable-static
    sources:
      - type: archive
        url: https://mediaarea.net/download/source/libzen/0.4.41/libzen_0.4.41.tar.xz
        sha256: 933bad3b7ecd29dc6bdc88a83645c83dfd098c15b0b90d6177a37fa1536704e8
  - name: libmediainfo
    buildsystem: autotools
    subdir: Project/GNU/Library
    config-opts:
      - --enable-shared
      - --disable-static
      - --with-libcurl
    sources:
      - type: archive
        url: https://mediaarea.net/download/source/libmediainfo/26.10/libmediainfo_26.10.tar.xz
        sha256: a806fd36592549a03e810486f415a6858d4d8f14066bfbe97b32a447cd5eb590
  - name: videoscrap2000
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/gruetze-software/VideoScrap2000/releases/download/v1.5.0/VideoScrap2000-1.5.0-linux-x64-flatpak.tar.gz
        sha256: 37ad618f93495320b010110722fccffa6cf81f28b11d6cd3a118593973d25629
        strip-components: 0
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/gruetze-software/VideoScrap2000/releases/download/v1.5.0/VideoScrap2000-1.5.0-linux-arm64-flatpak.tar.gz
        sha256: b095f1b2be980981b43ed6b1aa8cc12f8aab10b78ef2b79a977830f672d8d6c6
        strip-components: 0
        only-arches:
          - aarch64
    build-commands:
       - bash VideoScrap2000/linux-integration/install.sh
