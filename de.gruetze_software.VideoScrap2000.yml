id: de.gruetze_software.VideoScrap2000
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
build-options:
  prepend-path: "/usr/lib/sdk/dotnet10/bin"
  append-ld-library-path: "/usr/lib/sdk/dotnet10/lib"
  prepend-pkg-config-path: "/usr/lib/sdk/dotnet10/lib/pkgconfig"

command: videoscrap2000

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --env=DOTNET_ROOT=/app/lib/dotnet
  - --device=dri

modules:
  - name: dotnet
    buildsystem: simple
    build-commands:
    - /usr/lib/sdk/dotnet10/bin/install.sh
    
  - name: libzen
    subdir: Project/GNU/Library
    config-opts:
    - --enable-shared
    - --disable-static
    sources:
    - type: archive
      url: https://mediaarea.net/download/source/libzen/0.4.41/libzen_0.4.41.tar.xz
      sha256: 933bad3b7ecd29dc6bdc88a83645c83dfd098c15b0b90d6177a37fa1536704e8
    
  - name: libmediainfo
    subdir: Project/GNU/Library
    config-opts:
    - --enable-shared
    - --disable-static
    - --with-libcurl
    sources:
    - type: archive
      url: https://mediaarea.net/download/source/libmediainfo/26.10/libmediainfo_26.10.tar.xz
      sha256: a806fd36592549a03e810486f415a6858d4d8f14066bfbe97b32a447cd5eb590

  - name: videoscrap2000
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/gruetze-software/VideoScrap2000.git
        commit: 41e8fa4a6fe85b0d0850a33f712336974cb51732
      - ./nuget-sources.json
    build-commands:
      - bash scripts/install-flatpak.sh
