app-id: com.warlordsoftwares.wallpaper-app-4kwall
runtime: org.kde.Platform
runtime-version: "5.15-25.08"
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: "5.15-25.08"

cleanup-commands:
  - /app/cleanup-BaseApp.sh

build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1

command: 4kwall.sh

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-pictures
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.FileManager1
  - --env=QT_ENABLE_HIGHDPI_SCALING=1
  - --env=APP_PLATFORM=FLATPAK

cleanup:
  - /include
  - /lib/pkgconfig

modules:
  - python3-req.json

  - name: wallpaper-app-4kwall
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/4kwall
      - cp -r * ${FLATPAK_DEST}/4kwall
      - install -Dm755 ${FLATPAK_DEST}/4kwall/4kwall.sh ${FLATPAK_DEST}/bin/4kwall.sh
      - install -Dm644 ${FLATPAK_DEST}/4kwall/share/icons/icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/com.warlordsoftwares.wallpaper-app-4kwall.png
      - install -Dm644 ${FLATPAK_DEST}/4kwall/share/applications/wallpaper-app-4kwall.desktop ${FLATPAK_DEST}/share/applications/com.warlordsoftwares.wallpaper-app-4kwall.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} ${FLATPAK_DEST}/share/applications/com.warlordsoftwares.wallpaper-app-4kwall.desktop
      - install -Dm644 ${FLATPAK_DEST}/4kwall/share/metainfo/com.warlordsoftwares.wallpaper-app-4kwall.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.warlordsoftwares.wallpaper-app-4kwall.metainfo.xml
    sources:
      - type: archive
        url: https://warlordsoftwares.com/static/app_builds/flatpak/FLATPAK_4KWALL-2026-6-26.tar.gz
        sha256: e14a47a30160d3f5801e5aaae4fca862d8b7103ac03361c34c6fb7d50df9ed42

