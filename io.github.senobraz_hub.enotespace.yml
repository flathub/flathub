id: io.github.senobraz_hub.enotespace
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: enotespace
separate-locales: false
tags:
  - proprietary
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --unset-env=ELECTRON_RUN_AS_NODE
  - --filesystem=xdg-config/gtk-3.0:ro
  - --filesystem=xdg-config/gtk-4.0:ro
  - --filesystem=xdg-data/icons:ro
  - --filesystem=/usr/share/icons:ro
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
modules:
  - name: enotespace
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 enotespace-run.sh /app/bin/enotespace
      - install -Dm644 io.github.senobraz_hub.enotespace.desktop
        /app/share/applications/io.github.senobraz_hub.enotespace.desktop
      - install -Dm644 io.github.senobraz_hub.enotespace.metainfo.xml
        /app/share/metainfo/io.github.senobraz_hub.enotespace.metainfo.xml
      - install -Dm644 io.github.senobraz_hub.enotespace.svg
        /app/share/icons/hicolor/scalable/apps/io.github.senobraz_hub.enotespace.svg
      - install -Dm644 LICENSE.enotespace
        $FLATPAK_DEST/share/licenses/$FLATPAK_ID/LICENSE.enotespace
    sources:
      - type: extra-data
        filename: enotespace.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/senobraz-hub/enotespace/releases/download/v0.4.1/EnoteSpace-Linux-0.4.1.tar.xz
        sha256: e925b34fdd9d240441c88189e7714d973735b04733de2fc0f76b610f6b11bde6
        size: 112616012
      - type: file
        path: apply_extra.sh
      - type: file
        path: enotespace-run.sh
      - type: file
        path: io.github.senobraz_hub.enotespace.desktop
      - type: file
        path: io.github.senobraz_hub.enotespace.metainfo.xml
      - type: file
        path: io.github.senobraz_hub.enotespace.svg
      - type: file
        path: LICENSE.enotespace
