# Generated for Flathub PRs — do not use for local type:dir builds.
# Placeholders replaced by scripts/publish-flathub-podman.sh:
#   https://github.com/manhavn/rust-rdp.git  v0.1.0  96283236ef926c34f83ff2900cb9f5397ce7e7f4

id: com.rustai.rdp
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm18

command: rust-rdp
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm18/bin
  env:
    CARGO_HOME: /run/build/rust-rdp/cargo
    LIBCLANG_PATH: /usr/lib/sdk/llvm18/lib

modules:
  - name: rust-rdp
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/rust-rdp/cargo
    build-commands:
      - install -d /app/bin
      - cargo --offline build --release -p rust-rdp-desktop --verbose
      - install -Dm755 target/release/rust-rdp /app/bin/rust-rdp
      - install -Dm644 flatpak/com.rustai.rdp.desktop /app/share/applications/com.rustai.rdp.desktop
      - install -Dm644 flatpak/com.rustai.rdp.metainfo.xml /app/share/metainfo/com.rustai.rdp.metainfo.xml
      - install -Dm644 desktop/assets/icon.png /app/share/icons/hicolor/256x256/apps/com.rustai.rdp.png
      - install -Dm644 desktop/assets/icon-512.png /app/share/icons/hicolor/512x512/apps/com.rustai.rdp.png
    sources:
      - type: git
        url: https://github.com/manhavn/rust-rdp.git
        tag: v0.1.0
        commit: 96283236ef926c34f83ff2900cb9f5397ce7e7f4
      - generated-sources.json
