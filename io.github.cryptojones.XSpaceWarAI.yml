app-id: io.github.cryptojones.XSpaceWarAI
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: xspacewar-ai

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --device=input

modules:
  - name: xspacewar-ai
    buildsystem: simple
    build-commands:
      - install -Dm755 xspacewar-ai.x86_64 ${FLATPAK_DEST}/bin/xspacewar-ai
      - install -Dm644 io.github.cryptojones.XSpaceWarAI.desktop
          ${FLATPAK_DEST}/share/applications/io.github.cryptojones.XSpaceWarAI.desktop
      - install -Dm644 io.github.cryptojones.XSpaceWarAI.metainfo.xml
          ${FLATPAK_DEST}/share/metainfo/io.github.cryptojones.XSpaceWarAI.metainfo.xml
      - install -Dm644 icon-256.png
          ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.cryptojones.XSpaceWarAI.png
      - install -Dm644 icon-512.png
          ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.cryptojones.XSpaceWarAI.png
    sources:
      - type: archive
        url: https://github.com/CryptoJones/XSpaceWar-AI/releases/download/v2.1.1/xspacewar-ai-linux-x86_64.zip
        sha256: 5986b70f0d740b92091da8310c2c4573494e1c02e0eb391ad019c6a20e4a2075
        strip-components: 0
      - type: file
        path: io.github.cryptojones.XSpaceWarAI.desktop
      - type: file
        path: io.github.cryptojones.XSpaceWarAI.metainfo.xml
      - type: file
        path: icon-256.png
      - type: file
        path: icon-512.png
