id: io.github.ebkr.r2modman
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: r2modman-plus

modules:
  - name: r2modman-plus
    buildsystem: simple
    build-commands:
      - echo "Building local source"

finish-args:
	// Access to flatpak-spawn for steam deck
	--talk-name=org.freedesktop.Flatpak

	// Filesystem access
	--filesystem=home
	--filesystem=/mnt
	--filesystem=host
	--filesystem=~/.var/app/com.valvesoftware.Steam:rw
	--filesystem=~/.local/share/Steam:rw

	// Allows the manager to use IPC - Useful to prevent multiple instances
	--share=ipc

	// Display server permissions
	--socket=x11
	--socket=wayland

	// IO
	--socket=session-bus
	--device=all

	// Network access
	--share=network

	// Additional requirements for Steam
	--socket=pulseaudio
	--socket=system-bus