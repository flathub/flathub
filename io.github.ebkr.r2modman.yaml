id: io.github.ebkr.r2modman
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: io.github.ebkr.r2modman

modules:
  - name: r2modmanPlus
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
    sources:
      - type: git
        url: https://github.com/TB516/flathub-prep.git
        tag: v3.2.14

    build-commands:

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  - --talk-name=org.freedesktop.Flatpak

  - --share=network
  - --share=ipc

  - --filesystem=host
