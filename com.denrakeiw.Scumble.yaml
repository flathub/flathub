app-id: com.denrakeiw.Scumble
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: scumble
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=/tmp
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets

modules:
  - name: scumble
    buildsystem: simple
    build-commands:
      - ar x scumble-0.1.45.deb
      - tar -xf data.tar.*
      - mkdir -p /app/bin /app/lib/scumble /app/share/applications /app/share/metainfo /app/share/icons/hicolor/512x512/apps
      - cp -r opt/Scumble/* /app/lib/scumble/
      - install -Dm755 scumble.sh /app/bin/scumble
      - install -Dm644 com.denrakeiw.Scumble.desktop /app/share/applications/com.denrakeiw.Scumble.desktop
      - install -Dm644 com.denrakeiw.Scumble.metainfo.xml /app/share/metainfo/com.denrakeiw.Scumble.metainfo.xml
      - install -Dm644 usr/share/icons/hicolor/512x512/apps/scumble.png /app/share/icons/hicolor/512x512/apps/com.denrakeiw.Scumble.png
    sources:
      - type: file
        url: https://github.com/DenRakEiw/scumble/releases/download/v0.1.45/scumble-0.1.45.deb
        sha256: e28d15a3dcd336ccdd053fb6f4b8c78574a5d60eb18868e898cc869014362d3b
        only-arches: [x86_64]
      - type: inline
        dest-filename: scumble.sh
        contents: |
          #!/bin/sh
          exec /app/lib/scumble/scumble --ozone-platform-hint=auto "$@"
      - type: inline
        dest-filename: com.denrakeiw.Scumble.desktop
        contents: |
          [Desktop Entry]
          Name=Scumble
          Comment=Desktop editor for AI inpainting with non-destructive layers
          Exec=scumble %U
          Icon=com.denrakeiw.Scumble
          Type=Application
          Terminal=false
          Categories=Graphics;2DGraphics;RasterGraphics;
          MimeType=application/x-scumble;image/png;image/jpeg;image/vnd.adobe.photoshop;image/openraster;
          StartupWMClass=Scumble
      - type: inline
        dest-filename: com.denrakeiw.Scumble.metainfo.xml
        contents: |
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>com.denrakeiw.Scumble</id>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>GPL-3.0-only</project_license>
            <name>Scumble</name>
            <summary>Desktop editor for AI inpainting with non-destructive layers</summary>
            <description>
              <p>
                Scumble is a free, open-source desktop image editor designed to bring a
                traditional non-destructive layer workflow to generative AI inpainting.
                Instead of switching back and forth between web UIs, node graphs, and
                external editors, Scumble unites the entire retouching loop on a single canvas.
              </p>
              <p>Key features:</p>
              <ul>
                <li>Local-first AI orchestration: direct connection to ComfyUI instances or cloud APIs</li>
                <li>Custom tile engine built with WebAssembly SIMD and WebGL2 hardware acceleration</li>
                <li>27 Photoshop-compatible blend modes, tone curves, and color grading wheels</li>
                <li>Built-in ONNX models for prompt segmentation (SAM2) and depth-aware edge snapping</li>
                <li>Full multi-layer PSD and OpenRaster (ORA) export and import</li>
                <li>Integrated Model Context Protocol (MCP) server for external AI agent control</li>
              </ul>
            </description>
            <launchable type="desktop-id">com.denrakeiw.Scumble.desktop</launchable>
            <url type="homepage">https://www.denrakeiw.com/scumble</url>
            <url type="bugtracker">https://github.com/DenRakEiw/scumble/issues</url>
            <url type="vcs-browser">https://github.com/DenRakEiw/scumble</url>
            <developer_name>DenRakEiw</developer_name>
            <categories>
              <category>Graphics</category>
              <category>2DGraphics</category>
              <category>RasterGraphics</category>
            </categories>
            <provides>
              <binary>scumble</binary>
            </provides>
            <content_rating type="oars-1.1" />
            <releases>
              <release version="0.1.45" date="2026-10-10">
                <description>
                  <p>Scumble 0.1.45 release featuring colour grading wheels, 8-channel HSL, new effects layers, and full 27 Photoshop blend mode parity.</p>
                </description>
              </release>
            </releases>
            <screenshots>
              <screenshot type="default">
                <caption>Main canvas editor with non-destructive layers</caption>
                <image>https://raw.githubusercontent.com/DenRakEiw/scumble/main/docs/images/editor.jpg</image>
              </screenshot>
              <screenshot>
                <caption>Multi-layer composition and blend modes</caption>
                <image>https://raw.githubusercontent.com/DenRakEiw/scumble/main/docs/images/layers.jpg</image>
              </screenshot>
              <screenshot>
                <caption>Bilateral edge snapping and prompt-based selection</caption>
                <image>https://raw.githubusercontent.com/DenRakEiw/scumble/main/docs/images/selection.jpg</image>
              </screenshot>
            </screenshots>
          </component>
