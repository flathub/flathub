app-id: online.usepraxis.Praxis
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: praxis
rename-icon: online.usepraxis.Praxis
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto

modules:
  - name: praxis-icon
    buildsystem: simple
    build-commands:
      - install -Dm644 icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/online.usepraxis.Praxis.png
    sources:
      - type: file
        path: icon.png

  - name: praxis
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - ar x Praxis-linux.deb data.tar.xz
      - tar -xf data.tar.xz
      - install -dm755 ${FLATPAK_DEST}/opt/Praxis
      - cp -a opt/Praxis/* ${FLATPAK_DEST}/opt/Praxis/
      - install -Dm755 praxis.sh ${FLATPAK_DEST}/bin/praxis
      - install -Dm644 online.usepraxis.Praxis.desktop ${FLATPAK_DEST}/share/applications/online.usepraxis.Praxis.desktop
      - install -Dm644 online.usepraxis.Praxis.metainfo.xml ${FLATPAK_DEST}/share/metainfo/online.usepraxis.Praxis.metainfo.xml
    sources:
      - type: file
        url: https://github.com/YagoLagrottiBracco/praxis-desktop/releases/download/v2.4.0/Praxis-linux.deb
        sha256: 7d6755ad79e727e41aa8cc080d23513cd7a88b7a1507d6ef872614a35c6421f8
      - type: file
        path: online.usepraxis.Praxis.desktop
      - type: file
        path: online.usepraxis.Praxis.metainfo.xml
      - type: file
        path: praxis.sh
