app-id: com.paterkleomenis.Connected
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: connected-desktop
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.mpris.MediaPlayer2.*
  - --own-name=org.mpris.MediaPlayer2.connected
  - --talk-name=org.kde.StatusNotifierWatcher
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/connected/cargo
    CARGO_NET_OFFLINE: "true"
modules:
  - name: connected
    buildsystem: simple
    build-commands:
      - |
        # Configure cargo to use vendored sources
        mkdir -p .cargo
        cat <<EOF > .cargo/config
        [source.crates-io]
        replace-with = "vendored-sources"

        [source.vendored-sources]
        directory = "cargo/vendor"
        EOF

      - cargo --offline build --release -p connected-desktop

      - install -Dm755 target/release/connected-desktop /app/bin/connected-desktop
      - install -Dm644 com.paterkleomenis.Connected.desktop /app/share/applications/com.paterkleomenis.Connected.desktop
      - install -Dm644 com.paterkleomenis.Connected.metainfo.xml /app/share/metainfo/com.paterkleomenis.Connected.metainfo.xml
      - install -Dm644 com.paterkleomenis.Connected.png /app/share/icons/hicolor/512x512/apps/com.paterkleomenis.Connected.png
    sources:
      - type: git
        url: https://github.com/paterkleomenis/connected.git
        commit: aa34919ade8d490d8febff118b277451438c2a36
      - cargo-sources.json
