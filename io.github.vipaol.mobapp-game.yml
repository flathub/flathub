id: io.github.vipaol.mobapp-game
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk25

command: mobapp-game
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --env=JAVA_HOME=/app/jre
  - --env=SDL_VIDEO_DRIVER=wayland,x11
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin

modules:
  - name: openjdk25
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk25/install.sh

  - name: mobapp-game
    buildsystem: simple
    build-options:
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk25/jvm/openjdk-25
        PATH: /usr/lib/sdk/openjdk25/bin:/usr/bin:/bin
    build-commands:
      - mkdir -p gradle-dist
      - unzip -q gradle-bin.zip -d gradle-dist
      - cd desktop && ../gradle-dist/gradle-9.2.1/bin/gradle --offline --no-daemon jar

      - install -Dm644 desktop/build/libs/mobapp-game-desktop-*.jar /app/share/mobapp-game/mobapp-game-desktop.jar
      - install -Dm755 desktop/packaging/flatpak/mobapp-game /app/bin/mobapp-game
      - install -Dm644 desktop/packaging/freedesktop/io.github.vipaol.mobapp-game.desktop /app/share/applications/io.github.vipaol.mobapp-game.desktop
      - install -Dm644 desktop/packaging/freedesktop/io.github.vipaol.mobapp-game.metainfo.xml /app/share/metainfo/io.github.vipaol.mobapp-game.metainfo.xml
      - install -Dm644 desktop/packaging/freedesktop/io.github.vipaol.mobapp-game.mime.xml /app/share/mime/packages/io.github.vipaol.mobapp-game.xml
      - install -Dm644 desktop/packaging/freedesktop/io.github.vipaol.mobapp-game.png /app/share/icons/hicolor/256x256/apps/io.github.vipaol.mobapp-game.png

      - install -Dm644 lib/EminiPhysicsEngine/LICENSE.txt -t $FLATPAK_DEST/share/licenses/$FLATPAK_ID/EminiPhysicsEngine/
      - install -Dm644 lib/mobapp-framework/LICENSE -t $FLATPAK_DEST/share/licenses/$FLATPAK_ID/mobapp-framework/
      - install -Dm644 lib/mobapp-platform-desktop/LICENSE -t $FLATPAK_DEST/share/licenses/$FLATPAK_ID/mobapp-platform-desktop/

    sources:
      - type: git
        url: https://github.com/vipaoL/mobapp-game.git
        commit: d5f87a6c8bdc5af0bd97528e2477f2f7ada7b0b2
        tag: v0.9.8
        disable-shallow-clone: true

      - flatpak-sources.json

      - type: file
        url: https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
        sha256: 72f44c9f8ebcb1af43838f45ee5c4aa9c5444898b3468ab3f4af7b6076c5bc3f
        dest-filename: gradle-bin.zip
