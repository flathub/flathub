app-id: com.ulak.desktop
runtime: org.kde.Platform
runtime-version: '6.6'
sdk: org.kde.Sdk
command: ulak
modules:
  - name: ulak
    buildsystem: simple
    build-commands:
      # 1. Uygulamanı çalıştırılabilir klasöre ekliyoruz
      - install -D ulak /app/bin/ulak
      - chmod +x /app/bin/ulak
      
      # 2. PyQt5 Arayüzün bulabilmesi için uygulamanın tam yanına ikonu koyuyoruz
      - install -D ulaklo.png /app/bin/ulaklo.png
      
      # 3. Linux sisteminin ikonu görebilmesi için ana klasöre koyuyoruz
      - install -D ulaklo.png /app/share/icons/hicolor/256x256/apps/com.ulak.desktop.png
      
      # 4. Mağaza vitrini ve Başlat menüsü dosyalarını sisteme tanıtıyoruz
      - install -D com.ulak.desktop.desktop /app/share/applications/com.ulak.desktop.desktop
      - install -D com.ulak.desktop.metainfo.xml /app/share/metainfo/com.ulak.desktop.metainfo.xml
    sources:
      - type: archive
        url: "https://algsoft.net.tr/ulak/flatpak/ulak-linux.zip"
        sha256: "fad4344e6de8424896c1c2e333a5021a8ef701efe22c75bfeef1e91aed97c068"
      - type: file
        path: com.ulak.desktop.desktop
      - type: file
        path: com.ulak.desktop.metainfo.xml
