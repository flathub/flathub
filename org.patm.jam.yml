app-id: org.patm.jam
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: patm

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.secrets
  - --env=QT_DIRS=/app/lib

modules:
  - name: libpq
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DWITH_READLINE=OFF
      - -DWITH_ZLIB=ON
      - -DWITHOUT_ZLIB=OFF
    sources:
      - type: archive
        url: https://ftp.postgresql.org/pub/source/v17.2/postgresql-17.2.tar.bz2
        sha256: 16466279f026e527ea7d072a1aeac6aee2af5028f3a8c05c2d4c67b1c1d7d7d6

  - name: mariadb-connector-c
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DWITH_SSL=ON
      - -DWITH_AUTH=ON
      - -DWITH_UNIT_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/mariadb-corporation/mariadb-connector-c/archive/refs/tags/v3.4.1.tar.gz
        sha256: 5c0d0b4a7cdd5c5ef2f2e0c9ec7e5e3b3a4b80c8b8a0bf602e0c0a0e60d6e37a

  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dgtk_doc=false
      - -Dvapi=false
      - -Dwith-pkcs11=gnutls
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.4.tar.xz
        sha256: 1f63e5e07ea5e4787e3a413543b79ec85d4b7c5e25cbb83d92a84e8e440a6286

  - name: patm
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
      - type: dir
        path: .
    post-install:
      - install -Dm644 src/assets/patm-icon.svg /app/share/icons/hicolor/scalable/apps/org.patm.jam.svg
      - install -Dm644 org.patm.jam.desktop /app/share/applications/org.patm.jam.desktop
      - install -Dm644 org.patm.jam.metainfo.xml /app/share/metainfo/org.patm.jam.metainfo.xml
      - mkdir -p /app/share/patm/tools
      - cp -r tools/* /app/share/patm/tools/
