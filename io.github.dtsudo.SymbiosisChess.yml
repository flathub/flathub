app-id: io.github.dtsudo.SymbiosisChess
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
command: run.sh
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
build-options:
  append-path: /usr/lib/sdk/node20/bin
  env:
    NPM_CONFIG_LOGLEVEL: info
modules:
  - name: SymbiosisChess
    buildsystem: simple
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/SymbiosisChess/flatpak-node/cache
        npm_config_cache: /run/build/SymbiosisChess/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      - npm install --offline
      - . ../flatpak-node/electron-builder-arch-args.sh && npm run dist -- $ELECTRON_BUILDER_ARCH_ARGS  --linux --dir
      - cp -a dist/linux*unpacked /app/main
      - install -Dm755 -t /app/bin/ ../run.sh
      - install -Dm644 icon128x128.png /app/share/icons/hicolor/128x128/apps/io.github.dtsudo.SymbiosisChess.png
      - install -Dm644 SymbiosisChess.desktop /app/share/applications/io.github.dtsudo.SymbiosisChess.desktop
      - install -Dm644 SymbiosisChess.metainfo.xml /app/share/metainfo/io.github.dtsudo.SymbiosisChess.metainfo.xml
    subdir: main
    sources:
      - type: git
        url: https://github.com/dtsudo/SymbiosisChess.git
        commit: 227885a73cfff3b9130b56511b687fc33170b397
        tag: v1_03_flatpak
        dest: main
      - generated-sources.json
      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper.sh /app/main/symbiosis-chess --enable-features=UseOzonePlatform,WaylandWindowDecorations --ozone-platform-hint=auto "$@"
