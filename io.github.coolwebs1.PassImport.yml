app-id: io.github.coolwebs1.PassImport
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: op2kp-sync

# Least privilege: no network (the app is offline by design), no devices except GPU rendering,
# and no broad filesystem access. Files are chosen through the file-chooser portal (or dragged in),
# which grants access to just those files. Backups go next to the database when that is permitted,
# otherwise to ~/.var/app/io.github.coolwebs1.PassImport/data/op2kp-sync/backups/.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  # Offline Python dependencies (pinned, with hashes). Regenerate when bumping versions.
  - python3-modules.json

  - name: op2kp
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/coolwebs1/PassImport.git
        tag: v0.1.1
        commit: b98739f768a51662b836f4ccdc2890545598b291
    build-commands:
      - mkdir -p /app/share/op2kp && install -m644 core.py gui.py op2kp.py /app/share/op2kp/
      - install -Dm755 flatpak/op2kp-sync /app/bin/op2kp-sync
      - install -Dm644 flatpak/io.github.coolwebs1.PassImport.desktop -t /app/share/applications/
      - install -Dm644 flatpak/io.github.coolwebs1.PassImport.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 flatpak/io.github.coolwebs1.PassImport.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.coolwebs1.PassImport/
