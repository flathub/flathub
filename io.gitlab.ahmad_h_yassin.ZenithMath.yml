app-id: io.gitlab.ahmad_h_yassin.ZenithMath
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.8'
command: zenithmath

finish-args:
  # Display and windowing (Wayland and X11/XWayland)
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  # System tray integration via StatusNotifierWatcher
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-*
  # App-specific runtime directory for single-instance IPC
  - --filesystem=xdg-run/app/io.gitlab.ahmad_h_yassin.ZenithMath:create

build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: zenithmath
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --no-deps --prefix=/app .
      - install -Dm644 packaging/flatpak/io.gitlab.ahmad_h_yassin.ZenithMath.desktop /app/share/applications/io.gitlab.ahmad_h_yassin.ZenithMath.desktop
      - install -Dm644 packaging/flatpak/io.gitlab.ahmad_h_yassin.ZenithMath.metainfo.xml /app/share/metainfo/io.gitlab.ahmad_h_yassin.ZenithMath.metainfo.xml
      - install -Dm644 src/zenithmath/ui/zenithmath.svg /app/share/icons/hicolor/scalable/apps/io.gitlab.ahmad_h_yassin.ZenithMath.svg
    sources:
      - type: git
        url: https://gitlab.com/Ahmad.H.Yassin/zenithmath.git
        tag: v2.1.0
        commit: 2422aabe2ae5bb62dcd687397021a0f938fa342a
