app-id: org.nextfoxopensg.USBMusicPrep
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
build-options:
  build-args:
    - --share=network
command: usb-music-prep
finish-args:
  - --socket=x11
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --filesystem=host

modules:
  - name: usb-music-prep
    buildsystem: simple
    build-commands:
      # Instalar dependencias de Python
      - python3 -m venv /app/venv
      - /app/venv/bin/pip install --no-cache-dir PySide6 mutagen

      # Instalar ejecutable y wrapper
      - install -D -m 755 generador_usb.py /app/bin/generador_usb.py
      - echo '#!/bin/sh' > /app/bin/usb-music-prep
      - echo 'exec /app/venv/bin/python /app/bin/generador_usb.py "$@"' >> /app/bin/usb-music-prep
      - chmod +x /app/bin/usb-music-prep

      # Instalar icono
      - install -D -m 644 org.nextfoxopensg.USBMusicPrep.png /app/share/icons/hicolor/128x128/apps/org.nextfoxopensg.USBMusicPrep.png

      # Instalar metadatos AppStream
      - install -D -m 644 org.nextfoxopensg.USBMusicPrep.metainfo.xml /app/share/metainfo/org.nextfoxopensg.USBMusicPrep.metainfo.xml

      # Crear acceso directo (.desktop)
      - install -d /app/share/applications
      - echo '[Desktop Entry]' > /app/share/applications/org.nextfoxopensg.USBMusicPrep.desktop
      - echo 'Type=Application' >> /app/share/applications/org.nextfoxopensg.USBMusicPrep.desktop
      - echo 'Name=USB Music Organizer' >> /app/share/applications/org.nextfoxopensg.USBMusicPrep.desktop
      - echo 'Comment=Prepare and organize music for USB drives' >> /app/share/applications/org.nextfoxopensg.USBMusicPrep.desktop
      - echo 'Exec=usb-music-prep' >> /app/share/applications/org.nextfoxopensg.USBMusicPrep.desktop
      - echo 'Icon=org.nextfoxopensg.USBMusicPrep' >> /app/share/applications/org.nextfoxopensg.USBMusicPrep.desktop
      - echo 'Categories=AudioVideo;Audio;Utility;' >> /app/share/applications/org.nextfoxopensg.USBMusicPrep.desktop
      - echo 'Terminal=false' >> /app/share/applications/org.nextfoxopensg.USBMusicPrep.desktop

    sources:
      - type: git
        url: https://github.com/NextFoxOpenSG/USBMusicPrep.git
        branch: main
