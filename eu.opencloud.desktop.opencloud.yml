app-id: eu.opencloud.desktop.opencloud

rename-desktop-file: opencloud.desktop
rename-icon: opencloud

runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk

base: io.qt.qtwebengine.BaseApp
base-version: '6.11'

command: opencloud

finish-args:
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --share=ipc
  - --filesystem=home
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup:
  - /include
  - /lib/*.a
  - /lib/*.la
  - /lib/cmake
  - /lib/x86_64-linux-gnu/pkgconfig
  - /mkspecs
  - /share/doc
  - /share/icons/hicolor/1024x1024
cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: qtkeychain
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
    sources:
      - type: git
        url: https://github.com/frankosterfeld/qtkeychain/
        tag: 0.17.0
        commit: 875f77d9f61bd97fd84cca47ce3bc71186dfbd09

  - name: libre-graph-api
    buildsystem: cmake-ninja
    subdir: client
    sources:
      - type: git
        url: https://github.com/opencloud-eu/libre-graph-api-cpp-qt-client.git
        tag: v1.0.8
        commit: 7a697328c93eea765a1ad5518cc8cd679bc563d4

  - name: KDSingleApplication
    buildsystem: cmake-ninja
    config-opts:
      - -DKDSingleApplication_QT6=true
    sources:
      - type: git
        url: https://github.com/KDAB/KDSingleApplication
        tag: v1.2.1
        commit: b63420aebb78df20e37310bb090f075990a5a4f6

  - name: opencloud-desktop
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/opencloud-eu/desktop.git
        tag: v4.0.0
        commit: 9f701e6db2e101cb3247d3331647a60266e83b0f
