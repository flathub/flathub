app-id: space.flavedo.Flavedo

runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: Flavedo
tags:
  - proprietary

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  - --talk-name=org.freedesktop.secrets
  - --env=GTK_USE_PORTAL=1
  - --filesystem=xdg-run/doc

modules:
  - name: flavedo
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - cp -r app-bundle/* /app/bin/
      - install -Dm644 app-bundle/space.flavedo.Flavedo.desktop /app/share/applications/space.flavedo.Flavedo.desktop
      - install -Dm644 app-bundle/space.flavedo.Flavedo.png /app/share/icons/hicolor/128x128/apps/space.flavedo.Flavedo.png
      - install -Dm644 app-bundle/space.flavedo.Flavedo.metainfo.xml /app/share/metainfo/space.flavedo.Flavedo.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/winrro/space.flavedo.Flavedo/releases/download/v0.4.4/flavedo-linux-x64.tar.gz
        sha256: 489891fe19e64c672dc5556de61b92261e34480acd2a70746c254a9db7830cb2
        dest: app-bundle