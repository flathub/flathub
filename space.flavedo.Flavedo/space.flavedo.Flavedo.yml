app-id: space.flavedo.Flavedo

runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk

command: Flavedo

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  - --talk-name=org.freedesktop.secrets
  - --env=GTK_USE_PORTAL=1
  - --filesystem=xdg-run/doc
  
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures
  - --filesystem=xdg-desktop

  # File access
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures

modules:
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Dvapi=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.7.tar.xz
        sha256: 6b452e4750590a2b5617adc40026f28d2f4903de15f1250e1d1c40bfd68ed55e

  - name: flavedo
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - cp -r app-bundle/* /app/bin/
      - install -Dm644 app-bundle/space.flavedo.Flavedo.desktop /app/share/applications/space.flavedo.Flavedo.desktop
      - install -Dm644 app-bundle/space.flavedo.Flavedo.png /app/share/icons/hicolor/128x128/apps/space.flavedo.Flavedo.png
      - install -Dm644 app-bundle/space.flavedo.Flavedo.metainfo.xml /app/share/metainfo/space.flavedo.Flavedo.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/winrro/space.flavedo.Flavedo/releases/download/v0.4.4/flavedo-linux-x64.tar.gz
        sha256: 489891fe19e64c672dc5556de61b92261e34480acd2a70746c254a9db7830cb2
        dest: app-bundle