id: io.github.Mujtaba1i.Archtoys
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: archtoys
rename-desktop-file: archtoys.desktop
rename-icon: archtoys

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.kde.KWin
  - --talk-name=org.freedesktop.Notifications
  - --system-talk-name=org.freedesktop.login1
  - --filesystem=home
  - --filesystem=xdg-data/kio/servicemenus:create
  - --filesystem=xdg-data/nautilus/scripts:create
  - --filesystem=xdg-data/nemo/actions:create
  - --filesystem=xdg-config/Thunar:create
  - --env=TESSDATA_PREFIX=/app/share/tessdata/
  - --device=dri

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - '*.a'
  - '*.la'
  - /share/doc
  - /share/man

modules:
  - name: leptonica
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
      - -DSW_BUILD=OFF
      - -DBUILD_PROG=OFF
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
        sha256: 'c73363397f96eb1295602bf44d708a994ad42046c791bf03ea0505d829bdb6a7'

  - name: tesseract
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DENABLE_LTO=OFF
      - -DSW_BUILD=OFF
      - -DDISABLE_ARCHIVE=ON
      - -DDISABLE_CURL=ON
      - -DGRAPHICS_DISABLED=ON
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.4.tar.gz
        sha256: 'a8dbf8b8c8ee427ff6ad1d99116502feaf59440af1adb893caf60a6576826cf4'

  - name: tessdata
    buildsystem: simple
    build-commands:
      - install -Dm644 eng.traineddata /app/share/tessdata/eng.traineddata
      - install -Dm644 osd.traineddata /app/share/tessdata/osd.traineddata
      - install -Dm644 LICENSE /app/share/licenses/tessdata/LICENSE
    sources:
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_fast/raw/87416418657359cb625c412a48b6e1d6d41c29bd/eng.traineddata
        sha256: '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2'
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_fast/raw/87416418657359cb625c412a48b6e1d6d41c29bd/osd.traineddata
        sha256: '9cf5d576fcc47564f11265841e5ca839001e7e6f38ff7f7aacf46d15a96b00ff'
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_fast/raw/87416418657359cb625c412a48b6e1d6d41c29bd/LICENSE
        sha256: 'cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30'

  - name: imagemagick
    config-opts:
      - --disable-static
      - --disable-docs
      - --without-x
      - --without-perl
      - --without-magick-plus-plus
      - --with-webp
    sources:
      - type: archive
        url: https://github.com/ImageMagick/ImageMagick/archive/refs/tags/7.1.2-36.tar.gz
        sha256: '5ba807e38a6bcb7c3c96a166485e270c5017aaa6b166f0440dc4b2badf6e6167'

  - name: archtoys
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/archtoys/cargo
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked
      - install -Dm755 target/release/archtoys /app/bin/archtoys
      - install -Dm644 packaging/archtoys.desktop /app/share/applications/archtoys.desktop
      - install -Dm644 packaging/io.github.Mujtaba1i.Archtoys.metainfo.xml /app/share/metainfo/io.github.Mujtaba1i.Archtoys.metainfo.xml
      - for s in 16 32 48 64 128 256 512; do install -Dm644 packaging/archtoys-$s.png /app/share/icons/hicolor/${s}x${s}/apps/archtoys.png; done
    sources:
      - type: git
        url: https://github.com/Mujtaba1i/Archtoys.git
        tag: v0.9.2
        commit: ecfcf3e261718b3120ce0b4475da9038da483810
      - cargo-sources.json
