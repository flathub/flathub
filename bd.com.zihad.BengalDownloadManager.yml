app-id: bd.com.zihad.BengalDownloadManager
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: bengal-download-manager

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem.*
  - --own-name=org.freedesktop.StatusNotifierItem.*
  - --env=QT_QPA_PLATFORMTHEME=xdgdesktopportal

modules:
  - python3-requirements.yaml

  - name: bengal-download-manager
    buildsystem: cmake
    sources:
      - type: archive
        url: https://github.com/tazihad/bengal-download-manager/archive/refs/tags/v0.2.82.tar.gz
        sha256: e1173be479371e6c6b4489e0e93a36b81d5c26923bab0078885f113abdedca26

