app-id: bd.com.zihad.BengalDownloadManager
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: bengal-download-manager

cleanup-commands:
  - /app/cleanup-BaseApp.sh

build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications

modules:
  - python3-requirements.yml

  - name: bengal-download-manager
    buildsystem: cmake
    sources:
      - type: archive
        url: https://github.com/tazihad/bengal-download-manager/archive/refs/tags/v0.2.92.tar.gz
        sha256: 48826570cc7ec74abfba5f42825987bf8e945d9ce67943aba8f487f04843ab9e
