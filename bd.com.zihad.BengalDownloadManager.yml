app-id: bd.com.zihad.BengalDownloadManager
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: bengal-download-manager

cleanup-commands:
  - /app/cleanup-BaseApp.sh

build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  - --env=QT_QPA_PLATFORMTHEME=xdgdesktopportal

modules:
  - python3-requirements.yml

  - name: bengal-download-manager
    buildsystem: cmake
    sources:
      - type: archive
        url: https://github.com/tazihad/bengal-download-manager/archive/refs/tags/v0.2.89.tar.gz
        sha256: 9e05960573b7d2d4b0f2ac61815359b1208ff85c258a06da4b6853d159467a21
