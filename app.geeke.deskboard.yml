id: app.geeke.deskboard
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: deskboard
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  - --socket=pulseaudio   # Need for playing and recording audio.
  - --share=network #Needed for link previews, spotify, youtube, website widgets, Dax 
 
  - --filesystem=home  # Boards are connected to the user's folders and needs all capabilities of a file explorer.
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: deskboard
    buildsystem: simple
    sources:
     
      - type: file
        url: https://deskboard.geeke.app/downloads/linux/Deskboard_0.14.0_amd64.deb
        sha256: f102425a4b6c5e34440f9a8179e0d075e670224ac7f0b6c043852f4bbf279e1d
        dest-filename: deskboard.deb
        only-arches:
          - x86_64
      - type: file
        path: app.geeke.deskboard.desktop
      - type: file
        path: app.geeke.deskboard.metainfo.xml
    build-commands:
      - ar -x deskboard.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/deskboard /app/bin/deskboard
      - install -Dm644 usr/lib/Deskboard/icons/128x128.png /app/lib/Deskboard/icons/128x128.png
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/deskboard.png /app/share/icons/hicolor/32x32/apps/app.geeke.deskboard.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/deskboard.png /app/share/icons/hicolor/128x128/apps/app.geeke.deskboard.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/deskboard.png /app/share/icons/hicolor/256x256/apps/app.geeke.deskboard.png
      - install -Dm644 app.geeke.deskboard.desktop /app/share/applications/app.geeke.deskboard.desktop
      - install -Dm644 app.geeke.deskboard.metainfo.xml /app/share/metainfo/app.geeke.deskboard.metainfo.xml
