app-id: io.github.nyx47rd.AnimeciX
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: animecix
separate-locales: false
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
cleanup:
  - /include
  - /lib/pkgconfig
  - '*.la'
modules:
  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --enable-shared --disable-static --disable-doc --disable-programs --disable-avdevice --disable-postproc --disable-sdl2 --disable-vulkan --disable-ffnvcodec
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n6.1.1
        commit: e38092ef9395d7049f871ef4d5411eb410e283e0

  - name: libass
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz
        sha256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dcplayer=true
      - -Dlibmpv=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dlibarchive=disabled
      - -Dlibbluray=disabled
      - -Ddvdnav=disabled
      - -Dcdda=disabled
      - -Ddvbin=disabled
      - -Drubberband=disabled
      - -Dlibplacebo=disabled
      - -Dvulkan=disabled
      - -Dzimg=disabled
      - -Duchardet=disabled
      - -Dvapoursynth=disabled
      - -Dalsa=disabled
      - -Djack=disabled
      - -Dopenal=disabled
      - -Dsdl2=disabled
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dpdf-build=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.36.0
        commit: f4210f84906c3b00a65fba198c8127b6757b9350

  - name: animecix
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/animecix/cargo
    build-commands:
      - cargo build --release --offline --locked
      - install -Dm755 target/release/animecix -t /app/bin
      - install -Dm644 packaging/flatpak/io.github.nyx47rd.AnimeciX.desktop -t /app/share/applications/
      - install -Dm644 packaging/flatpak/io.github.nyx47rd.AnimeciX.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 assets/icon-64.png /app/share/icons/hicolor/64x64/apps/io.github.nyx47rd.AnimeciX.png
      - install -Dm644 assets/icon-128.png /app/share/icons/hicolor/128x128/apps/io.github.nyx47rd.AnimeciX.png
      - install -Dm644 assets/icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.nyx47rd.AnimeciX.png
      - install -Dm644 assets/icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.nyx47rd.AnimeciX.png
      - mkdir -p /app/share/animecix/assets
      - cp -r assets/upscale /app/share/animecix/assets/
      - chmod -R a-w /app/share/animecix/assets/upscale
    sources:
      - type: git
        url: https://github.com/nyx47rd/animecix.git
        tag: v2.9.5

      - cargo-sources.json
