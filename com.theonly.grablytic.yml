app-id: com.theonly.grablytic
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: grablytic

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --filesystem=xdg-download
  - --device=dri

modules:
  - name: grablytic
    buildsystem: simple
    build-commands:
      - install -Dm755 grablytic /app/bin/grablytic
      - cp -r lib/ /app/lib/
      - cp -r data/ /app/data/
      - install -Dm644 com.theonly.grablytic.desktop /app/share/applications/com.theonly.grablytic.desktop
      - install -Dm644 grablytic.png /app/share/icons/hicolor/512x512/apps/com.theonly.grablytic.png
      - install -Dm644 com.theonly.grablytic.metainfo.xml /app/share/metainfo/com.theonly.grablytic.metainfo.xml
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/OnlyXianzo/Grablytic/releases/download/v0.0.2/grablytic-0.0.2-linux-x64.tar.gz
        sha256: f7d2b31876574637ad7e9c21598c39a8db8811484f77cf1a1425b4e6f928b9f7
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/OnlyXianzo/Grablytic/releases/download/v0.0.2/grablytic-0.0.2-linux-arm64.tar.gz
        sha256: eb81d8a69d485428f16e120a20ec7283e11e92d107035d62580843ac27cf299e
      - type: file
        path: com.theonly.grablytic.desktop
      - type: file
        path: grablytic.png
      - type: file
        path: com.theonly.grablytic.metainfo.xml
