app-id: io.github.garrett_webb.terminalpolyominos
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: terminalpolyominos-gui

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib64/pkgconfig
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc

modules:
  - name: fast-float
    buildsystem: cmake-ninja
    config-opts:
      - -DFASTFLOAT_TEST=OFF
    sources:
      - type: archive
        url: https://github.com/fastfloat/fast_float/archive/refs/tags/v8.2.10.tar.gz
        sha256: 76f958dd97b1cf4d8862d1f0986a47d4bdfa8845252bae15ef0f40de3b95961f

  - name: vte
    buildsystem: meson
    config-opts:
      - -Dglade=false
      - -Dgtk3=false
      - -Dgtk4=true
      - -Dvapi=false
      - -Dicu=false
      - -Dgir=false
      - -Ddocs=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/vte/0.84/vte-0.84.1.tar.xz
        sha256: aca1caa8478aebcdbb1d67897fb3511eb7601debae6810e16a15b6fa25f31ac8

  - name: terminalpolyominos
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DTP_BUILD_GUI=ON
    sources:
      - type: git
        url: https://github.com/Garrett-Webb/terminalpolyominos.git
        tag: v0.5.4
        commit: 4006c785545a79ee8b7b0c727a5584cde92b7260
