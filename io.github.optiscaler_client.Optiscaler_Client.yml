app-id: io.github.optiscaler_client.Optiscaler_Client
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: OptiscalerClient
finish-args:
  - --share=ipc
  - --share=network
  # Avalonia 11 has no Wayland backend: it always needs X11 (XWayland on Wayland sessions)
  - --socket=x11
  - --device=dri
  # Game libraries the scanners read, and where OptiScaler files are installed into games
  - --filesystem=~/.local/share/Steam
  - --filesystem=~/.steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam/.local/share/Steam
  - --filesystem=~/.config/heroic:ro
  - --filesystem=~/.var/app/com.heroicgameslauncher.hgl/config/heroic:ro
  - --filesystem=~/Games
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=/run/media

build-options:
  append-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

modules:
  - name: optiscaler-client
    buildsystem: simple
    build-commands:
      - dotnet publish OptiscalerClient.csproj -c Release -r linux-x64 --self-contained true
        -p:PublishSingleFile=true -p:PublishReadyToRun=true --source ./nuget-sources -o /app/bin
      - install -Dm644 io.github.optiscaler_client.Optiscaler_Client.desktop -t /app/share/applications
      - install -Dm644 io.github.optiscaler_client.Optiscaler_Client.metainfo.xml -t /app/share/metainfo
      - install -Dm644 io.github.optiscaler_client.Optiscaler_Client.png -t /app/share/icons/hicolor/256x256/apps
    sources:
      - type: git
        url: https://github.com/Optiscaler-Client/Optiscaler-Client.git
        tag: OptiscalerClient-1.0.8
        commit: 1a4135de7fce2ea87b37404b533ba2949e40a173
        # Flathub's update bot opens a PR (tag + commit + metainfo release) for each new tag
        x-checker-data:
          type: git
          tag-pattern: ^OptiscalerClient-([\d.]+)$
          is-main-source: true
      - nuget-sources.json
      - type: file
        path: io.github.optiscaler_client.Optiscaler_Client.desktop
      - type: file
        path: io.github.optiscaler_client.Optiscaler_Client.metainfo.xml
      - type: file
        path: io.github.optiscaler_client.Optiscaler_Client.png
