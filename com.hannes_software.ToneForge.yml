id: com.hannes_software.ToneForge
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: tone-forge

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio

modules:
  - name: tone-forge
    buildsystem: simple
    build-commands:
      - ar x tone-forge.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/tone-forge /app/bin/tone-forge
      - install -Dm644 usr/share/icons/hicolor/256x256/apps/tone-forge.png /app/share/icons/hicolor/256x256/apps/com.hannes_software.ToneForge.png
      - install -Dm644 com.hannes_software.ToneForge.desktop /app/share/applications/com.hannes_software.ToneForge.desktop
      - install -Dm644 com.hannes_software.ToneForge.metainfo.xml /app/share/metainfo/com.hannes_software.ToneForge.metainfo.xml
      - install -Dm644 usr/share/doc/tone-forge/LICENSE-HANNES-SOFTWARE /app/share/licenses/com.hannes_software.ToneForge/LICENSE
      - install -Dm644 usr/share/doc/tone-forge/THIRD-PARTY-NOTICE.txt /app/share/licenses/com.hannes_software.ToneForge/THIRD-PARTY-NOTICE.txt
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/hannes-wan/tone-forge-official/releases/download/v0.1.2/tone-forge-0.1.2-linux-x64.deb
        sha256: a30d738848972264d501902dc87387a9ac43025b5a399e083a10e3de901424f5
        dest-filename: tone-forge.deb
        x-checker-data:
          type: json
          url: https://api.github.com/repos/hannes-wan/tone-forge-official/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | endswith("-linux-x64.deb")) | .browser_download_url
      - type: file
        path: com.hannes_software.ToneForge.desktop
      - type: file
        path: com.hannes_software.ToneForge.metainfo.xml
