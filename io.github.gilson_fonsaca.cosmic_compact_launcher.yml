app-id: io.github.gilson_fonsaca.cosmic_compact_launcher
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/app/bin
  env:
    CARGO_HOME: /run/build/compact_launcher/cargo
command: compact_launcher
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=session-bus
modules:
  - name: just
    buildsystem: simple
    build-commands:
      - install -Dm755 just /app/bin/just
    sources:
      - type: archive
        url: https://github.com/casey/just/releases/download/1.36.0/just-1.36.0-x86_64-unknown-linux-musl.tar.gz
        sha256: bc7c9f377944f8de9cd0418b11d2955adebfa25a488c0b5e3dd2d2c0e9d732da
        strip-components: 0

  - name: compact_launcher
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - just build-release --offline || cargo build --release --offline
      - just rootdir=/app prefix= install || true
      - gtk-update-icon-cache -qtf /app/share/icons/hicolor 2>/dev/null || true
    sources:
      - type: git
        url: https://github.com/gilson-fonsaca/cosmic_compact_launcher.git
        tag: v0.1.0
      - type: file
        path: cargo-sources.json
