app-id: io.github.sc_software_tools.sc_utility_suite_dist.HeicStudio
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: sc-heic-studio
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.secrets
modules:
  - name: sc-heic-studio
    buildsystem: simple
    build-commands:
      - mkdir -p /app/HeicStudio && cp -r . /app/HeicStudio/ && rm -f /app/HeicStudio/*.pdb /app/HeicStudio/*.desktop /app/HeicStudio/*.svg
      - install -Dm755 sc-heic-studio.sh /app/bin/sc-heic-studio
      - install -Dm644 sc-heic-studio.svg /app/share/icons/hicolor/scalable/apps/io.github.sc_software_tools.sc_utility_suite_dist.HeicStudio.svg
      - desktop-file-edit --set-key=Exec --set-value='sc-heic-studio %F' --set-icon=io.github.sc_software_tools.sc_utility_suite_dist.HeicStudio --set-key=StartupWMClass --set-value=HeicStudio.Desktop sc-heic-studio.desktop && install -Dm644 sc-heic-studio.desktop /app/share/applications/io.github.sc_software_tools.sc_utility_suite_dist.HeicStudio.desktop
      - install -Dm644 io.github.sc_software_tools.sc_utility_suite_dist.HeicStudio.metainfo.xml /app/share/metainfo/io.github.sc_software_tools.sc_utility_suite_dist.HeicStudio.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/sc-software-tools/sc-utility-suite-dist/releases/download/suite-v1.1.2/HeicStudio-1.1.2-linux-x64.tar.gz
        sha256: 30b4392a25bebc4bce1a6ff6b5081aca35be74fe9b3bf4eb081d9e57863bed27
        strip-components: 1
      - type: file
        path: sc-heic-studio.sh
      - type: file
        path: io.github.sc_software_tools.sc_utility_suite_dist.HeicStudio.metainfo.xml
