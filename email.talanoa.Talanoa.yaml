app-id: email.talanoa.Talanoa
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: talanoa
separate-locales: false
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=fallback-x11
  - --socket=wayland

  # Filesystems
  - --filesystem=xdg-download

  # D-Bus Access
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets

  # System D-Bus Access
  - --system-talk-name=org.freedesktop.login1
modules:
  - name: talanoa
    buildsystem: simple
    build-commands:
      - cp -a talanoa ${FLATPAK_DEST}/talanoa
      - rm ${FLATPAK_DEST}/talanoa/chrome-sandbox
      - patch-electron-desktop-filename --desktop-filename ${FLATPAK_ID} ${FLATPAK_DEST}/talanoa/resources/app.asar
      - install -Dm755 talanoa.sh ${FLATPAK_DEST}/bin/talanoa
      - install -Dm644 ${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 ${FLATPAK_ID}.png -t ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dm644 talanoa/LICENSE talanoa/LICENSES.chromium.html -t ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}
    sources:
      - type: archive
        url: https://github.com/talanoa-email/desktop-releases/releases/download/v1.3.0/Talanoa-linux-x64-1.3.0.zip
        sha256: 024ce6b9cd577fcfe2440b8f69929f1d135c9735c02eca4f20fdadae474c7177
        dest: talanoa
        x-checker-data:
          type: github
          repo: talanoa-email/desktop-releases
          tag-pattern: ^v([0-9.]+)$
          asset-name: Talanoa-linux-x64-${version}.zip
          is-main-source: true
      - type: file
        path: talanoa.sh
      - type: archive
        url: https://github.com/talanoa-email/desktop-releases/releases/download/v1.3.0/talanoa-1.3.0-desktop-metadata.tar.gz
        sha256: 30269b23a859e703b54a0a11ebc8e5b7a6213b2e74ed11d0faa133e0d1a973e9
        strip-components: 0
        x-checker-data:
          type: github
          repo: talanoa-email/desktop-releases
          tag-pattern: ^v([0-9.]+)$
          asset-name: talanoa-${version}-desktop-metadata.tar.gz