app-id: email.talanoa.Talanoa
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: talanoa
separate-locales: false
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=fallback-x11
  - --socket=wayland

  # Filesystems
  - --filesystem=xdg-download

  # D-Bus Access
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets

  # System D-Bus Access
  - --system-talk-name=org.freedesktop.login1
modules:
  - name: talanoa
    buildsystem: simple
    build-commands:
      - cp -a talanoa ${FLATPAK_DEST}/talanoa
      - rm ${FLATPAK_DEST}/talanoa/chrome-sandbox
      - patch-electron-desktop-filename --desktop-filename ${FLATPAK_ID} ${FLATPAK_DEST}/talanoa/resources/app.asar
      - install -Dm755 talanoa.sh ${FLATPAK_DEST}/bin/talanoa
      - install -Dm644 ${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 ${FLATPAK_ID}.png -t ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dm644 talanoa/LICENSE talanoa/LICENSES.chromium.html -t ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}
    sources:
      - type: archive
        url: https://github.com/talanoa-email/desktop-releases/releases/download/v1.2.2/Talanoa-linux-x64-1.2.2.zip
        sha256: 6c7cfc0d39b3b91fa57e80c8dee3a91701ae0f8a16877f1972b9e26610ff9fa4
        dest: talanoa
        only-arches:
          - x86_64
        x-checker-data:
          type: github
          repo: talanoa-email/desktop-releases
          tag-pattern: ^v([0-9.]+)$
          asset-name: Talanoa-linux-x64-${version}.zip
          is-main-source: true
      - type: file
        path: talanoa.sh
      - type: file
        path: email.talanoa.Talanoa.desktop
      - type: file
        path: email.talanoa.Talanoa.png
      - type: file
        path: email.talanoa.Talanoa.metainfo.xml