app-id: org.guldasta.cutecutpro
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: cutecut-pro
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --device=all
  - --filesystem=host
modules:
  - name: cutecut-pro
    buildsystem: simple
    build-commands:
      - install -Dm755 cutecut-pro /app/bin/cutecut-pro
    sources:
      - type: archive
        url: https://github.com/guldastaislamorquran-dotcom/cutecut-pro/archive/refs/tags/v2.3.8.tar.gz
        sha256: 3a985f3964927f8045e7fdf139bcf469950d8f07ef78921200df1dbb5b9c7a2b
