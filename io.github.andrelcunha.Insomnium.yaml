app-id: io.github.andrelcunha.Insomnium
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: run.sh
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --filesystem=home
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

build-options:
  append-path: /usr/lib/sdk/node22/bin
  env:
    NPM_CONFIG_LOGLEVEL: info

modules:
  - name: insomnium
    buildsystem: simple
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/insomnium/flatpak-node/cache
        npm_config_cache: /run/build/insomnium/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      # Install npm deps; skip postinstall (node-libcurl binary is handled below)
      - npm install --ignore-scripts

      # Place the pre-built node-libcurl native binary
      - tar -xf node_libcurl-v3.1.0-electron-v38.0-linux-x64-glibc.tar.gz
          -C node_modules/@getinsomnia/node-libcurl/lib/

      # Build TypeScript / Vite sources
      - npm run build --workspace=packages/insomnia

      # Package with electron-builder (unpacked dir, no installer)
      - |
        . flatpak-node/electron-builder-arch-args.sh
        USE_HARD_LINKS=false node_modules/.bin/electron-builder \
          --projectDir packages/insomnia \
          --config electron-builder.config.js \
          $ELECTRON_BUILDER_ARCH_ARGS --linux --dir

      # Install app bundle
      - cp -ra packages/insomnia/dist/linux-unpacked /app/main

      # Install launcher wrapper
      - install -Dm755 -t /app/bin/ run.sh

      # Install AppStream metadata
      - install -Dm644 io.github.andrelcunha.Insomnium.metainfo.xml
          /app/share/metainfo/io.github.andrelcunha.Insomnium.metainfo.xml

      # Install desktop entry
      - install -Dm644 io.github.andrelcunha.Insomnium.desktop
          /app/share/applications/io.github.andrelcunha.Insomnium.desktop

      # Install icons
      - install -Dm644 packages/insomnia/src/icons/256x256.png
          /app/share/icons/hicolor/256x256/apps/io.github.andrelcunha.Insomnium.png
      - install -Dm644 packages/insomnia/src/icons/512x512.png
          /app/share/icons/hicolor/512x512/apps/io.github.andrelcunha.Insomnium.png

      # Install license
      - install -Dm644 LICENSE
          /app/share/licenses/io.github.andrelcunha.Insomnium/LICENSE

    sources:
      - type: git
        url: https://github.com/andrelcunha/insomnium
        tag: core@0.3.0-alpha.0
        commit: c225766df1ada22e16021444884a16d0ddb2e4f2

      # Pre-built node-libcurl native binary (libcurl is statically linked inside)
      # node-pre-gyp downloads this at install time; we pre-fetch it instead
      # and skip postinstall scripts with --ignore-scripts
      - type: file
        url: https://github.com/Kong/node-libcurl/releases/download/v3.1.0/node_libcurl-v3.1.0-electron-v38.0-linux-x64-glibc.tar.gz
        sha256: bc8fc73900d0b3e665d92054376cac8ccb8145aeb6750f11ff4d6c8c94a20432

      # Offline npm sources generated by flatpak-node-generator
      - generated-sources.json

      # Local files included in the Flathub submission
      - type: file
        path: io.github.andrelcunha.Insomnium.metainfo.xml
      - type: file
        path: io.github.andrelcunha.Insomnium.desktop

      # Launcher: wraps the Electron binary for the Flatpak sandbox
      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper.sh /app/main/insomnium "$@"
