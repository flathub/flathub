id: com.glitchedpolygons.Argon2GUI
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: argon2gui

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland

modules:
  - name: argon2gui
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://codeberg.org/GlitchedPolygons/Argon2GUI.git
        tag: 1.0.2
        commit: c8ec769ef6f4f029fa5ead6188d8a10c80fb3c72
