id: com.wakunguma.Mukwa
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: mukwa
rename-icon: mukwa
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.a11y.Bus
build-options:
  append-path: "/usr/lib/sdk/rust-stable/bin"
modules:
  - name: mukwa
    buildsystem: simple
    build-options:
      no-debuginfo: true
      env:
        CARGO_HOME: /run/build/mukwa/cargo
        CARGO_NET_OFFLINE: 'true'
        SKIA_BINARIES_URL: file:///run/build/mukwa/skia-binaries.tar.gz
    build-commands:
      - cargo fetch --offline
      - cargo build --offline -r -p mukwa
      - install -Dm755 target/release/mukwa /app/bin/mukwa
      - install -Dm644 crates/mukwa/resources/icons/app-icon.svg /app/share/icons/hicolor/scalable/apps/mukwa.svg
      - install -Dm644 crates/mukwa/resources/mukwa.desktop /app/share/applications/com.wakunguma.Mukwa.desktop
      - install -Dm644 crates/mukwa/resources/mukwa.metainfo.xml /app/share/metainfo/com.wakunguma.Mukwa.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/snubwoody/mukwa/archive/refs/tags/v0.2.4.tar.gz
        sha256: 1fc69057e316cb1a34d58849385e4e4665709f56300f356d9f7d6002890a668e
      - type: file
        url: https://github.com/rust-skia/skia-binaries/releases/download/0.153.3/skia-binaries-b7f043e0b1e2a850e702-x86_64-unknown-linux-gnu-ganesh-gl-jpegd-jpege-pdf-vulkan.tar.gz
        dest-filename: skia-binaries.tar.gz
        sha256: 9ebe4c448cc9f789bad241cbd11739cdf759e27db5719c23a7635e096d5807b3
        only-arches:
          - x86_64
      - type: file
        url: https://github.com/rust-skia/skia-binaries/releases/download/0.153.3/skia-binaries-b7f043e0b1e2a850e702-aarch64-unknown-linux-gnu-ganesh-gl-jpegd-jpege-pdf-vulkan.tar.gz
        dest-filename: skia-binaries.tar.gz
        sha256: 82da2256fd0ce9419527f72ca4e9858a13c14d23073da1e618dc596397f65560
        only-arches:
          - aarch64
      - cargo-sources.json
