id: net.blip.Blip
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: blip
finish-args:
  # Needed to run under XWayland because AWT/Compose has no Wayland backend yet; DRI enables hardware-accelerated OpenGL
  - --share=ipc
  - --socket=x11
  - --device=dri
  # Needed for playing sound effects
  - --socket=pulseaudio
  - --share=network
  # Needed to send files and resume transfers across app restarts. Portal access for pasted and dropped files is temporary,
  # and staging potentially large files would duplicate user data. Access is limited to the home directory and standard
  # mount locations used by external drives and network shares such as NAS
  - --filesystem=home:ro
  - --filesystem=/media:ro
  - --filesystem=/run/media:ro
  - --filesystem=/mnt:ro
  # Needed to register a status notifier item where supported
  - --talk-name=org.kde.StatusNotifierWatcher
  # Needed to provide quick file manager actions for received files, like reveal in folder and show info
  - --talk-name=org.freedesktop.FileManager1
  - --env=LD_LIBRARY_PATH=/app/lib/runtime/lib/server
modules:
  - name: blip
    buildsystem: simple
    build-commands:
      - cp -r bin $FLATPAK_DEST/bin
      - cp -r lib $FLATPAK_DEST/lib
      - cp -r share $FLATPAK_DEST/share
      - install -Dm644 lib/app/LICENSE.txt $FLATPAK_DEST/share/licenses/$FLATPAK_ID/blip/LICENSE.txt
      - rm $FLATPAK_DEST/lib/app/LICENSE.txt
      - rm -rf $FLATPAK_DEST/share/icons/hicolor/1024x1024  # max. size 512x512
    sources:
      - type: archive
        url: https://static.blip.net/linux/blip-1.2.0-linux-amd64.tar.gz
        sha256: c8fdb2910b59d6cc0984162b665902127528e28c47c01719c04af17e6e836340
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://static.blip.net/linux/latest.json
          version-query: .version
          url-query: '.files["linux-amd64"].url'
          is-main-source: true
      - type: archive
        url: https://static.blip.net/linux/blip-1.2.0-linux-aarch64.tar.gz
        sha256: ff445c02a4edca8e89298ce2d45f120a6795feaba108ae5d2fca72a5d875fa41
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://static.blip.net/linux/latest.json
          version-query: .version
          url-query: '.files["linux-aarch64"].url'
          is-main-source: false
