app-id: com.sillydevs.letramania
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: LETRAMANIA.x86_64

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: letramania
    buildsystem: simple
    build-commands:
      - install -D LETRAMANIA.x86_64 /app/bin/LETRAMANIA.x86_64
      - install -D com.sillydevs.letramania.desktop /app/share/applications/com.sillydevs.letramania.desktop
      - install -D com.sillydevs.letramania.png /app/share/icons/hicolor/256x256/apps/com.sillydevs.letramania.png
      - install -D com.sillydevs.letramania.metainfo.xml /app/share/metainfo/com.sillydevs.letramania.metainfo.xml
    sources:
      - type: file
        url: https://github.com/ssamueliuss/sopadeletras/releases/download/1.0.0/LETRAMANIA.x86_64
        sha256: 13be67843c26699f57adf450190cd83ed26ed296754be86b168617975f2d1739
      - type: file
        path: com.sillydevs.letramania.desktop
      - type: file
        path: com.sillydevs.letramania.png
      - type: file
        path: com.sillydevs.letramania.metainfo.xml
