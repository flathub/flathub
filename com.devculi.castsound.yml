app-id: com.devculi.castsound
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: castsound
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=xdg-run/pipewire-0
modules:
  - name: castsound
    buildsystem: simple
    build-commands:
      - install -Dm755 castsound /app/bin/castsound
      - |
        sed -i \
          -e 's/^Icon=.*/Icon=com.devculi.castsound/' \
          -e 's/^Exec=.*/Exec=castsound %u/' \
          com.devculi.castsound.desktop
      - install -Dm644 com.devculi.castsound.desktop /app/share/applications/com.devculi.castsound.desktop
      - install -Dm644 com.devculi.castsound.metainfo.xml /app/share/metainfo/com.devculi.castsound.metainfo.xml
      - |
        for size in 16 32 48 64 128 256 512; do
          install -Dm644 icon-${size}.png /app/share/icons/hicolor/${size}x${size}/apps/com.devculi.castsound.png
        done
      - install -Dm644 LICENSE /app/share/licenses/com.devculi.castsound/LICENSE
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/CastSound/CastSound-Desktop/releases/download/v0.1.0/CastSound-0.1.0-linux-x86_64.tar.gz
        sha256: 6b127e9cb4e7063adbc7b5e0a7e941e5b5d9709b82747ead10ca0922cab9d1a5
        strip-components: 0
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/CastSound/CastSound-Desktop/releases/download/v0.1.0/CastSound-0.1.0-linux-aarch64.tar.gz
        sha256: 73952e65f996bf196c7f7f941e3842b332f90626dd0e3f6d7ae773f502b6c371
        strip-components: 0
      - type: file
        path: com.devculi.castsound.metainfo.xml
