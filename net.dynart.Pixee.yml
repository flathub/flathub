# Flatpak manifest for Pixee.
#
# Local build and run:
#   flatpak install flathub org.kde.Platform//6.11 org.kde.Sdk//6.11
#   flatpak-builder --user --install --force-clean build packaging/net.dynart.Pixee.yml
#   flatpak run net.dynart.Pixee
#
# For a Flathub submission this file is copied to the flathub/flathub repo as
# net.dynart.Pixee.yml, with the `sources` block below switched from the local
# directory to the release tarball — see docs/flatpak.md.

app-id: net.dynart.Pixee
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: Pixee

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # Pixee is an image *manager*: it browses the filesystem through its own
  # folder tree and copies, moves and renames files across it. The document
  # portal hands over one file at a time, which cannot express that, so host
  # access is the feature rather than a convenience.
  - --filesystem=host

  # Network shares mounted by the desktop (GVfs) — browsing an SMB share is a
  # first-class case for this app.
  - --filesystem=xdg-run/gvfs

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: pixee
    buildsystem: qmake
    config-opts:
      - PREFIX=/app
    sources:
      # Local build. For Flathub, replace with the release tarball:
      #   - type: archive
      #     url: https://github.com/DynartInteractive/Pixee/archive/refs/tags/vX.Y.Z.tar.gz
      #     sha256: <sha256 of that tarball>
      - type: archive
        url: https://github.com/DynartInteractive/Pixee/archive/refs/tags/v0.5.0.tar.gz
        sha256: f53926141b58f19a17500b477c6245c6854eda0fbb6483907f213ed7b00a6d67
