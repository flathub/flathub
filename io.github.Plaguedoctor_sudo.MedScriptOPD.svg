<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Inner Soft Glow Border -->
  <rect x="34" y="34" width="444" height="444" rx="102" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />

  <!-- Medical Cross / Pulse Center Background -->
  <g transform="translate(256, 256)">
    <!-- Subtle circular pulse backing -->
    <circle r="148" fill="#ffffff" fill-opacity="0.08" />
    <circle r="112" fill="#ffffff" fill-opacity="0.1" />

    <!-- Medical Rx Symbol -->
    <!-- Letter 'R' -->
    <path d="M -90,-80 L -90,70 M -90,-80 L -30,-80 C 5,-80 20,-65 20,-35 C 20,-5 5,10 -30,10 L -90,10 M -20,10 L 25,70" 
          fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Letter 'x' (crossed leg) -->
    <path d="M 5,30 L 45,70 M 45,30 L 5,70" 
          fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" />

    <!-- Stethoscope Accent Circle (Right) -->
    <circle cx="85" cy="-25" r="26" fill="none" stroke="#ffffff" stroke-width="16" />
    <path d="M 85,-51 C 120,-51 145,-20 145,20 C 145,65 110,85 75,85" 
          fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />

    <!-- Vital Pulse Accent (Bottom horizontal rhythm) -->
    <path d="M -110,120 L -45,120 L -25,95 L 0,145 L 20,105 L 35,120 L 110,120" 
          fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
