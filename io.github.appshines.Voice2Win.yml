# Flatpak manifest for Voice2Win. Repackages the self-contained linux-x64 bundle
# from the GitHub release; nothing is compiled during the Flatpak build.
app-id: io.github.appshines.Voice2Win
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: voice2win
finish-args:
  # Full X11 access (not fallback-x11): global dictation shortcuts and typing the
  # recognized text into other applications' windows require X11-level input
  # injection, which the Wayland protocol deliberately does not offer.
  - --share=ipc
  - --socket=x11
  # Microphone input and audio signals.
  - --socket=pulseaudio
  # GPU (Vulkan) acceleration for Whisper transcription and Gemma AI processing.
  - --device=dri
  # AI model downloads plus smartphone/companion connections on the local network.
  - --share=network
  # Voice commands can open user files and folders anywhere on the system.
  - --filesystem=host
  # Voice commands can launch other programs on the host.
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: voice2win
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/voice2win
      - cp -a app/. /app/lib/voice2win/
      - install -Dm755 voice2win-launcher.sh /app/bin/voice2win
      - install -Dm644 io.github.appshines.Voice2Win.desktop /app/share/applications/io.github.appshines.Voice2Win.desktop
      - install -Dm644 io.github.appshines.Voice2Win.png /app/share/icons/hicolor/512x512/apps/io.github.appshines.Voice2Win.png
      - install -Dm644 io.github.appshines.Voice2Win.metainfo.xml /app/share/metainfo/io.github.appshines.Voice2Win.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/Appshines/Voice2Win/releases/download/v3.4.0/Voice2Win-3.4.0-linux-x64.tar.gz
        sha256: 4eb414d78b1fa3ce50d80dbcd03fe9dca1a5018e6f03878e6b7e32f25ba88149
        dest: app
      - type: file
        path: voice2win-launcher.sh
      - type: file
        path: io.github.appshines.Voice2Win.desktop
      - type: file
        path: io.github.appshines.Voice2Win.png
      - type: file
        path: io.github.appshines.Voice2Win.metainfo.xml
