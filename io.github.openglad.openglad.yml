app-id: io.github.openglad.openglad
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: openglad

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /lib/*.a
  - /lib/*.la
  - /share/aclocal
  - /share/man
  - /share/doc
  - /share/gtk-doc

modules:
  - shared-modules/physfs/physfs.json

  - name: libyaml
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/yaml/libyaml/releases/download/0.2.5/yaml-0.2.5.tar.gz
        sha256: c642ae9b75fee120b2d96c712538bd2cf283228d2337df2cf2988e3c02678ef4

  - name: libzip
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
      - -DENABLE_COMMONCRYPTO=OFF
      - -DENABLE_GNUTLS=OFF
      - -DENABLE_MBEDTLS=OFF
      - -DENABLE_OPENSSL=OFF
      - -DENABLE_WINDOWS_CRYPTO=OFF
      - -DENABLE_BZIP2=OFF
      - -DENABLE_LZMA=OFF
      - -DENABLE_ZSTD=OFF
      - -DBUILD_TOOLS=OFF
      - -DBUILD_REGRESS=OFF
      - -DBUILD_OSSFUZZ=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_DOC=OFF
    sources:
      - type: archive
        url: https://libzip.org/download/libzip-1.11.4.tar.xz
        sha256: 8a247f57d1e3e6f6d11413b12a6f28a9d388de110adc0ec608d893180ed7097b

  - name: ixwebsocket
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_DEMO=OFF
      - -DUSE_TLS=ON
      - -DUSE_OPEN_SSL=ON
      - -DUSE_ZLIB=OFF
      - -DIXWEBSOCKET_INSTALL=ON
    sources:
      - type: git
        url: https://github.com/machinezone/IXWebSocket.git
        commit: 64fae7676bd8fe31f7cb4bcde7a6841892dad65e

  - name: openglad
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_C_FLAGS=-I/app/include
      - -DCMAKE_CXX_FLAGS=-I/app/include
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_INSTALL_BINDIR=lib/openglad
      - -DCMAKE_INSTALL_DATADIR=lib
      - -DBUILD_TESTING=OFF
      - -DBUILD_EDITOR=ON
      - -DOPENGLAD_INSTALL_ASSETS=ON
      - -DOPENGLAD_USE_SYSTEM_DEPS=ON
      - -DOPENGLAD_FETCH_ZLIB=OFF
      - -DOPENGLAD_FETCH_LIBYAML=OFF
      - -DOPENGLAD_FETCH_LIBZIP=OFF
      - -DOPENGLAD_FETCH_PHYSFS=OFF
      - -DOPENGLAD_FETCH_SDL3=OFF
      - -DOPENGLAD_USE_PACKAGED_IXWEBSOCKET=ON
      - -DOPENGLAD_FETCH_IXWEBSOCKET=OFF
      - -DOPENGLAD_FETCH_LODEPNG=ON
      - -DFETCHCONTENT_SOURCE_DIR_LODEPNG=/run/build/openglad/deps/lodepng
      - -DFETCHCONTENT_SOURCE_DIR_LUA=/run/build/openglad/deps/lua
      - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - -DOPENGLAD_COMMIT_COUNT=1084
      - -DOPENGLAD_GIT_HASH=e72a55c2
    post-install:
      - cp -r /run/build/openglad/packs /app/lib/openglad/packs
      - install -d /app/bin
      - ln -s ../lib/openglad/openglad /app/bin/openglad
      - ln -s ../lib/openglad/openscen /app/bin/openscen
      - install -Dm644 /run/build/openglad/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 /run/build/openglad/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 /run/build/openglad/${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: git
        url: https://github.com/openglad/openglad.git
        tag: v2.1084
        commit: e72a55c2287d96681676e4ab03a97d40039aed46
      - type: git
        url: https://github.com/lua/lua.git
        tag: v5.4.8
        commit: 6e22fedb74cf0c9b6656e9fce8b7331db847c605
        dest: deps/lua
      - type: git
        url: https://github.com/lvandeve/lodepng.git
        commit: ed6fe5825c6a4fbb7f58ab35a4231c7543cd452a
        dest: deps/lodepng
      - type: file
        path: io.github.openglad.openglad.desktop
      - type: file
        path: io.github.openglad.openglad.metainfo.xml
      - type: file
        path: io.github.openglad.openglad.svg
