app-id: io.github.menacing_aura.ConakeBrowser
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: conake-browser
separate-locales: false

sdk-extensions:
  - org.freedesktop.Sdk.Extension.nodejs22

finish-args:
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.secrets
  - --persist=.conake-browser
  - --filesystem=xdg-download:rw
  - --filesystem=xdg-run/pipewire-0

modules:
  - name: conake-browser-electron
    buildsystem: simple
    build-commands:
      - install -Dm755 electron-launch ${FLATPAK_DEST}/bin/conake-browser
      - cp -r conake-browser-app/* ${FLATPAK_DEST}/