app-id: org.cutwire.Drift
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: drift

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/aclocal
  - /share/doc
  - /share/man
  - "*.a"
  - "*.la"

modules:
  - name: onnxruntime-headers
    buildsystem: simple
    build-commands:
      - install -d ${FLATPAK_DEST}/include
      - cp -a include/. ${FLATPAK_DEST}/include/
    sources:
      - type: archive
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.27.0/onnxruntime-linux-x64-1.27.0.tgz
        sha256: 547e40a48f1fe73e3f812d7c88a948612c23f896b91e4e2ee1e232d7b468246f
        strip-components: 1
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.27.0/onnxruntime-linux-aarch64-1.27.0.tgz
        sha256: 3e4d83ac06924a32a07b6d7f91ce6f852876153fc0bbdf931bf517a140bfbe48
        strip-components: 1
        only-arches:
          - aarch64

  - name: soundtouch
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DSOUNDSTRETCH=OFF
      - -DCMAKE_INSTALL_LIBDIR=lib
    sources:
      - type: archive
        url: https://www.surina.net/soundtouch/soundtouch-2.4.1.tar.gz
        sha256: e07abf20ce8f95850c280132e1f61ad400fc1f4011b7fac698a503de6aab6733

  - name: drift
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DDRIFT_FETCH_ONNXRUNTIME=OFF
      - -DDRIFT_BUNDLE_ONNXRUNTIME=OFF
      - -DONNXRUNTIME_ROOT=/app
      - -DDRIFT_FETCH_JUCE=OFF
      - -DDRIFT_JUCE_DIR=juce
      - -DDRIFT_UPDATE_FEED_URL=
    sources:
      - type: git
        url: https://github.com/CutWire-Studios/Drift.git
        tag: v0.1.1
        commit: 6abc998a9d028ec0639dd2f00d9bc12e06639422
      - type: git
        url: https://github.com/juce-framework/JUCE.git
        tag: 8.0.15
        commit: 91ad83ae34a81e0833b1a2b0866f54846370ae53
        dest: juce
