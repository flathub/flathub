app-id: app.indulgeme.crexga
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: crexga
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=ipc
  - --share=network
  - --filesystem=home

modules:
  - name: crexga
    buildsystem: simple
    build-commands:
      # 1. Crear directorios destino
      - install -d /app/lib/crexga
      - install -d /app/bin

      # 2. Copiar todo el bundle de Flutter a /app/lib/crexga/
      - cp -r * /app/lib/crexga/

      # 3. Crear enlace simbólico en /app/bin/ para que esté en el PATH
      - ln -s /app/lib/crexga/crexga /app/bin/crexga

      # 4. Copiar escritorio e icono
      - install -Dm644 app.indulgeme.crexga.desktop /app/share/applications/app.indulgeme.crexga.desktop
      - install -Dm644 app.indulgeme.crexga.png /app/share/icons/hicolor/128x128/apps/app.indulgeme.crexga.png

      - install -Dm644 app.indulgeme.crexga.metainfo.xml /app/share/metainfo/app.indulgeme.crexga.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/indulgeme-dev/crexga/releases/download/3.0.5/app.indulgeme.crexga-linux-x64.tar.xz
        sha256: f7d73829cf2fbb40b976d74cd9e6825c92f15ff5f1bf7217684b289ee438fc4b
      - type: file
        path: app.indulgeme.crexga.desktop
      - type: file
        path: app.indulgeme.crexga.png
      - type: file
        path: app.indulgeme.crexga.metainfo.xml
