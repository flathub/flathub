app-id: com.hizb.vpn-hizb
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node18
command: vpn-hizb

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=/run/vpn-hizb:rw
  - --talk-name=org.freedesktop.secrets

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node18/bin
  env:
    CARGO_HOME: /run/build/vpn-hizb/cargo

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc

modules:
  - name: vpn-hizb-frontend
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/ajangsupardi/vpn-hizb.git
        tag: v1.0.0
        commit: 0edb727
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - pnpm-sources.json
    build-commands:
      - cd src && npm install --prefer-offline --no-audit --no-fund
      - cd src && npx vite build --outDir ../dist

  - name: vpn-hizb-daemon
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/ajangsupardi/vpn-hizb.git
        tag: v1.0.0
        commit: 0edb727
      - cargo-sources.json
    build-commands:
      - cd src-tauri && cargo build --release --bin vpn-hizb-daemon
      - install -Dm755 src-tauri/target/release/vpn-hizb-daemon /app/bin/vpn-hizb-daemon

  - name: vpn-hizb-gui
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/ajangsupardi/vpn-hizb.git
        tag: v1.0.0
        commit: 0edb727
      - cargo-sources.json
    build-commands:
      - cd src-tauri && cargo build --release --bin vpn-hizb
      - install -Dm755 src-tauri/target/release/vpn-hizb /app/bin/vpn-hizb

  - name: vpn-hizb-metadata
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/ajangsupardi/vpn-hizb.git
        tag: v1.0.0
        commit: 0edb727
    build-commands:
      - install -Dm644 flatpak/com.hizb.vpn-hizb.desktop /app/share/applications/com.hizb.vpn-hizb.desktop
      - install -Dm644 flatpak/com.hizb.vpn-hizb.metainfo.xml /app/share/metainfo/com.hizb.vpn-hizb.metainfo.xml
      - install -Dm644 flatpak/com.hizb.vpn-hizb.svg /app/share/icons/hicolor/scalable/apps/com.hizb.vpn-hizb.svg
