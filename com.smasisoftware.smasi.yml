app-id: com.smasisoftware.smasi
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: smasi

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --device=dri
  - --filesystem=xdg-documents


modules:
  - name: smasi
    buildsystem: simple
    build-commands:
      - mkdir -p /app/smasi
      - cp -r smasi lib data /app/smasi/
      - chmod +x /app/smasi/smasi
      - mkdir -p /app/bin
      - ln -s /app/smasi/smasi /app/bin/smasi
      - install -Dm644 com.smasisoftware.smasi.desktop /app/share/applications/com.smasisoftware.smasi.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/com.smasisoftware.smasi.png
      - install -Dm644 com.smasisoftware.smasi.metainfo.xml /app/share/metainfo/com.smasisoftware.smasi.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/2S-Software/smasi-download/releases/download/v8.4.0/smasi-8.4.0-linux-x64.tar.gz
        sha256: 7625c57253efe832b046e0c38ce06fd2cd87aaa4721388864e03522e4d2642ce
        only-arches:
          - x86_64
        x-checker-data:
          type: github
          repo: 2S-Software/smasi-download
          version-pattern: 'v([\d.]+)'
          url-template: https://github.com/2S-Software/smasi-download/releases/download/v$version/smasi-$version-linux-x64.tar.gz
          is-main-source: true
      - type: file
        path: com.smasisoftware.smasi.desktop
      - type: file
        path: com.smasisoftware.smasi.metainfo.xml
      - type: file
        path: icon.png
