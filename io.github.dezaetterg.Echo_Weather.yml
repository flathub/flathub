app-id: io.github.dezaetterg.Echo_Weather
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: echo-weather

finish-args:
  # Network access for fetching weather forecasts and geocoding
  - --share=network
  - --share=ipc
  # Wayland and X11 display sockets
  - --socket=fallback-x11
  - --socket=wayland
  # Direct Rendering Infrastructure (hardware acceleration for Cairo / GTK 4)
  - --device=dri

modules:
  - name: echo-weather
    buildsystem: simple
    build-commands:
      # Install executable launcher to /app/bin
      - install -D -m755 echo-weather /app/bin/echo-weather
      # Install application payload and modules
      - install -d /app/share/echo-weather
      - cp -r *.py *.css assets data detail_cards models providers services /app/share/echo-weather/
      # Install desktop integration
      - install -D -m644 io.github.dezaetterg.Echo_Weather.desktop /app/share/applications/io.github.dezaetterg.Echo_Weather.desktop
      # Install AppStream metadata
      - install -D -m644 io.github.dezaetterg.Echo_Weather.metainfo.xml /app/share/metainfo/io.github.dezaetterg.Echo_Weather.metainfo.xml
      # Install scalable and high-resolution icons
      - install -D -m644 assets/echo_weather_logo.svg /app/share/icons/hicolor/scalable/apps/io.github.dezaetterg.Echo_Weather.svg
      - install -D -m644 assets/echo_weather_logo.png /app/share/icons/hicolor/512x512/apps/io.github.dezaetterg.Echo_Weather.png
    sources:
      - type: archive
        url: https://github.com/dezaetterg/echo-weather/archive/refs/tags/v1.0.0.tar.gz
        sha256: b533ed5a48c9bd5f5035ed40821f545b5c277c1227a65c49fb522c14cf382a13
      - type: file
        path: io.github.dezaetterg.Echo_Weather.desktop
      - type: file
        path: io.github.dezaetterg.Echo_Weather.metainfo.xml
