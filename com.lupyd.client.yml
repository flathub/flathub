app-id: com.lupyd.client
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: com.lupyd.client

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  - --filesystem=xdg-desktop
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --filesystem=~/.Xauthority:ro
  - --filesystem=xdg-run/xauth:ro
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.ScreenCast
  - --talk-name=org.freedesktop.portal.Camera
  - --talk-name=org.freedesktop.portal.Notification
  - --talk-name=org.freedesktop.portal.OpenURI
  - --talk-name=org.freedesktop.portal.Secret
  - --talk-name=org.freedesktop.portal.Background
  - --talk-name=org.freedesktop.portal.Inhibit
  - --talk-name=org.freedesktop.portal.*
  - --talk-name=org.freedesktop.secrets
  - --own-name=org.kde.*
  - --own-name=org.freedesktop.*
  - --env=CEF_PATH=/app/lib
  - --env=GDK_BACKEND=x11

modules:
  - name: com.lupyd.client
    buildsystem: simple
    build-commands:
      # Extract AppImage squashfs filesystem into Flatpak /app hierarchy
      - chmod +x lupyd.AppImage
      - ./lupyd.AppImage --appimage-extract
      - mkdir -p /app/bin /app/lib /app/share/applications /app/share/metainfo /app/share/icons
      - cp -a squashfs-root/usr/bin/* /app/bin/
      - cp -a squashfs-root/usr/lib/* /app/lib/
      - cp -a squashfs-root/usr/lib/locales /app/bin/ 2>/dev/null || true
      - cp -a squashfs-root/usr/lib/*.pak /app/bin/ 2>/dev/null || true
      - cp -a squashfs-root/usr/lib/*.dat /app/bin/ 2>/dev/null || true
      - cp -a squashfs-root/usr/lib/*.bin /app/bin/ 2>/dev/null || true
      - if [ -d squashfs-root/usr/share ]; then cp -a squashfs-root/usr/share/* /app/share/; fi
      - if [ -f squashfs-root/com.lupyd.client.png ]; then install -Dm644 squashfs-root/com.lupyd.client.png /app/share/icons/hicolor/256x256/apps/com.lupyd.client.png; fi
      - if [ -f squashfs-root/.DirIcon ]; then install -Dm644 squashfs-root/.DirIcon /app/share/icons/hicolor/256x256/apps/com.lupyd.client.png; fi
      # Install launch wrapper
      - install -Dm755 com.lupyd.client-launcher.sh /app/bin/com.lupyd.client
      # Install desktop file and AppStream metainfo
      - install -Dm644 com.lupyd.client.desktop /app/share/applications/com.lupyd.client.desktop
      - install -Dm644 com.lupyd.client.metainfo.xml /app/share/metainfo/com.lupyd.client.metainfo.xml
    sources:
      - type: file
        url: https://github.com/lupyd/lupyd/releases/download/v0.0.43/Lupyd_linux_x86-64.AppImage
        sha256: 83f4e3b83c639fa862e8f6504cd329e66b843241d6bc5a826d43fc65e56d5e02
        dest-filename: lupyd.AppImage
        only-arches:
          - x86_64
      - type: file
        path: com.lupyd.client-launcher.sh
      - type: file
        path: com.lupyd.client.desktop
      - type: file
        path: com.lupyd.client.metainfo.xml
