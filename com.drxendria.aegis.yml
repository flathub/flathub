app-id: com.drxendria.aegis
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: aegis
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-documents/Aegis-Backups:create
modules:
  - name: aegis
    buildsystem: simple
    build-commands:
      - ar x Aegis_0.2.0_amd64.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/aegis /app/bin/aegis
      - install -Dm644 usr/share/applications/Aegis.desktop /app/share/applications/com.drxendria.aegis.desktop
      - sed -i 's/^Icon=.*/Icon=com.drxendria.aegis/' /app/share/applications/com.drxendria.aegis.desktop
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/aegis.png /app/share/icons/hicolor/32x32/apps/com.drxendria.aegis.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/aegis.png /app/share/icons/hicolor/128x128/apps/com.drxendria.aegis.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/aegis.png /app/share/icons/hicolor/256x256@2/apps/com.drxendria.aegis.png
      - install -Dm644 com.drxendria.aegis.metainfo.xml /app/share/metainfo/com.drxendria.aegis.metainfo.xml
    sources:
      - type: file
        url: https://github.com/DrXendria/Aegis/releases/download/v0.2.0/Aegis_0.2.0_amd64.deb
        sha256: 6c76c08ef8c5331934320c0926d887d24deccb5a84d04f0b7d420a037d06dd60
      - type: file
        path: com.drxendria.aegis.metainfo.xml
