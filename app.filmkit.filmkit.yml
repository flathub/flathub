id: app.filmkit.filmkit
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: filmkit-linux
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --system-talk-name=org.bluez
modules:
  - name: filmkit
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/filmkit-linux /app/bin/filmkit-linux
      - install -Dm644 share/applications/app.filmkit.filmkit.desktop /app/share/applications/app.filmkit.filmkit.desktop
      - install -Dm644 share/metainfo/app.filmkit.filmkit.metainfo.xml /app/share/metainfo/app.filmkit.filmkit.metainfo.xml
      - install -Dm644 share/icons/hicolor/scalable/apps/app.filmkit.filmkit.svg /app/share/icons/hicolor/scalable/apps/app.filmkit.filmkit.svg
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://downloads.filmkit.app/linux/filmkit-linux-1.0.0-x86_64.tar.gz
        sha256: 2589d84a06a975d4a1e53e9c25c0b00983e150c7cd5e8f5680ce5b169afc376f
        strip-components: 0
        x-checker-data:
          type: json
          url: https://downloads.filmkit.app/linux/latest.json
          version-query: .version
          url-query: .url
