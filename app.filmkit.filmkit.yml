id: app.filmkit.filmkit
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: filmkit-linux
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --system-talk-name=org.bluez
modules:
  - name: filmkit
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/filmkit-linux /app/bin/filmkit-linux
      - install -Dm644 share/applications/app.filmkit.filmkit.desktop /app/share/applications/app.filmkit.filmkit.desktop
      - install -Dm644 share/metainfo/app.filmkit.filmkit.metainfo.xml /app/share/metainfo/app.filmkit.filmkit.metainfo.xml
      - install -Dm644 share/icons/hicolor/scalable/apps/app.filmkit.filmkit.svg /app/share/icons/hicolor/scalable/apps/app.filmkit.filmkit.svg
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://download.filmkit.app/linux/filmkit-linux-1.0.0-x86_64.tar.gz
        sha256: 78c99270a38ed34759c8c1bd12ab09bac5555ef9cfdb399775bebadf2d55c84d
        strip-components: 0
        x-checker-data:
          type: json
          url: https://download.filmkit.app/linux/latest.json
          version-query: .version
          url-query: .x86_64.url
      - type: archive
        only-arches: [aarch64]
        url: https://download.filmkit.app/linux/filmkit-linux-1.0.0-aarch64.tar.gz
        sha256: 630f054f82e9b9eb4b53eff1c3b1a2e658a23dd338632f17976c13baf5c50186
        strip-components: 0
        x-checker-data:
          type: json
          url: https://download.filmkit.app/linux/latest.json
          version-query: .version
          url-query: .aarch64.url
