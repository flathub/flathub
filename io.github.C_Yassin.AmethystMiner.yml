app-id: io.github.C_Yassin.AmethystMiner
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.10'
command: start-amethyst
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/bash-completion
  - /share/doc
  - /share/fish
  - /share/man
  - /share/zsh
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - name: hwloc
    buildsystem: autotools
    sources:
      - type: archive
        url: https://download.open-mpi.org/release/hwloc/v2.9/hwloc-2.9.3.tar.bz2
        sha256: 5c4062ce556f6d3451fc177ffb8673a2120f81df6835dea6a21a90fbdfff0dec

  - name: libuv
    buildsystem: autotools
    sources:
      - type: archive
        url: https://dist.libuv.org/dist/v1.46.0/libuv-v1.46.0.tar.gz
        sha256: 111f83958b9fdc65f1489195d25f342b9f7a3e683140c60e62c00fbaccddddce
  
  - python3-requirements.json

  - name: xmrig
    buildsystem: cmake-ninja
    no-make-install: true
    config-opts:
      - -DWITH_OPENCL=OFF
      - -DWITH_CUDA=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DHWLOC_INCLUDE_DIR=/app/include
      - -DHWLOC_LIBRARY=/app/lib/libhwloc.so
      - -DUV_INCLUDE_DIR=/app/include
      - -DUV_LIBRARY=/app/lib/libuv.so
      - "-DCMAKE_C_FLAGS=-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0"
      - "-DCMAKE_CXX_FLAGS=-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0"
    post-install:
      - install -D -m 755 xmrig /app/bin/xmrig
    sources:
      - type: git
        url: https://github.com/xmrig/xmrig.git
        commit: b2ca72480c58d197e18c885d9fc1a0c8d517e60a
      - type: patch
        path: xmrig-donate.patch

  - name: amethyst-miner
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/amethyst
      - cp -r * /app/share/amethyst/

      - install -D -m 755 config/start-amethyst /app/bin/start-amethyst
      
      - install -Dm644 io.github.C_Yassin.AmethystMiner.metainfo.xml /app/share/metainfo/io.github.C_Yassin.AmethystMiner.metainfo.xml
      - install -Dm644 gui/io.github.C_Yassin.AmethystMiner.desktop /app/share/applications/io.github.C_Yassin.AmethystMiner.desktop
      - install -Dm644 gui/amethyst.svg /app/share/icons/hicolor/scalable/apps/io.github.C_Yassin.AmethystMiner.svg
    sources:
      - type: git
        url: https://github.com/C-Yassin/AmethystMiner
        commit: bb247cb82650a798ef186e401fa2beb5af7401af