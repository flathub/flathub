app-id: io.github.bishop_333.omega-engine
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: openarena-omega
finish-args:
  - --share=ipc
  - --socket=wayland
  - --device=dri
  - --device=input
  - --device-if=all:!has-input-device
  - --socket=pulseaudio
  - --share=network
  - --socket=fallback-x11
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/aclocal
  - /share/man
  - "*.la"
  - "*.a"
modules:
  - name: omega-engine
    buildsystem: simple
    build-commands:
      - make -j$FLATPAK_BUILDER_N_JOBS USE_SYSTEM_JPEG=1 USE_SYSTEM_ZLIB=1 USE_SYSTEM_OGG=1 USE_SYSTEM_VORBIS=1 USE_SYSTEM_FLAC=1 USE_SYSTEM_OPENAL=1 TARGET_CLIENT=omega-engine
      - make install DESTDIR=${FLATPAK_DEST}/share/openarena TARGET_CLIENT=omega-engine
      - install -Dm755 openarena-omega -t /app/bin/
      - install -Dm644 code/unix/io.github.bishop_333.omega-engine.png -t /app/share/icons/hicolor/256x256/apps
      - install -Dm644 code/unix/io.github.bishop_333.omega-engine.desktop -t /app/share/applications/
      - install -Dm644 code/unix/io.github.bishop_333.omega-engine.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: git
        url: https://github.com/Bishop-333/OmegA-engine
        tag: v3.4.2
        commit: 2fc82396b22dbb7736687f0834ba094cb0f6a5a1
      - type: file
        path: openarena-omega
       # x-checker-data: # Allow the bot to automatically make PRs for new releases
         # type: git
         # tag-pattern: "^(\\d{4}-\\d{2}-\\d{2})$"

  - name: openarena-data
    buildsystem: simple
    build-commands:
      - mv baseoa /app/share/openarena/
      - mkdir -p /app/share/openarena/omega && mv *.pk3 /app/share/openarena/omega/
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/oarena/openarena-0.8.8.zip
        sha256: 5a8faf7f5b51f351b0a1618c06b6b98a5f1a6758f1d39818de2c87df2a0bac4a
      - type: file
        url: https://github.com/Bishop-333/OmegA-mod/releases/download/v3.4.2/z_omega-v3.4.2.pk3
        sha256: a2e52bf0aed708c56336ad56d2c7cad8fd20f525189dbb35ee3b03277a9a962f

