# Flatpak manifest for PayShield — Flathub submission.
# Installs the published, signed .deb from cipherx1logistics.com. Source is
# proprietary (extra-data style: ship the vendor binary), like other closed apps.
app-id: com.cipherx1logistics.payshield
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: payshield

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=home
  - --filesystem=xdg-download
modules:
  - name: payshield
    buildsystem: simple
    build-commands:
      - ar x *.deb
      - tar -xf data.tar.* -C .
      - install -Dm755 usr/bin/payshield /app/bin/payshield
      # icon: rename vendor icon -> app-id (32 + 128 are valid hicolor sizes)
      - |
        for d in 32x32 128x128; do
          s="usr/share/icons/hicolor/$d/apps/payshield.png"
          [ -f "$s" ] && install -Dm644 "$s" "/app/share/icons/hicolor/$d/apps/com.cipherx1logistics.payshield.png" || true
        done
      # desktop file generated fresh, named for the app-id (reliable, no spaces)
      - |
        cat > com.cipherx1logistics.payshield.desktop <<EOF
        [Desktop Entry]
        Type=Application
        Name=PayShield
        Comment=Local invoice and KYC scam checker — seal and verify documents on your own machine
        Exec=payshield
        Icon=com.cipherx1logistics.payshield
        Terminal=false
        Categories=Utility;Security;
        EOF
        install -Dm644 com.cipherx1logistics.payshield.desktop /app/share/applications/com.cipherx1logistics.payshield.desktop
      - install -Dm644 com.cipherx1logistics.payshield.metainfo.xml /app/share/metainfo/com.cipherx1logistics.payshield.metainfo.xml
    sources:
      - type: file
        url: https://cipherx1logistics.com/downloads/PayShield_1.0.0_amd64.deb
        sha256: d603686259aaaccdb3589969b6913bc50ef42cb8b7779244414948a8d236dafa
      - type: file
        path: com.cipherx1logistics.payshield.metainfo.xml
