app-id: io.github.wpichler.GLViewer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: glviewer
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # SSH connections: agent socket and read access to ~/.ssh (config, keys, known_hosts)
  - --socket=ssh-auth
  - --filesystem=~/.ssh:ro
  # Viewing local log files anywhere on the system, including /var/log
  - --filesystem=host:ro
  - --filesystem=/var/log:ro
  # journalctl and pkexec (for root-only logs) must run on the host
  - --talk-name=org.freedesktop.Flatpak
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
modules:
  - name: glviewer
    buildsystem: simple
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/wpichler/glviewer/releases/download/v0.1.0/GLViewer-0.1.0-linux-x64.tar.gz
        sha256: 339994395032c231c29baf397fa1b527fed4cdc6789e91fd3000f31bb4a42af5
        dest: app
        x-checker-data:
          type: json
          url: https://api.github.com/repos/wpichler/glviewer/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/wpichler/glviewer/releases/download/v" + $version + "/GLViewer-" + $version + "-linux-x64.tar.gz"'
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/wpichler/glviewer/releases/download/v0.1.0/GLViewer-0.1.0-linux-arm64.tar.gz
        sha256: 0225a4af15ca80601298bfd39e9f4ea687da2e2d21145b5bb8e0b54bf3478d90
        dest: app
        x-checker-data:
          type: json
          url: https://api.github.com/repos/wpichler/glviewer/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/wpichler/glviewer/releases/download/v" + $version + "/GLViewer-" + $version + "-linux-arm64.tar.gz"'
      - type: git
        url: https://github.com/wpichler/glviewer.git
        tag: v0.1.0
        commit: 80b185610eb714f4b13f2fe010f660b81b9a8393
        dest: src
      - type: script
        dest-filename: glviewer.sh
        commands:
          - exec zypak-wrapper /app/glviewer/glviewer "$@"
    build-commands:
      - cp -a app /app/glviewer
      - rm -f /app/glviewer/chrome-sandbox
      - install -Dm755 glviewer.sh /app/bin/glviewer
      - install -Dm644 src/resources/icon.png /app/share/icons/hicolor/512x512/apps/io.github.wpichler.GLViewer.png
      - install -Dm644 src/flatpak/io.github.wpichler.GLViewer.svg /app/share/icons/hicolor/scalable/apps/io.github.wpichler.GLViewer.svg
      - install -Dm644 src/flatpak/io.github.wpichler.GLViewer.desktop /app/share/applications/io.github.wpichler.GLViewer.desktop
      - install -Dm644 src/flatpak/io.github.wpichler.GLViewer.metainfo.xml /app/share/metainfo/io.github.wpichler.GLViewer.metainfo.xml
