# Manifesto Flatpak Oficial do Projeto Crimson para submissão no Flathub
app-id: io.github.luandevcodes.Crimson
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: crimson

# Permissões mínimas do sandbox para funcionamento completo da interface, rede e salvamento de mídias
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-videos
  - --filesystem=xdg-music

# Otimização do pacote removendo módulos pesados do BaseApp que o Crimson não utiliza
build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'
    BASEAPP_DISABLE_NUMPY: '1'

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  # Dependência 1: Pillow (usada para manipulação de canais RGBA e recoloração dinâmica dos ícones)
  - name: python3-pillow
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "pillow" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/ce/a4/9cc30690a394a8305e8be4c9036aa16d0dfddadd09079860b582f562496d/pillow-13.0.0.tar.gz
        sha256: cdcd1ba258178f7356d74170c9a81ba4eab6a5d55748bc402a5a2a6fe6be3510
        x-checker-data:
          type: pypi
          name: pillow

  # Dependência 2: yt-dlp (motor de extração monitorado automaticamente pelo bot do Flathub)
  - name: python3-yt-dlp
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "yt-dlp" --no-build-isolation --no-deps
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/7f/3d/16ea7d5638cf585991f2c5705e8083688dde633d32d0871f2404e0f4d827/yt_dlp-2026.10.26-py3-none-any.whl
        sha256: a05c5b5d8562f7e8a62f5334348b406af4930d56d3a65f8021d14af0e22339ae
        x-checker-data:
          type: pypi
          name: yt_dlp
          packagetype: bdist_wheel

  # Módulo Principal: Aplicação Crimson (V.3.0.1)
  - name: crimson
    buildsystem: simple
    build-commands:
      # Instala o código-fonte e a pasta de ícones da interface
      - install -Dm644 Crimson.py /app/share/crimson/Crimson.py
      - install -d /app/share/crimson/Icons
      - install -Dm644 Icons/*.png Icons/*.svg /app/share/crimson/Icons/
      # Cria o executável de inicialização em /app/bin/crimson
      - printf '#!/bin/sh\nexec python3 /app/share/crimson/Crimson.py "$@"\n' > /app/bin/crimson
      - chmod +x /app/bin/crimson
      # Instala os ícones nos diretórios padrão do sistema (Freedesktop hicolor)
      - install -Dm644 Icons/Crimson.png /app/share/icons/hicolor/512x512/apps/io.github.luandevcodes.Crimson.png
      - install -Dm644 Icons/Crimson.svg /app/share/icons/hicolor/scalable/apps/io.github.luandevcodes.Crimson.svg
      # Instala o atalho Desktop, o catálogo AppStream MetaInfo e a Licença GPLv3
      - install -Dm644 io.github.luandevcodes.Crimson.desktop /app/share/applications/io.github.luandevcodes.Crimson.desktop
      - install -Dm644 io.github.luandevcodes.Crimson.metainfo.xml /app/share/metainfo/io.github.luandevcodes.Crimson.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/io.github.luandevcodes.Crimson/LICENSE
    sources:
      - type: git
        url: https://github.com/LuanDevCodes/Crimson.git
        tag: V.3.0.1
        commit: fc7cfcd869892226b43ca4655c318e1f5c040ffb
        x-checker-data:
          type: git
          tag-pattern: ^V\.([\d.]+)$
      - type: file
        path: io.github.luandevcodes.Crimson.desktop
      - type: file
        path: io.github.luandevcodes.Crimson.metainfo.xml