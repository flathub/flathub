app-id: com.notion.app.desktop.notion
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: electron-wrapper
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-config/google-chrome/NativeMessagingHosts
  - --filesystem=xdg-config/gtk-3.0:ro
  - --filesystem=xdg-config/gtk-4.0:ro
  - --filesystem=home
  - --device=all
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.indicator.application
  - --talk-name=org.ayatana.indicator.application
  - --env=TMPDIR=/var/tmp
modules:
  - name: notion
    buildsystem: simple
    build-commands:
      - cp -r bin lib share /app/
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://app.linux-packages.notion.com/flathub/7.45.2/notion-desktop-7.45.2-linux-x86_64.tar.gz
        sha256: 26709473e1cb9fc5a3186bb1ad5941e1d91c1fddbf5f416df1b373853b1e5ee5
        x-checker-data:
          type: json
          url: https://app.linux-packages.notion.com/flathub/latest.json
          version-query: .version
          url-query: .architectures.x86_64.url
      - type: archive
        only-arches: [aarch64]
        url: https://app.linux-packages.notion.com/flathub/7.45.2/notion-desktop-7.45.2-linux-aarch64.tar.gz
        sha256: 5c8bf9349999699cffe8da7602dbfdbee96d48b4a95578d0922aec57f8c8b5bd
        x-checker-data:
          type: json
          url: https://app.linux-packages.notion.com/flathub/latest.json
          version-query: .version
          url-query: .architectures.aarch64.url
