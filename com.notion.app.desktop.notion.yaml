app-id: com.notion.app.desktop.notion
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: electron-wrapper
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-config/google-chrome/NativeMessagingHosts
  - --filesystem=xdg-config/gtk-3.0:ro
  - --filesystem=xdg-config/gtk-4.0:ro
  - --filesystem=home
  - --device=all
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.indicator.application
  - --talk-name=org.ayatana.indicator.application
  - --env=TMPDIR=/var/tmp
modules:
  - name: notion
    buildsystem: simple
    build-commands:
      - cp -r bin lib share /app/
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://app.linux-packages.notion.com/flathub/7.45.2/notion-desktop-7.45.2-linux-x86_64-15cda558ef0d.tar.gz
        sha256: 15cda558ef0d700609fa42714ee117d74bcee8c73286303aaed9c581d26d6395
        x-checker-data:
          type: json
          url: https://app.linux-packages.notion.com/flathub/latest.json
          version-query: .version
          url-query: .architectures.x86_64.url
      - type: archive
        only-arches: [aarch64]
        url: https://app.linux-packages.notion.com/flathub/7.45.2/notion-desktop-7.45.2-linux-aarch64-13aedb7fee4d.tar.gz
        sha256: 13aedb7fee4d3c1f2df09f3128f1992575aa6867039460267b4a7e49a5fd33f7
        x-checker-data:
          type: json
          url: https://app.linux-packages.notion.com/flathub/latest.json
          version-query: .version
          url-query: .architectures.aarch64.url
