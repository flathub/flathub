app-id: com.notion.app.desktop.notion
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: electron-wrapper
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-config/google-chrome/NativeMessagingHosts
  - --filesystem=xdg-config/gtk-3.0:ro
  - --filesystem=xdg-config/gtk-4.0:ro
  - --filesystem=home
  - --device=all
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.indicator.application
  - --talk-name=org.ayatana.indicator.application
  - --env=TMPDIR=/var/tmp
modules:
  - name: notion
    buildsystem: simple
    build-commands:
      - cp -r bin lib share /app/
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://app.linux-packages.notion.com/flathub/7.45.0/notion-desktop-7.45.0-linux-x86_64.tar.gz
        sha256: 3b3b501010b9b8851d9bd6e235b214f3e1e00c7fe862f06760229c3e5a0837ea
        x-checker-data:
          type: json
          url: https://app.linux-packages.notion.com/flathub/latest.json
          version-query: .version
          url-query: .architectures.x86_64.url
      - type: archive
        only-arches: [aarch64]
        url: https://app.linux-packages.notion.com/flathub/7.45.0/notion-desktop-7.45.0-linux-aarch64.tar.gz
        sha256: 87d7d472fc73ad6e4933da4e48b712252819eeb34ac7c90b4d3d8c6eb6345136
        x-checker-data:
          type: json
          url: https://app.linux-packages.notion.com/flathub/latest.json
          version-query: .version
          url-query: .architectures.aarch64.url
