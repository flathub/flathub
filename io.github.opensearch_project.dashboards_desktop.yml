app-id: io.github.opensearch_project.dashboards_desktop
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: dashboards-desktop

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: dashboards-desktop
    buildsystem: simple
    build-commands:
      - ar -x opensearch.deb
      - tar -xJf data.tar.xz
      - cp -r opt/ /app/
      - install -Dm755 dashboards-desktop.sh /app/bin/dashboards-desktop
      - install -Dm644 io.github.opensearch_project.dashboards_desktop.desktop /app/share/applications/io.github.opensearch_project.dashboards_desktop.desktop
      - install -Dm644 io.github.opensearch_project.dashboards_desktop.png /app/share/icons/hicolor/256x256/apps/io.github.opensearch_project.dashboards_desktop.png
      - install -Dm644 io.github.opensearch_project.dashboards_desktop.metainfo.xml /app/share/metainfo/io.github.opensearch_project.dashboards_desktop.metainfo.xml
    sources:
      - type: file
        url: https://github.com/opensearch-project/dashboards-desktop/releases/download/v0.1.1/dashboards-desktop_0.1.0_amd64.deb
        sha256: ccbd8bd790fac5b2f8dfb844b38823696bafc073fc35a9819b4a2aca2e673dce
        dest-filename: opensearch.deb
      - type: file
        path: dashboards-desktop.sh
      - type: file
        path: io.github.opensearch_project.dashboards_desktop.desktop
      - type: file
        path: io.github.opensearch_project.dashboards_desktop.png
      - type: file
        path: io.github.opensearch_project.dashboards_desktop.metainfo.xml
