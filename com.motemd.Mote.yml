# Flatpak manifest for Flathub (flathub/flathub). Generated by tools/release/publish.sh from
# ../com.motemd.Mote.yml: the archive is the release asset, pinned by digest.
app-id: com.motemd.Mote
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: mote
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home          # a file editor: the user's documents
  - --talk-name=org.freedesktop.IBus      # Korean input through ibus on X11; Wayland text-input needs nothing
  - --talk-name=org.fcitx.Fcitx5
modules:
  - name: mote
    buildsystem: simple
    build-commands:
      - cp -r usr/. /app/
    sources:
      - type: archive
        url: https://github.com/sangbinyun/mote/releases/download/v0.9.0-beta.1/mote-0.9.0-beta.1-linux-x86_64-bin.tar.xz
        sha256: "ca41f08eb1775341ac2a4da8003fcb1f2ab39728f72268bd7404960c4f04ccc7"
