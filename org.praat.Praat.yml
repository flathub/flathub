id: org.praat.Praat
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: praat

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --socket=cups
  - --persist=.praat-dir
  - --filesystem=home

modules:
  - name: praat
    buildsystem: simple
    build-commands:
      - make -j15
      - make install PREFIX=${FLATPAK_DEST}
    sources:
      - type: git
        url: https://github.com/praat/praat.github.io
        commit: 1af63240f28c19f016abdfb65167348367afab1c
      - type: file
        path: org.praat.Praat.metainfo.xml

