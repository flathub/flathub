id: org.praat.Praat
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: praat

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --socket=cups
  - --persist=.praat-dir
  - --filesystem=home

modules:
  - name: praat
    buildsystem: simple
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS
      - make install PREFIX=${FLATPAK_DEST}
    sources:
      - type: git
        url: https://github.com/praat/praat.github.io
        commit: a12f3c875986f3812b022ee9cd001ca4b60ab6e8

