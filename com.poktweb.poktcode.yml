# PoktCode Flatpak manifest for Flathub
# Binary archive is published on https://github.com/poktweb/poktcode-releases

app-id: com.poktweb.poktcode
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: poktcode
separate-locales: false

finish-args:
  # Display — X11 preferred; Wayland on Plasma+NVIDIA freezes splash/renderer
  - --socket=x11
  - --socket=fallback-x11
  - --share=ipc
  - --device=all
  - --socket=pulseaudio
  - --share=network
  # IDE needs broad host project access
  - --filesystem=host
  - --filesystem=xdg-run/gnupg:ro
  - --socket=ssh-auth
  - --talk-name=org.freedesktop.portal.Documents
  - --talk-name=org.freedesktop.impl.portal.PermissionStore
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.freedesktop.Notifications
  - --system-talk-name=org.freedesktop.login1
  # Host shell bridge for local MCP/tooling (pnpm/node on host)
  - --talk-name=org.freedesktop.Flatpak
  - --env=ELECTRON_DISABLE_SANDBOX=1
  - --env=THEIA_NO_SPLASH=1
  - --env=ZYPAK_DISABLE_GPU_SANDBOX=1
  - --env=ELECTRON_PASSWORD_STORE=basic
  - --env=ELECTRON_OZONE_PLATFORM_HINT=x11
  - --env=THEIA_SHELL=/app/bin/poktcode-host-shell
  - --env=SHELL=/app/bin/poktcode-host-shell

modules:
  - name: poktcode
    buildsystem: simple
    build-commands:
      - install -Dm755 poktcode-wrapper.sh /app/bin/poktcode
      - install -Dm755 poktcode-host-shell /app/bin/poktcode-host-shell
      - mkdir -p /app/lib/com.poktweb.poktcode
      - cp -a linux-unpacked/. /app/lib/com.poktweb.poktcode/
      - chmod +x /app/lib/com.poktweb.poktcode/poktcode.bin || true
      - chmod +x /app/lib/com.poktweb.poktcode/chrome-sandbox || true
      - chmod +x /app/lib/com.poktweb.poktcode/chrome_crashpad_handler || true
      - install -Dm644 com.poktweb.poktcode.desktop /app/share/applications/com.poktweb.poktcode.desktop
      - install -Dm644 com.poktweb.poktcode.metainfo.xml /app/share/metainfo/com.poktweb.poktcode.metainfo.xml
      - |
        for size in 16 32 48 64 128 256 512; do
          if [ -f "icons/${size}x${size}.png" ]; then
            install -Dm644 "icons/${size}x${size}.png" \
              "/app/share/icons/hicolor/${size}x${size}/apps/com.poktweb.poktcode.png"
          fi
        done
      - install -Dm644 LICENSE /app/share/doc/com.poktweb.poktcode/copyright
    sources:
      - type: archive
        url: https://github.com/poktweb/poktcode-releases/releases/download/v0.1.0/PoktCode-0.1.0-linux-x86_64.tar.xz
        sha256: da4f26179b2eee07fe8dc9f072fbb419336df15415fb4fe8df5028ebebf50857
        dest: linux-unpacked
        strip-components: 1
      - type: file
        path: poktcode-wrapper.sh
      - type: file
        path: poktcode-host-shell
      - type: file
        path: com.poktweb.poktcode.desktop
      - type: file
        path: com.poktweb.poktcode.metainfo.xml
      - type: dir
        path: icons
        dest: icons
      - type: file
        path: LICENSE
