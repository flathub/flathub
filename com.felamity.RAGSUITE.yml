app-id: com.felamity.RAGSUITE
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: ragsuite
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: zypak
    sources:
      - type: git
        url: https://github.com/refi64/zypak
        tag: v2025.09
        commit: 693a71c5ffa80ec9c9ce2ae03b1ccc493c698e53

  - name: ragsuite
    buildsystem: simple
    build-commands:
      - install -d /app/bin
      - chmod +x RAGSUITE-v0.2.15-x86_64.AppImage
      - ./RAGSUITE-v0.2.15-x86_64.AppImage --appimage-extract
      - cp -r squashfs-root/* /app/
      - install -Dm644 com.felamity.RAGSUITE.desktop /app/share/applications/com.felamity.RAGSUITE.desktop
      - install -Dm644 com.felamity.RAGSUITE.metainfo.xml /app/share/metainfo/com.felamity.RAGSUITE.metainfo.xml
      - install -Dm644 com.felamity.RAGSUITE.png /app/share/icons/hicolor/512x512/apps/com.felamity.RAGSUITE.png
      - install -Dm755 ragsuite.sh /app/bin/ragsuite
    sources:
      - type: file
        url: https://ragsuite-online-update.s3.ap-south-1.amazonaws.com/Linux/RAGSUITE-v0.2.15-x86_64.AppImage
        sha256: 6ed2d39824d2ee9f9e960c1c54e3f94bfb1ae93f9099e5b3e73f20c808242f43
      - type: file
        path: com.felamity.RAGSUITE.desktop
      - type: file
        path: com.felamity.RAGSUITE.metainfo.xml
      - type: file
        path: com.felamity.RAGSUITE.png
      - type: script
        dest-filename: ragsuite.sh
        commands:
          - cd /app
          - exec zypak-wrapper /app/ragsuite-public "$@"
