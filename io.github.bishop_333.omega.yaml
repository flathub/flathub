app-id: io.github.bishop_333.omega
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: openarena-omega
finish-args:
  - --share=ipc
  - --socket=wayland
  - --device=all
  - --socket=pulseaudio
  - --share=network
  - --socket=fallback-x11
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/aclocal
  - /share/man
  - "*.la"
  - "*.a"
modules:
  - name: omega-engine
    buildsystem: simple
    build-commands:
      - make -j$FLATPAK_BUILDER_N_JOBS USE_SYSTEM_JPEG=1 USE_SYSTEM_ZLIB=1 USE_SYSTEM_OGG=1 USE_SYSTEM_VORBIS=1 USE_SYSTEM_FLAC=1 USE_SYSTEM_OPENAL=1 TARGET_CLIENT=omega
      - make install DESTDIR=${FLATPAK_DEST}/share/openarena TARGET_CLIENT=omega
    sources:
      # Pull directly from the upstream source
      - type: git
        url: https://github.com/Bishop-333/OmegA-engine
        tag: v3.4.0
       # x-checker-data: # Allow the bot to automatically make PRs for new releases
         # type: git
         # tag-pattern: "^(\\d{4}-\\d{2}-\\d{2})$"

  - name: openarena-data
    buildsystem: simple
    build-commands:
      - mv baseoa /app/share/openarena/
      - mkdir -p /app/share/openarena/omega && mv *.pk3 /app/share/openarena/omega/
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/oarena/openarena-0.8.8.zip
        sha256: 5a8faf7f5b51f351b0a1618c06b6b98a5f1a6758f1d39818de2c87df2a0bac4a
      - type: file
        url: https://github.com/Bishop-333/OmegA-mod/releases/download/v3.4.0/z_omega-v3.4.0.pk3
        sha256: 42f5902085b9a3d0e06be789ec70ede00f49b823235aa57b52b777cd62e96d8b

  - name: launch-script
    buildsystem: simple
    build-commands:
      - install -Dm755 openarena-omega -t /app/bin/
      - install -Dm644 io.github.bishop_333.omega.png -t /app/share/icons/hicolor/256x256/apps
      - install -Dm644 io.github.bishop_333.omega.desktop -t /app/share/applications/
      - install -Dm644 io.github.bishop_333.omega.appdata.xml -t /app/share/metainfo/
    sources:
      - type: file
        path: openarena-omega
      - type: file
        path: io.github.bishop_333.omega.png
      - type: file
        path: io.github.bishop_333.omega.desktop
      - type: file
        path: io.github.bishop_333.omega.appdata.xml
