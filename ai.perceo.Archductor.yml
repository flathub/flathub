app-id: ai.perceo.Archductor
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: archductor-gtk

finish-args:
  # Archductor opens arbitrary local repository and workspace paths.
  - --filesystem=host
  # Network access is required for git fetch, gh CLI, and agent sessions.
  - --share=network
  # IPC and display sockets are required for GTK desktop integration.
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --env=SHELL=/bin/bash

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/archductor/cargo
    RUST_BACKTRACE: '1'

modules:
  - name: archductor
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo build --offline --release --locked --workspace
      - install -Dm755 target/release/archductor /app/bin/archductor
      - install -Dm755 target/release/archductor-gtk /app/bin/archductor-gtk
      - install -Dm644 README.md /app/share/doc/archductor/README.md
      - install -Dm644 ai.perceo.Archductor.metainfo.xml
          /app/share/metainfo/ai.perceo.Archductor.metainfo.xml
      - install -Dm644 ai.perceo.Archductor.desktop
          /app/share/applications/ai.perceo.Archductor.desktop
      - install -Dm644 ai.perceo.Archductor.svg
          /app/share/icons/hicolor/scalable/apps/ai.perceo.Archductor.svg
    sources:
      - type: archive
        url: https://github.com/perceo-ai/conductor-arch/archive/refs/tags/v0.1.0.tar.gz
        sha256: 3ce40f320f273a5038d818e071671c9c65c1c3c22662166c5dbfbee3b5795022
      - cargo-sources.json
      - type: file
        path: ai.perceo.Archductor.metainfo.xml
      - type: file
        path: ai.perceo.Archductor.desktop
      - type: file
        path: ai.perceo.Archductor.svg
    build-options:
      env:
        CARGO_NET_OFFLINE: 'true'
        LIBSQLITE3_SYS_USE_PKG_CONFIG: '1'
