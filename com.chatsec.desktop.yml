app-id: com.chatsec.desktop
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk

command: chatsec

finish-args:
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri

modules:
  - name: chatsec
    buildsystem: simple

    build-commands:
      - mkdir -p /app/chatsec
      - cp -r linux-unpacked/* /app/chatsec/
      - install -Dm755 chatsec.sh /app/bin/chatsec
      - install -Dm644 com.chatsec.desktop.desktop /app/share/applications/com.chatsec.desktop.desktop
      - install -Dm644 com.chatsec.desktop.metainfo.xml /app/share/metainfo/com.chatsec.desktop.metainfo.xml
      - install -Dm644 icon/512x512.png /app/share/icons/hicolor/512x512/apps/com.chatsec.desktop.png

    sources:
      - type: dir
        path: .
