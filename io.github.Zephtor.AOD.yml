app-id: io.github.Zephtor.AOD
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: aod
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --filesystem=xdg-documents
  - --device=dri
modules:
  - name: aod
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/Zephtor/AOD.git
        commit: d8e1daba663bb7ab7f315ec0a85db3fd3fb499a9