app-id: io.github.ADG_Foundation.gclc
runtime: org.kde.Platform
sdk: org.kde.Sdk
runtime-version: "6.11"
command: gclc-gui

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: gclc
    buildsystem: cmake-ninja

    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -Dgui=ON

    sources:
      - type: archive
        url: https://github.com/ADG-Foundation/gclc/archive/refs/tags/v2026.08.zip
        sha256: 5dd6c08ee61901fd65784a7915a1e125343c0d3e3cf0ab3a2cd0e98dae9ee193
