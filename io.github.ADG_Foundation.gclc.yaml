app-id: io.github.ADG_Foundation.gclc
runtime: org.kde.Platform
sdk: org.kde.Sdk
runtime-version: "6.11"
command: gclc-gui

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

modules:
  - name: gclc-sources
    buildsystem: cmake

    post-install:
      - mkdir -p /app/bin
      - mv /app/gclc /app/bin/
      - mv /app/gclc-gui /app/bin/gclc-gui-bin
      - install -Dm755 gclc-gui /app/bin/gclc-gui

      - install -Dm644 flatpak/io.github.ADG_Foundation.gclc.desktop /app/share/applications/io.github.ADG_Foundation.gclc.desktop
      - install -Dm644 flatpak/io.github.ADG_Foundation.gclc.metainfo.xml /app/share/metainfo/io.github.ADG_Foundation.gclc.metainfo.xml
      - install -Dm644 flatpak/icon/32.png /app/share/icons/hicolor/32x32/apps/io.github.ADG_Foundation.gclc.png
      - install -Dm644 flatpak/icon/64.png /app/share/icons/hicolor/64x64/apps/io.github.ADG_Foundation.gclc.png
      - install -Dm644 flatpak/icon/128.png /app/share/icons/hicolor/128x128/apps/io.github.ADG_Foundation.gclc.png
      - install -Dm644 flatpak/icon/256.png /app/share/icons/hicolor/256x256/apps/io.github.ADG_Foundation.gclc.png
      - install -Dm644 flatpak/icon/512.png /app/share/icons/hicolor/512x512/apps/io.github.ADG_Foundation.gclc.png

    sources:
      - type: archive
        url: https://github.com/ADG-Foundation/gclc/archive/a431ed47f741b0f1fe63f0c862e5096c4a383f64.zip
        sha256: 17566cc92e0ff574c8e05bb24f72fe04076dfa294b4e366175ea06e45c210874

      - type: script
        dest-filename: gclc-gui
        commands:
          - export QT_QPA_PLATFORMTHEME=generic
          - exec /app/bin/gclc-gui-bin "$@"
