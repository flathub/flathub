app-id: io.github.ADG_Foundation.gclc
runtime: org.kde.Platform
sdk: org.kde.Sdk
runtime-version: "6.11"
command: gclc-gui

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: gclc
    buildsystem: cmake-ninja

    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -Dgui=ON

    sources:
      - type: archive
        url: https://github.com/ADG-Foundation/gclc/archive/13d2e0398f0acfba4d738ba5612142f1619ab7d1.zip
        sha256: 959a31f72854faa9a65b2aa4b49431afe19258cd06263beadeba4fe255828bc8
