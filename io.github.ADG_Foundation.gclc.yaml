app-id: io.github.ADG_Foundation.gclc
runtime: org.kde.Platform
sdk: org.kde.Sdk
runtime-version: "6.10"
command: gclc-gui

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

modules:
  - name: gclc-sources
    buildsystem: cmake

    post-install:
      - mkdir -p /app/bin
      - mv /app/gclc /app/bin/
      - mv /app/gclc-gui /app/bin/gclc-gui-bin
      - install -Dm755 gclc-gui /app/bin/gclc-gui

    sources:
    - type: archive
      url: https://github.com/janicicpredrag/gclc/archive/refs/tags/v2026.0.zip
      sha256: 6b674a766659414dec524d22988df370302a60ed897db69d052024a6c8e5498f

    - type: script
      dest-filename: gclc-gui
      commands:
      - export QT_QPA_PLATFORMTHEME=generic
      - exec /app/bin/gclc-gui-bin "$@"
