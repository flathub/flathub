id: org.bitbucket.puddingpulver.Mallongigi
runtime: org.freedesktop.Platform
runtime-version: '25.08' 
sdk: org.freedesktop.Sdk
command: programStart.sh

# Install Java 25
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk25
  

finish-args:
  - --share=ipc
  - --socket=wayland       # New GUI for JavaFX
  - --socket=fallback-x11  # Fallback, for JavaFX funktions like Window Size by Start Application.
  - --socket=pulseaudio    # Important for Mediaplayer and Sound
  - --share=network        # Important for Network Connections (HTTPS RSS and Downloads)
  - --device=dri           # JavaFX Graphic support
  - --persist=mallongigi   # Default save Folder for all Files (mp3, Images, State of RSS Feeds).  
  
modules:

  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk25/install.sh

  - name: mallongigi
    buildsystem: simple
    build-commands:
      # Create Folders for Mallongigi
      - install -d /app/share/metainfo/
      - install -d /app/share/applications/
      - install -d /app/share/icons/hicolor/scalable/apps/

      # Folder for Jar (Application)
      - install -D mallongigi.jar /app/share/mallongigi/mallongigi.jar

      # Create Desktop Icon for Linux Desktop system
      - install -D icon.svg /app/share/icons/hicolor/scalable/apps/org.bitbucket.puddingpulver.Mallongigi.svg

      # Copy Mallongigi start Script
      - install -m 755 -D programStart.sh /app/bin/programStart.sh

      # Copy XML-Metadaten und des Linux-Applicationstarts 
      - install -m 644 org.bitbucket.puddingpulver.Mallongigi.metainfo.xml /app/share/metainfo/
      - install -m 644 org.bitbucket.puddingpulver.Mallongigi.desktop /app/share/applications/


    sources:
      - type: archive
        url: https://github.com/mallongigi/Mallongigi/releases/download/1.00.02/Mallongigi_Flatpak_1.00.02.tar.gz # URL zum aktuellen Release
        sha256: 92af16b2dbb5c8b8ebf3c07b5458b4510edf04a8a81bdbf58659c014f7fa241e
        strip-components: 0