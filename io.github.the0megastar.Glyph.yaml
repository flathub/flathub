app-id: io.github.the0megastar.Glyph
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: glyph

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=xdg-data/applications:create
  - --filesystem=xdg-data/glyph:create
  - --filesystem=host:ro
  - --filesystem=/var/lib/flatpak:ro
  - --filesystem=xdg-data/flatpak:ro

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: glyph
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/the0megastar/Glyph/archive/refs/tags/v0.1.0.tar.gz
        sha256: b1761e249cdb24a60e28018155fd19598878a9be0ed2d1b3f76bb1fff8385815
