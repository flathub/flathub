app-id: io.github.the0megastar.Glyph
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: glyph

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=xdg-data/applications:create
  - --filesystem=xdg-data/icons:ro
  - --filesystem=/var/lib/flatpak/exports/share:ro
  - --filesystem=/var/lib/flatpak/app:ro
  - --filesystem=xdg-data/flatpak/exports/share:ro
  - --filesystem=xdg-data/flatpak/app:ro

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: glyph
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/the0megastar/Glyph/archive/refs/tags/v0.1.1.tar.gz
        sha256: a257cb9c28c7b723e4da05d0c0e15b2f7e27a7aeebea6bffa182ccbea96f641d
