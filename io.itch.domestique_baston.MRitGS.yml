sdk: org.freedesktop.Sdk
command: godot-runner
base: org.godotengine.godot.BaseApp
base-version: '4.5'
finish-args:
  - --share=ipc
  - --socket=pulseaudio
  - --socket=x11
  - --device=dri
modules:
  - name: MRitGS
    buildsystem: simple
