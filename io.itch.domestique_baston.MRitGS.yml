id: io.itch.domestique_baston.MRitGS
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: godot-runner
base: org.godotengine.godot.BaseApp
base-version: '4.7'
finish-args:
  - --share=ipc
  - --socket=pulseaudio
  - --socket=x11
  - --device=dri
modules:
  - name: MRitGS
    buildsystem: simple
    build-commands:
      - install -D -m 0644 MRitGS.pck /app/bin/godot-runner.pck
      - install -D -m 0644 -t /app/share/metainfo $FLATPAK_ID.metainfo.xml
      - install -D -m 0644 -t /app/share/applications $FLATPAK_ID.desktop
      - install -D -m 0644 MRitGS.png /app/share/icons/hicolor/256x256/apps/$FLATPAK_ID.png
