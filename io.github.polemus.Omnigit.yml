# Generated by build/linux/flatpak/flathub-manifest.sh from
# build/linux/flatpak/io.github.polemus.Omnigit.yml in https://github.com/Polemus/Omnigit.git
# Do not edit this copy: edit that one and generate this again.
#
# Flatpak manifest for Omnigit.
#
# Build and install it locally with build/linux/flatpak/package.sh, which also
# writes dist/Omnigit-<version>-<arch>.flatpak - a single-file bundle anyone can
# install without a remote.
#
# In the repository the app source is the checkout itself, so a clone builds with
# nothing else fetched. Flathub clones the source on its own machines and needs a
# git source pinned to a tag and a commit instead, so its copy is generated from
# this file by build/linux/flatpak/flathub-manifest.sh - one manifest with one
# line swapped, rather than a second one that quietly drifts from it.
#
# The build runs with no network. Every NuGet package is fetched ahead of time
# into nuget-sources-*.json by build/linux/flatpak/generate-nuget-sources.sh,
# which must be re-run whenever a PackageReference in Omnigit.csproj changes -
# including when Dependabot bumps one. See docs/flatpak.md.
app-id: io.github.polemus.Omnigit
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: omnigit

# Flathub publishes on "stable" and passes this itself; setting it here is what
# makes a bundle built by build/linux/flatpak/package.sh land on the same branch
# rather than on flatpak-builder's default of "master".
default-branch: stable

finish-args:
  # Rendering. Skia draws through the GPU where there is one and falls back to
  # software where there isn't, so --device=dri is what keeps it off the CPU.
  # --share=ipc is for X11's shared memory; without it every frame goes over the
  # socket.
  #
  # x11 rather than the usual wayland + fallback-x11 pair, and that is not an
  # oversight. Avalonia 12 has no Wayland backend - it is X11 only, through
  # XWayland on a Wayland desktop. fallback-x11 hands over the X socket only when
  # the app has no Wayland one, so asking for both would withhold X11 from
  # exactly the desktops that need it and the app would die on startup with
  # "XOpenDisplay failed". Revisit when Avalonia grows a Wayland backend.
  - --share=ipc
  - --socket=x11
  - --device=dri

  # Cloning, fetching, pushing, and the GitHub device-flow sign-in.
  - --share=network

  # Tokens. Omnigit shells out to secret-tool, which reaches the keyring over
  # D-Bus; without this the app falls back to a 0600 file and says so in the
  # accounts page. The secret-tool binary itself is built below - the runtime
  # ships the library but not the tool.
  - --talk-name=org.freedesktop.secrets

  # Repositories live wherever the user keeps them. Home covers most people;
  # the mount points cover a second drive, which is common enough for source
  # trees to be worth naming. Anyone with repositories somewhere else entirely
  # can widen it without a rebuild:
  #     flatpak override --user --filesystem=host io.github.polemus.Omnigit
  # Note this is also what makes the folder picker return real paths rather than
  # /run/user/.../doc/ handles that libgit2 cannot open.
  - --filesystem=home
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=/run/media

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/gtk-doc
  - /share/man
  - '*.a'
  - '*.la'

modules:
  # Omnigit stores tokens by shelling out to secret-tool. org.freedesktop.Platform
  # carries libsecret-1.so.0 but not the command-line tool, so we build it. Only
  # the tool is wanted, hence everything else here is switched off: no
  # introspection, no Vala bindings, no documentation, no PAM module.
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dintrospection=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dmanpage=false
      - -Dbash_completion=disabled
      - -Dtpm2=false
      - -Dpam=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.7.tar.xz
        sha256: 6b452e4750590a2b5617adc40026f28d2f4903de15f1250e1d1c40bfd68ed55e
        x-checker-data:
          type: gnome
          name: libsecret
          stable-only: true

  - name: omnigit
    buildsystem: simple
    build-commands:
      # One shell for the publish, because enable.sh has to be sourced in the
      # same one that runs dotnet - each build-command gets a fresh shell.
      #
      # --source points restore at the pre-fetched packages and, unlike adding a
      # source in NuGet.config, it *replaces* the configured ones. That is what
      # stops restore reaching for nuget.org in a build with no network.
      - |
        set -eu
        . /usr/lib/sdk/dotnet10/enable.sh

        case "$FLATPAK_ARCH" in
            x86_64)  rid=linux-x64   ;;
            aarch64) rid=linux-arm64 ;;
            *) echo "no .NET runtime identifier for $FLATPAK_ARCH" >&2 ; exit 1 ;;
        esac

        dotnet publish src/Omnigit/Omnigit.csproj \
            --configuration Release \
            --runtime "$rid" \
            --self-contained true \
            --source ./nuget-sources \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            --output /app/lib/omnigit

        chmod +x /app/lib/omnigit/Omnigit

      # The manifest's `command` and the desktop entry's Exec= are both "omnigit",
      # so the real binary needs a name on PATH next to it.
      - install -d /app/bin
      - ln -sf ../lib/omnigit/Omnigit /app/bin/omnigit

      # The same desktop entry, metainfo and icons the .deb and .rpm install.
      - install -Dm644 build/linux/io.github.polemus.Omnigit.desktop
          /app/share/applications/io.github.polemus.Omnigit.desktop
      - install -Dm644 build/linux/io.github.polemus.Omnigit.metainfo.xml
          /app/share/metainfo/io.github.polemus.Omnigit.metainfo.xml

      # Flathub asks that the licence ship at this exact path. $FLATPAK_DEST is
      # /app, and using it rather than writing /app is the convention there.
      - install -Dm644 LICENSE "$FLATPAK_DEST/share/licenses/$FLATPAK_ID/LICENSE"
      - |
        set -eu
        for size in 16 32 48 64 128 256; do
            install -Dm644 "build/linux/icons/omnigit-$size.png" \
                "/app/share/icons/hicolor/${size}x${size}/apps/io.github.polemus.Omnigit.png"
        done
        install -Dm644 src/Omnigit/Assets/omnigit.svg \
            /app/share/icons/hicolor/scalable/apps/io.github.polemus.Omnigit.svg

    sources:
      # Rewritten from the `type: dir` source in the manifest this was
      # generated from, by build/linux/flatpak/flathub-manifest.sh.
      - type: git
        url: https://github.com/Polemus/Omnigit.git
        tag: v0.1.0
        commit: 5232078c7d42ac12c5f99ef655d1eadc22986490
      # Generated. One file per architecture, because a self-contained publish
      # pulls in a runtime pack for its own target and there is no reason to make
      # an aarch64 builder download the x86_64 one.
      - nuget-sources-x86_64.json
      - nuget-sources-aarch64.json
