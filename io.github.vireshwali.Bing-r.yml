app-id: io.github.vireshwali.Bing-r
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: bingr
base: io.qt.PySide.BaseApp
base-version: '6.11'
finish-args:
- --share=ipc
- --socket=fallback-x11
- --socket=wayland
- --device=dri
- --share=network
- --socket=pulseaudio
- --env=QML_IMPORT_PATH=/app/share/bingr
- --env=QT_QUICK_CONTROLS_CONF=/app/share/bingr/qtquickcontrols2.conf
- --env=LD_LIBRARY_PATH=/app/lib:/app/lib64
- --env=GTK_MODULES=
- --env=QT_NO_SESSIONMANAGEMENT=1
cleanup-commands:
- /app/cleanup-BaseApp.sh
build-options:
  env:
    PKG_CONFIG_PATH: /app/lib/pkgconfig:/app/lib64/pkgconfig:/app/share/pkgconfig
modules:
- name: libass
  cleanup:
  - /include
  - /lib/pkgconfig
  config-opts:
  - --disable-static
  - --enable-asm
  - --enable-harfbuzz
  - --enable-fontconfig
  sources:
  - type: git
    url: https://github.com/libass/libass.git
    tag: 0.17.5
    commit: 4a05d8127f525943ebf45fdc6497c9e665947f0d
- name: libplacebo
  buildsystem: meson
  config-opts:
  - -Dvulkan=enabled
  - -Dshaderc=enabled
  cleanup:
  - /include
  - /lib/pkgconfig
  sources:
  - type: git
    url: https://github.com/haasn/libplacebo.git
    tag: v7.360.1
    commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
- name: mujs
  buildsystem: autotools
  no-autogen: true
  make-args:
  - release
  make-install-args:
  - prefix=/app
  - install-shared
  cleanup:
  - /bin
  - /include
  - /lib/pkgconfig
  sources:
  - type: git
    url: https://codeberg.org/ccxvii/mujs.git
    tag: 1.3.8
    commit: 307f18c4216420f2f56e22d8e7040baa39a6304a
  - type: file
    url: https://www.unicode.org/Public/16.0.0/ucd/UnicodeData.txt
    sha256: ff58e5823bd095166564a006e47d111130813dcf8bf234ef79fa51a870edb48f
  - type: file
    url: https://www.unicode.org/Public/16.0.0/ucd/SpecialCasing.txt
    sha256: 8d5de354eef79f2395a54c9c7dcebbaf3d30fc962d0f85611ea97aa973a0c451
- name: uchardet
  buildsystem: cmake-ninja
  config-opts:
  - -DCMAKE_BUILD_TYPE=Release
  - -DBUILD_STATIC=0
  # Install to /app/lib not /app/lib64 so pkg-config finds the .pc
  # (mpv only searches PKG_CONFIG_PATH=/app/lib/pkgconfig).
  - -DCMAKE_INSTALL_LIBDIR=lib
  # TODO: can be removed when updating to uchardet > 0.0.8
  - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
  cleanup:
  - /bin
  - /include
  - /lib/pkgconfig
  - /share/man
  sources:
  - type: archive
    url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
    sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0
- name: hwdata
  buildsystem: autotools
  sources:
  - type: archive
    url: https://github.com/vcrhonek/hwdata/archive/refs/tags/v0.394.tar.gz
    sha256: b7c3fd7214a3b7c49d2661db127a712dc11cffd1799f793947aa1cb20aaf3298
- name: libdisplay-info
  buildsystem: meson
  sources:
  - type: archive
    url: https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.2.0/libdisplay-info-0.2.0.tar.gz
    sha256: f7331fcaf5527251b84c8fb84238d06cd2f458422ce950c80e86c72927aa8c2b
- name: libXpresent
  buildsystem: autotools
  sources:
  - type: git
    url: https://gitlab.freedesktop.org/xorg/lib/libxpresent.git
    tag: libXpresent-1.0.2
    commit: 4d92149372461bf575e8a09b1064a2884c38c3aa
- name: x264
  cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  config-opts:
  - --disable-cli
  - --enable-shared
  sources:
  - type: git
    url: https://code.videolan.org/videolan/x264.git
    commit: b35605ace3ddf7c1a5d67a2eb553f034aef41d55
- name: x265
  buildsystem: cmake
  subdir: source
  config-opts:
  - -DCMAKE_BUILD_TYPE=Release
  - -DBUILD_STATIC=0
  cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  sources:
  - type: git
    url: https://bitbucket.org/multicoreware/x265_git.git
    tag: '4.2'
    commit: e444744c03978c1fb4e037168967020cf2648427
- name: lame
  no-autogen: true
  config-opts:
  - --disable-frontend
  - --enable-nasm
  cleanup:
  - /include
  - /lib/pkgconfig
  sources:
  - type: archive
    url: https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
    sha256: ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e
- name: ffmpeg
  config-opts:
  - --disable-debug
  - --disable-doc
  - --disable-static
  - --enable-gpl
  - --enable-shared
  - --enable-version3
  - --enable-openssl
  - --enable-libass
  - --enable-libdav1d
  - --enable-libfreetype
  - --enable-libmp3lame
  - --enable-libopus
  - --enable-libvpx
  - --enable-libx264
  - --enable-libx265
  - --enable-vulkan
  - --enable-libdrm
  - --enable-vaapi
  cleanup:
  - /include
  - /lib/pkgconfig
  - /share/ffmpeg/examples
  sources:
  - type: git
    url: https://github.com/FFmpeg/FFmpeg.git
    tag: n8.1.2
    commit: 38b88335f99e76ed89ff3c93f877fdefce736c13
- name: mpv
  buildsystem: meson
  config-opts:
  - -Dlibmpv=true
  - -Dcplayer=false
  - -Dwerror=false
  - -Dbuild-date=false
  - -Dvulkan=enabled
  - -Dgl=enabled
  - -Degl=enabled
  - -Degl-x11=enabled
  - -Degl-wayland=enabled
  - -Dgl-x11=enabled
  - -Ddrm=enabled
  - -Dgbm=enabled
  - -Dx11=enabled
  - -Dwayland=enabled
  - -Ddmabuf-wayland=enabled
  - -Dalsa=enabled
  - -Dpulse=enabled
  - -Dpipewire=enabled
  - -Dopenal=enabled
  - -Dlcms2=enabled
  - -Diconv=enabled
  - -Djavascript=enabled
  - -Duchardet=enabled
  - -Dcdda=disabled
  - -Ddvdnav=disabled
  - -Dlibbluray=disabled
  - -Ddvbin=disabled
  - -Dlibavdevice=disabled
  - -Drubberband=disabled
  - -Dzimg=disabled
  - -Dvapoursynth=disabled
  - -Dlua=disabled
  - -Dvaapi=enabled
  - -Dvdpau=enabled
  cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  sources:
  - type: git
    url: https://github.com/mpv-player/mpv.git
    tag: v0.41.0
    commit: 41f6a645068483470267271e1d09966ca3b9f413
- "pypi-dependencies.yaml"
- name: bing-r
  buildsystem: simple
  build-commands:
  - pip3 install --no-build-isolation --prefix=/app --no-deps .
  - ldconfig /app/lib
  - mkdir -p /app/share/bingr
  - cp -r src/bingr/ui /app/share/bingr/ui
  - cp -r src/bingr/controllers /app/share/bingr/controllers
  - cp -r src/bingr/services /app/share/bingr/services
  - cp -r src/bingr/ui_models /app/share/bingr/ui_models
  - cp qtquickcontrols2.conf /app/share/bingr/qtquickcontrols2.conf
  - ln -sf /app/lib/python*/site-packages/PySide6/Qt/qml/QtQuick/Studio /app/lib/qml/QtQuick/Studio
  - python3 scripts/convert_qrc_refs.py /app/share/bingr/ui
  - install -Dm644 flatpak/io.github.vireshwali.Bing-r.desktop /app/share/applications/io.github.vireshwali.Bing-r.desktop
  - install -Dm644 flatpak/io.github.vireshwali.Bing-r.metainfo.xml /app/share/metainfo/io.github.vireshwali.Bing-r.metainfo.xml
  - install -Dm644 flatpak/io.github.vireshwali.Bing-r.png /app/share/icons/hicolor/512x512/apps/io.github.vireshwali.Bing-r.png
  sources:
  - type: git
    url: https://github.com/vireshwali/Bing-r.git
    tag: v1.6.9-Hangul
    commit: 1ebaa750dde126425c24eab8d0b3d0e7546f6925