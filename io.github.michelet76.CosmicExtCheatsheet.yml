id: io.github.michelet76.CosmicExtCheatsheet
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cosmic-ext-cheatsheet

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # The cheatsheet reads the compositor's keyboard shortcuts and writes its own
  # entry into the user's custom shortcuts, which is how the global key
  # combination is registered. cosmic-comp watches this directory.
  - --filesystem=xdg-config/cosmic

  # The shipped shortcut defaults live in the host's /usr/share/cosmic. Flatpak
  # reserves /usr, so read-only host-os access is the only way to reach them;
  # without it the sheet could only show custom bindings. XDG_DATA_DIRS is
  # extended so the config library finds them at their host location.
  - --filesystem=host-os:ro
  - --env=XDG_DATA_DIRS=/app/share:/usr/share:/usr/share/runtime/share:/run/host/user-share:/run/host/share:/run/host/usr/share

  # cosmic-config uses the settings daemon to watch configuration changes.
  - --talk-name=com.system76.CosmicSettingsDaemon

  # Clicking a row in the cheatsheet runs that shortcut's command, which belongs
  # to the host session (a terminal, the launcher, a volume change), so it is
  # handed to flatpak-spawn --host rather than run inside the sandbox.
  - --talk-name=org.freedesktop.Flatpak

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/cosmic-ext-cheatsheet/cargo

modules:
  - name: cosmic-ext-cheatsheet
    buildsystem: simple
    build-options:
      env:
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release
      - install -Dm0755 target/release/cosmic-ext-cheatsheet /app/bin/cosmic-ext-cheatsheet
      - install -Dm0755 target/release/cosmic-ext-applet-cheatsheet /app/bin/cosmic-ext-applet-cheatsheet
      - install -Dm0644 res/io.github.michelet76.CosmicExtCheatsheet.desktop
        /app/share/applications/io.github.michelet76.CosmicExtCheatsheet.desktop
      - install -Dm0644 res/io.github.michelet76.CosmicExtCheatsheet.Applet.desktop
        /app/share/applications/io.github.michelet76.CosmicExtCheatsheet.Applet.desktop
      - install -Dm0644 res/io.github.michelet76.CosmicExtCheatsheet.metainfo.xml
        /app/share/metainfo/io.github.michelet76.CosmicExtCheatsheet.metainfo.xml
      - install -Dm0644 res/icons/hicolor/scalable/apps/io.github.michelet76.CosmicExtCheatsheet.svg
        /app/share/icons/hicolor/scalable/apps/io.github.michelet76.CosmicExtCheatsheet.svg
      - install -Dm0644 res/icons/hicolor/scalable/apps/io.github.michelet76.CosmicExtCheatsheet-symbolic.svg
        /app/share/icons/hicolor/scalable/apps/io.github.michelet76.CosmicExtCheatsheet-symbolic.svg
    sources:
      - type: git
        url: https://github.com/michelet76/CosmicExtCheatsheet.git
        tag: v0.1.1
        commit: 096c6f41b79f86c6152d8a05bc82f54439f3aef7
      - cargo-sources.json
