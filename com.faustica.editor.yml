# Flatpak manifest (draft), see _hinweise/linux.md 3.3. Goes into the Flathub repo
# github.com/flathub/com.faustica.editor together with the .desktop and metainfo files next to it.
# Faustica is proprietary: Flathub doesn't build it from source but unpacks the finished .deb from
# faustica.com (built by .github/workflows/linux-build.yml). For each release, update url and sha256.
app-id: com.faustica.editor
# Ships webkit2gtk-4.1 (the GTK 3 WebKit Tauri 2 needs), Enchant and the Hunspell dictionaries.
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: faustica
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Backup folder and "show in folder": without it the folder picker hands out portal paths like
  # /run/user/1000/doc/ab12cd/... (see _hinweise/linux.md 6). Justify this in the Flathub review.
  - --filesystem=home
  - --talk-name=org.freedesktop.FileManager1
  # The single instance (tauri-plugin-single-instance) owns com.faustica.editor.SingleInstance on
  # the session bus; names under the app ID need no extra permission.
modules:
  - name: faustica
    buildsystem: simple
    sources:
      - type: file
        url: https://www.faustica.com/download/linux/Faustica_1.0.12_amd64.deb
        sha256: 406c810a6eaa72bace86b2a172305115dc5fd972f71c28dce73dd1609f206f0a
        dest-filename: faustica.deb
        only-arches:
          - x86_64
      - type: file
        path: com.faustica.editor.desktop
      - type: file
        path: com.faustica.editor.metainfo.xml
    build-commands:
      - ar x faustica.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/faustica /app/bin/faustica
      # Tauri files the 256 px icon under "256x256@2"; Flatpak only exports the standard sizes.
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/faustica.png /app/share/icons/hicolor/32x32/apps/com.faustica.editor.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/faustica.png /app/share/icons/hicolor/128x128/apps/com.faustica.editor.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/faustica.png /app/share/icons/hicolor/256x256/apps/com.faustica.editor.png
      - install -Dm644 com.faustica.editor.desktop /app/share/applications/com.faustica.editor.desktop
      - install -Dm644 com.faustica.editor.metainfo.xml /app/share/metainfo/com.faustica.editor.metainfo.xml
