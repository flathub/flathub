app-id: app.chatboxai.Chatbox
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: app.chatboxai.Chatbox
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-documents
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: chatbox
    buildsystem: simple
    build-commands:
      - install -D -m 755 -t /app/bin/ app.chatboxai.Chatbox
      - install -D -m 755 -t /app/bin/ apply_extra
      - install -D -m 644 -t /app/share/icons/hicolor/512x512/apps/ app.chatboxai.Chatbox.png
      - install -D -m 644 -t /app/share/applications/ app.chatboxai.Chatbox.desktop
      - install -D -m 644 -t /app/share/metainfo/ app.chatboxai.Chatbox.metainfo.xml
    sources:
      - type: script
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/extra/opt/Chatbox/xyz.chatboxapp.app "$@"
        dest-filename: app.chatboxai.Chatbox

      - type: script
        commands:
          - set -eu
          - set -- Chatbox-*.deb
          - '[ "$#" -eq 1 ] && [ -f "$1" ] || { echo "Expected exactly one Chatbox-*.deb in /app/extra" >&2; exit 1; }'
          - bsdtar -xOf "$1" data.tar.xz > data.tar.xz
          - bsdtar -xf data.tar.xz
          - chmod 755 opt/Chatbox/xyz.chatboxapp.app
          - rm -f -- "$1" data.tar.xz control.tar.xz debian-binary
          - rm -rf usr
        dest-filename: apply_extra

      - type: file
        path: app.chatboxai.Chatbox.png

      - type: file
        path: app.chatboxai.Chatbox.desktop

      - type: file
        path: app.chatboxai.Chatbox.metainfo.xml

      - type: extra-data
        filename: Chatbox-1.23.5-amd64.deb
        only-arches: [x86_64]
        url: https://download.chatboxai.app/releases/Chatbox-1.23.5-amd64.deb
        sha256: fb44694c88f3b6e1ef3363236f23fb963223c82b54673fe20266b0c6d9045502
        size: 137521828
