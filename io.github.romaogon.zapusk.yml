app-id: io.github.romaogon.zapusk
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
base: io.qt.PySide6.BaseApp
base-version: '6.8'
command: zapusk
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: zapusk
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/zapusk /app/bin
      - cp -r zapusk /app/lib/zapusk/
      - cp install.sh install_arch.sh requirements.txt /app/lib/zapusk/
      - sed -i 's/Icon=zapusk/Icon=io.github.romaogon.zapusk/' zapusk.desktop
      - install -Dm644 assets/zapusk.svg /app/share/icons/hicolor/scalable/apps/io.github.romaogon.zapusk.svg
      - install -Dm644 zapusk.desktop /app/share/applications/io.github.romaogon.zapusk.desktop
      - install -Dm644 flatpak/io.github.romaogon.zapusk.metainfo.xml /app/share/metainfo/io.github.romaogon.zapusk.metainfo.xml
      - |
        cat > /app/bin/zapusk <<'INNER'
        #!/bin/sh
        export PYTHONPATH=/app/lib/zapusk
        cd /app/lib/zapusk
        exec python3 -m zapusk gui "$@"
        INNER
      - chmod 755 /app/bin/zapusk
    sources:
      - type: git
        url: https://github.com/romanepev2014-stack/zapusk.git
        tag: "2.9.3"
        commit: 5471a5021a86c8feefbbb82f0304a6779a7ba62e
