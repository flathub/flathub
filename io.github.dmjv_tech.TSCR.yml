# TSCR Flatpak manifest — v2.5.0.0
# Official Flatpak Application ID: io.github.dmjv_tech.TSCR
#
# The official protected TSCR Linux single executable is packaged without
# recompilation, stripping, or debug-information extraction.

app-id: io.github.dmjv_tech.TSCR
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: TSCR

finish-args:
  # GUI: Wayland with X11 fallback and GPU acceleration.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # Online login, purchase, licensing, updates, weather/GEO, and TSCR-AI.
  - --share=network

  # Broad user-file access without host/home sandbox-breaking permissions.
  # Standard XDG user directories.
  - --filesystem=xdg-desktop
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=xdg-pictures
  - --filesystem=xdg-public-share
  - --filesystem=xdg-templates
  - --filesystem=xdg-videos

  # Common removable/external and manually mounted filesystem locations.
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt

  # Linux Secret Service / KWallet-compatible keyring access.
  - --talk-name=org.freedesktop.secrets

  # KDE/StatusNotifier system-tray integration.
  - --talk-name=org.kde.StatusNotifierWatcher

build-options:
  strip: false
  no-debuginfo: true

modules:
  - name: tscr
    buildsystem: simple
    only-arches:
      - x86_64

    build-commands:
      - install -Dm755 TSCR /app/bin/TSCR
      - install -Dm644 README.txt /app/share/doc/io.github.dmjv_tech.TSCR/README.txt
      - install -Dm644 LICENSE.txt /app/share/licenses/io.github.dmjv_tech.TSCR/LICENSE.txt
      - install -Dm644 io.github.dmjv_tech.TSCR.desktop /app/share/applications/io.github.dmjv_tech.TSCR.desktop
      - install -Dm644 io.github.dmjv_tech.TSCR.metainfo.xml /app/share/metainfo/io.github.dmjv_tech.TSCR.metainfo.xml
      - install -Dm644 io.github.dmjv_tech.TSCR.png /app/share/icons/hicolor/512x512/apps/io.github.dmjv_tech.TSCR.png

    sources:
      - type: archive
        url: https://github.com/DMJV-Tech/TSCR-Releases/releases/download/v2.5.0.0/TSCR_linux.zip
        sha256: 11b641111ec105cb6393c601adeb7495a6051852d409642056b320c9299323bc

      - type: file
        path: io.github.dmjv_tech.TSCR.desktop

      - type: file
        path: io.github.dmjv_tech.TSCR.metainfo.xml

      - type: file
        path: io.github.dmjv_tech.TSCR.png
