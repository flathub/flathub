app-id: space.shollmann.astroshelf
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: astroshelf

finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  # tkinter.filedialog does not support XDG portals
  - --filesystem=home
  # Removable media: archive/workspace can live on external drives
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  # D-Bus: auto-detect removable devices via udisks2
  - --system-talk-name=org.freedesktop.UDisks2

modules:
  - name: tkinter
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-build-isolation .
    sources:
      - type: git
        url: https://github.com/iwalton3/tkinter-standalone
        commit: 8e78e38ef0cceb44a3a0062e1c314a4ff3f981db
    modules:
      - name: tcl
        buildsystem: autotools
        subdir: unix
        config-opts:
          - --disable-zipfs
        post-install:
          - find /app/lib -name "libtcl*.so*" -exec chmod 755 {} +
        cleanup:
          - /bin
          - /lib/pkgconfig
          - /man
        sources:
          - type: archive
            url: https://prdownloads.sourceforge.net/tcl/tcl9.0.3-src.tar.gz
            sha256: 2537ba0c86112c8c953f7c09d33f134dd45c0fb3a71f2d7f7691fd301d2c33a6
      - name: tk
        buildsystem: autotools
        subdir: unix
        config-opts:
          - --disable-zipfs
        post-install:
          - find /app/lib -name "libtk*.so*" -exec chmod 755 {} +
        cleanup:
          - /bin
          - /lib/pkgconfig
          - /man
        sources:
          - type: archive
            url: https://prdownloads.sourceforge.net/tcl/tk9.0.3-src.tar.gz
            sha256: bf344efadb618babb7933f69275620f72454d1c8220130da93e3f7feb0efbf9b

  - python3-deps.json

  - name: astroshelf
    buildsystem: simple
    build-commands:
      - install -d /app/share/astroshelf
      - cp -r core ui locales assets settings.py paths.py main.py catalog.txt
          /app/share/astroshelf/
      - install -Dm755 astroshelf.sh /app/bin/astroshelf
      - install -Dm644 build/linux/space.shollmann.astroshelf.desktop
          /app/share/applications/space.shollmann.astroshelf.desktop
      - install -Dm644 build/linux/space.shollmann.astroshelf.metainfo.xml
          /app/share/metainfo/space.shollmann.astroshelf.metainfo.xml
      - install -Dm644 assets/icon.png
          /app/share/icons/hicolor/256x256/apps/space.shollmann.astroshelf.png
      - install -Dm644 LICENSE
          /app/share/licenses/space.shollmann.astroshelf/LICENSE
    sources:
      - type: git
        url: https://gitlab.com/santiago.hollmann/astroshelf
        tag: v1.0.1
        commit: 2f5c11041103cff0049bb19bbaf43bf2f52f1310
      - type: file
        path: astroshelf.sh
