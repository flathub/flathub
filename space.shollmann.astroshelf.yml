app-id: space.shollmann.astroshelf
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.python312
command: astroshelf

build-options:
  append-path: /usr/lib/sdk/python312/bin
  env:
    PYTHON: /usr/lib/sdk/python312/bin/python3
    PIP_DISABLE_PIP_VERSION_CHECK: "1"

finish-args:
  # Display
  - --share=ipc
  - --socket=x11
  - --device=dri
  # Filesystem: workspace/archive are user-chosen directories, picked at runtime
  # via a directory dialog - they can live anywhere in the user's home tree.
  # Flathub exception requested: app cannot use XDG portals because it needs
  # persistent access to two arbitrary user-chosen directories across sessions.
  - --filesystem=home
  # Removable media: archive and workspace can live on external drives
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  # D-Bus: auto-detect removable devices via udisks2
  - --system-talk-name=org.freedesktop.UDisks2

modules:
  - python3-deps.json

  - name: astroshelf
    buildsystem: simple
    build-commands:
      # Install app source
      - install -d /app/share/astroshelf
      - cp -r core ui locales assets settings.py paths.py main.py catalog.txt
          /app/share/astroshelf/
      # Launcher wrapper
      - |
        install -Dm755 /dev/stdin /app/bin/astroshelf << 'EOF'
        #!/bin/bash
        if [ -z "$DISPLAY" ]; then
            for sock in /tmp/.X11-unix/X*; do
                [ -S "$sock" ] && export DISPLAY=":${sock##*X}" && break
            done
        fi
        cd /app/share/astroshelf
        exec /usr/lib/sdk/python312/bin/python3 /app/share/astroshelf/main.py "$@"
        EOF
      # Desktop integration
      - install -Dm644 build/linux/space.shollmann.astroshelf.desktop
          /app/share/applications/space.shollmann.astroshelf.desktop
      - install -Dm644 build/linux/space.shollmann.astroshelf.metainfo.xml
          /app/share/metainfo/space.shollmann.astroshelf.metainfo.xml
      - install -Dm644 assets/icon.png
          /app/share/icons/hicolor/256x256/apps/space.shollmann.astroshelf.png
      # License
      - install -Dm644 LICENSE
          /app/share/licenses/space.shollmann.astroshelf/LICENSE
    sources:
      - type: git
        url: https://gitlab.com/santiago.hollmann/astroshelf
        tag: v1.0.0
        commit: d27636ac52dd60de2794c377eefc243a8074577f
