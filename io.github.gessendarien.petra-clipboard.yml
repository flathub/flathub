app-id: io.github.gessendarien.petra-clipboard
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: petra
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-download:ro
  - --filesystem=xdg-desktop:ro
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.la'
  - '*.a'
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - name: libxtst
    sources:
      - type: archive
        url: https://www.x.org/archive/individual/lib/libXtst-1.2.4.tar.gz
        sha256: 01366506aeb033f6dffca5326af85f670746b0cabbfd092aabefb046cf48c445
  - name: xdotool
    buildsystem: simple
    build-commands:
      - make PREFIX=/app
      - make install PREFIX=/app
    sources:
      - type: archive
        url: https://github.com/jordansissel/xdotool/archive/refs/tags/v3.20211022.1.tar.gz
        sha256: 82b15a944a5e82fee15e0f6116bd9f642bc3d0bb6989fc0ca5ad9dfe35de0847
  - name: petra
    buildsystem: simple
    build-commands:
      - install -Dm755 petra.sh ${FLATPAK_DEST}/bin/petra
      - mkdir -p ${FLATPAK_DEST}/share/petra
      - cp -r src icons global-version.txt ${FLATPAK_DEST}/share/petra/
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 icons/petra-512.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
    sources:
      - type: git
        url: https://github.com/gessendarien/petra-clipboard.git
        tag: '0.1.4'
        commit: ae49287922e03358accab7dfb0808e58420d87b8
