app-id: io.github.sc_software_tools.sc_utility_suite_dist.PdfKnife
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: sc-pdf-knife
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.secrets
modules:
  - name: sc-pdf-knife
    buildsystem: simple
    build-commands:
      - mkdir -p /app/PdfKnife && cp -r . /app/PdfKnife/ && rm -f /app/PdfKnife/*.pdb /app/PdfKnife/*.desktop /app/PdfKnife/*.svg
      - install -Dm755 sc-pdf-knife.sh /app/bin/sc-pdf-knife
      - install -Dm644 sc-pdf-knife.svg /app/share/icons/hicolor/scalable/apps/io.github.sc_software_tools.sc_utility_suite_dist.PdfKnife.svg
      - desktop-file-edit --set-key=Exec --set-value='sc-pdf-knife %F' --set-icon=io.github.sc_software_tools.sc_utility_suite_dist.PdfKnife --set-key=StartupWMClass --set-value=PdfKnife.Desktop sc-pdf-knife.desktop && install -Dm644 sc-pdf-knife.desktop /app/share/applications/io.github.sc_software_tools.sc_utility_suite_dist.PdfKnife.desktop
      - install -Dm644 io.github.sc_software_tools.sc_utility_suite_dist.PdfKnife.metainfo.xml /app/share/metainfo/io.github.sc_software_tools.sc_utility_suite_dist.PdfKnife.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/sc-software-tools/sc-utility-suite-dist/releases/download/suite-v1.1.2/PdfKnife-1.1.2-linux-x64.tar.gz
        sha256: 458759caa3e2fdb03048ab4e76f08edc378259117076b48d5f6f372e55295e5a
        strip-components: 1
      - type: file
        path: sc-pdf-knife.sh
      - type: file
        path: io.github.sc_software_tools.sc_utility_suite_dist.PdfKnife.metainfo.xml
