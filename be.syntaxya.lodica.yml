app-id: be.syntaxya.lodica
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: lodica
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
build-options:
  append-path: /usr/lib/sdk/node22/bin
  env:
    XDG_CACHE_HOME: /run/build/lodica/flatpak-node/cache
    npm_config_cache: /run/build/lodica/flatpak-node/npm-cache
    npm_config_offline: 'true'
    ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    CSC_IDENTITY_AUTO_DISCOVERY: 'false'
modules:
  - name: lodica
    buildsystem: simple
    build-commands:
      - cd desktop && npm ci --offline --ignore-scripts
      - unzip -q electron.zip -d electron-dist
      - cd desktop && npm run config && npm run icon
      - cd desktop && npx electron-builder --linux --dir --x64 -c.electronDist=../electron-dist -c.electronVersion=44.6.0 -c.npmRebuild=false -c.linux.executableName=lodica
      - cp -r desktop/dist/linux-unpacked /app/lodica
      - install -Dm755 lodica.sh /app/bin/lodica
      - install -Dm644 desktop/flatpak/flathub/be.syntaxya.lodica.desktop /app/share/applications/be.syntaxya.lodica.desktop
      - install -Dm644 desktop/flatpak/flathub/be.syntaxya.lodica.metainfo.xml /app/share/metainfo/be.syntaxya.lodica.metainfo.xml
      - install -Dm644 docs/logo/lodica-app-icon.svg /app/share/icons/hicolor/scalable/apps/be.syntaxya.lodica.svg
    sources:
      - type: git
        url: https://github.com/bent-syntax/lodica-browser.git
        commit: fcf04e799423af82278fac4e8aedd94ebffcfbf7
      - generated-sources.json
      - type: file
        url: https://github.com/electron/electron/releases/download/v44.6.0/electron-v44.6.0-linux-x64.zip
        sha256: 20cafbe96e0ab8ad95cd31804acd683142b361f9e25f1595aecf67177d0a8915
        dest-filename: electron.zip
        only-arches: [x86_64]
      - type: script
        dest-filename: lodica.sh
        commands:
          - exec zypak-wrapper /app/lodica/lodica "$@"
