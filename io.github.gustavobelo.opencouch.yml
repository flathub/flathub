app-id: io.github.gustavobelo.opencouch
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: opencouch

finish-args:
  - --share=ipc
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=xdg-config/open-couch-engine:create
  - --filesystem=xdg-config/autostart:create
  - --talk-name=org.kde.StatusNotifierWatcher
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: opencouch
    buildsystem: cmake-ninja
    subdir: app
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/GustavoBelo/OpenCouch.git
        tag: v1.2.0
        commit: f46b9c33d6464ea3c2a6c77b47d0a4b5f00528e9
