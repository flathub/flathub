# Macadress Scanner is closed-source freeware, so it is not built from
# source here: this unpacks a versioned release tarball (pinned by
# sha256) whose binary is built with `-tags flatpak`, which drops a
# raw-ARP scan and a pkexec path that cannot work inside the sandbox.
app-id: com.macadress.scanner
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: macadress-scanner

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Fyne draws its own file chooser instead of the portal, so CSV export
  # needs a real path.
  - --filesystem=xdg-download

modules:
  - name: macadress-scanner
    buildsystem: simple
    build-commands:
      - install -Dm00755 usr/local/bin/macadress-scanner /app/bin/macadress-scanner
      - install -Dm00644 com.macadress.scanner.desktop /app/share/applications/com.macadress.scanner.desktop
      - install -Dm00644 com.macadress.scanner.metainfo.xml /app/share/metainfo/com.macadress.scanner.metainfo.xml
      - install -Dm00644 icon.png /app/share/icons/hicolor/512x512/apps/com.macadress.scanner.png
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://macadress.com/static/scanner/MacadressScanner-1.0.0-linux-flatpak-amd64.tar.xz
        sha256: 470cf02f30385cfcfbc0d6cdea009aed75b46577e0e333ea6e98b26aabee4e3c
        x-checker-data:
          type: json
          url: https://api.macadress.com/v1/app/version
          version-query: .latest_version
          url-query: '"https://macadress.com/static/scanner/MacadressScanner-" + $version + "-linux-flatpak-amd64.tar.xz"'
      - type: file
        path: com.macadress.scanner.desktop
      - type: file
        path: com.macadress.scanner.metainfo.xml
      - type: file
        path: icon.png
