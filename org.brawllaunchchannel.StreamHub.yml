app-id: org.brawllaunchchannel.StreamHub
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron28.BaseApp
base-version: '23.08'
command: streamhub
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --owner-name=org.brawllaunchchannel.StreamHub

modules:
  - name: streamhub
    buildsystem: simple
    build-commands:
      - install -Dm755 streamhub.sh /app/bin/streamhub
      - cp -r . /app/lib/streamhub
    sources:
      - type: git
        url: https://github.com/brawllaunchchannel22/streamhub.git
        tag: v3.0.3
      - type: file
        path: streamhub.sh
