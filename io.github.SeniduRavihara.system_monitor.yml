app-id: io.github.SeniduRavihara.system_monitor
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: system-monitor

finish-args:
  # Inter-process communication
  - --share=ipc
  # Display servers (Wayland and X11 fallback)
  - --socket=wayland
  - --socket=fallback-x11
  # Hardware graphics acceleration
  - --device=dri
  # Network monitoring
  - --share=network
  # Access host filesystem mount points to inspect disk and system stats
  - --filesystem=host:ro
  # Network monitoring socket permissions
  # Flatpak portal communication for host inspection
  - --talk-name=org.freedesktop.Flatpak

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/system-monitor/cargo

modules:
  - name: system-monitor
    buildsystem: simple
    build-commands:
      # Build release binary using dependencies supplied by cargo-sources.json
      - cargo build --offline --release --locked
      # Install binary
      - install -Dm755 target/release/system-monitor /app/bin/system-monitor
      # Install desktop file & appstream metadata
      - install -Dm644 packaging/flatpak/io.github.SeniduRavihara.system_monitor.desktop /app/share/applications/io.github.SeniduRavihara.system_monitor.desktop
      - install -Dm644 packaging/flatpak/io.github.SeniduRavihara.system_monitor.metainfo.xml /app/share/metainfo/io.github.SeniduRavihara.system_monitor.metainfo.xml
      # Install icon
      - install -Dm644 assets/icons/system-monitor.svg /app/share/icons/hicolor/scalable/apps/io.github.SeniduRavihara.system_monitor.svg
    sources:
      - type: git
        url: https://github.com/SeniduRavihara/system-monitor.git
        tag: v0.1.0
        commit: 8f14bab60274d7d138c699b8520c61a4c52f9a6d
      - cargo-sources.json
