id: io.github.fgeroldi.tibia
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
only-arches: x86_64
command: tibia-run

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=ipc
  - --share=network
  - --device=dri

modules:
  - name: libxcb-cursor
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://xcb.freedesktop.org/dist/xcb-util-cursor-0.1.6.tar.xz
        sha256: fdeb8bd127873519be5cc70dcd0d3b5d33b667877200f9925a59fdcad8f7a933

  - name: tibia
    buildsystem: simple
    build-commands:
      - install -Dm755 -t ${FLATPAK_DEST}/bin apply_extra tibia-run
      - install -Dm644 -t ${FLATPAK_DEST}/share/applications ${FLATPAK_ID}.desktop
      - install -Dm644 -t ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps ${FLATPAK_ID}.png
      - install -Dm644 -t ${FLATPAK_DEST}/share/metainfo io.github.fgeroldi.tibia.metainfo.xml
    sources:
      - type: extra-data
        filename: tibia.x64.tar.gz
        url: https://static.tibia.com/download/tibia.x64.tar.gz
        sha256: 920f63a07e257039b1a9e4909dedc99deb77cef4a4eff39dbf6f9da54613cf49
        size: 29460486

      - type: script
        dest-filename: apply_extra
        commands:
          - tar xf tibia.x64.tar.gz

      - type: file
        path: io.github.fgeroldi.tibia.desktop

      - type: file
        path: io.github.fgeroldi.tibia.png

      - type: file
        path: io.github.fgeroldi.tibia.metainfo.xml

      - type: script
        dest-filename: tibia-run
        commands:
          # Adjust font rendering to use correct antialiasing
          - if command -v xrdb > /dev/null; then
          -   xrdb -remove Xft.antialias 2>/dev/null || true
          -   xrdb -remove Xft.hintstyle 2>/dev/null || true
          -   xrdb -remove Xft.hinting 2>/dev/null || true
          - fi

          # Force Freetype font interpreter
          - export FREETYPE_PROPERTIES="truetype:interpreter-version=35"
        
          # Run the game
          - cp -rut ${XDG_RUNTIME_DIR} /app/extra/Tibia
          - exec ${XDG_RUNTIME_DIR}/Tibia/Tibia
