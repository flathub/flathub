id: io.gitlab.bitseater.kmeteo
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: io.gitlab.bitseater.kmeteo

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher

modules:
