app-id: io.github.yohoho041_sketch.TextStudio
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: java-studio
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=host
  - --device=dri

modules:
  - name: java-studio
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/share/java-studio /app/share/applications /app/share/metainfo
      - cp -r src /app/share/java-studio/
      - cp java-studio.py /app/share/java-studio/
      - install -m 755 bin/java-studio /app/bin/java-studio
      - install -m 644 java-studio.desktop /app/share/applications/io.github.yohoho041_sketch.TextStudio.desktop
      - install -m 644 io.github.yohoho041_sketch.TextStudio.metainfo.xml /app/share/metainfo/
    sources:
      - type: git
        url: https://github.com/yohoho041-sketch/Text-Studio.git
        commit: 07e444b76df47aa95bdce9965d14df997e099b24
