app-id: io.github.sc_software_tools.sc_utility_suite_dist.MediaTrim
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: sc-media-trim
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.secrets
modules:
  - name: sc-media-trim
    buildsystem: simple
    build-commands:
      - mkdir -p /app/MediaTrim && cp -r . /app/MediaTrim/ && rm -f /app/MediaTrim/*.pdb /app/MediaTrim/*.desktop /app/MediaTrim/*.svg
      - install -Dm755 sc-media-trim.sh /app/bin/sc-media-trim
      - install -Dm644 sc-media-trim.svg /app/share/icons/hicolor/scalable/apps/io.github.sc_software_tools.sc_utility_suite_dist.MediaTrim.svg
      - desktop-file-edit --set-key=Exec --set-value='sc-media-trim %F' --set-icon=io.github.sc_software_tools.sc_utility_suite_dist.MediaTrim --set-key=StartupWMClass --set-value=MediaTrim.Desktop sc-media-trim.desktop && install -Dm644 sc-media-trim.desktop /app/share/applications/io.github.sc_software_tools.sc_utility_suite_dist.MediaTrim.desktop
      - install -Dm644 io.github.sc_software_tools.sc_utility_suite_dist.MediaTrim.metainfo.xml /app/share/metainfo/io.github.sc_software_tools.sc_utility_suite_dist.MediaTrim.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/sc-software-tools/sc-utility-suite-dist/releases/download/suite-v1.1.2/MediaTrim-1.1.2-linux-x64.tar.gz
        sha256: 25c30b0aa70205f468bf73a2705d03557c67d8d405d7bb139edbc1335dde00ee
        strip-components: 1
      - type: file
        path: sc-media-trim.sh
      - type: file
        path: io.github.sc_software_tools.sc_utility_suite_dist.MediaTrim.metainfo.xml
