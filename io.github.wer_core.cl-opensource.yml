app-id: io.github.wer_core.cl-opensource
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: CL.Avalonia

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=~/.minecraft:create
  - --filesystem=xdg-run/discord-ipc-0

modules:
  - name: dotnet
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/dotnet10/bin/install.sh

  - name: clegendary-launcher
    buildsystem: simple
    build-options:
      prepend-path: /usr/lib/sdk/dotnet10/bin
      prepend-ld-library-path: /usr/lib/sdk/dotnet10/lib
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
        DOTNET_NOLOGO: 'true'
        DOTNET_ROOT: /usr/lib/sdk/dotnet10/lib
    build-commands:
      - sed -i 's|<TargetFrameworks>net8.0;net10.0</TargetFrameworks>|<TargetFramework>net10.0</TargetFramework>|' CL.Core/CL.Core.csproj
      - |
        RID=$([ "$(uname -m)" = "aarch64" ] && echo "linux-arm64" || echo "linux-x64")
        /usr/lib/sdk/dotnet10/bin/dotnet publish CL.Avalonia/CL.Avalonia.csproj -c Release -r "$RID" --self-contained false --source ./nuget-sources -p:PublishSingleFile=false -o /app/lib/clegendary-launcher
      - |
        cat << 'EOF' > /app/bin/CL.Avalonia
        #!/bin/sh
        export DOTNET_ROOT=/app/lib/dotnet
        exec /app/lib/clegendary-launcher/CL.Avalonia "$@"
        EOF
        chmod +x /app/bin/CL.Avalonia
      - install -Dm644 distribution/flatpak/io.github.wer_core.cl-opensource.desktop /app/share/applications/io.github.wer_core.cl-opensource.desktop
      - install -Dm644 distribution/flatpak/io.github.wer_core.cl-opensource.metainfo.xml /app/share/metainfo/io.github.wer_core.cl-opensource.metainfo.xml
      - install -Dm644 distribution/flatpak/io.github.wer_core.cl-opensource.png /app/share/icons/hicolor/512x512/apps/io.github.wer_core.cl-opensource.png
    sources:
      - type: git
        url: https://github.com/WER-CORE/CL-OpenSource.git
        commit: f4ecad0bcdd51a8eadcc476ffefeb56e3f0dfb81
      - nuget-sources.json
