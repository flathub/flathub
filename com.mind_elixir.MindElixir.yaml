app-id: com.mind_elixir.MindElixir
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: MindElixir

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --env=XDG_DATA_HOME=/var/data
  - --env=XDG_CONFIG_HOME=/var/config
  - --env=XDG_CACHE_HOME=/var/cache

modules:
  - name: mind-elixir
    buildsystem: simple
    build-commands:
      - ar -x *.deb
      - tar -xf data.tar.gz

      - install -Dm755 usr/bin/MindElixir /app/bin/MindElixir.bin
      - install -Dm755 mind-elixir-wrapper.sh /app/bin/MindElixir

      - printf '#!/bin/sh\nexit 0\n' > /app/bin/xdg-mime
      - chmod +x /app/bin/xdg-mime

      - sed -i 's/^Icon=.*/Icon=com.mind_elixir.MindElixir/' "usr/share/applications/Mind Elixir.desktop"
      - install -Dm644 "usr/share/applications/Mind Elixir.desktop" /app/share/applications/com.mind_elixir.MindElixir.desktop

      - install -Dm644 usr/share/icons/hicolor/128x128/apps/MindElixir.png /app/share/icons/hicolor/128x128/apps/com.mind_elixir.MindElixir.png
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/MindElixir.png /app/share/icons/hicolor/32x32/apps/com.mind_elixir.MindElixir.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/MindElixir.png /app/share/icons/hicolor/256x256/apps/com.mind_elixir.MindElixir.png

      - install -Dm644 com.mind_elixir.MindElixir.metainfo.xml /app/share/metainfo/com.mind_elixir.MindElixir.metainfo.xml

      - install -Dm644 local.conf /app/etc/fonts/local.conf

    sources:
      - type: file
        path: com.mind_elixir.MindElixir.metainfo.xml

      - type: file
        path: local.conf

      - type: file
        path: mind-elixir-wrapper.sh

      - type: file
        url: https://github.com/SSShooter/Mind-Elixir-Desktop-Release/releases/download/v1.11.2/Mind.Elixir_1.11.2_amd64.deb
        sha256: 015f91571a3f7366666177240394df085c5dd864f70c402aa8fa589964e9b3b8
        only-arches: [x86_64]
