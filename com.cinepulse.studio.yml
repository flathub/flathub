app-id: com.cinepulse.studio
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: cinepulse
separate-locales: false

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-download:rw
  - --filesystem=xdg-videos:ro

modules:
  - name: cinepulse
    buildsystem: simple
    build-commands:
      - ar x CinePulse-2.0.1.deb
      - tar -xf data.tar.gz
      - cp -R opt/CinePulse /app/
      - install -Dm755 cinepulse.sh /app/bin/cinepulse
      - install -Dm644 com.cinepulse.studio.desktop /app/share/applications/com.cinepulse.studio.desktop
      - install -Dm644 com.cinepulse.studio.metainfo.xml /app/share/metainfo/com.cinepulse.studio.metainfo.xml
      - install -Dm644 com.cinepulse.studio.png /app/share/icons/hicolor/512x512/apps/com.cinepulse.studio.png
      - install -Dm644 com.cinepulse.studio.svg /app/share/icons/hicolor/scalable/apps/com.cinepulse.studio.svg
    sources:
      - type: file
        url: https://github.com/caca1403/cine-pulse/releases/download/v2.0.1/CinePulse-2.0.1.deb
        sha256: d6b219c8873a91c8af8767631771b95535a29d35d2be7950d475e680361addd5
      - type: script
        dest-filename: cinepulse.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - |
            if [ "${XDG_SESSION_TYPE}" = "wayland" ]; then
              exec zypak-wrapper /app/CinePulse/cinepulse --enable-features=UseOzonePlatform --ozone-platform=wayland "$@"
            else
              exec zypak-wrapper /app/CinePulse/cinepulse "$@"
            fi
      - type: file
        path: com.cinepulse.studio.desktop
      - type: file
        path: com.cinepulse.studio.metainfo.xml
      - type: file
        path: com.cinepulse.studio.png
      - type: file
        path: com.cinepulse.studio.svg
