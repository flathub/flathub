# Flathub listing id. Apple / Android / .deb stay ro.biloud.signer.
# First submission is a human PR to flathub/flathub (base new-pr).
# Do not open that PR from an agent (Flathub generative-AI policy).
# extra-data url/sha256/size are filled from a published site tarball.
app-id: eu.tapsign.TapSign
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: tapsign
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --device=all
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: tapsign
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 tapsign.sh /app/bin/tapsign
      - install -Dm644 eu.tapsign.TapSign.desktop /app/share/applications/eu.tapsign.TapSign.desktop
      - install -Dm644 eu.tapsign.TapSign.metainfo.xml /app/share/metainfo/eu.tapsign.TapSign.metainfo.xml
      - install -Dm644 icons/256.png /app/share/icons/hicolor/256x256/apps/eu.tapsign.TapSign.png
      - install -Dm644 icons/128.png /app/share/icons/hicolor/128x128/apps/eu.tapsign.TapSign.png
      - install -Dm644 icons/64.png /app/share/icons/hicolor/64x64/apps/eu.tapsign.TapSign.png
    sources:
      - type: file
        path: apply_extra.sh
      - type: file
        path: tapsign.sh
      - type: file
        path: eu.tapsign.TapSign.desktop
      - type: file
        path: eu.tapsign.TapSign.metainfo.xml
      - type: file
        path: icons/256.png
      - type: file
        path: icons/128.png
      - type: file
        path: icons/64.png
      - type: extra-data
        filename: tapsign-x64.tar.xz
        only-arches: [x86_64]
        url: https://tapsign.eu/downloads/tapsign-linux-x64-1.0.0.12.tar.xz
        sha256: a58b39eb7384b63d97c6397fbf04c8a6cf23b398f0194568f36fcf023767f818
        size: 4564084
        x-checker-data:
          type: json
          url: https://tapsign.eu/api/v1/app/flatpak/x64
          version-query: .version
          url-query: .url
          sha256-query: .sha256
          size-query: .size
          is-main-source: true
      - type: extra-data
        filename: tapsign-arm64.tar.xz
        only-arches: [aarch64]
        url: https://tapsign.eu/downloads/tapsign-linux-arm64-1.0.0.12.tar.xz
        sha256: 97ece8627e5ad0ea7ade9424642930db89d62ff3826f9398196a7ed573c77e48
        size: 4298564
        x-checker-data:
          type: json
          url: https://tapsign.eu/api/v1/app/flatpak/arm64
          version-query: .version
          url-query: .url
          sha256-query: .sha256
          size-query: .size
