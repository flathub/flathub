app-id: fr.morfredus.AntRenamerQt
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: antrenamer-qt

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: antrenamer-qt
    buildsystem: simple
    build-commands:
      - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app
      - cmake --build build --target antrenamer-qt
      - cmake --install build
    sources:
      - type: git
        url: https://github.com/morfredus/ant-renamer-qt.git
        tag: v3.1.1
        commit: ec41f4c36b64664dfda95f45034e6bfda59aeda9
