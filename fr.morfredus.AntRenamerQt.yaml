app-id: fr.morfredus.AntRenamerQt
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: antrenamer-qt

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: antrenamer-qt
    buildsystem: simple
    build-commands:
      - cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - cmake --build build --target antrenamer-qt
      - install -Dm755 build/app/antrenamer-qt /app/bin/antrenamer-qt
      - install -d /app/share/antrenamer-qt
      - cp -r app/Languages app/help /app/share/antrenamer-qt/
      - >-
        sed -e 's/^Icon=.*/Icon=fr.morfredus.AntRenamerQt/'
        scripts/linux/antrenamer-qt.desktop > fr.morfredus.AntRenamerQt.desktop
      - install -Dm644 fr.morfredus.AntRenamerQt.desktop /app/share/applications/fr.morfredus.AntRenamerQt.desktop
      - install -Dm644 packaging/flatpak/fr.morfredus.AntRenamerQt.metainfo.xml /app/share/metainfo/fr.morfredus.AntRenamerQt.metainfo.xml
      - install -Dm644 app/antrenamer-qt.svg /app/share/icons/hicolor/scalable/apps/fr.morfredus.AntRenamerQt.svg
      - install -Dm644 app/antrenamer-qt.png /app/share/icons/hicolor/256x256/apps/fr.morfredus.AntRenamerQt.png
    sources:
      - type: git
        url: https://github.com/morfredus/ant-renamer-qt.git
        tag: v3.1.1
        commit: ec41f4c36b64664dfda95f45034e6bfda59aeda9
