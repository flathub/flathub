app-id: fr.morfredus.AntRenamerQt
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: antrenamer-qt
rename-icon: antrenamer-qt
rename-desktop-file: antrenamer-qt.desktop
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: antrenamer-qt
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: git
        url: https://github.com/morfredus/ant-renamer-qt.git
        tag: v3.2.0
        commit: 4eea25bf48d72e2fe91bfe5bd890dcf34bd2dc2f