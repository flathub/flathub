# Flatpak of the desktop app (Flathub; Linux Mint's Software Manager lists Flathub apps). It repackages the
# release's .deb - the Tauri app built by .github/workflows/app-build.yml - on the GNOME runtime, which has
# the WebKitGTK it runs on. A new release: the .deb's url + sha256 here and a <release> in the metainfo
# (tools/flatpak-update.sh does both).
#   flatpak-builder --user --install --force-clean build-dir com.kaniansky.TunnelerOnline.yml
id: com.kaniansky.TunnelerOnline
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: tunneler-online
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # gamepads (WebKitGTK reads them from /dev/input)
  - --device=all
  # sound
  - --socket=pulseaudio
  # online games
  - --share=network
modules:
  - name: tunneler-online
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/kaniansky/tunneler-online/releases/download/v4.0.0/tunneler-online-4.0.0_amd64.deb
        sha256: b8e8a0634dea5be819a1191009d06d8f3541a7b92ac4f8f56bca5765fb576300
        dest-filename: tunneler-online.deb
        only-arches: [x86_64]
      - type: file
        path: com.kaniansky.TunnelerOnline.desktop
      - type: file
        path: com.kaniansky.TunnelerOnline.metainfo.xml
    build-commands:
      - ar -x tunneler-online.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/tunneler-online -t /app/bin
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/tunneler-online.png /app/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/tunneler-online.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/tunneler-online.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
