  # The app itself: source + launcher + AppStream metadata + icon + desktop file.
  # Sourced from the tagged git commit (Flathub forbids local paths).
  - name: talktype
    buildsystem: simple
    build-commands:
      - install -Dm755 packaging/flatpak/talktype-launcher /app/bin/talktype-launcher
      - mkdir -p /app/lib && cp -r src/talktype /app/lib/talktype
      - install -Dm644 io.github.ronb1964.TalkType.appdata.xml
          /app/share/metainfo/io.github.ronb1964.TalkType.appdata.xml
      # App icon (square SVG copy; Flatpak rejects non-square icons on export).
      - install -Dm644 packaging/flatpak/io.github.ronb1964.TalkType.svg
          /app/share/icons/hicolor/scalable/apps/io.github.ronb1964.TalkType.svg
      - install -Dm644 io.github.ronb1964.TalkType.desktop
          /app/share/applications/io.github.ronb1964.TalkType.desktop
      - sed -i 's|^Exec=.*|Exec=talktype-launcher|'
          /app/share/applications/io.github.ronb1964.TalkType.desktop
    sources:
      - type: git
        url: https://github.com/ronb1964/TalkType.git
        # Pinned commit that carries the 0.7.2 <release> in the appdata (a child
        # of the v0.7.2 tag, which predates the appdata entry). Flathub requires a
        # pinned commit, not a floating branch.
        commit: 76e6cbe3e48407487c89aac8109b2a37d834f9cd
