app-id: io.github.ronb1964.TalkType
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: talktype-launcher

finish-args:
  - --socket=wayland
  # x11, NOT fallback-x11: the recording indicator positions itself with
  # gtk_window_move(), which only XWayland honours, and the service runs with
  # GDK_BACKEND=x11,wayland to use it. fallback-x11 hands out the X socket ONLY
  # when there's no Wayland, so on a Wayland session (GNOME/KDE) the indicator
  # got native Wayland instead — uncentered, unmovable, and mis-rendering styles.
  # Plain x11 always exposes XWayland, matching the AppImage/.deb/.rpm.
  - --socket=x11
  - --share=ipc
  - --socket=pulseaudio
  - --device=dri
  # RUNTIME network is required, not a convenience: on first run TalkType
  # downloads the selected faster-whisper model from Hugging Face, optionally
  # downloads the CUDA runtime for GPU users, and checks GitHub for updates.
  # No models are bundled (they are hundreds of MB and user-selectable). The
  # BUILD, however, is fully offline — every Python dep is a pinned wheel/sdist.
  - --share=network
  # Tray icon (StatusNotifier/AppIndicator), its menu, and notifications. The
  # sandbox D-Bus proxy blocks these host services unless named, so without them
  # the AppIndicator never registers and the tray icon is silently invisible.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-run/tray-icon:create
  # Query GNOME Shell (org.gnome.Shell.Extensions.GetExtensionInfo) to detect
  # whether the TalkType extension is enabled. Inside the sandbox the
  # gnome-extensions CLI and org.gnome.shell gsettings schema are both absent, so
  # this D-Bus call is the only way to know — without it the GTK tray shows
  # alongside the extension's indicator (a duplicate tray icon on GNOME).
  - --talk-name=org.gnome.Shell

modules:
  # PortAudio — sounddevice dlopens libportaudio.so.2 at import; not in the runtime.
  - name: portaudio
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DPA_BUILD_SHARED=ON
      - -DPA_BUILD_STATIC=OFF
      # PortAudio 19.7's CMakeLists predates CMake 4.x's minimum-policy floor;
      # the GNOME 50 SDK ships CMake 4.x, which refuses cmake_minimum_required < 3.5.
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/PortAudio/portaudio.git
        tag: v19.7.0
        commit: 147dd722548358763a8b649b3e4b41dfffbcfbb6

  # Tray icon library: libayatana-appindicator (flathub shared-modules) — provides
  # the AyatanaAppIndicator3 typelib the runtime lacks (also builds
  # libdbusmenu/ayatana-ido/libayatana-indicator/intltool). This is exactly what
  # tray.py requires unguarded, matching the AppImage/.deb/.rpm dependency.
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  # dbus-python: the `dbus` module used by dbus_service.py (tray <-> service <->
  # GNOME extension). Built from source with meson (its 1.4.0 build backend),
  # using the SDK's native meson/ninja + libdbus/glib dev — this sidesteps pip's
  # PEP 517 meson-python backend, which is not shipped in the GNOME 50 SDK.
  - name: python3-dbus-python
    buildsystem: meson
    sources:
        - type: archive
          url: https://files.pythonhosted.org/packages/ff/24/63118050c7dd7be04b1ccd60eab53fef00abe844442e1b6dec92dae505d6/dbus-python-1.4.0.tar.gz
          sha256: 991666e498f60dbf3e49b8b7678f5559b8a65034fdf61aae62cdecdb7d89c770

  # Python ML/audio stack for the runtime's Python 3.13. Fully OFFLINE install:
  # every wheel is pinned by URL + sha256 below and installed with --no-index,
  # so the build never touches the network (a Flathub requirement). evdev is the
  # only sdist here; it builds against the SDK's setuptools via
  # --no-build-isolation. dbus-python is handled by the meson module above.
  - name: python3-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links="file://${PWD}"
          --prefix=${FLATPAK_DEST} --no-build-isolation --no-warn-script-location
          faster-whisper sounddevice pyperclip toml evdev
