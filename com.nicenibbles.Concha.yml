app-id: com.nicenibbles.Concha
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: concha

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: concha
    buildsystem: simple
    build-commands:
      - install -Dm755 apply-extra /app/bin/apply-extra
      - install -Dm755 concha-launcher /app/bin/concha
      - install -Dm644 com.nicenibbles.Concha.desktop /app/share/applications/com.nicenibbles.Concha.desktop
      - install -Dm644 com.nicenibbles.Concha.metainfo.xml /app/share/metainfo/com.nicenibbles.Concha.metainfo.xml
      - install -Dm644 com.nicenibbles.Concha.png /app/share/icons/hicolor/128x128/apps/com.nicenibbles.Concha.png
    sources:
      - type: extra-data
        filename: LinuxConcha2.0.zip
        url: https://github.com/Dangerbites/ConchaReleases/releases/download/2.0.0/LinuxConcha2.0.zip
        sha256: d7fd61333635b4de724ddcd0f66f1fe39c76eede8c2961cac033603ae9fb969b
        size: 98002869
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Dangerbites/ConchaReleases/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name == "LinuxConcha2.0.zip") | .browser_download_url
      - type: script
        dest-filename: apply-extra
        commands:
          - unzip -o LinuxConcha2.0.zip
          - rm LinuxConcha2.0.zip
          - chmod +x Concha2.0.x86_64
      - type: script
        dest-filename: concha-launcher
        commands:
          - exec /app/extra/Concha2.0.x86_64 "$@"
      - type: file
        url: https://raw.githubusercontent.com/Dangerbites/ConchaReleases/ee920dd2cde0572191084b7f3bed9388eb542a5e/flathub/com.nicenibbles.Concha.desktop
        sha256: a3dabe264deb63ffe718f2c47fdd2c90b0d4ed7f0c8e0efdfe6fe670bdbd85bf
      - type: file
        url: https://raw.githubusercontent.com/Dangerbites/ConchaReleases/ee920dd2cde0572191084b7f3bed9388eb542a5e/flathub/com.nicenibbles.Concha.metainfo.xml
        sha256: 3a690491144aeaab65d9c8270c67542f6f29d7dfee0c5126e198f84195ffdc89
      - type: file
        url: https://raw.githubusercontent.com/Dangerbites/ConchaReleases/ee920dd2cde0572191084b7f3bed9388eb542a5e/flathub/com.nicenibbles.Concha.png
        sha256: 0afdedae5eb896096ac3c4b34f1524e85dffac1527b42ba122a7f60569e7de8a
