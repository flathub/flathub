- name: vala
  buildsystem: autotools
  config-opts:
  - --prefix=/app
  - --libdir=/app/lib
  - --disable-unversioned
  - --disable-valadoc
  sources:
  - url: https://download.gnome.org/sources/vala/0.56/vala-0.56.17.tar.xz
    sha256: 26100c4e4ef0049c619275f140d97cf565883d00c7543c82bcce5a426934ed6a
    type: archive
  - type: file
    path: io.github.ahmedrapi79123_cyber.PLY-MUSIC-PLAYER.metainfo.xml
    dest-filename: flathub.metainfo.xml
  build-commands:
  - make -j$FLATPAK_BUILDER_N_JOBS
  - make install
  - "echo \"=== Checking Vala installation ===\"\n\necho \"--- Installed Vala tools\
    \ ---\"\nfind /app -type f \\( -name 'valac' -o -name 'vapigen' \\) -ls || true\n\
    \necho \"--- Build tools ---\"\nls -lh ./compiler/valac || true\nls -lh ./vapigen/vapigen\
    \ || true\n\necho \"--- /app/bin ---\"\nls -lah /app/bin || true\n\nif [ ! -x\
    \ /app/bin/valac ]; then\n  echo \"valac was not installed by make install; installing\
    \ manually...\"\n  mkdir -p /app/bin\n  cp ./compiler/valac /app/bin/valac\n \
    \ chmod +x /app/bin/valac\nfi\n\nif [ ! -x /app/bin/vapigen ]; then\n  echo \"\
    vapigen was not installed by make install; installing manually...\"\n  mkdir -p\
    \ /app/bin\n  cp ./vapigen/vapigen /app/bin/vapigen\n  chmod +x /app/bin/vapigen\n\
    fi\n\necho \"--- Creating vapigen wrapper ---\"\n\nmv /app/bin/vapigen /app/bin/vapigen-real\n\
    \ncat > /app/bin/vapigen <<'EOF'\n#!/bin/sh\nset -e\n\nGIR=\"\"\n\nfor arg in\
    \ \"$@\"; do\n  case \"$arg\" in\n    *.gir)\n      GIR=\"$arg\"\n      ;;\n \
    \ esac\ndone\n\nif [ -n \"$GIR\" ] && [ -f \"$GIR\" ]; then\n  echo \"Cleaning\
    \ unsupported doc:format from $GIR\"\n  sed -i '/<doc:format name=\"unknown\"\\\
    />/d' \"$GIR\"\nfi\n\nexec /app/bin/vapigen-real \"$@\"\nEOF\n\nchmod +x /app/bin/vapigen\n\
    \necho \"--- Final tools ---\"\nls -lh /app/bin/valac\nls -lh /app/bin/vapigen\n\
    ls -lh /app/bin/vapigen-real\n\necho \"--- Versions ---\"\n/app/bin/valac --version\n\
    /app/bin/vapigen --version\n/app/bin/vapigen-real --version\n"
