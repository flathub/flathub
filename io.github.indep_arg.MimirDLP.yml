app-id: io.github.indep_arg.MimirDLP
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: mimirdlp
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-download
modules:
  # yt-dlp stable from PyPI with [default,curl-cffi]: [default] brings yt-dlp-ejs,
  # curl-cffi lets yt-dlp impersonate a browser, as the portable binary can
  # (generated by flatpak-pip-generator).
  - python3-yt-dlp-cffi.json

  - name: deno
    buildsystem: simple
    build-commands:
      - install -Dm755 deno /app/bin/deno
    sources:
      - type: archive
        url: https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip
        sha256: c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490
        only-arches:
          - x86_64
        # Deno's latest release on GitHub, x86_64 zip.
        x-checker-data:
          type: json
          url: https://api.github.com/repos/denoland/deno/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "deno-x86_64-unknown-linux-gnu.zip") | .browser_download_url

  # FFmpeg comes from the GNOME runtime (/usr/bin/ffmpeg), nothing to build.

  - name: mimirdlp
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/mimirdlp/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked
      - install -Dm755 target/release/mimirdlp /app/bin/mimirdlp
      - install -Dm644 packaging/linux/io.github.indep_arg.MimirDLP.desktop /app/share/applications/io.github.indep_arg.MimirDLP.desktop
      - install -Dm644 packaging/linux/io.github.indep_arg.MimirDLP.metainfo.xml /app/share/metainfo/io.github.indep_arg.MimirDLP.metainfo.xml
      - install -Dm644 branding/logo.svg /app/share/icons/hicolor/scalable/apps/io.github.indep_arg.MimirDLP.svg
    sources:
      # The released tag, pinned to its commit (git rev-list -n 1 <tag>).
      - type: git
        url: https://github.com/indep-arg/MimirDLP
        tag: v0.4.0
        commit: 171dc4aa4b5a28773cf6647138cfc917f9440cd6
        # A new vX.Y.Z tag. cargo-sources.json still has to be regenerated
        # by hand for it.
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - cargo-sources.json
