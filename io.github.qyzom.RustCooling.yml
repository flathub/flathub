app-id: io.github.qyzom.RustCooling
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: RustCooling

finish-args:
  # Display & Graphics (Slint FemtoVG OpenGL)
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=dri

  # Hardware USB HID access for ID-COOLING LCD
  - --device=all

  # System silicon temperature reading
  - --filesystem=/sys:ro

  # System Tray via StatusNotifierItem / D-Bus
  - --talk-name=org.kde.StatusNotifierWatcher

  # Persistent configuration
  - --persist=.

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - '*.a'
  - '*.la'

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: RustCooling
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/RustCooling/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      # Configure offline cargo vendoring
      - mkdir -p .cargo && cp cargo/config .cargo/config.toml
      # Build GUI and CLI binaries
      - cargo build --release --offline --bin RustCooling --bin rustcooling-cli
      # Install executables
      - install -Dm755 target/release/RustCooling ${FLATPAK_DEST}/bin/RustCooling
      - install -Dm755 target/release/rustcooling-cli ${FLATPAK_DEST}/bin/rustcooling-cli
      - ln -sf RustCooling ${FLATPAK_DEST}/bin/rustcooling
      # Install Desktop integration
      - install -Dm644 io.github.qyzom.RustCooling.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 io.github.qyzom.RustCooling.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      # Install icons
      - install -Dm644 io.github.qyzom.RustCooling.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.qyzom.RustCooling.png
      - install -Dm644 assets/icons/logo_128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/io.github.qyzom.RustCooling.png
      - install -Dm644 assets/icons/logo_64.png ${FLATPAK_DEST}/share/icons/hicolor/64x64/apps/io.github.qyzom.RustCooling.png
      - install -Dm644 assets/icons/logo_48.png ${FLATPAK_DEST}/share/icons/hicolor/48x48/apps/io.github.qyzom.RustCooling.png
      - install -Dm644 assets/icons/logo_32.png ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/io.github.qyzom.RustCooling.png
      - install -Dm644 assets/icons/logo_16.png ${FLATPAK_DEST}/share/icons/hicolor/16x16/apps/io.github.qyzom.RustCooling.png
    sources:
      - type: git
        url: https://github.com/Qyzom/RustCooling.git
        tag: v1.0.4
        commit: 1099c6b2c07a9dfba4bd3b0737c886a1d2f0e01a
      - type: file
        path: io.github.qyzom.RustCooling.desktop
      - type: file
        path: io.github.qyzom.RustCooling.metainfo.xml
      - type: file
        path: io.github.qyzom.RustCooling.png
      - cargo-sources.json
