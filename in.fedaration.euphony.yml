app-id: in.fedaration.euphony
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: euphony

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-download:ro
  - --device=dri

modules:
  - name: euphony
    buildsystem: simple
    build-commands:
      - chmod +x euphony.AppImage
      - ./euphony.AppImage --appimage-extract
      - install -d /app/bin /app/lib /app/share/applications /app/share/metainfo /app/share/icons/hicolor/256x256/apps
      - cp -r squashfs-root/* /app/
      - ln -sf /app/euphony /app/bin/euphony
      - install -Dm644 in.fedaration.euphony.desktop /app/share/applications/in.fedaration.euphony.desktop
      - install -Dm644 in.fedaration.euphony.metainfo.xml /app/share/metainfo/in.fedaration.euphony.metainfo.xml
      - install -Dm644 in.fedaration.euphony.png /app/share/icons/hicolor/256x256/apps/in.fedaration.euphony.png
    sources:
      - type: file
        url: https://github.com/MohammedNihadv/Euphony/releases/download/v1.0.1/euphony-linux-x86_64.AppImage
        sha256: 38c9865985190039cce4f21ed0527762be1d5a7d13c02b02990666e610892da8
        dest-filename: euphony.AppImage
      - type: file
        path: in.fedaration.euphony.desktop
      - type: file
        path: in.fedaration.euphony.metainfo.xml
      - type: file
        path: in.fedaration.euphony.png
