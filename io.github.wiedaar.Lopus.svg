<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2530"/>
      <stop offset="1" stop-color="#2c3a4d"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4da3e8"/>
      <stop offset="1" stop-color="#2f7cc4"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43c98a"/>
      <stop offset="1" stop-color="#2aa367"/>
    </linearGradient>
  </defs>
  <!-- venster -->
  <rect x="6" y="6" width="116" height="116" rx="22" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="22" fill="none"
        stroke="#5b6b80" stroke-width="3"/>
  <!-- linker paneel (blauw) -->
  <rect x="18" y="26" width="44" height="80" rx="8" fill="url(#left)"/>
  <!-- rechter paneel (groen) -->
  <rect x="66" y="26" width="44" height="80" rx="8" fill="url(#right)"/>
  <!-- bestandsregels -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="25" y="36" width="30" height="5" rx="2.5"/>
    <rect x="25" y="47" width="24" height="5" rx="2.5"/>
    <rect x="25" y="58" width="28" height="5" rx="2.5"/>
    <rect x="25" y="69" width="20" height="5" rx="2.5"/>
    <rect x="73" y="36" width="26" height="5" rx="2.5"/>
    <rect x="73" y="47" width="30" height="5" rx="2.5"/>
    <rect x="73" y="58" width="20" height="5" rx="2.5"/>
    <rect x="73" y="69" width="26" height="5" rx="2.5"/>
  </g>
  <!-- stille L tussen de panelen -->
  <path d="M64 32 v66 a4 4 0 0 0 4 4 h10" fill="none"
        stroke="#f2f6fa" stroke-width="7" stroke-linecap="round"/>
</svg>
