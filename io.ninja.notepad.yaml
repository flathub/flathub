app-id: io.ninja.notepad
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: notepad

finish-args:
  # Display
  - --socket=fallback-x11
  - --socket=wayland
  # OpenGL / DRI
  - --device=dri
  # Inter-process communication
  - --share=ipc
  # File access for text documents
  - --filesystem=host
  # Portal / File Manager integration
  - --talk-name=org.freedesktop.FileManager1

modules:
  - name: notepad
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/CodeSanket6/notepad.git
        tag: v1.0.0
        commit: 513f2668bddb1b6daca02723501dedf9f849efbc
