app-id: app.maryanne.Maryanne
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: maryanne
finish-args:
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
modules:
  - name: maryanne
    buildsystem: simple
    build-commands:
      - install -Dm755 maryanne-wrapper /app/bin/maryanne
      - install -Dm644 app.maryanne.Maryanne.desktop /app/share/applications/app.maryanne.Maryanne.desktop
      - install -Dm644 app.maryanne.Maryanne.metainfo.xml /app/share/metainfo/app.maryanne.Maryanne.metainfo.xml
      - install -Dm644 app.maryanne.Maryanne.png /app/share/icons/hicolor/512x512/apps/app.maryanne.Maryanne.png
    sources:
      - type: extra-data
        filename: maryanne.AppImage
        only-arches: [x86_64]
        url: https://github.com/finnvyrn/maryanne-releases/releases/download/v3.8.0/Maryanne-x86_64.AppImage
        sha256: 2d9d8395e4b39ad98aeec7cab12edc1f16ca3557de2a548006c3766aad988ab1
        size: 165427704
        dest: /app/extra
      - type: file
        path: maryanne-wrapper
      - type: file
        path: app.maryanne.Maryanne.desktop
      - type: file
        path: app.maryanne.Maryanne.metainfo.xml
      - type: file
        path: app.maryanne.Maryanne.png
    x-checker-data:
      type: html
      url: https://github.com/finnvyrn/maryanne-releases/releases
      pattern: 'releases/tag/v([0-9.]+)'
