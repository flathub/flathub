# RustClip on Flathub: packages the signed release binary (closed source,
# `LicenseRef-RustClip-EULA`); nothing is compiled from RustClip's source.
# The `rustclip` module's sources between the "generated" marks are written by
# `scripts/gen_linux_metadata.py` from the signed release manifest.
app-id: com.rustclip.RustClip
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: rustclip
finish-args:
  # The panel window is positioned through XWayland (winit can't place a
  # native Wayland window), and the clipboard and the focused window are read
  # through X11 where the compositor offers no data-control (GNOME).
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  # Link previews, update notes, optional sync between the user's own devices
  # on the local network (mDNS, TCP) and opt-in usage statistics.
  - --share=network
  # The tray icon (StatusNotifierItem).
  - --talk-name=org.kde.StatusNotifierWatcher
  # Keeps the database and sync keys in the desktop's keyring.
  - --talk-name=org.freedesktop.secrets
  # KDE: frees Super+V from Klipper for the open-panel key, only when the user
  # clicks "Use Super+V" (and gives it back when the key changes).
  - --talk-name=org.kde.kglobalaccel
modules:
  # Text in images (OCR, off until the user turns it on): RustClip runs the
  # `tesseract` command.
  - name: leptonica
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_PROG=OFF
      - -DSW_BUILD=OFF
    # Its BSD-style licence asks for the text with the binaries; flatpak-builder
    # finds no file of this name by itself.
    license-files:
      - leptonica-license.txt
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
        sha256: c73363397f96eb1295602bf44d708a994ad42046c791bf03ea0505d829bdb6a7
        x-checker-data:
          type: anitya
          project-id: 1549
          stable-only: true
          url-template: https://github.com/DanBloomberg/leptonica/releases/download/$version/leptonica-$version.tar.gz

  - name: tesseract
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DBUILD_TESTS=OFF
      - -DDISABLE_CURL=ON
      - -DDISABLE_ARCHIVE=ON
      - -DGRAPHICS_DISABLED=ON
      - -DSW_BUILD=OFF
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share/tessdata/configs
      - /share/tessdata/tessconfigs
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.4.tar.gz
        sha256: a8dbf8b8c8ee427ff6ad1d99116502feaf59440af1adb893caf60a6576826cf4
        x-checker-data:
          type: json
          url: https://api.github.com/repos/tesseract-ocr/tesseract/releases/latest
          version-query: .tag_name
          url-query: '"https://github.com/tesseract-ocr/tesseract/archive/refs/tags/" + $version + ".tar.gz"'

  - name: tessdata
    buildsystem: simple
    build-commands:
      - install -Dm644 eng.traineddata /app/share/tessdata/eng.traineddata
    sources:
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata
        sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2

  - name: rustclip
    buildsystem: simple
    build-commands:
      - install -Dm755 rustclip /app/bin/rustclip
      - install -Dm644 com.rustclip.RustClip.desktop /app/share/applications/com.rustclip.RustClip.desktop
      - install -Dm644 com.rustclip.RustClip.metainfo.xml /app/share/metainfo/com.rustclip.RustClip.metainfo.xml
      - install -Dm644 com.rustclip.RustClip.svg /app/share/icons/hicolor/scalable/apps/com.rustclip.RustClip.svg
      - for s in 48 64 128 256; do install -Dm644 icon-${s}.png /app/share/icons/hicolor/${s}x${s}/apps/com.rustclip.RustClip.png; done
      - install -Dm644 licenses.json /app/share/licenses/com.rustclip.RustClip/third-party-licenses.json
    sources:
      # --- generated sources: begin ---
      - type: file
        url: https://release.rustclip.com/releases/v1.10.0/rustclip-1.10.0-linux-x86_64
        sha256: ff76d34ca16b87b1dbdf4f72770fe59155e6e78a641b6b45a2679f6b31e3359c
        dest-filename: rustclip
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://release.rustclip.com/releases/manifest.json
          version-query: .latest.version
          url-query: '"https://release.rustclip.com/releases/" + .latest.builds["linux-x86_64"].filename'
          is-main-source: true
      - type: file
        url: https://release.rustclip.com/releases/v1.10.0/rustclip-1.10.0-linux-aarch64
        sha256: b0f4b39fb7cb12b0a6d18d990eb98e04e71e3becc0b9c78ab1c11d2a71bd87d5
        dest-filename: rustclip
        only-arches:
