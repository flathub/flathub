          url: https://release.rustclip.com/releases/manifest.json
          version-query: .latest.version
          url-query: '"https://release.rustclip.com/releases/" + .latest.builds["linux-aarch64"].filename'
      # --- generated sources: end ---
      - type: file
        url: https://release.rustclip.com/releases/v1.10.0/flatpak-com.rustclip.RustClip.desktop
        sha256: cf4f5ad6630b779321b7a1aae6c82adbd02159c24b80e7abe1efda88b8d1a71b
        dest-filename: com.rustclip.RustClip.desktop
      - type: file
