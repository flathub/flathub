id: com.shadowfetch.shadowcode
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.llvm21
command: shadowcode
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --filesystem=home          # Flathub reviewers reject 'host' without strong justification
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  # Needs Flathub exception: see PR justification
  - --talk-name=org.freedesktop.Flatpak
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
  env:
    CARGO_NET_OFFLINE: 'true'
    CARGO_HOME: /run/build/shadowcode/cargo
    npm_config_offline: "true"
    LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib
modules:
  - name: shadowcode
    buildsystem: simple
    build-commands:
      - bash packaging/flatpak/build-in-sdk.sh
    sources:
      - type: git
        url: https://github.com/ShadowfetchStudio/ShadowCode.git
        tag: v2.0.0
        commit: b22db97674e6169eb03dddaf74157bc68dc67ab4
      - type: patch
        path: npm-offline-cache.patch
      - cargo-sources.json
      - node-sources.json
      - type: git
        url: https://github.com/ggml-org/llama.cpp.git
        commit: 18f9f7bef960b76b693d8dcbb33cbbd6148c1631
        dest: tools/llama.cpp
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Headers.git
        commit: 2b7475f6d664efbad4d4315c94ecec9640831e5b
        dest: tools/spirv-headers
      - type: file
        path: com.shadowfetch.shadowcode.metainfo.xml
        dest: packaging
        dest-filename: com.shadowfetch.shadowcode.appdata.xml
