app-id: com.itgridforge.exoimperium.Demo
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: exoimperium

finish-args:
  # Windowing & Display
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  # Audio Output
  - --socket=pulseaudio
  # 3D Graphics Hardware & Software Fallback Acceleration
  - --device=dri
  # Gamepad & Input Devices
  - --device=all
  # Local Storage & Preferences Persistence
  - --filesystem=xdg-config/com.itgridforge.exoimperium:create
  - --filesystem=xdg-data/com.itgridforge.exoimperium:create
  # External Links & Support
  - --share=network
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: exoimperium-demo
    buildsystem: simple
    build-commands:
      # Install executable and launcher
      - install -Dm755 exoimperium /app/bin/exoimperium
      - install -Dm755 run.sh /app/bin/run.sh
      # Install bundled libraries and GTK3 Flutter engine
      - mkdir -p /app/lib
      - cp -r lib/* /app/lib/
      # Install asset bundle and shaders
      - mkdir -p /app/bin/data
      - cp -r data/* /app/bin/data/
      # Install desktop integration and AppStream metainfo
      - install -Dm644 com.itgridforge.exoimperium.Demo.desktop /app/share/applications/com.itgridforge.exoimperium.Demo.desktop
      - install -Dm644 com.itgridforge.exoimperium.Demo.metainfo.xml /app/share/metainfo/com.itgridforge.exoimperium.Demo.metainfo.xml
      # Install application icons across standard resolutions
      - install -Dm644 icons/64x64/com.itgridforge.exoimperium.Demo.png /app/share/icons/hicolor/64x64/apps/com.itgridforge.exoimperium.Demo.png
      - install -Dm644 icons/128x128/com.itgridforge.exoimperium.Demo.png /app/share/icons/hicolor/128x128/apps/com.itgridforge.exoimperium.Demo.png
      - install -Dm644 icons/256x256/com.itgridforge.exoimperium.Demo.png /app/share/icons/hicolor/256x256/apps/com.itgridforge.exoimperium.Demo.png
      - install -Dm644 icons/512x512/com.itgridforge.exoimperium.Demo.png /app/share/icons/hicolor/512x512/apps/com.itgridforge.exoimperium.Demo.png
    sources:
      # Online distribution archive for Flathub CI/CD
      - type: archive
        url: https://github.com/itgridforge/flathub/releases/download/v1.2.17/ExoImperium_Demo_Linux_v1.2.17_x64.tar.gz
        sha256: 7a6dcb7255eb6035dc8f215a6f5d6d2f0daed1e19ecdcce03fec89c9d1b2b5dd
        strip-components: 1
      - type: file
        path: com.itgridforge.exoimperium.Demo.desktop
      - type: file
        path: com.itgridforge.exoimperium.Demo.metainfo.xml
      - type: dir
        path: icons
        dest: icons
