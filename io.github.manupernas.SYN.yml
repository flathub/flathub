#manifest created by Mr. Seivane (manupernas)
#Only -and lonely-

id: io.github.manupernas.SYN
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: syn-flatpak

finish-args:
  # SYN descarga listas y la guía desde las fuentes que añado a continuación	.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # La bibteca de vídeo reuierer decimal con punto.
  - --env=LC_NUMERIC=C

# Modulos de motor multimedia
modules:
  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --enable-shared --disable-static --disable-programs --disable-doc --enable-gnutls --enable-pic
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install
      - install -Dm644 LICENSE.md /app/share/licenses/io.github.manupernas.SYN/FFmpeg/LICENSE.md
      - install -Dm644 COPYING.LGPLv2.1 /app/share/licenses/io.github.manupernas.SYN/FFmpeg/COPYING.LGPLv2.1
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n7.1.3
        commit: f46e514491172d15bd74b4abb1814cd2f05a763e

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dopengl=enabled
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dglslang=disabled
      - -Ddemos=false
    post-install:
      - install -Dm644 /run/build/libplacebo/LICENSE /app/share/licenses/io.github.manupernas.SYN/libplacebo/LICENSE
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: libass
    buildsystem: meson
    config-opts:
      - -Dfontconfig=enabled
      - -Dlibunibreak=disabled
    post-install:
      - install -Dm644 /run/build/libass/COPYING /app/share/licenses/io.github.manupernas.SYN/libass/COPYING
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.5
        commit: 4a05d8127f525943ebf45fdc6497c9e665947f0d

  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Dplain-gl=enabled
      - -Dvulkan=disabled
      - -Dx11=disabled
      - -Dwayland=disabled
      - -Ddrm=disabled
      - -Dalsa=disabled
      - -Dmanpage-build=disabled
      - -Dbuild-date=false
    post-install:
      - install -Dm644 /run/build/libmpv/Copyright /app/share/licenses/io.github.manupernas.SYN/mpv/Copyright
      - install -Dm644 /run/build/libmpv/LICENSE.LGPL /app/share/licenses/io.github.manupernas.SYN/mpv/LICENSE.LGPL
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413

  - name: syn
    buildsystem: simple
    build-commands:
      - install -Dm755 syn-flatpak /app/bin/syn-flatpak
      - install -Dm755 syn.py /app/share/syn/syn.py
      - install -Dm644 syn_sources.py /app/share/syn/syn_sources.py
      - install -Dm644 syn_i18n.py /app/share/syn/syn_i18n.py
      - install -Dm644 io.github.manupernas.SYN.desktop /app/share/applications/io.github.manupernas.SYN.desktop
      - install -Dm644 io.github.manupernas.SYN.metainfo.xml /app/share/metainfo/io.github.manupernas.SYN.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/io.github.manupernas.SYN/LICENSE
      - install -d /app/share/locale/en_US/LC_MESSAGES /app/share/locale/en_GB/LC_MESSAGES
      - msgfmt -o /app/share/locale/en_US/LC_MESSAGES/syn.mo locale/en_US/LC_MESSAGES/syn.po
      - msgfmt -o /app/share/locale/en_GB/LC_MESSAGES/syn.mo locale/en_GB/LC_MESSAGES/syn.po
      - mkdir -p /app/share/icons/hicolor
      - cp -r icons/* /app/share/icons/hicolor/
    sources:
      # Revisión exacta de SYN para repetir la compi
      - type: git
        url: https://github.com/manupernas/SYN.git
        commit: 6bb62765e02ba6616d2c5974746bd3f886fa8860
