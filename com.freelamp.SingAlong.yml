app-id: com.freelamp.SingAlong
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: sing-along
finish-args:
- --filesystem=xdg-music
- --filesystem=xdg-download
- --socket=wayland
- --socket=fallback-x11
- --share=ipc
- --share=network
- --socket=pulseaudio
- --talk-name=org.kde.StatusNotifierWatcher
- --talk-name=org.freedesktop.Notifications
modules:
- name: sing-along
  buildsystem: simple
  build-commands:
  - ar x sing-along.deb
  - tar -xf "$(basename data.tar.*)"
  - cp -r usr/* /app/
  - mv /app/share/applications/Sing-Along.desktop /app/share/applications/com.freelamp.SingAlong.desktop
  - mv /app/share/metainfo/sing-along.metainfo.xml /app/share/metainfo/com.freelamp.SingAlong.metainfo.xml
  - for size in 32x32 128x128 256x256@2; do install -Dm644 "usr/share/icons/hicolor/${size}/apps/sing-along.png"
    "/app/share/icons/hicolor/${size}/apps/com.freelamp.SingAlong.png"; rm -f "/app/share/icons/hicolor/${size}/apps/sing-along.png";
    done
  - sed -i 's/^Icon=.*/Icon=com.freelamp.SingAlong/' /app/share/applications/com.freelamp.SingAlong.desktop
  sources:
  - type: file
    url: https://github.com/LeisureLinux/Sing-Along/releases/download/v2.9.28/sing-along_2.9.28_amd64.deb
    sha256: 0b2177358d8fe899607d517095b8ccf0a170feac5ae1fd7e6b04a1d78137ad1a
    dest-filename: sing-along.deb
