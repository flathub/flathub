id: me.chocolateimage.graphics-creator
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: graphics-creator
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --filesystem=host

modules:
  - name: qt-advanced-docking-system
    buildsystem: cmake-ninja
    config-opts:
      - -DADS_VERSION=5.0.0
    sources:
      - type: git
        url: https://github.com/githubuser0xFFFF/Qt-Advanced-Docking-System.git
        tag: 5.0.0
        commit: 433b0c90b44d8f17d059204176ff6e0d6d3783e3

  - name: graphics-creator
    buildsystem: cmake-ninja
    config-opts:
      - -DUPDATE_CHECK=OFF
    sources:
      - type: git
        url: https://github.com/chocolateimage/graphics-creator.git
        tag: v0.4.0
        commit: c4fd299930b0431a05492e631855c0ad7ffb6f02
