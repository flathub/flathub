id: io.github.masihmoafi.Clocki
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: clocki
separate-locales: false
finish-args:
  - --share=ipc
  # "Always on top" needs X11 (XWayland); Clocki starts with --ozone-platform=x11.
  - --socket=x11
  - --device=dri
modules:
  - name: clocki
    buildsystem: simple
    sources:
      - type: file
        dest-filename: clocki.deb
        url: https://github.com/MasihMoafi/clocki/releases/download/v1.2.1/clocki_1.2.1_amd64.deb
        sha256: 036ed7ccf0eee0142d99d62b715f33a2a5a62863ba95063ff55447fadaf05762
        only-arches: [x86_64]
      - type: git
        url: https://github.com/MasihMoafi/clocki.git
        commit: 130015250e7d8b4f3e5cb401e8c29ab487b51138
        dest: src
      - type: script
        dest-filename: clocki.sh
        commands:
          - exec zypak-wrapper /app/clocki/clocki --ozone-platform=x11 "$@"
    build-commands:
      - ar x clocki.deb
      - tar -xf data.tar.*
      - cp -a opt/Clocki /app/clocki
      - rm -f /app/clocki/chrome-sandbox
      - install -Dm755 clocki.sh /app/bin/clocki
      - install -Dm644 src/packaging/flatpak/io.github.masihmoafi.Clocki.metainfo.xml /app/share/metainfo/io.github.masihmoafi.Clocki.metainfo.xml
      - install -Dm644 src/packaging/flatpak/io.github.masihmoafi.Clocki.desktop /app/share/applications/io.github.masihmoafi.Clocki.desktop
      - install -Dm644 src/assets/icon.png /app/share/icons/hicolor/256x256/apps/io.github.masihmoafi.Clocki.png
