app-id: io.github.DhanushSantosh.Wield
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
  - org.freedesktop.Sdk.Extension.rust-stable
command: wield-app
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: wield
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node20/bin:/usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/wield/cargo
        CARGO_NET_OFFLINE: "true"
        npm_config_cache: /run/build/wield/flatpak-node/npm-cache
    build-commands:
      - . /usr/lib/sdk/node20/enable.sh
      - . /usr/lib/sdk/rust-stable/enable.sh
      - npm ci --offline --cache /run/build/wield/flatpak-node/npm-cache
      - npm run build -w apps/wield -- --no-bundle --ci
      - install -Dm755 target/release/wield-app /app/bin/wield-app
      - >-
        install -Dm644
        packaging/flatpak/io.github.DhanushSantosh.Wield.desktop
        /app/share/applications/io.github.DhanushSantosh.Wield.desktop
      - >-
        install -Dm644
        packaging/flatpak/io.github.DhanushSantosh.Wield.png
        /app/share/icons/hicolor/512x512/apps/io.github.DhanushSantosh.Wield.png
      - >-
        install -Dm644
        packaging/flatpak/io.github.DhanushSantosh.Wield.metainfo.xml
        /app/share/metainfo/io.github.DhanushSantosh.Wield.metainfo.xml
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
      - node-sources.json
