id: io.github.luizsant.MacnaPlayer
runtime: org.kde.Platform
runtime-version: '5.15-25.08'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '5.15-25.08'
command: macna-player
rename-desktop-file: macna-player.desktop
rename-icon: macna-player
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=home
  - --own-name=org.mpris.MediaPlayer2.macna_player
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.freedesktop.Notifications
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'

modules:
  - name: python3-numpy
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps *.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/da/24/3bd070f3269dc609d8f26b2643f62ef91bb415841c0b294805aaf7fe06da/numpy-2.5.4-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 6ffa07666f8da0eef81d149934a626d0d95fbd6838432a33e66245423a9062c0
        only-arches:
          - x86_64
      - type: file
        url: https://files.pythonhosted.org/packages/db/b6/135bb0953b61dc21c6cafa14b424ae666944e4899cf140e00c2b322a1a45/numpy-2.5.4-cp313-cp313-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
        sha256: 1c2e71b04c6cad90026e544501bbe0ab9290fa8a4d845e7e8c0d124fb429c988
        only-arches:
          - aarch64

  - name: python-vlc
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-build-isolation --no-deps .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/4b/5b/f9ce6f0c9877b6fe5eafbade55e0dcb6b2b30f1c2c95837aef40e390d63b/python_vlc-3.0.21203.tar.gz
        sha256: 52d0544b276b11e58b6c0b748c3e0518f94f74b1b4cd328c83a59eacabead1ec

  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps *.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/7f/3d/16ea7d5638cf585991f2c5705e8083688dde633d32d0871f2404e0f4d827/yt_dlp-2026.10.26-py3-none-any.whl
        sha256: a05c5b5d8562f7e8a62f5334348b406af4930d56d3a65f8021d14af0e22339ae

  - name: pycairo
    buildsystem: meson
    config-opts:
      - -Dtests=false
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/bb/5e/19ab2572981a996ce96b853a189d2dcced40506b67d9555a7568457abcf2/pycairo-1.29.2.tar.gz
        sha256: 3e69fff74fe64f5ba2dfa31f67c6bdf26413342574047437d2ac520d35e9a489

  - name: pygobject
    buildsystem: meson
    config-opts:
      - -Dtests=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/pygobject/3.52/pygobject-3.52.3.tar.gz
        sha256: 00e427d291e957462a8fad659a9f9c8be776ff82a8b76bdf402f1eaeec086d82

  - name: libvlc
    config-opts:
      - BUILDCC=gcc
      - --disable-lua
      - --disable-a52
      - --disable-qt
      - --disable-ncurses
      - --disable-udev
    cleanup:
      - /bin
      - /share/applications
      - /share/icons
      - /share/metainfo
      - /share/solid
      - /share/vlc
    post-install:
      - /app/lib/vlc/vlc-cache-gen /app/lib/vlc/plugins
    sources:
      - type: archive
        url: https://get.videolan.org/vlc/3.0.24/vlc-3.0.24.tar.xz
        sha256: e7cab503d1d7d5849b89d2cf0e1ee60d0ef6d012407791b644b9cfc0cc225fdf
      - type: patch
        path: vlc-ignore-time-for-cache.patch

  - name: macna-player
    buildsystem: simple
    build-commands:
      - install -d /app/share/macna-player /app/bin /app/share/licenses/io.github.luizsant.MacnaPlayer
      - install -Dm644 *.py -t /app/share/macna-player
      - install -Dm644 macna-player.svg /app/share/macna-player/macna-player.svg
      - install -Dm644 macna-player.svg /app/share/icons/hicolor/scalable/apps/macna-player.svg
      - install -Dm644 data/io.github.luizsant.MacnaPlayer.metainfo.xml /app/share/metainfo/io.github.luizsant.MacnaPlayer.metainfo.xml
      - install -Dm644 macna-player.desktop /app/share/applications/macna-player.desktop
      - install -Dm755 flatpak/macna-player.sh /app/bin/macna-player
      - install -Dm644 LICENSE /app/share/licenses/io.github.luizsant.MacnaPlayer/LICENSE
    sources:
    - type: git
      url: https://github.com/luizsant/MacnaPlayer.git
      tag: v2.0.0
      commit: cf6d3b0fd398c09ba31f1e8ea94c9757e9438967