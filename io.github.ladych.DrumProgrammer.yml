id: io.github.ladych.DrumProgrammer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: drumprogrammer
finish-args:
  # JUCE draws with X11 (XWayland on Wayland desktops).
  - --socket=x11
  - --share=ipc
  - --device=dri
  # Audio: ALSA through the PulseAudio/PipeWire plugin of the runtime, JACK through PipeWire. MIDI
  # controllers are read from the ALSA sequencer (/dev/snd/seq), which needs the devices.
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  - --device=all
  # JUCE has no file chooser portal and falls back to its own file browser, so projects, samples,
  # backing tracks and MIDI files are opened and saved directly in these folders. Flathub does not allow
  # the whole home folder; `flatpak override --user --filesystem=home io.github.ladych.DrumProgrammer`
  # grants it.
  - --filesystem=xdg-documents
  - --filesystem=xdg-music
  - --filesystem=xdg-download
  - --filesystem=xdg-desktop
modules:
  - name: drumprogrammer
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DDRUMPROG_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/ladych/DrumProgrammer.git
        tag: v1.0.1
        commit: 7c833f476c6409edf962bf17fea3f5187373fba7
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
