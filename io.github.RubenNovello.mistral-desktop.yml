app-id: io.github.RubenNovello.mistral-desktop
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: mistral-desktop

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: mistral-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 main.py ${FLATPAK_DEST}/share/mistral-desktop/main.py
      - install -Dm755 packaging/flatpak/launcher.sh ${FLATPAK_DEST}/bin/mistral-desktop
      - install -Dm644 snap/gui/mistral-desktop.desktop ${FLATPAK_DEST}/share/applications/io.github.RubenNovello.mistral-desktop.desktop
      - install -Dm644 snap/gui/icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.RubenNovello.mistral-desktop.png
      - install -Dm644 packaging/flatpak/io.github.RubenNovello.mistral-desktop.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.RubenNovello.mistral-desktop.metainfo.xml
    sources:
      - type: git
        url: https://github.com/RubenNovello/mistral-desktop.git
        commit: 1360e238bbd20713ca88be0ea4931606b3aabf81
