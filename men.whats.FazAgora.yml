id: men.whats.FazAgora
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: faz-agora

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=~/.willdo:create
  - --filesystem=xdg-run/gvfs
  - --talk-name=org.freedesktop.StatusNotifierWatcher
  - --talk-name=org.kde.StatusNotifierWatcher

build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: faz-agora
    buildsystem: simple
    build-commands:
      - install -Dm755 packaging/flatpak/faz-agora /app/bin/faz-agora
      - install -Dm644 faz-agora.py /app/share/faz-agora/faz-agora.py
      - install -Dm644 assets/icon.png /app/share/faz-agora/assets/icon.png
      - install -Dm644 assets/check-white.svg /app/share/faz-agora/assets/check-white.svg
      - install -Dm644 packaging/linux/men.whats.FazAgora.png /app/share/icons/hicolor/512x512/apps/men.whats.FazAgora.png
      - install -Dm644 packaging/linux/men.whats.FazAgora.desktop /app/share/applications/men.whats.FazAgora.desktop
      - install -Dm644 packaging/linux/men.whats.FazAgora.metainfo.xml /app/share/metainfo/men.whats.FazAgora.metainfo.xml
    sources:
      - type: git
        url: https://github.com/willf444/faz-agora.git
        tag: v2.3.11
        commit: a2c54cfb54a0da48a5d2da9b877cb14beb3332b5
