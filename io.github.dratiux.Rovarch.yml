id: io.github.dratiux.Rovarch
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rovarch

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/discord-ipc-0

modules:
  - name: rovarch
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/rovarch/cargo
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/rovarch /app/bin/rovarch
      - install -Dm644 data/io.github.dratiux.Rovarch.desktop /app/share/applications/io.github.dratiux.Rovarch.desktop
      - install -Dm644 data/io.github.dratiux.Rovarch.xml /app/share/mime/packages/io.github.dratiux.Rovarch.xml
      - install -Dm644 data/io.github.dratiux.Rovarch.metainfo.xml /app/share/metainfo/io.github.dratiux.Rovarch.metainfo.xml
      - |
        for size in 16 24 32 48 64 128 256 512; do
          install -Dm644 "data/icons/hicolor/${size}x${size}/apps/io.github.dratiux.Rovarch.png" \
            "/app/share/icons/hicolor/${size}x${size}/apps/io.github.dratiux.Rovarch.png"
        done
    sources:
      - type: git
        url: https://github.com/dratiux/Rovarch.git
        commit: 3b86d9ea121c7558156b836291d15707ecaca8c9
      - cargo-sources.json
