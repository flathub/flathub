# xyz.tekdt.sezoy 0.2.1.0-beta â€” Flathub manifest (repackage .deb chinh chu).
# Nguon .deb: https://github.com/tekdt/sezoybin/releases/download/v0.2.1.0-beta/SEZOY_beta.deb
# Quy uoc ten co dinh: SEZOY-beta.deb (beta) / SEZOY.deb (stable).
# Rebuild/upload lai .deb la phai cap nhat sha256 ben duoi.
#
# CANH BAO TRUNG THUC (doc truoc khi submit Flathub):
# SEZOY la boot server can quyen root: bind cong dac quyen 67/69 (DHCP/TFTP),
# dich vu systemd, sua firewall. Flatpak sandbox KHONG cho phep nhung thu
# nay (khong root, khong systemd, khong bind <1024). Ban Flatpak nay chi co
# the mo dashboard xem choi â€” khong boot duoc may that. Flathub reviewer
# rat co the tu choi. Kenh Linux dung nghia la .deb qua self-update.
app-id: xyz.tekdt.sezoy
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: sezoy
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
modules:
  - name: sezoy
    buildsystem: simple
    build-commands:
      - dpkg-deb -x SEZOY-beta.deb /app
      - mkdir -p /app/bin /app/share/applications /app/share/icons/hicolor/256x256/apps /app/share/metainfo
      - ln -sf /app/opt/sezoy/sezoy /app/bin/sezoy
      - install -D -m644 xyz.tekdt.sezoy.desktop /app/share/applications/xyz.tekdt.sezoy.desktop
      - install -D -m644 xyz.tekdt.sezoy.png /app/share/icons/hicolor/256x256/apps/xyz.tekdt.sezoy.png
      - install -D -m644 xyz.tekdt.sezoy.metainfo.xml /app/share/metainfo/xyz.tekdt.sezoy.metainfo.xml
    sources:
      - type: file
        url: https://github.com/tekdt/sezoybin/releases/download/v0.2.1.0-beta/SEZOY_beta.deb
        sha256: 2E88E879AE9DDF61BB582DD88D74F7948530BB6FA165F6AF14D9E9FF9EABF41E
        dest-filename: SEZOY-beta.deb
      - type: file
        path: xyz.tekdt.sezoy.desktop
      - type: file
        path: xyz.tekdt.sezoy.png
      - type: file
        path: xyz.tekdt.sezoy.metainfo.xml
