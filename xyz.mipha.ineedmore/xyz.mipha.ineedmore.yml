app-id: xyz.mipha.ineedmore
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ineedmore

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio

modules:
  - name: ineedmore
    buildsystem: simple
    build-commands:
      - install -Dm755 INeedMore.x86_64 /app/bin/ineedmore
      - install -Dm644 icon256.png /app/share/icons/hicolor/256x256/apps/xyz.mipha.ineedmore.png
      - install -Dm644 icon512.png /app/share/icons/hicolor/512x512/apps/xyz.mipha.ineedmore.png
      - install -Dm644 xyz.mipha.ineedmore.desktop /app/share/applications/xyz.mipha.ineedmore.desktop
      - install -Dm644 xyz.mipha.ineedmore.metainfo.xml /app/share/metainfo/xyz.mipha.ineedmore.metainfo.xml
    sources:
      - type: file
        url: https://github.com/javiermoralesdev/INeedMore/releases/download/v1.0.0/INeedMore.x86_64
        sha256: 87a87b576f4545e2ce75171792684c5bc61e271914240febce938ebb5e0c5922
      - type: file
        url: https://raw.githubusercontent.com/javiermoralesdev/INeedMore/main/images/icon256.png
        dest-filename: icon256.png
        sha256: 7d5e61606188c61a7e80ae839713b3c029a25bbc87ad614f7a1273c4a90dea8f
      - type: file
        url: https://raw.githubusercontent.com/javiermoralesdev/INeedMore/main/images/icon512.png
        dest-filename: icon512.png
        sha256: 79e30bcd608ef86447c317fb5540243653442a2d5a7c39a50823ab2620c4e1fe
      - type: file
        path: xyz.mipha.ineedmore.desktop
        sha256: 206d9a19e6c3b3dc5f1dff45c8e34e45d793c41eeaf9ce0c2d2a5138f3753813
      - type: file
