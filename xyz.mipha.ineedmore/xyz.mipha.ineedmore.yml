app-id: xyz.mipha.ineedmore
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.godotengine.godot.BaseApp
base-version: '4.6'
command: godot-runner

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio

modules:
  - name: INeedMore
    buildsystem: simple
    build-commands:
      - install -Dm755 INeedMore.pck /app/bin/godot-runner.pck
      - install -Dm644 icon256.png /app/share/icons/hicolor/256x256/apps/xyz.mipha.ineedmore.png
      - install -Dm644 icon512.png /app/share/icons/hicolor/512x512/apps/xyz.mipha.ineedmore.png
      - install -Dm644 xyz.mipha.ineedmore.desktop /app/share/applications/xyz.mipha.ineedmore.desktop
      - install -Dm644 xyz.mipha.ineedmore.metainfo.xml /app/share/metainfo/xyz.mipha.ineedmore.metainfo.xml
    sources:
      - type: file
        url: https://github.com/javiermoralesdev/INeedMore/releases/download/v1.0.0/INeedMore.pck
        sha256: 7ec8d4c12c842dc051dc4b46317f84f04f37f5c6c42dc56f9790752effedee38
      - type: file
        url: https://raw.githubusercontent.com/javiermoralesdev/INeedMore/main/images/icon256.png
        dest-filename: icon256.png
        sha256: 7d5e61606188c61a7e80ae839713b3c029a25bbc87ad614f7a1273c4a90dea8f
      - type: file
        url: https://raw.githubusercontent.com/javiermoralesdev/INeedMore/main/images/icon512.png
        dest-filename: icon512.png
        sha256: 79e30bcd608ef86447c317fb5540243653442a2d5a7c39a50823ab2620c4e1fe
      - type: file
        url: https://raw.githubusercontent.com/javiermoralesdev/INeedMore/main/flatpak/xyz.mipha.ineedmore.desktop
        sha256: 482f9eeec55258540755b754c9049013dc9c870e3eb20398f2c92e6315b49d5c
      - type: file
        url: https://raw.githubusercontent.com/javiermoralesdev/INeedMore/main/flatpak/xyz.mipha.ineedmore.metainfo.xml
        sha256: 057229b695ef05e643689d1a64210105c66ebb0d1f3a53ff8860653226f5551f
