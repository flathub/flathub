app-id: io.github.theoninesixy.HMCL
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: hmcl

sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21

finish-args:
  - --require-version=1.16.0
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin
  - --env=JAVA_HOME=/app/jre
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --device=input

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh

  - name: hmcl
    buildsystem: simple
    build-commands:
      - install -Dm755 run.sh /app/bin/hmcl
      - install -Dm644 HMCL.jar /app/share/hmcl/HMCL.jar
      - install -Dm644 io.github.theoninesixy.HMCL.desktop /app/share/applications/io.github.theoninesixy.HMCL.desktop
      - install -Dm644 io.github.theoninesixy.HMCL.metainfo.xml /app/share/metainfo/io.github.theoninesixy.HMCL.metainfo.xml
      - install -Dm644 io.github.theoninesixy.HMCL.png /app/share/icons/hicolor/256x256/apps/io.github.theoninesixy.HMCL.png
    sources:
      - type: file
        url: https://github.com/HMCL-dev/HMCL/releases/download/v3.16.3/HMCL-3.16.3.jar
        sha256: 5d02f4d04d9442116354ecfccf679910cca371d00a23cd5d6b16558c20a73dd3
        dest-filename: HMCL.jar
        x-checker-data:
          type: json
          url: https://api.github.com/repos/HMCL-dev/HMCL/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("^HMCL-.*\\.jar$")) | .browser_download_url
      - type: file
        path: run.sh
      - type: file
        path: io.github.theoninesixy.HMCL.desktop
      - type: file
        path: io.github.theoninesixy.HMCL.metainfo.xml
      - type: file
        path: io.github.theoninesixy.HMCL.png