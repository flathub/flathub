id: io.github.davichus1303.DAFI_desktop
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

separate-locales: false

command: DAFI-Desktop

# Bundles JDK 17 + Maven + Gradle under /usr/lib/sdk/openjdk17
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17

finish-args:
  # X11 + XShm for JavaFX (no native Wayland backend in JavaFX)
  - --socket=x11
  - --share=ipc
  - --device=dri
  # Secret Service (GNOME Keyring) used by the OS keyring adapter
  - --talk-name=org.freedesktop.secrets
  # Bulk-import reports are written to the user's documents folder
  - --filesystem=xdg-documents
  # Legacy storage (~/.dafi): read for key/data migration, write because the
  # logback file appender writes ~/.dafi/logs and the config adapter may keep
  # using the legacy ~/.dafi/config. Restricted to .dafi, not full home.
  - --filesystem=home/.dafi

modules:
  - name: dafi-desktop
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/openjdk17/bin
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk17/jvm/openjdk-17
        MAVEN_OPTS: -Dmaven.repo.local=.m2/repository
    build-commands:
      - mvn -o -B clean package -Dmaven.test.skip=true
      - mvn -o -B dependency:copy-dependencies -DincludeScope=runtime
          -DoutputDirectory=target/lib
      - cp target/dafi-desktop-1.1.0.jar target/lib/
      - jpackage --input target/lib --main-jar dafi-desktop-1.1.0.jar
          --main-class com.dafi.desktop.infrastructure.DafiLauncher
          --name DAFI-Desktop --app-version 1.1.0 --type app-image
          --dest target/jpackage --icon src/main/resources/icons/icon-256.png
          --java-options -Dfile.encoding=UTF-8 --java-options -Xmx512m
          --vendor "DAFI"
      - cp -r target/jpackage/DAFI-Desktop/* /app/
      - install -Dm644 packaging/io.github.davichus1303.DAFI_desktop.desktop
          /app/share/applications/io.github.davichus1303.DAFI_desktop.desktop
      - install -Dm644 packaging/io.github.davichus1303.DAFI_desktop.metainfo.xml
          /app/share/metainfo/io.github.davichus1303.DAFI_desktop.metainfo.xml
      - install -Dm644 src/main/resources/icons/icon-256.png
          /app/share/icons/hicolor/256x256/apps/io.github.davichus1303.DAFI_desktop.png
      - install -Dm644 LICENSE
          /app/share/licenses/io.github.davichus1303.DAFI_desktop/LICENSE
    sources:
      - maven-dependencies.yaml
      - type: git
        url: https://github.com/davichus1303/DAFI_desktop.git
        tag: v1.1.0
        commit: aacac4fb92a77e96ba94dbcbaf5100ac6eab6a10
