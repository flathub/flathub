# Copy this file to thedavidweng/homebrew-tap/.github/workflows/auto-update-openkara.yml
# Also copy openkara.rb.template to the tap repo root or adjust TEMPLATE_PATH below.

name: Auto-update OpenKara cask

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cask:
    runs-on: macos-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Check for new OpenKara release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get latest release info
          RELEASE_JSON=$(gh api repos/thedavidweng/OpenKara/releases/latest 2>/dev/null || echo '{}')

          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')
          if [ -z "$TAG" ]; then
            echo "No releases found"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${TAG#v}"
          echo "Latest release: $VERSION"

          # Check current cask version
          CURRENT=""
          if [ -f Casks/openkara.rb ]; then
            CURRENT=$(grep -m1 'version "' Casks/openkara.rb | sed 's/.*version "//;s/".*//')
          fi
          echo "Current cask version: ${CURRENT:-none}"

          if [ "$VERSION" = "$CURRENT" ]; then
            echo "Already up to date"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New version detected: $VERSION"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_json<<RELEASE_EOF" >> "$GITHUB_OUTPUT"
          echo "$RELEASE_JSON" >> "$GITHUB_OUTPUT"
          echo "RELEASE_EOF" >> "$GITHUB_OUTPUT"

      - name: Download and hash DMGs
        if: steps.check.outputs.skip != 'true'
        id: hash
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          RELEASE_JSON='${{ steps.check.outputs.release_json }}'

          # Find DMG asset URLs
          ARM_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("aarch64.*\\.dmg$")) | .browser_download_url')
          INTEL_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("x64.*\\.dmg$")) | .browser_download_url')

          if [ -z "$ARM_URL" ] || [ -z "$INTEL_URL" ]; then
            echo "Could not find both DMG assets"
            echo "ARM_URL=$ARM_URL"
            echo "INTEL_URL=$INTEL_URL"
            exit 1
          fi

          echo "Downloading ARM DMG..."
          curl -fsSL -o arm.dmg "$ARM_URL"
          ARM_SHA256=$(shasum -a 256 arm.dmg | awk '{print $1}')

          echo "Downloading Intel DMG..."
          curl -fsSL -o intel.dmg "$INTEL_URL"
          INTEL_SHA256=$(shasum -a 256 intel.dmg | awk '{print $1}')

          echo "ARM SHA256: $ARM_SHA256"
          echo "Intel SHA256: $INTEL_SHA256"

          echo "arm_url=$ARM_URL" >> "$GITHUB_OUTPUT"
          echo "arm_sha256=$ARM_SHA256" >> "$GITHUB_OUTPUT"
          echo "intel_url=$INTEL_URL" >> "$GITHUB_OUTPUT"
          echo "intel_sha256=$INTEL_SHA256" >> "$GITHUB_OUTPUT"

      - name: Render and commit cask
        if: steps.check.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          ARM_URL="${{ steps.hash.outputs.arm_url }}"
          ARM_SHA256="${{ steps.hash.outputs.arm_sha256 }}"
          INTEL_URL="${{ steps.hash.outputs.intel_url }}"
          INTEL_SHA256="${{ steps.hash.outputs.intel_sha256 }}"

          mkdir -p Casks

          cat > Casks/openkara.rb <<CASK
          cask "openkara" do
            on_arm do
              version "$VERSION"
              sha256 "$ARM_SHA256"
              url "$ARM_URL"
            end

            on_intel do
              version "$VERSION"
              sha256 "$INTEL_SHA256"
              url "$INTEL_URL"
            end

            name "OpenKara"
            desc "Open-source desktop karaoke player"
            homepage "https://github.com/thedavidweng/OpenKara"
            depends_on macos: ">= :sonoma"

            app "OpenKara.app"

            zap trash: [
              "~/Library/Application Support/com.openkara.desktop",
              "~/Library/Caches/com.openkara.desktop",
              "~/Library/Preferences/com.openkara.desktop.plist",
              "~/Library/Saved Application State/com.openkara.desktop.savedState",
            ]
          end
          CASK

          # Remove leading whitespace from heredoc
          sed -i '' 's/^          //' Casks/openkara.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/openkara.rb
          git commit -m "Update OpenKara to v$VERSION"
          git push
