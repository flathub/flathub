# Copy this file and packaging/flatpak/generated-sources.json into the
# com.yanklog.YankLog Flathub submission repository. Update tag and commit together
# for every release; both must refer to the same public, annotated Git tag.
app-id: com.yanklog.YankLog
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: yanklog

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: yanklog
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/yanklog/cargo
    build-commands:
      - cargo build --release --offline --locked -p yanklog-linux-native --features flatpak --bin yanklog
      - install -Dm755 target/release/yanklog /app/bin/yanklog
      - install -Dm644 packaging/flatpak/com.yanklog.YankLog.desktop /app/share/applications/com.yanklog.YankLog.desktop
      - install -Dm644 assets/logo.svg /app/share/icons/hicolor/scalable/apps/com.yanklog.YankLog.svg
      - install -Dm644 packaging/flatpak/com.yanklog.YankLog.metainfo.xml /app/share/metainfo/com.yanklog.YankLog.metainfo.xml
      - install -Dm644 LICENSES/MIT.txt /app/share/licenses/com.yanklog.YankLog/MIT.txt
    sources:
      - type: git
        url: https://github.com/thisiseesmaeel/yanklog-linux.git
        tag: v2.0.0
        commit: c4fe7ad6391673eb0636975e003a0018cb80c4e1
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - generated-sources.json
