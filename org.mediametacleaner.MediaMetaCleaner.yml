app-id: org.mediametacleaner.MediaMetaCleaner
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet8
command: MediaMetaCleaner

finish-args:
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=ipc
  - --filesystem=host

build-options:
  append-path: /usr/lib/sdk/dotnet8/bin

modules:
  - name: mediametacleaner
    buildsystem: simple
    build-commands:
      - install -d /app/bin
      - install -d /app/share/applications
      - install -d /app/share/metainfo
      - install -d /app/share/icons/hicolor/256x256/apps
      - install -Dm644 packaging/flatpak/org.mediametacleaner.MediaMetaCleaner.desktop /app/share/applications/org.mediametacleaner.MediaMetaCleaner.desktop
      - install -Dm644 packaging/flatpak/org.mediametacleaner.MediaMetaCleaner.metainfo.xml /app/share/metainfo/org.mediametacleaner.MediaMetaCleaner.metainfo.xml
      - install -Dm644 MediaMetaCleaner/Assets/metadata-04.png /app/share/icons/hicolor/256x256/apps/org.mediametacleaner.MediaMetaCleaner.png
    sources:
      - type: dir
        path: ../..
