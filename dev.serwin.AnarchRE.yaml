id: dev.serwin.AnarchRE
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: anarch-re
finish-args:
  # Video
  - --socket=wayland
  - --socket=fallback-x11
  # Audio
  - --socket=pulseaudio
  # Hardware acceleration
  - --device=dri
  - --share=ipc
modules:
  - name: anarch-re
    buildsystem: simple
    sources:
      - type: git
        url: https://git.sr.ht/~marcin-serwin/anarch-re
        tag: z4
        commit: 211ea8a60fa693008a9adf00fea4c8dde7936b38
    build-options:
      env:
        CC: cc
        MAKEFLAGS:
          PREFIX=${FLATPAK_DEST} -j${FLATPAK_BUILDER_N_JOBS}
          VERSION_SUFFIX=-flathub
    build-commands:
      - make
      - make install
