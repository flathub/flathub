app-id: io.github.priyanshdas.inkleaf
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable

command: inkleaf

finish-args:
  - --device=dri
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: inkleaf
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
      env:
        npm_config_cache: /run/build/inkleaf/flatpak-node/npm-cache
        XDG_CACHE_HOME: /run/build/inkleaf/flatpak-node/cache
    build-commands:
      - npm install --offline
      - . flatpak-node/electron-builder-arch-args.sh; npm run build && npx electron-builder -l --dir $ELECTRON_BUILDER_ARCH_ARGS
      - cp -r dist/linux*unpacked /app/inkleaf
      - install -Dm 755 inkleaf.sh /app/bin/inkleaf
      - install -Dm644 packaging/flatpak/io.github.priyanshdas.inkleaf.desktop -t /app/share/applications
      - install -Dm644 packaging/flatpak/io.github.priyanshdas.inkleaf.metainfo.xml -t /app/share/metainfo
      - install -Dm644 packaging/flatpak/icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.priyanshdas.inkleaf.png
      - install -Dm644 /app/inkleaf/LICENSE.electron.txt -t /app/share/licenses/io.github.priyanshdas.inkleaf

    sources:
      - type: git
        url: https://github.com/priyanshdas/inkleaf.git
        commit: 08973b7085c006a93891f69b720754211266300a
        tag: v3.3.1

      - generated-sources.json

      - type: script
        dest-filename: inkleaf.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/inkleaf/inkleaf "$@"
