app-id: app.paperjungle.paperjungle
runtime: org.gnome.Platform
runtime-version: '51'   # use a currently supported version
sdk: org.gnome.Sdk
command: paperjungle

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network

modules:
  - name: paperjungle
    buildsystem: simple
    build-commands:
      - mkdir -p /app/paperjungle
      - mkdir -p /app/bin
      - cp -r build/linux/$FLATPAK_ARCH/* /app/paperjungle/
      - ln -s /app/paperjungle/paperjungle $FLATPAK_DEST/bin/paperjungle
      - chmod +x /app/paperjungle/lib/crashpad_handler
      - install -Dm644 build/linux/flatpak/app.paperjungle.paperjungle.desktop /app/share/applications/app.paperjungle.paperjungle.desktop
      - install -Dm644 build/linux/flatpak/app.paperjungle.paperjungle.metainfo.xml /app/share/metainfo/app.paperjungle.paperjungle.metainfo.xml
      - install -Dm644 build/linux/flatpak/logo.svg /app/share/icons/hicolor/scalable/apps/app.paperjungle.paperjungle.svg
      - rm -r build
    sources:
      - type: git
        url: https://gitlab.com/paperjungle/build.git
        tag: 1.6.6
        commit: 228a768152597776378632c6e794273d52398606
        dest: build
        x-checker-data:
          type: "git"