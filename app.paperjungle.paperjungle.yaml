app-id: app.paperjungle.paperjungle
runtime: org.gnome.Platform
runtime-version: '51'   # use a currently supported version
sdk: org.gnome.Sdk
command: paperjungle

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --env=CONNECTIVITY_BACKEND=portal
  - --share=network

modules:
  - name: paperjungle
    buildsystem: simple
    build-commands:
      - mkdir -p /app/paperjungle
      - mkdir -p /app/bin
      - mv build/linux/* /app/paperjungle/
      - ln -s /app/paperjungle/paperjungle $FLATPAK_DEST/bin/paperjungle
      - chmod +x /app/paperjungle/lib/crashpad_handler
      - install -Dm644 app.paperjungle.paperjungle.desktop /app/share/applications/app.paperjungle.paperjungle.desktop
      - install -Dm644 app.paperjungle.paperjungle.metainfo.xml /app/share/metainfo/app.paperjungle.paperjungle.metainfo.xml
      - install -Dm644 logo.svg /app/share/icons/hicolor/scalable/apps/app.paperjungle.paperjungle.svg
    sources:
      - type: git
        url: https://gitlab.com/paperjungle/build.git
        tag: 1.6.5
        commit: ae7a83e69f1e6d0c958511aa7c94b3e698f44532
        dest: build
        x-checker-data:
          type: "git"
      - type: file
        path: ./app.paperjungle.paperjungle.desktop
      - type: file
        path: app.paperjungle.paperjungle.metainfo.xml
      - type: file
        path: ./logo.svg
