app-id: gg.gleem.Crossfade
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: gleem-crossfade

finish-args:
  # Display & IPC
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Audio
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  # D-Bus
  - --own-name=gg.gleem.Crossfade
  # Tray icon (StatusNotifierItem)
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-1
  # Hardware access (ALSA / MIDI / Stream Deck controllers)
  - --device=all
  # Plugin discovery
  - --filesystem=~/.lv2:ro
  - --filesystem=~/.vst3:ro
  - --filesystem=xdg-data/lv2:ro
  - --filesystem=xdg-data/vst3:ro

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/crossfade/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: crossfade
    buildsystem: simple
    build-commands:
      - make PREFIX=/app
      - make install PREFIX=/app
      - install -Dm644 gg.gleem.Crossfade.metainfo.xml /app/share/metainfo/gg.gleem.Crossfade.metainfo.xml
    sources:
      # Build the git source tree
      - type: git
        url: https://github.com/gleem-gg/crossfade.git
        tag: v0.10.0
      # Offline crates extracted by flatpak-cargo-generator
      - cargo-sources.json
      # AppStream metadata
      - type: file
        path: gg.gleem.Crossfade.metainfo.xml
