# Manifeste Flatpak de Sonora.
#
# Sonora n'a AUCUNE dependance npm de production : le code n'utilise que les
# modules fournis par Node et Electron. On n'a donc rien a « vendorer » — on pose
# simplement l'application dans une distribution officielle d'Electron.
# Toutes les sources sont declarees avec leur somme sha256 : la construction se
# fait entierement hors ligne, comme l'exige Flathub.

app-id: io.github.clem6859.Sonora
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp     # bibliotheques attendues par Chromium
base-version: '24.08'
command: sonora
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio            # le son
  - --share=network                # recherche et lecture en ligne
  - --device=dri                   # accélération de l'affichage
  - --filesystem=xdg-music         # pour exporter ses titres si on le souhaite
  - --talk-name=org.freedesktop.Notifications
  # Le controle multimedia du bureau (touches du casque et du clavier)
  - --own-name=org.mpris.MediaPlayer2.Sonora

modules:
  - name: sonora
    buildsystem: simple
    build-commands:
      # Distribution officielle d'Electron
      - mkdir -p /app/sonora
      - cp -a electron/. /app/sonora/
      - mv /app/sonora/electron /app/sonora/sonora
      - chmod +x /app/sonora/sonora

      # L'application elle-meme
      - mkdir -p /app/sonora/resources/app
      - cp -a main.js preload.js ui package.json /app/sonora/resources/app/

      # ⚠️ yt-dlp doit etre dans « resources/bin » : c'est la que le code le
      # cherche (process.resourcesPath + /bin).
      - install -Dm755 yt-dlp /app/sonora/resources/bin/yt-dlp

      - install -Dm755 lanceur.sh /app/bin/sonora
      - install -Dm644 io.github.clem6859.Sonora.desktop
                       /app/share/applications/io.github.clem6859.Sonora.desktop
      - install -Dm644 io.github.clem6859.Sonora.metainfo.xml
                       /app/share/metainfo/io.github.clem6859.Sonora.metainfo.xml
      - install -Dm644 paquet/icone-512.png
                       /app/share/icons/hicolor/512x512/apps/io.github.clem6859.Sonora.png
      - install -Dm644 paquet/icone-128.png
                       /app/share/icons/hicolor/128x128/apps/io.github.clem6859.Sonora.png

    sources:
      - type: git
        url: https://github.com/clem6859/Sonora.git
        tag: v1.5.4
        commit: d97fa20dfcfef8454344270a5262b312ee5ecf98

      - type: archive
        url: https://github.com/electron/electron/releases/download/v32.3.3/electron-v32.3.3-linux-x64.zip
        sha256: 0e1f1540492e48e3b8805f87c5096c3b99995c4c1b581ee57e9c836538bae813
        dest: electron
        only-arches: [x86_64]

      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp_linux
        sha256: 58162f9bfdc27458ea47bfcb311cf47028f17d8154a8bf7d689861d46399230a
        dest-filename: yt-dlp

      - type: file
        path: lanceur.sh
