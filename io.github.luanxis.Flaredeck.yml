app-id: io.github.luanxis.Flaredeck
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: flaredeck

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: flaredeck
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/flaredeck/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - mkdir -p .cargo
      - printf '[source.crates-io]\nreplace-with = "vendored-sources"\n\n[source.vendored-sources]\ndirectory = "cargo/vendor"\n' > .cargo/config.toml
      - cargo build --release --frozen
      - install -Dm755 target/release/flaredeck /app/bin/flaredeck
      - install -Dm644 data/io.github.luanxis.Flaredeck.desktop /app/share/applications/io.github.luanxis.Flaredeck.desktop
      - install -Dm644 data/io.github.luanxis.Flaredeck.metainfo.xml /app/share/metainfo/io.github.luanxis.Flaredeck.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.luanxis.Flaredeck.svg /app/share/icons/hicolor/scalable/apps/io.github.luanxis.Flaredeck.svg
      - install -Dm644 LICENSE /app/share/licenses/io.github.luanxis.Flaredeck/LICENSE
    sources:
      - generated-sources.json
      - type: git
        url: https://github.com/luanxis/flaredeck.git
        tag: v0.1.1
        commit: 79a07c95ea753c1a1bebe3157a2ec05cbdbcf5d1
