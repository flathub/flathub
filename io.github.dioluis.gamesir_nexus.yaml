app-id: io.github.dioluis.gamesir_nexus
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: gamesir-nexus
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --device=all
  - --env=QT_QPA_PLATFORM=wayland;xcb
modules:
  - name: python-deps
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip install --prefix=/app PySide6 evdev

  - name: gamesir-nexus
    buildsystem: simple
    build-commands:
      - install -D gamesir-nexus.py /app/bin/gamesir-nexus
      - chmod +x /app/bin/gamesir-nexus
      - install -D logo.jpeg /app/bin/logo.jpeg
      - install -D chave.png /app/bin/chave.png
      - install -D logo_resized.jpeg /app/share/icons/hicolor/128x128/apps/io.github.dioluis.gamesir_nexus.png
      - install -D io.github.dioluis.gamesir_nexus.desktop /app/share/applications/io.github.dioluis.gamesir_nexus.desktop
      - install -D io.github.dioluis.gamesir_nexus.metainfo.xml /app/share/metainfo/io.github.dioluis.gamesir_nexus.metainfo.xml
    sources:
      - type: file
        path: gamesir-nexus.py
      - type: file
        path: logo.jpeg
      - type: file
        path: logo_resized.jpeg
      - type: file
        path: chave.png
      - type: file
        path: io.github.dioluis.gamesir_nexus.desktop
      - type: file
        path: io.github.dioluis.gamesir_nexus.metainfo.xml
