app-id: io.github.dioluis.gamesir_nexus
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: gamesir-nexus
finish-args:
  - --device=all
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --share=network

modules:
  - name: gamesir-nexus
    buildsystem: simple
    build-commands:
      - install -D -m 755 gamesir-nexus.py /app/bin/gamesir-nexus
      - install -D -m 644 diottec.jpeg /app/bin/diottec.jpeg
      - install -D -m 644 profile_default.json /app/bin/profile_default.json
    sources:
      - type: file
        path: gamesir-nexus.py
      - type: file
        path: diottec.jpeg
      - type: file
        path: profile_default.json
