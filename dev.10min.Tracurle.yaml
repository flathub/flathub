app-id: dev.10min.Tracurle
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: Tracurle
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --filesystem=host
modules:
  - name: tracurle
    buildsystem: simple
    build-commands:
      - cp -r * /app/bin/
      - install -D dev.10min.Tracurle.desktop /app/share/applications/dev.10min.Tracurle.desktop
      - install -D dev.10min.Tracurle.metainfo.xml /app/share/metainfo/dev.10min.Tracurle.metainfo.xml
      - install -D dev.10min.Tracurle.png /app/share/icons/hicolor/512x512/apps/dev.10min.Tracurle.png
    sources:
      - type: archive
        url: https://github.com/10min-dev/apps/releases/download/tracurle-v1.0.0/tracurle-linux-x64.tar.gz
        sha256: B940A4833DE87CD2B86535AD569356A4BD89D01C2791DAF55D946EEBD16498DD
      - type: file
        path: dev.10min.Tracurle.desktop
      - type: file
        path: dev.10min.Tracurle.metainfo.xml
      - type: file
        path: dev.10min.Tracurle.png