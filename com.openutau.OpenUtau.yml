id: com.openutau.OpenUtau
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: OpenUtau
rename-desktop-file: OpenUtau.desktop
rename-icon: openutau

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --env=DOTNET_ROOT=/app/lib/dotnet

modules:
  - name: dotnet
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/dotnet10/bin/install.sh

  - name: openutau
    buildsystem: simple
    build-options:
      prepend-path: /usr/lib/sdk/dotnet10/bin
    build-commands:
      - dotnet publish OpenUtau -p:Version=0.1.577 --no-self-contained --source nuget-sources --source /usr/lib/sdk/dotnet10/nuget/packages
      - cp -r OpenUtau/bin/Release/net10.0/*/publish/* /app/bin
      - install -Dt /app/share/applications OpenUtau/Assets/OpenUtau.desktop
      - desktop-file-edit --set-key Exec --set-value OpenUtau /app/share/applications/OpenUtau.desktop
      - install -Dt /app/share/icons/hicolor/scalable/apps Logo/openutau.svg
      - install -Dt /app/share/metainfo OpenUtau/Assets/com.openutau.OpenUtau.metainfo.xml
    sources:
      - type: git
        url: https://github.com/stakira/OpenUtau.git
        tag: 0.1.577.6-alpha
        commit: e26be81353ace80fac1077f3d08e5d41afc29db9
      - nuget-sources.json
