app-id: io.github.leumicard_code.Vulkan-Audio-Visualizer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: vulkan_audio_studio

finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --socket=pulseaudio

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/vulkan-audio-studio/cargo

modules:
  - name: vulkan-audio-studio
    buildsystem: simple
    build-commands:
      - mkdir -p _flatpak_link
      - ln -sf "$(g++ -print-file-name=libstdc++.so)" _flatpak_link/libsupc++.so
      - RUSTFLAGS="-L /run/build/vulkan-audio-studio/_flatpak_link" cargo --offline build --release --verbose
      - install -Dm755 target/release/vulkan_audio_studio /app/bin/vulkan_audio_studio
      - install -Dm644 packaging/flatpak/io.github.leumicard_code.Vulkan-Audio-Visualizer.desktop /app/share/applications/io.github.leumicard_code.Vulkan-Audio-Visualizer.desktop
      - install -Dm644 packaging/flatpak/io.github.leumicard_code.Vulkan-Audio-Visualizer.metainfo.xml /app/share/metainfo/io.github.leumicard_code.Vulkan-Audio-Visualizer.metainfo.xml
      - install -Dm644 packaging/flatpak/io.github.leumicard_code.Vulkan-Audio-Visualizer.svg /app/share/icons/hicolor/scalable/apps/io.github.leumicard_code.Vulkan-Audio-Visualizer.svg
      - install -Dm644 assets/app_icon_128.png /app/share/icons/hicolor/128x128/apps/io.github.leumicard_code.Vulkan-Audio-Visualizer.png
      - install -Dm644 LICENSE /app/share/licenses/io.github.leumicard_code.Vulkan-Audio-Visualizer/LICENSE
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - build-dir
          - flatpak-repo
          - .flatpak-builder
          - .git
      - cargo-sources.json
