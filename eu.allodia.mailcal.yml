app-id: eu.allodia.mailcal

runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

command: mailcal

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU acceleration
  - --device=dri

modules:
  - name: allodia-mail-calendar
    buildsystem: simple
    build-commands:
      # The extra-data unpacks into /app/extra, so /app/bin holds wrappers that exec across.
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 mailcal.sh /app/bin/mailcal
      - install -Dm755 allodia-mcp.sh /app/bin/allodia-mcp

      # Committed here, not shipped in the tarball: Flathub reads them at build time.
      - install -Dm644 eu.allodia.mailcal.desktop /app/share/applications/eu.allodia.mailcal.desktop
      - install -Dm644 eu.allodia.mailcal.metainfo.xml /app/share/metainfo/eu.allodia.mailcal.metainfo.xml

      - install -Dm644 eu.allodia.mailcal.128.png /app/share/icons/hicolor/128x128/apps/eu.allodia.mailcal.png
      - install -Dm644 eu.allodia.mailcal.256.png /app/share/icons/hicolor/256x256/apps/eu.allodia.mailcal.png
      - install -Dm644 eu.allodia.mailcal.512.png /app/share/icons/hicolor/512x512/apps/eu.allodia.mailcal.png

    sources:
      # These URLs are immutable: a published path is never reused or overwritten.
      - type: extra-data
        only-arches: [x86_64]
        filename: allodia-mail-calendar-x86_64.tar.xz
        url: https://dl.allodia.eu/mailcal/linux/0.7.0/allodia-mail-calendar-0.7.0-x86_64.tar.xz
        sha256: b7484985569407c696d0c3641cd1d5e217e84f947e4cd81a80cff7f69ddd860a
        size: 9080888
        x-checker-data:
          type: json
          url: https://dl.allodia.eu/mailcal/linux/releases.json
          version-query: .stable
          url-query: '"https://dl.allodia.eu/mailcal/linux/" + $version + "/allodia-mail-calendar-" + $version + "-x86_64.tar.xz"'

      - type: extra-data
        only-arches: [aarch64]
        filename: allodia-mail-calendar-aarch64.tar.xz
        url: https://dl.allodia.eu/mailcal/linux/0.7.0/allodia-mail-calendar-0.7.0-aarch64.tar.xz
        sha256: a66b9c92f4ade6f956d527ee81711d506a36dde4e9f84fb725cac0d32fa89a8b
        size: 7784388
        x-checker-data:
          type: json
          url: https://dl.allodia.eu/mailcal/linux/releases.json
          version-query: .stable
          url-query: '"https://dl.allodia.eu/mailcal/linux/" + $version + "/allodia-mail-calendar-" + $version + "-aarch64.tar.xz"'

      - type: script
        dest-filename: apply_extra
        commands:
          - tar -xf allodia-mail-calendar-*.tar.xz
          - rm -f allodia-mail-calendar-*.tar.xz

      - type: script
        dest-filename: mailcal.sh
        commands:
          - exec /app/extra/bin/mailcal "$@"

      # Second entry point: `flatpak run --command=allodia-mcp eu.allodia.mailcal`.
      - type: script
        dest-filename: allodia-mcp.sh
        commands:
          - exec /app/extra/bin/allodia-mcp "$@"

      - type: file
        path: eu.allodia.mailcal.desktop
      - type: file
        path: eu.allodia.mailcal.metainfo.xml
      - type: file
        path: eu.allodia.mailcal.128.png
      - type: file
        path: eu.allodia.mailcal.256.png
      - type: file
        path: eu.allodia.mailcal.512.png
