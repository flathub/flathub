app-id: io.github.furkangumrukcu07.RayPlayer
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: ray-player

sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21

finish-args:
  # Graphical display (X11 & Wayland)
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  # Audio
  - --socket=pulseaudio
  # Network access for IPTV streams and Google Sign-in
  - --share=network
  # Keyring access for credential storage
  - --talk-name=org.freedesktop.secrets
  # GPU acceleration
  - --device=dri
  # Environment setup
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin
  - --env=JAVA_HOME=/app/jre

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh

  - name: ray-player
    buildsystem: simple
    build-commands:
      - install -dm755 /app/lib/ray-player
      - cp -R lib/* /app/lib/ray-player/
      - install -Dm755 ray-player.sh /app/bin/ray-player
      - install -Dm644 io.github.furkangumrukcu07.RayPlayer.desktop /app/share/applications/io.github.furkangumrukcu07.RayPlayer.desktop
      - install -Dm644 io.github.furkangumrukcu07.RayPlayer.png /app/share/icons/hicolor/256x256/apps/io.github.furkangumrukcu07.RayPlayer.png
      - install -Dm644 io.github.furkangumrukcu07.RayPlayer.metainfo.xml /app/share/metainfo/io.github.furkangumrukcu07.RayPlayer.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/furkangumrukcu07/RayPlayer/releases/download/v1.3.296/ray-player-1.3.296.tar.gz
        sha256: d0d132b79ffe1558999d9141eed384e7fb6c79bd6660cb14413e2c363fd49228
      - type: file
        path: io.github.furkangumrukcu07.RayPlayer.desktop
      - type: file
        path: io.github.furkangumrukcu07.RayPlayer.metainfo.xml
      - type: file
        path: io.github.furkangumrukcu07.RayPlayer.png
      - type: file
        path: ray-player.sh
