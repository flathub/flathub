app-id: eu.geostratum.LithothequeServer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: lithotheque-server
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network

modules:
  - name: lithotheque-server
    buildsystem: simple
    build-commands:
      - install -Dm755 litho-hub /app/bin/litho-hub
      - install -Dm755 lithotheque-server-launcher.py /app/bin/lithotheque-server
      - install -Dm644 eu.geostratum.LithothequeServer.desktop /app/share/applications/eu.geostratum.LithothequeServer.desktop
      - install -Dm644 eu.geostratum.LithothequeServer.metainfo.xml /app/share/metainfo/eu.geostratum.LithothequeServer.metainfo.xml
      - install -Dm644 eu.geostratum.LithothequeServer.svg /app/share/icons/hicolor/scalable/apps/eu.geostratum.LithothequeServer.svg
    sources:
      - type: file
        path: litho-hub
      - type: file
        path: lithotheque-server-launcher.py
      - type: file
        path: eu.geostratum.LithothequeServer.desktop
      - type: file
        path: eu.geostratum.LithothequeServer.metainfo.xml
      - type: file
        path: eu.geostratum.LithothequeServer.svg
