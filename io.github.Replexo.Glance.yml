
id: io.github.Replexo.Glance
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm22
command: glance

finish-args:
  # Graphics
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

  # Browse through photos
  - --filesystem=host

  # Enable access to GVfs
  - --talk-name=org.gtk.vfs.*
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'

modules:
  - name: geocode-glib
    buildsystem: meson
    config-opts:
      - -Denable-installed-tests=false
      - -Denable-introspection=false
      - -Denable-gtk-doc=false
      - -Dsoup2=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/geocode-glib/3.26/geocode-glib-3.26.4.tar.xz
        sha256: 2d9a6826d158470449a173871221596da0f83ebdcff98b90c7049089056a37aa
        x-checker-data:
          type: gnome
          name: geocode-glib

  - name: gweather-locations
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gweather-locations/2026/gweather-locations-2026.2.tar.xz
        sha256: e7570a3661e0a752a06387b2032585cf588fc56770b1f9f39f1a55d17b2835fe
        x-checker-data:
          type: gnome
          name: gweather-locations

  - name: libgweather
    buildsystem: meson
    config-opts:
      - -Denable_vala=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Dtests=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libgweather/4.6/libgweather-4.6.0.tar.xz
        sha256: 7f5d0e8c9685ef2ff46c2f3a57cae48d7bf3540b2d83921f889ef28e6a876788
        x-checker-data:
          type: gnome
          name: libgweather
          version-scheme: odd-minor-is-unstable
          versions:
            <: '40.alpha'

  - name: glance
    buildsystem: meson
    sources:
      # Glance source pinned to v1.0
      - type: git
        url: https://github.com/Replexo/Glance.git
        tag: v1.0
        commit: 682d6800b6b5e3d19608f178aa1dea5be4fb6fdf

      # Generated Cargo dependencies
      - generated-sources-glance.json

      # Copy generated Cargo configuration
      - type: shell
        commands:
          - mkdir -p .cargo
          - cp cargo/config .cargo/

