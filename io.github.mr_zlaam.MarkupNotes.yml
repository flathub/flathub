app-id: io.github.mr_zlaam.MarkupNotes
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: markup-notes

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --filesystem=home
  - --filesystem=~/.gitconfig:ro
  - --filesystem=~/.ssh:ro
  - --env=QT_QPA_PLATFORM=wayland;xcb

modules:
  - name: git
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/libexec /app/share
      - cp /usr/bin/git /app/bin/git.real
      - cp -r /usr/libexec/git-core /app/libexec/
      - cp -r /usr/share/git-core /app/share/
      - |
        cat << 'EOF' > /app/bin/git
        #!/bin/sh
        export GIT_EXEC_PATH=/app/libexec/git-core
        export GIT_TEMPLATE_DIR=/app/share/git-core/templates
        exec /app/bin/git.real "$@"
        EOF
      - chmod +x /app/bin/git

  - name: python3-dependencies
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links=. --prefix=/app pyqt6 pyqt6-qt6 pyqt6-sip
    sources:
      # x86_64
      - type: file
        only-arches:
          - x86_64
        url: https://files.pythonhosted.org/packages/d5/fb/97ba2fa6370b93b9595f0dcd78e1a99451853c9a4dc3b545698d90c35694/pyqt6_sip-13.13.1-cp313-cp313-manylinux1_x86_64.manylinux_2_5_x86_64.whl
        sha256: 50b6d3a20076457ac1675a235721947b6fd9493017d36b6ef42397a8f38da0f6
      - type: file
        only-arches:
          - x86_64
        url: https://files.pythonhosted.org/packages/d1/e5/c296a9bcde5ef9bbbc5249079422266ccd9c583d117c27d0e832861e9767/pyqt6_qt6-6.12.0-py3-none-manylinux_2_34_x86_64.whl
        sha256: b76e9962e83cf7daff9bb7ab169c804f37b77ab2d7393d3b380351f5a2441ee0
      - type: file
        only-arches:
          - x86_64
        url: https://files.pythonhosted.org/packages/f9/cb/7557f6c559b392bb66a184eee802091676bf8e67a0d00f19a0dc10b5a7ae/pyqt6-6.12.0-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: 1922bf7440310845a4fd06f4242288084dc26cf682a67e561b115570a8def3d1
      # aarch64
      - type: file
        only-arches:
          - aarch64
        url: https://files.pythonhosted.org/packages/48/31/5a7ce8393fa5db0f3e51a20063f83f5d03d3bb1e64002a8ef93edad2c828/pyqt6_sip-13.13.1-cp313-cp313-manylinux_2_17_aarch64.manylinux2014_aarch64.whl
        sha256: 402926d57bd15ba41d21e269b6941ad949f60b5e0ce53146a5914771cd2be3b0
      - type: file
        only-arches:
          - aarch64
        url: https://files.pythonhosted.org/packages/62/85/4987f605abd8854eaaefe7a26e5926bab0600985984aa5555cf0d8d7cb2f/pyqt6_qt6-6.12.0-py3-none-manylinux_2_39_aarch64.whl
        sha256: 2460119ac5f725cfddc331bd56eca22fbb61b29a549d417b7bcc304c7fc9459b
      - type: file
        only-arches:
          - aarch64
        url: https://files.pythonhosted.org/packages/37/5e/5154ead9550aed78ecf9adddb2d5087ac8878cb9c337834b951c32763fae/pyqt6-6.12.0-cp310-abi3-manylinux_2_39_aarch64.whl
        sha256: 2799f2e75594af313222a2dc2da9f965fe88be29ee4293d7937e7763630f5610

  - name: markup-notes
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/markup-notes /app/bin
      - cp -r main.py ui core utils assets /app/share/markup-notes/
      - |
        cat << 'EOF' > /app/bin/markup-notes
        #!/bin/sh
        export QT_LOGGING_RULES="qt.qpa.wayland.textinput=false;*.debug=false"
        exec python3 /app/share/markup-notes/main.py "$@"
        EOF
      - chmod +x /app/bin/markup-notes
      - install -Dm644 io.github.mr_zlaam.MarkupNotes.desktop /app/share/applications/io.github.mr_zlaam.MarkupNotes.desktop
      - install -Dm644 io.github.mr_zlaam.MarkupNotes.metainfo.xml /app/share/metainfo/io.github.mr_zlaam.MarkupNotes.metainfo.xml
      - |
        for size in 16 24 32 48 64 128 256 512; do
          install -Dm644 assets/icons/hicolor/${size}x${size}/apps/markup-notes.png /app/share/icons/hicolor/${size}x${size}/apps/io.github.mr_zlaam.MarkupNotes.png
        done
    sources:
      - type: git
        url: https://github.com/mr-zlaam/MarkupNotes.git
        tag: v0.1.0
        commit: 5774c1c45d093167a306396ac69c60e4531640bf
      - type: file
        path: io.github.mr_zlaam.MarkupNotes.desktop
      - type: file
        path: io.github.mr_zlaam.MarkupNotes.metainfo.xml
