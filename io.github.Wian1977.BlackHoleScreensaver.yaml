app-id: io.github.Wian1977.BlackHoleScreensaver
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: blackhole-screensaver
finish-args:
  # GPU / display
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Talk to the desktop screen-saver services so the daemon can react to
  # lock / idle (ActiveChanged). Without these it cannot receive the
  # standard screen-saver signals and would fall back to X11 polling only.
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.kde.screensaver
  - --talk-name=org.kde.ScreenSaver
  - --talk-name=org.cinnamon.ScreenSaver
  - --talk-name=org.gnome.ScreenSaver
  - --talk-name=org.mate.ScreenSaver
modules:
  - name: blackhole-screensaver
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/blackhole
      - cp -r *.py *.bin /app/share/blackhole/
      - |
        install -Dm755 /dev/stdin /app/bin/blackhole-screensaver <<'SH'
        #!/bin/sh
        # Launcher for the black-hole screensaver.
        #   (no args)   -> run the idle/lock daemon (default)
        #   --gl        -> run the full-screen visualization once
        #   --install   -> handed through to the daemon (no-op under Flatpak)
        SCRIPT_DIR=/app/share/blackhole
        case "$1" in
          --gl) exec python3 "$SCRIPT_DIR/bh_gl.py" ;;
          --daemon|"") exec python3 "$SCRIPT_DIR/blackhole-daemon.py" ;;
          *) exec python3 "$SCRIPT_DIR/blackhole-daemon.py" "$@" ;;
        esac
        SH
      - |
        install -Dm644 /dev/stdin /app/share/applications/io.github.Wian1977.BlackHoleScreensaver.desktop <<'DE'
        [Desktop Entry]
        Type=Application
        Name=Black Hole Screensaver
        Comment=Real-time GPU-rendered Gargantua black hole
        Exec=blackhole-screensaver --gl
        Terminal=false
        Categories=Graphics;Utility;
        Keywords=blackhole;screensaver;
        Icon=io.github.Wian1977.BlackHoleScreensaver
        DE
      - |
        install -Dm644 /dev/stdin /app/etc/xdg/autostart/io.github.Wian1977.BlackHoleScreensaver.daemon.desktop <<'AU'
        [Desktop Entry]
        Type=Application
        Name=Black Hole Screensaver Daemon
        Comment=Auto-launch the black hole screensaver on lock/idle
        Exec=flatpak run io.github.Wian1977.BlackHoleScreensaver
        Terminal=false
        X-GNOME-Autostart-enabled=true
        X-KDE-autostart-enabled=true
        AU
      - install -Dm644 plugin/blackhole.png /app/share/icons/hicolor/1024x1024/apps/io.github.Wian1977.BlackHoleScreensaver.png
      - install -Dm644 io.github.Wian1977.BlackHoleScreensaver.metainfo.xml /app/share/metainfo/io.github.Wian1977.BlackHoleScreensaver.metainfo.xml
    sources:
      - type: git
        url: https://github.com/Wian1977/blackhole-screensaver.git
        tag: v1.1.0
        commit: f8e8f722385244437e7007db27bf9b87933bb9ec
      - type: file
        path: io.github.Wian1977.BlackHoleScreensaver.metainfo.xml
