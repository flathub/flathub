id: com.eductool.app
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: eductool
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  # n'ajoute --share=network QUE si l'app en a besoin à l'exécution
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/eductool/cargo
modules:
  - name: eductool
    buildsystem: simple
    build-options:
      env:
        CARGO_NET_OFFLINE: 'true'
        npm_config_offline: 'true'
        npm_config_cache: /run/build/eductool/flatpak-node/npm-cache
    build-commands:
      - npm ci --offline --cache /run/build/eductool/flatpak-node/npm-cache
      - npm run tauri build -- --no-bundle
      - install -Dm755 src-tauri/target/release/eductool-desktop /app/bin/eductool
      - install -Dm644 com.eductool.app.desktop /app/share/applications/com.eductool.app.desktop
      - install -Dm644 com.eductool.app.metainfo.xml /app/share/metainfo/com.eductool.app.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/com.eductool.app.png
    sources:
      - type: git
        url: https://gitlab.com/devmr/eductool-desktop-tauri.git
        tag: v0.13.2
        commit: fed444e34d4b83fb9db38b1daba60bb44e3e55c0
      - cargo-sources.json
      - node-sources.json