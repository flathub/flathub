id: app.wasmer.eski19758.Groovebox
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: groovebox
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'
    PIP_DISABLE_PIP_VERSION_CHECK: '1'
    PIP_NO_INDEX: '1'
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --device=all
  - --filesystem=home
modules:
  - name: portaudio
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DPA_BUILD_SHARED=ON
      - -DPA_BUILD_STATIC=OFF
      - -DPA_USE_JACK=OFF
      - -DPA_USE_OSS=OFF
    sources:
      - type: archive
        url: https://github.com/PortAudio/portaudio/archive/refs/tags/v19.7.0.tar.gz
        sha256: 5af29ba58bbdbb7bbcefaaecc77ec8fc413f0db6f4c4e286c40c3e1b83174fa0

  - name: python3-pycparser
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/fe/cf/d2d3b9f5699fb1e4615c8e32ff220203e43b248e1dfcc6736ad9057731ca/pycparser-2.23.tar.gz
        sha256: 78816d4f24add8f10a06d6f05b4d424ad9e96cfebf68a4ddc99c65c0720d00c2

  - name: python3-cffi
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/eb/56/b1ba7935a17738ae8453301356628e8147c79dbb825bcbc73dc7401f9846/cffi-2.0.0.tar.gz
        sha256: 44d1b5909021139fe36001ae048dbdde8214afa20200eda0f64c068cac5d5529

  - name: python3-pyproject-metadata
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/source/p/pyproject-metadata/pyproject_metadata-0.9.1.tar.gz
        sha256: b8b2253dd1b7062b78cf949a115f02ba7fa4114aabe63fa10528e9e1a954a816

  - name: python3-meson-python
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/26/bd/fdb26366443620f1a8a4d4ec7bfa37d1fbbe7bf737b257c205bbcf95ba95/meson_python-0.18.0.tar.gz
        sha256: c56a99ec9df669a40662fe46960321af6e4b14106c14db228709c1628e23848d

  - name: python3-numpy
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/source/n/numpy/numpy-2.2.6.tar.gz
        sha256: e29554e2bef54a90aa5cc07da6ce955accb83f21ab5de01a62c8478897b264fd

  - name: python3-pillow
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/source/p/pillow/pillow-11.3.0.tar.gz
        sha256: 3828ee7586cd0b2091b6209e5ad53e20d0649bbe87164a459d0676e035e8f523

  - name: python3-sounddevice
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/source/s/sounddevice/sounddevice-0.5.6.tar.gz
        sha256: 8ec9fbfde2e32f020b167e348f3ab3bac6625a5f15af524d790108ac7147a410

  - name: groovebox
    buildsystem: simple
    build-commands:
      - install -d /app/lib/groovebox
      - cp -a . /app/lib/groovebox/
      - install -Dm644 LICENSE /app/share/licenses/app.wasmer.eski19758.Groovebox/LICENSE
      - test -f sCode/bootstrap/linux-x86_64/scode0
      - install -Dm755 sCode/bootstrap/linux-x86_64/scode0 /app/lib/groovebox/sCode/bootstrap/linux-x86_64/scode0
      - /app/lib/groovebox/sCode/bootstrap/linux-x86_64/scode0 run /app/lib/groovebox/sCode/apps/groovebox/groovebox_optimizer.sC > /tmp/scode-flatpak-probe.txt
      - grep -q '^scode_optimizer_abi=9$' /tmp/scode-flatpak-probe.txt
      - rm -f /app/lib/groovebox/cpp/libgroovebox_accel.so
      - g++ -O3 -fPIC -shared /app/lib/groovebox/cpp/groovebox_accel.cpp -o /app/lib/groovebox/cpp/libgroovebox_accel.so
      - install -Dm755 packaging/flathub/groovebox-flatpak-launcher /app/bin/groovebox
      - install -Dm644 packaging/flathub/app.wasmer.eski19758.Groovebox.desktop /app/share/applications/app.wasmer.eski19758.Groovebox.desktop
      - install -Dm644 packaging/flathub/app.wasmer.eski19758.Groovebox.metainfo.xml /app/share/metainfo/app.wasmer.eski19758.Groovebox.metainfo.xml
      - install -Dm644 packaging/flathub/app.wasmer.eski19758.Groovebox.png /app/share/icons/hicolor/256x256/apps/app.wasmer.eski19758.Groovebox.png
      - install -d /app/lib/groovebox/bin
      - printf '%s\n' '#!/bin/sh' 'exec /usr/bin/ffmpeg "$@"' > /app/lib/groovebox/bin/ffmpeg
      - printf '%s\n' '#!/bin/sh' 'exec /usr/bin/ffprobe "$@"' > /app/lib/groovebox/bin/ffprobe
      - chmod 0755 /app/lib/groovebox/bin/ffmpeg /app/lib/groovebox/bin/ffprobe
    sources:
      - type: archive
        url: https://github.com/wittymoniker/groovebox-eqr-asking-for-fixed/releases/download/v2026.09.13-flathub4/groovebox-flatpak-source-2026.09.13-poolfix.tar.gz
        sha256: 04dfc28df2ea5f0bd81d2ddda841cd1c618ef75f33de485f943f4383d30922ee
        strip-components: 1
        x-checker-data:
          type: json
          url: https://api.github.com/repos/wittymoniker/groovebox-eqr-asking-for-fixed/releases/latest
          version-query: '.tag_name | sub("^v"; "")'
          url-query: '.assets[] | select(.name == "groovebox-flatpak-source-2026.09.13-poolfix.tar.gz") | .browser_download_url'
