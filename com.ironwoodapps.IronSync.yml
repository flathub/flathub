app-id: com.ironwoodapps.IronSync
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: IronSync
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-documents:create
  - --filesystem=xdg-download:create
  - --filesystem=xdg-desktop:create
  - --filesystem=xdg-music:create
  - --filesystem=xdg-pictures:create
  - --filesystem=xdg-videos:create
  - --filesystem=/media
  - --filesystem=/mnt
  - --filesystem=/run/media
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: ironsync
    buildsystem: simple
    build-commands:
      - install -d ${FLATPAK_DEST}/lib/ironsync ${FLATPAK_DEST}/bin
      - cp -a IronSync-*/. ${FLATPAK_DEST}/lib/ironsync/
      - chmod 755 ${FLATPAK_DEST}/lib/ironsync/IronSync
      - |
        cat > ${FLATPAK_DEST}/bin/IronSync <<'EOF'
        #!/bin/sh
        set -eu
        ROOT=/app/lib/ironsync
        cd "$ROOT"
        exec "$ROOT/IronSync" "$@"
        EOF
      - chmod 755 ${FLATPAK_DEST}/bin/IronSync
      - install -Dm644 com.ironwoodapps.IronSync.desktop ${FLATPAK_DEST}/share/applications/com.ironwoodapps.IronSync.desktop
      - install -Dm644 com.ironwoodapps.IronSync.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.ironwoodapps.IronSync.metainfo.xml
      - install -Dm644 AppIcon.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/com.ironwoodapps.IronSync.png
      - install -Dm644 LICENSE-STORE.txt ${FLATPAK_DEST}/share/licenses/com.ironwoodapps.IronSync/LICENSE
    sources:
      - type: archive
        url: https://ironwoodapps.com/downloads/ironsync/linux/IronSync-2.1.0-linux-x64.tar.gz
        sha256: 8e511c44a6bf18563e3d98f39a653e2769cc676b26e97f4f7c19df251997e084
      - type: file
        path: com.ironwoodapps.IronSync.desktop
      - type: file
        path: com.ironwoodapps.IronSync.metainfo.xml
      - type: file
        path: AppIcon.png
      - type: file
        path: LICENSE-STORE.txt
