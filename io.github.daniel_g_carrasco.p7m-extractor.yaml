app-id: io.github.daniel_g_carrasco.p7m-extractor
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: p7m-extractor

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # The extracted document is written next to the signed file the user drops,
  # picks or opens, and folders are scanned recursively. That needs real write
  # access to those locations (home, removable media, network mounts), which
  # the document portal (single file, read-only parent) cannot grant.
  - --filesystem=host

modules:
  - name: p7m-extractor
    buildsystem: simple
    build-commands:
      # pure Python; PyGObject, GTK 4 and libadwaita come with the GNOME runtime
      - install -Dm755 p7m_extractor.py /app/bin/p7m-extractor
      - python3 tools/compile_po.py --dest /app/share/locale
      - install -Dm644 data/io.github.daniel_g_carrasco.p7m-extractor.desktop -t /app/share/applications
      - install -Dm644 data/io.github.daniel_g_carrasco.p7m-extractor.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.daniel_g_carrasco.p7m-extractor.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 data/icons/hicolor/symbolic/apps/io.github.daniel_g_carrasco.p7m-extractor-symbolic.svg -t /app/share/icons/hicolor/symbolic/apps
      - install -Dm644 data/icons/hicolor/64x64/apps/io.github.daniel_g_carrasco.p7m-extractor.png -t /app/share/icons/hicolor/64x64/apps
      - install -Dm644 data/icons/hicolor/128x128/apps/io.github.daniel_g_carrasco.p7m-extractor.png -t /app/share/icons/hicolor/128x128/apps
      - install -Dm644 data/icons/hicolor/256x256/apps/io.github.daniel_g_carrasco.p7m-extractor.png -t /app/share/icons/hicolor/256x256/apps
    sources:
      - type: git
        url: https://github.com/daniel-g-carrasco/p7m-extractor.git
        tag: v1.2.1
        commit: 04bdee7edf79e286f71503bc5db2f2ad084c059a
        x-checker-data:
          type: git
          tag-pattern: '^v([\d.]+)$'
