app-id: cn.trae.Trae
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: trae-cn
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=ssh-auth
  - --socket=pulseaudio
  - --device=all
  - --allow=devel
  - --persist=.
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Flatpak
separate-locales: false

modules:
  - name: trae-cn
    buildsystem: simple
    build-commands:
      - install -Dm755 -t ${FLATPAK_DEST}/bin/ apply_extra trae-cn
      - install -Dm644 -t ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/ ${FLATPAK_ID}.png
      - install -Dm644 ${FLATPAK_ID}.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/mimetypes/${FLATPAK_ID}.code-workspace.png
      - install -Dm644 -t ${FLATPAK_DEST}/share/applications/ ${FLATPAK_ID}.desktop ${FLATPAK_ID}.url-handler.desktop
      - install -Dm644 -t ${FLATPAK_DEST}/share/metainfo/ ${FLATPAK_ID}.metainfo.xml
      - install -Dm644 -t ${FLATPAK_DEST}/share/mime/packages/ ${FLATPAK_ID}.xml
    sources:
      - type: script
        commands:
          - exec zypak-wrapper /app/extra/trae-cn/trae-cn "$@"
        dest-filename: trae-cn
      - type: script
        commands:
          - bsdtar -O -xf trae.deb data.* | bsdtar --no-same-owner -xf -
          - mv usr/share/trae-cn .
          - rm -rf usr *.deb
        dest-filename: apply_extra
      - type: extra-data
        only-arches: [x86_64]
        filename: trae.deb
        url: https://lf-cdn.trae.com.cn/obj/trae-com-cn/pkg/app/releases/stable/2.3.13343/linux/Trae%20CN-linux-x64.deb
        sha256: 7f42a2aad4bef92e2a697c9d8962cb7f8b4bf0aa0efe0c2bbb9b49b43558daea
        size: 239105732
        x-checker-data:
          type: json
          url: https://api.trae.ai/icube/api/v1/native/version/trae/cn/latest
          version-query: .data.manifest.linux.version
          url-query: .data.manifest.linux.download[] | select(.region=="cn") | ."x64.deb"
      - type: extra-data
        only-arches: [aarch64]
        filename: trae.deb
        url: https://lf-cdn.trae.com.cn/obj/trae-com-cn/pkg/app/releases/stable/2.3.13343/linux/Trae%20CN-linux-arm64.deb
        sha256: 052f7e05a8fa71a326c667e2c87cc3b099396d4474f4e0eef19a5aa3c28a7f5b
        size: 223237144
        x-checker-data:
          type: json
          url: https://api.trae.ai/icube/api/v1/native/version/trae/cn/latest
          version-query: .data.manifest.linux.version
          url-query: .data.manifest.linux.download[] | select(.region=="cn") | ."arm64.deb"
      - type: file
        path: cn.trae.Trae.desktop
      - type: file
        path: cn.trae.Trae.url-handler.desktop
      - type: file
        path: cn.trae.Trae.metainfo.xml
      - type: file
        path: cn.trae.Trae.png
      - type: file
        path: cn.trae.Trae.xml
