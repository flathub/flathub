app-id: com.connectmeguru.App
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: connectmeguru-launcher
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: connectmeguru
    buildsystem: simple
    build-commands:
      - install -D -m 755 launcher /app/bin/connectmeguru-launcher
      - install -D -m 644 com.connectmeguru.App.desktop /app/share/applications/com.connectmeguru.App.desktop
      - install -D -m 644 com.connectmeguru.App.metainfo.xml /app/share/metainfo/com.connectmeguru.App.metainfo.xml
      - install -D -m 644 com.connectmeguru.App.png /app/share/icons/hicolor/512x512/apps/com.connectmeguru.App.png
    sources:
      - type: file
        path: com.connectmeguru.App.desktop
      - type: file
        path: com.connectmeguru.App.metainfo.xml
      - type: file
        path: com.connectmeguru.App.png
      - type: script
        dest-filename: launcher
        commands:
          - xdg-open "https://www.connectmeguru.com?utm_source=flathub"
