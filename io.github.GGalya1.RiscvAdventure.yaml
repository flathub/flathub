id: io.github.GGalya1.RiscvAdventure
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: riscv-adventure

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: riscv-adventure
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - install -Dm755 StandaloneLinux64 /app/bin/riscv-adventure
      - cp -r StandaloneLinux64_Data /app/bin/riscv-adventure_Data
      - install -Dm755 UnityPlayer.so /app/bin/UnityPlayer.so
      - install -Dm755 libdecor-0.so.0 /app/bin/libdecor-0.so.0
      - install -Dm755 libdecor-cairo.so /app/bin/libdecor-cairo.so
      - install -Dm644 io.github.GGalya1.RiscvAdventure.desktop /app/share/applications/io.github.GGalya1.RiscvAdventure.desktop
      - install -Dm644 io.github.GGalya1.RiscvAdventure.png /app/share/icons/hicolor/512x512/apps/io.github.GGalya1.RiscvAdventure.png
      - install -Dm644 io.github.GGalya1.RiscvAdventure.metainfo.xml /app/share/metainfo/io.github.GGalya1.RiscvAdventure.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/GGalya1/RiscvAdventure/releases/download/v0.8.6.1/RiscvAdventure.Linux.Build.v0.8.6.1.tar.gz
        sha256: 7e25df9022b9bfd5c745d1a45df44a6f0d9b1e2aba430766e1d0a8e10d1d3e94
      - type: file
        url: https://raw.githubusercontent.com/GGalya1/RiscvAdventure/main/flathub/io.github.GGalya1.RiscvAdventure.desktop
        sha256: 4d01ae3d965b151775f5bdbef16752042128fad17679367f9551c7db2e4a2faa
      - type: file
        url: https://raw.githubusercontent.com/GGalya1/RiscvAdventure/main/flathub/io.github.GGalya1.RiscvAdventure.metainfo.xml
        sha256: bbc0af38adbbbfcbffada7720109d569ee7602d788794d9364fd6204ba3fcdc8
      - type: file
        url: https://raw.githubusercontent.com/GGalya1/RiscvAdventure/main/flathub/io.github.GGalya1.RiscvAdventure.png
