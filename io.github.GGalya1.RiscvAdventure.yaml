id: io.github.GGalya1.RiscvAdventure
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: riscv-adventure.sh

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: riscv-adventure
    buildsystem: simple
    build-commands:
      - install -Dm755 RiscvAdventure.x86_64 /app/bin/RiscvAdventure.x86_64
      - cp -r RiscvAdventure_Data /app/bin/RiscvAdventure_Data
      - install -Dm755 UnityPlayer.so /app/bin/UnityPlayer.so
      - install -Dm755 libdecor-0.so.0 /app/bin/libdecor-0.so.0
      - install -Dm755 libdecor-cairo.so /app/bin/libdecor-cairo.so
      - install -Dm755 riscv-adventure.sh /app/bin/riscv-adventure.sh
      - install -Dm644 io.github.GGalya1.RiscvAdventure.desktop /app/share/applications/io.github.GGalya1.RiscvAdventure.desktop
      - install -Dm644 io.github.GGalya1.RiscvAdventure.png /app/share/icons/hicolor/512x512/apps/io.github.GGalya1.RiscvAdventure.png
      - install -Dm644 io.github.GGalya1.RiscvAdventure.metainfo.xml /app/share/metainfo/io.github.GGalya1.RiscvAdventure.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/GGalya1/riscv-architecture-educational-game/releases/download/v0.8.6/RiscvAdventure-linux.zip
        sha256: 06433f3babf13af481d03cd96b45a21d07105a509b04747bd3d64bca9fdde6a7

      - type: file
        path: riscv-adventure.sh
      - type: file
        path: io.github.GGalya1.RiscvAdventure.desktop
      - type: file
        path: io.github.GGalya1.RiscvAdventure.png
      - type: file
        path: io.github.GGalya1.RiscvAdventure.metainfo.xml
