app-id: io.github.killown.flux
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/flux/cargo
    RUST_BACKTRACE: "1"
    PKG_CONFIG_PATH: /app/lib/pkgconfig:/app/lib64/pkgconfig:/app/share/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
    CPATH: /app/include
    LIBRARY_PATH: /app/lib:/app/lib64
    LD_LIBRARY_PATH: /app/lib:/app/lib64

command: flux-fm

finish-args:
  # Display & IPC
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland

  # Network Access
  - --share=network

  # Filesystem access restricted to user data and removable/external media
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  - --filesystem=xdg-run/gvfs

  # GVfs socket access for storage mounts and trash
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd
  - --talk-name=org.gtk.vfs
  - --talk-name=org.gtk.vfs.*

  # System D-Bus for block device / disk management (LUKS, udisksctl mounts)
  - --system-talk-name=org.freedesktop.UDisks2

  # Device access for mount operations
  - --device=all

  # Map host .config/flux straight into the sandbox config path
  - --filesystem=xdg-config/flux

modules:
  # ── poppler (PDF thumbnails) ────────────────────────────────────────────────
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DENABLE_BOOST=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_GLIB=ON
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DENABLE_LIBOPENJPEG=none
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_UNSTABLE_API_ABI_HEADERS=ON
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-24.08.0.tar.xz
        sha256: 97453fbddf0c9a9eafa0ea45ac710d3d49bcf23a62e864585385d3c0b4403174

  # ── vte (embedded terminal) ─────────────────────────────────────────────────
  - name: vte
    buildsystem: meson
    config-opts:
      - -Ddocs=false
      - -Dvapi=false
      - -D_systemd=false
    sources:
      - type: archive
        url: https://gitlab.gnome.org/GNOME/vte/-/archive/0.76.3/vte-0.76.3.tar.gz
        sha256: eb6d80b879914b89c22811743a5d779fa0e9c57acfa925873b521d054b809746

  # ── flux ────────────────────────────────────────────────────────────────────
  - name: flux
    buildsystem: simple
    build-commands:
      - cargo build --release --manifest-path Cargo.toml --offline
      - make install PREFIX=/app
    sources:
      - type: git
        url: https://github.com/killown/flux.git
        commit: 54f2f48b83415ff297d9ea115ceea8f3e6460bfd
      - cargo-sources.json
