app-id: io.github.killown.flux
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/flux/cargo
    RUST_BACKTRACE: "1"
    PKG_CONFIG_PATH: /app/lib/pkgconfig:/app/lib64/pkgconfig:/app/share/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
    CPATH: /app/include

command: flux-fm

finish-args:
  # Display & IPC
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland

  # Network Access
  - --share=network

  # Filesystem access for file manager functionality
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd

  # System D-Bus for block device / disk management (LUKS, udisksctl mounts)
  - --system-talk-name=org.freedesktop.UDisks2

modules:
  # ── poppler (PDF thumbnails) ────────────────────────────────────────────────
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DENABLE_BOOST=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_GLIB=ON
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DENABLE_LIBOPENJPEG=none
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_UNSTABLE_API_ABI_HEADERS=ON
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-24.08.0.tar.xz
        sha256: 97453fbddf0c9a9eafa0ea45ac710d3d49bcf23a62e864585385d3c0b4403174

  # ── vte (embedded terminal) ─────────────────────────────────────────────────
  - name: vte
    buildsystem: meson
    config-opts:
      - -Ddocs=false
      - -Dvapi=false
      - -D_systemd=false
    sources:
      - type: archive
        url: https://gitlab.gnome.org/GNOME/vte/-/archive/0.76.3/vte-0.76.3.tar.gz
        sha256: eb6d80b879914b89c22811743a5d779fa0e9c57acfa925873b521d054b809746

  # ── fish (compiled from source tag 4.9.2) ──────────────────────────────────
  - name: fish
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/fish-shell/fish-shell/archive/refs/tags/4.9.2.tar.gz
        sha256: 13df86468e9a87bfbb5f75dda42800f0aa5c0093511d9e875041e221a4c64be3
      - fish-cargo-sources.json

  # ── Nerd Fonts Symbols ──────────────────────────────────────────────────────
  - name: nerd-fonts-symbols
    buildsystem: simple
    build-commands:
      - install -Dm644 *.ttf -t /app/share/fonts/nerd-fonts/
    sources:
      - type: archive
        url: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/NerdFontsSymbolsOnly.zip
        sha256: fdca3682534f6f65e1ccb2345b0362ccf67d9b8eca7c8025330946e93e2473bc

  # ── flux ────────────────────────────────────────────────────────────────────
  - name: flux
    buildsystem: simple
    build-commands:
      - RUSTFLAGS="-L /app/lib" cargo build --release --manifest-path Cargo.toml --offline
      - make install PREFIX=/app
    sources:
      - type: git
        url: https://github.com/killown/flux.git
        tag: v0.1.6
        commit: 05a2ddb9adc3eebbd0658a30f3539f074d27b70c
      - cargo-sources.json
