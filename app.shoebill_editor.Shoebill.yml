app-id: app.shoebill_editor.Shoebill
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: shoebill
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --device=dri
  - --filesystem=home
modules:
  - name: squashfs-tools
    buildsystem: simple
    build-commands:
      - make -C squashfs-tools -j$FLATPAK_BUILDER_N_JOBS XZ_SUPPORT=1 ZSTD_SUPPORT=1 LZ4_SUPPORT=1 install INSTALL_PREFIX=/app
    sources:
      - type: archive
        url: https://github.com/plougher/squashfs-tools/archive/refs/tags/4.7.5.tar.gz
        sha256: 547b7b7f4d2e44bf91b6fc554664850c69563701deab9fd9cd7e21f694c88ea6

  - name: shoebill
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra -t /app/bin
      - install -Dm755 shoebill -t /app/bin
      - install -Dm644 app.shoebill_editor.Shoebill.desktop -t /app/share/applications
      - install -Dm644 app.shoebill_editor.Shoebill.metainfo.xml -t /app/share/metainfo
      - install -Dm644 app.shoebill_editor.Shoebill.png -t /app/share/icons/hicolor/512x512/apps
    sources:
      - type: extra-data
        filename: shoebill.AppImage
        url: https://shoebill-editor.app/downloads/Shoebill-v0.0.2-x86_64.AppImage
        sha256: a9fc723299f7bf498dd9aa56fa0d1898f498158dc4d1293a2429249cf852ad3b
        size: 40241656
      - type: file
        path: apply_extra
      - type: file
        path: shoebill
      - type: file
        path: app.shoebill_editor.Shoebill.desktop
      - type: file
        path: app.shoebill_editor.Shoebill.metainfo.xml
      - type: file
        path: app.shoebill_editor.Shoebill.png
