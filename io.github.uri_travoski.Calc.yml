app-id: io.github.uri_travoski.Calc
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
sdk-extensions:
- org.freedesktop.Sdk.Extension.rust-stable
command: sam-calc
finish-args:
- --share=ipc
- --socket=fallback-x11
- --socket=wayland
- --device=dri
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/sam-calc/cargo
modules:
- name: sam-calc
  buildsystem: simple
  build-commands:
  - cargo --offline fetch --manifest-path Cargo.toml --locked
  - cargo --offline build --release --locked
  - install -Dm755 target/release/sam-calc /app/bin/sam-calc
  - install -Dm644 data/io.github.uri_travoski.Calc.desktop /app/share/applications/io.github.uri_travoski.Calc.desktop
  - install -Dm644 data/io.github.uri_travoski.Calc.metainfo.xml /app/share/metainfo/io.github.uri_travoski.Calc.metainfo.xml
  - install -Dm644 data/io.github.uri_travoski.Calc.svg /app/share/icons/hicolor/scalable/apps/io.github.uri_travoski.Calc.svg
  - install -Dm644 data/icons/io.github.uri_travoski.Calc-48.png /app/share/icons/hicolor/48x48/apps/io.github.uri_travoski.Calc.png
  - install -Dm644 data/icons/io.github.uri_travoski.Calc-128.png /app/share/icons/hicolor/128x128/apps/io.github.uri_travoski.Calc.png
  - install -Dm644 data/icons/io.github.uri_travoski.Calc-256.png /app/share/icons/hicolor/256x256/apps/io.github.uri_travoski.Calc.png
  - install -Dm644 data/icons/io.github.uri_travoski.Calc-512.png /app/share/icons/hicolor/512x512/apps/io.github.uri_travoski.Calc.png
  sources:
  - type: git
    url: https://github.com/uri-travoski/calculator-sam.git
    tag: v1.5.0
    commit: d8dc5448139e1f1e8fb0c4f3add3d7d5939c2870
    x-checker-data:
      type: git
      tag-pattern: ^v([\d.]+)$
  - cargo-sources.json
