id: io.github.noahkuowithme.Revenger-Pro-4K-Linux
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: revenger-pro-4k
finish-args:
  - --socket=x11
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  #communication
  - --device=all       # Direct access to /dev/hidraw? for mouse configuration
  #Read-only
  - --filesystem=/sys:ro


modules:
  - name: revenger-pro-4k
    buildsystem: simple
    build-commands:
      # 1. 建立 /app/share/revenger-pro-4k 並複製 Python 模組與腳本
      - install -d /app/share/revenger-pro-4k
      - cp -r revengerctl /app/share/revenger-pro-4k/
      - install -Dm755 revenger-pro-4k /app/share/revenger-pro-4k/revenger-pro-4k
      - install -Dm755 revengerctl-cli /app/share/revenger-pro-4k/revengerctl-cli

      # 2. 在 /app/bin 建立軟連結 (Symlink)，供沙盒外部呼叫執行
      - install -d /app/bin
      - ln -s /app/share/revenger-pro-4k/revenger-pro-4k /app/bin/revenger-pro-4k
      - ln -s /app/share/revenger-pro-4k/revengerctl-cli /app/bin/revengerctl-cli

      # 3. 安裝 Desktop 桌面選單檔與 AppStream 元資料
      - install -Dm644 -D io.github.noahkuowithme.Revenger-Pro-4K-Linux.desktop /app/share/applications/io.github.noahkuowithme.Revenger-Pro-4K-Linux.desktop
      - install -Dm644 -D io.github.noahkuowithme.Revenger-Pro-4K-Linux.metainfo.xml /app/share/metainfo/io.github.noahkuowithme.Revenger-Pro-4K-Linux.metainfo.xml

      # 4. 安裝 SVG 應用程式圖示
      - install -Dm644 -D icons/io.github.noahkuowithme.Revenger-Pro-4K-Linux.svg /app/share/icons/hicolor/scalable/apps/io.github.noahkuowithme.Revenger-Pro-4K-Linux.svg

    sources:
      - type: git
        url: https://github.com/noahkuowithme/Revenger-Pro-4K-Linux.git
        commit: c24d848b1e87bcc8e936611377a25cec64e07463
