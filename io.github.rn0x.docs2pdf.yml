app-id: io.github.rn0x.docs2pdf
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: run.sh

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --filesystem=xdg-documents
  - --env=ELECTRON_TRASH=gio

build-options:
  append-path: /usr/lib/sdk/node24/bin
  env:
    XDG_CACHE_HOME: /run/build/docs2pdf/flatpak-node/cache
    npm_config_cache: /run/build/docs2pdf/flatpak-node/npm-cache
    npm_config_nodedir: /usr/lib/sdk/node24

modules:
  - name: docs2pdf
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/rn0x/Docs2PDF.git
        tag: v1.0.0
        commit: 599d5a0

      - generated-sources.json

      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper /app/main/docs2pdf "$@"

    build-commands:
      - npm install --offline
      - npm run build
      - npx electron-builder --linux dir
      - cp -a release/linux-unpacked /app/main
      - install -Dm755 -t /app/bin/ ../run.sh
      - install -Dm644 public/icon.png /app/share/icons/hicolor/512x512/apps/io.github.rn0x.docs2pdf.png
      - install -Dm644 flatpak/io.github.rn0x.docs2pdf.desktop /app/share/applications/io.github.rn0x.docs2pdf.desktop
      - install -Dm644 flatpak/io.github.rn0x.docs2pdf.metainfo.xml /app/share/metainfo/io.github.rn0x.docs2pdf.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/io.github.rn0x.docs2pdf/LICENSE
