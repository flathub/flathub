app-id: com.projectgamers.ProjectG
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '23.08'
command: project-g
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: project-g
    buildsystem: simple
    build-commands:
      - cp -r . /app/project-g
      - install -Dm755 project-g.sh /app/bin/project-g
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/com.projectgamers.ProjectG.png
      - install -Dm644 com.projectgamers.ProjectG.desktop /app/share/applications/com.projectgamers.ProjectG.desktop
      - install -Dm644 com.projectgamers.ProjectG.metainfo.xml /app/share/metainfo/com.projectgamers.ProjectG.metainfo.xml
    sources:
      - type: dir
        path: .
