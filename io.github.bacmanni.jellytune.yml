app-id: io.github.bacmanni.jellytune
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: JellyTune
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet9
  
finish-args:
  - --share=network
  - --device=dri
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  
build-options:
  append-path: /usr/lib/sdk/dotnet9/bin
  append-ld-library-path: /usr/lib/sdk/dotnet9/lib
  prepend-pkg-config-path: /usr/lib/sdk/dotnet9/lib/pkgconfig
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "true"
    
modules:
  - name: jellytune
    buildsystem: simple
    build-options:
      arch:
        aarch64:
          env:
            RUNTIME: linux-arm64
        x86_64:
          env:
            RUNTIME: linux-x64

    sources:
      - type: git
        url: https://github.com/bacmanni/jellytune.git
        commit: 30462be5434b1295e129f4fdc513147d5fef183d
      - gnome-nuget-sources.json
      - shared-nuget-sources.json
      
    build-commands:
      - flathub/install.sh
      
