# This is the Flatpak-builder manifest for Bazecor.
#
# Flatpak Structure:
#
# /app/
# ├── bin/
# │   └── Bazecor   <----- zypak-wrapper script
# ├── share/
# │   ├── applications/
# │   │   └── com.dygma.bazecor.desktop
# │   ├── icons/
# │   │   └── hicolor/512x512/apps/com.dygma.bazecor.png
# │   └── metainfo/
# │       └── com.dygma.bazecor.metainfo.xml
# └── lib/
#     └── com.dygma.bazecor/
#         ├── locales/
#         ├── resources/
#         ├── Bazecor <----- Electron2 app binary (called by zypak-wrapper)
#         ├── ...
#         ├── ...
#         └── ...
#
app-id: com.dygma.bazecor
base-version: "25.08"
base: org.electronjs.Electron2.BaseApp
runtime-version: "25.08"
runtime: org.freedesktop.Platform
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: Bazecor
separate-locales: false
tags:
  - floss

finish-args:
  - --allow=per-app-dev-shm
  - --device=all
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --filesystem=/run/udev:ro
  - --filesystem=~/Dygma
  - --filesystem=host-etc:ro
  - --filesystem=xdg-documents
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland

build-options:
  append-path: /usr/lib/sdk/node24/bin
  env:
    NPM_CONFIG_LOGLEVEL: info

modules:
  - name: eudev
    config-opts:
      - --disable-hwdb
      - --disable-logging
      - --disable-gudev
      - --disable-introspection
      - --disable-keymap
      - --disable-mtd_probe
    cleanup:
      - /include
      - /etc
      - /libexec
      - /sbin
      - /lib/pkgconfig
      - /man
      - /share/aclocal
      - /share/doc
      - /share/gtk-doc
      - /share/man
      - /share/pkgconfig
      - "*.la"
      - "*.a"
    sources:
      - type: git
        url: "https://github.com/eudev-project/eudev"
        tag: "v3.2.14"
        commit: 9e7c4e744b9e7813af9acee64b5e8549ea1fbaa3
  - name: com.dygma.bazecor
    buildsystem: simple
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/com.dygma.bazecor/flatpak-node/cache
        npm_config_cache: /run/build/com.dygma.bazecor/flatpak-node/npm-cache
        npm_config_offline: "true"
        npm_config_nodedir: /run/build/com.dygma.bazecor/flatpak-node/cache/node-gyp/34.2.0
        npm_config_runtime: electron
        npm_config_target: "34.2.0"
    sources:
      - type: archive
        url: "https://github.com/Dygmalab/Bazecor/archive/refs/tags/v1.9.0.tar.gz"
        sha256: "75ced300d2ef4b574706a222838ce5bb160ffb3ba163e7367778407447dcf415"
      - type: patch
        path: patches/forge.config.ts.patch
      - type: script
        dest-filename: Bazecor
        commands:
          - exec zypak-wrapper /app/lib/com.dygma.bazecor/Bazecor "$@"
      - type: file
        url: "https://raw.githubusercontent.com/Dygmalab/Bazecor/refs/tags/v1.9.0/build/com.dygma.bazecor.desktop"
        sha256: "691ecaa50f666071a12d1da3d7cdf6cdf9c0bf46aec0632266e962ea087df4a2"
        dest-filename: com.dygma.bazecor.desktop
      - type: file
        url: "https://raw.githubusercontent.com/Dygmalab/Bazecor/refs/tags/v1.9.0/build/com.dygma.bazecor.metainfo.xml"
        sha256: "ab447877de5616c07a7828f5efb8eedef2f8d1e8ffead91ecff65326b3a2399b"
        dest-filename: com.dygma.bazecor.metainfo.xml
      - type: file
        url: "https://raw.githubusercontent.com/Dygmalab/Bazecor/refs/tags/v1.9.0/build/logo.png"
        sha256: "1cdcc9775937dd5bc8a4262fe0f6d22bd423cbd75f6063723227b8c7674c2a9d"
        dest-filename: com.dygma.bazecor.png
      - type: file
        path: .yarnrc
      - generated-sources.json 
    build-commands:
      - yarn install --frozen-lockfile --offline
      - yarn electron-forge package --platform=linux┴┬╟╞┌▐╟╧╫▀┌┌┌╟┼█╒╒╒╒╘╘╒════╒╒╒╓╓▐▐┬▌▌▌▌┌▄┘╫╫╫╫╫├├▌▌▌
      - mkdir -p ${FLATPAK_DEST}/lib/com.dygma.bazecor
      - cp -r out/Bazecor-linux-x64/* ${FLATPAK_DEST}/lib/com.dygma.bazecor/
      - install -Dm755 Bazecor "${FLATPAK_DEST}/bin/Bazecor"
      - install -Dm644 com.dygma.bazecor.desktop "${FLATPAK_DEST}/share/applications/com.dygma.bazecor.desktop"
      - install -Dm644 com.dygma.bazecor.metainfo.xml "${FLATPAK_DEST}/share/metainfo/com.dygma.bazecor.metainfo.xml"
      - install -Dm644 com.dygma.bazecor.png "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/com.dygma.bazecor.png"
