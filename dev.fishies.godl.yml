id: dev.fishies.godl
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: godl
finish_args:
  - --share=ipc
  - --share=network
  - --device=all
  - --socket=x11
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
cleanup:
  - "/share/kdevappwizard6"
  - "/include"
  - "/lib/cmake"
  - "*.la"
  - "*.a"
modules:
  - name: godl-meta
    buildsystem: simple
    sources:
      - type: file
        path: dev.fishies.godl.metainfo.xml
    build-commands:
      - install -Dm644 dev.fishies.godl.metainfo.xml /app/share/metainfo/dev.fishies.godl.metainfo.xml
  - name: kitemviews-custom
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Debug
      - -DBUILD_TESTING=OFF
      - -DFLATPAK=ON
    sources:
      - type: git
        url: https://invent.kde.org/fishy/kitemviews.git
        commit: 52fe822
  - name: godl
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=MinSizeRel
      - -DBUILD_TESTING=OFF
      - -DFLATPAK=ON
    sources:
      - type: git
        url: https://codeberg.org/fishn/godl.git
        commit: 0137fa5
