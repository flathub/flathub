id: dev.fishies.godl
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: godl
finish_args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
cleanup:
  - "/share/kdevappwizard6"
  - "/include"
  - "/lib/cmake"
  - "*.la"
  - "*.a"
modules:
  - name: godl
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=MinSizeRel
      - -DBUILD_TESTING=OFF
      - -DFLATPAK=ON
    sources:
      - type: git
        url: https://codeberg.org/fishn/godl.git
        commit: ec9bb9963b635a532532a6349d291c770e5fde4e
        tag: v1.4.1
