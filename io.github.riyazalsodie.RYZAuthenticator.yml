app-id: io.github.riyazalsodie.RYZAuthenticator
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: ryz-authenticator
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: ryz-authenticator
    buildsystem: simple
    build-commands:
      - ar x RYZ.Auth_1.1.0_amd64.deb
      - tar -xf data.tar.*
      - cp -r usr/* /app/
      - install -Dm644 io.github.riyazalsodie.RYZAuthenticator.metainfo.xml /app/share/metainfo/io.github.riyazalsodie.RYZAuthenticator.metainfo.xml
    sources:
      - type: file
        url: https://github.com/riyazalsodie/RYZ-Authenticator/releases/download/v1.1.0/RYZ.Auth_1.1.0_amd64.deb
        sha256: fa63bc1f0760c0e04b994956a0d09b1f345a69b6501dfd952417b5c733ba78e9
        only-arches:
          - x86_64
      - type: file
        path: io.github.riyazalsodie.RYZAuthenticator.metainfo.xml
