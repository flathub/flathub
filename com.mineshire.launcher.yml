app-id: com.mineshire.launcher
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: mineshire
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.secrets
modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  - name: mineshire
    buildsystem: simple
    build-commands:
      - ar x mineshire.deb data.tar.gz
      - tar xzf data.tar.gz
      - install -Dm755 usr/bin/mineshire /app/bin/mineshire
      - sed -i "s/^Icon=.*/Icon=com.mineshire.launcher/" usr/share/applications/Mineshire.desktop
      - install -Dm644 usr/share/applications/Mineshire.desktop /app/share/applications/com.mineshire.launcher.desktop
      - install -Dm644 usr/share/metainfo/com.mineshire.launcher.metainfo.xml /app/share/metainfo/com.mineshire.launcher.metainfo.xml
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/mineshire.png /app/share/icons/hicolor/32x32/apps/com.mineshire.launcher.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/mineshire.png /app/share/icons/hicolor/128x128/apps/com.mineshire.launcher.png
      - install -Dm644 "usr/share/icons/hicolor/256x256@2/apps/mineshire.png" /app/share/icons/hicolor/256x256/apps/com.mineshire.launcher.png
    sources:
      - type: file
        dest-filename: mineshire.deb
        url: https://github.com/pozii/mineshire-updates/releases/download/v26.1114.1/Mineshire-linux.deb
        sha256: c91d8233936ccf5ead4b17e8b9c4e927b7248f3331f3ff70e7aeb4e21f7ed085
        only-arches: [x86_64]
      - type: file
        dest-filename: mineshire.deb
        url: https://github.com/pozii/mineshire-updates/releases/download/v26.1114.1/Mineshire-linux-arm64.deb
        sha256: e35aa3ca43b364de2d7c8c70a6c3a458d80d9ea1ba1574ee7b0f77d296f843f0
        only-arches: [aarch64]
