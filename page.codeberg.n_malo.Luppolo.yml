app-id: page.codeberg.n_malo.Luppolo 
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: luppolo
finish-args:
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-run/jack
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
modules:
  - name: luppolo 
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/luppolo/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo build --offline --release --all-features
      - install -Dm0755 target/release/luppolo ${FLATPAK_DEST}/bin/luppolo
      - install -Dm0644 assets/icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm0644 flatpak/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm0644 flatpak/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: git 
        url: https://codeberg.org/n-malo/luppolo.git
        tag: "v0.1.5"
        commit: "d83b9930befcb8d1eb4cab07e16a2defb805dc7c"
      - cargo-sources.json

