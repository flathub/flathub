id: page.codeberg.n_malo.Luppolo
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: luppolo
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

# There is no dedicated "jack" socket type in Flatpak (verified against a
# real build: --socket=jack is rejected outright, valid types are x11,
# wayland, pulseaudio, session-bus, system-bus, fallback-x11, ssh-auth,
# pcsc, cups, gpg-agent, inherit-wayland-socket). On a PipeWire system,
# libjack.so.0 (which org.freedesktop.Platform already ships — PipeWire's
# own JACK-client-API implementation, so no extra extension or bundled
# library is needed) doesn't use a standalone JACK socket file at all: it
# talks to the PipeWire server directly over the regular pipewire-0
# socket, confirmed by watching $XDG_RUNTIME_DIR while a real client was
# connected. Exposing that socket is what actually matters. The
# xdg-run/jack filesystem grant is included too, harmlessly, for the less
# common case of a real standalone jackd (which does create a
# $XDG_RUNTIME_DIR/jack/ directory) instead of PipeWire's JACK layer.
#
# --filesystem=home: a session is a multi-file "project" (one JSON plus one
# WAV per track) that can live anywhere the user picks, similar to a DAW's
# project folder. Confirmed via a real "Operation not permitted" error from
# a test build that the document portal's per-folder grant from a plain
# folder picker does not support creating new files inside a
# freshly-created directory, only reading/writing ones that already
# existed at grant time — so session save/load needs static filesystem
# access instead, the normal fallback for this class of app when the
# portal genuinely can't cover the use case.
finish-args:
  - --filesystem=home
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-run/jack
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/luppolo/cargo
    CARGO_NET_OFFLINE: "true"

modules:
  - name: luppolo
    buildsystem: simple
    build-commands:
      - cargo --offline build --release
      - install -Dm755 target/release/luppolo /app/bin/luppolo
      - install -Dm644 flatpak/page.codeberg.n_malo.Luppolo.desktop /app/share/applications/page.codeberg.n_malo.Luppolo.desktop
      - install -Dm644 flatpak/page.codeberg.n_malo.Luppolo.metainfo.xml /app/share/metainfo/page.codeberg.n_malo.Luppolo.metainfo.xml
      - install -Dm644 assets/icon.png /app/share/icons/hicolor/512x512/apps/page.codeberg.n_malo.Luppolo.png
      - install -Dm644 LICENSE /app/share/licenses/page.codeberg.n_malo.Luppolo/LICENSE
    sources:
      - type: git
        url: https://codeberg.org/n_malo/luppolo.git
        tag: v0.1.2
        commit: d158857d6e7c4f1a706145c6f613eabb8b40a3cf
      - cargo-sources.json
