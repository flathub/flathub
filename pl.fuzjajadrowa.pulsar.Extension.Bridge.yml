id: pl.fuzjajadrowa.pulsar.Extension.Bridge
branch: stable
runtime: pl.fuzjajadrowa.pulsar
runtime-version: stable
sdk: org.gnome.Sdk//50
build-extension: true
separate-locales: false

build-options:
  prefix: /app/lib/pulsar/requirements/bridge
  prepend-path: /app/lib/pulsar/requirements/bridge/bin

modules:
  - name: pulsar-bridge
    buildsystem: simple
    build-commands:
      - python3 -m PyInstaller --clean --onefile --icon icon.png --collect-all yt_dlp_ejs --name pulsar-bridge main.py
      - install -Dm755 dist/pulsar-bridge ${FLATPAK_DEST}/pulsar-bridge
      - install -Dm644 flatpak/pl.fuzjajadrowa.pulsar.Extension.Bridge.metainfo.xml ${FLATPAK_DEST}/share/metainfo/pl.fuzjajadrowa.pulsar.Extension.Bridge.metainfo.xml
      - install -Dm644 flatpak/bridge-version.txt ${FLATPAK_DEST}/bridge-version.txt
    cleanup:
      - /bin
      - /lib/python3*/site-packages
      - /lib/python3*/dist-packages
    modules:
      - bridge-sources.json
    sources:
      - type: git
        url: https://github.com/FuzjaJadrowa/Pulsar-Bridge.git
        commit: 3eb29551cc07955c3d3a5e95ceb1756f7ac1f20a