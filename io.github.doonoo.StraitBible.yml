app-id: io.github.doonoo.StraitBible
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: straitbible

finish-args:
  - --share=ipc
  - --socket=x11
  # pictures for the background, fonts and exported texts
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

modules:
  # Strait Bible uses GTK 2 (through Lazarus), which the runtime does not have
  - shared-modules/gtk2/gtk2.json

  - name: straitbible
    buildsystem: simple
    build-commands:
      - cp -r usr/. /app/
    sources:
      # built from this repository by the "Build" workflow of GitHub Actions (Free Pascal and Lazarus)
      - type: archive
        url: https://github.com/doonoo/straitbible/releases/download/v6.3/straitbible-linux-x86_64.tar.gz
        sha256: 323f334a41e5f1fe8079b6db57b264c1fcc785a4219a7710a2bd1fd660c89e8d
        strip-components: 0
