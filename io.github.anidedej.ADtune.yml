id: io.github.anidedej.ADtune
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm21
command: adtune
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-run/pipewire-0:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm21/bin
  env:
    LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib
    CARGO_HOME: /run/build/adtune/cargo
modules:
  - name: adtune
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo --offline build --release --locked -p adtune-ui -p adtune-pipewire
      - install -Dm755 target/release/adtune-ui /app/bin/adtune
      - install -Dm755 target/release/adtune-service /app/bin/adtune-service
      - install -Dm644 packaging/linux/io.github.anidedej.ADtune.svg
        /app/share/icons/hicolor/scalable/apps/io.github.anidedej.ADtune.svg
      - install -d /app/share/applications
      - sed "s|@BINDIR@|/app/bin|g; s|@ICON@|io.github.anidedej.ADtune|g"
        packaging/linux/adtune.desktop.in >
        /app/share/applications/io.github.anidedej.ADtune.desktop
      - install -d /app/share/metainfo
      - sed "s|@VERSION@|1.0.0|g; s|@DATE@|2026-07-17|g"
        packaging/linux/io.github.anidedej.ADtune.metainfo.xml.in >
        /app/share/metainfo/io.github.anidedej.ADtune.metainfo.xml
    sources:
      - type: git
        url: https://github.com/AniDedej/ADtune.git
        commit: fe4a107fe1b87a2e4792c5e3937f4ea3c4447ab0
      - cargo-sources.json
