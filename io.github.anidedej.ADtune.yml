id: io.github.anidedej.ADtune
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm21
command: adtune
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-run/pipewire-0:ro
  # The freedesktop runtime ships libpipewire but not module-filter-chain,
  # which the calibration daemon loads in-process; we build the modules
  # ourselves and point libpipewire at them.
  - --env=PIPEWIRE_MODULE_DIR=/app/lib/pipewire-0.3
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm21/bin
  env:
    LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib
    CARGO_HOME: /run/build/adtune/cargo
modules:
  # PipeWire client modules only (matching the runtime's 1.4.9): the daemon
  # loads module-filter-chain in-process, and the module dir override means
  # every module libpipewire loads must come from /app. SPA plugins and the
  # daemons still come from the runtime.
  - name: pipewire-modules
    buildsystem: meson
    config-opts:
      - -Dsession-managers=[]
      - -Dspa-plugins=disabled
      - -Dexamples=disabled
      - -Dtests=disabled
      - -Ddocs=disabled
      - -Dman=disabled
      - -Dsystemd=disabled
      - -Dalsa=disabled
      - -Dpipewire-alsa=disabled
      - -Djack=disabled
      - -Dpipewire-jack=disabled
      - -Dv4l2=disabled
      - -Dlibcamera=disabled
      - -Dgstreamer=disabled
      - -Dgstreamer-device-provider=disabled
      - -Dbluez5=disabled
      - -Draop=disabled
      - -Davb=disabled
      - -Dlv2=disabled
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/1.4.9/pipewire-1.4.9.tar.gz
        sha256: 8066a7b220069e4c6e3b02bd2b6ea303bba66df255023c07c99323449ba8fe3c
  - name: adtune
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo --offline build --release --locked -p adtune-ui -p adtune-pipewire
      - install -Dm755 target/release/adtune-ui /app/bin/adtune
      - install -Dm755 target/release/adtune-service /app/bin/adtune-service
      - install -Dm644 packaging/linux/io.github.anidedej.ADtune.svg
        /app/share/icons/hicolor/scalable/apps/io.github.anidedej.ADtune.svg
      - install -d /app/share/applications
      - sed "s|@BINDIR@|/app/bin|g; s|@ICON@|io.github.anidedej.ADtune|g"
        packaging/linux/adtune.desktop.in >
        /app/share/applications/io.github.anidedej.ADtune.desktop
      - install -d /app/share/metainfo
      - sed "s|@VERSION@|1.0.0|g; s|@DATE@|2026-07-17|g"
        packaging/linux/io.github.anidedej.ADtune.metainfo.xml.in >
        /app/share/metainfo/io.github.anidedej.ADtune.metainfo.xml
    sources:
      - type: git
        url: https://github.com/AniDedej/ADtune.git
        commit: fe4a107fe1b87a2e4792c5e3937f4ea3c4447ab0
      - cargo-sources.json
