app-id: io.github.zeravrix.ZERAVRIX-PC
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: zeravrix
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents
  - --env=JAVA_HOME=/app/jre
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh

  - name: zeravrix
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib/zeravrix /app/share/applications /app/share/metainfo /app/share/icons/hicolor/128x128/apps /app/share/icons/hicolor/256x256/apps /app/share/icons/hicolor/512x512/apps
      - cp -r app/* /app/lib/zeravrix/
      - install -m 755 zeravrix-flatpak.sh /app/bin/zeravrix
      - install -m 644 io.github.zeravrix.ZERAVRIX-PC.desktop /app/share/applications/io.github.zeravrix.ZERAVRIX-PC.desktop
      - install -m 644 io.github.zeravrix.ZERAVRIX-PC.metainfo.xml /app/share/metainfo/io.github.zeravrix.ZERAVRIX-PC.metainfo.xml
      - install -m 644 icons/128x128/io.github.zeravrix.ZERAVRIX-PC.png /app/share/icons/hicolor/128x128/apps/io.github.zeravrix.ZERAVRIX-PC.png
      - install -m 644 icons/256x256/io.github.zeravrix.ZERAVRIX-PC.png /app/share/icons/hicolor/256x256/apps/io.github.zeravrix.ZERAVRIX-PC.png
      - install -m 644 icons/512x512/io.github.zeravrix.ZERAVRIX-PC.png /app/share/icons/hicolor/512x512/apps/io.github.zeravrix.ZERAVRIX-PC.png
    sources:
      - type: archive
        url: https://github.com/zeravrix/ZERAVRIX-PC/releases/download/v1.7.2/ZERAVRIX-1.7.2-Linux-Fedora.tar.gz
        sha256: 8989d544c786b00b92c087ba86b91f2963be1a722fe1082fffd2181936974e7e
      - type: file
        path: zeravrix-flatpak.sh
