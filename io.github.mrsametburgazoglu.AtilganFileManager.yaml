app-id: io.github.mrsametburgazoglu.AtilganFileManager
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: atilgan
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --filesystem=home

build-options:
  append-path: /usr/lib/sdk/golang/bin
  env:
    - GOROOT=/usr/lib/sdk/golang
    - GOFLAGS=-mod=vendor
    - GOTOOLCHAIN=local

modules:
  - name: atilgan
    buildsystem: simple
    build-commands:
      - go build -mod=vendor -o atilgan .
      - install -D atilgan /app/bin/atilgan
      - install -D io.github.mrsametburgazoglu.AtilganFileManager.desktop /app/share/applications/io.github.mrsametburgazoglu.AtilganFileManager.desktop
      - install -D io.github.mrsametburgazoglu.AtilganFileManager.metainfo.xml /app/share/metainfo/io.github.mrsametburgazoglu.AtilganFileManager.metainfo.xml
      - install -D atilgan_icon.svg /app/share/icons/hicolor/scalable/apps/io.github.mrsametburgazoglu.AtilganFileManager.svg
    sources:
      - type: git
        url: https://github.com/MrSametBurgazoglu/AtilganFileManager.git
        branch: main
      - go.mod.yml
      - type: file
        path: modules.txt
        dest: vendor
