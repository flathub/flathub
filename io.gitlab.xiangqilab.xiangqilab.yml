id: io.gitlab.xiangqilab.xiangqilab
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

command: xiangqilab

finish-args:
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --filesystem=xdg-download:ro

modules:
  - name: xiangqilab
    buildsystem: simple
    build-commands:
      - cp -r appdir /app/bin/
      - install -D -m 644 io.gitlab.xiangqilab.xiangqilab.desktop /app/share/applications/io.gitlab.xiangqilab.xiangqilab.desktop
      - install -D -m 644 io.gitlab.xiangqilab.xiangqilab.png /app/share/icons/hicolor/256x256/apps/io.gitlab.xiangqilab.xiangqilab.png
    sources:
      - type: dir
        path: .
