app-id: io.github.jhamiryomarriveramendoza.NexusSeeker
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: nexus-launcher.sh

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver
  - --system-talk-name=org.freedesktop.NetworkManager

modules:
  - name: nexus-browser
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/share/applications /app/share/icons/hicolor/256x256/apps /app/share/icons/hicolor/128x128/apps /app/share/icons/hicolor/48x48/apps
      - cp -r opt/nexus-browser/nexus/* /app/bin/
      - cp usr/share/applications/nexus-browser.desktop /app/share/applications/io.github.jhamiryomarriveramendoza.NexusSeeker.desktop
      - sed -i 's|Exec=.*|Exec=nexus-launcher.sh %U|' /app/share/applications/io.github.jhamiryomarriveramendoza.NexusSeeker.desktop
      - sed -i 's|Icon=.*|Icon=io.github.jhamiryomarriveramendoza.NexusSeeker|' /app/share/applications/io.github.jhamiryomarriveramendoza.NexusSeeker.desktop
      - cp usr/share/icons/hicolor/256x256/apps/nexus-browser.png /app/share/icons/hicolor/256x256/apps/io.github.jhamiryomarriveramendoza.NexusSeeker.png
      - cp usr/share/icons/hicolor/128x128/apps/nexus-browser.png /app/share/icons/hicolor/128x128/apps/io.github.jhamiryomarriveramendoza.NexusSeeker.png
      - cp usr/share/icons/hicolor/48x48/apps/nexus-browser.png /app/share/icons/hicolor/48x48/apps/io.github.jhamiryomarriveramendoza.NexusSeeker.png
      - |
        cat > /app/bin/nexus-launcher.sh <<'EOF'
        #!/bin/bash
        # Flatpak's own sandbox (bubblewrap) already provides process/filesystem
        # isolation equivalent to what chrome-sandbox's setuid helper gives on a
        # bare install - and that setuid binary does not function inside a
        # Flatpak sandbox - so, like most Chromium-based Flatpaks, this runs
        # without Chromium's own internal sandbox layer and relies on Flatpak's
        # confinement instead.
        exec /app/bin/chrome --no-sandbox "$@"
        EOF
      - chmod 0755 /app/bin/nexus-launcher.sh
    sources:
      - type: archive
        url: https://github.com/Jhamir2024/nexus-seeker-linux/releases/download/v152.0.7960.0-5/nexus-seeker-linux-v152.0.7960.0-5.tar.zst
        sha256: a0758f0a88737705c08c2a413edd6974dd156973732b9d4a75240ace8c7eb62f
        strip-components: 1