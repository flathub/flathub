app-id: org.seekfast.SeekFast
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: seekfast

finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network

modules:
  - name: seekfast
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/seekfast /app/bin/seekfast
      - mkdir -p /app/opt/seekfast /app/share/icons/hicolor
      - cp -R opt/seekfast/. /app/opt/seekfast/
      - install -Dm644 share/applications/org.seekfast.SeekFast.desktop /app/share/applications/org.seekfast.SeekFast.desktop
      - install -Dm644 share/metainfo/org.seekfast.SeekFast.metainfo.xml /app/share/metainfo/org.seekfast.SeekFast.metainfo.xml
      - cp -R share/icons/hicolor/. /app/share/icons/hicolor/
      - chmod 0755 /app/opt/seekfast/SeekFast /app/opt/seekfast/flatpak-launcher.sh /app/bin/seekfast
    sources:
      - type: archive
        url: https://seekfast.org/files_933/SeekFast_7.4_flathub-source.tar.gz
        sha256: e3dec2debdd38f6dba6b4c56f8272e26bcfa7dd768c774aa762dd859c6ffda91
