# Melodius on Flathub: the released .deb (the same build as the AppImage and .rpm) on the GNOME runtime,
# which provides WebKitGTK 4.1, GStreamer and its codecs. The tray needs libappindicator, which the
# runtime does not have.
id: in.melodius.Melodius
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: melodius-desktop
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Song notifications, the session vault in the keyring, the tray icon.
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  # Media keys and the desktop's player controls (MPRIS), and the single running instance that
  # melodius:// links are handed to.
  - --own-name=org.mpris.MediaPlayer2.melodius
  - --own-name=in.melodius.desktop.SingleInstance
modules:
  - shared-modules/libappindicator/libappindicator-gtk3-12.10.json

  - name: melodius
    buildsystem: simple
    sources:
      - type: file
        url: https://www.melodius.in/downloads/Melodius_1.14.5_amd64.deb
        sha256: f4a3ba890f224d0730b5c6856836bda1bdc5e6ae5fd3bc748873a397f7cf8aae
        dest-filename: melodius.deb
        only-arches: [x86_64]
      - type: file
        path: in.melodius.Melodius.metainfo.xml
    build-commands:
      - ar x melodius.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/melodius-desktop /app/bin/melodius-desktop
      - for size in 32x32 128x128 512x512; do install -Dm644 usr/share/icons/hicolor/$size/apps/melodius-desktop.png
        /app/share/icons/hicolor/$size/apps/in.melodius.Melodius.png; done
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/melodius-desktop.png /app/share/icons/hicolor/256x256@2/apps/in.melodius.Melodius.png
      - sed -e 's/^Icon=.*/Icon=in.melodius.Melodius/' -e 's/^Comment=.*/Comment=Stream music, run Jam sessions and see your listening stats/'
        usr/share/applications/Melodius.desktop > in.melodius.Melodius.desktop
      - install -Dm644 in.melodius.Melodius.desktop /app/share/applications/in.melodius.Melodius.desktop
      - install -Dm644 in.melodius.Melodius.metainfo.xml /app/share/metainfo/in.melodius.Melodius.metainfo.xml
