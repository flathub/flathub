app-id: com.anthropic.Claude
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: claude-desktop
separate-locales: false

finish-args:
  # upstream runs on X11/Xwayland; no wayland socket, matching the official build
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  # Claude Code and Cowork operate on the user's projects
  - --filesystem=home
  # sign-in token storage (libsecret)
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  # tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  # let Claude Code reach host tools via flatpak-spawn --host, like the VS Code flatpak
  - --talk-name=org.freedesktop.Flatpak
  - --env=ELECTRON_TRASH=gio

modules:
  - name: claude-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 claude-desktop.sh /app/bin/claude-desktop
      - |
        for size in 16 32 48 128 256; do
          install -Dm644 icons/${size}.png /app/share/icons/hicolor/${size}x${size}/apps/com.anthropic.Claude.png
        done
      - install -Dm644 com.anthropic.Claude.desktop -t /app/share/applications
      - install -Dm644 com.anthropic.Claude.metainfo.xml -t /app/share/metainfo
    sources:
      - type: extra-data
        filename: claude-desktop.deb
        only-arches: [x86_64]
        url: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_1.18286.2_amd64.deb
        sha256: 56fa5de053e0a68dc7583677857bedcf4219b19d90201400e0237b7d74d512f1
        size: 144629132
        x-checker-data:
          type: debian-repo
          package-name: claude-desktop
          root: https://downloads.claude.ai/claude-desktop/apt/stable
          dist: stable
          component: main
      - type: extra-data
        filename: claude-desktop.deb
        only-arches: [aarch64]
        url: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_1.18286.2_arm64.deb
        sha256: 38c65a1226dccc75a6b2418b9d4c064f4f9dc5331f89608aedd554d87d529ba3
        size: 136837012
        x-checker-data:
          type: debian-repo
          package-name: claude-desktop
          root: https://downloads.claude.ai/claude-desktop/apt/stable
          dist: stable
          component: main
      - type: file
        path: apply_extra.sh
      - type: file
        path: claude-desktop.sh
      - type: file
        path: com.anthropic.Claude.desktop
      - type: file
        path: com.anthropic.Claude.metainfo.xml
      - type: dir
        path: icons
        dest: icons
