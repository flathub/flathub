# metrochile — manifiesto Flathub (compila desde el código). Desarrollado por Javiera Navarrete.
app-id: io.github.navarretenoir.MetroChile
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: metro-chile
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: metrochile
    buildsystem: simple
    build-commands:
      - make -C desktop ROOT=/app/share/metro-chile
      - install -Dm755 desktop/metro-app /app/bin/metro-chile
      - mkdir -p /app/share/metro-chile && cp -r ui /app/share/metro-chile/
      - install -Dm644 linux/io.github.navarretenoir.MetroChile.desktop /app/share/applications/io.github.navarretenoir.MetroChile.desktop
      - install -Dm644 linux/io.github.navarretenoir.MetroChile.metainfo.xml /app/share/metainfo/io.github.navarretenoir.MetroChile.metainfo.xml
      - install -Dm644 linux/io.github.navarretenoir.MetroChile.svg /app/share/icons/hicolor/scalable/apps/io.github.navarretenoir.MetroChile.svg
    sources:
      - type: git
        url: https://github.com/navarretenoir/metrochile.git
        tag: v2.1.1
        commit: 4d96ed2f5486d7cb48bc91307f7242ae994cc70b
