app-id: io.github.yphil_dev.president_racer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: president-gp

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --device=input

modules:
  - name: president-gp
    buildsystem: simple
    build-commands:
      - install -Dm755 president-gp.x86_64 /app/bin/president-gp
      - install -Dm644 president-gp.pck /app/bin/president-gp.pck
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/io.github.yphil_dev.president_racer.png
      - install -Dm644 io.github.yphil_dev.president_racer.desktop /app/share/applications/io.github.yphil_dev.president_racer.desktop
      - install -Dm644 io.github.yphil_dev.president_racer.metainfo.xml /app/share/metainfo/io.github.yphil_dev.president_racer.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/${FLATPAK_ID}/LICENSE
    sources:
      - type: archive
        url: https://github.com/yphil-dev/president_racer/releases/download/1.4.5/president-gp-linux.zip
        sha256: 52ca7c0a4e5981524815c31620c312084544685f1925c3f54a04fa54ffbdbffe
      - type: file
        url: https://raw.githubusercontent.com/yphil-dev/president_racer/1.4.5/flatpak/io.github.yphil_dev.president_racer.desktop
        sha256: 804cae8b95c19b8b79f353fb5bc9084eef8d42ce3b6566ac1838dfa93d0fe820
      - type: file
        url: https://raw.githubusercontent.com/yphil-dev/president_racer/1.4.5/flatpak/io.github.yphil_dev.president_racer.metainfo.xml
        sha256: 1008980dbaefc2a8b197855fa452f929b3cde996423256862d55fbc2ae8b7c02
      - type: file
        path: LICENSE
