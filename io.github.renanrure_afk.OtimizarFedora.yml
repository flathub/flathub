app-id: io.github.renanrure_afk.OtimizarFedora
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: otimizar-fedora

finish-args:
  # Janela gráfica
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # ATENÇÃO: permissão de escape da sandbox.
  # Necessária porque o app executa dnf, fwupdmgr, fstrim
  # e pkexec diretamente no sistema host via flatpak-spawn.
  # É o ponto mais sensível na revisão do Flathub.
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: otimizar-fedora
    buildsystem: simple
    build-commands:
      # Código-fonte
      - install -Dm755 src/otimizar_fedora.py /app/share/otimizar-fedora/otimizar_fedora.py
      - install -Dm755 src/manutencao_helper.sh /app/share/otimizar-fedora/manutencao_helper.sh
      # Launcher
      - install -Dm755 otimizar-fedora.sh /app/bin/otimizar-fedora
      # Desktop entry
      - install -Dm644 io.github.renanrure_afk.OtimizarFedora.desktop /app/share/applications/io.github.renanrure_afk.OtimizarFedora.desktop
      # Metainfo (AppStream)
      - install -Dm644 io.github.renanrure_afk.OtimizarFedora.metainfo.xml /app/share/metainfo/io.github.renanrure_afk.OtimizarFedora.metainfo.xml
      # Ícones
      - install -Dm644 icons/icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.renanrure_afk.OtimizarFedora.png
      - install -Dm644 icons/icon-128.png /app/share/icons/hicolor/128x128/apps/io.github.renanrure_afk.OtimizarFedora.png
      - install -Dm644 icons/icon-64.png /app/share/icons/hicolor/64x64/apps/io.github.renanrure_afk.OtimizarFedora.png
    sources:
      - type: git
        url: https://github.com/renanrure-afk/OtimizarFedora.git
        tag: v1.0.0
        commit: 33f8110ca279e3a301afd2a8e7936241713443c2
