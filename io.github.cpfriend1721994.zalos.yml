id: io.github.cpfriend1721994.zalos
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: zalos
rename-desktop-file: zalos.desktop
rename-icon: zalos

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --share=network
  - --socket=pulseaudio
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-download

modules:
  - name: openh264
    no-autogen: true
    make-install-args:
      - PREFIX=/app
    sources:
      - type: archive
        url: https://github.com/cisco/openh264/archive/refs/tags/v2.6.0.tar.gz
        sha256: 558544ad358283a7ab2930d69a9ceddf913f4a51ee9bf1bfb9e377322af81a69

  - name: zalos
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DZALOS_QML_AOT=OFF
    post-install:
      - sed -i 's|<launchable type="desktop-id">zalos.desktop</launchable>|<launchable type="desktop-id">io.github.cpfriend1721994.zalos.desktop</launchable>|' /app/share/metainfo/io.github.cpfriend1721994.zalos.metainfo.xml
    sources:
      - type: git
        url: https://github.com/cpfriend1721994/zalos.git
        tag: v1.2.6
        commit: fed2e05065963886aa0a9e201167c2d8208d0fcb
