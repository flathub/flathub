# Flatpak manifest for Flathub. The source is private, so this packages the
# finished Linux build (the tarball tool/package_linux.sh makes) from the public
# releases repository KrakenDiveworksLLC/divecheck-linux. On each release, update
# the tarball url and sha256 below and the <release> in the metainfo.
#
# The app was built on Ubuntu 22.04 and links against GTK 3, libsecret and
# libjsoncpp.so.25: the GNOME runtime carries the first two, and jsoncpp 1.9.5
# (the release with that soname) is built here.
id: com.krakendiveworks.divecheck
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: divecheck

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Sign-in, subscription check, cloud backup, weather and hospital lookups.
  - --share=network
  # Sign-in tokens go to the desktop keyring (GNOME Keyring, KWallet).
  - --talk-name=org.freedesktop.secrets

modules:
  - name: jsoncpp
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - -Dtests=false
    sources:
      - type: archive
        url: https://github.com/open-source-parsers/jsoncpp/archive/refs/tags/1.9.5.tar.gz
        sha256: f409856e5920c18d0c2fb85276e24ee607d2a09b5e7d5f0a371368903c275da2
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake

  - name: divecheck
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/divecheck /app/bin
      - cp -R app/. /app/lib/divecheck/
      - ln -s /app/lib/divecheck/divecheck /app/bin/divecheck
      - install -Dm644 com.krakendiveworks.divecheck.desktop /app/share/applications/com.krakendiveworks.divecheck.desktop
      - install -Dm644 com.krakendiveworks.divecheck.metainfo.xml /app/share/metainfo/com.krakendiveworks.divecheck.metainfo.xml
      - install -Dm644 divecheck.png /app/share/icons/hicolor/512x512/apps/com.krakendiveworks.divecheck.png
    sources:
      - type: archive
        url: https://github.com/KrakenDiveworksLLC/divecheck-linux/releases/download/v1.0.1/divecheck-linux-x64.tar.gz
        sha256: 04064cd755d4511b8c1a744ff8c55732ca44136e0ca17d7e64256b5eecc3f207
        only-arches:
          - x86_64
      - type: file
        path: com.krakendiveworks.divecheck.desktop
      - type: file
        path: com.krakendiveworks.divecheck.metainfo.xml
