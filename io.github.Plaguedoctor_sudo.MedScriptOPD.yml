app-id: io.github.Plaguedoctor_sudo.MedScriptOPD
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20

command: medscript-opd

finish-args:
  # Network access for local server and optional LAN clinic tablet access
  - --share=network
  - --share=ipc
  # Display servers
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=x11
  # Portal access for file open/save dialogs (PDF printouts, CSV exports, DB backups)
  - --talk-name=org.freedesktop.portal.Desktop
  - --filesystem=xdg-documents:create
  - --filesystem=xdg-download:create

build-options:
  append-path: /usr/lib/sdk/node20/bin
  env:
    NPM_CONFIG_LOGLEVEL: info

modules:
  - name: medscript-opd
    buildsystem: simple
    build-commands:
      # Install app directory in /app/lib/medscript-opd
      - mkdir -p /app/lib/medscript-opd
      - cp -r * /app/lib/medscript-opd/
      - cd /app/lib/medscript-opd && npm install --omit=dev

      # Install launcher binary
      - install -Dm755 medscript-opd-runner.sh /app/bin/medscript-opd

      # Install Freedesktop desktop file, AppStream metainfo, and icon
      - install -Dm644 io.github.Plaguedoctor_sudo.MedScriptOPD.desktop /app/share/applications/io.github.Plaguedoctor_sudo.MedScriptOPD.desktop
      - install -Dm644 io.github.Plaguedoctor_sudo.MedScriptOPD.metainfo.xml /app/share/metainfo/io.github.Plaguedoctor_sudo.MedScriptOPD.metainfo.xml
      - install -Dm644 io.github.Plaguedoctor_sudo.MedScriptOPD.svg /app/share/icons/hicolor/scalable/apps/io.github.Plaguedoctor_sudo.MedScriptOPD.svg

    sources:
      - type: archive
        url: https://github.com/Plaguedoctor-sudo/medscript-opd/releases/download/v1.0.0/medscript-opd-v1.0.0-linux.tar.gz
        sha256: db9f6cf32c81fc078fc99dc254615acb65a01a01e98fe2a32bf9a499ff4e03ec
      - type: file
        path: medscript-opd-runner.sh
      - type: file
        path: io.github.Plaguedoctor_sudo.MedScriptOPD.desktop
      - type: file
        path: io.github.Plaguedoctor_sudo.MedScriptOPD.metainfo.xml
      - type: file
        path: io.github.Plaguedoctor_sudo.MedScriptOPD.svg
