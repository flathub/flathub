app-id: com.cacaoapps.CacaoFacturador
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: cacao-facturador-ec

finish-args:
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=home

modules:
  - name: cacao-facturador-ec
    buildsystem: simple
    build-commands:
      - install -Dm755 cacao-facturador-ec /app/bin/cacao-facturador-ec
    sources:
      - type: file
        url: https://github.com/Larevalot/cacao-facturador-ec/releases/download/v1.0.0/cacaofacturador-ec_1.0.0_amd64.AppImage
        dest-filename: cacao-facturador-ec
