app-id: app.restorm.Restorm
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: restorm
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=dri
  # Projects are plain .restorm files the user opens/saves anywhere on disk
  # (plus git worktrees next to them), so the app needs real filesystem access.
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets

modules:
  - name: restorm
    buildsystem: simple
    build-commands:
      - install -Dm755 restorm.sh /app/bin/restorm
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm644 app.restorm.Restorm.desktop -t /app/share/applications
      - install -Dm644 app.restorm.Restorm.metainfo.xml -t /app/share/metainfo
      - install -Dm644 app.restorm.Restorm.mime.xml /app/share/mime/packages/app.restorm.Restorm.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/app.restorm.Restorm.png
    sources:
      - type: file
        path: restorm.sh
      - type: file
        path: apply_extra
      - type: file
        path: app.restorm.Restorm.desktop
      - type: file
        path: app.restorm.Restorm.metainfo.xml
      - type: file
        path: app.restorm.Restorm.mime.xml
      - type: file
        path: icon-512.png
      - type: extra-data
        filename: restorm.deb
        url: https://dl.restorm.app/v1.0.0/restorm_1.0.0_amd64.deb
        sha256: d0a302316b82aade50eb8545b5ec5a29a3d6f12221dfdaf4e42f43de37bd0e95
        size: 306759232
        x-checker-data:
          type: html
          url: https://dl.restorm.app/latest-linux.yml
          version-pattern: 'version:\s*([\d.]+)'
          url-template: https://dl.restorm.app/v$version/restorm_${version}_amd64.deb
