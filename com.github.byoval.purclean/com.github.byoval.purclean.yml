app-id: com.github.byoval.purclean
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: purclean
appstream-compose: false

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.Flatpak
  - --system-talk-name=org.freedesktop.PolicyKit1
  - --filesystem=home
  - --filesystem=/var/cache/dnf:ro
  - --filesystem=/var/snap:ro
  - --filesystem=/var/tmp/flatpak-cache:ro
  - --filesystem=/var/log:ro
  - --env=GSETTINGS_SCHEMA_DIR=/app/share/glib-2.0/schemas

modules:
  - name: purclean
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - -Db_lto=true
    sources:
      - type: archive
        url: https://github.com/byoval/purclean/archive/refs/tags/v0.1.0.tar.gz
        sha256: bddcfe0898a2df9fe9df1639d3752fee5e1535d22c5f732c30d043effc75bb41
    post-install:
      - glib-compile-schemas /app/share/glib-2.0/schemas