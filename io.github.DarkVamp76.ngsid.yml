app-id: io.github.DarkVamp76.ngsid
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ngSid
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=xdg-music:ro
modules:
  - name: ngsid
    buildsystem: simple
    build-commands:
      - make VERSION=0.7.0 -j$FLATPAK_BUILDER_N_JOBS
      - install -Dm755 ngSid /app/bin/ngSid
      - sed 's/^Icon=ngsid/Icon=io.github.DarkVamp76.ngsid/; s/^StartupWMClass=.*/StartupWMClass=ngSid/' packaging/ngsid.desktop > io.github.DarkVamp76.ngsid.desktop
      - install -Dm644 io.github.DarkVamp76.ngsid.desktop /app/share/applications/io.github.DarkVamp76.ngsid.desktop
      - install -Dm644 packaging/ngsid.svg /app/share/icons/hicolor/scalable/apps/io.github.DarkVamp76.ngsid.svg
      - for n in 32 48 64 128 256 512; do install -Dm644 packaging/icons/ngsid-$n.png /app/share/icons/hicolor/${n}x${n}/apps/io.github.DarkVamp76.ngsid.png; done
      - install -Dm644 io.github.DarkVamp76.ngsid.metainfo.xml /app/share/metainfo/io.github.DarkVamp76.ngsid.metainfo.xml
    sources:
      - type: git
        url: https://github.com/DarkVamp76/ngsid.git
        tag: v0.7.0
        commit: 0d39c818293362c370ff6cdcdd0d9c9e498f0a50
      - type: file
        url: https://github.com/libsidplayfp/libsidplayfp/releases/download/v2.16.1/libsidplayfp-2.16.1.tar.gz
        sha256: ace0f73c2ef8645ab069ce1b298b10e31e36af7b5996109983b2b67ad60ff3ca
        dest: third_party
      - type: file
        path: io.github.DarkVamp76.ngsid.metainfo.xml
