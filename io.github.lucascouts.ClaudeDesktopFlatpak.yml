app-id: io.github.lucascouts.ClaudeDesktopFlatpak
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: claude-desktop
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  # notifications via libnotify
  - --talk-name=org.freedesktop.Notifications
  # credential storage via libsecret/keyring
  - --talk-name=org.freedesktop.secrets
  # Claude Code sessions and local MCP servers operate on the user's projects
  - --filesystem=home
  # spawn local MCP servers on the host: flatpak-spawn --host npx ...
  - --talk-name=org.freedesktop.Flatpak
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto

modules:
  - name: claude-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 claude-desktop.sh /app/bin/claude-desktop
      - install -Dm644 io.github.lucascouts.ClaudeDesktopFlatpak.desktop -t /app/share/applications
      - install -Dm644 io.github.lucascouts.ClaudeDesktopFlatpak.metainfo.xml -t /app/share/metainfo
      - for s in 16 32 48 128 256; do install -Dm644 icons/io.github.lucascouts.ClaudeDesktopFlatpak-${s}.png
        /app/share/icons/hicolor/${s}x${s}/apps/io.github.lucascouts.ClaudeDesktopFlatpak.png; done
    sources:
      # Anthropic does not permit redistribution of the app binary, so it is
      # downloaded from the official release server at install time.
      - type: extra-data
        filename: claude.deb
        only-arches: [x86_64]
        url: https://downloads.claude.ai/releases/linux/x64/1.20186.0/Claude-d7731e7f42fb72db87a6488ad8c1357b1cf971f7.deb
        sha256: 956fc080383edabfc6e657df1eb974448613e787eb40d8d10977e1995029288a
        size: 165218668
        x-checker-data:
          type: json
          url: https://claude.ai/api/desktop/linux/x64/deb/latest
          version-query: .version
          url-query: .url
      - type: extra-data
        filename: claude.deb
        only-arches: [aarch64]
        url: https://downloads.claude.ai/releases/linux/arm64/1.20186.0/Claude-d7731e7f42fb72db87a6488ad8c1357b1cf971f7.deb
        sha256: f0fc4aa1f065c5f918093a4190275959a744278ddce02ed46366f81acb1bef96
        size: 157679288
        x-checker-data:
          type: json
          url: https://claude.ai/api/desktop/linux/arm64/deb/latest
          version-query: .version
          url-query: .url
      - type: file
        path: apply_extra.sh
      - type: file
        path: claude-desktop.sh
      - type: file
        path: io.github.lucascouts.ClaudeDesktopFlatpak.desktop
      - type: file
        path: io.github.lucascouts.ClaudeDesktopFlatpak.metainfo.xml
      - type: dir
        path: icons
        dest: icons
