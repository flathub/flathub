app-id: org._02engine._02Engine
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: 02engine-desktop
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
build-options:
  append-path: /usr/lib/sdk/node24/bin
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # For webcam and microphone access.
  - --device=all
  # For importing costumes, sounds, sprites, or list contents using drag and drop.
  # Can remove when https://github.com/electron/electron/issues/30650 fixed.
  # Need read-write access as users can also store projects in these places.
  # We don't want to use --filesystem=home so instead we're listing the most likely
  # places for people to drop files from.
  - --filesystem=xdg-download
  - --filesystem=xdg-desktop
  - --filesystem=xdg-pictures
  - --filesystem=xdg-music
  # For Discord Rich Presence.
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
modules:
  - name: 02Engine
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/02Engine/desktop.git
        commit: 82da7e3e0c3cd6882b17a5d9bbdf2d28e984a0a0
      - type: file
        dest-filename: 02engine-desktop.sh
        path: 02engine-desktop.sh
      
      - type: file
        url: https://github.com/electron/electron/releases/download/v40.9.3/electron-v40.9.3-linux-x64.zip
        sha256: 2b5e33327bd5e180b3c1c0ec429fa06769ee96c0f956a35471b9409b51f45ada
        dest: flatpak-electron
        dest-filename: electron-v40.9.3-linux-x64.zip
        only-arches: [x86_64]
      - type: file
        url: https://github.com/electron/electron/releases/download/v40.9.3/electron-v40.9.3-linux-arm64.zip
        sha256: 5b73273177e96ebd6005b7020f84c085c4a531b1701db03c1963b2ac2c1ea551
        dest: flatpak-electron
        dest-filename: electron-v40.9.3-linux-arm64.zip
        only-arches: [aarch64]

      - type: file
        url: https://packagerdata.turbowarp.org/scratch-microbit-1.2.0.hex.zip
        sha256: dfd574b709307fe76c44dbb6b0ac8942e7908f4d5c18359fae25fbda3c9f4399
        dest: microbit
        dest-filename: hex.zip

      - node-sources.json
      - library-sources.json
      - packager-sources.json
      - extensions-sources.json
    build-commands:
      # Finish setting up Node.js dependencies.
      - ./flatpak-node/finish.sh
      # Compress library files
      - |
        brotli -v flatpak-uncompressed-library-files/*
        mkdir -pv dist-library-files
        mv -v flatpak-uncompressed-library-files/*.br dist-library-files
      # Extract microbit
      - |
        cd microbit
        unzip hex.zip
        mkdir -pv ../node_modules/scratch-gui/static
        mv -v *.hex ../node_modules/scratch-gui/static/microbit.hex
        mkdir -pv ../node_modules/scratch-gui/src/generated
        echo "module.exports = require('./../../static/microbit.hex');" | tee ../node_modules/scratch-gui/src/generated/microbit-hex-url.cjs
      # Build extensions
      - node scripts/prepare-extensions.mjs
      # Build editor
      - NODE_ENV=production node node_modules/webpack/bin/webpack.js
      # Package Electron
      - |
        echo "FLATPAK_ARCH: $FLATPAK_ARCH"
        if [[ "$FLATPAK_ARCH" == "x86_64" ]]; then
          ARCH_ARGS=--x64
        elif [[ "$FLATPAK_ARCH" == "aarch64" ]]; then
          ARCH_ARGS=--arm64
        else
          echo "Unknown arch."
          exit 1
        fi
        export ELECTRON_CACHE=flatpak-electron
        node node_modules/electron-builder/cli.js $ARCH_ARGS --linux --dir --publish never --config.extraMetadata.tw_dist="prod-flathub-$FLATPAK_ARCH"
      - cp -av dist/linux*unpacked /app/02engine
      - install -Dm755 02engine-desktop.sh /app/bin/02engine-desktop
      - |
        install -Dm644 art/icon.png /app/share/icons/hicolor/512x512/apps/org._02engine._02Engine.png
        install -Dm644 linux-files/org._02engine._02Engine.desktop /app/share/applications/org._02engine._02Engine.desktop
        install -Dm644 linux-files/org._02engine._02Engine.mime.xml /app/share/mime/packages/org._02engine._02Engine.mime.xml
        install -Dm644 linux-files/org._02engine._02Engine.metainfo.xml /app/share/metainfo/org._02engine._02Engine.metainfo.xml