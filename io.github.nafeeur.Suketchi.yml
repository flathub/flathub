app-id: io.github.nafeeur.Suketchi
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: suketchi
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
modules:
  - suketchi-deps.yaml

  - name: suketchi
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation suketchi-0.1.2-py3-none-any.whl
      - install -Dm644 io.github.nafeeur.Suketchi.desktop /app/share/applications/io.github.nafeeur.Suketchi.desktop
      - install -Dm644 io.github.nafeeur.Suketchi.metainfo.xml /app/share/metainfo/io.github.nafeeur.Suketchi.metainfo.xml
      - install -Dm644 io.github.nafeeur.Suketchi.png /app/share/icons/hicolor/256x256/apps/io.github.nafeeur.Suketchi.png
      - install -Dm644 io.github.nafeeur.Suketchi.svg /app/share/icons/hicolor/scalable/apps/io.github.nafeeur.Suketchi.svg
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/88/32/62b86d83a00df065646be6dc970701667570944b6927e306ad10e1c3550e/suketchi-0.1.2-py3-none-any.whl
        sha256: 12b2e51d94ae7ff6cc8727ba428c3c1eb3e16dcbfdb0e5a587b4391fcfde626c
        x-checker-data:
          type: pypi
          project-name: suketchi
      - type: file
        path: io.github.nafeeur.Suketchi.desktop
      - type: file
        path: io.github.nafeeur.Suketchi.metainfo.xml
      - type: file
        path: io.github.nafeeur.Suketchi.png
      - type: file
        path: io.github.nafeeur.Suketchi.svg
