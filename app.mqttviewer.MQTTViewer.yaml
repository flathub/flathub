app-id: app.mqttviewer.MQTTViewer
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: mqtt-viewer

finish-args:
  # MQTT broker connections
  - --share=network
  - --share=ipc
  # Rendering
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Export and import: access to the usual user-writable locations. The
  # GTK file chooser also routes through the desktop portal for anywhere
  # else, so broad home access is not needed.
  - --filesystem=xdg-download
  - --filesystem=xdg-documents

modules:
  - name: mqtt-viewer
    buildsystem: simple
    build-commands:
      - install -Dm755 mqtt-viewer /app/bin/mqtt-viewer
      - install -Dm644 app.mqttviewer.MQTTViewer.desktop /app/share/applications/app.mqttviewer.MQTTViewer.desktop
      - install -Dm644 app.mqttviewer.MQTTViewer.png /app/share/icons/hicolor/512x512/apps/app.mqttviewer.MQTTViewer.png
      - install -Dm644 app.mqttviewer.MQTTViewer.metainfo.xml /app/share/metainfo/app.mqttviewer.MQTTViewer.metainfo.xml
    sources:
      - type: archive
        only-arches: [x86_64]
        strip-components: 0
        url: https://github.com/mqtt-viewer/mqtt-viewer/releases/download/v1.0.0/MQTT_Viewer_v1.0.0_linux_amd64.zip
        sha256: 732aff765790e781344c967a4ea9ec91e39a0e2578c915b5cd3c3efa780af889
        x-checker-data:
          type: json
          url: https://api.github.com/repos/mqtt-viewer/mqtt-viewer/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '.assets[] | select(.name | test("linux_amd64\\.zip$")) | .browser_download_url'
      - type: archive
        only-arches: [aarch64]
        strip-components: 0
        url: https://github.com/mqtt-viewer/mqtt-viewer/releases/download/v1.0.0/MQTT_Viewer_v1.0.0_linux_arm64.zip
        sha256: 7e474d08bdcf19eaacafa9686e46fad772147764bc2fe92a0d0746515cff0d14
        x-checker-data:
          type: json
          url: https://api.github.com/repos/mqtt-viewer/mqtt-viewer/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '.assets[] | select(.name | test("linux_arm64\\.zip$")) | .browser_download_url'
      - type: file
        path: app.mqttviewer.MQTTViewer.desktop
      - type: file
        path: app.mqttviewer.MQTTViewer.png
      - type: file
        path: app.mqttviewer.MQTTViewer.metainfo.xml
