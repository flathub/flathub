app-id: io.github.monzer15.YallaVideo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: yalla-video
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-videos
  - --filesystem=xdg-music
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=TMPDIR=/var/tmp

modules:
  - name: yalla-video
    buildsystem: simple
    build-commands:
      # Unpack the upstream .deb (ar archive containing data.tar.*).
      - ar -x yalla-video_1.1.2_amd64.deb
      - tar -xf data.tar.* -C .
      # Move the Electron payload into /app and drop the (unused) setuid sandbox helper.
      - install -d "${FLATPAK_DEST}/yalla-video"
      - cp -a "opt/Yalla Video/." "${FLATPAK_DEST}/yalla-video/"
      - rm -f "${FLATPAK_DEST}/yalla-video/chrome-sandbox"
      # Wrapper script that launches the Electron binary under zypak (from the Electron BaseApp).
      - install -Dm755 yalla-video.sh "${FLATPAK_DEST}/bin/yalla-video"
      # Standard desktop integration.
      - install -Dm644 io.github.monzer15.YallaVideo.desktop "${FLATPAK_DEST}/share/applications/io.github.monzer15.YallaVideo.desktop"
      - install -Dm644 io.github.monzer15.YallaVideo.metainfo.xml "${FLATPAK_DEST}/share/metainfo/io.github.monzer15.YallaVideo.metainfo.xml"
      - install -Dm644 io.github.monzer15.YallaVideo.png "${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.monzer15.YallaVideo.png"
      - install -Dm644 io.github.monzer15.YallaVideo-512.png "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.monzer15.YallaVideo.png"
      # Flathub requires the project license at this path.
      - install -Dm644 LICENSE "${FLATPAK_DEST}/share/licenses/io.github.monzer15.YallaVideo/LICENSE"
    sources:
      - type: file
        url: https://github.com/monzer15/yalla-video-releases/releases/download/v1.1.2/yalla-video_1.1.2_amd64.deb
        sha256: da612fe24a3506ea9dbb7c4ac73bf176e1d8513b4605874ee096cb8fd2b7c4c2
        only-arches:
          - x86_64

      - type: script
        dest-filename: yalla-video.sh
        commands:
          - exec zypak-wrapper "/app/yalla-video/yalla-video" --ozone-platform-hint=auto "$@"

      - type: file
        path: io.github.monzer15.YallaVideo.desktop
      - type: file
        path: io.github.monzer15.YallaVideo.metainfo.xml
      - type: file
        path: io.github.monzer15.YallaVideo.png
      - type: file
        path: io.github.monzer15.YallaVideo-512.png

      - type: inline
        dest-filename: LICENSE
        contents: |
          MIT License

          Copyright (c) 2026 Monzer Osman

