id: dev.nucleusframework.Lab
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: nucleus-lab
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: nucleus-lab
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/nucleus-lab /app/bin
      - cp -a app/. /app/lib/nucleus-lab/
      - ln -s /app/lib/nucleus-lab/nucleus-lab /app/bin/nucleus-lab
      - install -Dm644 dev.nucleusframework.Lab.desktop -t /app/share/applications
      - install -Dm644 dev.nucleusframework.Lab.metainfo.xml -t /app/share/metainfo
      - install -Dm644 dev.nucleusframework.Lab.png /app/share/icons/hicolor/512x512/apps/dev.nucleusframework.Lab.png
      - install -Dm644 dev.nucleusframework.Lab.mime.xml /app/share/mime/packages/dev.nucleusframework.Lab.xml
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/NucleusFramework/Nucleus/releases/download/v3.0.0-dev-202611011507/nucleus-lab-3.0.0-dev-202611011507-linux-x64.tar.gz
        sha256: 73f92e921c676271ad221a296790ff204796471c096a92a2bd2bcdf4295bb079
        dest: app
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/NucleusFramework/Nucleus/releases/download/v3.0.0-dev-202611011507/nucleus-lab-3.0.0-dev-202611011507-linux-arm64.tar.gz
        sha256: d50c86ab1f6bfd7386bf53781230f9c69b827657b770b264b29ca682c47740be
        dest: app
      - type: file
        path: dev.nucleusframework.Lab.desktop
      - type: file
        path: dev.nucleusframework.Lab.metainfo.xml
      - type: file
        path: dev.nucleusframework.Lab.png
      - type: file
        path: dev.nucleusframework.Lab.mime.xml
