id: dev.nucleusframework.Lab
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: nucleus-lab
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: nucleus-lab
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/nucleus-lab /app/bin /app/share
      - cp -a app/. /app/lib/nucleus-lab/
      - ln -s /app/lib/nucleus-lab/nucleus-lab /app/bin/nucleus-lab
      - cp -a /app/lib/nucleus-lab/share/. /app/share/
      - rm -r /app/lib/nucleus-lab/share
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/NucleusFramework/Nucleus/releases/download/v3.0.0-dev-202611061347/nucleus-lab-3.0.0-dev-202611061347-linux-x64.tar.gz
        sha256: 682832a078af7cbd361e61109859dffd25f6a2cfa97722ef7c9bc986d80d46c2
        dest: app
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/NucleusFramework/Nucleus/releases/download/v3.0.0-dev-202611061347/nucleus-lab-3.0.0-dev-202611061347-linux-arm64.tar.gz
        sha256: fd32621f6e57cead138e1c6a9321e7f0b1e6d77439e3ee36037f19ae831119aa
        dest: app
