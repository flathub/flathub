app-id: fr.ffhandball.fdme
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: fdme
finish-args:
  # Required for X11 shared memory (MIT-SHM)
  - --share=ipc
  # X11 fallback for non-Wayland environments
  - --socket=fallback-x11
  - --socket=wayland
  # FFHandball API sync and Sentry crash reporting
  - --share=network
  # GPU hardware acceleration for Flutter rendering (DRI/DRM)
  - --device=dri
  # connectivity_plus plugin: detect network availability via NetworkManager
  - --system-talk-name=org.freedesktop.NetworkManager
modules:
  - name: fdme
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - mkdir -p /app/fdme
      - cp -r lib /app/fdme/lib
      - cp -r data /app/fdme/data
      - install -Dm755 fdme /app/fdme/fdme
      - install -Dm755 fdme.sh /app/bin/fdme
      - install -Dm644 fr.ffhandball.fdme.desktop /app/share/applications/fr.ffhandball.fdme.desktop
      - install -Dm644 fr.ffhandball.fdme.metainfo.xml /app/share/metainfo/fr.ffhandball.fdme.metainfo.xml
      - install -Dm644 fr.ffhandball.fdme.png /app/share/icons/hicolor/256x256/apps/fr.ffhandball.fdme.png
    sources:
      - type: archive
        url: https://install.fdme.ffhandball.fr/FDME_Linux_1.0.60.zip
        sha256: 5534d48369a65fe597e3a83a1b3348c2bb197a79a6a6b29c8b51331b99204a55
        strip-components: 0
      - type: script
        dest-filename: fdme.sh
        commands:
          - export LD_LIBRARY_PATH=/app/fdme/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          - exec /app/fdme/fdme "$@"
