app-id: io.github.Zerocool66612.macaque-dock
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: macaque-dock

finish-args:
  - --talk-name=org.freedesktop.FileManager1
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --env=QT_QPA_PLATFORM=wayland
  - --own-name=org.macaque.Dock

modules:
  - name: layer-shell-qt
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://github.com/KDE/layer-shell-qt.git
        commit: a3798260173a6624c28b6e7c5ea239e6fefa43c6

  - name: macaque-dock
    buildsystem: cmake-ninja
    subdir: src
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/Zerocool66612/macaque-dock/archive/refs/tags/v1.0.3.tar.gz
        sha256: ea7e47512bdeb9bdf7504a65d56c2163155c3bd4154f7ddf9ec748f36665c2da
      - type: file
        path: io.github.Zerocool66612.macaque-dock.desktop
      - type: file
        path: io.github.Zerocool66612.macaque-dock.metainfo.xml
      - type: file
        path: io.github.Zerocool66612.macaque-dock.png

    post-install:
      - install -Dm644 ../io.github.Zerocool66612.macaque-dock.desktop /app/share/applications/io.github.Zerocool66612.macaque-dock.desktop
      - install -Dm644 ../io.github.Zerocool66612.macaque-dock.metainfo.xml /app/share/metainfo/io.github.Zerocool66612.macaque-dock.metainfo.xml
      - install -Dm644 ../io.github.Zerocool66612.macaque-dock.png /app/share/icons/hicolor/512x512/apps/io.github.Zerocool66612.macaque-dock.png
