app-id: com.ourcrmonline.covely
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: covely

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network

modules:
  - name: covely
    buildsystem: simple
    build-commands:
      # Extract the .deb file from the tarball
      - tar xf covely-linux-deb-bundle-v1.4.4.tar.gz
      # Extract the .deb contents
      - ar x Covely_1.4.4_amd64.deb
      # Extract the data archive from the .deb
      - tar xf data.tar.*
      # Install the binary
      - install -Dm755 usr/bin/covely /app/bin/covely
      # Install the desktop file
      - install -D -m 644 com.ourcrmonline.covely.desktop /app/share/applications/com.ourcrmonline.covely.desktop
      # Install the icon
      - install -D -m 644 com.ourcrmonline.covely.png /app/share/icons/hicolor/512x512/apps/com.ourcrmonline.covely.png
      # Install the metainfo XML
      - install -D -m 644 com.ourcrmonline.covely.metainfo.xml /app/share/metainfo/com.ourcrmonline.covely.metainfo.xml
    sources:
      - type: archive
        url: https://covely.ourcrmonline.com/downloads/1.4.4/linux/debian/covely-linux-deb-bundle-v1.4.4.tar.gz
        sha256: 72ffb463a71dc9d260ad934e911c0127cbbc21d1ebf7dbd41dd4aa392e9d6bef
      - type: file
        path: metainfo/com.ourcrmonline.covely.metainfo.xml
