app-id: io.gitlab.linuxbombay.LibElectron.BaseApp
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
branch: '2026.5'
separate-locales: false
command: libelectron-baseapp-info
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
modules:
  - name: zypak
    sources:
      - type: git
        url: https://github.com/refi64/zypak
        tag: v2025.09
        commit: 693a71c5ffa80ec9c9ce2ae03b1ccc493c698e53
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - libelectron-electron-meta/modules/libelectron-electron-meta.yml

  - libelectron/modules/libelectron.yml

  - name: libelectron-baseapp-info
    buildsystem: simple
    build-commands:
      - install -Dm755 libelectron-baseapp-info /app/bin/libelectron-baseapp-info
    sources:
      - type: script
        dest-filename: libelectron-baseapp-info
        commands:
          - printf 'LibElectron BaseApp 2026.5\n'
          - printf '/app/bin/libelectronmeta\n'
          - printf '/app/opt/libelectron\n'
          - printf '/app/opt/libelectron-electron-meta\n'
