id: dev.ciranda.Capy
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: Capy # the launcher script installed below
separate-locales: false
finish-args:
  - --share=ipc
  # Hyperswarm and the DHT over UDP, the blob server on 127.0.0.1, link previews
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  # calls, voice and video messages (PulseAudio, or PipeWire's PulseAudio server)
  - --socket=pulseaudio
  # cameras (/dev/video*) and the GPU; screen and window sharing and the file dialogs go
  # through xdg-desktop-portal, which needs no permission here
  - --device=all
  # the tray (StatusNotifierItem)
  - --talk-name=org.kde.StatusNotifierWatcher
  # notifications
  - --talk-name=org.freedesktop.Notifications
  # the system keychain that seals each secure room's file (electron/secure.js; plain without it)
  - --talk-name=org.freedesktop.secrets
  # where saved files land by default, and files dropped from there
  - --filesystem=xdg-download
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
modules:
  - name: Capy
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 flatpak/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 flatpak/${FLATPAK_ID}.png -t /app/share/icons/hicolor/512x512/apps/
      - install -Dm755 flatpak/entrypoint.sh /app/bin/Capy
      - mkdir -p /app/lib/${FLATPAK_ID}
      - cp -r ./Capy-*/* /app/lib/${FLATPAK_ID}
    sources:
      # The tarballs pear-electron-forge-maker-flatpak makes (npm run make:stores) on the
      # capy-releases release v<version>: .github/workflows/linux-stores.yml keeps them on a
      # draft release of each run (or attaches them, with `attach`) and prints this file with
      # their sha512 in its summary
      - type: archive
        url: https://github.com/DanielNeris/capy-releases/releases/download/v1.0.11/Capy-linux-arm64-flatpak.tar.gz
        only-arches:
          - aarch64
        strip-components: 0
        sha512: '421811ab616545a532d2c7eb1bf03f10cffe36a7d8099f1a01629e37a502bc48602bd1307cdb9729fec73982de48794135fee1c1203111c1d3962619e292a584'
        x-checker-data:
          type: json
          url: https://api.github.com/repos/DanielNeris/capy-releases/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "Capy-linux-arm64-flatpak.tar.gz") | .browser_download_url
      - type: archive
        url: https://github.com/DanielNeris/capy-releases/releases/download/v1.0.11/Capy-linux-x64-flatpak.tar.gz
        only-arches:
          - x86_64
        strip-components: 0
        sha512: 'e9465b0b2d1c1c651ecfe39ecb30d6f552b6081aeec2c0c28f1a8513b37e2eecb83ffac72811eea216994b8f7db99b357e5e57d97db6712701e15e3078b7f428'
        x-checker-data:
          type: json
          url: https://api.github.com/repos/DanielNeris/capy-releases/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "Capy-linux-x64-flatpak.tar.gz") | .browser_download_url
      - type: file
        path: dev.ciranda.Capy.metainfo.xml
