# Escala de Notas — manifiesto Flathub (compila desde el código). Desarrollada por Javiera Navarrete.
id: io.github.navarretenoir.EscalaNotas
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: escala-notas
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: escala-notas
    buildsystem: simple
    build-commands:
      - make -C desktop UI_DIR=/app/share/escala-notas/ui
      - install -Dm755 desktop/escala-notas /app/bin/escala-notas
      - mkdir -p /app/share/escala-notas && cp -r ui /app/share/escala-notas/ && rm -f /app/share/escala-notas/ui/*.bak*
      - install -Dm644 linux/io.github.navarretenoir.EscalaNotas.desktop /app/share/applications/io.github.navarretenoir.EscalaNotas.desktop
      - install -Dm644 linux/io.github.navarretenoir.EscalaNotas.metainfo.xml /app/share/metainfo/io.github.navarretenoir.EscalaNotas.metainfo.xml
      - install -Dm644 linux/io.github.navarretenoir.EscalaNotas.svg /app/share/icons/hicolor/scalable/apps/io.github.navarretenoir.EscalaNotas.svg
    sources:
      - type: git
        url: https://github.com/navarretenoir/escalanotas.git
        tag: v1.0
        commit: cac5d3f569446387681453d75ce8c0749efe9ad6
