id: io.github.sazardev.chessjournal
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: chess-journal

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --share=network
  - --device=dri
  - --filesystem=home

modules:
  - name: chess-journal
    buildsystem: simple
    build-commands:
      - chmod +x chess-journal.AppImage
      - ./chess-journal.AppImage --appimage-extract
      - mkdir -p /app/bin /app/share
      - cp -r squashfs-root/usr/* /app/
      - install -Dm644 io.github.sazardev.chessjournal.desktop /app/share/applications/io.github.sazardev.chessjournal.desktop
      - install -Dm644 io.github.sazardev.chessjournal.metainfo.xml /app/share/metainfo/io.github.sazardev.chessjournal.metainfo.xml
    sources:
      - type: file
        url: https://github.com/sazardev/chess-journal/releases/download/v0.1.33/Chess-Journal_0.1.33_linux.AppImage
        sha256: 885739af3115b05c7cf187e9a16b0c0ff355fe8d97e75f99c768a4d0081dd07b
        dest-filename: chess-journal.AppImage
      - type: file
        path: io.github.sazardev.chessjournal.desktop
      - type: file
        path: io.github.sazardev.chessjournal.metainfo.xml
