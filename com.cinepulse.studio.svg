<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgAmbient" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1e1435" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#0b0f19" stop-opacity="1"/>
      <stop offset="100%" stop-color="#03050a" stop-opacity="1"/>
    </radialGradient>

    <!-- Neon Pulse Gradient -->
    <linearGradient id="pulseGlowGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="35%" stop-color="#f43f5e"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Film Frame Accent Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Intense Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur1"/>
      <feGaussianBlur stdDeviation="22" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Tile / Dark Obsidian Squircle -->
  <rect x="12" y="12" width="488" height="488" rx="120" fill="url(#bgAmbient)"/>
  <rect x="12" y="12" width="488" height="488" rx="120" fill="none" stroke="url(#borderGrad)" stroke-width="4" opacity="0.65"/>

  <!-- Subtle Film Reel Perimeter Arc (Top-Left & Bottom-Right) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.08" stroke-dasharray="14 10"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.05" stroke-dasharray="8 16"/>

  <!-- Stylized Cinema Clapper / Film Frame Container -->
  <rect x="96" y="112" width="320" height="288" rx="36" fill="#0d111d" fill-opacity="0.75" stroke="url(#frameGrad)" stroke-width="2.5"/>

  <!-- Film Perforations (Left & Right Edge of Film Frame) -->
  <g fill="#f59e0b" fill-opacity="0.35">
    <!-- Left Sprockets -->
    <rect x="112" y="136" width="16" height="22" rx="4"/>
    <rect x="112" y="180" width="16" height="22" rx="4"/>
    <rect x="112" y="224" width="16" height="22" rx="4"/>
    <rect x="112" y="268" width="16" height="22" rx="4"/>
    <rect x="112" y="312" width="16" height="22" rx="4"/>
    <rect x="112" y="356" width="16" height="22" rx="4"/>

    <!-- Right Sprockets -->
    <rect x="384" y="136" width="16" height="22" rx="4"/>
    <rect x="384" y="180" width="16" height="22" rx="4"/>
    <rect x="384" y="224" width="16" height="22" rx="4"/>
    <rect x="384" y="268" width="16" height="22" rx="4"/>
    <rect x="384" y="312" width="16" height="22" rx="4"/>
    <rect x="384" y="356" width="16" height="22" rx="4"/>
  </g>

  <!-- Cinema Upper Clapper Slanted Chevrons -->
  <g opacity="0.4" fill="url(#pulseGlowGrad)">
    <polygon points="152,122 176,122 196,138 172,138"/>
    <polygon points="212,122 236,122 256,138 232,138"/>
    <polygon points="272,122 296,122 316,138 292,138"/>
    <polygon points="332,122 356,122 376,138 352,138"/>
  </g>

  <!-- Background Ambient Pulse Glow Sphere -->
  <circle cx="260" cy="256" r="76" fill="#f43f5e" opacity="0.22" filter="url(#neonGlow)"/>

  <!-- THE PULSE (Heartbeat ECG Waveform transitioning through Cinema) -->
  <path d="M 64 256 
           L 156 256 
           L 178 286 
           L 204 164 
           L 236 348 
           L 258 220 
           L 278 274 
           L 302 240 
           L 324 256 
           L 448 256"
        fill="none" 
        stroke="url(#pulseGlowGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- High-Intensity Crisp Core of the Pulse Line -->
  <path d="M 64 256 
           L 156 256 
           L 178 286 
           L 204 164 
           L 236 348 
           L 258 220 
           L 278 274 
           L 302 240 
           L 324 256 
           L 448 256"
        fill="none" 
        stroke="#ffffff" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.95"/>

  <!-- Center Floating Neon Playhead / Cine Heart -->
  <g filter="url(#softGlow)" transform="translate(242, 232)">
    <polygon points="0,0 36,24 0,48" fill="url(#pulseGlowGrad)"/>
    <polygon points="4,6 30,24 4,42" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Glowing Pulse Nodes (ECG Peaks) -->
  <circle cx="204" cy="164" r="7" fill="#fef08a" filter="url(#softGlow)"/>
  <circle cx="236" cy="348" r="7" fill="#f43f5e" filter="url(#softGlow)"/>
</svg>
