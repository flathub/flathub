app-id: com.ktechpit.pixelfx
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: pixelfx
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=xdg-pictures

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: dav1d
    buildsystem: meson
    config-opts:
      - --buildtype=debugoptimized
      - --default-library=static
      - -Denable_tools=false
      - -Denable_examples=false
      - -Denable_tests=false
      - -Denable_docs=false
      - -Dxxhash_muxer=disabled
    sources:
      - type: archive
        url: https://downloads.videolan.org/pub/videolan/dav1d/1.5.4/dav1d-1.5.4.tar.xz
        sha256: 686616b7c69eb88d44459391ab25cac13b6647a3b288835c5784e71c1514a5c5

  - name: libde265
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SHARED_LIBS=OFF
      - -DENABLE_SDL=OFF
      - -DENABLE_DECODER=OFF
      - -DENABLE_ENCODER=OFF
    sources:
      - type: archive
        url: https://github.com/strukturag/libde265/releases/download/v1.1.3/libde265-1.1.3.tar.gz
        sha256: 554228bd17788c99a7e63b37ab5634722190e6e2bf60c1dcb01cef328e133905

  - name: libheif
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TESTING=OFF
      - -DENABLE_PLUGIN_LOADING=OFF
      - -DWITH_LIBDE265=ON
      - -DWITH_LIBDE265_PLUGIN=OFF
      - -DWITH_DAV1D=ON
      - -DWITH_DAV1D_PLUGIN=OFF
      - -DWITH_X265=OFF
      - -DWITH_X264=OFF
      - -DWITH_OpenH264_DECODER=OFF
      - -DWITH_KVAZAAR=OFF
      - -DWITH_UVG266=OFF
      - -DWITH_VVDEC=OFF
      - -DWITH_VVENC=OFF
      - -DWITH_AOM_DECODER=OFF
      - -DWITH_AOM_ENCODER=OFF
      - -DWITH_SvtEnc=OFF
      - -DWITH_RAV1E=OFF
      - -DWITH_JPEG_DECODER=OFF
      - -DWITH_JPEG_ENCODER=OFF
      - -DWITH_OpenJPEG_DECODER=OFF
      - -DWITH_OpenJPEG_ENCODER=OFF
      - -DWITH_OPENJPH_ENCODER=OFF
      - -DWITH_FFMPEG_DECODER=OFF
      - -DWITH_LIBSHARPYUV=OFF
      - -DWITH_HEADER_COMPRESSION=OFF
      - -DWITH_EXAMPLES=OFF
      - -DWITH_EXAMPLE_HEIF_THUMB=OFF
      - -DWITH_EXAMPLE_HEIF_VIEW=OFF
      - -DWITH_GDK_PIXBUF=OFF
      - -DBUILD_DOCUMENTATION=OFF
    sources:
      - type: archive
        url: https://github.com/strukturag/libheif/releases/download/v1.23.7/libheif-1.23.7.tar.gz
        sha256: f7483e818503ea6224c8863e4a56ac02c7089021a98472c811c12aa19faf2475

  - name: libraw
    cleanup:
      - /bin
      # libvips uses libraw_r
      - /lib/libraw.so*
    config-opts:
      - --disable-static
      - --disable-openmp
      - --disable-examples
      - --enable-jpeg
      - --enable-zlib
      - --enable-lcms
    sources:
      - type: archive
        url: https://www.libraw.org/data/LibRaw-0.22.3.tar.gz
        sha256: 789f3c33466210a1a0907f747a97c715d21bbf4af712f257fcbbd90111b227e4

  - name: lensfun
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_TESTS=OFF
      - -DBUILD_LENSTOOL=OFF
      - -DBUILD_DOC=OFF
      - -DINSTALL_PYTHON_MODULE=OFF
      - -DINSTALL_HELPER_SCRIPTS=OFF
    sources:
      - type: archive
        url: https://github.com/lensfun/lensfun/archive/refs/tags/v0.3.4.tar.gz
        sha256: dafb39c08ef24a0e2abd00d05d7341b1bf1f0c38bfcd5a4c69cf5f0ecb6db112

  - name: libvips
    buildsystem: meson
    cleanup:
      - /bin
    config-opts:
      - --buildtype=debugoptimized
      - -Dauto_features=disabled
      - -Ddeprecated=false
      - -Dexamples=false
      - -Dcplusplus=true
      - -Dmodules=disabled
      - -Dintrospection=disabled
      - -Ddocs=false
      - -Dcpp-docs=false
      - -Dvapi=false
      - -Djpeg=enabled
      - -Dpng=enabled
      - -Dtiff=enabled
      - -Dwebp=enabled
      - -Dlcms=enabled
      - -Dexif=enabled
      - -Dzlib=enabled
      - -Dnsgif=true
      - -Dppm=true
      - -Danalyze=false
      - -Dradiance=false
      - -Dheif=enabled
      - -Djpeg-xl=enabled
      - -Draw=enabled
    sources:
      - type: archive
        url: https://github.com/libvips/libvips/releases/download/v8.18.7/vips-8.18.7.tar.xz
        sha256: 5baaead3b0bb20ffdb9e9ff09aa9fda08620923df77b63b436654cb5e0b3bf94

  - name: nlohmann-json
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DJSON_BuildTests=OFF
      - -DJSON_Install=ON
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://github.com/nlohmann/json/releases/download/v3.12.0/json.tar.xz
        sha256: 42f6e95cad6ec532fd372391373363b62a14af6d771056dbfc86160e6dfff7aa

  - name: pixelfx
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DPIXELFX_BUILD_TESTS=OFF
      - -DPFX_BUILD_TOOLS=OFF
      - -DPFX_WITH_LENSFUN=ON
    sources:
      - type: git
        url: https://github.com/keshavbhatt/PixelFx.git
        tag: v2.0.2
        commit: 38a5984ab188233b3547d3a2c0c0e6dec3384e02
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
