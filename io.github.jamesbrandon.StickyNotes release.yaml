app-id: io.github.jamesbrandon.StickyNotes
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: sticky-notes

finish-args:
  # Offline GTK4 app: only needs display + GPU. No network, no host files.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

modules:
  - name: sticky-notes
    buildsystem: simple
    build-commands:
      # The launcher script
      - install -Dm755 src/sticky-notes /app/bin/sticky-notes
      # Desktop entry
      - install -Dm644 data/io.github.jamesbrandon.StickyNotes.desktop
        /app/share/applications/io.github.jamesbrandon.StickyNotes.desktop
      # AppStream metainfo
      - install -Dm644 data/io.github.jamesbrandon.StickyNotes.metainfo.xml
        /app/share/metainfo/io.github.jamesbrandon.StickyNotes.metainfo.xml
      # Icons (installed by a helper loop over available sizes)
      - |
        for sz in 16 22 24 32 48 64 128 256; do
          src="data/icons/${sz}x${sz}/io.github.jamesbrandon.StickyNotes.png"
          if [ -f "$src" ]; then
            install -Dm644 "$src" \
              "/app/share/icons/hicolor/${sz}x${sz}/apps/io.github.jamesbrandon.StickyNotes.png"
          fi
        done
      - |
        if [ -f data/icons/scalable/io.github.jamesbrandon.StickyNotes.svg ]; then
          install -Dm644 data/icons/scalable/io.github.jamesbrandon.StickyNotes.svg \
            /app/share/icons/hicolor/scalable/apps/io.github.jamesbrandon.StickyNotes.svg
        fi
sources:
  - type: git
    url: https://github.com/jamesbrandon/StickyNotes.git
    tag: v1.0.0
    commit: fe047618f5921720cb64d081e31bc98c267b0e78
