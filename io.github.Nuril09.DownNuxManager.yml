app-id: io.github.Nuril09.DownNuxManager
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: downnux-gui

finish-args:
  # Network & IPC
  - --share=network
  - --share=ipc

  # Display
  - --socket=fallback-x11
  - --socket=wayland

  # Audio (Notification chimes)
  - --socket=pulseaudio

  # Filesystem permissions for download storage
  - --filesystem=xdg-download
  - --filesystem=home

  # Desktop Notifications & Power management
  - --talk-name=org.freedesktop.Notifications
  - --system-talk-name=org.freedesktop.login1

modules:
  - name: aria2
    buildsystem: autotools
    config-opts:
      - --without-gnutls
      - --with-openssl
      - --without-libxml2
      - --without-libgcrypt
      - --without-libgmp
    sources:
      - type: archive
        url: https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz
        sha256: 60a420ad7085eb616cb6e2bdf0a7206d68ff3d37fb5a956dc44242eb2f79b66b
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
      - /share/doc

  - name: nodejs
    buildsystem: simple
    build-commands:
      - cp -r bin include lib share ${FLATPAK_DEST}/
    sources:
      - type: archive
        url: https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz
        sha256: 69b09dba5c8dcb05c4e4273a4340db1005abeafe3927efda2bc5b249e80437ec
    cleanup:
      - /include
      - /share/man
      - /share/doc

  - name: downnux-manager
    buildsystem: simple
    build-commands:
      # Install application core
      - install -d ${FLATPAK_DEST}/lib/downnux-manager
      - cp -r bundle/apps bundle/packages bundle/scripts bundle/package.json ${FLATPAK_DEST}/lib/downnux-manager/

      # Install launch wrapper
      - install -Dm755 downnux-gui.sh ${FLATPAK_DEST}/bin/downnux-gui

      # Install desktop integration
      - install -Dm644 ${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 ${FLATPAK_ID}.png -t ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dm644 LICENSE -t ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}

    sources:
      - type: archive
        url: https://github.com/Nuril09/DownNux-Manager/releases/download/v0.0.3/downnux-manager_0.0.3_linux_x64.tar.gz
        sha256: 1d3923bd0953791cd34eefa1086da7fb54e852865d07aab58689f999f77d2d9d
        dest: bundle
        only-arches:
          - x86_64

      - type: file
        path: downnux-gui.sh

      - type: file
        path: io.github.Nuril09.DownNuxManager.desktop

      - type: file
        path: io.github.Nuril09.DownNuxManager.png

      - type: file
        path: io.github.Nuril09.DownNuxManager.metainfo.xml

      - type: file
        path: LICENSE

