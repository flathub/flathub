id: io.github.savantsavior.lettersfall
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.godotengine.godot.BaseApp
base-version: '4.7'
command: godot-runner

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all

modules:
  - name: lettersfall
    buildsystem: simple

    sources:
      - type: file
        url: https://raw.githubusercontent.com/savantsavior/lettersfall/9d693783e349c2a49f202a262ffeb6c470fcf1d0/io.github.savantsavior.lettersfall.desktop
        sha256: b1ceb189c45e3136e5dbfe15c53cb870c60900beef962e15ef2bbfa8c4f895a6

      - type: file
        url: https://raw.githubusercontent.com/savantsavior/lettersfall/9d693783e349c2a49f202a262ffeb6c470fcf1d0/io.github.savantsavior.lettersfall.metainfo.xml
        sha256: 979a062491107cac6d67b3a98133461ae51ac6a30e22e3d17be96dfae3d3f9c8

      - type: file
        url: https://raw.githubusercontent.com/savantsavior/lettersfall/9d693783e349c2a49f202a262ffeb6c470fcf1d0/io.github.savantsavior.lettersfall.png
        sha256: da57d43542b4a0aad76e086b957288aa36115dbb3f5a7026b70ff8ffb587045b

      - type: file
        url: https://github.com/savantsavior/lettersfall/releases/download/v1.0.0/LetterssFall-Linux-RC3.pck
        sha256: 716d85dbd4c1f0716e74cd65421a85ff3c9520f42fe32af26044b0706448a969

      - type: file
        url: https://raw.githubusercontent.com/savantsavior/lettersfall/9d693783e349c2a49f202a262ffeb6c470fcf1d0/LICENSE
        sha256: 5631fdf08b662f9f6d8cde591ad7f1660b633dc0bcc7f810961e46c7c68ffff8

    build-commands:
      - install -Dm644 LetterssFall-Linux-RC3.pck ${FLATPAK_DEST}/bin/godot-runner.pck
      - install -Dm644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 ${FLATPAK_ID}.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/LICENSE
