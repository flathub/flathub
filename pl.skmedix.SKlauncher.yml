id: pl.skmedix.SKlauncher
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21

command: sklauncher

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=all
  - --share=network
  - --socket=pulseaudio
  - --filesystem=xdg-download:ro
  - --filesystem=~/.minecraft:create

modules:
  - name: sklauncher
    buildsystem: simple
    build-commands:
      - install -Dm755 sklauncher.sh /app/bin/sklauncher
      - install -Dm644 SKlauncher.jar /app/share/java/sklauncher/SKlauncher.jar
      - install -Dm644 pl.skmedix.SKlauncher.desktop /app/share/applications/pl.skmedix.SKlauncher.desktop
      - install -Dm644 pl.skmedix.SKlauncher.metainfo.xml /app/share/metainfo/pl.skmedix.SKlauncher.metainfo.xml
      - install -Dm644 pl.skmedix.SKlauncher.png /app/share/icons/hicolor/256x256/apps/pl.skmedix.SKlauncher.png
    sources:
      - type: script
        dest-filename: sklauncher.sh
        commands:
          - export JAVA_HOME=/usr/lib/sdk/openjdk21/jvm/openjdk-21
          - exec java -jar /app/share/java/sklauncher/SKlauncher.jar "$@"
      - type: file
        path: pl.skmedix.SKlauncher.desktop
      - type: file
        path: pl.skmedix.SKlauncher.metainfo.xml
      - type: file
        path: pl.skmedix.SKlauncher.png
      - type: extra-data
        filename: SKlauncher.jar
        url: https://skmedix.pl/binaries/skl/3.2.18/SKlauncher-3.2.18.jar
        sha256: 25a73e3770a1d8d14bce53e8920e2e893aacc3c715d0fb22f878ef2090d03863
        size: 1401788

