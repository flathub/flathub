app-id: io.gitlab.ppavacic.tilmix
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: tilmix
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: vte
    buildsystem: meson
    config-opts:
      - -Dgtk3=false
      - -Dgtk4=true
      - -Dapp=false
      - -Ddocs=false
      - -Dgir=false
      - -Dvapi=false
      - -Dglade=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/vte/0.84/vte-0.84.1.tar.xz
        sha256: aca1caa8478aebcdbb1d67897fb3511eb7601debae6810e16a15b6fa25f31ac8
  - name: tilmix
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/tilmix/cargo
    build-commands:
      - cc -std=c11 -O2 -Wall -Wextra -Werror packaging/host-pty.c -o tilmix-host-pty
      - cargo build --release --frozen --offline
      - install -Dm755 tilmix-host-pty /app/libexec/tilmix-host-pty
      - install -Dm755 target/release/tilmix /app/bin/tilmix
      - install -Dm644 packaging/io.gitlab.ppavacic.tilmix.desktop /app/share/applications/io.gitlab.ppavacic.tilmix.desktop
      - install -Dm644 packaging/io.gitlab.ppavacic.tilmix.metainfo.xml /app/share/metainfo/io.gitlab.ppavacic.tilmix.metainfo.xml
      - install -Dm644 packaging/io.gitlab.ppavacic.tilmix.svg /app/share/icons/hicolor/scalable/apps/io.gitlab.ppavacic.tilmix.svg
    sources:
      - type: git
        url: https://gitlab.com/ppavacic/tilmix.git
        branch: master
      - cargo-sources.json
