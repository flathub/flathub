app-id: com.codeium.devin
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: devin
tags: [proprietary]
separate-locales: false
finish-args:
  - --require-version=0.10.3
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=ssh-auth
  - --device=all
  - --allow=devel
  - --filesystem=host
  - --env=NPM_CONFIG_GLOBALCONFIG=/app/etc/npmrc
  - --env=LD_LIBRARY_PATH=/app/lib
  # required to fix cursor scaling on wayland
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --system-talk-name=org.freedesktop.login1
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=com.canonical.AppMenu.Registrar.*
add-extensions:
  com.visualstudio.code.tool:
    directory: tools
    subdirectories: true
    version: '25.08'
    add-ld-path: lib
    no-autodownload: true
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gtk-doc
  - '*.la'
modules:
  - name: devin
    buildsystem: simple
    build-commands:
      - install -D devin.sh /app/bin/devin
      - install -Dm644 com.codeium.devin.metainfo.xml -t /app/share/metainfo
      - install -Dm644 com.codeium.devin.desktop -t /app/share/applications
      - install -Dm644 npmrc -t /app/etc
      - install -Dm644 flatpak-warning.txt -t /app/share/devin
      - install -Dm644 code.png /app/share/icons/hicolor/64x64/apps/com.codeium.devin.png
      - install -Dm644 code_128.png /app/share/icons/hicolor/128x128/apps/com.codeium.devin.png
      - install -Dm644 code_256.png /app/share/icons/hicolor/256x256/apps/com.codeium.devin.png
      - install -Dm644 code_512.png /app/share/icons/hicolor/512x512/apps/com.codeium.devin.png
      - install -D apply_extra -t /app/bin
      - cp /usr/bin/ar /app/bin
      - ARCH_TRIPLE=$(gcc --print-multiarch) && cp /usr/lib/${ARCH_TRIPLE}/libbfd-*.so /app/lib
      - ARCH_TRIPLE=$(gcc --print-multiarch) && cp /usr/lib/${ARCH_TRIPLE}/libsframe* /app/lib
      - ARCH_TRIPLE=$(gcc --print-multiarch) && ln -sf /usr/lib/${ARCH_TRIPLE}/libtinfo.so /app/lib/libtinfo.so.5
      - mkdir /app/tools
    sources:
      - type: script
        dest-filename: apply_extra
        commands:
          - tar xzf devin.tar.gz
          - mv Devin devin
          - rm devin.tar.gz
      - type: file
        path: code.png
      - type: file
        path: code_128.png
      - type: file
        path: code_256.png
      - type: file
        path: code_512.png
      - type: file
        path: devin.sh
      - type: file
        path: flatpak-warning.txt
      - type: file
        path: npmrc
      - type: file
        path: com.codeium.devin.metainfo.xml
      - type: file
        path: com.codeium.devin.desktop
      - type: extra-data
        filename: devin.tar.gz
        only-arches: [x86_64]
        url: https://windsurf-stable.codeiumdata.com/linux-x64/stable/a335ac3d8c6b04d563d8bd757cadc86d305e3b12/Devin-linux-x64-3.0.12.tar.gz
        sha256: bf88fde16f9eda63640d4e0567ff129b563fb383bee1e353250c7e95935016d4
        size: 292170024
        x-checker-data:
          type: html
          url: https://docs.devin.ai/desktop/releases
          pattern: https://windsurf-stable\.codeiumdata\.com/linux-x64/stable/[0-9a-f]+/Devin-linux-x64-([\d.]+)\.tar\.gz
          version-format: $1
          is-main-source: true

  - name: host-spawn
    buildsystem: simple
    build-commands:
      - install -Dm755 host-spawn /app/bin/host-spawn
    sources:
      - type: file
        url: https://github.com/1player/host-spawn/releases/download/v1.6.2/host-spawn-x86_64
        sha256: 077bc09a087292447ba17cfe2156a93f71bf56c4c6be8e38d3abe65c1240f34c
        dest-filename: host-spawn
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/1player/host-spawn/releases/latest
          version-query: .tag_name
          timestamp-query: .published_at
          url-query: '"https://github.com/1player/host-spawn/releases/download/" +
            $version + "/host-spawn-x86_64"'
