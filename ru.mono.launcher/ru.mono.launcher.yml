id: ru.mono.launcher
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22

command: mono-launcher
rename-desktop-file: ru.mono.launcher.desktop
rename-appdata-file: ru.mono.launcher.appdata.xml

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/mono-launcher/.cargo
    CARGO_TARGET_DIR: /run/build/mono-launcher/target

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: mono-launcher
    buildsystem: simple
    build-commands:
      - npm ci --no-audit --no-fund
      - npm run build
      - cargo build --manifest-path src-tauri/Cargo.toml --release --locked
        -j ${FLATPAK_BUILDER_N_JOBS}
      - install -Dm755 target/release/mono-launcher /app/bin/mono-launcher
      - install -Dm644 ru.mono.launcher.desktop
        /app/share/applications/ru.mono.launcher.desktop
      - install -Dm644 src-tauri/icons/128x128.png
        /app/share/icons/hicolor/128x128/apps/ru.mono.launcher.png
    sources:
      - type: archive
        url: https://github.com/n1orio/mono-launcher/archive/refs/tags/launcher-v2.0.0-alpha.13.tar.gz
        sha256: 460bad76b6fb677f10c9634f44df6b395afc4ba06ced3cc2b84e7d6ed1d0831e
        x-checker-data:
          type: json
          url: https://api.github.com/repos/n1orio/mono-launcher/releases/latest
          tag-query: .tag_name
          version-query: .tag_name
          url-query: '"https://github.com/n1orio/mono-launcher/archive/refs/tags/" + .tag_name + ".tar.gz"'
      - type: file
        path: ru.mono.launcher.desktop