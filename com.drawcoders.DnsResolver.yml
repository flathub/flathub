app-id: com.drawcoders.DnsResolver
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: dns_resolver

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: dns-resolver
    buildsystem: simple
    build-commands:
      - mkdir -p /app/opt/dns-resolver /app/bin
      - cp -a dns_resolver data lib /app/opt/dns-resolver/
      - ln -s /app/opt/dns-resolver/dns_resolver /app/bin/dns_resolver
      - install -Dm644 com.drawcoders.DnsResolver.desktop /app/share/applications/com.drawcoders.DnsResolver.desktop
      - install -Dm644 com.drawcoders.DnsResolver.metainfo.xml /app/share/metainfo/com.drawcoders.DnsResolver.metainfo.xml
      - install -Dm644 com.drawcoders.DnsResolver.png /app/share/icons/hicolor/256x256/apps/com.drawcoders.DnsResolver.png

    sources:
      - type: archive
        url: https://github.com/drawcoders/dns-resolver/releases/download/1.0.3-stable/bundle-dns_resolver-1.0.3-stable-linux-x64.tar.xz
        sha256: 48e9a85191d3e5efa4bb100212b4246befee48d6c1c4c67f903a6c6f2d8ca2a5
        strip-components: 0

      - type: file
        path: com.drawcoders.DnsResolver.desktop

      - type: file
        path: com.drawcoders.DnsResolver.metainfo.xml

      - type: file
        path: com.drawcoders.DnsResolver.png