app-id: com.ixress.prepress
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: ixress-layout-automation-software

finish-args:
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --share=ipc
  - --filesystem=host
  - --filesystem=home
  - --socket=session-bus
  - --system-talk-name=org.freedesktop.login1
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: ixress-layout-automation-software
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/ixress-prepress
      - cp -r * /app/lib/ixress-prepress/
      - chmod +x /app/lib/ixress-prepress/ixress-layout-automation-software

      - mkdir -p /app/bin
      - echo '#!/bin/sh' > /app/bin/ixress-layout-automation-software
      - echo 'exec /app/lib/ixress-prepress/ixress-layout-automation-software --no-sandbox "$@"' >> /app/bin/ixress-layout-automation-software
      - chmod +x /app/bin/ixress-layout-automation-software

      - install -Dm644 com.ixress.prepress.desktop /app/share/applications/com.ixress.prepress.desktop
      - install -Dm644 com.ixress.prepress.metainfo.xml /app/share/metainfo/com.ixress.prepress.metainfo.xml
      - install -Dm644 com.ixress.prepress.svg /app/share/icons/hicolor/scalable/apps/com.ixress.prepress.svg
      - install -Dm644 com.ixress.prepress.png /app/share/icons/hicolor/512x512/apps/com.ixress.prepress.png

    sources:
      - type: archive
        url: https://github.com/ixress/prepress-software-solutions/releases/download/Prepress/ixress-layout-automation-software-26.1.3.tar.gz
        sha256: e3efde637ce10c7e63e67b87d824db3bc747a34e814887fd4188230377ce1ba7
        strip-components: 0

      - type: file
        path: com.ixress.prepress.desktop

      - type: file
        path: com.ixress.prepress.metainfo.xml

      - type: file
        path: com.ixress.prepress.svg

      - type: file
        path: com.ixress.prepress.png
