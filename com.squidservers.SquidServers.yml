app-id: com.squidservers.SquidServers
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: squidservers
separate-locales: false

finish-args:
  # Network access for Minecraft servers, auth, modpack downloads, and tunnels
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Filesystem permissions for server directories, world backups, and downloads
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=/media:ro
  - --filesystem=/run/media:ro

modules:
  - name: unappimage
    buildsystem: simple
    build-options:
      cflags: "-std=gnu89"
    build-commands:
      - make -C squashfs-tools install INSTALL_DIR=/app/bin
    sources:
      - type: git
        url: https://github.com/refi64/unappimage
        commit: d7f86f2a0d7ec3a69211125207d5f127386b849a

  - name: squidservers
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 squidservers-wrapper.sh /app/bin/squidservers
      - install -Dm644 com.squidservers.SquidServers.desktop /app/share/applications/com.squidservers.SquidServers.desktop
      - install -Dm644 com.squidservers.SquidServers.metainfo.xml /app/share/metainfo/com.squidservers.SquidServers.metainfo.xml
      - install -Dm644 com.squidservers.SquidServers.png /app/share/icons/hicolor/512x512/apps/com.squidservers.SquidServers.png
    sources:
      - type: extra-data
        filename: squidservers.AppImage
        url: https://cdn.squidservers.com/v0.9.11/squidservers-0.9.11-x86_64.AppImage
        sha256: 3d773857bdd97625abee34cbf718d3e46f5a19689e8390f3bef583c63d4597a3
        size: 213531029
      - type: file
        path: apply_extra.sh
      - type: file
        path: squidservers-wrapper.sh
      - type: file
        path: com.squidservers.SquidServers.desktop
      - type: file
        path: com.squidservers.SquidServers.metainfo.xml
      - type: file
        path: com.squidservers.SquidServers.png
