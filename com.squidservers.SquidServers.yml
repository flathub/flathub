app-id: com.squidservers.SquidServers
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: squidservers
separate-locales: false
rename-desktop-file: squidservers.desktop
rename-icon: squidservers

finish-args:
  # Network access for Minecraft servers, auth, modpack downloads, and tunnels
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Filesystem permissions for server directories, world backups, and downloads
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=/media:ro
  - --filesystem=/run/media:ro

modules:
  - name: unappimage
    buildsystem: simple
    build-options:
      cflags: "-std=gnu89"
    build-commands:
      - make -C squashfs-tools install INSTALL_DIR=/app/bin
    sources:
      - type: git
        url: https://github.com/refi64/unappimage
        commit: d7f86f2a0d7ec3a69211125207d5f127386b849a
    cleanup:
      - "*"

  - name: squidservers
    buildsystem: simple
    build-commands:
      - unappimage squidservers.AppImage
      - mv squashfs-root /app/squidservers
      - install -Dm755 squidservers.sh /app/bin/squidservers
      # Desktop entry, icon and AppStream metainfo all ship inside the upstream AppImage
      - install -Dm644 /app/squidservers/squidservers.desktop -t /app/share/applications/
      - desktop-file-edit --set-key=Exec --set-value='squidservers %U' /app/share/applications/squidservers.desktop
      - install -Dm644 /app/squidservers/usr/share/icons/hicolor/512x512/apps/squidservers.png -t /app/share/icons/hicolor/512x512/apps/
      - install -Dm644 /app/squidservers/usr/share/metainfo/com.squidservers.SquidServers.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: file
        dest-filename: squidservers.AppImage
        only-arches: [x86_64]
        url: https://cdn.squidservers.com/v0.10.0/squidservers-0.10.0-x86_64.AppImage
        sha256: f73666857c94f8db0edcfab67682df2e7b6def4682714c550b9d8abf5451eff7
      - type: file
        dest-filename: squidservers.AppImage
        only-arches: [aarch64]
        url: https://cdn.squidservers.com/v0.10.0/squidservers-0.10.0-arm64.AppImage
        sha256: 2ddc46bf107a83816dc8b0f26b0ecf1d32ad59fcc98bfde8124e46e3b404481e
      - type: script
        dest-filename: squidservers.sh
        commands:
          - exec zypak-wrapper.sh /app/squidservers/squidservers "$@"
