id: io.github.chnapy.pkvault
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: PKVault
tags: [pokemon, storage, pokedex, pkhex, save-editor]
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

  # Network used to fetch app changelog from github releases page
  - --share=network

  # TODO should be less global
  # check if it works without it (should work if photino uses GtkFileChooserNative)
  # - --filesystem=home:rw

  # PKVault was released as a pkvault.flatpak file with an old id=org.chnapy.pkvault
  # The app should check if this old version is installed, and copy its data
  - --filesystem=~/.var/app/org.chnapy.pkvault:ro

modules:
  - name: build
    buildsystem: simple
    build-commands:
      - desktop-file-validate io.github.chnapy.pkvault.desktop
      - appstreamcli validate --no-net io.github.chnapy.pkvault.metainfo.xml
      - install -Dm644 LICENSE -t $FLATPAK_DEST/share/licenses/$FLATPAK_ID/build
      - install -Dm755 PKVault /app/bin/PKVault
      - install -Dm644 io.github.chnapy.pkvault.desktop /app/share/applications/io.github.chnapy.pkvault.desktop
      - install -Dm644 io.github.chnapy.pkvault.metainfo.xml /app/share/metainfo/io.github.chnapy.pkvault.metainfo.xml
      - install -Dm644 pkvault_16x16.png /app/share/icons/hicolor/16x16/apps/io.github.chnapy.pkvault.png
      - install -Dm644 pkvault_32x32.png /app/share/icons/hicolor/32x32/apps/io.github.chnapy.pkvault.png
      - install -Dm644 pkvault_48x48.png /app/share/icons/hicolor/48x48/apps/io.github.chnapy.pkvault.png
      - install -Dm644 pkvault_64x64.png /app/share/icons/hicolor/64x64/apps/io.github.chnapy.pkvault.png
      - install -Dm644 pkvault_128x128.png /app/share/icons/hicolor/128x128/apps/io.github.chnapy.pkvault.png
      - install -Dm644 pkvault_256x256.png /app/share/icons/hicolor/256x256/apps/io.github.chnapy.pkvault.png
      - install -Dm644 pkvault_scalable.svg /app/share/icons/hicolor/scalable/apps/io.github.chnapy.pkvault.svg
    sources:
      - type: file
        url: https://github.com/Chnapy/PKVault/releases/download/v2.1.0/pkvault-2.1.0.linux
        sha256: a012ac51735486ba2f4794308712ba2d3dbfef46abba57ea3efe958b79e6ceb8
        dest-filename: PKVault
      - type: file
        path: LICENSE
      - type: file
        path: io.github.chnapy.pkvault.metainfo.xml
      - type: file
        path: io.github.chnapy.pkvault.desktop
      - type: file
        path: icons/pkvault_16x16.png
      - type: file
        path: icons/pkvault_32x32.png
      - type: file
        path: icons/pkvault_48x48.png
      - type: file
        path: icons/pkvault_64x64.png
      - type: file
        path: icons/pkvault_128x128.png
      - type: file
        path: icons/pkvault_256x256.png
      - type: file
        path: icons/pkvault_scalable.svg
