id: eu.magicwhale.WaterLeak
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: waterleak

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: waterleak
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/waterleak
      - mkdir -p /app/share/icons/hicolor/scalable/apps
      - mkdir -p /app/share/icons/hicolor/128x128/apps
      - mkdir -p /app/share/icons/hicolor/512x512/apps
      - mkdir -p /app/share/metainfo
      - mkdir -p /app/bin
      - cp -r index.html /app/share/waterleak/
      - cp eu.magicwhale.WaterLeak.svg /app/share/icons/hicolor/scalable/apps/
      - cp eu.magicwhale.WaterLeak-128.png /app/share/icons/hicolor/128x128/apps/
      - cp eu.magicwhale.WaterLeak-512.png /app/share/icons/hicolor/512x512/apps/
      - cp eu.magicwhale.WaterLeak.metainfo.xml /app/share/metainfo/
      - cp waterleak.sh /app/bin/waterleak
      - chmod +x /app/bin/waterleak
    sources:
      - type: dir
        path: .
