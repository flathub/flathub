app-id: io.github.CodeSanket6.notepad
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: notepad

finish-args:
  # Display
  - --socket=fallback-x11
  - --socket=wayland
  # OpenGL / DRI
  - --device=dri
  # Inter-process communication
  - --share=ipc
  # File access for text documents
  - --filesystem=host
  # Portal / File Manager integration
  - --talk-name=org.freedesktop.FileManager1

modules:
  - name: notepad
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/CodeSanket6/notepad.git
        tag: v1.0.1
        commit: 5476b6fe69e40aaff2c8b82ba27152443bc78f9d
