app-id: com.linuxy.App
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
sdk-version: "49"
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable
command: linuxy
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --talk-name=ca.desrt.dconf
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.FileChooser
  - --system-talk-name=org.freedesktop.PackageKit
build-options:
  append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin
  env:
    NPM_CONFIG_CACHE: /run/build/linuxy/npm-cache

modules:
  - name: linuxy
    buildsystem: simple
    build-commands:
      - |
        # Configure cargo to use the vendored crates
        mkdir -p .cargo
        cp cargo/config .cargo/config.toml

        # Build the frontend
        npm install
        npm run build

        # Build the Rust backend against the vendored crates
        cd src-tauri
        cargo build --release --offline
        cd ..

        # Install the binary, desktop entry, metainfo and icons
        install -Dm755 src-tauri/target/release/linuxy /app/bin/linuxy
        install -Dm644 com.linuxy.App.desktop /app/share/applications/com.linuxy.App.desktop
        install -Dm644 com.linuxy.App.metainfo.xml /app/share/metainfo/com.linuxy.App.metainfo.xml
        install -Dm644 icons/32x32.png /app/share/icons/hicolor/32x32/apps/com.linuxy.App.png
        install -Dm644 icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.linuxy.App.png
        install -Dm644 icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/com.linuxy.App.png
        install -Dm644 icons/icon.png /app/share/icons/hicolor/512x512/apps/com.linuxy.App.png
    sources:
      - type: git
        url: https://github.com/swadhinbiswas/linuxy
        tag: v2.0.1
        commit: 744b5349d6cd734debe2d869a2362f732f238e91
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: file
        path: com.linuxy.App.desktop
      - type: file
        path: com.linuxy.App.metainfo.xml
      - type: dir
        path: icons
