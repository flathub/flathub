app-id: io.github.tanaybhomia.DeepDive
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: deepdive
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --system-talk-name=org.freedesktop.PolicyKit1
modules:
  - name: deepdive
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib/python /app/share/applications /app/share/metainfo /app/share/icons/hicolor/scalable/apps
      - cp -r deepdive /app/lib/python/deepdive
      - cp main.py /app/lib/python/main.py
      - |
        cat <<'EOF' > /app/bin/deepdive
        #!/bin/sh
        export PYTHONPATH="/app/lib/python:$PYTHONPATH"
        exec python3 /app/lib/python/main.py "$@"
        EOF
      - chmod +x /app/bin/deepdive
      - cp data/io.github.tanaybhomia.DeepDive.desktop /app/share/applications/
      - cp data/io.github.tanaybhomia.DeepDive.metainfo.xml /app/share/metainfo/
      - cp docs/assets/images/app-icon.svg /app/share/icons/hicolor/scalable/apps/io.github.tanaybhomia.DeepDive.svg
    sources:
      - type: git
        url: https://github.com/tanaybhomia/Deep-Dive.git
        tag: v1.0.0
