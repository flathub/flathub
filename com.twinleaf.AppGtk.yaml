# Flathub manifest: OFFLINE build from a pinned release tag. This is the
# manifest that lives in the flathub/com.twinleaf.AppGtk repo; the flathub.yml
# workflow regenerates cargo-sources.json and rewrites the tag/commit lines on
# every release, then opens a PR there. Flathub's Buildbot builds and publishes
# from that repo — nothing is pushed to Flathub directly.
#
# Local build (after generating cargo-sources.json next to this file — see
# packaging/README.md):
#   flatpak-builder --user --install --force-clean build-dir \
#     packaging/flathub/com.twinleaf.AppGtk.yaml
id: com.twinleaf.AppGtk
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: twinleaf-gtk
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network          # mDNS discovery, TCP devices, firmware catalog
  - --device=all             # USB CDC-ACM serial sensors (no portal covers tty)
modules:
  - name: twinleaf-gtk
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/twinleaf-gtk/cargo
    build-commands:
      - cargo --offline build --release --locked -p twinleaf-gtk
      - install -Dm755 target/release/twinleaf-gtk /app/bin/twinleaf-gtk
      - install -Dm644 packaging/linux/com.twinleaf.AppGtk.desktop
        /app/share/applications/com.twinleaf.AppGtk.desktop
      - for s in 16 32 64 128 256 512; do
        install -Dm644 packaging/linux/icons/hicolor/${s}x${s}/apps/com.twinleaf.AppGtk.png
        /app/share/icons/hicolor/${s}x${s}/apps/com.twinleaf.AppGtk.png; done
      - install -Dm644 packaging/linux/com.twinleaf.AppGtk.metainfo.xml
        /app/share/metainfo/com.twinleaf.AppGtk.metainfo.xml
    sources:
      # The tag/commit lines below are rewritten by the app repo's
      # .github/workflows/flathub.yml on each release; keep them on
      # separate lines.
      - type: git
        url: https://github.com/twinleaf/twinleaf-app-gtk.git
        tag: v0.1.6
        commit: 487e59e967b62632b36e512f8edd864c59d91f49
      - cargo-sources.json
