app-id: io.github._0x07dc.AirplaneGame
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: airplane_game

finish-args:
  # Wayland display server
  - --socket=wayland
  # Vulkan / DRI direct hardware acceleration
  - --device=dri
  # Audio playback (PulseAudio/PipeWire ALSA emulation)
  - --socket=pulseaudio
  # Shared memory IPC
  - --share=ipc
  # Multiplayer UDP networking
  - --share=network

modules:
  - name: zig
    buildsystem: simple
    build-commands:
      - install -dm755 /app/zig
      - cp -a . /app/zig/
      - ln -sf /app/zig/zig /app/bin/zig
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
        sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      - type: archive
        only-arches: [aarch64]
        url: https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz
        sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
    cleanup:
      - /app/zig

  - name: airplane-game
    buildsystem: simple
    build-commands:
      - /app/bin/zig build --prefix /app -Doptimize=ReleaseFast -Duse-precompiled-shaders=true
      - install -Dm644 LICENSE /app/share/licenses/io.github._0x07dc.AirplaneGame/LICENSE
    sources:
      - type: git
        url: https://github.com/0x07dc/AirplaneGame.git
        tag: v0.1.0
        commit: cb3657e717c6e24ac9511c7517b3fe696d1a314d
