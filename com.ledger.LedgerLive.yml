app-id: com.ledger.LedgerLive
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: ledger-live
tags: [proprietary]
separate-locales: false


finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all          # accès USB/HID au Ledger (nécessite les règles udev sur l'hôte)
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --env=TMPDIR=/var/tmp

modules:
  - name: squashfs-tools
    buildsystem: simple
    build-commands:
      - make -C squashfs-tools -j$FLATPAK_BUILDER_N_JOBS XZ_SUPPORT=1 ZSTD_SUPPORT=1 LZ4_SUPPORT=1 LZO_SUPPORT=0 INSTALL_PREFIX=/app install
    sources:
      - type: archive
        url: https://github.com/plougher/squashfs-tools/archive/refs/tags/4.7.2.tar.gz
        sha256: 4672b5c47d9418d3a5ae5b243defc6d9eae8275b9771022247c6a6082c815914
        x-checker-data:
          type: anitya
          project-id: 4879
          stable-only: true
          url-template: https://github.com/plougher/squashfs-tools/archive/refs/tags/$version.tar.gz

  - name: ledger-live
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 ledger-live.sh /app/bin/ledger-live
      - for s in 128 256 512; do install -Dm644 icons/$s.png /app/share/icons/hicolor/${s}x${s}/apps/com.ledger.LedgerLive.png; done
      - install -Dm644 com.ledger.LedgerLive.desktop /app/share/applications/com.ledger.LedgerLive.desktop
      - install -Dm644 com.ledger.LedgerLive.metainfo.xml /app/share/metainfo/com.ledger.LedgerLive.metainfo.xml
    sources:
      - type: extra-data
        filename: ledger-live-desktop.AppImage
        only-arches: [x86_64]
        url: https://download.live.ledger.com/ledger-live-desktop-4.23.0-linux-x86_64.AppImage
        sha256: 079e1bf8defdf3afc5ba662268bc0437b6b7c1317969e5c5b17e09ba16f29cae
        size: 212148589
        x-checker-data:
          type: json
          url: https://api.github.com/repos/LedgerHQ/ledger-live/releases/latest
      - type: file
        path: data/apply_extra.sh
      - type: file
        path: data/ledger-live.sh
      - type: dir
        path: data/icons
        dest: icons
      - type: file
        path: data/com.ledger.LedgerLive.desktop
      - type: file
        path: data/com.ledger.LedgerLive.metainfo.xml
