app-id: io.github.wesleiaqui.eternomail
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
  - org.freedesktop.Sdk.Extension.node24
command: eterno-mail

finish-args:
  # Network access for email sync
  - --share=network
  # IPC is required for X11 and Wayland
  - --share=ipc
  # Display access
  - --socket=wayland
  - --socket=fallback-x11
  # GPU access for hardware acceleration
  - --device=dri
  # Sleep/wake detection for sync management
  - --system-talk-name=org.freedesktop.login1
  # Secret Service access for the existing go-keyring integration
  - --talk-name=org.freedesktop.secrets

modules:
  - name: aerion
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin:/usr/lib/sdk/node24/bin
      env:
        GOROOT: /usr/lib/sdk/golang
        GOPATH: /run/build/aerion/go
        GOCACHE: /run/build/aerion/go-cache
        GO111MODULE: 'on'
        CGO_ENABLED: '1'
        npm_config_cache: /run/build/aerion/flatpak-node/npm-cache
        npm_config_offline: 'true'

    build-commands:
      # Install exactly the lockfile dependency graph from the declared cache.
      - cd frontend && npm ci --offline --legacy-peer-deps

      # Build frontend
      - cd frontend && npm run build

      # Build the Go binary using vendored modules. Public OAuth client IDs
      # are versioned source configuration; no runtime credentials helper.
      # Tags: desktop (Wails runtime), webkit2_41 (GTK webkit API), production (embedded assets)
      - go build -mod=vendor -tags desktop,webkit2_41,production -ldflags "-w -s" -o eterno-mail

      # Install binary
      - install -Dm755 eterno-mail /app/bin/eterno-mail

      # Install desktop file with correct app ID
      - install -Dm644 build/linux/io.github.wesleiaqui.eternomail.desktop /app/share/applications/io.github.wesleiaqui.eternomail.desktop

      # Install icon with correct app ID
      - install -Dm644 build/appicon.png /app/share/icons/hicolor/256x256/apps/io.github.wesleiaqui.eternomail.png

      # Install metainfo (AppStream metadata)
      - install -Dm644 build/flatpak/io.github.wesleiaqui.eternomail.metainfo.xml /app/share/metainfo/io.github.wesleiaqui.eternomail.metainfo.xml

    sources:
      # Application source code (tag and commit updated by calculate-hashes.sh)
      - type: git
        url: https://github.com/wesleiaqui/eternomail.git
        tag: v0.3.4
        commit: ce73c6f19299bccbb308e86a7df75297f89c0019

      # Go module vendoring (generated by flatpak-go-mod, offline)
      - go.mod.yml

      # npm package vendoring (generated by flatpak-node-generator, offline)
      - node-sources.json
