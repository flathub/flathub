# Flatpak manifest for otd (On The Dial). Local build: flatpak/build.sh
# For Flathub the "sources" of the last module point at a release tag.
app-id: eu.oh2gba.otd
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: otd
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Sound output for the KiwiSDR player
  - --socket=pulseaudio
  # Schedule downloads, the TCP connection to rigctld and the KiwiSDR receivers
  - --share=network
  # Serial/USB access so rigctld started from the app can reach the radio
  - --device=all
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/aclocal
  - '*.la'
  - '*.a'
modules:
  - name: hamlib
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --without-cxx-binding
      - --without-perl-binding
      - --without-python-binding
      - --without-tcl-binding
      - --without-lua-binding
    cleanup:
      - /bin/ampctl*
      - /bin/rigmem
      - /bin/rigsmtr
      - /bin/rigswr
      - /bin/rotctl*
      - /bin/rigtest*
    post-install:
      - install -Dm644 COPYING.LIB ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/hamlib/COPYING.LIB
    sources:
      - type: archive
        url: https://github.com/Hamlib/Hamlib/releases/download/4.7.2/hamlib-4.7.2.tar.gz
        sha256: ae1fcf2dbc80ea0786ea8f047b09399c3f7737d1930442f61a031708ed33e88f

  - name: otd
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DOTD_BUILD_TESTS=OFF
      - -DOTD_DESKTOP_ID=eu.oh2gba.otd
    post-install:
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/otd/LICENSE
      - install -Dm644 third_party/miniz/LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/miniz/LICENSE
    sources:
      - type: git
        url: https://github.com/oh2gba/otd.git
        tag: v1.5.2
        commit: 8d5b4ec72ac30cc96d35e5e3b577882fffb50c00
