app-id: com.moscatee.Editor
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.nodejs20

command: moscatee

finish-args:
  # Permissões de rede (necessário para funcionar)
  - --share=network
  
  # Permissões de interface gráfica
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --device=dri
  
  # Permissões de arquivo (acesso ao home para salvar/abrir arquivos)
  - --filesystem=home
  - --filesystem=/tmp
  
  # Permissões de áudio
  - --socket=pulseaudio
  
  # Permissões de câmera (se necessário)
  - --device=all

modules:
  - name: nodejs
    buildsystem: simple
    build-commands: []
    sources:
      - type: script
        commands:
          - ln -s /usr/lib/sdk/nodejs20/bin/node /app/bin/node
          - ln -s /usr/lib/sdk/nodejs20/bin/npm /app/bin/npm

  - name: moscatee
    buildsystem: simple
    build-commands:
      - npm ci --ignore-scripts
      - npm run build
      - mkdir -p /app/bin
      - mkdir -p /app/share/moscatee
      - mkdir -p /app/share/applications
      - mkdir -p /app/share/icons/hicolor/{48x48,64x64,128x128,256x256,512x512}/apps
      - cp -r dist/* /app/share/moscatee/
      - cp index.html /app/share/moscatee/
      - install -Dm755 flatpak/moscatee /app/bin/moscatee
      - install -Dm644 flatpak/com.moscatee.Editor.desktop /app/share/applications/
      - install -Dm644 flatpak/com.moscatee.Editor.metainfo.xml /app/share/metainfo/
      - install -Dm644 flatpak/icons/48x48/com.moscatee.Editor.png /app/share/icons/hicolor/48x48/apps/
      - install -Dm644 flatpak/icons/64x64/com.moscatee.Editor.png /app/share/icons/hicolor/64x64/apps/
      - install -Dm644 flatpak/icons/128x128/com.moscatee.Editor.png /app/share/icons/hicolor/128x128/apps/
      - install -Dm644 flatpak/icons/256x256/com.moscatee.Editor.png /app/share/icons/hicolor/256x256/apps/
      - install -Dm644 flatpak/icons/512x512/com.moscatee.Editor.png /app/share/icons/hicolor/512x512/apps/

    sources:
      - type: dir
        path: .
        skip:
          - node_modules
          - dist
          - .git
