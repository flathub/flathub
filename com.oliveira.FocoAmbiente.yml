id: com.oliveira.FocoAmbiente
runtime: org.gnome.Platform
runtime-version: '45'
sdk: org.gnome.Sdk
command: rodar_app.py

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=host

modules:
  - name: python-deps
    build-options:
      build-args:
        - --share=network
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} pywebview PyGObject pycairo

  - name: foco-ambiente
    buildsystem: simple
    build-commands:
      - install -Dm755 rodar_app.py /app/bin/rodar_app.py
      - install -Dm644 index.html /app/share/foco-ambiente/index.html
      - install -Dm644 style.css /app/share/foco-ambiente/style.css
      - install -Dm644 script.js /app/share/foco-ambiente/script.js
      - install -Dm644 qrcode.png /app/share/foco-ambiente/qrcode.png
      - cp -r sounds /app/share/foco-ambiente/
      - install -Dm644 com.oliveira.FocoAmbiente.desktop /app/share/applications/com.oliveira.FocoAmbiente.desktop
      - install -Dm644 com.oliveira.FocoAmbiente.png /app/share/icons/hicolor/512x512/apps/com.oliveira.FocoAmbiente.png
      - install -Dm644 com.oliveira.FocoAmbiente.metainfo.xml /app/share/metainfo/com.oliveira.FocoAmbiente.metainfo.xml
    sources:
      - type: dir
        path: .
