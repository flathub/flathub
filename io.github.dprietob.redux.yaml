app-id: io.github.dprietob.redux
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: redux

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/gir-1.0
  - /share/vala
  - '*.a'
  - '*.la'

modules:
  - name: exiv2
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DEXIV2_ENABLE_INIH=OFF
      - -DEXIV2_ENABLE_BROTLI=OFF
      - -DEXIV2_ENABLE_VIDEO=OFF
      - -DEXIV2_ENABLE_NLS=OFF
      - -DEXIV2_BUILD_EXIV2_COMMAND=OFF
      - -DEXIV2_BUILD_SAMPLES=OFF
      - -DEXIV2_BUILD_UNIT_TESTS=OFF
      - -DEXIV2_BUILD_DOC=OFF
    cleanup:
      - /share/man
    sources:
      - type: archive
        url: https://github.com/Exiv2/exiv2/archive/refs/tags/v0.28.9.tar.gz
        sha256: 700b76b97695b2fab4ef8c79619c68ae57d09e0c130724791cafbd39e0eb4aef
        x-checker-data:
          type: anitya
          project-id: 769
          stable-only: true
          url-template: https://github.com/Exiv2/exiv2/archive/refs/tags/v$version.tar.gz
        
  - name: gexiv2
    buildsystem: meson
    config-opts:
      - -Dintrospection=true
      - -Dvapi=true
      - -Dpython3=false
      - -Dtools=false
      - -Dtests=false
      - -Dgtk_doc=false
    cleanup:
      - /lib/girepository-1.0
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gexiv2/0.16/gexiv2-0.16.2.tar.xz
        sha256: aad9e240fdffbe85e390f46ee0a567e251baea5c29c3d8690260388683dc8d0a
        x-checker-data:
          type: gnome
          name: gexiv2
          stable-only: true

  - name: redux
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/dprietob/redux.git
        tag: v1.0.0
        commit: cf78ba91aa189997dc9cb65534d36b9fe9d64031
