id: io.github.LucasPicoli._8B
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: 8b

finish-args:
  # we need /dev/hidraw* in order to send configuration commands to the controller
  - --device=all
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  - name: 8b
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/8b/cargo
    build-commands:
      - cargo fetch --manifest-path Cargo.toml
      - cargo build --offline --release --locked -p gui
      - install -Dm755 target/release/8b -t ${FLATPAK_DEST}/bin
      - install -Dm644 packaging/linux/io.github.LucasPicoli._8B.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 packaging/linux/io.github.LucasPicoli._8B.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dm644 packaging/linux/io.github.LucasPicoli._8B-16.png ${FLATPAK_DEST}/share/icons/hicolor/16x16/apps/io.github.LucasPicoli._8B.png
      - install -Dm644 packaging/linux/io.github.LucasPicoli._8B-32.png ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/io.github.LucasPicoli._8B.png
      - install -Dm644 packaging/linux/io.github.LucasPicoli._8B.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.LucasPicoli._8B.png
      - install -Dm644 packaging/linux/io.github.LucasPicoli._8B.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.LucasPicoli._8B.svg
    sources:
      - type: git
        url: https://github.com/LucasPicoli/8B
        tag: v0.1.1
        commit: 21c85b6486ab231f1053fae9fde3abccbcce51cc
      - cargo-sources.json
