app-id: dev.openfield.Openfield
runtime: org.gnome.Platform
# 49 confirmed as org.flathub.Stable via `flatpak remote-info flathub
# org.gnome.Platform` on 2026-07-08. Re-verify against a real
# `flatpak remote-info` before bumping — GNOME's flathub-stable branch
# moves roughly twice a year.
runtime-version: "49"
sdk: org.gnome.Sdk
command: openfield

finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  # GPU acceleration for WebKitGTK rendering.
  - --device=dri
  # Loopback traffic (orchestrator HTTP API between agent terminals) does
  # NOT require this — it's unsandboxed within the same network namespace.
  # This grants network access for: update checks against GitHub, and any
  # spawned agent CLI (claude/aider/etc) that needs internet.
  - --share=network
  # Openfield spawns PTYs in arbitrary user-chosen CWDs (SpawnTerminal's
  # cwd param) — --filesystem=home is the idiomatic Flatpak default (same
  # pattern as VS Code's Flatpak). Projects outside $HOME need:
  #   flatpak override --filesystem=host dev.openfield.Openfield
  # See docs/DISTRIBUTION.md for the full home-vs-host tradeoff.
  - --filesystem=home

modules:
  - name: openfield
    buildsystem: simple
    build-commands:
      - install -Dm755 openfield /app/bin/openfield
      # Flatpak's export step only ships desktop files/icons whose filename
      # matches the app-id exactly — "openfield.png"/"Icon=openfield" (fine
      # for .deb/.rpm, matched loosely by any desktop environment) gets
      # silently dropped here ("non-allowed export filename"), leaving the
      # installed app with no icon anywhere (launcher, alt-tab, dock). Rename
      # to the app-id and rewrite Icon= to match, only for this module —
      # build/linux/openfield.desktop itself stays untouched for .deb/.rpm.
      - sed 's/^Icon=openfield$/Icon=dev.openfield.Openfield/' dev.openfield.Openfield.desktop > dev.openfield.Openfield.desktop.flatpak
      - install -Dm644 dev.openfield.Openfield.desktop.flatpak /app/share/applications/dev.openfield.Openfield.desktop
      # openfield.png here is the pre-resized 512x512 copy (see sources
      # below) — installing build/appicon.png's real 1024x1024 straight into
      # a 512x512 hicolor dir fails flatpak's export validation ("Image too
      # large"), and 1024x1024 as a dir name instead breaks appstreamcli
      # compose ("icon-not-found", it only recognizes standard sizes up to
      # 512). Resizing must happen outside the build sandbox (no imagemagick
      # inside org.gnome.Sdk) — see docs/DISTRIBUTION.md.
      - install -Dm644 openfield.png /app/share/icons/hicolor/512x512/apps/dev.openfield.Openfield.png
      - install -Dm644 dev.openfield.Openfield.metainfo.xml /app/share/metainfo/dev.openfield.Openfield.metainfo.xml
    sources:
      # Prebuilt binary from the same CI job that produces the AppImage —
      # not recompiled inside the sandbox.
      - type: file
        path: ../../../build/bin/openfield
        dest-filename: openfield
      - type: file
        path: ../../../build/linux/openfield.desktop
        dest-filename: dev.openfield.Openfield.desktop
      # Pre-resized to 512x512 (real appicon.png is 1024x1024, too large for
      # flatpak's icon export) — generate with:
      #   convert build/appicon.png -resize 512x512 dist/linux/flatpak/openfield-512.png
      - type: file
        path: openfield-512.png
        dest-filename: openfield.png
      - type: file
        path: dev.openfield.Openfield.metainfo.xml
