app-id: dev.openfield.Openfield
runtime: org.gnome.Platform
# 49 confirmed as org.flathub.Stable via `flatpak remote-info flathub
# org.gnome.Platform` on 2026-07-08. Re-verify against a real
# `flatpak remote-info` before bumping — GNOME's flathub-stable branch
# moves roughly twice a year.
runtime-version: "49"
sdk: org.gnome.Sdk
command: openfield

finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  # GPU acceleration for WebKitGTK rendering.
  - --device=dri
  # Loopback traffic (orchestrator HTTP API between agent terminals) does
  # NOT require this — it's unsandboxed within the same network namespace.
  # This grants network access for: fetching the app binary itself on
  # first run/update (see extra-data source below), and any spawned agent
  # CLI (claude/aider/etc) that needs internet.
  - --share=network
  # Openfield spawns PTYs in arbitrary user-chosen CWDs (SpawnTerminal's
  # cwd param) — --filesystem=home is the idiomatic Flatpak default (same
  # pattern as VS Code's Flatpak). Projects outside $HOME need:
  #   flatpak override --filesystem=host dev.openfield.Openfield
  # See docs/DISTRIBUTION.md for the full home-vs-host tradeoff.
  - --filesystem=home

modules:
  - name: openfield
    buildsystem: simple
    build-commands:
      - install -Dm755 openfield.sh /app/bin/openfield
      - install -Dm644 dev.openfield.Openfield.desktop /app/share/applications/dev.openfield.Openfield.desktop
      - install -Dm644 openfield-512.png /app/share/icons/hicolor/512x512/apps/dev.openfield.Openfield.png
      - install -Dm644 dev.openfield.Openfield.metainfo.xml /app/share/metainfo/dev.openfield.Openfield.metainfo.xml
    sources:
      # Openfield is closed-source (see LICENSE in the main repo) — Flathub
      # can't compile it in-sandbox from source like a normal module, so the
      # already-built AppImage is fetched as `extra-data`: flatpak's client
      # (not flatpak-builder) downloads this file post-build, at install/
      # update time, straight from the public releases repo, and verifies
      # it against the pinned sha256/size below. Same pattern Spotify/Slack/
      # Discord use for their proprietary Flatpaks. Lands read-only at
      # /app/extra/openfield.AppImage; openfield.sh (below) copies it to a
      # writable cache dir, chmods it there, and runs it with
      # --appimage-extract-and-run (no FUSE needed, sandbox has none).
      #
      # MAINTENANCE: bump url/sha256/size (and the <release> in the
      # metainfo) on every new tag meant to reach Flathub users — this
      # channel has no auto-update (see docs/DISTRIBUTION.md's channel
      # table), so stale pins just mean Flathub users stay on an old
      # version, not a broken build.
      - type: extra-data
        filename: openfield.AppImage
        url: https://github.com/NatanBack77/openfield-releases/releases/download/v0.1.11/openfield-x86_64.AppImage
        sha256: 0a4c5f804d65d188f96eb720979fae186fc3e09376cb5e7fcbbaaf379d53748f
        size: 34605560
        only-arches:
          - x86_64
      - type: file
        path: openfield.sh
      - type: file
        path: dev.openfield.Openfield.desktop
      - type: file
        path: openfield-512.png
      - type: file
        path: dev.openfield.Openfield.metainfo.xml
