# Flatpak manifest: repackages the official release .deb (no source build).
# Update per release: bump the url tag and sha256 (see docs/STORES.md).
id: in.superchargeai.Studio
runtime: org.gnome.Platform
runtime-version: '51'   # ships webkit2gtk-4.1 + libsoup-3, which the binary links against
sdk: org.gnome.Sdk
command: supercharge-studio
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home            # project folders and ~/.supercharge (CLI + config)
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher   # tray icon
modules:
  # Tray icon library (loaded at runtime by the app). On Flathub, add
  # https://github.com/flathub/shared-modules as a git submodule named shared-modules.
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  - name: supercharge-studio
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/supercharge-cli/supercharge-studio/releases/download/v1.0.12/supercharge-studio-linux-amd64.deb
        sha256: ec9fd87cf185b6766d00a242f1424f0f09add3975b26a361d3652fd215497885
        dest-filename: studio.deb
        only-arches: [x86_64]
      - type: file
        path: in.superchargeai.Studio.desktop
      - type: file
        path: in.superchargeai.Studio.metainfo.xml
    build-commands:
      - ar x studio.deb && tar -xf data.tar.*
      - install -Dm755 usr/bin/supercharge-studio /app/bin/supercharge-studio
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/supercharge-studio.png /app/share/icons/hicolor/32x32/apps/in.superchargeai.Studio.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/supercharge-studio.png /app/share/icons/hicolor/128x128/apps/in.superchargeai.Studio.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/supercharge-studio.png /app/share/icons/hicolor/256x256/apps/in.superchargeai.Studio.png
      - install -Dm644 in.superchargeai.Studio.desktop /app/share/applications/in.superchargeai.Studio.desktop
      - install -Dm644 in.superchargeai.Studio.metainfo.xml /app/share/metainfo/in.superchargeai.Studio.metainfo.xml
