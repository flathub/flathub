# SPDX-License-Identifier: MIT
id: io.github.elasota.aerofoil
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: AerofoilX

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --share=ipc

modules:
  - name: Aerofoil
    buildsystem: cmake
    builddir: true
    sources:
      - type: git
        url: https://github.com/elasota/Aerofoil.git
        tag: '1.1.7'
        commit: fee191e5f7845f042601a4955bdc46d0cfe4ee78
