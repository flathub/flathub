app-id: org.justiceclient.launcher
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: justice
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --filesystem=~/.justice-launcher:create
  - --env=LD_LIBRARY_PATH=/app/lib

modules:
  - name: justice
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/justice/cargo
        CARGO_TARGET_DIR: /run/build/justice/target
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/justice /app/bin/justice
      - install -Dm644 bundled-mods/justice/*.jar -t /app/lib/justice/bundled-mods/justice
      - install -Dm644 flatpak/org.justiceclient.launcher.desktop /app/share/applications/org.justiceclient.launcher.desktop
      - install -Dm644 flatpak/org.justiceclient.launcher.metainfo.xml /app/share/metainfo/org.justiceclient.launcher.metainfo.xml
      - install -Dm644 launcher/icons/icon.png /app/share/icons/hicolor/256x256/apps/org.justiceclient.launcher.png
      - mkdir -p /app/lib
      - ln -s /usr/lib/$(gcc -print-multiarch)/libbz2.so.1.0.8 /app/lib/libbz2.so.1.0
    sources:
      - type: archive
        strip-components: 0
        url: https://github.com/kapaisu/justiceclientlinuxaur/releases/download/v3.0.4/Justice-Client-3.0.4-src.tar.gz
        sha256: eb69624397aa61f5d585d6dc73514b5d1241e8ecbce7a484869910472d2b8d33
      - generated-sources.json
