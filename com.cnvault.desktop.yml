app-id: com.cnvault.desktop
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: app
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
build-options:
  append-path: /usr/lib/sdk/node20/bin:/usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/cnvault/cargo
    NPM_CONFIG_CACHE: /run/build/cnvault/npm
modules:
  - name: cnvault
    buildsystem: simple
    build-commands:
      - npm install --offline
      - npm run tauri build -- --bundles deb
      - install -Dm755 src-tauri/target/release/app /app/bin/app
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.cnvault.desktop.png
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/com.cnvault.desktop.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/256x256@2/apps/com.cnvault.desktop.png
    sources:
      - type: dir
        path: vault-app
      - cargo-sources.json
      - node-sources.json
