app-id: com.overwolf.curseforge
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
separate-locales: false
command: curseforge
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
tags:
  - proprietary

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar

modules:
  - name: curseforge
    buildsystem: simple
    build-commands:
      - install -Dm755 curseforge.sh "${FLATPAK_DEST}/bin/curseforge"
      - cp -a share/. "${FLATPAK_DEST}/share/"
      - rm -rf share curseforge.sh
      - mkdir -p "${FLATPAK_DEST}/curseforge"
      - cp -a . "${FLATPAK_DEST}/curseforge/"
    sources:
      - type: archive
        url: https://curseforge.overwolf.com/electron/linux/versions/1.320.0.39237/CurseForge-1.320.0-39237.tar.gz
        sha512: 48b2cd62bb07a6e1a6ce8f3ce4ea9839f445ba2548457de8db062aa05fe78bfe363e52981c2751c91d18c2f35c4dda4ae536614488c55e9ca32316d35aa7cdc8
        strip-components: 1
        only-arches: [x86_64]
        x-checker-data:
          type: json
          is-main-source: true
          url: https://curseforge.overwolf.com/electron/linux/flathub-latest.json
          version-query: .version
          url-query: .url
      - type: file
        path: curseforge.sh
