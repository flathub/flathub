app-id: com.overwolf.curseforge
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
separate-locales: false
command: curseforge
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
tags:
  - proprietary

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar

modules:
  - name: curseforge
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra "${FLATPAK_DEST}/bin/apply_extra"
      - install -Dm755 curseforge.sh "${FLATPAK_DEST}/bin/curseforge"
      - install -Dm644 com.overwolf.curseforge.desktop "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - install -Dm644 com.overwolf.curseforge.metainfo.xml "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
      - install -Dm644 curseforge-eula.txt "${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/curseforge-eula.txt"
      - |
        for s in 64 128 256 512; do
          install -Dm644 "icons/${s}x${s}/apps/com.overwolf.curseforge.png" \
            "${FLATPAK_DEST}/share/icons/hicolor/${s}x${s}/apps/${FLATPAK_ID}.png"
        done
    sources:
      - type: extra-data
        url: https://curseforge.overwolf.com/electron/linux/versions/1.320.0.39237/CurseForge-1.320.0-39237.tar.gz
        sha256: df30d648b854f4386d80b6097c21887e7a67796ab1614691cc8955377f07aae9
        size: 142756547
        filename: curseforge.tar.gz
        only-arches: [x86_64]
        x-checker-data:
          type: json
          is-main-source: true
          url: https://curseforge.overwolf.com/electron/linux/flathub-latest.json
          version-query: .version
          url-query: .url
      - type: script
        commands:
          - '#!/bin/sh'
          - 'set -e'
          - 'mkdir -p main'
          - 'tar xzf curseforge.tar.gz -C main --strip-components=1'
          - 'rm curseforge.tar.gz'
        dest-filename: apply_extra
      - type: file
        path: curseforge-eula.txt
      - type: file
        path: curseforge.sh
      - type: file
        path: com.overwolf.curseforge.desktop
      - type: file
        path: com.overwolf.curseforge.metainfo.xml
      - type: dir
        path: icons
        dest: icons
