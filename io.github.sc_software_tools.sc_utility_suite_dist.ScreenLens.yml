app-id: io.github.sc_software_tools.sc_utility_suite_dist.ScreenLens
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: sc-screen-lens
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.secrets
  - --socket=pulseaudio
  - --socket=wayland
modules:
  - name: libportal
    buildsystem: meson
    config-opts: [-Dbackend-gtk3=disabled, -Dbackend-gtk4=disabled, -Dbackend-qt5=disabled, -Dbackend-qt6=disabled,
                  -Dportal-tests=false, -Dintrospection=false, -Dvapi=false, -Ddocs=false, -Dtests=false]
    sources:
      - type: git
        url: https://github.com/flatpak/libportal.git
        tag: '0.9.1'
        commit: 8f5dc8d192f6e31dafe69e35219e3b707bde71ce
  - name: sc-screen-lens
    buildsystem: simple
    build-commands:
      - mkdir -p /app/ScreenLens && cp -r . /app/ScreenLens/ && rm -f /app/ScreenLens/*.pdb /app/ScreenLens/*.desktop /app/ScreenLens/*.svg
      - install -Dm755 sc-screen-lens.sh /app/bin/sc-screen-lens
      - install -Dm644 sc-screen-lens.svg /app/share/icons/hicolor/scalable/apps/io.github.sc_software_tools.sc_utility_suite_dist.ScreenLens.svg
      - desktop-file-edit --set-key=Exec --set-value='sc-screen-lens %F' --set-icon=io.github.sc_software_tools.sc_utility_suite_dist.ScreenLens --set-key=StartupWMClass --set-value=ScreenLens.Desktop sc-screen-lens.desktop && install -Dm644 sc-screen-lens.desktop /app/share/applications/io.github.sc_software_tools.sc_utility_suite_dist.ScreenLens.desktop
      - install -Dm644 io.github.sc_software_tools.sc_utility_suite_dist.ScreenLens.metainfo.xml /app/share/metainfo/io.github.sc_software_tools.sc_utility_suite_dist.ScreenLens.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/sc-software-tools/sc-utility-suite-dist/releases/download/suite-v1.1.2/ScreenLens-1.1.2-linux-x64.tar.gz
        sha256: 552769e11269e82a38611c12e109bed76db591742dcc900ccc8c0a25007b3532
        strip-components: 1
      - type: file
        path: sc-screen-lens.sh
      - type: file
        path: io.github.sc_software_tools.sc_utility_suite_dist.ScreenLens.metainfo.xml
