app-id: org.google.Antigravity
runtime: org.gnome.Platform
runtime-version: '45'
sdk: org.gnome.Sdk
command: antigravity
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=host
modules:
  - name: antigravity
    buildsystem: simple
    build-commands:
      # 1. Create directories for app files, bin, desktop entry, metainfo, icon, and licenses
      - install -d /app/lib/antigravity/
      - install -d /app/bin/
      - install -d /app/share/applications/
      - install -d /app/share/metainfo/
      - install -d /app/share/icons/hicolor/512x512/apps/
      - install -d /app/share/licenses/org.google.Antigravity/

      # 2. Copy the extracted app files to the lib directory
      - cp -r . /app/lib/antigravity/

      # 3. Install the wrapper script, desktop file, metainfo, icon, and license files
      - install -m755 antigravity-wrapper.sh /app/bin/antigravity
      - install -m644 org.google.Antigravity.desktop /app/share/applications/org.google.Antigravity.desktop
      - install -m644 org.google.Antigravity.metainfo.xml /app/share/metainfo/org.google.Antigravity.metainfo.xml
      - install -m644 org.google.Antigravity.png /app/share/icons/hicolor/512x512/apps/org.google.Antigravity.png
      - cp /app/lib/antigravity/LICENSE.electron.txt /app/lib/antigravity/LICENSES.chromium.html /app/share/licenses/org.google.Antigravity/
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://storage.googleapis.com/antigravity-public/antigravity-hub/2.0.11-6560309696135168/linux-x64/Antigravity.tar.gz
        sha256: a1b2b5bf0de5f4304c29897f81aa69cb8c56e8a29570a962b95387ebc72bd951
        strip-components: 1
      - type: archive
        only-arches: [aarch64]
        url: https://storage.googleapis.com/antigravity-public/antigravity-hub/2.0.11-6560309696135168/linux-arm/Antigravity.tar.gz
        sha256: 595d7e0fba5c68a480b0124c31bb0d503ebd49d0edaf139459ffc1d1f4a6f3cc
        strip-components: 1
      - type: file
        path: antigravity-wrapper.sh
      - type: file
        path: org.google.Antigravity.desktop
      - type: file
        path: org.google.Antigravity.metainfo.xml
      - type: file
        path: org.google.Antigravity.png
