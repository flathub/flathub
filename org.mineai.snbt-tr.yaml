app-id: org.mineai.snbt-tr
runtime: org.kde.Platform
runtime-version: 6.6
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.6'
command: snbt-tr
build-options:
  env:
    PYTHONPATH: /app/lib/python3.11/site-packages
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --share=network
  - --filesystem=host
modules:
  - python3-requirements.json
  - name: snbt-tr
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --prefix=/app .
    sources:
      - type: dir
        path: ..
