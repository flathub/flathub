# Flatpak manifest for Flathub.
# App ID: ca.statis.GestionFlow
# Ships the official amd64 .deb from GitHub Releases (proprietary binary).
id: ca.statis.GestionFlow
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
command: gestionflow
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
modules:
  - name: gestionflow
    buildsystem: simple
    sources:
      - type: file
        path: ca.statis.GestionFlow.metainfo.xml
      - type: file
        path: ca.statis.GestionFlow.desktop
      - type: file
        path: icons/ca.statis.GestionFlow-512.png
        dest-filename: icon-512.png
      - type: file
        url: https://github.com/Katrina999991/thrive-invoice-hub/releases/download/v0.1.1/GestionFlow_0.1.1_amd64.deb
        sha256: 53e8eaed25b5a3ee1020b20d0fdfae21d019d833137f795536c963d24139177e
        dest-filename: gestionflow.deb
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Katrina999991/thrive-invoice-hub/releases/latest
          tag-query: .tag_name
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("amd64\\.deb$")) | .browser_download_url
    build-commands:
      - set -e
      - mkdir -p deb-extract
      - sh -c 'cd deb-extract && ar x ../gestionflow.deb && tar -xf data.tar.*'
      - install -Dm755 deb-extract/usr/bin/gestionflow /app/bin/gestionflow
      - install -Dm644 ca.statis.GestionFlow.desktop /app/share/applications/ca.statis.GestionFlow.desktop
      - install -Dm644 ca.statis.GestionFlow.metainfo.xml /app/share/metainfo/ca.statis.GestionFlow.metainfo.xml
      - install -Dm644 deb-extract/usr/share/icons/hicolor/32x32/apps/gestionflow.png /app/share/icons/hicolor/32x32/apps/ca.statis.GestionFlow.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/128x128/apps/gestionflow.png /app/share/icons/hicolor/128x128/apps/ca.statis.GestionFlow.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/256x256@2/apps/gestionflow.png /app/share/icons/hicolor/256x256/apps/ca.statis.GestionFlow.png
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/ca.statis.GestionFlow.png
