# Flathub submission manifest — SAI Statistics (com.saibilisim.saistatistics).
#
# SAI Statistics is closed-source, so the application is NOT built from source on
# Flathub: it uses the `extra-data` source type, the Flathub-sanctioned route for
# non-redistributable binaries (the user's Flatpak downloads the official .deb
# from the vendor and unpacks it with `apply_extra`). The PR therefore contains
# only this manifest, the .desktop file, the MetaInfo, the icon and the launcher.
#
# Fill url / sha256 / size from the .deb actually published (they change every
# release):  node flatpak/flathub/update-manifest.cjs <deb> <public-url>
#
# Local test (serves the .deb over http):  see flatpak/flathub/README.md

app-id: com.saibilisim.saistatistics
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: sai-statistics
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # AI assistant (SAI account) and sample-data/update-info requests.
  - --share=network
  # Data files are chosen through the file-chooser portal (GTK_USE_PORTAL in the
  # launcher); these cover the usual places a dataset lives without --filesystem=host.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-desktop
  - --talk-name=org.freedesktop.Notifications
  # Electron's safeStorage keeps the user's SAI account session in the system keyring
  # (Secret Service, backend gnome_libsecret — talks D-Bus directly, no portal path).
  # Without this the app cannot store the session and asks for sign-in on every start.
  - --talk-name=org.freedesktop.secrets

modules:
  - name: sai-statistics
    buildsystem: simple
    build-commands:
      - install -Dm755 sai-statistics.sh /app/bin/sai-statistics
      - install -Dm644 com.saibilisim.saistatistics.desktop -t /app/share/applications
      - install -Dm644 com.saibilisim.saistatistics.metainfo.xml -t /app/share/metainfo
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/com.saibilisim.saistatistics.png
      # Unpacked at install time into /app/extra by apply_extra below.
      - install -Dm755 apply_extra -t /app/bin
    sources:
      - type: file
        path: sai-statistics.sh
      - type: file
        path: com.saibilisim.saistatistics.desktop
      - type: file
        path: com.saibilisim.saistatistics.metainfo.xml
      - type: file
        path: icon-512.png
      - type: script
        dest-filename: apply_extra
        commands:
          - set -e
          # The .deb ships the app under "opt/SAI Statistics"; keep only that tree
          # (desktop/menu entries are provided by this manifest instead).
          - bsdtar -Oxf sai-statistics.deb 'data.tar*' | bsdtar -xf - ./opt
          - mv "opt/SAI Statistics" sai-statistics
          - rm -rf opt sai-statistics.deb
      - type: extra-data
        filename: sai-statistics.deb
        url: https://api.saistatistics.com/downloads/linux/sai-statistics_0.2.29_amd64.deb
        sha256: 'edacf2ee4dce0248bcc967e5baba26a5d3fbc6008884e6b94f74f8d91abcaa03'
        size: 350261968
