# Flatpak manifest for InstantDj. Repackages the self-contained linux-x64 bundle
# from the GitHub release; nothing is compiled during the Flatpak build.
app-id: io.github.appshines.InstantDj
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: instantdj
finish-args:
  # Avalonia UI: X11 with Wayland fallback path, GPU access, shared memory.
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Audio playback on the main and headphone outputs.
  - --socket=pulseaudio
  # Smartphone remote control and live audio streaming run over the local network.
  - --share=network
  # The song browser works directly on local drives, custom folders and USB media.
  - --filesystem=host
modules:
  - name: instantdj
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/instantdj
      - cp -a app/. /app/lib/instantdj/
      - install -Dm755 instantdj-launcher.sh /app/bin/instantdj
      - install -Dm644 io.github.appshines.InstantDj.desktop /app/share/applications/io.github.appshines.InstantDj.desktop
      - install -Dm644 io.github.appshines.InstantDj.png /app/share/icons/hicolor/512x512/apps/io.github.appshines.InstantDj.png
      - install -Dm644 io.github.appshines.InstantDj.metainfo.xml /app/share/metainfo/io.github.appshines.InstantDj.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/Appshines/InstantDj/releases/download/v1.0.6/InstantDj-1.0.6-linux-x64.tar.gz
        sha256: 50cff3791bc8b01834baa54e1f94081fdb47b139c83ceb1123d2be6017789170
        dest: app
      - type: file
        path: instantdj-launcher.sh
      - type: file
        path: io.github.appshines.InstantDj.desktop
      - type: file
        path: io.github.appshines.InstantDj.png
      - type: file
        path: io.github.appshines.InstantDj.metainfo.xml
