app-id: io.github.appshines.InstantDj
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: instantdj
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Smartphone remote control and live audio streaming on the local network.
  - --share=network
  # The song browser manages the music library in the user's music folder and on
  # removable media (USB drives), including writing playlist files next to the songs.
  - --filesystem=xdg-music
  - --filesystem=/run/media
modules:
  - name: instantdj
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/instantdj /app/bin
      - cp -a app/. /app/lib/instantdj/
      - ln -s /app/lib/instantdj/InstantDj /app/bin/instantdj
      - install -Dm644 -t /app/share/applications io.github.appshines.InstantDj.desktop
      - install -Dm644 io.github.appshines.InstantDj.png /app/share/icons/hicolor/512x512/apps/io.github.appshines.InstantDj.png
      - install -Dm644 -t /app/share/metainfo io.github.appshines.InstantDj.metainfo.xml
    sources:
      # Official self-contained release binaries; nothing is compiled here.
      - type: archive
        url: https://github.com/Appshines/InstantDj/releases/download/v1.0.6/InstantDj-1.0.6-linux-x64.tar.gz
        sha256: 50cff3791bc8b01834baa54e1f94081fdb47b139c83ceb1123d2be6017789170
        dest: app
      - type: file
        url: https://raw.githubusercontent.com/Appshines/InstantDj/6ae2cef4e83c374866f3c8cb2e88c463029e637b/Flatpak/io.github.appshines.InstantDj.desktop
        sha256: 5aebe09e2ec536da35920aa064750a60a3c73265a746be6dfed5fa5a09aaae9e
      - type: file
        url: https://raw.githubusercontent.com/Appshines/InstantDj/6ae2cef4e83c374866f3c8cb2e88c463029e637b/Flatpak/io.github.appshines.InstantDj.png
        sha256: e0be24c260d26a122cfaf0a5baf417a7e4d7151be2d80550aefa9d09b5accd53
      - type: file
        url: https://raw.githubusercontent.com/Appshines/InstantDj/6ae2cef4e83c374866f3c8cb2e88c463029e637b/Flatpak/io.github.appshines.InstantDj.metainfo.xml
