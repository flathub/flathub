# Flathub manifest for Dalfin desktop (x86_64 proprietary Electron binary).
#
# App ID must NOT end with lowercase ".desktop" (Flathub linter).
# See FLATHUB.md

id: ai.dalfin.Dalfin
runtime: org.freedesktop.Platform
# Stay on 24.08 — Flathub CI failed installing Sdk 26.08 (HTTP/2 CDN errors).
# Runtime-update to 26.08 was a linter warning only; retry when Flathub mirrors are healthy.
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: dalfin
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Full --filesystem=home fails Flathub lint (finish-args-home-filesystem-access).
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets

modules:
  - name: dalfin
    buildsystem: simple
    build-commands:
      - install -d /app/lib/dalfin
      - cp -a linux-unpacked/. /app/lib/dalfin/
      - install -Dm755 dalfin-launch.sh /app/bin/dalfin
      - install -Dm644 ai.dalfin.Dalfin.desktop /app/share/applications/ai.dalfin.Dalfin.desktop
      - install -Dm644 ai.dalfin.Dalfin.metainfo.xml /app/share/metainfo/ai.dalfin.Dalfin.metainfo.xml
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/ai.dalfin.Dalfin.png
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/ai.dalfin.Dalfin.png
      - install -Dm644 icon-64.png /app/share/icons/hicolor/64x64/apps/ai.dalfin.Dalfin.png
      - chmod -R a+rX /app/lib/dalfin
    sources:
      - type: archive
        url: https://desktop-dev-dalfin-917593900241.s3.ap-south-1.amazonaws.com/desktop-linux/dalfin-1.0.0-linux-x64.tar.xz
        sha256: 53635650b7033c4a3b76ec90d3216a5fb2c9bfc092f78bb40b66afcf4d395c48
        dest: linux-unpacked
      - type: file
        path: dalfin-launch.sh
      - type: file
        path: ai.dalfin.Dalfin.desktop
      - type: file
        path: ai.dalfin.Dalfin.metainfo.xml
      - type: file
        path: icon-256.png
      - type: file
        path: icon-128.png
      - type: file
        path: icon-64.png
