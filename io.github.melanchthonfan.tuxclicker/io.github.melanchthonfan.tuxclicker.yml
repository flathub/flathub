app-id: io.github.melanchthonfan.tuxclicker
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: TuxClicker

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: tux-clicker
    buildsystem: simple
    build-commands:
      - install -Dm755 Tux.Clicker.x86_64 /app/bin/TuxClicker
      - install -Dm644 Tux.Clicker.pck /app/bin/TuxClicker.pck
      - install -Dm644 io.github.melanchthonfan.tuxclicker.desktop /app/share/applications/io.github.melanchthonfan.tuxclicker.desktop
      - install -Dm644 io.github.melanchthonfan.tuxclicker.metainfo.xml /app/share/metainfo/io.github.melanchthonfan.tuxclicker.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/io.github.melanchthonfan.tuxclicker.png
    sources:
      - type: archive
        url: https://github.com/melanchthonfan/tuxclicker/releases/download/v1.0/Tux.Clicker.x86_64
        sha256: edaf3670eefe230dc711319e7bd4d08e546652a1c93922910d07baaf2d775fa0
      - type: archive
        url: https://github.com/melanchthonfan/tuxclicker/releases/download/v1.0/Tux.Clicker.pck
        sha256: e5e0d805d6dbcd761c758bc5525cf0542b08c6f6333f2423f942029aeac1ea2a
      - type: file
        path: io.github.melanchthonfan.tuxclicker.desktop
      - type: file
        path: io.github.melanchthonfan.tuxclicker.metainfo.xml
      - type: file
        path: icon.png
