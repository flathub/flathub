app-id: ai.loomfy.Loomfy
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: loomfy

finish-args:
  - --socket=x11
  - --share=ipc
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --persist=.config/Loomfy
  - --persist=.local/share/Loomfy

modules:
  - name: loomfy
    buildsystem: simple
    build-commands:
      - cp -a . /app
    sources:
      - type: archive
        url: https://dl.loomfy.ai/releases/v1.5.2/Loomfy-1.5.2-x64.tar.gz
        sha256: 6019105386a572e6892bf8a08df93dff191160d5183a58f8c68eeb4d5729f406
        x-checker-data:
          type: html
          url: https://dl.loomfy.ai/apt/dists/stable/main/binary-amd64/Packages
          version-pattern: 'Version: ([\d.]+)'
          url-template: https://dl.loomfy.ai/releases/v$version/Loomfy-$version-x64.tar.gz
