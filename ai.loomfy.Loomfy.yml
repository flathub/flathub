app-id: ai.loomfy.Loomfy
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: loomfy

finish-args:
  - --socket=x11
  - --share=ipc
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  # The local database is encrypted; its key lives in the OS keyring.
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

modules:
  - name: loomfy
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 loomfy-wrapper /app/bin/loomfy
      - install -Dm644 ai.loomfy.Loomfy.desktop /app/share/applications/ai.loomfy.Loomfy.desktop
      - install -Dm644 ai.loomfy.Loomfy.metainfo.xml /app/share/metainfo/ai.loomfy.Loomfy.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/ai.loomfy.Loomfy.png
    sources:
      - type: extra-data
        filename: loomfy.deb
        url: https://dl.loomfy.ai/releases/v1.5.0/Loomfy-1.5.0-x64.deb
        sha256: acb007f02e904eee33d3083a78265cb334c99770cfaf3d4f856d814d9274a3bc
        size: 171251670
        x-checker-data:
          type: html
          url: https://dl.loomfy.ai/apt/dists/stable/main/binary-amd64/Packages
          version-pattern: 'Version: ([\d.]+)'
          url-template: https://dl.loomfy.ai/releases/v$version/Loomfy-$version-x64.deb
      - type: file
        path: apply_extra
      - type: file
        path: loomfy-wrapper
      - type: file
        path: ai.loomfy.Loomfy.desktop
      - type: file
        path: ai.loomfy.Loomfy.metainfo.xml
      - type: file
        path: icon-512.png
