app-id: dev.manufloso.sim_65c02
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: SIM_65C02

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home
  - --env=MOS_CLANG=/app/toolchain/bin/mos-common-clang
  - --env=PYTHONPATH=/app/lib/python3.14/site-packages

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /lib/*.a
  - /lib/*.la
  - /lib64
  - /share/man
  - /share/info
  - /share/doc
  - /toolchain/examples
  - /toolchain/include
  - /toolchain/lib/cmake
  - /toolchain/lib/*.a
  - /toolchain/share

modules:
  - name: dosfstools
    buildsystem: autotools
    config-opts:
      - --sbindir=/app/bin
      - --enable-compat-symlinks
    sources:
      - type: git
        url: https://github.com/dosfstools/dosfstools.git
        tag: v4.2
        commit: 697f7692c951173c1b732901e13f72bd3182d575
        disable-lfs: true
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: mtools
    buildsystem: autotools
    config-opts:
      - --disable-floppyd
      - --without-x
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/mtools/mtools-4.0.50.tar.bz2
        sha256: f3a58e6cfc2634b03c240442548e3b00103692357afc28e1e7104744dd6478b5
        x-checker-data:
          type: anitya
          project-id: 2028
          stable-only: true
          url-template: https://ftp.gnu.org/gnu/mtools/mtools-$version.tar.bz2

  - python3-modules.yml

  - name: llvm-mos
    buildsystem: cmake-ninja
    builddir: true
    subdir: llvm
    build-options:
      no-debuginfo: true
      cflags: -g0
      cxxflags: -g0
    make-args:
      - distribution
    no-make-install: true
    post-install:
      - ninja -C /run/build/llvm-mos/llvm/_flatpak_build install-distribution
    config-opts:
      - -C /run/build/llvm-mos/clang/cmake/caches/MOS.cmake
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app/toolchain
      - -DCMAKE_SKIP_INSTALL_ALL_DEPENDENCY=ON
      - -DLLVM_ENABLE_ASSERTIONS=OFF
      - -DLLVM_INCLUDE_TESTS=OFF
      - -DLLVM_INCLUDE_EXAMPLES=OFF
      - -DLLVM_INCLUDE_BENCHMARKS=OFF
      - -DLLVM_INCLUDE_DOCS=OFF
      - -DLLVM_BUILD_UTILS=OFF
      - -DCLANG_ENABLE_STATIC_ANALYZER=OFF
      - -DCLANG_ENABLE_OBJC_REWRITER=OFF
      - -DCLANG_ENABLE_CIR=OFF
      - -DLLVM_PARALLEL_LINK_JOBS=2
      - -DBUILTINS_mos-unknown-unknown_CMAKE_C_FLAGS=
      - -DBUILTINS_mos-unknown-unknown_CMAKE_CXX_FLAGS=
      - -DBUILTINS_mos-unknown-unknown_CMAKE_ASM_FLAGS=
      - -DBUILTINS_mos-unknown-unknown_CMAKE_EXE_LINKER_FLAGS=
      - -DBUILTINS_mos-unknown-unknown_CMAKE_SHARED_LINKER_FLAGS=
      - -DBUILTINS_mos-unknown-unknown_CMAKE_MODULE_LINKER_FLAGS=
      - -DRUNTIMES_mos-unknown-unknown_CMAKE_C_FLAGS=
      - -DRUNTIMES_mos-unknown-unknown_CMAKE_CXX_FLAGS=
      - -DRUNTIMES_mos-unknown-unknown_CMAKE_ASM_FLAGS=
      - -DRUNTIMES_mos-unknown-unknown_CMAKE_EXE_LINKER_FLAGS=
      - -DRUNTIMES_mos-unknown-unknown_CMAKE_SHARED_LINKER_FLAGS=
      - -DRUNTIMES_mos-unknown-unknown_CMAKE_MODULE_LINKER_FLAGS=
    sources:
      - type: git
        url: https://github.com/llvm-mos/llvm-mos.git
        commit: a40207a371b60ff787ece46817d9c0f62eada719
        disable-lfs: true
      - type: shell
        commands:
          - sed -i 's/;clang-tools-extra//g; /clang-apply-replacements/d; /clang-format/d; /clang-include-fixer/d; /clang-refactor/d; /clang-scan-deps/d; /clang-tidy/d; /clangd/d; /find-all-symbols/d' clang/cmake/caches/MOS.cmake

  - name: llvm-mos-sdk
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      no-debuginfo: true
      prepend-path: /app/toolchain/bin
      env:
        CFLAGS: ''
        CXXFLAGS: ''
        LDFLAGS: ''
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app/toolchain
      - -DLLVM_MOS=/app/toolchain
      - -DCMAKE_C_FLAGS=
      - -DCMAKE_CXX_FLAGS=
      - -DCMAKE_ASM_FLAGS=
      - -DCMAKE_EXE_LINKER_FLAGS=
      - -DCMAKE_SHARED_LINKER_FLAGS=
      - -DCMAKE_MODULE_LINKER_FLAGS=
    sources:
      - type: git
        url: https://github.com/llvm-mos/llvm-mos-sdk.git
        tag: v23.4.0
        commit: 327de902ffc49f8455ca5447b7682bc77be5de05
        disable-lfs: true
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: cc65
    buildsystem: simple
    cleanup:
      - /bin/ca65
      - /bin/ld65
    build-commands:
      - sed -i 's/-Werror//g' src/Makefile
      - make -C src -j${FLATPAK_BUILDER_N_JOBS} ca65 ld65
      - install -Dm755 -t /app/bin bin/ca65 bin/ld65
    sources:
      - type: archive
        url: https://github.com/cc65/cc65/archive/refs/tags/V2.19.tar.gz
        sha256: 157b8051aed7f534e5093471e734e7a95e509c577324099c3c81324ed9d0de77

  - name: sim_65c02
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      env:
        PYTHONPATH: /app/lib/python3.14/site-packages
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_UNIT_TESTS=OFF
      - -DBUILD_SDK_BUNDLE=ON
      - -DUSE_SYSTEM_SDL3=ON
      - -DLLVM_MOS_DIR=/app/toolchain/bin
      - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
    sources:
      # Main emulator & IDE repository (master branch)
      - type: git
        url: https://github.com/ManuFlosoYT/65c02-SIM.git
        tag: v2.5.2
        commit: cadc107bd7fbce8134325885981a0b2b7e4b8051
        disable-lfs: true
      - type: git
        url: https://github.com/ocornut/imgui.git
        tag: v1.93.0
        commit: c1aaac65e896a45f81f47a4d68f9959e0f86c859
        dest: _flatpak_deps/imgui
        disable-lfs: true
      - type: git
        url: https://github.com/aiekick/ImGuiFileDialog.git
        tag: v0.6.8
        commit: ee77f190861193a995435c388682f1512f6fd29a
        dest: _flatpak_deps/imguifiledialog
        disable-lfs: true
      - type: git
        url: https://github.com/BalazsJako/ImGuiColorTextEdit.git
        commit: ca2f9f1462e3b60e56351bc466acda448c5ea50d
        dest: _flatpak_deps/imguicolortextedit
        disable-lfs: true
      - type: git
        url: https://github.com/nlohmann/json.git
        tag: v3.12.0
        commit: 55f93686c01528224f448c19128836e7df245f72
        dest: _flatpak_deps/json
        disable-lfs: true
      - type: git
        url: https://github.com/Dav1dde/glad.git
        tag: v2.0.8
        commit: 73db193f853e2ee079bf3ca8a64aa2eaf6459043
        dest: _flatpak_deps/glad
        disable-lfs: true
      - type: git
        url: https://github.com/richgel999/miniz.git
        tag: 3.1.2
        commit: 77d0dce8627735138c51770d1799a1ef48f2117d
        dest: _flatpak_deps/miniz
        disable-lfs: true
      - type: git
        url: https://github.com/chriskohlhoff/asio.git
        tag: asio-1-39-0
        commit: 190a8d8daf1cc62909b4e0c72ff491ba264ca98e
        dest: _flatpak_deps/asio
        disable-lfs: true
      - type: git
        url: https://github.com/yhirose/cpp-httplib.git
        tag: v0.66.0
        commit: cdcd2ac6e6d5548b5a9130fb39ab76d2c6c614b0
        dest: _flatpak_deps/httplib
        disable-lfs: true
