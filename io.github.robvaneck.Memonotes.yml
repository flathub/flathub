app-id: io.github.robvaneck.Memonotes
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: memonotes
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/memonotes/cargo
modules:
  - name: memonotes
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose --features gtk-ui --bin memonotes
      - install -Dm755 target/release/memonotes -t /app/bin
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/io.github.robvaneck.Memonotes.svg
      - install -Dm644 packaging/io.github.robvaneck.Memonotes.desktop -t /app/share/applications
      - install -Dm644 packaging/io.github.robvaneck.Memonotes.metainfo.xml -t /app/share/metainfo
    sources:
      - type: git
        url: https://github.com/robvaneck/memonotes.git
        tag: v0.1.0
        commit: 5c8446603761b0b376233b4f1510406c658d41f6
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - cargo-sources.json
