app-id: io.github.dork40.Lectern
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: lectern
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  # finding and streaming to Chromecast / Google TV devices on the local network, and cover art lookups
  - --share=network
  # audiobooks usually live in Music; other folders are added through the file chooser portal
  - --filesystem=xdg-music:ro
  - --own-name=org.mpris.MediaPlayer2.lectern
modules:
  - python3-deps.json

  - name: lectern
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-deps --no-build-isolation .
      - install -Dm644 data/${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm644 data/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
      - install -Dm644 data/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/
      - install -Dm644 data/icons/hicolor/symbolic/apps/${FLATPAK_ID}-symbolic.svg -t ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/
    sources:
      - type: git
        url: https://github.com/dork40/lectern.git
        tag: v0.8.1
        commit: f50ccaf82d37ca5cbfb89ec475464779a43a0faa
