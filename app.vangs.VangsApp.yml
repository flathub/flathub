app-id: app.vangs.VangsApp
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: run.sh
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.secrets
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto

modules:
  - name: vangs-app
    buildsystem: simple
    build-commands:
      - cp -r main /app/main
      - chmod -R a-s,go+rX,go-w /app/main
      - install -Dm755 run.sh /app/bin/run.sh
      - install -Dm644 app.vangs.VangsApp.desktop /app/share/applications/app.vangs.VangsApp.desktop
      - install -Dm644 app.vangs.VangsApp.metainfo.xml /app/share/metainfo/app.vangs.VangsApp.metainfo.xml
      - install -Dm644 app.vangs.VangsApp.png /app/share/icons/hicolor/512x512/apps/app.vangs.VangsApp.png
    sources:
      - type: archive
        only-arches:
          - x86_64
        dest: main
        url: https://storage.googleapis.com/vangarments-storage/releases/linux/x64/Vangs%20App.tar.gz
        sha256: 371545b824b63526942cab62b5b677d8af23d2b0b304b8b061061872f52a2972
      - type: file
        path: app.vangs.VangsApp.desktop
      - type: file
        path: app.vangs.VangsApp.metainfo.xml
      - type: file
        path: app.vangs.VangsApp.png
      - type: script
        dest-filename: run.sh
        commands:
          - |
            if [ -x "/app/main/vangs-app" ]; then
              exec zypak-wrapper "/app/main/vangs-app" "$@"
            else
              exec zypak-wrapper "/app/main/Vangs App" "$@"
            fi
