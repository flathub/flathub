app-id: io.github.sc_software_tools.sc_utility_suite_dist.DupScrub
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: sc-dup-scrub
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.secrets
modules:
  - name: sc-dup-scrub
    buildsystem: simple
    build-commands:
      - mkdir -p /app/DupScrub && cp -r . /app/DupScrub/ && rm -f /app/DupScrub/*.pdb /app/DupScrub/*.desktop /app/DupScrub/*.svg
      - install -Dm755 sc-dup-scrub.sh /app/bin/sc-dup-scrub
      - install -Dm644 sc-dup-scrub.svg /app/share/icons/hicolor/scalable/apps/io.github.sc_software_tools.sc_utility_suite_dist.DupScrub.svg
      - desktop-file-edit --set-key=Exec --set-value='sc-dup-scrub %F' --set-icon=io.github.sc_software_tools.sc_utility_suite_dist.DupScrub --set-key=StartupWMClass --set-value=DupScrub.Desktop sc-dup-scrub.desktop && install -Dm644 sc-dup-scrub.desktop /app/share/applications/io.github.sc_software_tools.sc_utility_suite_dist.DupScrub.desktop
      - install -Dm644 io.github.sc_software_tools.sc_utility_suite_dist.DupScrub.metainfo.xml /app/share/metainfo/io.github.sc_software_tools.sc_utility_suite_dist.DupScrub.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/sc-software-tools/sc-utility-suite-dist/releases/download/suite-v1.1.2/DupScrub-1.1.2-linux-x64.tar.gz
        sha256: 1b7258794c057f5b1fe2dc7844fc8a09642c492f38e099191c79dab3854578c0
        strip-components: 1
      - type: file
        path: sc-dup-scrub.sh
      - type: file
        path: io.github.sc_software_tools.sc_utility_suite_dist.DupScrub.metainfo.xml
