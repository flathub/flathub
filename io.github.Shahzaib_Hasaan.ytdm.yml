app-id: io.github.Shahzaib_Hasaan.ytdm
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: ytdm
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --share=network
  - --device=dri
  # Save completed videos where users expect them
  - --filesystem=xdg-download
  # System tray
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: ytdm
    buildsystem: simple
    build-commands:
      - ar x ytdm_amd64.deb
      - tar -xf data.tar.xz
      - cp -r opt/YTDM /app/main
      - install -Dm755 ytdm.sh /app/bin/ytdm
      - install -Dm644 usr/share/icons/hicolor/512x512/apps/ytdm.png /app/share/icons/hicolor/512x512/apps/io.github.Shahzaib_Hasaan.ytdm.png
      - install -Dm644 io.github.Shahzaib_Hasaan.ytdm.desktop /app/share/applications/io.github.Shahzaib_Hasaan.ytdm.desktop
      - install -Dm644 io.github.Shahzaib_Hasaan.ytdm.metainfo.xml /app/share/metainfo/io.github.Shahzaib_Hasaan.ytdm.metainfo.xml
    sources:
      - type: file
        url: https://github.com/Shahzaib-Hasaan/ytdm/releases/download/v1.1.1/ytdm_1.1.1_amd64.deb
        sha256: 05eaaa754d164a982abe5191bcf49dcbce306b24a9e5e07758e2f53edac089b1
        dest-filename: ytdm_amd64.deb
      - type: script
        dest-filename: ytdm.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/main/ytdm "$@"
      - type: file
        path: io.github.Shahzaib_Hasaan.ytdm.desktop
      - type: file
        path: io.github.Shahzaib_Hasaan.ytdm.metainfo.xml
