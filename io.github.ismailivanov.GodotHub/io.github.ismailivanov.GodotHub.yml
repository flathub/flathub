app-id: io.github.ismailivanov.GodotHub
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: godot-hub

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home

modules:
  - name: godot-hub
    buildsystem: simple
    build-commands:
      - unzip Linux.zip -d linux-build
      - install -Dm755 linux-build/GodotHub.x86_64 /app/bin/godot-hub
      - install -Dm644 io.github.ismailivanov.GodotHub.desktop
          /app/share/applications/io.github.ismailivanov.GodotHub.desktop
      - install -Dm644 io.github.ismailivanov.GodotHub.metainfo.xml
          /app/share/metainfo/io.github.ismailivanov.GodotHub.metainfo.xml
      - install -Dm644 icon.png
          /app/share/icons/hicolor/256x256/apps/io.github.ismailivanov.GodotHub.png
    sources:
      - type: file
        url: https://github.com/ismailivanov/godot-hub/releases/download/v1.0/Linux.zip
        sha256: 1c82200e9b94c195d8f61b2af50834829bf0b533387a5b2408423f1e05b1b1bb
      - type: file
        path: io.github.ismailivanov.GodotHub.desktop
      - type: file
        path: io.github.ismailivanov.GodotHub.metainfo.xml
      - type: file
        path: icon.png
