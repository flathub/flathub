app-id: io.github.theotavio.Taskly
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: taskly

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: taskly
    buildsystem: simple
    build-commands:
      # Instalação dos arquivos e binários do Taskly
      - install -d /app/bin /app/lib /app/data
      - cp -r * /app/
      - ln -sf /app/taskly /app/bin/taskly

      # Instalação do arquivo de atalho Desktop
      - install -Dm644 io.github.theotavio.Taskly.desktop /app/share/applications/io.github.theotavio.Taskly.desktop

      # Instalação dos metadados AppStream
      - install -Dm644 io.github.theotavio.Taskly.metainfo.xml /app/share/metainfo/io.github.theotavio.Taskly.metainfo.xml

      # Instalação do ícone do aplicativo
      - install -Dm644 taskly.png /app/share/icons/hicolor/512x512/apps/io.github.theotavio.Taskly.png

    sources:
      - type: archive
        url: https://github.com/theotavio/taskly/releases/download/v1.0.0/Taskly-Linux-x64-v1.0.0.tar.gz
        sha256: 0b1c2b0fc728129c09ff58aa3b9b924d01e836b4b739fa87a5dcdfdf90d2c657
      - type: file
        path: io.github.theotavio.Taskly.desktop
      - type: file
        path: io.github.theotavio.Taskly.metainfo.xml
