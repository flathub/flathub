id: com.interactivebrokers.ibkrdesktop
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: ibkr-desktop
separate-locales: false
build-options:
  no-debuginfo: true
tags:
  - proprietary
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: kerberos
    subdir: src
    config-opts:
      - --localstatedir=/var/lib
      - --sbindir=${FLATPAK_DEST}/bin
      - --disable-rpath
      - --disable-static
    cleanup:
      - /bin
      - /share/et
      - /share/examples
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.22/krb5-1.22.1.tar.gz
        sha256: 1a8832b8cad923ebbf1394f67e2efcf41e3a49f460285a66e35adec8fa0053af
  - name: ibkr-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 ibkr-desktop-wrapper /app/bin/ibkr-desktop
      - install -Dm644 com.interactivebrokers.ibkrdesktop.desktop /app/share/applications/com.interactivebrokers.ibkrdesktop.desktop
      - install -Dm644 com.interactivebrokers.ibkrdesktop.metainfo.xml /app/share/metainfo/com.interactivebrokers.ibkrdesktop.metainfo.xml
      - install -Dm644 com.interactivebrokers.ibkrdesktop.svg /app/share/icons/hicolor/scalable/apps/com.interactivebrokers.ibkrdesktop.svg
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: ntws-installer.sh
        only-arches:
          - x86_64
        url: https://download2.interactivebrokers.com/installers/ntws/latest-standalone/ntws-latest-standalone-linux-x64.sh?build=3.2f20260520212551
        sha256: 6ebce209b833e6952d1d23d7b0634719c06a7f67d361b7404bdf774f1ac10e2c
        size: 196564856
      - type: extra-data
        filename: zulu-jre.tar.gz
        only-arches:
          - x86_64
        url: https://download2.interactivebrokers.com/installers/jres/linux-amd64-17.0.10.0.101-zulu-nojavafx.tar.gz
        sha256: 408aac9f6b9b111fe42cbf9f810b1ad7c53cca4c8ff23ec5308177a6abd3f90b
        size: 46799565
      - type: extra-data
        filename: ntws4launch-0016.2-linux-x64_1779315203000.jar
        only-arches:
          - x86_64
        url: https://download2.interactivebrokers.com/installers/ntws/latest-standalone/ntws4launch-0016.2-linux-x64.jar?build=3.2f20260520212551
        sha256: d23c6d1cdef8cd78484b799db7897833b7282762368f0aea247e59d06edec19f
        size: 76897244
      - type: extra-data
        filename: ntws4qml-0016.2_1779320448000.jar
        only-arches:
          - x86_64
        url: https://download2.interactivebrokers.com/installers/ntws/latest-standalone/ntws4qml-0016.2.jar?build=3.2f20260520212551
        sha256: eb2c6ee4d3ea9794a80e60b1d9a9ad296b458687ea351a1f57c75e728c5af609
        size: 3356165
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: ibkr-desktop-wrapper
      - type: file
        path: com.interactivebrokers.ibkrdesktop.desktop
      - type: file
        path: com.interactivebrokers.ibkrdesktop.metainfo.xml
      - type: file
        path: com.interactivebrokers.ibkrdesktop.svg
