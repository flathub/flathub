id: io.github.ychsue.nonblockinglife
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: io.github.ychsue.nonblockinglife
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
modules:
  - name: libbass
    buildsystem: simple
    sources:
      - type: archive
        url: https://www.un4seen.com/files/bass24-linux.zip
        dest: bass24-linux
        sha512: 4c5e88287d5e655fdd0ee2a6398b024935d434638ce30e3347eea755a9e9287bb6c26fd85c1125e6f6b1bc3dec8dfcd9e88909371b09489aad8ca95dade0be16
      - type: archive
        url: https://www.un4seen.com/files/bassflac24-linux.zip
        dest: bassflac24-linux
        sha512: 4d8ae28bdcbcce49943a9fc3da3dad7a59199629a59a2dd536282a77fdefa78285936f86c88c7bc4509a271819feb251c1c371decb40d280b331d714c45b820e
    build-commands:
      # Check the target and then install it
      - |
        if [ "$FLATPAK_ARCH" = "x86_64" ]; then
          find ./ -path "*x86_64/libbass.so" -exec install -Dm755 {} /app/lib/libbass.so \;
          find ./ -path "*x86_64/libbassflac.so" -exec install -Dm755 {} /app/lib/libbassflac.so \;
        elif [ "$FLATPAK_ARCH" = "aarch64" ]; then
          find ./ -path "*aarch64/libbass.so" -exec install -Dm755 {} /app/lib/libbass.so \;
          find ./ -path "*aarch64/libbassflac.so" -exec install -Dm755 {} /app/lib/libbassflac.so \;
        fi
  - name: NonBlockingLife
    buildsystem: simple
    build-options:
      # 💡 This line is quite important! It adds the dotnet10 command path to the environment variable
      append-path: /usr/lib/sdk/dotnet10/bin
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        DOTNET_NOLOGO: '1'
    build-commands:
      # First, perform an offline restore, specifying to read packages from the local directory
      - dotnet restore desktop/src/Nbl.Desktop/Nbl.Desktop.csproj --packages /run/build/NonBlockingLife/nuget-packages -s nuget-sources -r linux-x64
      - dotnet restore desktop/src/Nbl.Bridge/Nbl.Bridge.csproj --packages /run/build/NonBlockingLife/nuget-packages -s nuget-sources -r linux-x64

      # Then, publish the project
      - dotnet publish desktop/src/Nbl.Desktop/Nbl.Desktop.csproj -c Release -r linux-x64 --self-contained true --no-restore -p:PublishAot=false -p:RuntimeIdentifiers=linux-x64 -p:RestorePackagesPath=/run/build/NonBlockingLife/nuget-packages -p:NblUseSystemBass=true -o /app/lib/nonblockinglife
      - mkdir -p /app/bin
      - ln -s /app/lib/nonblockinglife/Nbl.Desktop /app/bin/io.github.ychsue.nonblockinglife
      - install -Dm644 desktop/io.github.ychsue.nonblockinglife.desktop /app/share/applications/io.github.ychsue.nonblockinglife.desktop
      - install -Dm644 desktop/io.github.ychsue.nonblockinglife.png /app/share/icons/hicolor/256x256/apps/io.github.ychsue.nonblockinglife.png
    # 🔥 Important: Install the metainfo.xml to the AppStream standard directory
      - install -Dm644 desktop/io.github.ychsue.nonblockinglife.metainfo.xml /app/share/metainfo/io.github.ychsue.nonblockinglife.metainfo.xml
    sources:
      - type: git
        url: https://github.com/ychsue/NonBlockingLife/
        branch: 171ce3df3c89a01a93d1391245bd7185da770f57
      - ./nuget-sources.json
