app-id: dev.aadhil.webrendie
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: webrendie
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=home

modules:
  - name: webrendie
    buildsystem: simple
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      - mkdir -p /app/lib/webrendie /app/bin
      - cp -a bundle/. /app/lib/webrendie/
      - ln -s /app/lib/webrendie/webrendie /app/bin/webrendie
      - install -Dm644 flatpak/dev.aadhil.webrendie.desktop -t /app/share/applications/
      - install -Dm644 flatpak/dev.aadhil.webrendie.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 flatpak/dev.aadhil.webrendie.png -t /app/share/icons/hicolor/512x512/apps/
      - install -Dm644 legal/LICENSE.txt -t /app/share/licenses/dev.aadhil.webrendie/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://aadhil.dev/media/releases/webrendie/webrendie-linux-x86_64-1.1.2.tar.xz
        sha256: 'ce92e88d14d3901d1ddfb20f1b3df41bf199d286f887907f20f0093e5211b0d4'
