app-id: ai.livefaceswap.LiveFaceSwap
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: livefaceswap-desktop
only-arches:
  - x86_64
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --device=all
  - --share=network
modules:
  - name: livefaceswap
    buildsystem: simple
    build-commands:
      - install -Dm755 livefaceswap-flatpak-wrapper.sh /app/bin/livefaceswap-desktop
      - install -Dm755 LiveFaceSwap-Linux-0.2.10-x86_64.AppImage /app/LiveFaceSwap/livefaceswap-desktop
      - install -Dm644 ai.livefaceswap.LiveFaceSwap.desktop /app/share/applications/ai.livefaceswap.LiveFaceSwap.desktop
      - install -Dm644 ai.livefaceswap.LiveFaceSwap.metainfo.xml /app/share/metainfo/ai.livefaceswap.LiveFaceSwap.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/ai.livefaceswap.LiveFaceSwap.png
    sources:
      - type: file
        url: https://github.com/LiveFaceSwapAI/livefaceswap/releases/download/v0.2.10/LiveFaceSwap-Linux-0.2.10-x86_64.AppImage
