# Manifest de SUBMISSÃO ao Flathub (fork de flathub/flathub, branch new-pr).
#
# Copie este arquivo para a raiz do fork e preencha o sha256 ANTES de abrir
# o PR:
#
#   curl -L https://github.com/isaacangello/WaydroidBinds/archive/refs/tags/v1.3.0.tar.gz | sha256sum
#
# O metainfo/desktop/ícone vêm do tarball (integrados no upstream); este PR
# contém APENAS este manifest. Não inclua flathub.json (suporta x86_64 e
# aarch64).
app-id: io.github.isaacangello.waydroidbinds
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: waydroid-binds-gui

# A GUI só funciona como frontend: as ações privilegiadas (bind mounts e
# firewall) são executadas no host via `flatpak-spawn --host pkexec ...`,
# usando os scripts instalados pelo pacote nativo (deb/rpm/pacman).
# Por isso os acessos a host e org.freedesktop.Flatpak (flatpak-spawn).
finish-args:
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --share=network
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak

build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
    - BASEAPP_DISABLE_NUMPY=1

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: waydroid-binds
    buildsystem: simple
    build-commands:
      - install -dm 0755 ${FLATPAK_DEST}/bin
      - install -dm 0755 ${FLATPAK_DEST}/share/waydroid-binds
      - install -m 0755 waydroid-binds-gui ${FLATPAK_DEST}/bin/waydroid-binds-gui
      - install -m 0755 setup-waydroid-binds.sh setup-waydroid-firewall.sh revert-waydroid-binds.sh copy-existing-media.sh ${FLATPAK_DEST}/share/waydroid-binds/
      - cp -a gui ${FLATPAK_DEST}/share/waydroid-binds/
      - install -dm 0755 ${FLATPAK_DEST}/share/applications ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps ${FLATPAK_DEST}/share/metainfo
      - install -m 0644 gui/resources/io.github.isaacangello.waydroidbinds.desktop ${FLATPAK_DEST}/share/applications/
      - install -m 0644 gui/resources/io.github.isaacangello.waydroidbinds.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/
      - install -m 0644 gui/resources/io.github.isaacangello.waydroidbinds.metainfo.xml ${FLATPAK_DEST}/share/metainfo/
    license-files:
      - LICENSE
    sources:
      - type: archive
        url: https://github.com/isaacangello/WaydroidBinds/archive/refs/tags/v1.3.0.tar.gz
        sha256: d0937428ab8b25446e2497a2a37fc1906d3e0a4c81b6a4632b714577ec66b69b
        x-checker-data:
          type: json
          url: https://api.github.com/repos/isaacangello/WaydroidBinds/releases/latest
          tag-query: .tag_name
          timestamp-query: .published_at
          url-query: https://github.com/isaacangello/WaydroidBinds/archive/refs/tags/$tag.tar.gz
