app-id: io.github.emaspa.WireViewLinux
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: wireview-linux

finish-args:
  # Display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # USB serial access to the WireView device (/dev/ttyACM*). Flatpak has no
  # finer-grained tty filter, so device=all is required. The host udev rule
  # still has to be installed separately (a sandbox cannot write /etc/udev).
  - --device=all
  # System-tray icon (StatusNotifierItem) and desktop notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: wireview-linux
    buildsystem: simple
    build-commands:
      # Pre-built self-contained .NET binary
      - install -Dm755 WireView2 /app/wireview-linux/WireView2
      - install -d /app/bin
      - ln -s ../wireview-linux/WireView2 /app/bin/wireview-linux
      # Desktop entry + AppStream metadata
      - install -Dm644 io.github.emaspa.WireViewLinux.desktop /app/share/applications/io.github.emaspa.WireViewLinux.desktop
      - install -Dm644 io.github.emaspa.WireViewLinux.metainfo.xml /app/share/metainfo/io.github.emaspa.WireViewLinux.metainfo.xml
      # Icons (renamed to the app id)
      - for s in 16 32 48 64 96 128; do install -Dm644 "icons/hicolor/${s}x${s}/apps/wireview-linux.png" "/app/share/icons/hicolor/${s}x${s}/apps/io.github.emaspa.WireViewLinux.png"; done
    sources:
      - type: archive
        url: https://github.com/emaspa/wireview-linux/releases/download/v1.1.0.1/wireview-linux-1.1.0.1-linux-x64.tar.gz
        sha256: 39401bb3c6415fec0da4bbfc77b0f782bab3302816fb0d7d8dc64e6ecdc99b47
        # strips the top-level wireview-linux-<ver>-linux-x64/ directory
        strip-components: 1
      - type: file
        path: io.github.emaspa.WireViewLinux.desktop
      - type: file
        path: io.github.emaspa.WireViewLinux.metainfo.xml
      - type: dir
        path: icons
        dest: icons
