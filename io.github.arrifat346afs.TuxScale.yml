app-id: io.github.arrifat346afs.TuxScale
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: tuxscale-run
separate-locales: false

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    add-ld-path: .
    version: '25.08'

finish-args:
  - --device=dri
  - --share=ipc
  - --filesystem=xdg-videos
  - --filesystem=xdg-download
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: zypak
    sources:
      - type: git
        url: https://github.com/refi64/zypak
        tag: v2025.04
        commit: 693a71c5ffa80ec9c9ce2ae03b1ccc493c698e53
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: tuxscale
    buildsystem: simple
    build-commands:
      - install -d /app/tuxscale
      - unzip tuxscale-linux.zip -d /app/tuxscale
      - install tuxscale-run /app/bin/
      - ln -s /app/lib/ffmpeg/ffmpeg /app/bin/ffmpeg
      - ln -s /app/lib/ffmpeg/ffprobe /app/bin/ffprobe
      - install -Dm644 /app/tuxscale/resources/512x512.png /app/share/icons/hicolor/512x512/apps/io.github.arrifat346afs.TuxScale.png
      - install -Dm644 /app/tuxscale/resources/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.arrifat346afs.TuxScale.png
      - install -Dm644 io.github.arrifat346afs.TuxScale.metainfo.xml /app/share/metainfo/io.github.arrifat346afs.TuxScale.metainfo.xml
      - install -Dm644 io.github.arrifat346afs.TuxScale.desktop /app/share/applications/io.github.arrifat346afs.TuxScale.desktop
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/arrifat346afs/TuxScale/releases/download/v1.0.0/tuxscale-1.0.0.zip
        sha256: 98f2b042f4a3e2483f5ee65770c5ee71377b52b4408b40f1bfcc74da4a2da058
        x-checker-data:
          type: json
          url: https://api.github.com/repos/arrifat346afs/TuxScale/releases/latest
          tag-query: .tag_name
          version-query: $tag | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://github.com/arrifat346afs/TuxScale/releases/download/v" + $version + "/tuxscale-" + $version + ".zip"'
        dest-filename: tuxscale-linux.zip
      - type: script
        dest-filename: tuxscale-run
        commands:
          - zypak-wrapper /app/tuxscale/tuxscale --ozone-platform-hint=auto --enable-features=WaylandWindowDecorations "$@"
      - type: file
        path: io.github.arrifat346afs.TuxScale.metainfo.xml
      - type: file
        path: io.github.arrifat346afs.TuxScale.desktop
