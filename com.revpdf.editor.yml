app-id: com.revpdf.editor
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: revpdf_editor

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --env=TMPDIR=/var/tmp

modules:
  - name: revpdf-editor
    buildsystem: simple
    build-commands:
      # Install bundle to /app/revpdf_editor/ so Flutter finds data/ relative to binary
      - install -d /app/revpdf_editor
      - install -Dm755 revpdf_editor /app/revpdf_editor/revpdf_editor
      - cp -r lib /app/revpdf_editor/lib
      - cp -r data /app/revpdf_editor/data
      # Launcher wrapper that sets LD_LIBRARY_PATH for bundled .so files
      - install -Dm755 revpdf_editor.sh /app/bin/revpdf_editor
      # Desktop integration
      - install -Dm644 com.revpdf.editor.desktop /app/share/applications/com.revpdf.editor.desktop
      - install -Dm644 com.revpdf.editor.png /app/share/icons/hicolor/512x512/apps/com.revpdf.editor.png
      - install -Dm644 com.revpdf.editor.metainfo.xml /app/share/metainfo/com.revpdf.editor.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/Pawandeep-prog/revpdf-release/releases/download/v4.0.0/revpdf_editor-linux-x86_64.tar.gz
        sha256: eccd7d41e2069acdf04a2e432990688388fffce9e47e04abc3a9f341b0f197f9
      - type: file
        url: https://raw.githubusercontent.com/Pawandeep-prog/revpdf-release/23ad55de1d5f73e7445755fcecbed89fb6482a42/com.revpdf.editor.metainfo.xml
        sha256: 01c01f9cedf8152ea3f9128a3e989dae94afbfa7b8744d3b27c3b89b7a0bc308
      - type: file
        url: https://raw.githubusercontent.com/Pawandeep-prog/revpdf-release/23ad55de1d5f73e7445755fcecbed89fb6482a42/com.revpdf.editor.desktop
        sha256: 9de38a4b0894cec4bac1d002a9286d6e647513a29b8089818a052a78adff178d
      - type: file
        url: https://raw.githubusercontent.com/Pawandeep-prog/revpdf-release/23ad55de1d5f73e7445755fcecbed89fb6482a42/com.revpdf.editor.png
        dest-filename: com.revpdf.editor.png
        sha256: a6e1e568ac84685dfb73ab3dea324365d4121486c45f802e17a69f4f3a34268b
      - type: script
        dest-filename: revpdf_editor.sh
        commands:
          - export LD_LIBRARY_PATH="/app/revpdf_editor/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          - exec /app/revpdf_editor/revpdf_editor "$@"
