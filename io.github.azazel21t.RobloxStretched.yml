id: io.github.azazel21t.RobloxStretched
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: stretched_launcher
finish-args:
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: roblox-stretched-utility
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - gcc stretched_app.c -o /app/bin/stretched_launcher
      - install -D roblox_x86_64.apk /app/share/roblox/roblox_x86_64.apk
    sources:
      - type: file
        path: /home/hp/stretched_app.c
      - type: file
        path: /home/hp/roblox_x86_64.apk

# This tells the Flathub linter that you are intentionally requesting host flatpak-spawn privileges
x-checker-data:
  linter:
    exceptions:
      - finish-args-flatpak-spawn-access
