app-id: com.github.momentum
runtime: org.gnome.Platform
runtime-version: '45'
sdk: org.gnome.Sdk
command: momentum
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Network access for updates/syncing if needed in the future
  - --share=network
  # We don't need arbitrary filesystem access since it saves to ~/.local/share, which Flatpak automatically sandboxes inside ~/.var/app/
modules:
  - name: momentum
    buildsystem: simple
    build-commands:
      # Create launcher script
      - echo '#!/bin/bash' > momentum
      - echo 'cd /app/share/momentum && exec python3 main.py "$@"' >> momentum
      - install -Dm755 momentum /app/bin/momentum
      
      # Copy application files
      - mkdir -p /app/share/momentum
      - cp -r main.py src /app/share/momentum/
      
      # Install desktop file, icon, and metainfo
      - install -Dm644 data/com.github.momentum.desktop /app/share/applications/com.github.momentum.desktop
      - install -Dm644 data/icons/hicolor/scalable/apps/com.github.momentum.svg /app/share/icons/hicolor/scalable/apps/com.github.momentum.svg
      - install -Dm644 data/com.github.momentum.metainfo.xml /app/share/metainfo/com.github.momentum.metainfo.xml
    sources:
      - type: dir
        path: .
