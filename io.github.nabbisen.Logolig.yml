app-id: io.github.nabbisen.Logolig
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: logolig

finish-args:
  # A graphical program with a GPU renderer (iced, wgpu with a software fallback).
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/logolig/cargo

modules:
  - name: logolig
    buildsystem: simple
    build-commands:
      # The sources file below is generated from Cargo.lock; there is no network at build time.
      - cargo --offline build --release --locked -p logolig-app
      - install -Dm755 target/release/logolig -t /app/bin
      - install -Dm644 packaging/linux/io.github.nabbisen.Logolig.desktop -t /app/share/applications
      - install -Dm644 packaging/linux/io.github.nabbisen.Logolig.metainfo.xml -t /app/share/metainfo
      # One line per size; each file is named by the application id.
      - for s in 32 48 64 128 256 512; do install -Dm644 packaging/linux/icons/hicolor/${s}x${s}/apps/io.github.nabbisen.Logolig.png -t /app/share/icons/hicolor/${s}x${s}/apps; done
    
    # Section which depends on release tags
    sources:
      - type: git
        url: https://github.com/nabbisen/logolig.git
        tag: 1.30.0
        commit: b4c482a114d38dc731fb25005d7b8a82be5ae1c2
      # Generated by flatpak-builder-tools' cargo generator from Cargo.lock
      - cargo-sources.json
