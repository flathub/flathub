app-id: com.routeconverter.RouteConverter
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: routeconverter

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

build-options:
  append-path: /usr/lib/sdk/openjdk21/bin
  env:
    JAVA_HOME: /usr/lib/sdk/openjdk21/jvm/openjdk-21

modules:
  - name: routeconverter
    buildsystem: simple
    build-commands:
      # Minimal jlinked runtime, module set from the project's single
      # source of truth (scripts/jre-modules.txt) -- the same list the
      # Windows/Mac bundled JREs use, gated by scripts/verify-runtime.sh.
      - >-
        jlink
        --module-path $JAVA_HOME/jmods
        --add-modules java.base,java.compiler,java.datatransfer,java.desktop,java.logging,java.management,java.naming,java.prefs,java.scripting,java.security.jgss,java.sql,java.xml,java.xml.crypto,jdk.crypto.ec,jdk.management,jdk.net,jdk.unsupported
        --no-header-files --no-man-pages --strip-debug
        --output /app/jre
      - install -Dm644 RouteConverterLinux.jar /app/share/routeconverter/RouteConverterLinux.jar
      - install -Dm755 routeconverter.sh /app/bin/routeconverter
      - install -Dm644 com.routeconverter.RouteConverter.desktop /app/share/applications/com.routeconverter.RouteConverter.desktop
      - install -Dm644 com.routeconverter.RouteConverter.metainfo.xml /app/share/metainfo/com.routeconverter.RouteConverter.metainfo.xml
      - install -Dm644 RouteConverter.png /app/share/icons/hicolor/256x256/apps/com.routeconverter.RouteConverter.png
    sources:
      - type: file
        # Immutable per-version URL (rc-meta#146 pins release artifacts
        # under previous-releases/<version>/; /latest/ mutates on every
        # release and must never be used as a Flatpak source URL).
        url: https://releases.routeconverter.com/previous-releases/3.6/RouteConverterLinux.jar
        sha256: 40c791f579800077f4e5f2a7505fd2ff44bc1bd8341e3705fa20bd40665f3817
        dest-filename: RouteConverterLinux.jar
      - type: file
        path: routeconverter.sh
      - type: file
        path: com.routeconverter.RouteConverter.desktop
      - type: file
        path: com.routeconverter.RouteConverter.metainfo.xml
      - type: file
        path: RouteConverter.png
