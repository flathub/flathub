app-id: com.ritm.HeadMouse
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: rit-m-headmouse

# Head tracking needs raw device access (uinput virtual pointer + reading the
# glasses IMU) and host network (glasses expose IMU over link-local TCP; the
# local UI listens on 127.0.0.1:52778).
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all

modules:
  - name: rit-m-headmouse
    buildsystem: simple
    build-commands:
      - install -Dm755 rit-m-headmouse /app/bin/rit-m-headmouse
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm644 com.ritm.HeadMouse.desktop /app/share/applications/com.ritm.HeadMouse.desktop
      - install -Dm644 com.ritm.HeadMouse.metainfo.xml /app/share/metainfo/com.ritm.HeadMouse.metainfo.xml
      - install -Dm644 com.ritm.HeadMouse.svg /app/share/icons/hicolor/scalable/apps/com.ritm.HeadMouse.svg
    sources:
      # Proprietary app: ship a prebuilt bundle via extra-data (downloaded at
      # install time, like Zoom/Spotify). No source published.
      - type: extra-data
        filename: bundle.tar.gz
        url: https://rit-m.com/downloads/rit-m-headmouse-flatpak-bundle.tar.gz
        sha256: 8b699d3347957717ab17a61ed733bc87ec13e0315b7428c51cb0d2b298135326
        size: 44100328
      - type: script
        dest-filename: apply_extra
        commands:
          - tar -xf bundle.tar.gz
          - rm -f bundle.tar.gz
      - type: file
        path: rit-m-headmouse
      - type: file
        path: com.ritm.HeadMouse.desktop
      - type: file
        path: com.ritm.HeadMouse.metainfo.xml
      - type: file
        path: com.ritm.HeadMouse.svg
