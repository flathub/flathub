app-id: ch.ishfam.Himmel
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: himmel

finish-args:
  # Brightsky (api.brightsky.dev) and Nominatim (nominatim.openstreetmap.org) HTTPS
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/himmel/cargo
    CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

modules:
  - name: himmel
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/himmel/cargo
    build-commands:
      - |
        mkdir -p .cargo
        cat > .cargo/config.toml <<CONF
        [source.crates-io]
        replace-with = "vendored-sources"
        [source.vendored-sources]
        directory = "cargo/vendor"
        CONF
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/himmel /app/bin/himmel
      - install -Dm644 data/ch.ishfam.Himmel.desktop /app/share/applications/ch.ishfam.Himmel.desktop
      - install -Dm644 data/ch.ishfam.Himmel.metainfo.xml /app/share/metainfo/ch.ishfam.Himmel.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/ch.ishfam.Himmel.svg /app/share/icons/hicolor/scalable/apps/ch.ishfam.Himmel.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/ch.ishfam.Himmel-symbolic.svg /app/share/icons/hicolor/symbolic/apps/ch.ishfam.Himmel-symbolic.svg
      - install -Dm644 LICENCE /app/share/licenses/ch.ishfam.Himmel/LICENCE
    sources:
      - type: git
        url: https://git.ishfam.ch/ilshat/himmel.git
        tag: v0.1.1
        commit: 610d2ba1ff9d9163f990280824e4a202052217b0
      - cargo-sources.json
