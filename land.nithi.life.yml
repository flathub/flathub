id: land.nithi.life
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: nithi-life
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - "--persist=Conway Game of Life Canvases"
modules:
  - name: nithi-life
    buildsystem: simple
    build-commands:
      - make -C apps/conway-native/linux
      - make -C apps/conway-native/linux install-dist PREFIX=/app
    sources:
      - type: archive
        url: https://github.com/nithilanvivek/conways-game-of-life-lab/releases/download/v3.0/conways-game-of-life-lab-3.0-flatpak-source.tar.gz
        sha256: 3f858a2a153ee33905a7e3d4744ebda234bdb7af0ab4fab5034654e1db4ebbc6
         


