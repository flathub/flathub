id: com.armen.guessnumber
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: main.py
modules:

  - name: python3-pyside6
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} PySide6
    sources:
      - type: file
        url: https://pythonhosted.org
        sha256: d0603f90119b9caed0c9e6ca3379b39cfb9ba8208f331f0cf2fbcfe23315a67f

  - name: guessnumber
    buildsystem: simple
    build-commands:
      - install -Dm755 main.py /app/bin/main.py
      - install -Dm644 com.armen.guessnumber.desktop /app/share/applications/com.armen.guessnumber.desktop
      - install -Dm644 com.armen.guessnumber.metainfo.xml /app/share/metainfo/com.armen.guessnumber.metainfo.xml
      - install -Dm644 com.armen.guessnumber.png /app/share/icons/hicolor/512x512/apps/com.armen.guessnumber.png
    sources:
      - type: git
        url: https://github.com/arm362/Guess-Number
        branch: main
