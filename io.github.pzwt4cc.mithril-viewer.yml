id: io.github.pzwt4cc.mithril-viewer
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: mithril-viewer
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=cups
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --filesystem=xdg-desktop
  - --filesystem=/run/media
modules:
  - name: mithril-viewer
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/mithril-viewer/cargo
        CARGO_NET_OFFLINE: "true"
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo build --offline --release --frozen
      - install -Dm755 target/release/mithril-viewer ${FLATPAK_DEST}/bin/mithril-viewer
      - install -Dm644 data/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 data/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - |
        for size in 16 24 32 48 64 128 256 512; do
          install -Dm644 "data/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png" \
            "${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png"
        done
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/LICENSE
      - install -Dm644 assets/fonts/OFL.txt ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/OFL.txt
    sources:
      - type: git
        url: https://github.com/pzwt4cc/mithril-viewer.git
        tag: v0.1.0
        commit: 00eed2d3492d80c3f92619ea13e01f869814d35b
      - cargo-sources.json
