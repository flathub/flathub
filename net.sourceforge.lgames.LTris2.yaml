app-id: net.sourceforge.lgames.LTris2
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: ltris2
rename-icon: ltris2
rename-appdata-file: ltris2.metainfo.xml
rename-desktop-file: ltris2.desktop
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio

modules:
  - shared-modules/SDL2/SDL2_image.json
  - shared-modules/SDL2/SDL2_ttf.json
  - shared-modules/SDL2/SDL2_mixer.json
  - name: LTris2
    buildsystem: autotools
    build-options:
      # A quick fix for: `fatal error: SDL_image.h: No such file or directory` error
      cxxflags: -I/app/include/SDL2
    post-install:
      - install -Dm644 ltris2.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: archive
        url: https://sourceforge.net/projects/lgames/files/ltris/ltris2-2.0.4.tar.gz
        sha256: 482150495f9d87bb139d5af1abec7030383c37fdb3e75a45e9bad67ead798eda
        x-checker-data:
          type: anitya
          project-id: 389175
          stable-only: true
          url-template: https://sourceforge.net/projects/lgames/files/ltris/ltris2-$version.tar.gz
      - type: file
        path: ltris2.metainfo.xml

