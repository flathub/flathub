# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json

app-id: com.unfolding_machines.pum.lite
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: pum_lite
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-documents
  - --env=GTK_THEME=Adwaita:dark
  - --env=LD_LIBRARY_PATH=/app/lib64:/app/lib
modules:
  - name: pum_lite
    buildsystem: simple
    build-commands:
      - install -Dm644 com.unfolding_machines.pum.lite.desktop $FLATPAK_DEST/share/applications/com.unfolding_machines.pum.lite.desktop
      - install -Dm644 com.unfolding_machines.pum.lite.metainfo.xml $FLATPAK_DEST/share/metainfo/com.unfolding_machines.pum.lite.metainfo.xml
      - install -Dm644 icon_linux_512.png $FLATPAK_DEST/share/icons/hicolor/512x512/apps/com.unfolding_machines.pum.lite.png
      - install -Dm644 LICENSE.txt $FLATPAK_DEST/share/licenses/$FLATPAK_ID/LICENSE.txt
      - install -Dm755 apply_extra $FLATPAK_DEST/bin/apply_extra
      - ln -s /app/extra/pum_lite_runner/pum_lite $FLATPAK_DEST/bin/pum_lite
    sources:
      - type: extra-data
        filename: pum-lite_1.0.1_Linux-Portable.tar.gz
        url: https://pumcpub.s3.eu-central-1.amazonaws.com/pum-lite_1.0.1_Linux-Portable.tar.gz
        sha256: 3ac4d1880f006845e577dd038a93eef65f416565fcbab831359851b89fa403f3
        size: 26247569
        only-arches:
          - x86_64
      - type: file
        path: linux/com.unfolding_machines.pum.lite.desktop
      - type: file
        path: linux/com.unfolding_machines.pum.lite.metainfo.xml
      - type: file
        path: assets/splash_and_icon/icon_linux_512.png
      - type: file
        path: LICENSE.txt
      - type: script
        dest-filename: apply_extra
        commands:
          - mkdir -p /app/extra/pum_lite_runner
          - tar -xzf /app/extra/pum-lite_1.0.1_Linux-Portable.tar.gz -C /app/extra/pum_lite_runner
          - rm /app/extra/pum-lite_1.0.1_Linux-Portable.tar.gz