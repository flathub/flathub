app-id: org.haskell.GhcupGtk
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.ghc914
command: ghcup-gtk
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak
  - --env=ghcup_gtk_datadir=/app/share/ghcup-gtk
build-options:
  append-path: /usr/lib/sdk/ghc914/bin
modules:
  - name: ghcup-gtk
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      env:
        CABAL_DIR: /run/build/ghcup-gtk/.cabal-flatpak
    build-commands:
      - cabal update
      - cabal build exe:ghcup-gtk --project-file=cabal.release.project --datadir=/app/share --datasubdir=ghcup-gtk
      - install -Dm755 "$(cabal list-bin ghcup-gtk --project-file=cabal.release.project --datadir=/app/share --datasubdir=ghcup-gtk | tail -1)" /app/bin/ghcup-gtk
      - install -Dm644 assets/style.css /app/share/ghcup-gtk/assets/style.css
      - install -Dm644 assets/icons/funnel-symbolic.svg /app/share/ghcup-gtk/assets/icons/funnel-symbolic.svg
      - install -Dm644 assets/org.haskell.GhcupGtk.desktop /app/share/applications/org.haskell.GhcupGtk.desktop
      - install -Dm644 assets/org.haskell.GhcupGtk.svg /app/share/icons/hicolor/scalable/apps/org.haskell.GhcupGtk.svg
      - install -Dm644 assets/org.haskell.GhcupGtk.metainfo.xml /app/share/metainfo/org.haskell.GhcupGtk.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - dist-newstyle
          - dist-package
          - dist-tarball
          - .flatpak-builder
          - flatpak-build
          - cabal.project.local
