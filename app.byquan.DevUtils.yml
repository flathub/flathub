# Flathub manifest for DevSuite for Linux. DevSuite is closed source: this installs a prebuilt binary bundle
# (flathub/make-bundle.sh) and builds nothing. The bundle only links GTK, libadwaita and their libraries, which the
# GNOME runtime provides.
#
# Test locally from the repository root (after uploading the bundle, or with `path:` pointing at it):
#   flatpak install flathub org.flatpak.Builder org.gnome.Platform//50 org.gnome.Sdk//50
#   flatpak run --command=flathub-build org.flatpak.Builder --install flathub/app.byquan.DevUtils.yml
#   flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest flathub/app.byquan.DevUtils.yml
#   flatpak run app.byquan.DevUtils
id: app.byquan.DevUtils
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: devutils
finish-args:
  # A window (Wayland, or X11 where there's no Wayland) and the GPU. No network and no file system access:
  # DevSuite is offline, and files come in through the file chooser portal or "Open with".
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: devsuite
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/devutils /app/bin/devutils
      - cp -r share/applications share/metainfo share/icons /app/share/
      - install -Dm644 THIRD-PARTY-LICENSES.txt /app/share/licenses/app.byquan.DevUtils/THIRD-PARTY-LICENSES.txt
    sources:
      # flathub/make-bundle.sh for the release, uploaded here. Update url and sha256 per release.
      - type: archive
        url: https://downloads.byquan.app/devsuite/devsuite-linux-0.1.0-x86_64.tar.xz
        sha256: 7594443ed09c46ace821bdbdf4182f99ebd933b5b48a6198fd84be54fb0d0d01
        only-arches:
          - x86_64
