app-id: page.codeberg.subhangadirli.Gazan
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: gazan

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.OpenURI

modules:
  - name: rclone
    buildsystem: simple
    build-commands:
      - install -Dm755 rclone /app/bin/rclone
      - install -Dm644 rclone-LICENSE /app/share/licenses/page.codeberg.subhangadirli.Gazan/rclone-LICENSE
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/rclone/rclone/releases/download/v1.74.1/rclone-v1.74.1-linux-amd64.zip
        sha256: 67df3059a6233b6e32e604bcd637654bb294ff86291b65ede77123e94818d911
        strip-components: 1
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/rclone/rclone/releases/download/v1.74.1/rclone-v1.74.1-linux-arm64.zip
        sha256: c816ed0e568de4dd1bba1a4d0cd47523d3dd54337dd5fde73f1b068857ecf877
        strip-components: 1
      - type: file
        url: https://raw.githubusercontent.com/rclone/rclone/v1.74.1/COPYING
        sha256: 8cd2e9e750b90a04b7d82dbbca3930c696ae0309d7c10464f90a44f45754cd04
        dest-filename: rclone-LICENSE

  - name: gazan
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=/app .
      - install -Dm644 page.codeberg.subhangadirli.Gazan.desktop /app/share/applications/page.codeberg.subhangadirli.Gazan.desktop
      - install -Dm644 page.codeberg.subhangadirli.Gazan.metainfo.xml /app/share/metainfo/page.codeberg.subhangadirli.Gazan.metainfo.xml
      - install -Dm644 gazan/assets/hicolor/scalable/apps/page.codeberg.subhangadirli.Gazan.svg /app/share/icons/hicolor/scalable/apps/page.codeberg.subhangadirli.Gazan.svg
      - install -Dm644 gazan/assets/hicolor/128x128/apps/page.codeberg.subhangadirli.Gazan.png /app/share/icons/hicolor/128x128/apps/page.codeberg.subhangadirli.Gazan.png
      - install -Dm644 gazan/assets/hicolor/256x256/apps/page.codeberg.subhangadirli.Gazan.png /app/share/icons/hicolor/256x256/apps/page.codeberg.subhangadirli.Gazan.png
      - install -Dm644 gazan/assets/hicolor/512x512/apps/page.codeberg.subhangadirli.Gazan.png /app/share/icons/hicolor/512x512/apps/page.codeberg.subhangadirli.Gazan.png
      - install -Dm644 LICENSE /app/share/licenses/page.codeberg.subhangadirli.Gazan/LICENSE
    sources:
      - type: git
        url: https://codeberg.org/subhangadirli/gazan
        tag: v0.6.0
        commit: bb6525a2e40de22186511b2bc168fca32b87eed9
