app-id: org.lotconn.Rukn
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: rukn
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - /include
  - /lib/cmake
  - /lib/Lotconn
  - /lib/lotconn
  - /lib/qml
  - "*.la"
  - "*.a"
modules:
  - name: rukn
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DFETCHCONTENT_SOURCE_DIR_ADHAN-CPP=/run/build/rukn/subprojects/lotconn/adhan-cpp
      - -DFETCHCONTENT_SOURCE_DIR_FILEMAN=/run/build/rukn/subprojects/lotconn/fileman
      - -DFETCHCONTENT_SOURCE_DIR_SINGLEAPPLICATION=/run/build/rukn/subprojects/singleapplication
      - -DAPP_LINUX_DIST=Flatpak
    sources:
      - type: git
        url: https://gitlab.com/lotconn/rukn
        commit: 888964469406e563c4319f217b00eb1c7cb6f5ea
      - type: git
        url: https://github.com/lotconn/adhan-cpp
        commit: 545cac6f70a0a60f9d5f521dcbf2dda9eece3d79
        dest: subprojects/lotconn/adhan-cpp
      - type: git
        url: https://gitlab.com/lotconn/fileman
        commit: 830b671594be51131a3bc66b85454f7130174d8f
        dest: subprojects/lotconn/fileman
      - type: git
        url: https://github.com/itay-grudev/SingleApplication
        commit: a218603d76a55dddb65b84f2b49ecaa8efc074ea
        dest: subprojects/singleapplication
