app-id: io.github.seotarek.whatsapp-desktop
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: whatsapp-desktop

finish-args:
  # Display & Windowing
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Audio, Video & Calls
  - --socket=pulseaudio
  # The GPU only.
  - --device=dri
  - --share=network
  # Filesystem
  - --filesystem=xdg-download
  - --filesystem=~/.config/whatsapp-desktop:create
  - --filesystem=~/.local/share/whatsapp-desktop:create
  # D-Bus Services (Tray, Notifications, MPRIS)
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.mpris.MediaPlayer2.whatsapp
  - --own-name=org.mpris.MediaPlayer2.whatsapp.*
  - --own-name=org.kde.StatusNotifierItem-*
  # Environment
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto

modules:
  - name: whatsapp-desktop
    buildsystem: simple
    build-commands:
      - ar -x whatsapp-desktop_1.9.13_amd64.deb
      - tar -xf data.tar.*
      - cp -a usr/* /app/
      - sed -i 's|/usr/lib/whatsapp-desktop|/app/lib/whatsapp-desktop|g' /app/bin/whatsapp-desktop
      - sed -i 's|^exec /app/lib/whatsapp-desktop/whatsapp-desktop |exec zypak-wrapper /app/lib/whatsapp-desktop/whatsapp-desktop |' /app/bin/whatsapp-desktop
      - install -Dm644 io.github.seotarek.whatsapp-desktop.metainfo.xml /app/share/metainfo/io.github.seotarek.whatsapp-desktop.metainfo.xml
    sources:
      - type: file
        url: https://github.com/seotarek/whatsapp-desktop/releases/download/v1.9.13/whatsapp-desktop_1.9.13_amd64.deb
        sha256: 2fb4cff6820c324cd91c0107142214d2b3a2362fa39690551f97a63cb66a1087
        only-arches: [x86_64]
      - type: file
        url: https://raw.githubusercontent.com/seotarek/whatsapp-desktop/v1.9.13/data/io.github.seotarek.whatsapp-desktop.metainfo.xml
        sha256: 9865181f20661f2401f1fa2a4f22c7df35745ee50c74151e3b103166190d5fba
