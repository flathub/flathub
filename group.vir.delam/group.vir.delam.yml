app-id: group.vir.delam
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: delam-wrapper

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=all
  - --socket=pulseaudio
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.NetworkManager

modules:
  - name: delam
    buildsystem: simple
    build-commands:
      - mkdir -p /app/delam /app/bin
      - install -Dm755 delam /app/delam/delam
      - mkdir -p /app/delam/data
      - cp -r data/. /app/delam/data/
      - cp -r lib /app/delam/lib
      - printf '#!/bin/sh\nexec /app/delam/delam "$@"\n' > /app/bin/delam-wrapper
      - chmod +x /app/bin/delam-wrapper
      - install -Dm644 group.vir.delam.desktop /app/share/applications/group.vir.delam.desktop
      - install -Dm644 group.vir.delam.metainfo.xml /app/share/metainfo/group.vir.delam.metainfo.xml
      - for size in 16 32 48 64 128 256 512; do
          mkdir -p /app/share/icons/hicolor/${size}x${size}/apps;
          install -m644 group.vir.delam-${size}.png /app/share/icons/hicolor/${size}x${size}/apps/group.vir.delam.png;
        done
    sources:
      - type: archive
        url: https://delam.vir.group/releases/v0.1.0/delam-to-0.1.0-linux-x86_64.tar.gz
        sha256: c6a0c3eaea544248dc92dec3c70a21f530c6762fa8af609aae81f9e51c7e8ed7
        strip-components: 1
      - type: file
        path: group.vir.delam.desktop
      - type: file
        path: group.vir.delam.metainfo.xml
      - type: file
        path: group.vir.delam-16.png
      - type: file
        path: group.vir.delam-32.png
      - type: file
        path: group.vir.delam-48.png
      - type: file
        path: group.vir.delam-64.png
      - type: file
        path: group.vir.delam-128.png
      - type: file
        path: group.vir.delam-256.png
      - type: file
        path: group.vir.delam-512.png
