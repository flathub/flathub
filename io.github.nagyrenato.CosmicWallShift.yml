app-id: io.github.nagyrenato.CosmicWallShift
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: cosmic-wallshift

finish-args:
  # Wayland display — COSMIC DE is Wayland-only; fallback-x11 intentionally
  # omitted. Requires a finish-args-only-wayland exception on Flathub.
  - --socket=wayland
  # GPU rendering
  - --device=dri
  # Read theme mode file, write wallpaper config — both live under ~/.config/cosmic/
  # Access is intentionally rw; the app reads cosmic theme state and writes
  # cosmic-bg wallpaper config. Requires a finish-args-unnecessary-xdg-config-cosmic-rw-access
  # exception on Flathub.
  - --filesystem=xdg-config/cosmic:rw
  # System tray (StatusNotifierItem)
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/cosmic-wallshift/cargo
    RUST_BACKTRACE: '1'

modules:
  - name: cosmic-wallshift
    buildsystem: simple
    build-commands:
      # Offline build using vendored sources (see README — Flatpak section)
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/cosmic-wallshift /app/bin/cosmic-wallshift
      # Desktop entry
      - install -Dm644 res/io.github.nagyrenato.CosmicWallShift.desktop
          /app/share/applications/io.github.nagyrenato.CosmicWallShift.desktop
      # AppStream metainfo
      - install -Dm644 res/io.github.nagyrenato.CosmicWallShift.metainfo.xml
          /app/share/metainfo/io.github.nagyrenato.CosmicWallShift.metainfo.xml
      # Icon (scalable SVG)
      - install -Dm644 res/icons/io.github.nagyrenato.CosmicWallShift.svg
          /app/share/icons/hicolor/scalable/apps/io.github.nagyrenato.CosmicWallShift.svg
    sources:
      - type: git
        url: https://github.com/nagyrenato/cosmic-wallshift.git
        tag: v0.1.0
        commit: 38496082b304340110cd6195adf357ae4a1fde8e
      # Generated by: flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json
      # Run that command once and commit cargo-sources.json alongside this manifest.
      - cargo-sources.json
