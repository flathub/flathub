app-id: io.github.techywilbur.UniPersonal
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: unipersonal

finish-args:
  # Avalonia-bygget har bara X11-backend (Wayland-backenden är ett separat
  # paket som inte används här), så det måste vara --socket=x11 och inte
  # fallback-x11: med en Wayland-socket i sandlådan hoppar flatpak över X11
  # och appen dör direkt på "XOpenDisplay failed". På en Wayland-session
  # körs den via XWayland.
  - --socket=x11
  - --share=ipc
  - --device=dri
  # Chromium/CEF och AI-funktionerna talar med nätet.
  - --share=network
  - --socket=pulseaudio
  # Filhanteraren, terminalen och applistan arbetar mot hela systemet — utan
  # detta visar de bara sandlådans innehåll och funktionerna blir meningslösa.
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
  # API-nycklar och inloggningar.
  - --talk-name=org.freedesktop.secrets

modules:
  # Klippbordshistoriken läses med xclip, inte wl-paste: Flathub tillåter inte
  # både x11- och wayland-socket, och eftersom Avalonia kräver X11 blir
  # WAYLAND_DISPLAY osatt i sandlådan — då väljer vakten själv xclip-vägen.
  # På en Wayland-session speglar XWayland urklippet åt båda hållen.
  #
  # xclip länkar mot libXmu, som är det enda X11-biblioteket runtimen saknar.
  - name: libXmu
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://www.x.org/releases/individual/lib/libXmu-1.2.1.tar.xz
        sha256: fcb27793248a39e5fcc5b9c4aec40cc0734b3ca76aac3d7d1c264e7f7e14e8b2

  # Reservvägen på X11-sessioner, där data-control-protokollet inte finns.
  - name: xclip
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/astrand/xclip/archive/refs/tags/0.13.tar.gz
        sha256: ca5b8804e3c910a66423a882d79bf3c9450b875ac8528791fb60ec9de667f758

  - name: unipersonal
    buildsystem: simple
    build-commands:
      - install -Dm755 unipersonal.sh /app/bin/unipersonal
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm644 io.github.techywilbur.UniPersonal.desktop
        /app/share/applications/io.github.techywilbur.UniPersonal.desktop
      - install -Dm644 io.github.techywilbur.UniPersonal.metainfo.xml
        /app/share/metainfo/io.github.techywilbur.UniPersonal.metainfo.xml
      - install -Dm644 io.github.techywilbur.UniPersonal.png
        /app/share/icons/hicolor/256x256/apps/io.github.techywilbur.UniPersonal.png
    sources:
      # Release-filer på GitHub är oföränderliga per tagg, vilket är precis vad
      # extra-data kräver — sha256 låses vid inlämningen. Varje ny version får
      # en ny tagg och en ny URL. Värdena kommer från
      # ./build-flatpak-payload.sh.
      - type: extra-data
        filename: unipersonal.tar.gz
        url: https://github.com/techywilbur/UniPersonal/releases/download/v1.0.40/unipersonal-1.0.40-x86_64.tar.gz
        sha256: 6fd2c69b945262ffef7e5fac6e619cc7d72f11f1170f5304009e61a0d100fcd5
        size: 206016542
      - type: file
        path: unipersonal.sh
      - type: file
        path: apply_extra
      - type: file
        path: io.github.techywilbur.UniPersonal.desktop
      - type: file
        path: io.github.techywilbur.UniPersonal.metainfo.xml
      - type: file
        path: io.github.techywilbur.UniPersonal.png
