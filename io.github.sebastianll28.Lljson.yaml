app-id: io.github.sebastianll28.Lljson
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: lljson

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Files are opened with the file chooser (portal) or by dragging them:
  # no filesystem access is needed.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/lljson/cargo

modules:
  - name: lljson
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --locked
      - cargo --offline build --release --locked -p lljson
      - install -Dm755 target/release/lljson -t /app/bin
      - install -Dm644 data/io.github.sebastianll28.Lljson.desktop -t /app/share/applications
      - install -Dm644 data/io.github.sebastianll28.Lljson.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.sebastianll28.Lljson.svg
        -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 data/icons/hicolor/symbolic/apps/io.github.sebastianll28.Lljson-symbolic.svg
        -t /app/share/icons/hicolor/symbolic/apps
    sources:
      - type: git
        url: https://github.com/SebastianLl28/lljson.git
        tag: v0.1.0
        commit: bf83159cc0a696559b6e43c7f642a4841a63da65
      # Generated by generate-sources.sh from Cargo.lock.
      - cargo-sources.json
