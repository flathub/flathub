app-id: io.github.tazihad.bengal-download-manager
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: bengal-download-manager

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --filesystem=host
  - --filesystem=xdg-download
  - --filesystem=xdg-config/kdeglobals:ro
  - --filesystem=xdg-config/gtk-3.0:ro
  - --filesystem=xdg-config/gtk-4.0:ro
  - --filesystem=xdg-data/icons:ro
  - --filesystem=~/.icons:ro
  - --filesystem=~/.local/share/icons:ro
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.Settings
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem.*
  - --own-name=org.freedesktop.StatusNotifierItem.*
  - --env=QT_QPA_PLATFORMTHEME=xdgdesktopportal

modules:
  - name: pyinstaller-deps
    buildsystem: simple
    build-commands:
      # Install pyinstaller into the build environment
      - pip install --prefix=/app pyinstaller
    sources: []

  - name: bengal-download-manager
    buildsystem: simple
    build-commands:
      - pip install --prefix=/app -r requirements.txt || true
      - pyinstaller --onefile --paths=src --name bengal-download-manager src/main.py
      - install -D -m 755 dist/bengal-download-manager /app/bin/bengal-download-manager
      - if [ -f "assets/bin/${FLATPAK_ARCH}/aria2c" ]; then install -D -m 755 assets/bin/${FLATPAK_ARCH}/aria2c /app/bin/aria2c; fi
      - install -D -m 644 assets/icons/16x16.png /app/share/icons/hicolor/16x16/apps/${FLATPAK_ID}.png
      - install -D -m 644 assets/icons/32x32.png /app/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -D -m 644 assets/icons/64x64.png /app/share/icons/hicolor/64x64/apps/${FLATPAK_ID}.png
      - install -D -m 644 assets/icons/128x128.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -D -m 644 assets/icons/256x256.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -D -m 644 assets/icons/512x512.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -D -m 644 assets/logo.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -D -m 644 flatpak/${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -D -m 644 flatpak/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -D -m 644 flatpak/${FLATPAK_ID}.metainfo.xml /app/share/appdata/${FLATPAK_ID}.appdata.xml
    sources:
      - type: archive
        url: https://github.com/tazihad/bengal-download-manager/archive/refs/tags/v0.2.12.tar.gz
        sha256: 23c5dbcdb8720c1c5eb2bebafa88bbb4ad435572503cd3ee0f32bb3d2d7ad6f5


