id: io.github.mouse_config.MouseConfig
runtime: org.kde.Platform//6.7
sdk: org.kde.Sdk//6.7
command: mouse-config

finish-args:
  - --device=hidraw
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --device=dri

modules:
  - name: python3
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/python3.12/install.sh

  - name: python3-packages
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-build-isolation pyusb==1.3.1
    build-options:
      append-path: /usr/lib/sdk/python3.12/bin
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/source/p/pyusb/pyusb-1.3.1.tar.gz
        sha256: 3afd28447293b74e2f1cfa70f73b78f5cbabd1f85d5fc6d6d2a0c78ea88b7e4

  - name: mouse-config
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-deps .
    build-options:
      append-path: /usr/lib/sdk/python3.12/bin
    sources:
      - type: git
        url: https://github.com/jhonnyG532/Mouse-Config-v1.0.0.git
        tag: v1.0.0
    post-install:
      - install -Dm644 flatpak/io.github.mouse_config.MouseConfig.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/io.github.mouse_config.MouseConfig.metainfo.xml
      - install -Dm644 flatpak/io.github.mouse_config.MouseConfig.desktop
        ${FLATPAK_DEST}/share/applications/io.github.mouse_config.MouseConfig.desktop
      - install -Dm644 flatpak/io.github.mouse_config.MouseConfig.png
        ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.mouse_config.MouseConfig.png
      - install -Dm755 mouse-config -t ${FLATPAK_DEST}/bin/
