id: com.toggleminds.togglemail
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: togglemail
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # passwords in the system keyring (Secret Service)
  - --talk-name=org.freedesktop.secrets
  # attachments are saved to Downloads
  - --filesystem=xdg-download
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: togglemail
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/togglemail/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --offline --release --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/togglemail /app/bin/togglemail
      - install -Dm644 packaging/flatpak/com.toggleminds.togglemail.desktop /app/share/applications/com.toggleminds.togglemail.desktop
      - install -Dm644 packaging/flatpak/com.toggleminds.togglemail.metainfo.xml /app/share/metainfo/com.toggleminds.togglemail.metainfo.xml
      - install -Dm644 src-tauri/icons/togglemail.svg /app/share/icons/hicolor/scalable/apps/com.toggleminds.togglemail.svg
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.toggleminds.togglemail.png
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/com.toggleminds.togglemail.png
    sources:
      - type: git
        url: https://github.com/ShankarOnline/togglemail.git
        tag: v0.1.2
        commit: 6ca27c4107a4b68aa90ded04f033dd2cb55d97fe
      - cargo-sources.json
