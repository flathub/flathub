app-id: io.github.alesima.eisenhower
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: eisenhower-gui
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
  - '*.la'
modules:
  - name: eisenhower-matrix
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --prefix=/app --no-deps --no-build-isolation .
      - install -Dm644 io.github.alesima.eisenhower.desktop /app/share/applications/io.github.alesima.eisenhower.desktop
      - install -Dm644 io.github.alesima.eisenhower.metainfo.xml /app/share/metainfo/io.github.alesima.eisenhower.metainfo.xml
      - install -Dm644 data/icons/io.github.alesima.eisenhower.svg /app/share/icons/hicolor/scalable/apps/io.github.alesima.eisenhower.svg
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.alesima.eisenhower/eisenhower-matrix
    sources:
      - type: git
        url: https://github.com/alesima/eisenhower.git
        tag: v1.1.1
        commit: f999cef9972dd1a3f1d6d810272fe3c0c6b96195
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
