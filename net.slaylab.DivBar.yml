app-id: net.slaylab.DivBar
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: divbar

finish-args:
    - --socket=wayland
    - --socket=fallback-x11
    - --share=ipc
    - --filesystem=xdg-data/applications:create
    - --filesystem=xdg-data/icons:create
    - --filesystem=xdg-pictures:ro

modules:
    - name: zenity
      buildsystem: meson
      config-opts:
        - -Dwebkitgtk=false
      sources:
        - type: archive
          url: https://download.gnome.org/sources/zenity/4.1/zenity-4.1.90.tar.xz
          sha256: bf3679c6205ff48dcebd1e1dff3a3a4a6a0b3a53e1cbc3b098a9ec0b62bd7236

    - name: divbar
      buildsystem: simple
      build-commands:
        - chmod +x patch-assets-dir.sh
        - ./patch-assets-dir.sh
        - install -Dm755 divbar.sh /app/bin/divbar
        - install -dm755 /app/share/divbar/assets
        - cp -r assets/vertical assets/horizontal /app/share/divbar/assets/
        - install -Dm644 net.slaylab.DivBar.svg /app/share/icons/hicolor/scalable/apps/net.slaylab.DivBar.svg
        - install -Dm644 net.slaylab.DivBar.desktop /app/share/applications/net.slaylab.DivBar.desktop
        - install -Dm644 net.slaylab.DivBar.metainfo.xml /app/share/metainfo/net.slaylab.DivBar.metainfo.xml
      sources:
        - type: archive
          url: https://github.com/Danielslay86/divbar/archive/v1.0.2.tar.gz
          sha256: dfbc194db1b742f72cb7aa0a061a7810996430f1d62d6f64530cde86674c73b3
        - type: file
          path: net.slaylab.DivBar.svg
        - type: file
          path: net.slaylab.DivBar.desktop
        - type: file
          path: net.slaylab.DivBar.metainfo.xml
        - type: file
          path: patch-assets-dir.sh
