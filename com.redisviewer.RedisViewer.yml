app-id: com.redisviewer.RedisViewer
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: redis-viewer
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --env=WEBKIT_DISABLE_COMPOSITING_MODE=1
  - --env=GDK_BACKEND=wayland,x11
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6

modules:
  - name: redis-viewer
    buildsystem: simple
    build-commands:
      - install -Dm755 redis-viewer /app/bin/redis-viewer
      - install -Dm644 com.redisviewer.RedisViewer.desktop /app/share/applications/com.redisviewer.RedisViewer.desktop
      - install -Dm644 com.redisviewer.RedisViewer.png /app/share/icons/hicolor/512x512/apps/com.redisviewer.RedisViewer.png
      - install -Dm644 com.redisviewer.RedisViewer.metainfo.xml /app/share/metainfo/com.redisviewer.RedisViewer.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/redisviewer/redisviewer/releases/download/v3.2.4/RedisViewer_3.2.4_linux_amd64_bin.tar.gz
        sha256: 7460c8fdcdf35c22141a6bf55783803350c4e2950e1bff8513d6a76f3e59b85f
        strip-components: 0
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/redisviewer/redisviewer/releases/latest
          version-query: .tag_name
          version-query-type: shell
          url-query: '"https://github.com/redisviewer/redisviewer/releases/download/" + $version + "/RedisViewer_" + ($version | sub("^v"; "")) + "_linux_amd64_bin.tar.gz"'

      - type: archive
        url: https://github.com/redisviewer/redisviewer/releases/download/v3.2.4/RedisViewer_3.2.4_linux_arm64_bin.tar.gz
        sha256: 1d778f073cc533af19a744595ab4b99642c427a2f325b4bb4b7b44b443895ae8
        strip-components: 0
        only-arches:
          - aarch64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/redisviewer/redisviewer/releases/latest
          version-query: .tag_name
          version-query-type: shell
          url-query: '"https://github.com/redisviewer/redisviewer/releases/download/" + $version + "/RedisViewer_" + ($version | sub("^v"; "")) + "_linux_arm64_bin.tar.gz"'

      - type: file
        path: com.redisviewer.RedisViewer.desktop

      - type: file
        path: com.redisviewer.RedisViewer.metainfo.xml

      - type: file
        path: com.redisviewer.RedisViewer.png
