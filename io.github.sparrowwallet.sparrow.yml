app-id: io.github.sparrowwallet.sparrow
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: sparrow
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --persist=.sparrow

modules:
  - name: sparrow
    buildsystem: simple
    build-commands:
      - install -d /app/extra/sparrow
      - cp -a bin lib /app/extra/sparrow/
      - install -Dm644 restore-bridge.jar /app/extra/sparrow/lib/app/restore-bridge.jar
      - printf '%s\n' 'java-options=-Xbootclasspath/a:/app/extra/sparrow/lib/app/restore-bridge.jar' >> /app/extra/sparrow/lib/app/Sparrow.cfg
      - printf '%s\n' 'java-options=-Djava.util.logging.config.class=com.sparrowwallet.sparrow.runtime.RestoreBridge' >> /app/extra/sparrow/lib/app/Sparrow.cfg
      - printf '%s\n' 'java-options=--add-opens=javafx.controls/javafx.scene.control=ALL-UNNAMED' >> /app/extra/sparrow/lib/app/Sparrow.cfg
      - printf '%s\n' 'java-options=--add-opens=com.sparrowwallet.sparrow/com.sparrowwallet.sparrow.control=ALL-UNNAMED' >> /app/extra/sparrow/lib/app/Sparrow.cfg
      - install -Dm755 sparrow.sh /app/bin/sparrow
      - install -Dm644 io.github.sparrowwallet.sparrow.desktop -t /app/share/applications/
      - install -Dm644 io.github.sparrowwallet.sparrow.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 io.github.sparrowwallet.sparrow.png /app/share/icons/hicolor/512x512/apps/io.github.sparrowwallet.sparrow.png
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.sparrowwallet.sparrow/
    sources:
      - type: archive
        url: https://github.com/sparrowwallet/sparrow/releases/download/2.5.5/sparrowwallet-2.5.5-x86_64.tar.gz
        sha256: 7e8a59bf7e7293bd924518dda8ea7747696634297de54878c1c5f5cdb528559d
        only-arches:
          - x86_64
      - type: file
        path: restore-bridge.jar
      - type: file
        path: sparrow.sh
      - type: file
        path: io.github.sparrowwallet.sparrow.desktop
      - type: file
        path: io.github.sparrowwallet.sparrow.metainfo.xml
      - type: file
        path: io.github.sparrowwallet.sparrow.png
      - type: file
        path: LICENSE
