app-id: net.tuxblox.TuxBlox
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: tuxblox

# For the 32-bit side of TuxBlox, including Roblox's MCP server
add-extensions:
  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: '26.08'
  org.freedesktop.Platform.GL32:
    directory: lib/i386-linux-gnu/GL
    version: '1.4'
    versions: '26.08;26.08-extra;1.4'
    subdirectories: true
    no-autodownload: true
    autodelete: false
    add-ld-path: lib
    merge-dirs: vulkan/icd.d;glvnd/egl_vendor.d;OpenCL/vendors;lib/dri;lib/d3d;vulkan/explicit_layer.d;vulkan/implicit_layer.d

finish-args:
  # TuxBlox relies on NTSync, which --device=dri does not expose. It's also needed for game controllers and DualSense haptics (hidraw)
  - --device=all

  # Roblox's MCP server and parts of the compatibility layer are 32-bit, without this it will not run
  - --allow=multiarch

  # Network is required by Roblox, and the Flatpak downloads both the compatibility layer and the Roblox client at runtime.
  - --share=network

  # Shared memory with the X server
  - --share=ipc

  # The compatibility layer draws Roblox's windows through X11 by default, on Wayland it draws through XWayland so X11 is also needed on Wayland
  - --socket=x11

  # The launcher draws through Wayland if present. Additionally, there is an experimental Wayland driver in the compatibility layer.
  - --socket=wayland

  # Required for audio to play
  - --socket=pulseaudio

  # For Roblox Studio to be able to read/write files outside the app directory. The FileChooser portal only partially covers this. The engine can read/write files without asking for a file chooser. Also covers Roblox Player since it saves pictures in the home directory without asking for a FileChooser.
  - --filesystem=home

  # For symlinking the compatibility layer's prefix's user directories to Linux directories.
  - --filesystem=xdg-config/user-dirs.dirs:ro

  # For the Discord Rich Presence setting.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create

  # Roblox Player creates a system tray icon, so it is needed for that.
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: tuxblox
    buildsystem: simple

    build-options:
      no-debuginfo: true
      strip: true
      env:
        TUXBLOX_DONT_INCREMENT_BUILD: '1'
        TUXBLOX_RELEASE: '3.12.15.2'
        TUXBLOX_CHANNEL: stable

    build-commands:
      - make flatpak

    sources:
      - type: archive
        url: https://github.com/tuxblox/tuxblox/archive/refs/tags/3.12.15.2.tar.gz
        sha256: 'a1134183815e212464ab650fb8c8c7a63ba265b8320ab29494ab4c335e4970ad'
