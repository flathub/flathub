# Unofficial community Flatpak of Grok Bot.
# Not affiliated with xAI/Cursor. Likely to need Flathub reviewer discussion
# because the application is proprietary and this is a third-party packaging.
app-id: io.github.lcf2212dev.grok_bot_bin
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: grok-bot
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
modules:
  - name: grok-bot
    buildsystem: simple
    build-commands:
      # flatpak-builder strips the archive top-level directory
      - install -d /app/grok-bot
      - |
        shopt -s dotglob nullglob
        for item in *; do
          case "$item" in
            grok-bot-launcher.sh|io.github.lcf2212dev.grok_bot_bin.desktop|io.github.lcf2212dev.grok_bot_bin.metainfo.xml|grok-bot.png)
              continue
              ;;
          esac
          cp -a "$item" /app/grok-bot/
        done
      - chmod 755 /app/grok-bot/grok-bot
      - rm -rf /app/grok-bot/packaging
      - install -Dm755 grok-bot-launcher.sh /app/bin/grok-bot
      - install -Dm644 io.github.lcf2212dev.grok_bot_bin.desktop /app/share/applications/io.github.lcf2212dev.grok_bot_bin.desktop
      - install -Dm644 io.github.lcf2212dev.grok_bot_bin.metainfo.xml /app/share/metainfo/io.github.lcf2212dev.grok_bot_bin.metainfo.xml
      - install -Dm644 grok-bot.png /app/share/icons/hicolor/256x256/apps/io.github.lcf2212dev.grok_bot_bin.png
    sources:
      - type: archive
        url: https://github.com/lcf2212dev/grok-bot-bin/releases/download/v0.18.0/grok-bot-bin-0.18.0-x86_64.tar.zst
        sha256: def3cf37dc920aa2e49a55fa5d3cf445061bfa63c1c21dea05ea182d57086fec
      - type: file
        path: grok-bot-launcher.sh
      - type: file
        path: io.github.lcf2212dev.grok_bot_bin.desktop
      - type: file
        path: io.github.lcf2212dev.grok_bot_bin.metainfo.xml
      - type: file
        path: grok-bot.png
