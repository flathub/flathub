app-id: ai.trae.Trae
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: trae
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=ssh-auth
  - --socket=pulseaudio
  - --device=all
  - --allow=devel
  - --persist=.
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Flatpak
separate-locales: false

modules:
  - name: trae
    buildsystem: simple
    build-commands:
      - install -Dm755 -t ${FLATPAK_DEST}/bin/ apply_extra trae
      - install -Dm644 -t ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/ ai.trae.Trae.png
      - install -Dm644 ${FLATPAK_ID}.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/mimetypes/${FLATPAK_ID}.code-workspace.png
      - install -Dm644 -t ${FLATPAK_DEST}/share/applications/ ${FLATPAK_ID}.desktop ${FLATPAK_ID}.url-handler.desktop
      - install -Dm644 -t ${FLATPAK_DEST}/share/metainfo/ ${FLATPAK_ID}.metainfo.xml
      - install -Dm644 -t ${FLATPAK_DEST}/share/mime/packages/ ${FLATPAK_ID}.xml
    sources:
      - type: script
        commands:
          - exec zypak-wrapper /app/extra/trae/trae "$@"
        dest-filename: trae
      - type: script
        commands:
          - bsdtar -O -xf trae.deb data.* | bsdtar --no-same-owner -xf -
          - mv usr/share/trae .
          - rm -rf usr *.deb
        dest-filename: apply_extra
      - type: extra-data
        only-arches: [x86_64]
        filename: trae.deb
        url: https://lf-cdn.trae.ai/obj/trae-ai-sg/pkg/app/releases/stable/2.3.13344/linux/Trae-linux-x64.deb
        sha256: 6af50c118c57acdae151419f02bf6090ab509489611803844b50731c93e9ecae
        size: 249699304
        x-checker-data:
          type: json
          url: https://api.trae.ai/icube/api/v1/native/version/trae/latest
          version-query: .data.manifest.linux.version
          url-query: .data.manifest.linux.download[] | select(.region=="sg") | ."x64.deb"
      - type: extra-data
        only-arches: [aarch64]
        filename: trae.deb
        url: https://lf-cdn.trae.ai/obj/trae-ai-sg/pkg/app/releases/stable/2.3.13344/linux/Trae-linux-arm64.deb
        sha256: 444d80d65ea01b7dde6c1bc92c377273fd9dc10ec84b2cf474096cdfc1873a64
        size: 232269688
        x-checker-data:
          type: json
          url: https://api.trae.ai/icube/api/v1/native/version/trae/latest
          version-query: .data.manifest.linux.version
          url-query: .data.manifest.linux.download[] | select(.region=="sg") | ."arm64.deb"
      - type: file
        path: ai.trae.Trae.desktop
      - type: file
        path: ai.trae.Trae.url-handler.desktop
      - type: file
        path: ai.trae.Trae.metainfo.xml
      - type: file
        path: ai.trae.Trae.png
      - type: file
        path: ai.trae.Trae.xml
