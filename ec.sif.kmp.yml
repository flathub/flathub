id: ec.sif.kmp
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: SIF
finish-args:
  - --socket=x11
  - --device=dri
  # Required to connect to the SIF cloud API (api.sif.ec)
  - --share=network
  - --share=ipc
  - --talk-name=org.freedesktop.Notifications
  # Access to Downloads to save exported PDF invoices and CSV reports
  - --filesystem=xdg-download
  # Direct printing of invoices and receipts
  - --socket=cups
  # Needed to persist user session tokens and preferences
  - --env=_JAVA_OPTIONS=-Djava.util.prefs.userRoot=/var/data -Djava.util.prefs.systemRoot=/var/data/.systemPrefs

modules:
  - name: sif
    buildsystem: simple
    build-commands:
      - cp -r bin lib /app/
      - chmod +x /app/bin/SIF
      - install -Dm644 ec.sif.kmp.desktop /app/share/applications/ec.sif.kmp.desktop
      - install -Dm644 ec.sif.kmp.metainfo.xml /app/share/metainfo/ec.sif.kmp.metainfo.xml
      - install -Dm644 ec.sif.kmp.png /app/share/icons/hicolor/256x256/apps/ec.sif.kmp.png
    sources:
      - type: archive
        url: https://github.com/danielpazmino/sif-releases/releases/download/v1.0.0/sif-linux-x64.tar.gz
        sha256: 43f6a41299a15de685871c006273fa428599046912aee8244f62e0a74631d3a4
        x-checker-data:
          type: html
          url: https://github.com/danielpazmino/sif-releases/releases/latest
          pattern: href=".*/download/(v[0-9.]+)/sif-linux-x64.tar.gz"
      - type: file
        path: ec.sif.kmp.desktop
      - type: file
        path: ec.sif.kmp.metainfo.xml
      - type: file
        path: ec.sif.kmp.png
