id: moe.sable.client

runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

base: org.electronjs.Electron2.BaseApp
base-version: '25.08'

command: sable

finish-args:
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --device=all
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-download
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: xdg-utils
    buildsystem: simple
    build-commands:
      - autoreconf -fi
      - ./configure --prefix=${FLATPAK_DEST}
      - touch scripts/xdg-mime.txt
      - make -C scripts xdg-mime
      - install -Dm755 scripts/xdg-mime ${FLATPAK_DEST}/bin/xdg-mime
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/xdg/xdg-utils.git
        tag: v1.2.1
        commit: 356c380ad6fecc9ce6bea1f6a77986ba67402c80

  - name: desktop-file-utils
    buildsystem: meson
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/desktop-file-utils/releases/desktop-file-utils-0.28.tar.xz
        sha256: 4401d4e231d842c2de8242395a74a395ca468cd96f5f610d822df33594898a70

  - name: sable
    buildsystem: simple
    build-commands:
      # The release tarball unpacks to a top-level `sable` binary plus a
      # `runtime/` directory (CEF and the app resources). Recreate the layout
      # the wrapper expects at /app/lib/sable.
      - mkdir -p ${FLATPAK_DEST}/lib/sable
      - install -Dm755 sable ${FLATPAK_DEST}/lib/sable/sable
      - cp -a runtime/. ${FLATPAK_DEST}/lib/sable/
      - install -Dm755 sable.sh ${FLATPAK_DEST}/bin/sable
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/LICENSE
      - install -Dm644 moe.sable.client.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 moe.sable.client.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 32x32.png ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -Dm644 64x64.png ${FLATPAK_DEST}/share/icons/hicolor/64x64/apps/${FLATPAK_ID}.png
      - install -Dm644 128x128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 256x256.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
    sources:
      - type: archive
        only-arches: [x86_64]
        strip-components: 0
        url: https://github.com/SableClient/Sable/releases/download/v1.21.0/Sable-1.21.0-linux-x86_64.tar.gz
        sha256: 57caeeaa7b4c4002afd1bc6bbc47ba5807a3e326d77b55545f7e6ea2d7f69df0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/SableClient/Sable/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "Sable-" + $version + "-linux-x86_64.tar.gz")
            | .browser_download_url
          is-main-source: true
      - type: archive
        only-arches: [aarch64]
        strip-components: 0
        url: https://github.com/SableClient/Sable/releases/download/v1.21.0/Sable-1.21.0-linux-aarch64.tar.gz
        sha256: 2d732583c4016c00fc88356ae2148efb11e02e82b46f4b4f3293554279ed5715
        x-checker-data:
          type: json
          url: https://api.github.com/repos/SableClient/Sable/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "Sable-" + $version + "-linux-aarch64.tar.gz")
            | .browser_download_url
      - type: file
        path: sable.sh
      - type: file
        url: https://raw.githubusercontent.com/SableClient/Sable/v1.21.0/LICENSE
        sha256: 4df3c306dddaaf4baffdff5ca820cc679ac8cd6dc263c6a74517783e42fa7a3b
        dest-filename: LICENSE
      # Maintained upstream (SableClient/Sable, packaging/flatpak/).
      - type: file
        url: https://raw.githubusercontent.com/SableClient/Sable/dev/packaging/flatpak/moe.sable.client.desktop
        sha256: cc9c73c1b7b6fbad989698afd0e2d97fca3be4e4130631a37ce10faebfc7e431
      - type: file
        url: https://raw.githubusercontent.com/SableClient/Sable/dev/packaging/flatpak/moe.sable.client.metainfo.xml
        sha256: c966b20e797d0b97b076b77165a3064910ba83698d695ba43d57668d848fdbd0
      - type: file
        path: icons/32x32.png
        dest-filename: 32x32.png
      - type: file
        path: icons/64x64.png
        dest-filename: 64x64.png
      - type: file
        path: icons/128x128.png
        dest-filename: 128x128.png
      - type: file
        path: icons/256x256.png
        dest-filename: 256x256.png
