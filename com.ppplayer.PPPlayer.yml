# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json
app-id: com.ppplayer.PPPlayer
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: ppplayer

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '25.08'
    add-ld-path: .

cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/lib/ffmpeg

finish-args:
  # Windowing & Graphics
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  # Sound
  - --socket=pulseaudio
  # Network access for music streaming and artist metadata
  - --share=network
  # Media file access
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-download
  # Desktop Integration
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --system-talk-name=org.freedesktop.NetworkManager
  # MPRIS Media Controller
  - --own-name=org.mpris.MediaPlayer2.ppplayer.*

modules:
  - name: libass
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.2/libass-0.17.2.tar.gz
        sha256: d5e6be57f8664188fa64b4c73ab6a3ef8906969cf4f8285df649f809a7e9301d
        x-checker-data:
          type: anitya
          project-id: 1560
          stable-only: true
          url-template: https://github.com/libass/libass/releases/download/$version/libass-$version.tar.gz

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dopengl=enabled
      - -Dvulkan=enabled
      - -Dglslang=disabled
      - -Dd3d11=disabled
      - -Ddemos=False
    sources:
      - type: archive
        url: https://code.videolan.org/videolan/libplacebo/-/archive/v6.338.2/libplacebo-v6.338.2.tar.gz
        sha256: 785d7b5bfec3eb9f1a0ea49e32a0c644cf492bc7b7eef46c2ef0b7f8e3f94fc3
        x-checker-data:
          type: anitya
          project-id: 20101
          stable-only: true
          url-template: https://code.videolan.org/videolan/libplacebo/-/archive/v$version/libplacebo-v$version.tar.gz
      - type: archive
        url: https://github.com/pallets/jinja/archive/refs/tags/3.1.4.tar.gz
        sha256: 4a3aee7ac9d308a98431b382e7792b9579c0dd41d847707e0e726645af5a1563
        dest: 3rdparty/jinja
        x-checker-data:
          type: anitya
          project-id: 3894
          url-template: https://github.com/pallets/jinja/archive/refs/tags/$version.tar.gz
      - type: archive
        url: https://github.com/Dav1dde/glad/archive/refs/tags/v2.0.6.tar.gz
        sha256: f5d36e2f111ee40a02b1f8eb4ae2383c072c4d7ec6be992c90f20ce4b732f7a5
        dest: 3rdparty/glad
        x-checker-data:
          type: anitya
          project-id: 300234
          url-template: https://github.com/Dav1dde/glad/archive/refs/tags/v$version.tar.gz

  - name: libmpv
    cleanup:
      - /share/bash-completion
      - /share/zsh
      - /share/doc
      - /share/icons
      - /share/applications
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Ddebug=false
      - -Dbuild-date=false
      - -Dalsa=disabled
      - -Dmanpage-build=disabled
      - -Dvulkan=enabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.38.0.tar.gz
        sha256: 86d9ef40b605829e13ec2d5d07e904eb7596016e2c9ef7c06ad2601231048039
        x-checker-data:
          type: anitya
          project-id: 5348
          stable-only: true
          url-template: https://github.com/mpv-player/mpv/archive/refs/tags/v$version.tar.gz

  - name: ppplayer
    buildsystem: simple
    build-commands:
      # Install PPPlayer Flutter release bundle
      - install -dm755 /app/ppplayer /app/bin
      - cp -r ppplayer-bundle/* /app/ppplayer/
      - chmod +x /app/ppplayer/ppplayer
      - ln -s /app/ppplayer/ppplayer /app/bin/ppplayer
      # Install Desktop entry, Icon, and AppStream MetaInfo
      - install -Dm644 com.ppplayer.PPPlayer.desktop /app/share/applications/com.ppplayer.PPPlayer.desktop
      - install -Dm644 com.ppplayer.PPPlayer.png /app/share/icons/hicolor/256x256/apps/com.ppplayer.PPPlayer.png
      - install -Dm644 com.ppplayer.PPPlayer.metainfo.xml /app/share/metainfo/com.ppplayer.PPPlayer.metainfo.xml
    sources:
      - type: archive
        dest: ppplayer-bundle
        url: https://github.com/ppplayer-labs/app/releases/download/v4.0.2/PPPlayer-Linux-x86_64.tar.gz
        sha256: 633c3d8b1ae815f8d0bda72ff2dfa678214dbe97c27668e5f49821a981adf566
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/ppplayer-labs/app/releases/latest
          version-query: .tag_name | sub("v";"")
          url-query: .assets[] | select(.name=="PPPlayer-Linux-x86_64.tar.gz") | .browser_download_url
      - type: file
        path: com.ppplayer.PPPlayer.desktop
      - type: file
        path: com.ppplayer.PPPlayer.png
      - type: file
        path: com.ppplayer.PPPlayer.metainfo.xml
