app-id: gg.flashcards.Flashcards
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: flashcards
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Sync, AI generation and the Google sign-in loopback redirect on 127.0.0.1.
  - --share=network
  # Text-to-speech playback (espeak-ng → PulseAudio/PipeWire).
  - --socket=pulseaudio
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/vim
  - '*.la'
  - '*.a'
modules:
  - name: pcaudiolib
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/espeak-ng/pcaudiolib/archive/refs/tags/1.3.tar.gz
        sha256: 86edb75048eec7fcd8d74f9568f051d50b4781982215095b96ba9c2c9c7c159b
  - name: espeak-ng
    buildsystem: autotools
    config-opts:
      - --with-pcaudiolib=yes
      - --with-sonic=no
      - --with-mbrola=no
      - --with-klatt=no
      - --with-speechplayer=no
      - --with-extdict-ru=yes
      - --with-extdict-zh=yes
    sources:
      - type: archive
        url: https://github.com/espeak-ng/espeak-ng/archive/refs/tags/1.52.0.tar.gz
        sha256: bb4338102ff3b49a81423da8a1a158b420124b055b60fa76cfb4b18677130a23
  - name: flashcards
    buildsystem: simple
    build-commands:
      - mkdir -p /app/flashcards /app/bin
      - cp -a flashcards lib data /app/flashcards/
      - ln -s /app/flashcards/flashcards /app/bin/flashcards
      - install -Dm644 icons/gg.flashcards.Flashcards-512.png /app/share/icons/hicolor/512x512/apps/gg.flashcards.Flashcards.png
      - install -Dm644 icons/gg.flashcards.Flashcards-256.png /app/share/icons/hicolor/256x256/apps/gg.flashcards.Flashcards.png
      - install -Dm644 gg.flashcards.Flashcards.desktop /app/share/applications/gg.flashcards.Flashcards.desktop
      - install -Dm644 gg.flashcards.Flashcards.metainfo.xml /app/share/metainfo/gg.flashcards.Flashcards.metainfo.xml
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/flashcards-gg/linux/releases/download/v1.1.188/flashcards-1.1.188-linux-x64.tar.gz
        sha256: 034fe8ec17c2d84764fa1e4dac60b901d13da3f39c6ade3abc04631282d1e8a1
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/flashcards-gg/linux/releases/download/v1.1.188/flashcards-1.1.188-linux-arm64.tar.gz
        sha256: d81520e0ca8141f40b50c12ad0991cbdb7c2dd2b6730a21aa11acd8505daafa1
      - type: file
        path: gg.flashcards.Flashcards.desktop
      - type: file
        path: gg.flashcards.Flashcards.metainfo.xml
