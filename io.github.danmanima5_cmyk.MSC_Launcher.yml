id: io.github.danmanima5_cmyk.MSC_Launcher
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: msc-launcher
branch: stable
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=~/.minecraft:create
  - --filesystem=xdg-download:ro
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  - --env=JAVA_HOME=/app/jre
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh

  - name: msc-launcher
    buildsystem: simple
    build-commands:
      - install -Dm755 msc-launcher /app/bin/msc-launcher
      - install -Dm644 minecraft-launcher-2.1.0.jar /app/share/io.github.danmanima5_cmyk.MSC_Launcher/minecraft-launcher-2.1.0.jar
      - install -d /app/lib/javafx
      - cp -a openjfx/lib/. /app/lib/javafx/
      - install -Dm644 io.github.danmanima5_cmyk.MSC_Launcher.desktop /app/share/applications/io.github.danmanima5_cmyk.MSC_Launcher.desktop
      - install -Dm644 io.github.danmanima5_cmyk.MSC_Launcher.metainfo.xml /app/share/metainfo/io.github.danmanima5_cmyk.MSC_Launcher.metainfo.xml
      - install -Dm644 io.github.danmanima5_cmyk.MSC_Launcher.png /app/share/icons/hicolor/512x512/apps/io.github.danmanima5_cmyk.MSC_Launcher.png
      - install -d /app/share/licenses/io.github.danmanima5_cmyk.MSC_Launcher/OpenJFX
      - cp -a openjfx/legal/. /app/share/licenses/io.github.danmanima5_cmyk.MSC_Launcher/OpenJFX/
    sources:
      - type: file
        path: minecraft-launcher-2.1.0.jar
      - type: archive
        url: https://download2.gluonhq.com/openjfx/21.0.11/openjfx-21.0.11_linux-x64_bin-sdk.zip
        sha256: 9a69b4074f22bdb051ca0ae8e9794750621ef815c7657ccc51f89ba81ef2b624
        strip-components: 1
        dest: openjfx
      - type: file
        path: flatpak/msc-launcher
      - type: file
        path: flatpak/io.github.danmanima5_cmyk.MSC_Launcher.desktop
      - type: file
        path: flatpak/io.github.danmanima5_cmyk.MSC_Launcher.metainfo.xml
      - type: file
        path: flatpak/io.github.danmanima5_cmyk.MSC_Launcher.png
