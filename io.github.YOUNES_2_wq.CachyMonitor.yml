{
    "app-id": "io.github.YOUNES_2_wq.CachyMonitor",
    "runtime": "org.kde.Platform",
    "runtime-version": "6.11",
    "sdk": "org.kde.Sdk",
    "base": "io.qt.PySide.BaseApp",
    "base-version": "6.11",
    "command": "io.github.YOUNES_2_wq.CachyMonitor",
    "finish-args": [
        "--share=ipc",
        "--socket=fallback-x11",
        "--socket=wayland",
        "--filesystem=~/.local/share/MangoHud:ro",
        "--filesystem=~/.local/share/goverlay:ro",
        "--device=dri"
    ],
    "build-options": {
        "env": [
            "BASEAPP_REMOVE_WEBENGINE=1",
            "BASEAPP_DISABLE_NUMPY=1"
        ]
    },
    "cleanup-commands": [
        "/app/cleanup-BaseApp.sh"
    ],
    "modules": [
    {
            "name": "cachymonitor",
            "buildsystem": "simple",
            "build-commands": [
                "install -D cachymonitor.py /app/bin/io.github.YOUNES_2_wq.CachyMonitor",
                "install -D cachymonitor.desktop /app/share/applications/io.github.YOUNES_2_wq.CachyMonitor.desktop",
                "sed -i 's/Exec=cachymonitor/Exec=io.github.YOUNES_2_wq.CachyMonitor/' /app/share/applications/io.github.YOUNES_2_wq.CachyMonitor.desktop",
                "sed -i 's/Icon=cachymonitor/Icon=io.github.YOUNES_2_wq.CachyMonitor/' /app/share/applications/io.github.YOUNES_2_wq.CachyMonitor.desktop",
                "install -D cachymonitor.svg /app/share/icons/hicolor/scalable/apps/io.github.YOUNES_2_wq.CachyMonitor.svg",
                "install -D cachymonitor.svg /app/bin/cachymonitor.svg",
                "install -D packaging/flatpak/io.github.YOUNES_2_wq.CachyMonitor.metainfo.xml /app/share/metainfo/"
            ],
            "sources": [
                {
                    "type": "git",
                    "url": "https://github.com/YOUNES-2-wq/cachymonitor",
                    "commit": "cb86d3d2ae73c373062c26993af89bb1840499bc",
                    "tag": "v1.4.3"
                }
            ]
    } 
        ]
         }