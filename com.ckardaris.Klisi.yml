id: com.ckardaris.Klisi
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk25
separate-locales: false
command: klisi
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: gettext
    sources:
      - type: archive
        url: https://ftp.gnu.org/pub/gnu/gettext/gettext-1.0.tar.gz
        sha256: 85d99b79c981a404874c02e0342176cf75c7698e2b51fe41031cf6526d974f1a
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --disable-static
      # We only want to build libgettextlib.so for java-gi to work with translations.
      - make -j$FLATPAK_BUILDER_N_JOBS -C gettext-tools/gnulib-lib
      - make -C gettext-tools/gnulib-lib install-libLTLIBRARIES
  - name: klisi
    buildsystem: simple
    sources:
      - type: archive
        url: https://gitlab.com/ckardaris/klisi/-/archive/0.5.0/klisi-0.5.0.tar.gz
        sha256: 796a9decd28432961e854828d47c406fe58d365959c9b4720b0259a9654b233e
      - type: script
        dest-filename: klisi
        commands:
          - >-
            exec /app/jre/bin/java
            --enable-native-access=ALL-UNNAMED
            -Djava.library.path=/app/lib
            -jar /app/share/com.ckardaris.Klisi/klisi-0.5.0.jar
            "$@"
      - mvn_dependencies_tools.yml
      - mvn_dependencies_project.yml
    build-options:
      env:
        JAVA_HOME: /app/jre
    build-commands:
      # Install java in the build environment and the final package.
      - /usr/lib/sdk/openjdk25/install.sh
      # Create the .jar archive.
      - mkdir -p classpath
      - find m2-tools -name '*.jar' -exec cp -t classpath {} +
      - /app/jre/bin/java -cp "./:src:resources:classpath/*" clojure.main -e "(require 'build) (build/uber {:local-repo \"m2-project\"})"
      # Install all files.
      - >-
        for po in po/*.po; do
          lang=$(basename "$po" .po);
          mkdir -p "resources/share/locale/$lang/LC_MESSAGES";
          msgfmt --output-file="resources/share/locale/$lang/LC_MESSAGES/com.ckardaris.Klisi.mo" "$po";
          install -Dm644 {resources,/app}/share/locale/$lang/LC_MESSAGES/com.ckardaris.Klisi.mo
        done
      - install -Dm644 {target/com.ckardaris.klisi,/app/share/com.ckardaris.Klisi}/klisi-0.5.0.jar
      - install -Dm644 {resources,/app}/share/applications/com.ckardaris.Klisi.desktop
      - install -Dm644 {resources,/app}/share/metainfo/com.ckardaris.Klisi.metainfo.xml
      - install -Dm644 {resources,/app}/share/icons/hicolor/scalable/apps/com.ckardaris.Klisi.svg
      - install -Dm644 {resources,/app}/share/icons/hicolor/symbolic/apps/com.ckardaris.Klisi-symbolic.svg
      - install -Dm755 {.,/app/bin}/klisi
