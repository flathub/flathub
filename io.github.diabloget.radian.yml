app-id: io.github.diabloget.radian
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: io.github.diabloget.radian

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.RemoteDesktop
  - --env=GEM_HOME=/app/gems
  - --env=GEM_PATH=/app/gems

modules:
  - name: ruby
    sources:
      - type: archive
        url: https://cache.ruby-lang.org/pub/ruby/3.4/ruby-3.4.9.tar.gz
        sha256: 7bb4d4f5e807cc27251d14d9d6086d182c5b25875191e44ab15b709cd7a7dd9c

  - name: rubygems
    buildsystem: simple
    build-commands:
      - gem install --local --install-dir /app/gems --no-document *.gem
    sources:
      # Base
      - type: file
        url: https://rubygems.org/downloads/rexml-3.4.4.gem
        sha256: 19e0a2c3425dfbf2d4fc1189747bdb2f849b6c5e74180401b15734bc97b5d142
