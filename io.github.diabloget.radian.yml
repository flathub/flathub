  - name: radian
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib/radian /app/share/applications /app/share/metainfo /app/share/icons/hicolor/scalable/apps
      - install -Dm755 bin/radian /app/bin/io.github.diabloget.radian
      - cp -r lib/radian/* /app/lib/radian/
      - install -Dm644 data/io.github.diabloget.radian.desktop /app/share/applications/io.github.diabloget.radian.desktop
      - install -Dm644 data/io.github.diabloget.radian.metainfo.xml /app/share/metainfo/io.github.diabloget.radian.metainfo.xml
      - install -Dm644 data/io.github.diabloget.radian.svg /app/share/icons/hicolor/scalable/apps/io.github.diabloget.radian.svg
    sources:
      - type: git
        url: https://github.com/diabloget/radian.git
        tag: v2.0.0
        commit: fddbff98e7e442653d6d4c153574fcf94c8ae438

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
