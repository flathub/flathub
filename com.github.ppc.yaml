app-id: com.github.ppc
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: ppc
modules:
  - name: ppc-calendar
    buildsystem: simple
    build-commands:
      - cp -r * /app/bin/
      - install -Dm644 com.github.ppc.desktop /app/share/applications/com.github.ppc.desktop
      - install -Dm644 com.github.ppc.metainfo.xml /app/share/metainfo/com.github.ppc.metainfo.xml
      - install -Dm644 Calendar.png /app/share/icons/hicolor/256x256/apps/com.github.ppc.png
    sources:
      - type: archive
        url: https://github.com/edgargarcia1949/PrettyPrintableCalendar/releases/download/v3.0/ppc-linux-x64.tar.gz
        sha256: 5b80007f1f34770dd730887db3f07c38d09118dea0964e0dc48d0ced0f3c91f9
