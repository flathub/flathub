app-id: dev.openrac.launcher
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: openrac-launcher

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=/media:ro
  - --filesystem=/run/media:ro
  - --filesystem=/mnt:ro
  - --filesystem=xdg-run/media:ro
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: openrac-launcher
    buildsystem: simple
    build-commands:
      - ar x openrac-launcher.deb
      - tar -xf data.tar.*
      - cp -r usr/* /app/
      - install -Dm644 dev.openrac.launcher.metainfo.xml /app/share/metainfo/dev.openrac.launcher.metainfo.xml
      - install -Dm644 dev.openrac.launcher.desktop /app/share/applications/dev.openrac.launcher.desktop
      - install -Dm644 dev.openrac.launcher.png /app/share/icons/hicolor/512x512/apps/dev.openrac.launcher.png
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/OpenRAC/OpenRAC/releases/download/launcher-v0.5.2/OpenRAC.Launcher_0.5.2_amd64.deb
        sha256: 9039dd85a722399f3d77dc959171c45b11de9f1a3228b3f6fccd5123677f1b4f
        dest-filename: openrac-launcher.deb

      - type: file
        only-arches:
          - aarch64
        url: https://github.com/OpenRAC/OpenRAC/releases/download/launcher-v0.5.2/OpenRAC.Launcher_0.5.2_arm64.deb
        sha256: 89082226ac64c5c933f9af77d4f8008863b0db9ef74eef27d0b6f1fc16b2d300
        dest-filename: openrac-launcher.deb

      - type: file
        path: dev.openrac.launcher.metainfo.xml

      - type: file
        path: dev.openrac.launcher.desktop

      - type: file
        path: dev.openrac.launcher.png
