app-id: io.github.peterson99pety_rgb.sistema-gnre
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: sistema-gnre

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --filesystem=xdg-desktop

modules:
  - name: leptonica
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.84.1/leptonica-1.84.1.tar.gz
        sha256: 439cc312c47d0ed8a21f06d6e19faa2e2715a1161d0ee0896b8b947f9db8d9a8

  - name: tesseract
    buildsystem: cmake-ninja
    build-options:
      prepend-path: /app
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DBUILD_TESTS=OFF
      - -DBUILD_SHARED_LIBS=ON
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/5.3.4.tar.gz
        sha256: 7ceccb0ab92a67b384aa23b7f0ed3883eb98f04b997dc558b5719df6d3d0113f

  - name: tessdata
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/share/tessdata
      - cp eng.traineddata por.traineddata ${FLATPAK_DEST}/share/tessdata/
    sources:
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
        sha256: 7d3038663d41d0e15357bbb158ac61131399640c06db190c5347eb1138846dfc
        dest-filename: eng.traineddata
      - type: file
        url: https://github.com/tesseract-ocr/tessdata/raw/main/por.traineddata
        sha256: 1d49bb170e5270433a03f6e0da2ead9027ad6335d4959b3a394855eabcfe2c27
        dest-filename: por.traineddata

  - name: sistema-gnre
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-build-isolation --no-cache-dir -r flatpak/requirements.txt
      - install -Dm755 flatpak/sistema-gnre-launcher.sh ${FLATPAK_DEST}/bin/sistema-gnre
      - mkdir -p ${FLATPAK_DEST}/lib/sistema-gnre
      - cp -r gnre_sistema ${FLATPAK_DEST}/lib/sistema-gnre/
      - cp main.py ${FLATPAK_DEST}/lib/sistema-gnre/
      - cp -r data ${FLATPAK_DEST}/lib/sistema-gnre/
      - install -Dm644 flatpak/io.github.peterson99pety_rgb.sistema-gnre.desktop ${FLATPAK_DEST}/share/applications/io.github.peterson99pety_rgb.sistema-gnre.desktop
      - install -Dm644 flatpak/io.github.peterson99pety_rgb.sistema-gnre.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.peterson99pety_rgb.sistema-gnre.metainfo.xml
      - install -Dm644 flatpak/io.github.peterson99pety_rgb.sistema-gnre.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.peterson99pety_rgb.sistema-gnre.svg
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/LICENSE
    sources:
      - type: git
        url: https://github.com/peterson99pety-rgb/sistema-gnre.git
        tag: v1.0.0
        commit: b88ac2aa6cb2a8a55ce46664fa50c0580f9502e4
        x-checker-data:
          type: git
          tag-pattern: ^v(\d+\.\d+\.\d+)$
