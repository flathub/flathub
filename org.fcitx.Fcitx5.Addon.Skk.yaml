app-id: org.fcitx.Fcitx5.Addon.Skk
runtime: org.fcitx.Fcitx5
runtime-version: stable
sdk: org.kde.Sdk//6.11
sdk-extensions:
  - org.freedesktop.Sdk.Extension.vala
build-extension: true
separate-locales: false
build-options:
  prefix: /app/addons/Skk
  prepend-path: /app/addons/Skk/bin
  prepend-pkg-config-path: /app/addons/Skk/lib/pkgconfig
  cflags: -I/app/addons/Skk/include
  append-path: /usr/lib/sdk/vala/bin
  prepend-ld-library-path: /usr/lib/sdk/vala/lib
  no-debuginfo: true
  strip: true
cleanup:
  - /bin
  - /include
  - /lib/pkgconfig
  - /lib/python*
  - /lib/vala*
  - /lib/gir*
  - /share/vala*
  - /share/gir*
  - /share/intltool
  - '*.la'
modules:
  - name: gnome-common
    rm-configure: true
    config-opts:
      - --enable-maintainer-mode
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gnome-common/3.18/gnome-common-3.18.0.tar.xz
        sha256: 22569e370ae755e04527b76328befc4c73b62bfd4a572499fde116b8318af8cf
        x-checker-data:
          type: gnome
          name: gnome-common
          stable-only: true
    cleanup:
      - '*'
  - shared-modules/intltool/intltool-0.51.json
  - name: libgee
    build-options:
      cflags: -Wno-incompatible-pointer-types
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libgee/0.20/libgee-0.20.8.tar.xz
        sha256: 189815ac143d89867193b0c52b7dc31f3aa108a15f04d6b5dca2b6adfad0b0ee
        x-checker-data:
          type: gnome
          name: libgee
          stable-only: true
  - name: libskk
    sources:
      - type: archive
        url: https://github.com/ueno/libskk/archive/1.1.1.tar.gz
        sha512: b724e8ba7c4e554848627af932a292ad3fe065a206c7c2529e0c50e2fd8252ec8ec01fe751105d8846dee882d5a7c613be5b16744e05da132684c00b4ad566ca
        x-checker-data:
          type: anitya
          project-id: 228903
          stable-only: true
          url-template: https://github.com/ueno/libskk/archive/${version}.tar.gz
    build-options:
      cflags: -Wno-int-conversion
      env:
        ACLOCAL_PATH: /app/addons/Skk/share/aclocal
        VALAFLAGS: --vapidir /app/addons/Skk/share/vala/vapi
        XDG_DATA_DIRS: /app/addons/Skk/share:/app/share:/usr/share
      prepend-ld-library-path: /app/addons/Skk/lib
    make-args:
      - V=1
  - name: skk-jisyo
    buildsystem: simple
    build-commands:
      - install -Dm644 SKK-JISYO.* -t ${FLATPAK_DEST}/share/skk/
    sources:
      - type: git
        url: https://github.com/skk-dev/dict
        commit: 0a164e6b990c5eb5b59eb7d8789f08865dc2f644
  - name: fcitx5-skk
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSKK_PATH=/app/addons/Skk/share/skk
    sources:
      - type: git
        url: https://github.com/fcitx/fcitx5-skk
        tag: 5.1.11
        commit: 78bcf9c1d374d40ff9997e8630ea90f91c48ae78
