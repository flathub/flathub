app-id: me.proton.Authenticator
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable
command: proton-authenticator
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
modules:
  - name: proton-authenticator
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin
      env:
        XDG_CACHE_HOME: /run/build/proton-authenticator/flatpak-node/cache
        YARN_GLOBAL_FOLDER: /run/build/proton-authenticator/flatpak-node/yarn-berry
        YARN_ENABLE_GLOBAL_CACHE: '0'
        YARN_ENABLE_NETWORK: '0'
        YARN_ENABLE_TELEMETRY: '0'
        YARN_ENABLE_IMMUTABLE_INSTALLS: '0'
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        SENTRYCLI_SKIP_DOWNLOAD: '1'
        NODE_OPTIONS: --max-old-space-size=6144
        CARGO_HOME: /run/build/proton-authenticator/cargo
        CARGO_NET_OFFLINE: 'true'
        # Updates are handled by Flatpak, disable the built-in AppImage updater
        TAURI_CONFIG: '{"plugins":{"updater":{"endpoints":[]}}}'
    build-commands:
      # Private Proton packages aren't needed by the authenticator and can't be
      # fetched, drop them from the lockfile and yarn config
      - python3 strip-private-registry-lockfile.py yarn.lock yarn.lock.public
      - mv yarn.lock.public yarn.lock
      - python3 clean-yarnrc.py
      - |
        set -e
        yarn() { node .yarn/releases/yarn-*.cjs "$@"; }
        yarn plugin import ./flatpak-node/flatpak-yarn.js
        yarn convertToZip unused
        yarn workspaces focus proton-authenticator
        yarn workspace proton-authenticator build:web
      # tauri-build embeds applications/authenticator/dist into the binary
      - cargo build --release --features tauri/custom-protocol --manifest-path
        applications/authenticator/src-tauri/Cargo.toml
      - install -Dm755 applications/authenticator/src-tauri/target/release/proton-authenticator
        -t /app/bin
      - |
        cd applications/authenticator/src-tauri/icons
        install -Dm644 32x32.png /app/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
        install -Dm644 64x64.png /app/share/icons/hicolor/64x64/apps/${FLATPAK_ID}.png
        install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
        install -Dm644 128x128@2x.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
        install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm644 applications/authenticator/${FLATPAK_ID}.desktop -t /app/share/applications
      # The window's app_id is the binary name
      - desktop-file-edit --set-key=StartupWMClass --set-value=proton-authenticator
        /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 applications/authenticator/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
      - install -Dm644 LICENSE -t /app/share/licenses/${FLATPAK_ID}
    sources:
      - type: git
        url: https://github.com/ProtonMail/WebClients.git
        tag: proton-authenticator@1.1.7
        commit: '0000000000000000000000000000000000000000'
        x-checker-data:
          type: json
          url: https://proton.me/download/authenticator/linux/version.json
          version-query: .Releases | map(select(.CategoryName == "Stable")) | .[0].Version
          tag-query: '"proton-authenticator@" + (.Releases | map(select(.CategoryName ==
            "Stable")) | .[0].Version)'

      - node-sources.json

      - cargo-sources.json

      - type: file
        path: tools/strip-private-registry-lockfile.py

      - type: file
        path: tools/clean-yarnrc.py
