id: io.tether.qvac
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: run.sh
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
build-options:
  strip: false
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=ELECTRON_TRASH=gio
  - --env=GTK_USE_PORTAL=1
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --persist=.qvac

modules:
  - name: obsidian
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - ar x obsidian.deb
      - tar xf data.tar.*
      - cp -a opt/Obsidian /app/obsidian
      - rm -f /app/obsidian/chrome-sandbox
      - install -Dm755 obsidian-wrapper /app/bin/obsidian
    sources:
      - type: file
        url: https://github.com/obsidianmd/obsidian-releases/releases/download/v1.12.7/obsidian_1.12.7_amd64.deb
        sha256: 3644e3ef19bcd23db4d17f7c73311b5245429391a2a48b361da93375f59712b0
        dest-filename: obsidian.deb
      - type: script
        dest-filename: obsidian-wrapper
        commands:
          - exec /app/obsidian/obsidian-cli "$@"

  # --- QVAC (packaged Electron app + desktop integration) ---
  # The archive source is extracted by flatpak-builder before build commands run.
  - name: qvac
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - |
      - install -Dm644 io.tether.qvac.metainfo.xml /app/share/metainfo/io.tether.qvac.metainfo.xml
      - install -Dm644 io.tether.qvac.png /app/share/icons/hicolor/512x512/apps/io.tether.qvac.png
      - install -Dm644 io.tether.qvac.desktop /app/share/applications/io.tether.qvac.desktop
      - install -Dm755 run.sh /app/bin/run.sh
      - cp -a main /app/main
    sources:
      - type: archive
        url: https://static.tether.dev/qv.ac/0.14.0/QV.AC-x64-flatpak.tar.gz
        sha512: a483ee3b1fa51c7982722ca25c7f7242c09e2bc8614881214f97f251d608ea3d5d57426717069ab96050f412f86d7dcca7edf97b3347da7c9a7187ac6683a9c1
        strip-components: 0
        x-checker-data:
          type: html
          url: https://static.tether.dev/qv.ac/
          version-pattern: href="\./((?:\d+\.)+\d+)/"
          url-template: https://static.tether.dev/qv.ac/$version/QV.AC-x64-flatpak.tar.gz
