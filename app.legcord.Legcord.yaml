# yaml-language-server: $schema: https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json

app-id: app.legcord.Legcord

runtime: org.freedesktop.Platform
runtime-version: &runtime-version "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
    - org.freedesktop.Sdk.Extension.node26

base: org.electronjs.Electron2.BaseApp
base-version: *runtime-version

command: startlegcord
separate-locales: false

finish-args:
    - --socket=pulseaudio
    - --socket=fallback-x11
    - --socket=wayland
    - --share=ipc
    - --share=network
    - --talk-name=org.kde.StatusNotifierWatcher # Tray functionalities on KDE
    - --talk-name=com.canonical.AppMenu.Registrar
    - --device=all # Needed for GPU acceleration and the webcam
    - --filesystem=xdg-videos:ro
    - --filesystem=xdg-pictures:ro
    - --filesystem=xdg-download # This and the above two are used for drag-n-drop, and download managing
    - --filesystem=xdg-run/pipewire-0 # Pipewire interfacing
    - --filesystem=xdg-run/speech-dispatcher # For TTS and VcNarrator
    - --filesystem=~/.steam # Needed for SteamOS integration, as the XDG OpenURL portal doesn't work properly in Game Mode. We only need ~/.steam/steam.pipe but Flatpak can't correctly mount just that: 'File "/home/deck/.steam/steam.pipe" has unsupported type 0o10000'
    - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons # This is used to show the correct cursor on Wayland

build-options:
    strip: true
    append-path: /usr/lib/sdk/node26/bin

modules:
    - name: Legcord
      buildsystem: simple
      build-options:
          strip: true
          prepend-path: /run/build/Legcord-1.2.4/pnpm/bin
          env:
              NPM_CONFIG_LOGLEVEL: info
              XDG_CACHE_HOME: /run/build/Legcord-1.2.4/flatpak-node/cache
              ELECTRON_SKIP_BINARY_DOWNLOAD: "true"
              npm_config_nodedir: /usr/lib/sdk/node26
              npm_config_store_dir: /run/build/Legcord-1.2.4/flatpak-node/pnpm-store
              npm_config_offline: "true"
      build-commands:
          - pnpm install --frozen-lockfile --offline
          - pnpm build
          # We build to appimage as it automatically generates .desktop and icons. Plus i've already written
          # the stuff for the appimage, and I know it works.
          - . flatpak-node/electron-builder-arch-args.sh; pnpm electron-builder -l --appimage $ELECTRON_BUILDER_ARCH_ARGS
          - mv dist/Legcord-*.AppImage Legcord.AppImage

          - chmod +x Legcord.AppImage
          - ./Legcord.AppImage --appimage-extract
          - desktop-file-edit --set-key="Exec" --set-value="startlegcord %U" --set-icon=$FLATPAK_ID
            squashfs-root/Legcord.desktop
          - |
              for icon in 16 32 48 64 128 256 512; do
                  install -D squashfs-root/usr/share/icons/hicolor/${icon}x${icon}/apps/Legcord.png \
                      /app/share/icons/hicolor/${icon}x${icon}/apps/app.legcord.Legcord.png
              done
          - install -D squashfs-root/Legcord.desktop /app/share/applications/app.legcord.Legcord.desktop
          - install -Dm755 startlegcord /app/bin/startlegcord
          - install -D app.legcord.Legcord.metainfo.xml -t /app/share/metainfo/
          - mv squashfs-root /app/bin/legcord

      sources:
          - type: file
            path: startlegcord
            # Directly copied locally, hopefully next release a better system. Probably a github action or something.
          - generated-sources.json

          - type: file
            url: https://github.com/Legcord/Legcord/releases/download/v1.2.4/app.legcord.Legcord.metainfo.xml
            sha512: 24ac6af3ce0437f13dd448691c8e088ce1842d327db2fcbc151aefcd9cb4181889aeb9d9843a29eec879971826fa7e796c13bdff7f6853ad252ee0675eafca1c
            x-checker-data:
                type: json
                url: https://api.github.com/repos/Legcord/Legcord/releases/latest
                version-query: .tag_name | sub("v"; "")
                url-query:
                    .assets[] | select(.name == "app.legcord.Legcord.metainfo.xml")
                    | .browser_download_url

          # maybe change to type: git ?
          - type: archive
            url: https://github.com/Legcord/Legcord/archive/v1.2.4.tar.gz
            # i wonder if the version will change as well... if it doesnt, it's prob not that big of an issue anyway lol
            dest-filename: Legcord-1.2.4.tar.gz
            sha512: 579a1a6c78aab8c723ba3c751c658e6291c8359e72760402b486e8ffad7ceb574398f392bbd05c79e9dd9eceb57f1022857680cc25314d6eb543a128ce14b693
            x-checker-data:
                type: json
                url: https://api.github.com/repos/Legcord/Legcord/releases/latest
                version-query: .tag_name | sub("v"; "")
                url-query: .tarball_url
                is-main-source: true

          - type: archive
            url: https://registry.npmjs.org/pnpm/-/pnpm-10.11.0.tgz
            sha512: 6540583f41cc5f628eb3d9773ecee802f4f9ef9923cc45b69890fb47991d4b092964694ec3a4f738a420c918a333062c8b925d312f42e4f0c263eb603551f977
            dest: pnpm
