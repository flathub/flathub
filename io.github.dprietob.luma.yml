app-id: io.github.dprietob.luma
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: luma

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=home

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/doc
  - "*.a"
  - "*.la"

modules:
  - name: portaudio
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DPA_BUILD_SHARED=ON
      - -DPA_BUILD_STATIC=OFF
    sources:
      - type: archive
        url: https://github.com/PortAudio/portaudio/archive/refs/tags/v19.7.0.tar.gz
        sha256: 5af29ba58bbdbb7bbcefaaecc77ec8fc413f0db6f4c4e286c40c3e1b83174fa0

  - name: soundtouch
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SHARED_LIBS=ON
      - -DSOUNDSTRETCH=OFF
      - -DSOUNDTOUCH_DLL=OFF
    sources:
      - type: git
        url: https://codeberg.org/soundtouch/soundtouch.git
        tag: "2.3.3"
        commit: e83424d5928ab8513d2d082779c275765dee31b9

  - name: luma
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DLUMA_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/dprietob/luma.git
        tag: "1.0.0"
        commit: c9c1c5858dd96bf4fd3f6dc0bbe542b5e9b8a454
