# Flatpak manifest for Luma — Flathub submission.
#
# Runtime: KDE (provides Qt 6). Build with:
#   flatpak install flathub org.kde.Sdk//6.11 org.kde.Platform//6.11
#   flatpak-builder --user --install --force-clean build-dir io.github.dprietob.luma.yml
#
# For the `luma` module you can build locally by swapping its `sources` for:
#   - type: dir
#     path: .
app-id: io.github.dprietob.luma
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: luma

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Audio output/input via PipeWire (PulseAudio compatibility socket).
  - --socket=pulseaudio
  # Luma manages project folders and imports/copies audio files chosen by the
  # user, and re-opens the last project by path on startup, so it needs
  # persistent access to the user's files.
  - --filesystem=home

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/doc
  - "*.a"
  - "*.la"

modules:
  - name: libogg
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.xz
        sha256: c4d91be36fc8e54deae7575241e03f4211eb102afb3fc0775fbbc1b740016705

  - name: libvorbis
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.xz
        sha256: b33cc4934322bcbf6efcbacf49e3ca01aadbea4114ec9589d1b1e9d20f72954b

  - name: flac
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TESTING=OFF
      - -DBUILD_PROGRAMS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_DOCS=OFF
      - -DINSTALL_MANPAGES=OFF
      - -DWITH_OGG=ON
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/flac/flac-1.4.3.tar.xz
        sha256: 6c58e69cd22348f441b861092b825e591d0b822e106de6eb0ee4d05d27205b70

  - name: opus
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz
        sha256: 65c1d2f78b9f2fb20082c38cbe47c951ad5839345876e46941612ee87f9a7ce1

  - name: libsndfile
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TESTING=OFF
      - -DBUILD_PROGRAMS=OFF
      - -DBUILD_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://github.com/libsndfile/libsndfile/releases/download/1.2.2/libsndfile-1.2.2.tar.xz
        sha256: 3799ca9924d3125038880367bf1468e53a1b7e3686a934f098b7e1d286cdb80e

  - name: mpg123
    buildsystem: autotools
    config-opts:
      - --with-default-audio=dummy
      - --enable-static=no
    sources:
      - type: archive
        url: https://www.mpg123.de/download/mpg123-1.32.10.tar.bz2
        sha256: 87b2c17fe0c979d3ef38eeceff6362b35b28ac8589fbf1854b5be75c9ab6557c

  - name: portaudio
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DPA_BUILD_SHARED=ON
      - -DPA_BUILD_STATIC=OFF
    sources:
      - type: archive
        url: https://github.com/PortAudio/portaudio/archive/refs/tags/v19.7.0.tar.gz
        sha256: 5af29ba58bbdbb7bbcefaaecc77ec8fc413f0db6f4c4e286c40c3e1b83174fa0

  - name: soundtouch
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SHARED_LIBS=ON
      - -DSOUNDSTRETCH=OFF
      - -DSOUNDTOUCH_DLL=OFF
    sources:
      - type: git
        url: https://codeberg.org/soundtouch/soundtouch.git
        tag: "2.3.3"
        commit: e83424d5928ab8513d2d082779c275765dee31b9

  - name: luma
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DLUMA_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/dprietob/luma.git
        tag: "1.0.0"
        commit: 08ff1fea3f52f18ac9003a008c6646598b467d84
