app-id: com.ulak.desktop
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: ulak
finish-args:
  # ui and display perms
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # network access for local tranfers
  - --share=network
  # file access so user can pick files
  - --filesystem=home
modules:
  - name: ulak
    buildsystem: simple
    build-commands:
      # install python source code instead of binary
      - install -D ulak.py /app/bin/ulak.py
      
      # create a wrapper script to run the python source
      - echo '#!/bin/sh' > /app/bin/ulak
      - echo 'exec python3 /app/bin/ulak.py "$@"' >> /app/bin/ulak
      - chmod +x /app/bin/ulak
      
      # app icon
      - install -D ulaklo.png -t /app/bin/
      - install -D ulaklo.png /app/share/icons/hicolor/256x256/apps/com.ulak.desktop.png
      
      # putting desktop and metainfo 
      - install -D com.ulak.desktop.desktop -t /app/share/applications/
      - install -D com.ulak.desktop.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: archive
        url: https://algsoft.net.tr/ulak/flatpak/ulak-linux.zip
        sha256: fad4344e6de8424896c1c2e333a5021a8ef701efe22c75bfeef1e91aed97c068
      - type: file
        path: com.ulak.desktop.desktop
      - type: file
        path: com.ulak.desktop.metainfo.xml
