app-id: io.github.kristofferr.carrier
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
- org.freedesktop.Sdk.Extension.rust-stable
command: carrier
finish-args:
- --share=ipc
- --share=network
- --device=dri
- --socket=wayland
- --socket=fallback-x11
- --socket=pulseaudio
- --filesystem=xdg-download
- --talk-name=org.freedesktop.Notifications
- --talk-name=org.kde.StatusNotifierWatcher
- --talk-name=com.canonical.Unity
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/carrier/cargo
    CARGO_NET_OFFLINE: 'true'
    CARGO_TARGET_DIR: /run/build/carrier/target
modules:
- name: carrier
  buildsystem: simple
  build-commands:
  - cargo --offline build --locked --release --manifest-path src-tauri/Cargo.toml
  - install -Dm755 target/release/carrier /app/bin/carrier
  - install -Dm644 packaging/flatpak/io.github.kristofferr.carrier.desktop /app/share/applications/io.github.kristofferr.carrier.desktop
  - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.kristofferr.carrier.png
  - install -Dm644 src-tauri/icons/64x64.png /app/share/icons/hicolor/64x64/apps/io.github.kristofferr.carrier.png
  - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.kristofferr.carrier.png
  - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.kristofferr.carrier.png
  - install -Dm644 src-tauri/linux/io.github.kristofferr.carrier.metainfo.xml /app/share/metainfo/io.github.kristofferr.carrier.metainfo.xml
  - sed -i 's#<launchable type="desktop-id">Carrier.desktop</launchable>#<launchable
    type="desktop-id">io.github.kristofferr.carrier.desktop</launchable>#' /app/share/metainfo/io.github.kristofferr.carrier.metainfo.xml
  sources:
  - type: archive
    url: https://github.com/kristofferR/Carrier/archive/c8b74d25d8042cbcb721fa729af10f0826a50fbe.tar.gz
    sha256: 36873839e9b17e7aac10f353b9b818262605f6a1b310b09a6b8e607ed2bc395b
  - cargo-sources.json
