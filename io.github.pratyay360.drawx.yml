id: io.github.pratyay360.drawx
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24

command: drawx

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: drawx
    buildsystem: simple
    build-options:
        # For GitHub Actions CI (flatpak-github-actions) we need network to fetch yarn + cargo deps.
        # For Flathub offline builds, remove --share=network and rely on vendored sources instead:
        #   Cargo: python3 flatpak-builder-tools/cargo/flatpak-cargo-generator.py \
        #              src-tauri/Cargo.lock -o cargo-sources.json
        #          then: cp cargo-sources.json flatpak/cargo-sources.json
        #   yarn:  yarn install --immutable; vendor the yarn cache manually
        #          or generate an offline mirror and add flatpak/generated-sources.json
        # Then add cargo-sources.json (+ generated-sources.json when available) as extra sources
        # (see the sources section below).  Regenerate both on every lockfile bump.
        build-args:
          - --share=network
        append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin:/run/build/drawx/bin
        env:
          CARGO_HOME: /run/build/drawx/cargo
          XDG_CACHE_HOME: /run/build/drawx/flatpak-node/cache
          npm_config_cache: /run/build/drawx/flatpak-node/npm-cache
    build-commands:
        # NOTE: do NOT use `corepack enable` here. The node24 SDK extension is
          # mounted read-only, so `corepack enable` fails with EROFS.
          # Invoke yarn through corepack instead (`corepack yarn ...`), which
          # resolves the pinned version from packageManager in package.json.
          - yarn install
          - yarn run build
          - install -Dm755 src-tauri/target/release/drawx /app/bin/drawx

          - install -Dm644 flatpak/io.github.pratyay360.drawx.desktop
            /app/share/applications/io.github.pratyay360.drawx.desktop

          - install -Dm644 flatpak/io.github.pratyay360.drawx.metainfo.xml
            /app/share/metainfo/io.github.pratyay360.drawx.metainfo.xml

          - install -Dm644 src-tauri/icons/32x32.png
            /app/share/icons/hicolor/32x32/apps/io.github.pratyay360.drawx.png
          - install -Dm644 src-tauri/icons/64x64.png
            /app/share/icons/hicolor/64x64/apps/io.github.pratyay360.drawx.png
          - install -Dm644 src-tauri/icons/128x128.png
            /app/share/icons/hicolor/128x128/apps/io.github.pratyay360.drawx.png
          - install -Dm644 src-tauri/icons/128x128@2x.png
            /app/share/icons/hicolor/256x256/apps/io.github.pratyay360.drawx.png

    sources:
      - type: git
        url: https://github.com/pratyay360/drawx.git
        tag: 0.9.6
        commit: 153f5e8293967789309c9aa18f260ce095119353
      - type: file
        path: cargo-sources.json
      - type: file
        path: generated-sources.json
