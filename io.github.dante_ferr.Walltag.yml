# Flatpak / Flathub manifest for Walltag.
# Regenerate cargo-sources.json after Cargo.lock changes:
#   ./packaging/flatpak/generate-cargo-sources.sh
#
# Host access for swww/awww/post_command: see packaging/flatpak/README.md.
app-id: io.github.dante_ferr.Walltag
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: walltag
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  # Required so backends can run host swww/awww and post_command via flatpak-spawn.
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: walltag
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/walltag/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked
      - install -Dm755 target/release/walltag /app/bin/walltag
      - install -Dm644 assets/io.github.dante_ferr.Walltag.desktop /app/share/applications/io.github.dante_ferr.Walltag.desktop
      - install -Dm644 assets/io.github.dante_ferr.Walltag.metainfo.xml /app/share/metainfo/io.github.dante_ferr.Walltag.metainfo.xml
      - install -Dm644 assets/io.github.dante_ferr.Walltag.svg /app/share/icons/hicolor/scalable/apps/io.github.dante_ferr.Walltag.svg
    sources:
      - type: git
        url: https://github.com/dante-ferr/walltag.git
        tag: v0.1.1
        commit: b2d762a0ae1aa57ac18dff97ed1a57a1eb28405d
      - cargo-sources.json
