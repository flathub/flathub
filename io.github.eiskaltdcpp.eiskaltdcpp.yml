app-id: io.github.eiskaltdcpp.eiskaltdcpp
runtime: org.kde.Platform
runtime-version: 5.15-25.08
sdk: org.kde.Sdk
command: eiskaltdcpp-qt
rename-desktop-file: eiskaltdcpp-qt.desktop
rename-icon: eiskaltdcpp

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - shared-modules/lua5.4/lua-5.4.json

  - name: miniupnpc
    buildsystem: cmake
    builddir: true
    sources:
      - type: archive
        url: https://github.com/miniupnp/miniupnp/releases/download/miniupnpc_2_3_3/miniupnpc-2.3.3.tar.gz
        sha256: d52a0afa614ad6c088cc9ddff1ae7d29c8c595ac5fdd321170a05f41e634bd1a
    cleanup:
      - /bin

  - name: eiskaltdcpp
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/eiskaltdcpp/eiskaltdcpp.git
        commit: 697db4b03e3d9ffa48b3d4c74fd043dee7663266

  - name: metainfo
    buildsystem: simple
    sources:
      - type: file
        path: io.github.eiskaltdcpp.eiskaltdcpp.metainfo.xml
    build-commands:
      - install -Dm644 io.github.eiskaltdcpp.eiskaltdcpp.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.xml

cleanup:
  - /include
  - /share/man
  - /lib/cmake
  - /lib/pkgconfig
  - '*.a'
  - '*.la'
