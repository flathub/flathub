# Flatpak manifest for QtMeshEditor.
# Wraps the Linux amd64 release .deb (same approach as the Snap). Update the
# .deb url and sha256 when shipping a new release. Flathub prefers building
# from source; this submission requests a packaging exception for Qt 6.9 +
# Ogre + Assimp (+ optional AI deps).

id: io.github.fernandotonon.QtMeshEditor
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: qtmesheditor
finish-args:
  # Ogre needs X11 window handles (launcher forces QT_QPA_PLATFORM=xcb), so
  # request X11 only — not wayland+x11 (flatpak-builder-lint warning) and not
  # fallback-x11+wayland (implies native Wayland we do not use).
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures
  - --filesystem=xdg-run/pipewire-0:ro
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --env=QT_QPA_PLATFORM=xcb
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
modules:
  - name: qtmesheditor
    buildsystem: simple
    build-commands:
      - |
        set -euo pipefail
        DEST="${FLATPAK_DEST}"
        mkdir -p extract
        ar x qtmesheditor_amd64.deb
        tar -xf data.tar.* -C extract

        install -d "${DEST}/bin"
        install -d "${DEST}/lib/qtmesheditor"
        install -d "${DEST}/share/qtmesheditor"
        install -d "${DEST}/share/applications"
        install -d "${DEST}/share/metainfo"
        install -d "${DEST}/share/mime/packages"
        install -d "${DEST}/share/icons/hicolor"
        install -d "${DEST}/share/doc/qtmesheditor"

        cp -a extract/usr/share/qtmesheditor/. "${DEST}/share/qtmesheditor/"
        cp -a extract/usr/lib/qtmesheditor/. "${DEST}/lib/qtmesheditor/"
        if [ -d extract/usr/share/doc/qtmesheditor ]; then
          cp -a extract/usr/share/doc/qtmesheditor/. "${DEST}/share/doc/qtmesheditor/"
        fi
        if [ -f extract/usr/share/mime/packages/qtmesheditor-mimetypes.xml ]; then
          install -m644 extract/usr/share/mime/packages/qtmesheditor-mimetypes.xml \
            "${DEST}/share/mime/packages/qtmesheditor-mimetypes.xml"
        fi

        if [ -f "${DEST}/share/qtmesheditor/cfg/plugins.cfg" ]; then
          sed -i 's|^PluginFolder=.*|PluginFolder=/app/lib/qtmesheditor|' \
            "${DEST}/share/qtmesheditor/cfg/plugins.cfg"
        fi

        install -m755 qtmesheditor-launcher.sh "${DEST}/bin/qtmesheditor"
        install -m755 qtmesh-launcher.sh "${DEST}/bin/qtmesh"
        install -m644 io.github.fernandotonon.QtMeshEditor.desktop \
          "${DEST}/share/applications/io.github.fernandotonon.QtMeshEditor.desktop"
        install -m644 io.github.fernandotonon.QtMeshEditor.metainfo.xml \
          "${DEST}/share/metainfo/io.github.fernandotonon.QtMeshEditor.metainfo.xml"

        # Flathub expects license text under share/licenses/$FLATPAK_ID.
        # copyright references LGPL-3 by Debian common-licenses path — ship the
        # text itself (bundled Qt is LGPL-3) plus the app MIT License.
        install -d "${DEST}/share/licenses/io.github.fernandotonon.QtMeshEditor"
        if [ -f extract/usr/share/doc/qtmesheditor/copyright ]; then
          install -m644 extract/usr/share/doc/qtmesheditor/copyright \
            "${DEST}/share/licenses/io.github.fernandotonon.QtMeshEditor/COPYING"
        fi
        install -m644 LGPL-3.txt \
          "${DEST}/share/licenses/io.github.fernandotonon.QtMeshEditor/LGPL-3.txt"
        install -m644 MIT.txt \
          "${DEST}/share/licenses/io.github.fernandotonon.QtMeshEditor/MIT.txt"

        cp -a icons/hicolor/. "${DEST}/share/icons/hicolor/"
    sources:
      - type: file
        url: https://github.com/fernandotonon/QtMeshEditor/releases/download/3.62.0/qtmesheditor_amd64.deb
        sha256: 6974feb581c43533f2569763a02877544abebdcaa1ba616994014bc184ea7498
      # After copying this YAML + sibling files to the Flathub branch root:
      - type: file
        path: qtmesheditor-launcher.sh
      - type: file
        path: qtmesh-launcher.sh
      - type: file
        path: io.github.fernandotonon.QtMeshEditor.desktop
      - type: file
        path: io.github.fernandotonon.QtMeshEditor.metainfo.xml
      - type: file
        path: licenses/LGPL-3.txt
      - type: file
        path: licenses/MIT.txt
      # dest keeps the top-level "icons/" name (dir sources copy CONTENTS only).
      - type: dir
        path: icons
        dest: icons
