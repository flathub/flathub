# Flathub submission manifest for StageVibe.
#
# This is the self-contained variant meant to live at the root of the
# `flathub/eu.deepvibe.StageVibe` repository. Unlike the local
# ../eu.deepvibe.StageVibe.yml it builds from a released archive (not a
# local `type: dir`) and uses submission-friendly permissions.
app-id: eu.deepvibe.StageVibe
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: stagevibe-launcher.sh
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  # Project files. Users who need access outside $HOME can extend this
  # with `flatpak override --filesystem=host eu.deepvibe.StageVibe`.
  - --filesystem=home
  # Required so the agent can run host tooling (git/node/shells) via
  # `flatpak-spawn --host`.
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --env=ELECTRON_TRASH=gio
  - --env=TMPDIR=/var/tmp
modules:
  - name: stagevibe
    buildsystem: simple
    build-commands:
      - mkdir -p /app/stagevibe
      - cp -a . /app/stagevibe/
      - chmod +x /app/stagevibe/stagevibe
      - install -Dm755 stagevibe-launcher.sh /app/bin/stagevibe-launcher.sh
      - install -Dm644 eu.deepvibe.StageVibe.desktop /app/share/applications/eu.deepvibe.StageVibe.desktop
      - install -Dm644 eu.deepvibe.StageVibe.metainfo.xml /app/share/metainfo/eu.deepvibe.StageVibe.metainfo.xml
      - install -Dm644 eu.deepvibe.StageVibe.png /app/share/icons/hicolor/512x512/apps/eu.deepvibe.StageVibe.png
    sources:
      - type: archive
        url: https://github.com/deepvibe-eu/StageVibe/releases/download/stagevibe@1.0.1/stagevibe-linux-x64-1.0.1.zip
        sha256: 48d00d02af78239305938c09d02d704dcd2853a57b6dd8a583569d6f82eaf741
        x-checker-data:
          type: json
          url: https://api.github.com/repos/deepvibe-eu/StageVibe/releases/latest
          version-query: .tag_name | sub("^stagevibe@"; "")
          url-query: .assets[] | select(.name == "stagevibe-linux-x64-" + $version + ".zip") | .browser_download_url
      - type: file
        path: stagevibe-launcher.sh
      - type: file
        path: eu.deepvibe.StageVibe.desktop
      - type: file
        path: eu.deepvibe.StageVibe.metainfo.xml
      - type: file
        path: eu.deepvibe.StageVibe.png
