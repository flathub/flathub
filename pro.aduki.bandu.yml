app-id: pro.aduki.bandu
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: bandu
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=dri
modules:
  - name: bandu
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/bandu /app/bin/bandu
      - install -Dm644 pro.aduki.bandu.desktop /app/share/applications/pro.aduki.bandu.desktop
      - install -Dm644 pro.aduki.bandu.metainfo.xml /app/share/metainfo/pro.aduki.bandu.metainfo.xml
      - install -Dm644 share/icons/bandu.png /app/share/icons/hicolor/128x128/apps/pro.aduki.bandu.png
    sources:
      - type: archive
        url: https://github.com/finuka-org/bandu-flatpak/releases/download/v0.1.11/bandu-0.1.11-linux-x86_64.tar.gz
        sha256: 884bf01e7630b0853d2b5522d10815446cc9d7b973fa7055d737947360fe3415
      - type: file
        path: pro.aduki.bandu.desktop
      - type: file
        path: pro.aduki.bandu.metainfo.xml
