app-id: com.hifzio.vetrolog
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: vetrolog

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --device=all
  - --filesystem=home

modules:
  - name: vetrolog
    buildsystem: simple
    build-commands:
      - install -D vetrolog /app/bin/vetrolog
      - install -D com.hifzio.vetrolog.desktop /app/share/applications/com.hifzio.vetrolog.desktop
      - install -D com.hifzio.vetrolog.metainfo.xml /app/share/metainfo/com.hifzio.vetrolog.metainfo.xml
      - install -D com.hifzio.vetrolog.png /app/share/icons/hicolor/512x512/apps/com.hifzio.vetrolog.png
    sources:
      - type: archive
        url: https://github.com/Tanvirul-swe/vetrolog/releases/download/v1.3.0/VetroLog-Linux-x64.tar.gz
        sha256: e00b74efa8fde3fb88a61c638205d715b3d3a4f8bdedc27de183fc1daccee478
      - type: file
        path: com.hifzio.vetrolog.desktop
      - type: file
        path: com.hifzio.vetrolog.metainfo.xml
      - type: file
        url: https://raw.githubusercontent.com/Tanvirul-swe/vetrolog/main/build/appicon.png
        sha256: c95a4da8682a1564d4ba93e51ced1968fd380c8d4487f89d252724900802bf5d
        dest-filename: com.hifzio.vetrolog.png
