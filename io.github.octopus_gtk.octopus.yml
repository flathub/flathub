app-id: io.github.octopus_gtk.octopus
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm21

command: octopus

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download:ro
  - --filesystem=xdg-documents:ro
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --env=ORT_DYLIB_PATH=/app/lib/libonnxruntime.so

# ── Build options ─────────────────────────────────────────────────────────────
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm21/bin
  env:
    CARGO_HOME: /run/build/octopus/cargo
    LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib
    BINDGEN_EXTRA_CLANG_ARGS: '-I/usr/lib/sdk/llvm21/lib/clang/21/include'
    GGML_NATIVE: 'ON'
    ORT_SKIP_DOWNLOAD: 'true'
    RUST_BACKTRACE: '1'
    SQLX_OFFLINE: 'true'

modules:

  - name: blueprint-compiler
    buildsystem: meson
    cleanup:
      - '*'
    sources:
      - type: git
        url: https://gitlab.gnome.org/jwestman/blueprint-compiler.git
        tag: v0.16.0
        commit: be7beddc5201b1f5a5af517077dbc7c5390ecce1

  - espeak-ng.yml

  - name: onnxruntime
    buildsystem: simple
    build-commands:
      - >-
        ./build.sh
        --config Release
        --build_shared_lib
        --parallel ${FLATPAK_BUILDER_N_JOBS}
        --skip_tests
        --skip_submodule_sync
        --compile_no_warning_as_error
        --allow_running_as_root
        --cmake_extra_defines
        FETCHCONTENT_TRY_FIND_PACKAGE_MODE=NEVER
        onnxruntime_CMAKE_DEPS_MIRROR_DIR=/run/build/onnxruntime/cmake/deps-mirror
        onnxruntime_USE_KLEIDIAI=OFF
        onnxruntime_USE_SVE=OFF
      - mkdir -p /app/lib
      - cp -a build/Linux/Release/libonnxruntime.so* /app/lib/
      - chmod 755 /app/lib/libonnxruntime.so*
      - test -e /app/lib/libonnxruntime.so || ln -sf libonnxruntime.so.1.24.2 /app/lib/libonnxruntime.so
      - install -Dm644 LICENSE /app/share/licenses/onnxruntime/LICENSE
      - install -Dm644 ThirdPartyNotices.txt /app/share/licenses/onnxruntime/ThirdPartyNotices.txt
    sources:
      - type: git
        url: https://github.com/microsoft/onnxruntime.git
        tag: v1.24.2
        commit: 058787ceead760166e3c50a0a4cba8a833a6f53f
        disable-submodules: false
