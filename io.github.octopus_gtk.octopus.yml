  - name: octopus
    buildsystem: meson
    config-opts:
      - -Dprofile=
      - -Dflatpak=true
    build-options:
      env:
        SQLX_OFFLINE: 'true'
        GGML_NATIVE: 'ON'
        ORT_SKIP_DOWNLOAD: 'true'
    sources:
