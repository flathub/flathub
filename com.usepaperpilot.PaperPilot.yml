app-id: com.usepaperpilot.PaperPilot
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: paperpilot-desktop
finish-args:
  # Graphical display access
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # GPU acceleration
  - --device=dri
  # File access to user documents and downloads
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  # Sandboxed network access (for local MCP/AI service communication)
  - --share=network

modules:
  - name: paperpilot-desktop
    buildsystem: simple
    build-commands:
      # Unpack the release .deb archive
      - ar -x paperpilot.deb
      - tar -xf data.tar.*
      # Install the binary
      - install -D -m 755 usr/bin/desktop /app/bin/paperpilot-desktop || install -D -m 755 usr/bin/PaperPilot /app/bin/paperpilot-desktop
      # Install desktop launcher, icons, and metainfo from upstream sources
      - install -D -m 644 usr/share/icons/hicolor/256x256/apps/PaperPilot.png /app/share/icons/hicolor/256x256/apps/com.usepaperpilot.PaperPilot.png || install -D -m 644 usr/share/icons/hicolor/128x128/apps/desktop.png /app/share/icons/hicolor/128x128/apps/com.usepaperpilot.PaperPilot.png
      - install -D -m 644 com.usepaperpilot.PaperPilot.desktop /app/share/applications/com.usepaperpilot.PaperPilot.desktop
      - install -D -m 644 com.usepaperpilot.PaperPilot.metainfo.xml /app/share/metainfo/com.usepaperpilot.PaperPilot.metainfo.xml
    sources:
      - type: file
        url: https://github.com/KrushnaVardhanReddy/PaperPilot/releases/download/v0.8.1/PaperPilot_0.8.1_amd64.deb
        sha256: 3c7c484640c821e2d7cbf1c82051dabe63fb75f05ca73fe5ebebb6c1c1df964b
        dest-filename: paperpilot.deb
        only-arches: [x86_64]
      - type: file
        url: https://raw.githubusercontent.com/KrushnaVardhanReddy/PaperPilot/feat/slm-model-training/packaging/flatpak/com.usepaperpilot.PaperPilot.desktop
        sha256: 311585377decc7b6907a1b28db8c312e16b89ab617665ca10403b5881246a846
        dest-filename: com.usepaperpilot.PaperPilot.desktop
      - type: file
        url: https://raw.githubusercontent.com/KrushnaVardhanReddy/PaperPilot/feat/slm-model-training/packaging/flatpak/com.usepaperpilot.PaperPilot.metainfo.xml
        sha256: 4f4055e2a933af7774bdd7aac40aa9105876a9d54514602710d8989cb9fafa69
        dest-filename: com.usepaperpilot.PaperPilot.metainfo.xml
