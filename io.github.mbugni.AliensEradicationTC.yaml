app-id: io.github.mbugni.AliensEradicationTC
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: aliens-eradication-tc.sh
finish-args:
  - --device=all
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
cleanup:
  - /include
  - /lib/*.a
  - /lib/*.la
  - /lib*/cmake
  - /lib*/pkgconfig
  - /lib*/source
  - /lib*/debug
  - /share/doc
  - /share/man
  - /share/help
modules:
  - shared-modules/linux-audio/libinstpatch.json
  - shared-modules/linux-audio/fluidsynth2.json

  - name: game-music-emu
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/libgme/game-music-emu/archive/refs/tags/0.6.5.tar.gz
        sha256: 8531678502451c2cf04248cda45c8b4645e19fcfb63e6a7ec2549641c47bb392
        x-checker-data:
          type: anitya
          project-id: 866
          stable-only: true
          url-template: https://github.com/libgme/game-music-emu/archive/refs/tags/$version.tar.gz

  - name: zmusic
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/UZDoom/ZMusic/archive/1.3.0.tar.gz
        sha256: 2eccd41e1cc9b38b3729ab94d65635719b2adc916de4ca9f8399ebceaee89f7f
        x-checker-data:
          type: anitya
          project-id: 153600
          stable-only: true
          url-template: https://github.com/UZDoom/ZMusic/archive/$version.tar.gz

  - name: uzdoom
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_CXX_FLAGS=-DSHARE_DIR=\"/app/share\"
    sources:
      - type: git
        url: https://github.com/UZDoom/UZDoom
        tag: 4.14.3
        commit: 1cb7598afadbe7ffe753b2eaf1b887e58e988036
        x-checker-data:
          type: json
          url: https://api.github.com/repos/UZDoom/UZDoom/releases/latest
          tag-query: .tag_name

  - name: freedoom2
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/freedoom/freedoom/releases/download/v0.13.0/freedoom-0.13.0.zip
        sha256: 3f9b264f3e3ce503b4fb7f6bdcb1f419d93c7b546f4df3e874dd878db9688f59
    build-commands:
      - install -Dm 644 freedoom2.wad -t /app/share/games/uzdoom

  - name: aliens-eradication-tc
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/mbugni/AliensEradicationTC/releases/download/2026.07.21/ALIENS_ERADICATION_TC_2_0.zip
        sha256: e26cdba6690d10c652a87f7dc19c22b46e3e7c8e828e86095244c2c457b81199
      - type: git
        url: https://github.com/mbugni/AliensEradicationTC
        tag: 2026.07.21
        commit: 4608b57106e089986c92b3b438c3e46bebf8ecc7
    build-commands:
      # Patch flashlight script for UZDoom compatibility
      - cp patches/ZSCRIPT.txt .
      - zip -u ALIENS_ERADICATION_TC_2_0.pk3 ZSCRIPT.txt
      # Install files
      - install -Dm 644 ERADICATION_MAPSET_2_0.wad -t /app/share/games/uzdoom
      - install -Dm 644 ALIENS_ERADICATION_TC_2_0.pk3 -t /app/share/games/uzdoom
      - install -Dm 644 aliens-eradication-tc.ini -t /app/share/games/uzdoom
      - install -Dm 644 ${FLATPAK_ID}.appdata.xml -t /app/share/appdata
      - install -Dm 644 ${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm 644 ${FLATPAK_ID}.png -t /app/share/icons/hicolor/256x256/apps
      - install -Dm 755 aliens-eradication-tc.sh -t /app/bin
