id: io.gitlab.jdsutton.aryrocks-karaoke
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: io.gitlab.jdsutton.aryrocks-karaoke
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-music:ro
modules:
  - name: portaudio
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --with-alsa
      - --without-jack
      - --without-oss
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.la
    sources:
      - type: git
        url: https://github.com/PortAudio/portaudio.git
        tag: v19.7.0
        commit: 147dd722548358763a8b649b3e4b41dfffbcfbb6
  - python3-dependencies.json
  - name: aryrocks-karaoke
    buildsystem: simple
    build-commands:
      - install -d /app/application
      - cp -a app/. /app/application/
      - install -Dm755 packaging/launcher.sh /app/bin/io.gitlab.jdsutton.aryrocks-karaoke
      - install -Dm644 packaging/io.gitlab.jdsutton.aryrocks-karaoke.desktop /app/share/applications/io.gitlab.jdsutton.aryrocks-karaoke.desktop
      - install -Dm644 packaging/io.gitlab.jdsutton.aryrocks-karaoke.metainfo.xml /app/share/metainfo/io.gitlab.jdsutton.aryrocks-karaoke.metainfo.xml
      - install -Dm644 packaging/io.gitlab.jdsutton.aryrocks-karaoke.svg /app/share/icons/hicolor/scalable/apps/io.gitlab.jdsutton.aryrocks-karaoke.svg
    sources:
      - type: git
        url: "https://gitlab.com/jdsutton/aryrocks-karaoke.git"
        tag: "v1.0"
        commit: "2c1ce6a765eef1761dde322853b88f0eaa0a9763"
        dest: app
      - type: script
        dest-filename: launcher.sh
        dest: packaging
        commands:
          - exec python3 /app/application/main.py "$@"
      - type: file
        path: io.gitlab.jdsutton.aryrocks-karaoke.desktop
        dest: packaging
      - type: file
        path: io.gitlab.jdsutton.aryrocks-karaoke.metainfo.xml
        dest: packaging
      - type: file
        path: icons/io.gitlab.jdsutton.aryrocks-karaoke.svg
        dest: packaging
