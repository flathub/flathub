id: com.nonetchat.NoNetChat
branch: stable
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: nonetchat

build-options:
  strip: false
  no-debuginfo: true

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --allow=bluetooth
  - --system-talk-name=org.bluez
  - --system-talk-name=org.freedesktop.Avahi
  - --system-talk-name=org.freedesktop.UPower
  - --socket=pulseaudio
  - --device=all
  - --filesystem=/run/udev:ro
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --env=GTK_USE_PORTAL=1
  - --filesystem=xdg-download

modules:
  - name: nonetchat
    buildsystem: simple
    build-commands:
      - test "$(uname -m)" = x86_64
      - test -x bundle/nonetchat
      - install -d /app/lib/nonetchat
      - cp -a bundle/. /app/lib/nonetchat/
      - install -Dm755 nonetchat /app/bin/nonetchat
      - install -Dm644 com.nonetchat.NoNetChat.desktop /app/share/applications/com.nonetchat.NoNetChat.desktop
      - install -Dm644 com.nonetchat.NoNetChat.metainfo.xml /app/share/metainfo/com.nonetchat.NoNetChat.metainfo.xml
      - sh icons/install-icons.sh /app/share/icons/hicolor
    sources:
      - type: archive
        url: https://github.com/pmietlicki/nonetchat-linux/releases/download/v0.3.0/NoNetChat-0.3.0-8113620da0c2-7626fed117e6-linux-x64.tar.gz
        sha256: 7626fed117e6474aaf5947d3e47d59c0f1cfb6661ac70f942bf299a0e42b13f4
        strip-components: 1
        dest: bundle
        only-arches:
          - x86_64
      - type: file
        path: nonetchat
      - type: file
        path: com.nonetchat.NoNetChat.desktop
      - type: file
        path: com.nonetchat.NoNetChat.metainfo.xml
      - type: dir
        path: icons
        dest: icons
