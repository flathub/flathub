app-id: fun.vybee.app
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: rn-linux-app

finish-args:
  # Graphical display and GPU acceleration
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Audio input / output
  - --socket=pulseaudio
  # Network access for real-time voice and chat
  - --share=network
  # Screen capture via PipeWire
  - --talk-name=org.freedesktop.portal.ScreenCast
  # Desktop notifications
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: vybee
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/rn-linux-app /app/bin/rn-linux-app
      - install -Dm644 fun.vybee.app.desktop /app/share/applications/fun.vybee.app.desktop
      - install -Dm644 fun.vybee.app.png /app/share/icons/hicolor/512x512/apps/fun.vybee.app.png
      - install -Dm644 fun.vybee.app.metainfo.xml /app/share/metainfo/fun.vybee.app.metainfo.xml
    sources:
      - type: archive
        url: https://vybee.fun/downloads/linux/Vybee-linux-x64.tar.gz
        sha256: df334d4bb159e4e1d4fe3d332769f722f6a85fbf6991525955214d42cb9bfb97
      - type: file
        path: fun.vybee.app.metainfo.xml
