app-id: io.github.sc_software_tools.sc_utility_suite_dist.UsbFlasher
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: sc-usb-flasher
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.secrets
  - --system-talk-name=org.freedesktop.UDisks2
  - --filesystem=/media
  - --filesystem=/run/media
modules:
  - name: sc-usb-flasher
    buildsystem: simple
    build-commands:
      - mkdir -p /app/UsbFlasher && cp -r . /app/UsbFlasher/ && rm -f /app/UsbFlasher/*.pdb /app/UsbFlasher/*.desktop /app/UsbFlasher/*.svg
      - install -Dm755 sc-usb-flasher.sh /app/bin/sc-usb-flasher
      - install -Dm644 sc-usb-flasher.svg /app/share/icons/hicolor/scalable/apps/io.github.sc_software_tools.sc_utility_suite_dist.UsbFlasher.svg
      - desktop-file-edit --set-key=Exec --set-value='sc-usb-flasher %F' --set-icon=io.github.sc_software_tools.sc_utility_suite_dist.UsbFlasher --set-key=StartupWMClass --set-value=UsbFlasher.Desktop sc-usb-flasher.desktop && install -Dm644 sc-usb-flasher.desktop /app/share/applications/io.github.sc_software_tools.sc_utility_suite_dist.UsbFlasher.desktop
      - install -Dm644 io.github.sc_software_tools.sc_utility_suite_dist.UsbFlasher.metainfo.xml /app/share/metainfo/io.github.sc_software_tools.sc_utility_suite_dist.UsbFlasher.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/sc-software-tools/sc-utility-suite-dist/releases/download/suite-v1.1.2/UsbFlasher-1.1.2-linux-x64.tar.gz
        sha256: d15104463951d7fbb08c701cc3e8089077cf06d38e2176e67819d4fc67f8afa0
        strip-components: 1
      - type: file
        path: sc-usb-flasher.sh
      - type: file
        path: io.github.sc_software_tools.sc_utility_suite_dist.UsbFlasher.metainfo.xml
