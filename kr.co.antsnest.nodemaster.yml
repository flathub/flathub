# Flathub 제출용 매니페스트.
#
# 왜 extra-data 인가: 노드마스터는 비공개 소스라 Flathub 가 소스에서 빌드할 수 없다.
# 독점 앱은 이미 배포 중인 바이너리를 설치 시점에 내려받는 extra-data 로 올린다.
# 아래 url/sha256/size 는 brand 사이트에 등록된 리눅스 deb 와 같은 파일이어야 한다.
# 판을 올릴 때마다 세 값과 metainfo 의 <release> 를 함께 고친다.
#
# Electron 이 아니라 .NET 자체 포함 발행이므로 Electron 베이스도 zypak 도 쓰지 않는다.
# 런타임의 libicu 를 쓰므로 글로벌라이제이션을 끄지 않아도 된다.
#
# deb 안쪽은 zstd 로 눌려 있다. org.freedesktop.Platform 26.08 의 bsdtar 는
# ar 묶음인 .deb 와 그 안의 data.tar.zst 를 모두 읽는다(런타임에 ar 은 없다).
id: kr.co.antsnest.nodemaster
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: nodemaster

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
  # 문서를 내 컴퓨터에 저장하는 앱이라 문서 폴더가 필요하다.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

modules:
  - name: nodemaster
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 nodemaster.sh /app/bin/nodemaster
      - install -Dm644 kr.co.antsnest.nodemaster.desktop
        /app/share/applications/kr.co.antsnest.nodemaster.desktop
      - install -Dm644 kr.co.antsnest.nodemaster.metainfo.xml
        /app/share/metainfo/kr.co.antsnest.nodemaster.metainfo.xml
      - install -Dm644 icon.png
        /app/share/icons/hicolor/256x256/apps/kr.co.antsnest.nodemaster.png
    sources:
      - type: extra-data
        filename: nodemaster.deb
        url: https://file.skynet.re.kr/biz_antsnest/f20261028_8wf4fr.deb
        sha256: 6d67c12f88cbcbb3fee9f56cdefdb0d6a6119e9eb2e4f1c7727cea6af9682331
        size: 35334644

      - type: script
        dest-filename: apply_extra
        commands:
          - bsdtar -xOf nodemaster.deb 'data.tar*' | bsdtar -xf - './usr/lib/nodemaster'
          - mv usr/lib/nodemaster app
          - rm -rf usr nodemaster.deb

      - type: script
        dest-filename: nodemaster.sh
        commands:
          - exec /app/extra/app/nodemaster "$@"

      - type: file
        path: icon.png

      - type: file
        path: kr.co.antsnest.nodemaster.desktop

      - type: file
        path: kr.co.antsnest.nodemaster.metainfo.xml
