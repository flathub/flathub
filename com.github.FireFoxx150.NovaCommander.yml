app-id: com.github.FireFoxx150.NovaCommander
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: nova-commander
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Notifications
modules:
  # zypak lets Electron use Chromium's sandbox inside Flatpak, so --no-sandbox isn't needed.
  - name: zypak
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/refi64/zypak.git
        tag: v2025.09
        commit: 693a71c5ffa80ec9c9ce2ae03b1ccc493c698e53
    build-commands:
      - ./configure --prefix=/app/lib/zypak
      - make -j4
      - install -d /app/lib/zypak/build
      - install -m755 build/zypak-sandbox build/zypak-helper /app/lib/zypak/build/
      - install -m755 build/*.so /app/lib/zypak/build/
      - install -m755 zypak-wrapper.sh /app/lib/zypak/
      - install -Dm644 LICENSE /app/share/doc/zypak/LICENSE
  - name: nova-commander
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/FireFoxx150/nova-commander.git
        commit: 45b3474973e85eca0853d76863ea5007f13f87b2
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/electron/electron/releases/download/v44.10.1/electron-v44.10.1-linux-x64.zip
        sha256: 2be868b71b0aa71f30e6b5567a106a35a049385e963183c074aad1975ead5167
        dest: electron
      - type: file
        path: nova-commander.sh
      - type: file
        path: com.github.FireFoxx150.NovaCommander.desktop
      - type: file
        path: com.github.FireFoxx150.NovaCommander.metainfo.xml
    build-commands:
      - mkdir -p /app/lib/nova-commander/resources/app
      - cp -a electron/. /app/lib/nova-commander/
      - mv /app/lib/nova-commander/electron /app/lib/nova-commander/nova-commander
      - rm -f /app/lib/nova-commander/resources/default_app.asar
      - cp -a main.js preload.js pty-helper.py package.json icon.png renderer LICENSE THIRD_PARTY_NOTICES.md /app/lib/nova-commander/resources/app/
      - install -Dm755 nova-commander.sh /app/bin/nova-commander
      - install -Dm644 com.github.FireFoxx150.NovaCommander.desktop /app/share/applications/com.github.FireFoxx150.NovaCommander.desktop
      - install -Dm644 com.github.FireFoxx150.NovaCommander.metainfo.xml /app/share/metainfo/com.github.FireFoxx150.NovaCommander.metainfo.xml
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/com.github.FireFoxx150.NovaCommander.svg
      - for s in 16 32 48 64 128 256 512; do install -Dm644 build/icons/$s.png /app/share/icons/hicolor/${s}x${s}/apps/com.github.FireFoxx150.NovaCommander.png; done
