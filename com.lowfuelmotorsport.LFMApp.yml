# LFM App (Low Fuel Motorsport). Upstream: PitPath UG (haftungsbeschränkt), https://lowfuelmotorsport.com
# Repackages the official Linux release tarball (Electron app).

app-id: com.lowfuelmotorsport.LFMApp
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: lfm-app
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Notifications and tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  # Steam libraries and Proton prefixes (ACC / AC documents live in compatdata/<appid>/pfx)
  - --filesystem=~/.steam
  - --filesystem=~/.local/share/Steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam
  # Steam libraries on other drives
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=/run/media

modules:
  - name: lfm-app
    buildsystem: simple
    build-commands:
      - cp -a lfm-app /app/lfm-app
      - install -Dm755 lfm-app.sh /app/bin/lfm-app
      - install -Dm644 lfm-app/resources/linux/com.lowfuelmotorsport.LFMApp.desktop -t /app/share/applications
      - install -Dm644 lfm-app/resources/linux/com.lowfuelmotorsport.LFMApp.metainfo.xml -t /app/share/metainfo
      - |
        for size in 16 24 32 48 64 96 128 256 512; do
          install -Dm644 lfm-app/resources/assets/icons/${size}x${size}.png \
            /app/share/icons/hicolor/${size}x${size}/apps/com.lowfuelmotorsport.LFMApp.png
        done
    sources:
      - type: archive
        url: https://downloads.livery.lowfuelmotorsport.com/lfm-hub-updates/lfm-app-1.2.1-linux-x64.tar.gz
        sha256: 84a46ff5c3f59455e4743a14f7119119487e485063d84c7f758412de9993493a
        dest: lfm-app
      - type: file
        path: lfm-app.sh
