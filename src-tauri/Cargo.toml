[package]
name = "openkara"
version = "0.8.0"
description = "OpenKara desktop shell"
authors = ["OpenKara contributors"]
license = "MIT"
edition = "2021"
default-run = "openkara"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "openkara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[[bin]]
name = "openkara"
path = "src/main.rs"

[build-dependencies]
cc = "1.2.61"
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
anyhow = "1.0.102"
audioadapter-buffers = "3.0.0"
base64 = "0.22.1"
cpal = "0.17.3"
hound = "3.5.1"
libc = "0.2.186"
lofty = "0.24.0"
open = "5.3.4"
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "xnnpack", "directml"] }
rand = "0.10.1"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rubato = "2.0.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tauri = { version = "2.11.0", features = ["unstable"] }
tauri-plugin-dialog = "2.7.1"
tiny_http = "0.12.0"
vorbis_rs = "0.5.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
mockito = "1.7.2"
tauri = { version = "2.11.0", features = ["test", "unstable"] }
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
