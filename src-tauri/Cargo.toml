[package]
name = "openkara"
version = "0.6.0"
description = "OpenKara desktop shell"
authors = ["OpenKara contributors"]
license = "MIT"
edition = "2021"
default-run = "openkara"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "openkara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[[bin]]
name = "openkara"
path = "src/main.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
audioadapter-buffers = "2"
base64 = "0.22"
cpal = "0.17.3"
hound = "3.5"
libc = "0.2"
lofty = "0.23.3"
ort = { version = "2.0.0-rc.11", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "xnnpack", "directml"] }
rand = "0.9"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rubato = "1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2.7.0"
tiny_http = "0.12"
vorbis_rs = "0.5.5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
mockito = "1.7"
tauri = { version = "2", features = ["test", "unstable"] }
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
