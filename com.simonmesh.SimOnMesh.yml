app-id: com.simonmesh.SimOnMesh
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk

command: simonmesh

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home

modules:
  - name: SimOnMesh
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 simonmesh /app/bin/simonmesh
      - install -Dm644 com.simonmesh.SimOnMesh.desktop
          /app/share/applications/com.simonmesh.SimOnMesh.desktop
      - install -Dm644 SimOnMesh.png
          /app/share/icons/hicolor/512x512/apps/com.simonmesh.SimOnMesh.png
      - install -Dm644 com.simonmesh.SimOnMesh.metainfo.xml
          /app/share/metainfo/com.simonmesh.SimOnMesh.metainfo.xml
    sources:
      - type: script
        dest-filename: apply_extra
        commands:
          - tar -xf SimOnMesh-1.5.1-linux-x86_64.tar.gz
          - rm SimOnMesh-1.5.1-linux-x86_64.tar.gz
      - type: script
        dest-filename: simonmesh
        commands:
          - export LD_LIBRARY_PATH=/app/extra/lib
          - exec /app/extra/SimOnMesh "$@"
      - type: extra-data
        filename: SimOnMesh-1.5.1-linux-x86_64.tar.gz
        url: https://github.com/sim-on-mesh/sim-on-mesh/releases/download/1.5.1/SimOnMesh-1.5.1-linux-x86_64.tar.gz
        sha256: b094cc65e308e02de2450632434688b795eb900256577ac4d0395860838643bd
        size: 47875157
      - type: file
        path: com.simonmesh.SimOnMesh.desktop
      - type: file
        path: SimOnMesh512.png
        dest-filename: SimOnMesh.png
      - type: file
        path: com.simonmesh.SimOnMesh.metainfo.xml
