app-id: org.openus.Openus
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk

command: openus

finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --share=network
  - --device=dri
  - --filesystem=host:ro

modules:
  - name: libssh
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DWITH_GSSAPI=OFF
      - -DWITH_SERVER=OFF
      - -DWITH_PCAP=OFF
      - -DWITH_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://www.libssh.org/files/0.10/libssh-0.10.6.tar.xz
        sha256: 1861d498f5b6f1741b6abc73e608478491edcf9c9d4b6630eef6e74596de9dc1

  - name: websocketpp
    buildsystem: simple
    build-commands:
      - cp -r websocketpp /app/include/
    sources:
      - type: archive
        url: https://github.com/zaphoyd/websocketpp/archive/refs/tags/0.8.2.tar.gz
        sha256: 6ce889d85ecdc2d8fa07408d6787e7352510750daa66b5ad44aacb47bea76755

  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app --with-libraries=system
      - ./b2 headers
      - ./b2 install --prefix=/app
    sources:
      - type: archive
        url: https://github.com/boostorg/boost/releases/download/boost-1.83.0/boost-1.83.0.tar.gz
        sha256: 0c6049764e80aa32754acd7d4f179fd5551d8172a83b71532ae093e7384e98da

  - name: openus
    buildsystem: simple
    build-commands:
      - g++ -std=c++17 -O2 main.cpp -o openus 
        -I/app/include -L/app/lib
        $(pkg-config --cflags --libs gtk+-3.0 webkit2gtk-4.1 libssh) 
        -lpthread -lboost_system

      - install -D -m 755 openus /app/bin/openus
      - mkdir -p /app/bin/static
      - cp -r static/* /app/bin/static/

      - install -D -m 644 org.openus.Openus.desktop /app/share/applications/org.openus.Openus.desktop
      - install -D -m 644 org.openus.Openus.png /app/share/icons/hicolor/512x512/apps/org.openus.Openus.png
      - install -D -m 644 org.openus.Openus.metainfo.xml /app/share/metainfo/org.openus.Openus.metainfo.xml

    sources:
      - type: git
        url: https://github.com/portcmd/openus.git
        tag: v1.0.0
        commit: 73f2a01d5a5b8f3c8c644e403417e0ddda88a230
