id: de.skyboxmail.Skybox
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: de.skyboxmail.Skybox
separate-locales: false
tags:
  - proprietary

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto

modules:
  - name: skybox
    buildsystem: simple
    build-commands:
      - cp -a app /app/skybox
      - install -Dm755 skybox.sh /app/bin/${FLATPAK_ID}
      - install -Dm644 de.skyboxmail.Skybox.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 de.skyboxmail.Skybox.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - |
        set -e
        for size in 128 256 512; do
          install -Dm644 de.skyboxmail.Skybox.${size}.png /app/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png
        done
    sources:
      - type: archive
        only-arches:
          - x86_64
        dest: app
        url: https://downloads.skyboxmail.de/Skybox-0.1.22-x64.tar.gz
        sha256: 7e1a45157fe81a2057db942057cb745ac744baab0667623fd4a5d921fa01ecce
        x-checker-data:
          type: json
          url: https://downloads.skyboxmail.de/latest-flathub.json
          version-query: .version
          url-query: .x86_64.url
      - type: archive
        only-arches:
          - aarch64
        dest: app
        url: https://downloads.skyboxmail.de/Skybox-0.1.22-arm64.tar.gz
        sha256: 542fa624917d6b5a162db7fea3a1c48c0b0d13f176dae1ccaab81223e002fd90
        x-checker-data:
          type: json
          url: https://downloads.skyboxmail.de/latest-flathub.json
          version-query: .version
          url-query: .aarch64.url
      - type: file
        path: skybox.sh
      - type: file
        path: de.skyboxmail.Skybox.desktop
      - type: file
        path: de.skyboxmail.Skybox.metainfo.xml
      - type: file
        path: de.skyboxmail.Skybox.128.png
      - type: file
        path: de.skyboxmail.Skybox.256.png
      - type: file
        path: de.skyboxmail.Skybox.512.png
