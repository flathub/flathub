id: org.reefguide.id
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: reefguide
modules:
  - name: main-module
    buildsystem: simple
    build-commands:
      # Copy files from extracted tarball to the /app directory
      - install -D -m 755 reefguide -t /app/bin
      - install -D -m 644 org.reefguide.id.metainfo.xml -t /app/share/metainfo
      - install -D -m 644 org.reefguide.id.desktop -t /app/share/applications
      - install -D -m 644 apps/32x32/org.reefguide.id.png /app/share/icons/hicolor/32x32/apps/org.reefguide.id.png
      - install -D -m 644 apps/64x64/org.reefguide.id.png /app/share/icons/hicolor/64x64/apps/org.reefguide.id.png
      - install -D -m 644 apps/128x128/org.reefguide.id.png /app/share/icons/hicolor/128x128/apps/org.reefguide.id.png
      - install -D -m 644 apps/256x256/org.reefguide.id.png /app/share/icons/hicolor/256x256/apps/org.reefguide.id.png
      - install -D -m 644 apps/512x512/org.reefguide.id.png /app/share/icons/hicolor/512x512/apps/org.reefguide.id.png
      - mv data lib /app/bin/.
    sources:
      - type: archive
        url: https://reefguide.org/reefguide.tar.gz
        sha256: d128b5258bceaaa27e0198803116304d386dacf8a52f973210e38afb05f86541
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
