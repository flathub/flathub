<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients for depth -->
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    
    <!-- Inner shadow for depth -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- macOS rounded square shape -->
  <rect x="10" y="10" width="180" height="180" rx="45" ry="45" 
        fill="url(#purpleGrad)" 
        filter="url(#innerShadow)"/>
  
  <!-- Subtle shine overlay -->
  <rect x="10" y="10" width="180" height="90" rx="45" ry="45" 
        fill="url(#shine)" 
        style="mix-blend-mode: overlay;"/>
  
  <!-- Vinyl record with skeuomorphic details -->
  <defs>
    <radialGradient id="vinylGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="labelGrad" cx="50%" cy="45%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0c0c0;stop-opacity:1" />
    </radialGradient>
    
    <filter id="vinylShine">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
    </filter>
  </defs>
  
  <g transform="translate(100, 100)">
    <!-- Vinyl record base -->
    <circle cx="0" cy="0" r="65" fill="url(#vinylGrad)" filter="url(#vinylShine)"/>
    
    <!-- Grooves -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#000000" stroke-width="0.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#000000" stroke-width="0.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#000000" stroke-width="0.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#000000" stroke-width="0.5" opacity="0.3"/>
    
    <!-- Center label -->
    <circle cx="0" cy="0" r="22" fill="url(#labelGrad)"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#d0d0d0" stroke-width="0.5"/>
    
    <!-- Center hole -->
    <circle cx="0" cy="0" r="5" fill="#0a0a0a"/>
    <circle cx="0" cy="0" r="4" fill="#1a1a1a"/>
    
    <!-- Subtle reflection on vinyl -->
    <ellipse cx="-15" cy="-20" rx="35" ry="20" fill="white" opacity="0.08" transform="rotate(-30 -15 -20)"/>
    
    <!-- Center label decoration -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#c0c0c0" stroke-width="0.3"/>
  </g>
  
  <!-- App name at bottom -->
  <text x="100" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">Doudou</text>
</svg>
