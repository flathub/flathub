id: com.websolutis.Bernie
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: bernie-desktop
finish-args:
  # Native Wayland, with X11 as a fallback.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU acceleration for the WebKitGTK-based UI.
  - --device=dri
  # USB serial ports for GRBL/grblHAL/FluidNC/Marlin/Smoothieware lasers.
  # Flatpak has no finer-grained permission for serial devices.
  - --device=all
  # Wi-Fi/Ethernet lasers, mDNS discovery, online art libraries, updates.
  - --share=network
modules:
  - name: bernie
    buildsystem: simple
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      - bsdtar -Oxf bernie.deb 'data.tar.gz' | bsdtar -xf -
      - install -Dm755 usr/bin/bernie-desktop /app/bin/bernie-desktop
      - mkdir -p /app/lib && cp -r usr/lib/Bernie /app/lib/Bernie
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/bernie-desktop.png /app/share/icons/hicolor/32x32/apps/com.websolutis.Bernie.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/bernie-desktop.png /app/share/icons/hicolor/128x128/apps/com.websolutis.Bernie.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/bernie-desktop.png /app/share/icons/hicolor/256x256/apps/com.websolutis.Bernie.png
      - install -Dm644 usr/share/icons/hicolor/scalable/apps/bernie-desktop.svg /app/share/icons/hicolor/scalable/apps/com.websolutis.Bernie.svg
      - install -Dm644 usr/share/applications/Bernie.desktop /app/share/applications/com.websolutis.Bernie.desktop
      - desktop-file-edit --set-icon=com.websolutis.Bernie /app/share/applications/com.websolutis.Bernie.desktop
      - install -Dm644 usr/share/metainfo/com.websolutis.Bernie.metainfo.xml /app/share/metainfo/com.websolutis.Bernie.metainfo.xml
      - sed -i 's|>Bernie.desktop</launchable>|>com.websolutis.Bernie.desktop</launchable>|' /app/share/metainfo/com.websolutis.Bernie.metainfo.xml
      - install -Dm644 usr/share/mime/packages/bernie.xml /app/share/mime/packages/com.websolutis.Bernie.xml
    sources:
      - type: file
        url: https://github.com/beber666/bernie-releases/releases/download/v0.9.1/Bernie_0.9.1_amd64.deb
        sha256: f2d3745ce059fe13e274f91ccd49f8517016a45703addd975ee4078b74ba2c20
        dest-filename: bernie.deb
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/beber666/bernie-releases/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "Bernie_" + $version + "_amd64.deb") | .browser_download_url
          timestamp-query: .published_at
      - type: file
        url: https://github.com/beber666/bernie-releases/releases/download/v0.9.1/Bernie_0.9.1_arm64.deb
        sha256: d060eabea522ed49c2c56f74968537f17a74c8f4c57839ad64f83ca10b9e171f
        dest-filename: bernie.deb
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/beber666/bernie-releases/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "Bernie_" + $version + "_arm64.deb") | .browser_download_url
          timestamp-query: .published_at
