app-id: io.github.Duf1220.PicoCar-Racing
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: picocar-racing
separate-locales: false

finish-args:
  # Unity 2022 has no native Wayland backend, the game runs through X11/XWayland
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  # GPU acceleration and gamepads (Unity reads /dev/input via evdev)
  - --device=dri
  - --device=input
  - --require-version=1.16.0

modules:
  - name: picocar-racing
    buildsystem: simple
    build-commands:
      # The release archive is split into four parts because of upload limits; join and extract it
      - cat PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part0 PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part1 PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part2 PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part3 | tar -xJ --no-same-owner --no-same-permissions --strip-components=1
      - mkdir -p /app/lib/picocar-racing
      - cp -r "PicoCar Racing.x86_64" "PicoCar Racing_Data" UnityPlayer.so /app/lib/picocar-racing/
      - chmod 755 "/app/lib/picocar-racing/PicoCar Racing.x86_64"
      # Launcher, desktop file, MetaInfo and icon come from the upstream repository
      - install -Dm755 upstream/io.github.Duf1220.PicoCar-Racing/picocar-racing /app/bin/picocar-racing
      - install -Dm644 upstream/io.github.Duf1220.PicoCar-Racing/io.github.Duf1220.PicoCar-Racing.desktop -t /app/share/applications
      - install -Dm644 upstream/io.github.Duf1220.PicoCar-Racing/io.github.Duf1220.PicoCar-Racing.metainfo.xml -t /app/share/metainfo
      - install -Dm644 upstream/io.github.Duf1220.PicoCar-Racing/io.github.Duf1220.PicoCar-Racing.png /app/share/icons/hicolor/256x256/apps/io.github.Duf1220.PicoCar-Racing.png
    sources:
      - type: git
        url: https://github.com/Duf1220/PicoCar-Racing.git
        commit: e78119729dbacac8cf8e4f9672a009a4b08ba8f7
        dest: upstream
      - type: file
        url: https://github.com/Duf1220/PicoCar-Racing/releases/download/v1.0.0/PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part0
        sha256: ef76ca2afd89cc683389dad6714e6f0b986f70251ce2abdfcc67c0df0baa54e2
        only-arches: [x86_64]
      - type: file
        url: https://github.com/Duf1220/PicoCar-Racing/releases/download/v1.0.0/PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part1
        sha256: 7d59be8c96ad57cdf6f7bad64c500819ccb0ef2a2b2079721008375c5a2e79a2
        only-arches: [x86_64]
      - type: file
        url: https://github.com/Duf1220/PicoCar-Racing/releases/download/v1.0.0/PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part2
        sha256: 9513813bfe3098d26ab1f63cf3636acef5533ffe8500c365bf6622ee5d0ec065
        only-arches: [x86_64]
      - type: file
        url: https://github.com/Duf1220/PicoCar-Racing/releases/download/v1.0.0/PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part3
        sha256: 1a935dbae86c8b835d0321e42bb5150f6fcdc5fce2420ab6602e7e1c04c01151
        only-arches: [x86_64]
