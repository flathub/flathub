# Flatpak manifest pro PicoCar Racing (Unity 2022.3.3f1, Linux x86_64 build)
app-id: io.github.Duf1220.PicoCar-Racing
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: picocar-racing
separate-locales: false

finish-args:
  # Unity 2022 nemá nativní Wayland backend, běží přes X11 / XWayland
  - --share=ipc
  - --socket=x11
  # Zvuk (Unity používá PulseAudio / PipeWire-pulse)
  - --socket=pulseaudio
  # GPU akcelerace a gamepady (Unity čte /dev/input přes evdev).
  # --device=input by vyžadoval Flatpak >= 1.15.6, proto širší --device=all.
  - --device=all
  # Síť: hra obsahuje Unity Analytics / IAP / Ads knihovny. Nechte VYPNUTO, pokud
  # hra bez sítě funguje (otestovat!). Pokud ji nutně potřebuje, odkomentujte a
  # v metainfo popište, k čemu se síť používá.
  # - --share=network

modules:
  - name: picocar-racing
    buildsystem: simple
    build-commands:
      - cat PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part0 PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part1 PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part2 PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part3 | tar -xJ --no-same-owner --no-same-permissions --strip-components=1
      - mkdir -p /app/lib/picocar-racing
      - cp -r "PicoCar Racing.x86_64" "PicoCar Racing_Data" UnityPlayer.so /app/lib/picocar-racing/
      # archiv vznikl na FAT SD kartě, kde se ztratil příznak spustitelnosti
      - chmod 755 "/app/lib/picocar-racing/PicoCar Racing.x86_64"
      - install -Dm755 picocar-racing /app/bin/picocar-racing
      - install -Dm644 io.github.Duf1220.PicoCar-Racing.desktop -t /app/share/applications
      - install -Dm644 io.github.Duf1220.PicoCar-Racing.metainfo.xml -t /app/share/metainfo
      - install -Dm644 io.github.Duf1220.PicoCar-Racing.png /app/share/icons/hicolor/256x256/apps/io.github.Duf1220.PicoCar-Racing.png
    sources:
      - type: file
        path: picocar-racing
      - type: file
        path: io.github.Duf1220.PicoCar-Racing.desktop
      - type: file
        path: io.github.Duf1220.PicoCar-Racing.metainfo.xml
      - type: file
        path: io.github.Duf1220.PicoCar-Racing.png
      # Build hry je rozdělený na 4 díly (tar.xz, viz Release v1.0.0); build je spojí.
      - type: file
        url: https://github.com/Duf1220/PicoCar-Racing/releases/download/v1.0.0/PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part0
        sha256: ef76ca2afd89cc683389dad6714e6f0b986f70251ce2abdfcc67c0df0baa54e2
        only-arches: [x86_64]
      - type: file
        url: https://github.com/Duf1220/PicoCar-Racing/releases/download/v1.0.0/PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part1
        sha256: 7d59be8c96ad57cdf6f7bad64c500819ccb0ef2a2b2079721008375c5a2e79a2
        only-arches: [x86_64]
      - type: file
        url: https://github.com/Duf1220/PicoCar-Racing/releases/download/v1.0.0/PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part2
        sha256: 9513813bfe3098d26ab1f63cf3636acef5533ffe8500c365bf6622ee5d0ec065
        only-arches: [x86_64]
      - type: file
        url: https://github.com/Duf1220/PicoCar-Racing/releases/download/v1.0.0/PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part3
        sha256: 1a935dbae86c8b835d0321e42bb5150f6fcdc5fce2420ab6602e7e1c04c01151
        only-arches: [x86_64]
