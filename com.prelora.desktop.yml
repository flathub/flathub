# Prelora desktop — Flathub / Flatpak manifest (T71.4)
#
# App ID: com.prelora.desktop
# Binary source: public archive on https://prelora.app/downloads/ (type: archive).
# Update url + sha256 on every release (see docs/dev/linux-downloads.md).
#
# Local build (after a real sha256 is published):
#   flatpak-builder --user --force-clean /tmp/prelora-fp packaging/flatpak/com.prelora.desktop.yml
#
# Note: the Wails binary links against WebKitGTK/GTK from the build host (Ubuntu).
# First Flathub review may require bundling shared libraries or rebuilding against
# the GNOME SDK — track reviewer feedback and adjust the archive contents.

id: com.prelora.desktop
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: prelora-desktop

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.portal.Desktop
  # App data uses $XDG_DATA_HOME/prelora (Flatpak-isolated). No --filesystem=home.

modules:
  - name: prelora-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 usr/bin/prelora-desktop /app/bin/prelora-desktop
      - install -Dm644 usr/share/applications/com.prelora.desktop.desktop /app/share/applications/com.prelora.desktop.desktop
      - install -Dm644 com.prelora.desktop.metainfo.xml /app/share/metainfo/com.prelora.desktop.metainfo.xml
      - |
        for size in 16 22 24 32 48 64 128 256 512; do
          src="usr/share/icons/hicolor/${size}x${size}/apps/com.prelora.desktop.png"
          if [ -f "$src" ]; then
            install -Dm644 "$src" "/app/share/icons/hicolor/${size}x${size}/apps/com.prelora.desktop.png"
          fi
        done
      - |
        if [ -f usr/share/icons/hicolor/symbolic/apps/com.prelora.desktop-symbolic.svg ]; then
          install -Dm644 usr/share/icons/hicolor/symbolic/apps/com.prelora.desktop-symbolic.svg \
            /app/share/icons/hicolor/symbolic/apps/com.prelora.desktop-symbolic.svg
        fi
    sources:
      # Stable latest URL — replace sha256 after each R2 upload (required by Flatpak).
      # Value: files.flatpak_archive.sha256 from https://prelora.app/downloads/latest.json
      - type: archive
        url: https://prelora.app/downloads/latest/prelora-desktop-x86_64.tar.gz
        sha256: "862fd78e70136bbc5824326bea96d1aa666cb256a281b449f8d0425734de04a7"
      - type: file
        path: com.prelora.desktop.metainfo.xml
