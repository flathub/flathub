id: io.github.virat013s.vitro
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: vitro
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
  - --env=GI_TYPELIB_PATH=/app/lib/girepository-1.0
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gir-1.0
modules:
  - name: vte
    buildsystem: meson
    config-opts:
      - -Dgtk3=true
      - -Dgtk4=false
      - -Dvapi=false
      - -Ddocs=false
      - -Dgir=true
    sources:
      - type: archive
        url: https://gitlab.gnome.org/GNOME/vte/-/archive/0.78.4/vte-0.78.4.tar.gz
        sha256: cc6820090d160fbfb627da821954d4693ee4538b155a747a04021be536448e37
  - name: ncurses
    config-opts:
      - --with-shared
      - --without-ada
      - --without-cxx
      - --without-cxx-binding
      - --enable-widec
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/ncurses/ncurses-6.5.tar.gz
        sha256: 136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6
  - name: fish
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DWITH_GETTEXT=NO
      - -DBUILD_DOCS=NO
      - -DBUILD_TESTS=NO
    sources:
      - type: archive
        url: https://github.com/fish-shell/fish-shell/releases/download/3.7.1/fish-3.7.1.tar.xz
        sha256: 614c9f5643cd0799df391395fa6bbc3649427bb839722ce3b114d3bbc1a3b250
      - type: patch
        path: fix-fish-cmake-tests.patch
  - name: nlt
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=/app .
    sources:
      - type: git
        url: https://github.com/virat013S/nlt.git
        commit: cdb1dc54cf5d8fb045cec859377e400a3e6cbac3
  - name: vitro
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=/app .
      - install -Dm644 packaging/flatpak/${FLATPAK_ID}.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/
      - install -Dm644 packaging/flatpak/${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm644 packaging/flatpak/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
    sources:
      - type: git
        url: https://github.com/virat013S/vitro.git
        tag: v1.9.0
        commit: 33303c8b4a504da9e0f063117a9ff58d040a94de
