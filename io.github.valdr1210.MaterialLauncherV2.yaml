app-id: io.github.valdr1210.MaterialLauncherV2
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '23.08'
command: material-launcher
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: material-launcher
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/share/applications /app/share/icons/hicolor/512x512/apps /app/share/metainfo /app/lib/material-launcher
      - cp -r * /app/lib/material-launcher/
      - chmod +x /app/lib/material-launcher/materiallauncherv2
      - chmod +x /app/lib/material-launcher/chrome-sandbox /app/lib/material-launcher/chrome_crashpad_handler || true
      - install -Dm755 material-launcher.sh /app/bin/material-launcher
      - install -Dm644 io.github.valdr1210.MaterialLauncherV2.desktop /app/share/applications/io.github.valdr1210.MaterialLauncherV2.desktop
      - install -Dm644 io.github.valdr1210.MaterialLauncherV2.metainfo.xml /app/share/metainfo/io.github.valdr1210.MaterialLauncherV2.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.valdr1210.MaterialLauncherV2.png
    sources:
      - type: archive
        url: https://github.com/valdr1210/MaterialLauncherV2/releases/download/v1.0.0/Material.Launcher-1.0.0-linux.tar.gz
        sha256: 0c67f703a5f03ee12da16488fddf19700c77eff64058b7cab03be653914a9871
        strip-components: 1
      - type: file
        path: material-launcher.sh
      - type: file
        path: io.github.valdr1210.MaterialLauncherV2.desktop
      - type: file
        path: io.github.valdr1210.MaterialLauncherV2.metainfo.xml
      - type: file
        path: icon.png
