app-id: org.streammatrix.StreamMatrix
runtime: org.kde.Platform
runtime-version: '5.15-25.08'
sdk: org.kde.Sdk
command: stream-matrix

finish-args:
  # Network access for RTSP/RTMP/HTTP video streams
  - --share=network
  - --share=ipc
  # Display servers (Wayland and X11 fallback)
  - --socket=wayland
  - --socket=fallback-x11
  # Hardware-accelerated GPU rendering
  - --device=dri
  # Audio playback (PulseAudio / PipeWire)
  - --socket=pulseaudio
  # Persistent user configuration
  - --filesystem=xdg-config/StreamMatrix:create

modules:
  - name: stream-matrix
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/ldl805/stream-matrix.git
        tag: v1.0.4
        commit: eda02cb1c6f8caad6dbc11a1a69b4a8467a9fe4a
