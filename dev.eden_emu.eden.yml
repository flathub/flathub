app-id: dev.eden_emu.eden
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
command: eden-launcher

finish-args:
  - --device=all
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --share=ipc
  - --filesystem=xdg-run/app/com.discordapp.Discord:ro

modules:
  - name: eden-flatpak
    buildsystem: simple
    build-commands:
      - install -Dm755 eden-launcher.sh /app/bin/eden-launcher
      - install -Dm644 dev.eden_emu.eden.appdata.xml /app/share/metainfo/dev.eden_emu.eden.appdata.xml
    sources:
      - type: git
        url: https://github.com/seraphicfae/dev.eden_emu.eden
        tag: 3a1f
        commit: 3a1f3be90db903ecbcedb8206b91ed38941c27e8

  - name: eden
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      append-path: /usr/lib/sdk/llvm22/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      strip: true
      no-debuginfo: true
      arch:
        x86_64:
          cflags: -march=x86-64-v3 -mtune=generic -O3 -pipe
          cxxflags: -march=x86-64-v3 -mtune=generic -O3 -pipe
        aarch64:
          cflags: -march=armv8-a -mtune=generic -O3 -pipe
          cxxflags: -march=armv8-a -mtune=generic -O3 -pipe
      env:
        AR: llvm-ar
        CC: clang
        CXX: clang++
        RANLIB: llvm-ranlib

    config-opts:
      - -DBUILD_TESTING=OFF
      - -DCMAKE_BUILD_TYPE=Release
      - -DYUZU_USE_BUNDLED_QT=OFF
      - -DYUZU_USE_QT_MULTIMEDIA=OFF
      - -DYUZU_USE_QT_WEB_ENGINE=OFF
      - -DENABLE_QT_TRANSLATION=ON
      - -DENABLE_UPDATE_CHECKER=OFF
      - -DUSE_DISCORD_PRESENCE=ON
      - -DENABLE_LTO=ON
      - -DYUZU_USE_BUNDLED_SIRIT=OFF
      - -DYUZU_USE_BUNDLED_FFMPEG=OFF
      - -DYUZU_USE_BUNDLED_OPENSSL=OFF
      - -DYUZU_DISABLE_LLVM=ON
      - -DYUZU_STATIC_BUILD=OFF
      - -DYUZU_USE_BUNDLED_QT=OFF
      - -DYUZU_CMD=OFF
      - -DYUZU_ROOM_STANDALONE=OFF
      - -DNIGHTLY_BUILD=OFF
      - -DYUZU_USE_BUNDLED_SDL2=OFF
      - -DVulkanHeaders_FORCE_BUNDLED=ON

    post-install:
      - install -Dm644 ../dist/dev.eden_emu.eden.svg /app/share/icons/hicolor/scalable/apps/dev.eden_emu.eden.svg
      - desktop-file-edit --set-key StartupWMClass --set-value eden --set-key Exec --set-value eden-launcher /app/share/applications/dev.eden_emu.eden.desktop

    sources:
      - type: git
        url: https://git.eden-emu.dev/eden-emu/eden.git
        tag: v0.2.1
        commit: 58c1e20ee58efa3900ba616207d460886214480b

