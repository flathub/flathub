app-id: today.otek.currency_converter
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network

command: currency_converter.py
modules:
  - name: currency-converter
    buildsystem: simple
    build-commands:
      - install -D currency_converter.py /app/bin/currency_converter.py
      - install -D today.otek.currency_converter.desktop /app/share/applications/today.otek.currency_converter.desktop
      - install -D today.otek.currency_converter.png /app/share/icons/hicolor/scalable/apps/today.otek.currency_converter.png
      - install -D today.otek.currency_converter.metainfo.xml /app/share/metainfo/today.otek.currency_converter.metainfo.xml
    sources:
      - type: file
        path: currency_converter.py
      - type: file
        path: today.otek.currency_converter.desktop
      - type: file
        path: today.otek.currency_converter.png
      - type: file
        path: today.otek.currency_converter.metainfo.xml