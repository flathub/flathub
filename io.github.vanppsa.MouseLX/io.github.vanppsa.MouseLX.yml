app-id: io.github.vanppsa.MouseLX
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: mouselx
finish-args:
  - --share=network
  - --device=all
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --talk-name=org.freedesktop.Notifications
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/gtk-doc
  - '*.la'
  - '*.a'
modules:
  - python3-packages.json
  - name: mouselx
    buildsystem: simple
    build-commands:
      - install -Dm755 mouselx /app/bin/mouselx
      - install -Dm644 main.py /app/share/mouselx/main.py
      - cp -r app /app/share/mouselx/app
      - install -Dm644 LICENSE /app/share/licenses/io.github.vanppsa.MouseLX/LICENSE
      - install -Dm644 flatpak/io.github.vanppsa.MouseLX.desktop /app/share/applications/io.github.vanppsa.MouseLX.desktop
      - install -Dm644 flatpak/io.github.vanppsa.MouseLX.metainfo.xml /app/share/metainfo/io.github.vanppsa.MouseLX.metainfo.xml
      - install -Dm644 flatpak/icons/io.github.vanppsa.MouseLX.svg /app/share/icons/hicolor/scalable/apps/io.github.vanppsa.MouseLX.svg
      - install -Dm644 flatpak/icons/io.github.vanppsa.MouseLX-128.png /app/share/icons/hicolor/128x128/apps/io.github.vanppsa.MouseLX.png
      - install -Dm644 flatpak/icons/io.github.vanppsa.MouseLX-64.png /app/share/icons/hicolor/64x64/apps/io.github.vanppsa.MouseLX.png
    sources:
      - type: git
        url: https://github.com/vanppsa/MouseLX.git
        tag: v1.0.0
