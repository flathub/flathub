# Flathub manifest for GoSaveTool Timecode.
# Local test: swap the git source below for
#   - type: dir
#     path: .
app-id: com.gosavetool.Timecode
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: gosavetool-timecode

finish-args:
  # Wayland and X11 only. No network, no filesystem access: the app is a
  # calculator and does not touch anything outside its own window.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: gosavetool-timecode
    buildsystem: simple
    build-commands:
      - install -Dm755 src/gosavetool-timecode.sh /app/bin/gosavetool-timecode
      - install -Dm644 src/main.py /app/share/gosavetool-timecode/main.py
      - install -Dm644 src/timecode.py /app/share/gosavetool-timecode/timecode.py
      - install -Dm644 data/com.gosavetool.Timecode.desktop
        /app/share/applications/com.gosavetool.Timecode.desktop
      - install -Dm644 data/com.gosavetool.Timecode.metainfo.xml
        /app/share/metainfo/com.gosavetool.Timecode.metainfo.xml
      - install -Dm644 data/icons/com.gosavetool.Timecode.svg
        /app/share/icons/hicolor/scalable/apps/com.gosavetool.Timecode.svg
      - install -Dm644 LICENSE
        /app/share/licenses/com.gosavetool.Timecode/LICENSE
    sources:
      - type: git
        url: https://github.com/mitolocya/gosavetool-timecode.git
        tag: v1.0.0
        commit: 7c76cfc864404d1b84d558bb2a47ff3ec2db704b
