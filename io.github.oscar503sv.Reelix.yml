id: io.github.oscar503sv.Reelix
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: reelix

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU: rendering, VA-API encoding and colour conversion.
  - --device=dri
  # Microphone and system audio (monitor source).
  - --socket=pulseaudio
  # Default recordings folder (~/Videos/Reelix). Screen and camera come
  # through the ScreenCast and Camera portals and need no permission here.
  - --filesystem=xdg-videos

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/reelix/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: reelix
    buildsystem: simple
    build-commands:
      - cargo build --release --locked --offline
      - install -Dm755 target/release/reelix /app/bin/reelix
      - packaging/install-data.sh /app
    sources:
      - type: git
        url: https://github.com/oscar503sv/reelix.git
        tag: v0.8.0
        commit: 5e6369c983d3ad349ae98c1c882f0c61b4675157
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - cargo-sources.json
