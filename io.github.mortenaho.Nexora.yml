# Flatpak manifest for Flathub — io.github.mortenaho.Nexora
#
# Before submitting:
#   1. Tag v1.0.0 on mortenaho/Nexora and set commit: below to that SHA
#   2. Keep generated-sources.json next to this file (from generate-sources.sh)
#
# Local test:
#   flatpak-builder --user --install --force-clean /tmp/nexora-fp \
#     packaging/flatpak/io.github.mortenaho.Nexora.yml --install-deps-from=flathub

app-id: io.github.mortenaho.Nexora
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: nexora
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --device=dri
  - --device=all
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --socket=session-bus
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=ca.desrt.dconf
  - --filesystem=xdg-run/dconf
  - --filesystem=xdg-config/dconf:ro
  - --env=ELECTRON_TRASH=gio
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf
build-options:
  append-path: /usr/lib/sdk/node22/bin
  env:
    NPM_CONFIG_LOGLEVEL: info
modules:
  - name: nexora
    buildsystem: simple
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/nexora/flatpak-node/cache
        npm_config_cache: /run/build/nexora/flatpak-node/npm-cache
        npm_config_nodedir: /usr/lib/sdk/node22
        npm_config_offline: 'true'
    build-commands:
      # Disable network postinstall (Xray comes from pinned archive below)
      - npm pkg delete scripts.postinstall
      - npm install --offline
      - npm run build
      - mkdir -p bin
      - install -Dm755 ../xray-extract/xray bin/xray
      - install -Dm644 ../xray-extract/geoip.dat bin/geoip.dat
      - install -Dm644 ../xray-extract/geosite.dat bin/geosite.dat
      - |
        . ../flatpak-node/electron-builder-arch-args.sh
        npx electron-builder --config electron-builder.yml $ELECTRON_BUILDER_ARCH_ARGS --linux dir
      - cp -a release/linux*unpacked /app/main
      - install -Dm755 packaging/flatpak/run.sh /app/bin/nexora
      - install -Dm644 packaging/io.github.mortenaho.Nexora.desktop /app/share/applications/io.github.mortenaho.Nexora.desktop
      - install -Dm644 packaging/io.github.mortenaho.Nexora.metainfo.xml /app/share/metainfo/io.github.mortenaho.Nexora.metainfo.xml
      - install -Dm644 public/logo.png /app/share/icons/hicolor/512x512/apps/io.github.mortenaho.Nexora.png
      - |
        if command -v patch-desktop-filename >/dev/null 2>&1; then
          patch-desktop-filename /app/main/resources/app.asar || true
        fi
    subdir: main
    sources:
      - type: git
        url: https://github.com/mortenaho/Nexora.git
        tag: v1.0.0
        commit: e17093c30e51ddffecb50b8716bca38d1daa0648
        dest: main
      - type: archive
        url: https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
        sha256: 23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
        dest: xray-extract
      - generated-sources.json
