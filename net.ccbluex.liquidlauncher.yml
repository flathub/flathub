id: net.ccbluex.liquidlauncher

runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24

command: liquidlauncher
finish-args:
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --share=ipc
  - --share=network
  - --filesystem=xdg-download:ro
  - --env=LIQUIDLAUNCHER_SKIP_UPDATE=1

modules:
  - name: liquidlauncher
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/CCBlueX/LiquidLauncher.git
        tag: v0.7.1
        commit: 5b861921eea8ba546a57114262af64cdac3db272
        x-checker-data:
          type: git
          tag-pattern: ^v(\d+\.\d+\.\d+)$
          version-scheme: semantic
          is-main-source: true
      - cargo-sources.json
      - node-sources.json
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/liquidlauncher/cargo
        XDG_CACHE_HOME: /run/build/liquidlauncher/flatpak-node/cache
        YARN_YARN_OFFLINE_MIRROR: /run/build/liquidlauncher/flatpak-node/yarn-mirror
    build-commands:
      - yarn --offline install --frozen-lockfile
      - yarn --offline run build
      - cargo --offline build --release --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/liquidlauncher /app/bin/liquidlauncher
      - install -Dm644 packaging/linux/net.ccbluex.liquidlauncher.desktop /app/share/applications/net.ccbluex.liquidlauncher.desktop
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/net.ccbluex.liquidlauncher.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/net.ccbluex.liquidlauncher.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/net.ccbluex.liquidlauncher.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/net.ccbluex.liquidlauncher.png
      - install -Dm644 packaging/linux/net.ccbluex.liquidlauncher.metainfo.xml /app/share/metainfo/net.ccbluex.liquidlauncher.metainfo.xml
