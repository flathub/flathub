# Flathub manifest for Dalfin desktop (x86_64 proprietary Electron binary).
#
# Before opening the Flathub PR:
#   1. On Linux: ./pack-release.sh && upload the tar.xz (script prints commands)
#   2. Paste SHA256 into the archive source below
#   3. Confirm curl -I on the public URL returns 200
#
# Do NOT open the Flathub PR with an AI agent — Flathub forbids automated submissions.
# See FLATHUB.md

id: ai.dalfin.desktop
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: dalfin
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets

modules:
  - name: dalfin
    buildsystem: simple
    build-commands:
      - install -d /app/lib/dalfin
      - cp -a linux-unpacked/. /app/lib/dalfin/
      - install -Dm755 dalfin-launch.sh /app/bin/dalfin
      - install -Dm644 ai.dalfin.desktop.desktop /app/share/applications/ai.dalfin.desktop.desktop
      - install -Dm644 ai.dalfin.desktop.metainfo.xml /app/share/metainfo/ai.dalfin.desktop.metainfo.xml
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/ai.dalfin.desktop.png
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/ai.dalfin.desktop.png
      - install -Dm644 icon-64.png /app/share/icons/hicolor/64x64/apps/ai.dalfin.desktop.png
      - chmod -R a+rX /app/lib/dalfin
    sources:
      # REPLACE sha256 after running ./pack-release.sh
      - type: archive
        url: https://desktop-dev-dalfin-917593900241.s3.ap-south-1.amazonaws.com/desktop-linux/dalfin-1.0.0-linux-x64.tar.xz
        sha256: 53635650b7033c4a3b76ec90d3216a5fb2c9bfc092f78bb40b66afcf4d395c48
        dest: linux-unpacked
      - type: file
        path: dalfin-launch.sh
      - type: file
        path: ai.dalfin.desktop.desktop
      - type: file
        path: ai.dalfin.desktop.metainfo.xml
      - type: file
        path: icon-256.png
      - type: file
        path: icon-128.png
      - type: file
        path: icon-64.png
