app-id: com.prism.SteamMachine
runtime: org.gnome.Platform
runtime-version: "46"
sdk: org.gnome.Sdk
command: prism-steam-machine
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
cleanup:
  - /include
  - /lib/pkgconfig
  - "*.la"
modules:
  - name: prism-steam-machine
    buildsystem: simple
    build-commands:
      - install -Dm755 prism-steam-machine.py /app/bin/prism-steam-machine
      - install -Dm644 com.prism.SteamMachine.desktop /app/share/applications/com.prism.SteamMachine.desktop
      - install -Dm644 com.prism.SteamMachine.metainfo.xml /app/share/metainfo/com.prism.SteamMachine.metainfo.xml
      - install -Dm644 icons/128.png /app/share/icons/hicolor/128x128/apps/com.prism.SteamMachine.png
      - install -Dm644 icons/256.png /app/share/icons/hicolor/256x256/apps/com.prism.SteamMachine.png
      - install -Dm644 icons/512.png /app/share/icons/hicolor/512x512/apps/com.prism.SteamMachine.png
    sources:
      - type: dir
        path: .
