<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Midnight Indigo Sky -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142144" />
      <stop offset="35%" stop-color="#0f1936" />
      <stop offset="70%" stop-color="#091024" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Warm Amber Radial Glow Behind Sun -->
    <radialGradient id="sunAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a00" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#ff5c00" stop-opacity="0.6" />
      <stop offset="55%" stop-color="#ff3a00" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#121e3d" stop-opacity="0" />
    </radialGradient>

    <!-- Sun Disc Gradient -->
    <radialGradient id="sunCore" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff6cf" />
      <stop offset="30%" stop-color="#ffea8a" />
      <stop offset="65%" stop-color="#ffb833" />
      <stop offset="100%" stop-color="#ff8500" />
    </radialGradient>

    <!-- Clock Ring Gradient -->
    <linearGradient id="ringGrad" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f5f8ff" />
      <stop offset="60%" stop-color="#d7e6fc" />
      <stop offset="100%" stop-color="#9ac2f7" />
    </linearGradient>

    <!-- Outer Soft Glow for Clock Ring -->
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#80afff" flood-opacity="0.4" />
    </filter>

    <!-- Drop Shadow for Hands and Details -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#020510" flood-opacity="0.6" />
    </filter>

    <!-- Cloud Back Layer (Darker Depth) -->
    <linearGradient id="cloudBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d4a77" />
      <stop offset="40%" stop-color="#1c3052" />
      <stop offset="100%" stop-color="#0d182d" />
    </linearGradient>

    <!-- Cloud Main Body Gradient (Top Light -> Dark Slate Shadow) -->
    <linearGradient id="cloudMain" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#466da8" />
      <stop offset="25%" stop-color="#345486" />
      <stop offset="60%" stop-color="#1e3256" />
      <stop offset="100%" stop-color="#0d172c" />
    </linearGradient>

    <!-- Front Cloud Ridge Layer -->
    <linearGradient id="cloudFront" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#5581c2" />
      <stop offset="25%" stop-color="#3a5c92" />
      <stop offset="60%" stop-color="#21375e" />
      <stop offset="100%" stop-color="#0e192f" />
    </linearGradient>

    <!-- Top Rim Highlight for Cloud Puffs -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ab3f0" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#527ebd" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#21375e" stop-opacity="0" />
    </linearGradient>

    <!-- Border highlight for squircle container -->
    <linearGradient id="iconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="45%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <clipPath id="squircle">
      <rect x="16" y="16" width="480" height="480" rx="106" />
    </clipPath>
  </defs>

  <!-- ICON CONTAINER -->
  <g clip-path="url(#squircle)">
    <!-- 1. Sky Background -->
    <rect x="16" y="16" width="480" height="480" fill="url(#bgGrad)" />

    <!-- 2. SUN & RAYS (Behind Clock Ring, Top-Right) -->
    <!-- Ambient orange halo -->
    <circle cx="370" cy="142" r="175" fill="url(#sunAmbient)" />

    <!-- Sun Rays (4 clean rounded rays matching the user's image) -->
    <g stroke="#ffb12e" stroke-width="7.5" stroke-linecap="round">
      <!-- Ray 1: Top-Left (angle ~-70°) -->
      <line x1="337" y1="86" x2="330" y2="70" />
      <!-- Ray 2: Top-Right (angle ~-35°) -->
      <line x1="395" y1="92" x2="405" y2="77" />
      <!-- Ray 3: Right-Up (angle ~-5°) -->
      <line x1="428" y1="126" x2="445" y2="122" />
      <!-- Ray 4: Right-Down (angle ~20°) -->
      <line x1="432" y1="168" x2="449" y2="175" />
    </g>

    <!-- Sun Disc -->
    <circle cx="370" cy="142" r="58" fill="url(#sunCore)" filter="url(#shadow)" />
    <circle cx="370" cy="142" r="58" fill="none" stroke="#fffce6" stroke-width="1.5" opacity="0.9" />

    <!-- 3. STOPWATCH / CLOCK RING -->
    <!-- The Crisp Glowing White Timer Ring -->
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="23" stroke-linecap="round" filter="url(#ringGlow)" />

    <!-- Top Pusher / Knob at 12 o'clock -->
    <g filter="url(#shadow)">
      <!-- Stem -->
      <rect x="251" y="87" width="10" height="18" rx="2" fill="#e2edfc" />
      <!-- Circular Button Cap -->
      <circle cx="256" cy="80" r="15" fill="#ffffff" />
      <circle cx="254" cy="78" r="7" fill="#f4f8ff" />
    </g>

    <!-- 4. CLOCK HANDS -->
    <g filter="url(#shadow)">
      <!-- Hour/Minute Hand: 12:22 Position -->
      <path d="M 256 174 L 256 260 L 320 314" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="19" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <!-- Joint center pivot -->
      <circle cx="256" cy="260" r="4.5" fill="#e8f1fc" />
    </g>

    <!-- 5. NATURAL CUMULUS CLOUD (Fluffy, Continuous, Soft Shading) -->
    <g filter="url(#shadow)">
      <!-- BACK CLOUD PUFFS (Upper ridge depth) -->
      <circle cx="120" cy="235" r="56" fill="url(#cloudBack)" />
      <circle cx="170" cy="255" r="50" fill="url(#cloudBack)" />
      <circle cx="65"  cy="285" r="54" fill="url(#cloudBack)" />

      <!-- MID CLOUD MAIN MASS -->
      <g fill="url(#cloudMain)">
        <circle cx="45"  cy="340" r="68" />
        <circle cx="105" cy="285" r="70" />
        <circle cx="175" cy="295" r="64" />
        <circle cx="240" cy="335" r="56" />
        <circle cx="295" cy="390" r="50" />
        <circle cx="335" cy="455" r="44" />
        <!-- Bottom left anchor fill -->
        <path d="M 0 330 
                 C 40 330, 80 280, 110 280 
                 C 150 280, 170 290, 200 310 
                 C 230 330, 270 370, 300 410 
                 C 330 450, 345 512, 345 512 
                 L 0 512 Z" />
      </g>

      <!-- FRONT CLOUD CASCADE (Pillowy Front Lobes with Soft Top Highlights) -->
      <!-- Ripple 1 (Leftmost lobe) -->
      <circle cx="55"  cy="365" r="64" fill="url(#cloudFront)" />
      <circle cx="55"  cy="365" r="64" fill="url(#rimGrad)" />

      <!-- Ripple 2 (Crest lobe overlapping clock) -->
      <circle cx="115" cy="325" r="64" fill="url(#cloudFront)" />
      <circle cx="115" cy="325" r="64" fill="url(#rimGrad)" />

      <!-- Ripple 3 (Center slope lobe) -->
      <circle cx="180" cy="345" r="58" fill="url(#cloudFront)" />
      <circle cx="180" cy="345" r="58" fill="url(#rimGrad)" />

      <!-- Ripple 4 (Descending slope lobe) -->
      <circle cx="240" cy="380" r="52" fill="url(#cloudFront)" />
      <circle cx="240" cy="380" r="52" fill="url(#rimGrad)" />

      <!-- Ripple 5 (Lower descending lobe) -->
      <circle cx="290" cy="430" r="46" fill="url(#cloudFront)" />
      <circle cx="290" cy="430" r="46" fill="url(#rimGrad)" />

      <!-- Ripple 6 (Bottom right edge lobe) -->
      <circle cx="330" cy="480" r="40" fill="url(#cloudFront)" />
      <circle cx="330" cy="480" r="40" fill="url(#rimGrad)" />

      <!-- Seamless base fill blending into bottom left corner -->
      <path d="M 0 380 
               C 50 370, 100 350, 140 370 
               C 180 390, 230 390, 270 430 
               C 310 470, 335 512, 335 512 
               L 0 512 Z" 
            fill="url(#cloudFront)" />
    </g>

    <!-- 6. Outer Squircle Rim Border -->
    <rect x="16" y="16" width="480" height="480" rx="106" fill="none" stroke="url(#iconBorder)" stroke-width="2.5" />
  </g>
</svg>