app-id: io.github.gnacho.Scribe
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: scribe
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/scribe/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: scribe
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/scribe /app/bin/scribe
      - install -Dm644 data/io.github.gnacho.Scribe.desktop /app/share/applications/io.github.gnacho.Scribe.desktop
      - install -Dm644 data/io.github.gnacho.Scribe.metainfo.xml /app/share/metainfo/io.github.gnacho.Scribe.metainfo.xml
      - install -Dm644 data/io.github.gnacho.Scribe.gschema.xml /app/share/glib-2.0/schemas/io.github.gnacho.Scribe.gschema.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.gnacho.Scribe.svg /app/share/icons/hicolor/scalable/apps/io.github.gnacho.Scribe.svg
      - install -Dm644 data/icons/hicolor/scalable/actions/io.github.gnacho.Scribe-preview-on-symbolic.svg /app/share/icons/hicolor/scalable/actions/io.github.gnacho.Scribe-preview-on-symbolic.svg
      - install -Dm644 data/icons/hicolor/scalable/actions/io.github.gnacho.Scribe-preview-off-symbolic.svg /app/share/icons/hicolor/scalable/actions/io.github.gnacho.Scribe-preview-off-symbolic.svg
      - install -d /app/share/locale/es/LC_MESSAGES
      - msgfmt po/es.po -o /app/share/locale/es/LC_MESSAGES/scribe.mo
      - install -Dm644 LICENSE /app/share/licenses/io.github.gnacho.Scribe/LICENSE
      - glib-compile-schemas /app/share/glib-2.0/schemas
    sources:
      - type: git
        url: https://github.com/gnacho/scribe
        tag: v0.3.17
        commit: 87bff5dd1e71936b4670a54ef26378f3a15f6f28
      - cargo-sources.json
