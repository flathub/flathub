app-id: ru.smartnotes_ai.SmartNotes
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '23.08'
command: smartnotesapp
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=XDG_CURRENT_DESKTOP=Unity
modules:
  - name: smartnotesapp
    buildsystem: simple
    build-commands:
      - chmod +x SmartNotesAppImage
      - ./SmartNotesAppImage --appimage-extract
      - cp -r squashfs-root /app/opt/smartnotesapp
      - mkdir -p /app/bin
      - ln -s /app/opt/smartnotesapp/AppRun /app/bin/smartnotesapp
      - install -Dm644 ru.smartnotes_ai.SmartNotes.desktop -t /app/share/applications/
      - install -Dm644 ru.smartnotes_ai.SmartNotes.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/ru.smartnotes_ai.SmartNotes.png
    sources:
      - type: file
        url: https://github.com/andreykz520-lang/smartnotes-app/releases/download/v1.0.1/SmartNotes.AI-1.0.1.AppImage
        sha256: f71a532705f367fa32941f20f2753c33570d27066ad5550393ae8f22fde81110
        dest-filename: SmartNotesAppImage
      - type: file
        path: ru.smartnotes_ai.SmartNotes.desktop
      - type: file
        path: ru.smartnotes_ai.SmartNotes.metainfo.xml
      - type: file
        path: icon.png
        dest-filename: icon.png
