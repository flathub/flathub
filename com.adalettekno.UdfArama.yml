app-id: com.adalettekno.UdfArama
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: udfarama

finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: udfarama
    buildsystem: simple
    build-commands:
      - install -Dm644 LICENSE /app/share/licenses/com.adalettekno.UdfArama/udfarama/LICENSE
      - install -Dm755 src/udfarama.py /app/bin/udfarama
      - install -Dm644 data/com.adalettekno.UdfArama.desktop /app/share/applications/com.adalettekno.UdfArama.desktop
      - install -Dm644 data/com.adalettekno.UdfArama.metainfo.xml /app/share/metainfo/com.adalettekno.UdfArama.metainfo.xml
      - install -Dm644 data/com.adalettekno.UdfArama.svg /app/share/icons/hicolor/scalable/apps/com.adalettekno.UdfArama.svg
    sources:
      - type: git
        url: https://github.com/adalettekno/com.adalettekno.UdfArama.git
        commit: e5cfca6e2f65cf3cbe9111b5a587a1efee90d210
