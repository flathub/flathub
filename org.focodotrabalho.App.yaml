app-id: org.focodotrabalho.App
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: foco-no-trabalho

finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=ipc
  - --device=dri

modules:
  - name: foco-no-trabalho
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/oliveira-mint/foco-no-trabalho.git
        tag: v1.0.0
