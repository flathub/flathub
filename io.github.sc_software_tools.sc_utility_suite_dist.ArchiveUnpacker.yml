app-id: io.github.sc_software_tools.sc_utility_suite_dist.ArchiveUnpacker
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: sc-archive-unpacker
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.secrets
modules:
  - name: sc-archive-unpacker
    buildsystem: simple
    build-commands:
      - mkdir -p /app/ArchiveUnpacker && cp -r . /app/ArchiveUnpacker/ && rm -f /app/ArchiveUnpacker/*.pdb /app/ArchiveUnpacker/*.desktop /app/ArchiveUnpacker/*.svg
      - install -Dm755 sc-archive-unpacker.sh /app/bin/sc-archive-unpacker
      - install -Dm644 sc-archive-unpacker.svg /app/share/icons/hicolor/scalable/apps/io.github.sc_software_tools.sc_utility_suite_dist.ArchiveUnpacker.svg
      - desktop-file-edit --set-key=Exec --set-value='sc-archive-unpacker %F' --set-icon=io.github.sc_software_tools.sc_utility_suite_dist.ArchiveUnpacker --set-key=StartupWMClass --set-value=ArchiveUnpacker.Desktop sc-archive-unpacker.desktop && install -Dm644 sc-archive-unpacker.desktop /app/share/applications/io.github.sc_software_tools.sc_utility_suite_dist.ArchiveUnpacker.desktop
      - install -Dm644 io.github.sc_software_tools.sc_utility_suite_dist.ArchiveUnpacker.metainfo.xml /app/share/metainfo/io.github.sc_software_tools.sc_utility_suite_dist.ArchiveUnpacker.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/sc-software-tools/sc-utility-suite-dist/releases/download/suite-v1.1.2/ArchiveUnpacker-1.1.2-linux-x64.tar.gz
        sha256: f613f4ae1da07bd766250a936392e85fa6ff5f2b83deac36c9e0eb76e01890ef
        strip-components: 1
      - type: file
        path: sc-archive-unpacker.sh
      - type: file
        path: io.github.sc_software_tools.sc_utility_suite_dist.ArchiveUnpacker.metainfo.xml
