id: com.thirtyhippos.sigcompanion
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: SigCompanion.Desktop

finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --socket=pulseaudio
  - --share=network

build-options:
  append-path: /usr/lib/sdk/dotnet10/bin
  no-debuginfo: true
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: '1'

modules:
  - name: sigcompanion
    buildsystem: simple
    build-commands:
      - |
        set -e
        case "$FLATPAK_ARCH" in
          x86_64) rid=linux-x64 ;;
          aarch64) rid=linux-arm64 ;;
          *) echo "Unsupported Flatpak architecture: $FLATPAK_ARCH" >&2; exit 1 ;;
        esac
        project=SigCompanion.Desktop/SigCompanion.Desktop.csproj
        dotnet restore "$project" --runtime "$rid" -p:Configuration=Release -p:SelfContained=true \
          --source "$PWD/nuget-sources" --source /usr/lib/sdk/dotnet10/nuget/packages
        dotnet publish "$project" --configuration Release --runtime "$rid" --self-contained \
          --no-restore --output /app/lib/sigcompanion
      - install -d /app/bin
      - ln -s ../lib/sigcompanion/SigCompanion.Desktop /app/bin/SigCompanion.Desktop
      - install -Dm644 packaging/flatpak/com.thirtyhippos.sigcompanion.desktop /app/share/applications/com.thirtyhippos.sigcompanion.desktop
      - install -Dm644 packaging/flatpak/com.thirtyhippos.sigcompanion.metainfo.xml /app/share/metainfo/com.thirtyhippos.sigcompanion.metainfo.xml
      - install -Dm644 WindowsPackaging/Images/Square44x44Logo.altform-unplated_targetsize-256.png /app/share/icons/hicolor/256x256/apps/com.thirtyhippos.sigcompanion.png
      - install -Dm644 LICENSE.txt /app/share/licenses/com.thirtyhippos.sigcompanion/LICENSE.txt
    sources:
      - type: git
        url: https://github.com/tomhollander/SigCompanion.git
        commit: d99d10ecc90b8556161b470e4e141fe23c41c495
      - nuget-sources.json