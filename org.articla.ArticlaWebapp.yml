app-id: org.articla.ArticlaWebapp
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: run.sh
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=all
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
build-options:
  append-path: /usr/lib/sdk/node24/bin
  env:
    NPM_CONFIG_LOGLEVEL: info
    npm_config_nodedir: /usr/lib/sdk/node24
    XDG_CACHE_HOME: /run/build/articla-webapp/flatpak-node/cache
    npm_config_cache: /run/build/articla-webapp/flatpak-node/npm-cache
    npm_config_offline: 'true'
modules:
  - name: articla-webapp
    buildsystem: simple
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/articla-webapp/flatpak-node/cache
        npm_config_cache: /run/build/articla-webapp/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      # Install npm dependencies (offline cache pre-populated by flatpak-node)
      - npm install --offline
      # Build the app; dist script runs electron-builder for the current arch
      - |
        . ../flatpak-node/electron-builder-arch-args.sh
        npm run dist -- $ELECTRON_BUILDER_ARCH_ARGS --linux --dir
      # Bundle app and dependencies into /app/main
      - cp -a dist/linux*unpacked /app/main
      # Install app wrapper
      - install -Dm755 -t /app/bin/ ../run.sh
      # Install AppStream metadata
      - install -Dm644 org.articla.ArticlaWebapp.metainfo.xml /app/share/metainfo/org.articla.ArticlaWebapp.metainfo.xml
      # Install desktop file
      - install -Dm644 org.articla.ArticlaWebapp.desktop /app/share/applications/org.articla.ArticlaWebapp.desktop
      # Install icon (scalable SVG)
      - install -Dm644 images/articla.svg /app/share/icons/hicolor/scalable/apps/org.articla.ArticlaWebapp.svg
      - install -Dm644 images/articla_512.png /app/share/icons/hicolor/512x512/apps/org.articla.ArticlaWebapp.png
      - install -Dm644 images/articla_256.png /app/share/icons/hicolor/256x256/apps/org.articla.ArticlaWebapp.png
      - install -Dm644 images/articla_128.png /app/share/icons/hicolor/128x128/apps/org.articla.ArticlaWebapp.png
      - install -Dm644 images/articla_48.png /app/share/icons/hicolor/48x48/apps/org.articla.ArticlaWebapp.png
    subdir: main
    sources:
      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper.sh /app/main/articla-webapp "$@"
      - type: file
        path: package.json
        dest: main
      - type: file
        path: package-lock.json
        dest: main
      - type: file
        path: main.js
        dest: main
      - type: file
        path: index.html
        dest: main
      - type: file
        path: styles.css
        dest: main
      - type: file
        path: org.articla.ArticlaWebapp.metainfo.xml
        dest: main
      - type: file
        path: org.articla.ArticlaWebapp.desktop
        dest: main
      - type: file
        path: images/articla.svg
        dest: main/images
      - type: file
        path: images/articla_512.png
        dest: main/images
      - type: file
        path: images/articla_256.png
        dest: main/images
      - type: file
        path: images/articla_128.png
        dest: main/images
      - type: file
        path: images/articla_48.png
        dest: main/images
      - flatpak/generated-sources.json