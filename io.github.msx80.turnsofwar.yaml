---
id: io.github.msx80.turnsofwar
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: turnsofwarLauncher
separate-locales: false
sdk-extensions:
- org.freedesktop.Sdk.Extension.openjdk21
finish-args:
- "--socket=wayland"
- "--socket=fallback-x11"
- "--device=dri"
- "--share=ipc"
- "--socket=pulseaudio"
modules:
- name: openjdk
  buildsystem: simple
  build-commands:
  - "/usr/lib/sdk/openjdk21/install.sh"
- name: turnsofwar
  buildsystem: simple
  build-options:
    env:
      JAVA_HOME: /usr/lib/sdk/openjdk21/jvm/openjdk-21
  build-commands:
  - /usr/lib/sdk/openjdk21/bin/mvn -DskipTests -Dmaven.repo.local=.m2/repository -f turnsofwar/pom.xml -o -B -Pdesktop clean package
  - install -D turnsofwarLauncher /app/bin/turnsofwarLauncher
  - install -D ./turnsofwar/turnsofwar-desktop.jar /app/share/turnsofwar-desktop.jar
  - install -Dm644 io.github.msx80.turnsofwar.png /app/share/icons/hicolor/512x512/apps/io.github.msx80.turnsofwar.png
  - install -Dm644 io.github.msx80.turnsofwar.desktop /app/share/applications/io.github.msx80.turnsofwar.desktop
  - install -Dm644 io.github.msx80.turnsofwar.metainfo.xml /app/share/metainfo/io.github.msx80.turnsofwar.metainfo.xml
  - install -Dm0644 LICENSE -t ${FLATPAK_DEST}/share/licenses/$FLATPAK_ID/turnsofwar
  sources:
  - maven-dependencies.yaml
  - type: script
    dest-filename: turnsofwarLauncher
    commands:
    - exec /app/jre/bin/java -Duser.home=$XDG_DATA_HOME -jar /app/share/turnsofwar-desktop.jar
      "$@"
  - type: file
    url: https://raw.githubusercontent.com/msx80/turnsofwar/refs/tags/v0.0.3/fastlane/metadata/android/en-US/images/icon.png
    sha256: b4d5747383ee668b484e9c850205edbcc0b446a9f56e7a487045a78ba876702c
    dest-filename: io.github.msx80.turnsofwar.png
  - type: file
    url: https://raw.githubusercontent.com/msx80/turnsofwar/041d1a196dfe42e0fa105e51fc96634018024806/flatpak/io.github.msx80.turnsofwar.desktop
    sha256: 16b69ee945d7aa844d89f7f53e1a662364c61237e98d4568a2a9f7fd83d71d00
  - type: file
    url: https://raw.githubusercontent.com/msx80/turnsofwar/041d1a196dfe42e0fa105e51fc96634018024806/flatpak/io.github.msx80.turnsofwar.metainfo.xml
    sha256: 1a07ac60486600401d8cbc78a524eb3f49c21d25d940bc85b416b2d72b64642b
  - type: git
    url: https://github.com/msx80/turnsofwar.git
    commit: 4db177065575a7a5646938270368686e6416e468
    disable-submodules: true


      


