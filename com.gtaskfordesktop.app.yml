app-id: com.gtaskfordesktop.app
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: launch.sh

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network

modules:
  - name: gtask-for-desktop
    buildsystem: simple
    build-commands:
      # Install the existing application bundle, including its private JRE and JavaFX.
      - install -d /app/share
      - ln -s /app/extra /app/share/gtask-for-desktop

      # Flatpak launcher and desktop integration.
      - install -Dm755 launch.sh /app/bin/launch.sh
      - install -Dm644 com.gtaskfordesktop.app.desktop /app/share/applications/com.gtaskfordesktop.app.desktop
      - install -Dm644 com.gtaskfordesktop.app.metainfo.xml /app/share/metainfo/com.gtaskfordesktop.app.metainfo.xml
      - install -Dm644 icon_48x48.png /app/share/icons/hicolor/48x48/apps/com.gtaskfordesktop.app.png
      - install -Dm644 icon_256x256.png /app/share/icons/hicolor/256x256/apps/com.gtaskfordesktop.app.png

      # Install the extraction script.
      - install -Dm755 apply_extra /app/bin/apply_extra

    sources:
      # Downloaded by Flatpak on the user's machine during installation.
      - type: extra-data
        filename: gtask-for-desktop.tar.gz
        only-arches:
          - x86_64
        url: https://gtask-for-desktop.com/app/8/gtask-for-desktop_8.1.0_amd64.tar.gz
        sha256: 20f3381a0250764215e65fb79833332f8d47a61f4c196e7b216da413f11ac42f
        size: 102001599

      # Extract the downloaded archive into /app/extra.
      - type: script
        dest-filename: apply_extra
        commands:
          - tar -xzf gtask-for-desktop.tar.gz --no-same-owner
          - chmod -R a+x jre/bin
          - chmod -R a+x jre/javafx/lib
          - chmod a+x jre/lib/jspawnhelper
          - rm -f gtask-for-desktop.tar.gz

      # Ordinary files included in your Flathub submission.
      - type: file
        path: launch.sh
      - type: file
        path: com.gtaskfordesktop.app.desktop
      - type: file
        path: com.gtaskfordesktop.app.metainfo.xml
      - type: file
        path: icon_48x48.png
      - type: file
        path: icon_256x256.png
