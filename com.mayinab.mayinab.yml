app-id: com.mayinab.mayinab
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: mayinab

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: mayinab
    buildsystem: simple
    build-commands:
      - mkdir -p /app/mayinab /app/bin
      - cp -r mayinab data lib /app/mayinab/
      - chmod +x /app/mayinab/mayinab
      - install -Dm755 mayinab-launcher.sh /app/bin/mayinab
      - install -Dm644 com.mayinab.mayinab.desktop /app/share/applications/com.mayinab.mayinab.desktop
      - install -Dm644 com.mayinab.mayinab.metainfo.xml /app/share/metainfo/com.mayinab.mayinab.metainfo.xml
      - install -Dm644 com.mayinab.mayinab.png /app/share/icons/hicolor/512x512/apps/com.mayinab.mayinab.png
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/miunah/mayi/releases/download/v1.0.33/Mayinab-1.0.33-linux-x64.tar.gz
        sha256: 4c07bce02ffc8f4afcdbcc9e14b64aefcf6e606d353dfd7cb6006386eca09790
        x-checker-data:
          type: json
          url: https://api.github.com/repos/miunah/mayi/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name=="Mayinab-" + $version + "-linux-x64.tar.gz") | .browser_download_url
