app-id: org.google.AntigravityIDE
runtime: org.gnome.Platform
runtime-version: '45'
sdk: org.gnome.Sdk
command: antigravity-ide
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=host
modules:
  - name: antigravity-ide
    buildsystem: simple
    build-commands:
      # 1. Create directories for app files, bin, desktop entry, metainfo, icon, and licenses
      - install -d /app/lib/antigravity-ide/
      - install -d /app/bin/
      - install -d /app/share/applications/
      - install -d /app/share/metainfo/
      - install -d /app/share/icons/hicolor/512x512/apps/
      - install -d /app/share/licenses/org.google.AntigravityIDE/

      # 2. Copy the extracted app files to the lib directory
      - cp -r . /app/lib/antigravity-ide/

      # 3. Install the wrapper script, desktop file, metainfo, icon, and license files
      - install -m755 antigravity-ide-wrapper.sh /app/bin/antigravity-ide
      - install -m644 org.google.AntigravityIDE.desktop /app/share/applications/org.google.AntigravityIDE.desktop
      - install -m644 org.google.AntigravityIDE.metainfo.xml /app/share/metainfo/org.google.AntigravityIDE.metainfo.xml
      - install -m644 org.google.AntigravityIDE.png /app/share/icons/hicolor/512x512/apps/org.google.AntigravityIDE.png
      - cp /app/lib/antigravity-ide/LICENSES.chromium.html /app/share/licenses/org.google.AntigravityIDE/
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.0.4-6381998290370560/linux-x64/Antigravity%20IDE.tar.gz
        sha256: 66337d45f2472ce5e89f394e77aec74909aa1be0bb33c9f73299a95f458e6770
        strip-components: 1
      - type: archive
        only-arches: [aarch64]
        url: https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.0.4-6381998290370560/linux-arm/Antigravity%20IDE.tar.gz
        sha256: 30435204d14cdcd479b37fd9ae077425d7ab7bb90f99af2bc41638205e02fb37
        strip-components: 1
      - type: file
        path: antigravity-ide-wrapper.sh
      - type: file
        path: org.google.AntigravityIDE.desktop
      - type: file
        path: org.google.AntigravityIDE.metainfo.xml
      - type: file
        path: org.google.AntigravityIDE.png
