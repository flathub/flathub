id: app.justquran.JustQuran
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: justquran
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --env=ELECTRON_TRASH=gio
  # Media keys and the desktop's now-playing controls (MPRIS)
  - --own-name=org.mpris.MediaPlayer2.chromium.*

modules:
  - name: justquran
    buildsystem: simple
    build-commands:
      - mkdir -p /app/main /app/bin
      - cp -r electron/. /app/main/
      - rm -f /app/main/resources/default_app.asar
      - mkdir -p /app/main/resources/app
      - cp -r app/main.js app/package.json app/www /app/main/resources/app/
      - install -Dm755 justquran.sh /app/bin/justquran
      - install -Dm644 app/app.justquran.JustQuran.desktop -t /app/share/applications/
      - install -Dm644 app/app.justquran.JustQuran.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 app/app.justquran.JustQuran.png /app/share/icons/hicolor/512x512/apps/app.justquran.JustQuran.png
      - install -Dm644 app/LICENSE -t /app/share/licenses/app.justquran.JustQuran/
    sources:
      - type: archive
        url: https://github.com/awaism257/justquran/releases/download/desktop-v1.0.0/justquran-desktop-1.0.0.tar.gz
        sha256: b731bb400fa9d77ba3344dc261b137466a6f0d57155c656188666321943ca688
        dest: app
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/electron/electron/releases/download/v45.2.1/electron-v45.2.1-linux-x64.zip
        sha256: 616efc1ae4784af1a4f3f0e8774e73e7030e7bd1708da9d09bcf543dfa499beb
        strip-components: 0
        dest: electron
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/electron/electron/releases/download/v45.2.1/electron-v45.2.1-linux-arm64.zip
        sha256: e04e635e7312f4b361664e18319aefddbcaaebfdee9c8d9a521e520aa8d385bb
        strip-components: 0
        dest: electron
      - type: script
        dest-filename: justquran.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          # Use X11 when the Wayland socket is not available to the sandbox
          - if [ ! -S "$XDG_RUNTIME_DIR/${WAYLAND_DISPLAY:-wayland-0}" ] && [ ! -S "$WAYLAND_DISPLAY" ]; then set -- --ozone-platform=x11 "$@"; fi
          - exec zypak-wrapper /app/main/electron "$@"
