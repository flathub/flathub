# Flathub manifest. It repackages the .deb that CI attaches to the GitHub
# release (Tauri's recommended route); bump the URL and sha256 per release.
id: com.playtarockonline.PlayTarockOnline
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: playtarockonline
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
modules:
  - name: playtarockonline
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/zigae/playtarockonline-releases/releases/download/v1.0.1/PlayTarockOnline_1.0.1_amd64.deb
        sha256: 8f44f4cfe9676193ef0c446540170898946c53773c2c92282ab6021309c0fff1
        dest-filename: app.deb
        only-arches: [x86_64]
      - type: file
        path: com.playtarockonline.PlayTarockOnline.metainfo.xml
    build-commands:
      - ar -x app.deb
      - tar -xf data.tar.*
      # The deb holds one executable; give it a stable name.
      - install -Dm755 usr/bin/* /app/bin/playtarockonline
      - install -Dm644 usr/share/applications/*.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-key=Exec --set-value='playtarockonline %u' --set-icon=${FLATPAK_ID} --set-key=StartupWMClass --set-value=play-tarock /app/share/applications/${FLATPAK_ID}.desktop
      - |
        for icon in usr/share/icons/hicolor/*/apps/*.png; do
          # Tauri names the 2x 128 px icon "256x256@2"; it is a 256 px icon.
          size=$(basename $(dirname $(dirname "$icon"))); size=${size%@2}
          install -Dm644 "$icon" /app/share/icons/hicolor/$size/apps/${FLATPAK_ID}.png
        done
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
