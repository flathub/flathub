app-id: com.github.wiskton.AcordaNeo
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: acordaneo

finish-args:
  # Acesso gráfico Wayland / X11
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc

  # Acesso a áudio e microfone
  - --socket=pulseaudio
  - --device=all

  # Acesso à rede (Ollama local, Edge-TTS e Claude)
  - --share=network

  # Integração de sistema D-Bus (Tray, MPRIS Spotify, UPower, Notificações)
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.mpris.MediaPlayer2.*
  - --talk-name=org.freedesktop.UPower
  - --talk-name=org.freedesktop.portal.GlobalShortcuts
  - --talk-name=org.freedesktop.Notifications
  - --own-name=org.kde.StatusNotifierItem-*-*

  # Permissão de arquivos (documentos para exportar conversa)
  - --filesystem=xdg-documents:create
  - --filesystem=~/.config/acordaneo:create

modules:
  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --enable-shared
      - --disable-static
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-6.1.1.tar.xz
        sha256: 86dd580e777f98d71fb5d0be4061a15712e557223b20c24cb3ec5510dd91544a

  - name: acordaneo
    buildsystem: simple
    build-commands:
      - install -Dm755 main.py /app/bin/acordaneo
      - cp -r assistente_voz /app/bin/
      - cp -r assets /app/bin/
      - install -Dm644 com.github.wiskton.AcordaNeo.desktop /app/share/applications/com.github.wiskton.AcordaNeo.desktop
      - install -Dm644 com.github.wiskton.AcordaNeo.metainfo.xml /app/share/metainfo/com.github.wiskton.AcordaNeo.metainfo.xml
      - install -Dm644 com.github.wiskton.AcordaNeo.png /app/share/icons/hicolor/256x256/apps/com.github.wiskton.AcordaNeo.png
    sources:
      - type: git
        url: https://github.com/wiskton/AcordaNeo.git
        tag: v0.3.0
        commit: 7cdd21481bfe1b2ad750f0fca44840d249f65516

      - type: file
        path: com.github.wiskton.AcordaNeo.desktop

      - type: file
        path: com.github.wiskton.AcordaNeo.metainfo.xml

      - type: file
        path: com.github.wiskton.AcordaNeo.png
