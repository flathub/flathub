id: io.github.tevoetals.fastnotes
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: fastnotes
finish-args:
  # Fala Wayland diretamente (X11 só como fallback nominal; o app não o usa).
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Imagens arrastadas do gerenciador de arquivos chegam como file:// e são
  # copiadas para a pasta da nota; leitura das pastas usuais de imagens.
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-download:ro
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-desktop:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/fastnotes/cargo
modules:
  - name: fastnotes
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/fastnotes /app/bin/fastnotes
      - install -Dm644 fonts/InterVariable.ttf fonts/InterVariable-Italic.ttf fonts/LICENSE-Inter.txt -t /app/share/fonts/fastnotes
      - install -Dm644 data/io.github.tevoetals.fastnotes.desktop -t /app/share/applications
      - install -Dm644 data/io.github.tevoetals.fastnotes.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/icons/io.github.tevoetals.fastnotes.svg -t /app/share/icons/hicolor/scalable/apps
    sources:
      - type: git
        url: https://github.com/tevoetals/fastnotes.git
        tag: v0.2.0
        commit: e29f049735bee8ffc4d1655c2927e25f82f53bef
      - cargo-sources.json
