id: io.github.maxkcy.virtual-chat
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk//50
command: virtual-chat

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.freedesktop.secrets
  - --system-talk-name=org.bluez

modules:
  - name: virtual-chat
    buildsystem: simple
    build-commands:
      # Extract data.tar.gz from the .deb using GNU ar
      - ar p virtual-chat.deb data.tar.gz > data.tar.gz
      # Extract all files into a temp dir
      - mkdir extract
      - tar -xf data.tar.gz -C extract
      # Install binaries
      - install -Dm755 extract/usr/bin/virtual-chat /app/bin/virtual-chat
      - install -Dm755 extract/usr/bin/virtual-headset-sidecar /app/bin/virtual-headset-sidecar
      # Install icons under the app-id names (Flathub requirement)
      - install -Dm644 extract/usr/share/icons/hicolor/128x128/apps/virtual-chat.png /app/share/icons/hicolor/128x128/apps/io.github.maxkcy.virtual-chat.png
      - install -Dm644 extract/usr/share/icons/hicolor/32x32/apps/virtual-chat.png /app/share/icons/hicolor/32x32/apps/io.github.maxkcy.virtual-chat.png
      # Install the desktop entry under the required app-id name
      - mkdir -p /app/share/applications
      - cp extract/usr/share/applications/virtual-chat.desktop /app/share/applications/io.github.maxkcy.virtual-chat.desktop
      # Install AppStream metainfo (renamed to app-id)
      - install -Dm644 io.github.maxkcy.virtual-chat.metainfo.xml /app/share/metainfo/io.github.maxkcy.virtual-chat.metainfo.xml
      # Install license file (required by Flathub)
      - install -Dm644 LICENSE /app/share/licenses/io.github.maxkcy.virtual-chat/LICENSE
      # Patch the desktop entry for Flathub compliance:
      #   - icon name must match the app id
      #   - Categories is required (empty is rejected by Flathub lint)
      #   - human-readable name
      #   - comment should be brief (single line, per spec)
      - sed -i -e 's/^Icon=.*/Icon=io.github.maxkcy.virtual-chat/' -e 's/^Categories=.*/Categories=Network;Chat;/' -e 's/^Name=virtual-chat$/Name=Virtual Chat/' -e 's/^Comment=.*/Comment=Real-time audio to conversation formatter with AI assistant/' /app/share/applications/io.github.maxkcy.virtual-chat.desktop
      # Clean up
      - rm -rf extract
    sources:
      - type: file
        url: https://github.com/maxkcy/Virtual-Chat/releases/download/v0.1.2/virtual-chat_0.1.2_amd64.deb
        sha256: f43d097694f9cf03c465413bd2ab9b9a7050fff66f3bf4d460258c55f6c437cc
        dest-filename: virtual-chat.deb
        only-arches:
          - x86_64
      - type: file
        path: io.github.maxkcy.virtual-chat.metainfo.xml
      - type: file
        path: LICENSE
