app-id: io.github.tomaszbojanowski.Vumi
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: vumi

finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=pulseaudio

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/vumi/cargo

modules:
  - name: vumi
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/TomaszBojanowski/vumi.git
        tag: v0.1.1
        commit: 5fe745aa6d696abaaee9a29d853a1029a7914579
      - cargo-sources.json
