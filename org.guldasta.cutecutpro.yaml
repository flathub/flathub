app-id: org.guldasta.cutecutpro
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: cutecut-pro
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
modules:
  - name: cutecut-pro
    buildsystem: simple
    build-commands:
      - install -Dm755 cutecut-pro /app/bin/cutecut-pro
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/org.guldasta.cutecutpro.png
      - install -Dm644 org.guldasta.cutecutpro.desktop /app/share/applications/org.guldasta.cutecutpro.desktop
      - install -Dm644 org.guldasta.cutecutpro.metainfo.xml /app/share/metainfo/org.guldasta.cutecutpro.metainfo.xml
    sources:
      - type: file
        path: cutecut-pro
      - type: file
        path: icon.png
      - type: file
        path: org.guldasta.cutecutpro.desktop
      - type: file
        path: org.guldasta.cutecutpro.metainfo.xml
