app-id: io.github.kiss2oblivion.PDFchemy
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: pdfchemy

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --filesystem=host:ro
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh

  - name: pdfchemy
    buildsystem: simple
    build-commands:
      - install -D -m 755 pdfchemy /app/bin/pdfchemy
      - install -D -m 644 PDFchemy-universal-1.0.0.jar /app/lib/pdfchemy/PDFchemy-universal-1.0.0.jar
      - install -D -m 644 io.github.kiss2oblivion.PDFchemy.desktop /app/share/applications/io.github.kiss2oblivion.PDFchemy.desktop
      - install -D -m 644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.kiss2oblivion.PDFchemy.png
      - install -D -m 644 io.github.kiss2oblivion.PDFchemy.metainfo.xml /app/share/metainfo/io.github.kiss2oblivion.PDFchemy.metainfo.xml
    sources:
      - type: file
        url: https://github.com/kiss2oblivion/pdfchemy/releases/download/v1.0.0/PDFchemy-universal-1.0.0.jar
        sha256: 0393682cbbdf7ddab2f2798606f28c2c338cacecb710ccd9539125a938e75814
      - type: file
        path: pdfchemy
      - type: file
        path: io.github.kiss2oblivion.PDFchemy.desktop
      - type: file
        path: icon.png
      - type: file
        path: io.github.kiss2oblivion.PDFchemy.metainfo.xml
