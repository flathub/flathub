app-id: app.aiche.Desktop
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.9'
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: aiche-desktop
separate-locales: false

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '24.08'
    add-ld-path: lib
    no-autodownload: false
    autodelete: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=AICHE_FLATPAK=1
  - --env=AICHE_PORTAL_ONLY=1

cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/pkgconfig
  - /man
  - /share/man

modules:
  - name: wl-clipboard
    # Built from source, but we install only wl-copy. The full `meson install`
    # tries to drop fish completions into /usr/share/fish (read-only in the build
    # sandbox) and fails; the app only ever calls wl-copy anyway.
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.2.1.tar.gz
        sha256: 6eb8081207fb5581d1d82c4bcd9587205a31a3d47bea3ebeb7f41aa1143783eb
    build-commands:
      - meson setup _build --prefix=/app --buildtype=release
      - ninja -C _build src/wl-copy
      - install -Dm755 _build/src/wl-copy /app/bin/wl-copy

  - name: ffmpeg-dir
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/ffmpeg

  - python3-deps.yaml

  - name: aiche-desktop
    buildsystem: simple
    sources:
      - type: extra-data
        filename: aiche-payload.tar.gz
        url: https://github.com/AICHE-app/linux-releases/releases/download/v1.1.17/aiche-desktop-1.1.17-flatpak-payload.tar.gz
        sha256: 7db4060ee6988cfc54caa67147b7822be19c63ac84df914c048578413adb3c02
        size: 4630954
      - type: file
        path: apply_extra.sh
      - type: file
        path: aiche-wrapper.sh
      - type: file
        path: app.aiche.Desktop.desktop
      - type: file
        path: app.aiche.Desktop.metainfo.xml
      - type: file
        path: icons/512.png
      - type: file
        path: icons/256.png
      - type: file
        path: icons/128.png
      - type: file
        path: icons/64.png
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 aiche-wrapper.sh /app/bin/aiche-desktop
      - install -Dm644 app.aiche.Desktop.desktop /app/share/applications/app.aiche.Desktop.desktop
      - install -Dm644 app.aiche.Desktop.metainfo.xml /app/share/metainfo/app.aiche.Desktop.metainfo.xml
      - install -Dm644 512.png /app/share/icons/hicolor/512x512/apps/app.aiche.Desktop.png
      - install -Dm644 256.png /app/share/icons/hicolor/256x256/apps/app.aiche.Desktop.png
      - install -Dm644 128.png /app/share/icons/hicolor/128x128/apps/app.aiche.Desktop.png
      - install -Dm644 64.png /app/share/icons/hicolor/64x64/apps/app.aiche.Desktop.png
