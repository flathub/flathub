app-id: app.aiche.Desktop
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.10'
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: aiche-desktop
separate-locales: false

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '24.08'
    add-ld-path: lib
    no-autodownload: false
    autodelete: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all          # /dev/uinput required for Smart Insert (ydotool)
  - --filesystem=home
  - --socket=session-bus
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.gnome.Shell.Extensions
  - --env=AICHE_FLATPAK=1

modules:
  # ── ydotool v1.0.4 (prebuilt — upstream releases) ──────────────────────────
  - name: ydotool
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/ReimuNotMoe/ydotool/releases/download/v1.0.4/ydotool-release-ubuntu-latest
        dest-filename: ydotool
        sha256: daa83507a596d6839b7467540382dbdc6e4bf64ebfa4f7d6416e877d9a522c0c
      - type: file
        url: https://github.com/ReimuNotMoe/ydotool/releases/download/v1.0.4/ydotoold-release-ubuntu-latest
        dest-filename: ydotoold
        sha256: 3f14f96308935214c0fb154507360f7632e7deda1935dc2d538259fd9986ed36
    build-commands:
      - install -Dm755 ydotool /app/bin/ydotool
      - install -Dm755 ydotoold /app/bin/ydotoold

  # ── wl-clipboard built from source ─────────────────────────────────────────
  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dzshcompletiondir=disabled
      - -Dfishcompletiondir=disabled
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/v2.2.1.tar.gz
        sha256: 6eb8081207fb5581d1d82c4bcd9587205a31a3d47bea3ebeb7f41aa1143783eb

  # ── ffmpeg extension mount-point (org.freedesktop.Platform.ffmpeg-full) ────
  - name: ffmpeg-dir
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/ffmpeg

  # ── Python dependencies (offline — generated by flatpak-pip-generator) ─────
  - !include python3-deps.yaml

  # ── AICHE Desktop application (extra-data: payload fetched at install time)
  - name: aiche-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 aiche-wrapper.sh /app/bin/aiche-desktop
      - install -Dm644 app.aiche.Desktop.desktop /app/share/applications/app.aiche.Desktop.desktop
      - install -Dm644 icons/512.png /app/share/icons/hicolor/512x512/apps/app.aiche.Desktop.png
      - install -Dm644 icons/256.png /app/share/icons/hicolor/256x256/apps/app.aiche.Desktop.png
      - install -Dm644 icons/128.png /app/share/icons/hicolor/128x128/apps/app.aiche.Desktop.png
      - install -Dm644 icons/64.png /app/share/icons/hicolor/64x64/apps/app.aiche.Desktop.png
      - install -Dm644 app.aiche.Desktop.appdata.xml /app/share/metainfo/app.aiche.Desktop.appdata.xml
    sources:
      - type: extra-data
        filename: aiche-desktop.tar.gz
        url: https://github.com/AICHE-app/linux-releases/releases/download/v1.1.6/aiche-desktop-1.1.6-flatpak-payload.tar.gz
        sha256: c2e6ba54ae42c9d03022dc65244202364640a484c0b1929bd56deabea2edbbba
        size: 2258711
      - type: file
        path: apply_extra
      - type: file
        path: aiche-wrapper.sh
      - type: file
        path: app.aiche.Desktop.desktop
      - type: file
        path: app.aiche.Desktop.appdata.xml
      - type: dir
        path: icons
        dest: icons
