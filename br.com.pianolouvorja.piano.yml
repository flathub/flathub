app-id: br.com.pianolouvorja.piano
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: louvorja-piano
rename-icon: louvorja-piano
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.mpris.MediaPlayer2.*
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
modules:
  # ícone em arch neutro: o rename-icon do toplevel roda em TODAS as archs,
  # então o ícone precisa existir mesmo onde o módulo principal é pulado
  - name: louvorja-piano-icon
    buildsystem: simple
    build-commands:
      - install -Dm644 icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/louvorja-piano.png
    sources:
      - type: file
        path: icon.png
  - name: louvorja-piano
    buildsystem: simple
    # o tarball do upstream contém binários x86_64 (Electron); sem build aarch64
    only-arches:
      - x86_64
    build-commands:
      - install -dm755 ${FLATPAK_DEST}/opt/louvorja-piano
      - cp -a * ${FLATPAK_DEST}/opt/louvorja-piano/
      - install -Dm755 louvorja-piano.sh ${FLATPAK_DEST}/bin/louvorja-piano
      - install -Dm644 br.com.pianolouvorja.piano.desktop ${FLATPAK_DEST}/share/applications/br.com.pianolouvorja.piano.desktop
      - install -Dm644 br.com.pianolouvorja.piano.metainfo.xml ${FLATPAK_DEST}/share/metainfo/br.com.pianolouvorja.piano.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/Piano-Louvor-JA/app/releases/download/v1.29.1/LouvorJA-PIANO-1.29.1-x64.tar.gz
        sha256: 58649c15be5f74a411a828e44dfdb056148acd45d7269b5418303275289326f5
        # sha256 verificado via download + sha256sum em 2026-10-11
      - type: file
        path: br.com.pianolouvorja.piano.desktop
      - type: file
        path: br.com.pianolouvorja.piano.metainfo.xml
      - type: file
        path: louvorja-piano.sh
