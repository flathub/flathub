app-id: br.com.pianolouvorja.piano
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: louvorja-piano
rename-icon: louvorja-piano
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
modules:
  - name: louvorja-piano
    buildsystem: simple
    build-commands:
      - install -dm755 ${FLATPAK_DEST}/opt/louvorja-piano
      - cp -a LouvorJA-PIANO-*/. ${FLATPAK_DEST}/opt/louvorja-piano/
      - install -Dm644 LouvorJA-PIANO-*/resources/icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/louvorja-piano.png
      - install -Dm755 louvorja-piano.sh ${FLATPAK_DEST}/bin/louvorja-piano
      - install -Dm644 br.com.pianolouvorja.piano.desktop ${FLATPAK_DEST}/share/applications/br.com.pianolouvorja.piano.desktop
      - install -Dm644 br.com.pianolouvorja.piano.metainfo.xml ${FLATPAK_DEST}/share/metainfo/br.com.pianolouvorja.piano.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/Piano-Louvor-JA/app/releases/download/v1.37.2/LouvorJA-PIANO-1.37.2-x64.tar.gz
        sha256: b18dbeac2acac9dfbc78429bea057ecf5301abaa12129e0aeded942ebe4ddcf8
        only-arches: [x86_64]
      - type: archive
        url: https://github.com/Piano-Louvor-JA/app/releases/download/v1.37.2/LouvorJA-PIANO-1.37.2-arm64.tar.gz
        sha256: c6efbf3e8736abba299ca0466d06304275c6c6d3cf314208258735b86faa77c6
        only-arches: [aarch64]
      - type: file
        path: louvorja-piano.sh
