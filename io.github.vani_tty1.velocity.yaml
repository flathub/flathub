id: io.github.vani_tty1.velocity
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: velocity
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  - --socket=wayland
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'
modules:
  - name: velocity
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/vani-tty1/velocity.git
        tag: v0.4.0
        commit: 938a7c290d274f91ddc10d3006232e77e3e71996
