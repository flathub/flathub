app-id: io.github.chensiqi2007.PhotoSelect
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: photoselect-desktop
finish-args:
  # X11 & Wayland display
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # GPU acceleration for WebGL 2.0 Peak Focus Shader
  - --device=dri
  # File system access to user photos and storage devices
  - --filesystem=host:ro
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download
  - --filesystem=/media
  - --filesystem=/run/media
  # Inter-process communication
  - --talk-name=org.freedesktop.FileManager1

modules:
  - name: photoselect-desktop
    buildsystem: simple
    build-commands:
      # 从发布的 Debian 安装包解压并装配至 /app
      - ar x *.deb
      - tar -xf data.tar.* -C /app --strip-components=3 ./usr/bin/photoselect-desktop || tar -xf data.tar.* -C /app
      # 安装桌面入口与元数据规范
      - install -Dm644 io.github.chensiqi2007.PhotoSelect.desktop /app/share/applications/io.github.chensiqi2007.PhotoSelect.desktop
      - install -Dm644 io.github.chensiqi2007.PhotoSelect.metainfo.xml /app/share/metainfo/io.github.chensiqi2007.PhotoSelect.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.chensiqi2007.PhotoSelect.png
    sources:
      - type: file
        url: https://github.com/chensiqi2007/photoselect/releases/download/v1.1.0/PhotoSelect%20Desktop_1.1.0_amd64.deb
        sha256: 3217750d537a78be4cf9c69cbd63bde5954fa238a1ea72456f598e0e9d1b3ad4
      - type: file
        path: io.github.chensiqi2007.PhotoSelect.desktop
      - type: file
        path: io.github.chensiqi2007.PhotoSelect.metainfo.xml
      - type: file
        path: icon.png
