id: io.github.c9dev.penguin-mail
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: penguin-mail
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-download
  - --filesystem=~/.gnupg
  - --filesystem=xdg-run/gnupg:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/penguin-mail/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: penguin-mail
    buildsystem: simple
    build-options:
      env:
        PENGUIN_MAIL_GOOGLE_CLIENT_ID: "715945856248-53545a2lcqoruljenij93p2emqn5h1uq.apps.googleusercontent.com"
        PENGUIN_MAIL_GOOGLE_CLIENT_SECRET: "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"
        PENGUIN_MAIL_MICROSOFT_CLIENT_ID: "1a3ab819-a58e-4bd5-9e12-6ceba9319d92"
    build-commands:
      - cargo --offline build --release --locked -p mailrs -p mailrs-cli --features mailrs/packaging-flatpak,mailrs-cli/packaging-flatpak
      - scripts/stage.sh /app io.github.c9dev.penguin-mail
    sources:
      - type: git
        url: https://github.com/c9dev/penguin-mail.git
        tag: v1.0.5
        commit: 8a571dbaf84e6920d7be738314d16a4df72efdec
      - cargo-sources.json
