id: com.lonje.Froxel
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: froxel
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The MCP control port (--control) and the Godot and Blender bridges listen on
  # loopback for clients outside the sandbox.
  - --share=network
  # MCP tools and the command line read and write .vox, .glb, and .png files by
  # path, which the file chooser portal cannot grant.
  - --filesystem=home
modules:
  - name: froxel
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/froxel/cargo
        CARGO_NET_OFFLINE: "true"
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/froxel /app/bin/froxel
      - install -Dm644 packaging/linux/froxel.desktop /app/share/applications/com.lonje.Froxel.desktop
      - desktop-file-edit --set-icon=com.lonje.Froxel /app/share/applications/com.lonje.Froxel.desktop
      - install -Dm644 packaging/linux/com.lonje.Froxel.metainfo.xml /app/share/metainfo/com.lonje.Froxel.metainfo.xml
      - sed -i 's|<launchable type="desktop-id">froxel.desktop</launchable>|<launchable type="desktop-id">com.lonje.Froxel.desktop</launchable>|' /app/share/metainfo/com.lonje.Froxel.metainfo.xml
      - |
        for png in packaging/icons/hicolor/*.png; do
          size=$(basename "$png" .png)
          install -Dm644 "$png" "/app/share/icons/hicolor/$size/apps/com.lonje.Froxel.png"
        done
    sources:
      - type: git
        url: https://github.com/theromis/Froxel.git
        tag: v0.3.4
        commit: bf0ee58b59a276017c1a8a2a22e402673b1d1fa6
      - cargo-sources.json
