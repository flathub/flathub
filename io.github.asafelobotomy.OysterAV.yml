  - name: oysterav
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} .
      - install -Dm644 packaging/oysterav/io.github.asafelobotomy.OysterAV.desktop ${FLATPAK_DEST}/share/applications/io.github.asafelobotomy.OysterAV.desktop
      - install -Dm644 packaging/oysterav/flatpak/io.github.asafelobotomy.OysterAV.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.asafelobotomy.OysterAV.metainfo.xml
      - install -Dm644 branding/hicolor/16x16/apps/oysterav.png ${FLATPAK_DEST}/share/icons/hicolor/16x16/apps/oysterav.png
      - install -Dm644 branding/hicolor/32x32/apps/oysterav.png ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/oysterav.png
      - install -Dm644 branding/hicolor/48x48/apps/oysterav.png ${FLATPAK_DEST}/share/icons/hicolor/48x48/apps/oysterav.png
      - install -Dm644 branding/hicolor/128x128/apps/oysterav.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/oysterav.png
      - install -Dm644 branding/hicolor/256x256/apps/oysterav.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/oysterav.png
      - install -Dm644 branding/hicolor/512x512/apps/oysterav.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/oysterav.png
