# Flathub-recept voor Tabchat. Verpakt de .deb van de GitHub-release in een Flatpak.
# De snelkoppeling, metainfo en het icoon komen uit de broncode (zelfde versie).
id: io.github.MMV2408.Tabchat
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: tabchat
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # Camera voor videobellen in Teams en Discord
  - --device=all
  # Bestanden downloaden uit chats en mails
  - --filesystem=xdg-download
  # Tray-icoon en meldingen
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: tabchat
    buildsystem: simple
    build-commands:
      - bsdtar -Oxf tabchat.deb data.tar.xz | bsdtar -xf -
      - cp -a opt/Tabchat /app/tabchat
      - rm -f /app/tabchat/chrome-sandbox
      - install -Dm755 tabchat.sh /app/bin/tabchat
      - install -Dm644 src/packaging/flatpak/io.github.MMV2408.Tabchat.desktop -t /app/share/applications
      - install -Dm644 src/packaging/flatpak/io.github.MMV2408.Tabchat.metainfo.xml -t /app/share/metainfo
      - install -Dm644 src/assets/icon.png /app/share/icons/hicolor/512x512/apps/io.github.MMV2408.Tabchat.png
    sources:
      - type: file
        dest-filename: tabchat.deb
        url: https://github.com/MMV2408/tabchat/releases/download/v1.14.1/tabchat_1.14.1_amd64.deb
        sha256: 65d3f72f11ae744c258e59df1b30a113863462cd8617280b627d11519bef4dac
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/MMV2408/tabchat/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/MMV2408/tabchat/releases/download/v" + $version + "/tabchat_" + $version + "_amd64.deb"'
      - type: git
        dest: src
        url: https://github.com/MMV2408/tabchat.git
        commit: 4a4b9a53c3a12d2a6857714ddc967a2cf5931557
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: script
        dest-filename: tabchat.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/tabchat/tabchat "$@"
