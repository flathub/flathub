app-id: dev.aadhil.devtpro
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: devtpro
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network

modules:
  - name: devtpro
    buildsystem: simple
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      - mkdir -p /app/devtpro /app/bin
      - cp -a bundle/. /app/devtpro/
      - ln -s /app/devtpro/devtpro /app/bin/devtpro
      - install -Dm644 flatpak/dev.aadhil.devtpro.desktop -t /app/share/applications/
      - install -Dm644 flatpak/dev.aadhil.devtpro.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 flatpak/dev.aadhil.devtpro.png -t /app/share/icons/hicolor/512x512/apps/
      - install -Dm644 legal/LICENSE.txt -t /app/share/licenses/dev.aadhil.devtpro/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://aadhil.dev/media/releases/devtpro/devtpro-linux-x86_64-8.1.2.tar.xz
        sha256: 'ac5c12b3a3555a10cee70580837b3b578307da8cd82f86b5d3cd163afc175e3c'
