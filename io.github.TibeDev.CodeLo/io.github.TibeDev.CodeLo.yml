app-id: io.github.TibeDev.CodeLo
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22

command: codelo

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --share=ipc
  - --env=LD_LIBRARY_PATH=/app/lib/codelo

modules:
  - name: codelo

    buildsystem: simple

    build-options:
      append-path: /usr/lib/sdk/node22/bin
      build-args:
        - --share=network
      env:
        npm_config_offline: "false"

    build-commands:
      - npm ci --ignore-scripts --verbose
      - npx electron-builder --linux dir

      - mkdir -p /app/lib/codelo
      - cp -r dist/linux-unpacked/* /app/lib/codelo

      - install -Dm755 flatpak/codelo.sh /app/bin/codelo

      - install -Dm644 flatpak/io.github.TibeDev.CodeLo.desktop /app/share/applications/io.github.TibeDev.CodeLo.desktop
      - install -Dm644 flatpak/io.github.TibeDev.CodeLo.metainfo.xml /app/share/metainfo/io.github.TibeDev.CodeLo.metainfo.xml
      - install -Dm644 flatpak/io.github.TibeDev.CodeLo.png /app/share/icons/hicolor/512x512/apps/io.github.TibeDev.CodeLo.png
    sources:
      - type: git
        url: https://github.com/TibeDev/CodeLo.git
        commit: 8071e585355b4115ab8c220708ff0c0747be6ad6
