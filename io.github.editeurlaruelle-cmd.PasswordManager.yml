app-id: io.github.editeurlaruelle-cmd.PasswordManager
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
command: password-manager-launcher
homepage: https://github.com/editeurlaruelle-cmd/password-manager
finish-args:
  # Fenêtre native (GTK + WebKitGTK)
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Le serveur n'écoute que sur 127.0.0.1
  - --share=network
  # Stockage persistant du coffre chiffré
  - --persist=.password-manager

build-options:
  append-path: /usr/lib/sdk/node20/bin

modules:
  - name: password-manager
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/node20/install.sh

      - mkdir -p /app/bin/password-manager/server /app/bin/password-manager/public /app/bin/password-manager/shell
      - cp -r server/* /app/bin/password-manager/server/
      - cp -r public/* /app/bin/password-manager/public/
      - cp -r shell/* /app/bin/password-manager/shell/

      - install -Dm755 packaging/flatpak/password-manager-launcher /app/bin/password-manager-launcher
      - install -Dm644 packaging/flatpak/io.github.editeurlaruelle-cmd.PasswordManager.desktop /app/share/applications/io.github.editeurlaruelle-cmd.PasswordManager.desktop
      - install -Dm644 packaging/flatpak/icons/io.github.editeurlaruelle-cmd.PasswordManager-256.png /app/share/icons/hicolor/256x256/apps/io.github.editeurlaruelle-cmd.PasswordManager.png
      - install -Dm644 packaging/flatpak/io.github.editeurlaruelle-cmd.PasswordManager.metainfo.xml /app/share/metainfo/io.github.editeurlaruelle-cmd.PasswordManager.metainfo.xml
    sources:
      - type: git
        url: https://github.com/editeurlaruelle-cmd/password-manager.git
        tag: v0.1.0
        commit: 2d786ff3f118cd9adbea6ad1aff6c3050ddb10e9
