app-id: io.github.timasangwan_amit.VoxAssist
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: vox-assist
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --talk-name=org.a11y.Bus
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.GlobalShortcuts
  - --filesystem=xdg-config/vox-assist:create
  - --device=all

modules:
  - python3-requirements.json

  - name: vox-assist
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} .
      - install -Dm644 flatpak/io.github.timasangwan_amit.VoxAssist.desktop ${FLATPAK_DEST}/share/applications/io.github.timasangwan_amit.VoxAssist.desktop
      - install -Dm644 flatpak/io.github.timasangwan_amit.VoxAssist.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.timasangwan_amit.VoxAssist.metainfo.xml
      - install -Dm644 flatpak/io.github.timasangwan_amit.VoxAssist.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.timasangwan_amit.VoxAssist.svg
    sources:
      - type: git
        url: https://github.com/timasangwan-amit/vox-assist.git
        commit: 1999461f7c43328922f3369137ee915f1b6c14d8
