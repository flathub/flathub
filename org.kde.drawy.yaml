id: org.kde.drawy
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: drawy
rename-icon: drawy
rename-mime-file: application-x-drawy.xml
rename-mime-icons:
  - "application-x-drawy"
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland

cleanup:
  - /include
  - /share/doc
  - /share/qlogging-categories6

modules:
  - name: drawy
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_TESTING=OFF
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://download.kde.org/stable/drawy/1.0.1/drawy-1.0.1.tar.xz
        sha256: 3bf3764784d6c8cfd80bd4fd639d73eaedc4c88889c03215d3add25f685ab227
        x-checker-data:
          - type: anitya
            project-id: 387893
            stable-only: true
            url-template: https://download.kde.org/stable/drawy/$version/drawy-$version.tar.xz
