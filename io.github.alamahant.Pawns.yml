app-id: io.github.alamahant.Pawns
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: Pawns
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
# Needed for remote P2P play
  - --share=network
# Needed to play game sounds
  - --socket=pulseaudio

cleanup:
  - /include
  - /lib/*.a
  - /share/doc
  - /share/man
  - /share/info
  - /lib/cmake
  - /lib/pkgconfig

modules:
  - name: Pawns
    buildsystem: cmake-ninja
    config-opts:
      - -DFLATPAK_BUILD=ON
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      # miniupnpc source
      - type: archive
        url: https://miniupnp.tuxfamily.org/files/miniupnpc-2.3.3.tar.gz
        sha256: d52a0afa614ad6c088cc9ddff1ae7d29c8c595ac5fdd321170a05f41e634bd1a
        dest: miniupnpc_src
      # Stockfish source
      - type: archive
        url: https://github.com/official-stockfish/Stockfish/archive/sf_18.tar.gz
        sha256: 22a195567e3493e7c9ca8bf8fa2339f4ffc876384849ac8a417ff4b919607e7b
        dest: stockfish_src
      # Stockfish NNUE files
      - type: file
        dest: stockfish_src/src
        url: https://tests.stockfishchess.org/api/nn/nn-c288c895ea92.nnue
        sha256: c288c895ea924429ea9092e3f36b2b3c1f00f2a3a4c759ff7e57e79e3b43e4a7
      - type: file
        dest: stockfish_src/src
        url: https://tests.stockfishchess.org/api/nn/nn-37f18f62d772.nnue
        sha256: 37f18f62d772f3107e1d6aaca3898c130c3c86f2ab63e6555fbbca20635a899d
      # Main app source
      - type: git
        url: https://github.com/alamahant/Pawns.git
        tag: v1.0.0
        commit: cfe01ee6bb2ed0584db4b555c046b6659f3ef11d