app-id: org.bgammon.boxcars
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: boxcars
finish-args:
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --filesystem=~/.config/boxcars
modules:
  - name: boxcars
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
    build-commands:
      - go build -mod=vendor -trimpath -o boxcars
      - install -Dm00755 boxcars $FLATPAK_DEST/bin/boxcars
      - install -Dm00644 game/asset/image/icon.png $FLATPAK_DEST/share/icons/hicolor/256x256/apps/$FLATPAK_ID.png
      - install -Dm00644 $FLATPAK_ID.desktop $FLATPAK_DEST/share/applications/$FLATPAK_ID.desktop
      - install -Dm00644 $FLATPAK_ID.appdata.xml $FLATPAK_DEST/share/appdata/$FLATPAK_ID.appdata.xml
    sources:
      - type: archive
        url: "https://codeberg.org/tslocum/boxcars/archive/v1.5.1.tar.gz"
        sha256: b351929483d31c1936b68170bae1d6df53e69cb55004fa6b58c86624de17b652
      - dest: .
        path: org.bgammon.boxcars.desktop
        type: file
      - dest: .
        path: org.bgammon.boxcars.appdata.xml
        type: file
