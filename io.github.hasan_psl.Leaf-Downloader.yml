# Flatpak manifest for Leaf Downloader
# Build with: flatpak-builder --force-clean --user --install build-dir io.github.hasan_psl.LeafDownloader.yml
# Run with:   flatpak run io.github.hasan_psl.LeafDownloader

app-id: io.github.hasan_psl.Leaf-Downloader
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: leaf-downloader

finish-args:
  # Display
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # Network access (required for downloading files)
  - --share=network

  # Filesystem access
  - --filesystem=xdg-download

  # Desktop integration
  - --talk-name=org.freedesktop.Notifications

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'

modules:
  # ---------------------------------------------------------------
  # FFmpeg — required by yt-dlp for muxing DASH video+audio streams
  # ---------------------------------------------------------------
  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --disable-doc
      - --disable-static
      - --enable-shared
      - --enable-gpl
      - --enable-version3
      - --disable-programs
      - --enable-ffmpeg
      - --disable-ffplay
      - --disable-ffprobe
      - --disable-network
      - --disable-encoders
      - --disable-muxers
      - --enable-encoder=aac
      - --enable-encoder=libx264
      - --enable-encoder=png
      - --enable-muxer=mp4
      - --enable-muxer=matroska
      - --enable-muxer=webm
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz
        sha256: 733984395e0dbbe5c046abda2dc49a5544e7e0e1e2366bba849222ae9e3a03b1
        x-checker-data:
          type: anitya
          project-id: 5405
          stable-only: true
          url-template: https://ffmpeg.org/releases/ffmpeg-$version.tar.xz

  # ---------------------------------------------------------------
  # yt-dlp — Python package for platform video downloads
  # ---------------------------------------------------------------
  - name: python3-yt-dlp
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --no-deps --prefix=/app yt-dlp*.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/cd/13/5093bcb954878e50f7217fd2ab94282b53934022e4e4a03265582da83bf5/yt_dlp-2026.3.17-py3-none-any.whl
        sha256: 32992db94303a8a5d211a183f2174834fe7f8c29d83ed2e7a324eae97a8f26d8
        dest-filename: yt-dlp.whl

  # ---------------------------------------------------------------
  # Leaf Downloader — the application itself
  # ---------------------------------------------------------------
  - name: leaf-downloader
    buildsystem: simple
    build-commands:
      # Install the launcher script
      - install -Dm755 bin/leaf-downloader /app/bin/leaf-downloader

      # Install the Python application
      - mkdir -p /app/share/leaf-downloader
      - cp -r main.py leaf_downloader /app/share/leaf-downloader/

      # Install the desktop entry
      - install -Dm644 data/io.github.hasan_psl.Leaf-Downloader.desktop
          /app/share/applications/io.github.hasan_psl.Leaf-Downloader.desktop

      # Install the AppStream metainfo
      - install -Dm644 data/io.github.hasan_psl.Leaf-Downloader.metainfo.xml
          /app/share/metainfo/io.github.hasan_psl.Leaf-Downloader.metainfo.xml

      # Install icons (scalable SVG + pre-rendered PNGs)
      - install -Dm644 data/icons/io.github.hasan_psl.Leaf-Downloader.svg
          /app/share/icons/hicolor/scalable/apps/io.github.hasan_psl.Leaf-Downloader.svg
      - |
        for size in 48 64 128 256; do
          if [ -f "data/icons/hicolor/${size}x${size}/apps/io.github.hasan_psl.Leaf-Downloader.png" ]; then
            install -Dm644 "data/icons/hicolor/${size}x${size}/apps/io.github.hasan_psl.Leaf-Downloader.png" \
              "/app/share/icons/hicolor/${size}x${size}/apps/io.github.hasan_psl.Leaf-Downloader.png"
          fi
        done

    sources:
      - type: dir
        path: .
