app-id: io.github.prashithshetty.OpenRash
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: openrash

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --device=all
  - --share=network
  - --filesystem=xdg-data/openrash:create

cleanup:
  - /include
  - /lib/pkgconfig

modules:
  - name: openrash
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/Prashithshetty/openrash-linux.git
        tag: v2.0.0
        commit: c5f5bbbab142e1dc97618d45074dc567e3f6be03
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
