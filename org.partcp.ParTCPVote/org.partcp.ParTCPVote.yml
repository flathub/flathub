app-id: org.partcp.ParTCPVote
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: partcp_vote

# Required for WebKit (desktop_webview_window uses webkit2gtk)
# If WebView functionality is removed, switch to org.freedesktop.Platform//24.08

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.FileChooser

modules:
  - name: partcp-vote
    buildsystem: simple
    build-options:
      # Flutter's cmake invocation hardcodes CC=clang / CXX=clang++.
      # GNOME SDK 47 ships only GCC, so we place clang/clang++ wrappers that
      # forward to gcc/g++ in a directory prepended to PATH.
      prepend-path: /run/build/partcp-vote/.bin-wrappers
      env:
        FLUTTER_ROOT: /run/build/partcp-vote/flutter-sdk
        PUB_CACHE: /run/build/partcp-vote/.pub-cache
        FLUTTER_TARGET_PLATFORM: linux-x64
        # Prevent Flutter/Dart from making any network calls in the sandbox
        CI: "true"
        FLUTTER_SUPPRESS_ANALYTICS: "1"
        PUB_ENVIRONMENT: bot.ci
        DART_VM_OPTIONS: --no-enable-experiment=macros
    build-commands:
      - mkdir -p $PUB_CACHE
      # Create clang/clang++ wrappers so Flutter's hardcoded CC=clang/CXX=clang++ resolves.
      # Use single-quoted printf args so $@ is written literally into the script, not expanded.
      - install -dm755 /run/build/partcp-vote/.bin-wrappers
      - 'printf ''#!/bin/sh\nexec gcc "$@"\n'' > /run/build/partcp-vote/.bin-wrappers/clang'
      - 'printf ''#!/bin/sh\nexec g++ "$@"\n'' > /run/build/partcp-vote/.bin-wrappers/clang++'
      - chmod +x /run/build/partcp-vote/.bin-wrappers/clang /run/build/partcp-vote/.bin-wrappers/clang++
      # getwidget 6.0.0 uses AppBarTheme where Flutter 3.41.9+ returns AppBarThemeData.
      - sed -i 's/final AppBarTheme appBarTheme = AppBarTheme.of(context)/final AppBarThemeData appBarTheme = AppBarTheme.of(context)/' $PUB_CACHE/hosted/pub.dev/getwidget-6.0.0/lib/components/appbar/gf_appbar.dart
      # Pre-resolve flutter_tools' own packages offline so Flutter's internal
      # `dart pub get --directory flutter_tools` becomes a no-op (no network).
      - $FLUTTER_ROOT/bin/dart pub get --offline --directory $FLUTTER_ROOT/packages/flutter_tools
      # Run flutter pub get --offline to resolve app packages AND generate plugin
      # registration files (generated_plugins.cmake etc.) needed by CMake.
      - $FLUTTER_ROOT/bin/flutter pub get --offline
      - $FLUTTER_ROOT/bin/flutter build linux --release --no-pub --suppress-analytics
      # Install binary, libs and data — bundle uses $ORIGIN/lib RPATH so
      # lib/ and data/ must be siblings of the binary.
      - install -Dm755 build/linux/x64/release/bundle/partcp_vote /app/bin/partcp_vote
      - cp -r build/linux/x64/release/bundle/lib /app/bin/lib
      - cp -r build/linux/x64/release/bundle/data /app/bin/data
      # Desktop integration
      - install -Dm644 flatpak/org.partcp.ParTCPVote.desktop
          /app/share/applications/org.partcp.ParTCPVote.desktop
      - install -Dm644 assets/images/Icon-512.png
          /app/share/icons/hicolor/512x512/apps/org.partcp.ParTCPVote.png
      - install -Dm644 flatpak/org.partcp.ParTCPVote.metainfo.xml
          /app/share/metainfo/org.partcp.ParTCPVote.metainfo.xml
    sources:
      # App source — update tag and commit for each release
      - type: git
        url: https://codeberg.org/ParTCP/partcp_client_v2
        tag: v1.1.260505
        commit: 30c7760748a3ed5508ea7b270c205a6ccc8739d9

      # Flutter SDK — run flatpak/prepare.sh <version> to fill in sha256
      # See: https://storage.googleapis.com/flutter_infra_release/releases/
      - type: archive
        url: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.41.9-stable.tar.xz
        sha256: cf2631dde02570733921a530f47a96abe896b5e334682d2743c29530ea88bb2e
        dest: flutter-sdk
        strip-components: 1

      # Pre-downloaded pub packages (generated by flatpak/gen-pub-sources.py)
      - pub-sources.json
