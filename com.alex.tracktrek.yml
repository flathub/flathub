app-id: com.alex.tracktrek
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: TrackTrek.Avalonia
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc

modules:
  - name: TrackTrek
    buildsystem: simple
    build-commands:
      - install -Dm755 TrackTrek.Avalonia /app/bin/TrackTrek.Avalonia
      - install -d /app/bin/tools/linux
      - install -m755 tools/linux/ffmpeg /app/bin/tools/linux/ffmpeg
      - install -m755 tools/linux/yt-dlp_linux /app/bin/tools/linux/yt-dlp_linux
      - install -Dm644 com.alex.tracktrek.desktop /app/share/applications/com.alex.tracktrek.desktop
      - install -Dm644 com.alex.tracktrek.png /app/share/icons/hicolor/64x64/apps/com.alex.tracktrek.png
    sources:
      - type: archive
        url: https://github.com/Alleexx129/TrackTrek-CS/releases/download/v2.1.0-alpha1/TrackTrekLinux.tar.gz
        sha256: 9889529d4b63f080c22f6d95e3ad59b521d3d829a97fa98e116689568e428788
        strip-components: 2
      - type: file
        path: com.alex.tracktrek.desktop
      - type: file
        path: com.alex.tracktrek.png
