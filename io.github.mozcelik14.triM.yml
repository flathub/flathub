app-id: io.github.mozcelik14.triM
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: trim

finish-args:
  # Display & Windowing
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  # Hardware Acceleration (GPU rendering & video encoding/decoding)
  - --device=dri
  # Audio Playback & Capture
  - --socket=pulseaudio
  # Desktop Integration & Notifications
  - --talk-name=org.freedesktop.Notifications
  # Filesystem permissions to access media files
  - --filesystem=xdg-videos
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures
  - --filesystem=xdg-music

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/trim/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: trim
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked -p trim-app
      - install -Dm755 target/release/trim /app/bin/trim
      - install -Dm644 io.github.mozcelik14.triM.desktop /app/share/applications/io.github.mozcelik14.triM.desktop
      - install -Dm644 io.github.mozcelik14.triM.metainfo.xml /app/share/metainfo/io.github.mozcelik14.triM.metainfo.xml
      - install -Dm644 io.github.mozcelik14.triM.svg /app/share/icons/hicolor/scalable/apps/io.github.mozcelik14.triM.svg
      - install -Dm644 io.github.mozcelik14.triM.png /app/share/icons/hicolor/512x512/apps/io.github.mozcelik14.triM.png
    sources:
      - type: git
        url: https://github.com/MOzcelik14/triM.git
        tag: v1.0.0
        commit: 59afdb773dc9dcee3c58d91c0d7d5ab0908bdfb4
      - cargo-sources.json
      - type: file
        path: io.github.mozcelik14.triM.metainfo.xml
