app-id: ua.pp.khvylyna.MinuteOfSilence
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: MinuteOfSilence
finish-args:
  # Graphical access
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=ipc
  # Network (ONLY for NTP sync at runtime)
  - --share=network
  # Audio (Pulseaudio/Pipewire)
  - --socket=pulseaudio
  # MPRIS (Control other media players)
  - --talk-name=org.mpris.MediaPlayer2.*
  # Notifications
  - --talk-name=org.freedesktop.Notifications
  # System Settings
  - --metadata=X-DConf=comm/org/gnome/
  # Allow system tray icons
  - --talk-name=org.kde.StatusNotifierWatcher
  # Allow autostart
  - --filesystem=~/.config/autostart:create
  # Allow Tauri to create temporary tray icon files
  - --filesystem=xdg-run/tray-icon:create

build-options:
  env:
    # Cargo offline build setup
    CARGO_HOME: /run/build/minute-of-silence/cargo

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: minute-of-silence
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node20/bin:/usr/lib/sdk/rust-stable/bin
    build-commands:
      # Use Rust and Node.js extensions
      - /usr/lib/sdk/node20/enable.sh
      - /usr/lib/sdk/rust-stable/enable.sh

      # 1. Setup Rust dependencies offline using cargo-sources.json
      - mkdir -p src-tauri/.cargo
      - |
        cat > src-tauri/.cargo/config.toml <<EOC
        [source.crates-io]
        replace-with = "vendored-sources"

        [source.vendored-sources]
        directory = "/run/build/minute-of-silence/cargo/vendor"
        EOC

      # 2. Setup Node.js dependencies offline using node-sources.json
      - npm ci --offline

      # 3. Build the application (binary only)
      - npm run tauri build -- --no-bundle

      # Install binary
      - install -Dm755 src-tauri/target/release/MinuteOfSilence /app/bin/MinuteOfSilence

      # Install audio resources
      - install -Dm644 src-tauri/audio/*.ogg -t /app/share/ua.pp.khvylyna.MinuteOfSilence/audio/

      # Install metadata
      - install -Dm644 ua.pp.khvylyna.MinuteOfSilence.desktop -t /app/share/applications/
      - install -Dm644 ua.pp.khvylyna.MinuteOfSilence.metainfo.xml -t /app/share/metainfo/

      # Install icons (must match App ID to be exported correctly)
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/ua.pp.khvylyna.MinuteOfSilence.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/ua.pp.khvylyna.MinuteOfSilence.png
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/ua.pp.khvylyna.MinuteOfSilence.png
    sources:
      - type: git
        url: https://github.com/ChernegaSergiy/minute-of-silence.git
        tag: v0.7.8
      - cargo-sources.json
      - node-sources.json
      - type: file
        path: cargo-sources.json
      - type: file
        path: node-sources.json
