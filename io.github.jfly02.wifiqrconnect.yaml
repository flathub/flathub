app-id: io.github.jfly02.wifiqrconnect
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: wifi-qr-connect
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --system-talk-name=org.freedesktop.NetworkManager
modules:
  - name: libqrencode
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SHARED_LIBS=ON
      - -DWITH_TOOLS=OFF
      - -DWITH_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/fukuchi/libqrencode/archive/refs/tags/v4.1.1.tar.gz
        sha256: 5385bc1b8c2f20f3b91d258bf8ccc8cf62023935df2d2676b5b67049f31a049c

  - name: zbar
    buildsystem: simple
    build-commands:
      - autoreconf -vfi
      - >-
        ./configure --prefix=/app --without-gtk --without-qt
        --without-python --without-imagemagick --without-jpeg --without-dbus
        --disable-doc
      - make -j$FLATPAK_BUILDER_N_JOBS
      - make install
    sources:
      - type: archive
        url: https://github.com/mchehab/zbar/archive/refs/tags/0.23.93.tar.gz
        sha256: 212dfab527894b8bcbcc7cd1d43d63f5604a07473d31a5f02889e372614ebe28

  - name: wifi-qr-connect
    buildsystem: simple
    build-commands:
      - make install PREFIX=/app
    sources:
      - type: git
        url: https://github.com/JFly02/WifiQrConnect.git
        commit: 11acd8f0942a1cc9c89ef64da161a28ddd364f8b
        tag: v0.1.2
