app-id: io.github.dialga_cmd.LucidGrasp
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
sdk-version: '6.7'
command: LucidGrasp
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --filesystem=xdg-config/LucidGrasp:create

modules:
  - name: opencv
    buildsystem: simple
    build-commands:
      - cmake -B build -S . -DCMAKE_INSTALL_PREFIX=/app -DBUILD_LIST=core,imgproc,imgcodecs,features2d -DBUILD_opencv_python2=OFF -DBUILD_opencv_python3=OFF -DBUILD_opencv_java=OFF -DBUILD_opencv_apps=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF
      - cmake --build build --target install
    sources:
      - type: archive
        url: https://github.com/opencv/opencv/archive/refs/tags/4.10.0.zip
        sha256: 3810bca2b1d1c572912df0ac3888126341f3762dfd28e91068c805fb656d0e51

  - name: lucidgrasp
    buildsystem: cmake
    config-opts:
      - -DCMAKE_PREFIX_PATH=/app
    sources:
      - type: git
        url: https://github.com/dialga-cmd/LucidGrasp.git
        branch: main
