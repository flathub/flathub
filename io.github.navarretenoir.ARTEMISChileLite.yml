# ARTEMIS Chile Lite — manifiesto Flathub (compila desde el código). Desarrollada por Javiera Navarrete.
app-id: io.github.navarretenoir.ARTEMISChileLite
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: artemis-lite
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: artemis-lite
    buildsystem: simple
    build-commands:
      - make -C desktop UI_DIR=/app/share/artemis-chile-lite/ui
      - install -Dm755 desktop/artemis-lite /app/bin/artemis-lite
      - install -d /app/share/artemis-chile-lite/ui && cp -r app/. /app/share/artemis-chile-lite/ui/ && rm -f /app/share/artemis-chile-lite/ui/*.bak*
      - install -Dm644 linux/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 linux/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 linux/${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: git
        url: https://github.com/navarretenoir/artemischilelite.git
        tag: v1.0
        commit: 3f1596d48d2f8333ef9019f69ed43ebb819f805b
