app-id: org.selfresearch.OntoCode
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '23.08'
command: ontocode-desktop

# Mirrors the finish-args already validated for the self-distributed
# electron-builder flatpak target (electron-app/electron-builder.yml).
# --filesystem=home is required because the editor opens/saves ontology
# files anywhere in the user's home directory, not a fixed project folder.
# --share=network is required for the bundled local Fuseki/MongoDB backend.
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home

modules:
  - name: ontocode-desktop
    buildsystem: simple
    build-commands:
      - mkdir -p /app/ontocode-desktop
      - cp -r ./* /app/ontocode-desktop/
      - chmod +x /app/ontocode-desktop/ontocode-desktop
      - install -Dm755 ontocode-desktop-wrapper.sh /app/bin/ontocode-desktop
      - install -Dm644 org.selfresearch.OntoCode.desktop /app/share/applications/org.selfresearch.OntoCode.desktop
      - install -Dm644 org.selfresearch.OntoCode.metainfo.xml /app/share/metainfo/org.selfresearch.OntoCode.metainfo.xml
      - install -Dm644 org.selfresearch.OntoCode.png /app/share/icons/hicolor/512x512/apps/org.selfresearch.OntoCode.png
    sources:
      # Tarball of electron-builder's `linux-unpacked` output (built via the
      # full EC2 pipeline with bundled JRE/Mongo/Fuseki, not the thin plain
      # `electron-builder --linux` GitHub Actions workflow). Pinned to a
      # GitHub Release asset — cannot point at /api/downloads/linux-deb
      # since that endpoint is overwritten on every upload. Verified live
      # and confirmed matching sha256 via local flatpak-builder test build.
      - type: archive
        url: https://github.com/The-Self-Research-Institute/ontocode/releases/download/desktop-v1.1.0-beta.19/ontocode-desktop-linux-x64-v1.1.0-beta.19.tar.gz
        sha256: 6d79c2a533f1e3f8a3d5c55463a2348ca3c0bb16b1505e9b859164645d6f1fbf
        strip-components: 1
      - type: file
        path: org.selfresearch.OntoCode.desktop
      - type: file
        path: org.selfresearch.OntoCode.metainfo.xml
      - type: file
        path: org.selfresearch.OntoCode.png
      - type: file
        path: ontocode-desktop-wrapper.sh
