id: com.github.amanrakesh309.Cliplin
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: cliplin

finish-args:
  - --socket=x11
  - --socket=fallback-x11
  - --share=ipc
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-config/cliplin:create

modules:

  - name: xmu
    sources:
      - type: archive
        url: https://xorg.freedesktop.org/archive/individual/lib/libXmu-1.1.3.tar.bz2
        sha256: 9c343225e7c3dc0904f2122b562278da5fed639b1b5e880d25111561bac5b731

  - name: xclip
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/astrand/xclip/archive/0.13.tar.gz
        sha256: ca5b8804e3c910a66423a882d79bf3c9450b875ac8528791fb60ec9de667f758

  - python-deps.json

  - name: cliplin
    buildsystem: simple
    build-commands:
      - install -Dm755 main.py /app/bin/cliplin-main.py
      - install -Dm644 history.py /app/lib/cliplin/history.py
      - install -Dm644 watcher.py /app/lib/cliplin/watcher.py
      - install -Dm644 tray.py /app/lib/cliplin/tray.py
      - install -Dm755 cliplin-launcher.sh /app/bin/cliplin
      - install -Dm644 com.github.amanrakesh309.Cliplin.desktop /app/share/applications/com.github.amanrakesh309.Cliplin.desktop
      - install -Dm644 com.github.amanrakesh309.Cliplin.metainfo.xml /app/share/metainfo/com.github.amanrakesh309.Cliplin.metainfo.xml
      - install -Dm644 resources/paper-clip.png /app/share/icons/hicolor/128x128/apps/com.github.amanrakesh309.Cliplin.png
      
    sources:
      - type: git
        url: https://github.com/amanrakesh309/cliplin.git
        commit: f2f0f7badd8aa853736d04f1fa6059fcf70f5c5b
