app-id: io.github.phase1geo.outliner
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
base: io.elementary.BaseApp
base-version: tanit-26.08
command: io.github.phase1geo.outliner
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:

  - name: libmarkdown
    buildsystem: simple
    build-commands:
      - ./configure.sh --shared --prefix=/app --pkg-config
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - sed -e 's|/sbin/ldconfig|/sbin/ldconfig -n|' -i librarian.sh
      - make install
    sources:
      - type: archive
        url: https://github.com/Orc/discount/archive/refs/tags/v2.2.4.tar.gz
        sha256: 918905377e6ed3d0a7158cac0a4a18ed3c4cc0cad8ee95dddd82cb86ba9dd044

  - name: pandoc
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/pandoc -t /app/bin/
    sources:
      - type: archive
        url: https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-linux-amd64.tar.gz
        sha256: 74bc434908e4d858b3edbfd6271d2e9e499477837e5df1d630df4e62f113803d

  - name: outliner
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/phase1geo/Outliner.git
        tag: 2.0.1
        commit: e15b30d94af310bc9f82228f6d0fd8533b44e573
        x-checker-data:
          type: json
          url: https://api.github.com/repos/phase1geo/Outliner/releases/latest
          tag-query: .tag_name
          version-query: .tag_name
          timestamp-query: .published_at
