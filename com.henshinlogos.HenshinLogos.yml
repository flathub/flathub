app-id: com.henshinlogos.HenshinLogos
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: henshinlogos
separate-locales: false
tags:
  - proprietary
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
modules:
  - name: henshinlogos
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 henshinlogos /app/bin/henshinlogos
      - install -Dm644 com.henshinlogos.HenshinLogos.desktop /app/share/applications/com.henshinlogos.HenshinLogos.desktop
      - install -Dm644 com.henshinlogos.HenshinLogos.png /app/share/icons/hicolor/256x256/apps/com.henshinlogos.HenshinLogos.png
      - install -Dm644 com.henshinlogos.HenshinLogos.metainfo.xml /app/share/metainfo/com.henshinlogos.HenshinLogos.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/com.henshinlogos.HenshinLogos/LICENSE
    sources:
      - type: extra-data
        filename: HenshinLogos.tar.gz
        url: https://github.com/HenshinLogos/HenshinLogos_for_Linux/releases/download/v5.1-flatpak/HenshinLogos.tar.gz
        sha256: 89f4058e679c7e4cb92d54172d570273436a7b9942c7e28739775636972442c6
        size: 229326026
      - type: script
        dest-filename: apply_extra
        commands:
          - tar -xzf HenshinLogos.tar.gz
          - rm -f HenshinLogos.tar.gz
      - type: file
        path: henshinlogos
      - type: file
        path: com.henshinlogos.HenshinLogos.desktop
      - type: file
        path: com.henshinlogos.HenshinLogos.png
      - type: file
        path: com.henshinlogos.HenshinLogos.metainfo.xml
      - type: file
        path: LICENSE
