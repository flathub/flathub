app-id: io.github.hkumarsaikia.OpenDictate
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: opendictate

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm22

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  # Runtime network access is strictly required for cloud AI speech transcription
  # (Groq, OpenAI, Anthropic, Google Gemini) and on-demand Whisper GGML model downloads.
  # Build-time network access is completely disabled (fully offline via cargo-sources.json).
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher

build-options:
  append-path: /usr/lib/sdk/llvm22/bin:/usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/opendictate/cargo

modules:
  - name: alsa-lib
    config-opts:
      - --disable-static
      - --without-versioned
    post-install:
      - install -Dm644 COPYING /app/share/licenses/io.github.hkumarsaikia.OpenDictate/alsa-lib/COPYING
    sources:
      - type: archive
        url: https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.12.tar.bz2
        sha256: 4868cd908627279da5a634f468701625be8cc251d84262c7e5b6a218391ad0d2

  - name: opendictate
    buildsystem: simple
    build-options:
      env:
        LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib
        GGML_NATIVE: 'OFF'
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - install -Dm0644 cargo/config .cargo/config.toml
      - env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_RUSTFLAGS="-C target-cpu=x86-64 -C target-feature=-sse3,-ssse3,-sse4.1,-sse4.2,-avx,-avx2,-fma,-f16c,-bmi1,-bmi2,-lzcnt,-popcnt,-movbe" GGML_NATIVE=OFF GGML_SSE42=OFF GGML_AVX=OFF GGML_AVX2=OFF GGML_BMI2=OFF GGML_FMA=OFF GGML_F16C=OFF GGML_AVX_VNNI=OFF GGML_AVX512=OFF GGML_AVX512_VBMI=OFF GGML_AVX512_VNNI=OFF GGML_AVX512_BF16=OFF GGML_AMX_TILE=OFF GGML_AMX_INT8=OFF GGML_AMX_BF16=OFF cargo build --offline --release --locked --verbose --target-dir target/portable
      - env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_RUSTFLAGS="-C target-cpu=x86-64 -C target-feature=+sse3,+ssse3,+sse4.1,+sse4.2,+avx,+avx2,+fma,+f16c,+bmi2,-bmi1,-lzcnt,-popcnt,-movbe" GGML_NATIVE=OFF GGML_SSE42=ON GGML_AVX=ON GGML_AVX2=ON GGML_BMI2=ON GGML_FMA=ON GGML_F16C=ON GGML_AVX_VNNI=OFF GGML_AVX512=OFF GGML_AVX512_VBMI=OFF GGML_AVX512_VNNI=OFF GGML_AVX512_BF16=OFF GGML_AMX_TILE=OFF GGML_AMX_INT8=OFF GGML_AMX_BF16=OFF cargo build --offline --release --locked --verbose --target-dir target/avx2
      - install -Dm755 target/portable/release/opendictate /app/bin/opendictate
      - install -Dm755 target/avx2/release/opendictate /app/bin/opendictate-avx2
      - install -Dm644 LICENSE /app/share/licenses/io.github.hkumarsaikia.OpenDictate/LICENSE
      - install -Dm644 licenses/THIRD_PARTY_LICENSES.md /app/share/licenses/io.github.hkumarsaikia.OpenDictate/THIRD_PARTY_LICENSES.md
      - install -Dm644 licenses/LICENSE-MPL-2.0.txt /app/share/licenses/io.github.hkumarsaikia.OpenDictate/LICENSE-MPL-2.0.txt
      - install -Dm644 licenses/LICENSE-LGPL-2.1.txt /app/share/licenses/io.github.hkumarsaikia.OpenDictate/LICENSE-LGPL-2.1.txt
      - install -Dm644 licenses/LICENSE-Apache-2.0.txt /app/share/licenses/io.github.hkumarsaikia.OpenDictate/LICENSE-Apache-2.0.txt
      - install -Dm644 licenses/LICENSE-MIT.txt /app/share/licenses/io.github.hkumarsaikia.OpenDictate/LICENSE-MIT.txt
      - install -Dm644 data/io.github.hkumarsaikia.OpenDictate.desktop /app/share/applications/io.github.hkumarsaikia.OpenDictate.desktop
      - install -Dm644 data/io.github.hkumarsaikia.OpenDictate.metainfo.xml /app/share/metainfo/io.github.hkumarsaikia.OpenDictate.metainfo.xml
      - install -Dm644 src/ui/assets/brand/opendictate.svg /app/share/icons/hicolor/scalable/apps/io.github.hkumarsaikia.OpenDictate.svg
      - install -Dm644 src/ui/assets/brand/opendictate.svg /app/share/icons/hicolor/scalable/apps/opendictate.svg
      - install -Dm644 src/ui/assets/brand/opendictate-dark.svg /app/share/icons/hicolor/scalable/apps/opendictate-dark.svg
      - install -Dm644 src/ui/assets/brand/opendictate-light.svg /app/share/icons/hicolor/scalable/apps/opendictate-light.svg
      - install -Dm644 src/ui/assets/brand/opendictate-dark.svg /app/share/icons/hicolor/scalable/apps/io.github.hkumarsaikia.OpenDictate-dark.svg
      - install -Dm644 src/ui/assets/brand/opendictate-light.svg /app/share/icons/hicolor/scalable/apps/io.github.hkumarsaikia.OpenDictate-light.svg
      - install -Dm644 src/ui/assets/brand/png/16x16.png /app/share/icons/hicolor/16x16/apps/io.github.hkumarsaikia.OpenDictate.png
      - install -Dm644 src/ui/assets/brand/png/24x24.png /app/share/icons/hicolor/24x24/apps/io.github.hkumarsaikia.OpenDictate.png
      - install -Dm644 src/ui/assets/brand/png/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.hkumarsaikia.OpenDictate.png
      - install -Dm644 src/ui/assets/brand/png/48x48.png /app/share/icons/hicolor/48x48/apps/io.github.hkumarsaikia.OpenDictate.png
      - install -Dm644 src/ui/assets/brand/png/64x64.png /app/share/icons/hicolor/64x64/apps/io.github.hkumarsaikia.OpenDictate.png
      - install -Dm644 src/ui/assets/brand/png/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.hkumarsaikia.OpenDictate.png
      - install -Dm644 src/ui/assets/brand/png/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.hkumarsaikia.OpenDictate-dark.png
      - install -Dm644 src/ui/assets/brand/png-light/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.hkumarsaikia.OpenDictate-light.png
      - install -Dm644 src/ui/assets/brand/png/128x128.png /app/share/icons/hicolor/128x128/apps/opendictate-dark.png
      - install -Dm644 src/ui/assets/brand/png-light/128x128.png /app/share/icons/hicolor/128x128/apps/opendictate-light.png
      - install -Dm644 src/ui/assets/brand/png/256x256.png /app/share/icons/hicolor/256x256/apps/io.github.hkumarsaikia.OpenDictate.png
      - install -Dm644 src/ui/assets/brand/png/512x512.png /app/share/icons/hicolor/512x512/apps/io.github.hkumarsaikia.OpenDictate.png
      - install -Dm644 src/ui/assets/brand/png/512x512.png /app/share/icons/hicolor/512x512/apps/io.github.hkumarsaikia.OpenDictate-dark.png
      - install -Dm644 src/ui/assets/brand/png-light/512x512.png /app/share/icons/hicolor/512x512/apps/io.github.hkumarsaikia.OpenDictate-light.png
      - install -Dm644 src/ui/assets/brand/png/512x512.png /app/share/icons/hicolor/512x512/apps/opendictate-dark.png
      - install -Dm644 src/ui/assets/brand/png-light/512x512.png /app/share/icons/hicolor/512x512/apps/opendictate-light.png
    sources:
      - type: git
        url: https://github.com/hkumarsaikia/OpenDictate.git
        tag: v2.0.3
        commit: 06a4da3b9f3f16e24c138d9d9a2f8f71377bf424
      - cargo-sources.json
