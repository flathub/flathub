app-id: io.pslab.PSLab
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: pslab

rename-desktop-file: pslab.desktop
rename-icon: pslab

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-documents
  - --device=all
  - --share=network
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.UDisks2
  - --talk-name=org.bluez
  - --system-talk-name=org.freedesktop.NetworkManager

modules:
  - name: pslab
    buildsystem: simple
    build-commands:
      - bsdtar -xf pslab-bin.rpm
      
      - mkdir -p /app/bin /app/lib /app/share /app/bin/data
      
      - cp -rv usr/bin/pslab /app/bin/
      - cp -rv usr/lib/pslab /app/lib/
      
      - find . -name "icudtl.dat" -exec cp -v {} /app/bin/data/ \;
      - find . -type d -name "flutter_assets" -exec cp -rv {} /app/bin/data/ \;
      
      - ln -s /app/lib/pslab /app/bin/lib
      
      - find /app/lib/pslab/ -name "*.so" -exec ln -s {} /app/lib/ \;
      
      - cp -rv usr/share/* /app/share/
      - chmod +x /app/bin/pslab
      
      - install -Dm644 io.pslab.PSLab.metainfo.xml /app/share/metainfo/io.pslab.PSLab.metainfo.xml

    sources:
      - type: file
        url: https://github.com/fossasia/pslab-app/raw/app/pslab-4.17.68-1.x86_64.rpm
        sha256: "54ff01919a583db413ace8a0669b372add2804b3b3cac6f7446fd4f76f366763"
        dest-filename: pslab-bin.rpm
        only-arches:
          - x86_64

      - type: file
        url: https://github.com/fossasia/pslab-app/raw/app/pslab-4.17.68-1.aarch64.rpm
        sha256: "8e644409f4a730c54662304fbe3b962a6c702c0fa40c8fe96e8d29fe902e2b97"
        dest-filename: pslab-bin.rpm
        only-arches:
          - aarch64

      - type: file
        path: io.pslab.PSLab.metainfo.xml