app-id: com.softwalktechnologies.oaplayer
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: oa-player-wrapper
separate-locales: false

tags:
  - proprietary

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: oa-player
    buildsystem: simple
    build-commands:
      - ar x oa-player.deb
      - tar xf data.tar.xz
      - cp -r usr/* /app/
      - cp -r opt /app/
      - mkdir -p /app/opt/oa-player
      - cp -r usr/opt/OA\ Player/* /app/opt/oa-player/
      - ln -s /app/opt/oa-player/oa-player /app/bin/oa-player
      - echo '#!/bin/sh' > /app/bin/oa-player-wrapper
      - echo 'exec /app/opt/oa-player/oa-player --no-sandbox "$@"' >> /app/bin/oa-player-wrapper
      - chmod +x /app/bin/oa-player-wrapper
      - mkdir -p /app/share/icons/hicolor/512x512/apps
      - install -Dm644 com.softwalktechnologies.oaplayer.png /app/share/icons/hicolor/512x512/apps/com.softwalktechnologies.oaplayer.png
      - install -Dm644 com.softwalktechnologies.oaplayer.desktop /app/share/applications/com.softwalktechnologies.oaplayer.desktop
      - install -Dm644 com.softwalktechnologies.oaplayer.metainfo.xml /app/share/metainfo/com.softwalktechnologies.oaplayer.metainfo.xml
    sources:
      - type: file
        url: https://github.com/deenbee/oa-player-flatpak/releases/download/audio/oa-player_0.5.9_amd64.deb
        sha256: 8c2933b1e0e9e588a54dc75f05da88cbd7bc5230711baf988c304cc060c91241
        arch: x86_64
        dest-filename: oa-player.deb
      - type: file
        url: https://github.com/deenbee/oa-player-flatpak/releases/download/audio/oa-player_0.5.9_arm64.deb
        sha256: cf983ed2db594d704f55bc25bf3a66e84738329113a43c42eea2aa9997737c92
        arch: aarch64
        dest-filename: oa-player.deb
      - type: file
        url: https://raw.githubusercontent.com/deenbee/oa-player-flatpak/main/com.softwalktechnologies.oaplayer.png
        sha256: b0609e5b4e9296c3bf7ba32bc128170d8cea7c9f78ae08663f7aeb087b1d28f0
        dest-filename: com.softwalktechnologies.oaplayer.png
      - type: file
        url: https://raw.githubusercontent.com/deenbee/oa-player-flatpak/main/com.softwalktechnologies.oaplayer.desktop
        sha256: fcc77a92231713cb688e79e21e062b7a4b355d1b690e00e9acceb1e5e2d0aadb
        dest-filename: com.softwalktechnologies.oaplayer.desktop
      - type: file
        url: https://raw.githubusercontent.com/deenbee/oa-player-flatpak/main/com.softwalktechnologies.oaplayer.metainfo.xml
        sha256: c7a75d07f175d301cb805aaa6e8bc6ace3b29b177d8c08f88450c4b2eb3d7aa8
