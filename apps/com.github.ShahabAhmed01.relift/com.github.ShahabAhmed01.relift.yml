# TEMPLATE ONLY. Validate runtime version, permissions, and source build before submission.

app-id: com.github.ShahabAhmed01.relift
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: relift
finish-args:
  - --device=all
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.portal.Desktop
build-options:
  env:
    CARGO_HOME: /run/build/relift/cargo
    RUSTUP_HOME: /run/build/relift/rustup
modules:
  - name: relift
    buildsystem: simple
    build-commands:
      - cargo build --release --workspace -p relift-cli --locked
      - install -Dm755 target/release/relift /app/bin/relift
      - install -Dm644 LICENSE /app/share/licenses/relift/LICENSE
      - install -Dm644 README.md /app/share/doc/relift/README.md
      - install -Dm644 crates/relift-gui/src-tauri/icons/icon.svg /app/share/icons/hicolor/scalable/apps/com.github.ShahabAhmed01.relift.svg
    sources:
      - type: git
        url: https://github.com/ShahabAhmed01/relift.git
        tag: v1.0.0
    build-options:
      env:
        CARGO_HOME: /run/build/relift/cargo
        RUSTUP_HOME: /run/build/relift/rustup
