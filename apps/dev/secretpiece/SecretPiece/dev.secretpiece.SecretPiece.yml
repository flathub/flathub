app-id: dev.secretpiece.SecretPiece
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: sp
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Vaults live on USB sticks, external disks and network mounts.
  - --filesystem=host
  - --filesystem=/run/media
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/secretpiece/cargo

modules:
  - name: secretpiece
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - cargo build --release --locked -p sp-gui -p sp-cli
      - install -Dm755 target/release/sp /app/bin/sp
      - install -Dm755 target/release/secretpiece /app/bin/secretpiece
      - install -Dm755 target/release/sp-cli /app/bin/sp-cli
      - install -Dm644 packaging/flatpak/dev.secretpiece.SecretPiece.desktop
        /app/share/applications/dev.secretpiece.SecretPiece.desktop
      - install -Dm644 packaging/flathub/dev.secretpiece.SecretPiece.metainfo.xml
        /app/share/metainfo/dev.secretpiece.SecretPiece.metainfo.xml
      - install -Dm644 packaging/icons/dev.secretpiece.SecretPiece.png
        /app/share/icons/hicolor/512x512/apps/dev.secretpiece.SecretPiece.png
    sources:
      - type: archive
        url: https://github.com/AmazingCoderA/secretpiece/archive/refs/tags/v1.19.tar.gz
        sha256: e6fddb9ae42e66fc85ffcebe3cbd09f3cedd143e9cd0f55ff77aa7f916b9067b
        strip-components: 1
