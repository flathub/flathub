apps/com.github.henriquegouveia85.AccuChekReader/com.github.henriquegouveia85.AccuChekReader.yaml
app-id: com.github.henriquegouveia85.AccuChekReader
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: python3 -m src.app_gui
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --device=all
  - --filesystem=home
modules:
  - name: accuchek
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/henriquegouveia85/accu-chek-active-linux.git
        tag: v1.0.0
    build-commands:
      - install -D src/app_gui.py ${FLATPAK_DEST}/opt/accuchek/src/app_gui.py
      - cp -r src ${FLATPAK_DEST}/opt/accuchek/
    build-options:
      env:
        PYTHONPATH: /opt/accuchek
apps/com.github.henriquegouveia85.AccuChekReader/com.github.henriquegouveia85.AccuChekReader.desktop
[Desktop Entry]
Name=Accu-Chek Reader
Comment=Leitor de glicemia Roche Accu-Chek Active
Exec=python3 -m src.app_gui
Icon=com.github.henriquegouveia85.AccuChekReader
Type=Application
Categories=Science;Medical;
Crie os arquivos, depois:
git add apps/com.github.henriquegouveia85.AccuChekReader
git commit -m "Add Accu-Chek Reader"
git push origin main
