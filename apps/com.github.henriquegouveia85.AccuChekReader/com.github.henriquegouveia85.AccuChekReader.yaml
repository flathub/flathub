app-id: com.github.henriquegouveia85.AccuChekReader
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: python3 /opt/accuchek/src/app_gui.py
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --device=all
  - --filesystem=home
modules:
  - name: accuchek
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/henriquegouveia85/accu-chek-active-linux.git
        tag: v1.0.0
    build-commands:
      - install -D ${FLATPAK_BUILDER_BUILDDIR}/src/app_gui.py ${FLATPAK_DEST}/opt/accuchek/src/app_gui.py
      - cp -r ${FLATPAK_BUILDER_BUILDDIR}/src ${FLATPAK_DEST}/opt/accuchek/
    build-options:
      env:
        PYTHONPATH: /opt/accuchek
