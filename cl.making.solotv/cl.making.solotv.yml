app-id: cl.making.solotv
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '23.08'
command: solotv
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: solotv
    buildsystem: simple
    build-options:
      env:
        npm_config_offline: 'true'
        npm_config_cache: /run/build/solotv/flatpak-node/npm-cache
    build-commands:
      - npm install --offline --ignore-scripts
      - install -Dm755 solotv.sh /app/bin/solotv
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/cl.making.solotv.png
      - install -Dm644 cl.making.solotv.desktop /app/share/applications/cl.making.solotv.desktop
      - install -Dm644 cl.making.solotv.metainfo.xml /app/share/metainfo/cl.making.solotv.metainfo.xml
      - cp -r . /app/solotv
    sources:
      - type: git
        url: https://github.com/MAKING-LTD/solotv-electron.git
        commit: 1249216d72fea5a2a6e31d3d3d68608177510497
      - generated-sources.json
      - type: script
        dest-filename: solotv.sh
        commands:
          - zypak-wrapper /app/solotv/node_modules/.bin/electron /app/solotv
      - type: file
        path: cl.making.solotv.desktop
      - type: file
        path: cl.making.solotv.metainfo.xml
