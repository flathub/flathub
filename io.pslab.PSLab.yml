id: io.pslab.PSLab
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: pslab
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
rename-desktop-file: pslab.desktop
rename-icon: pslab
modules:
  - name: PSLab
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm20/bin:/var/lib/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        PUB_CACHE: /run/build/PSLab/.pub-cache
    build-commands:
      - echo "--- WHERE I AM? ---"
      - pwd

      - find . -name "io.pslab.PSLab.metainfo.xml"
      
      - setup-flutter.sh
      - flutter build linux --release --no-pub
      - install -D $BUNDLE_PATH/pslab /app/bin/pslab
      - cp -r $BUNDLE_PATH/lib /app/bin/lib
      - cp -r $BUNDLE_PATH/data /app/bin/data
    sources:
      - type: git
        url: https://github.com/fossasia/pslab-app.git
        commit: 467e57bc92e0c4fb7d931323c84eee20d9640ba4
      - generated/sources/pubspec.json
    modules:
      - generated/modules/flutter-sdk-3.44.1.json
