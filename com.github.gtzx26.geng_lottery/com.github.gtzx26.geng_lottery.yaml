id: com.github.gtzx26.geng_lottery
runtime: org.gnome.Platform
runtime-version: '46'  # ✨ ขยับมาใช้ GNOME 46 เพื่อแก้ปัญหาแจ้งเตือนหมดอายุ (End-of-Life) ค่ะ
sdk: org.gnome.Sdk
command: geng_lottery
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --filesystem=home

modules:
  - name: geng_lottery
    buildsystem: simple
    build-commands:
      # 1. คอมไพล์ซอร์สโค้ดให้ออกมาเป็นไฟล์ชื่อ geng_lottery ไว้ในโฟลเดอร์ปัจจุบันก่อน (ไม่ยิงตรงไป /app/bin ละนะ)
      - gcc geng_lottery.c -o geng_lottery $(pkg-config --cflags --libs gtk+-3.0) -lcurl
      # 2. ใช้คำสั่ง install แบบพิเศษ (-Dm755) ตัวนี้จะช่วยสร้างโฟลเดอร์ /app/bin ให้เราอัตโนมัติแล้วคัดลอกไฟล์เข้าไปเก็บค่ะ
      - install -Dm755 geng_lottery /app/bin/geng_lottery
      # 3. ติดตั้งไฟล์ทางลัดเข้าสู่ระบบเมนู
      - install -Dm644 com.github.gtzx26.geng_lottery.desktop /app/share/applications/com.github.gtzx26.geng_lottery.desktop
      # 4. ติดตั้งรูปไอคอนแอป
      - install -Dm644 icon-lottery.png /app/share/icons/hicolor/256x256/apps/com.github.gtzx26.geng_lottery.png
    sources:
      - type: dir
        path: .
build-commands:
      - gcc geng_lottery.c -o geng_lottery $(pkg-config --cflags --libs gtk+-3.0) -lcurl
      - install -Dm755 geng_lottery /app/bin/geng_lottery
      - install -Dm644 com.github.gtzx26.geng_lottery.desktop /app/share/applications/com.github.gtzx26.geng_lottery.desktop
      - install -Dm644 icon-lottery.png /app/share/icons/hicolor/256x256/apps/com.github.gtzx26.geng_lottery.png
      # ✨ เพิ่มบรรทัดนี้เข้าไป เพื่อติดตั้งไฟล์ข้อมูลหน้าร้านค้าค่ะ:
      - install -Dm644 com.github.gtzx26.geng_lottery.metainfo.xml /app/share/metainfo/com.github.gtzx26.geng_lottery.metainfo.xml
