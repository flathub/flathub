app-id: io.github.CsoundQt.CsoundQt
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
command: CsoundQt-d-cs7
cleanup-commands:
  - /app/cleanup-BaseApp.sh

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network    # OSC networking needed
  - --device=all       # MIDI/audio devices 
  - --filesystem=xdg-run/pipewire-0
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --env=NO_AT_BRIDGE=1
  - --env=LD_LIBRARY_PATH=/app/lib
  - --env=AT_SPI_BUS_ADDRESS=disabled
  
modules:
  - name: liblo
    buildsystem: autotools
    license-files:
      - COPYING
    config-opts:
      - --enable-static
      - --disable-shared
      - --disable-examples
      - --disable-tools
      - --disable-doc
    build-options:
      cflags: -fPIC -O2
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.a
    sources:
      - type: archive
        url: https://github.com/radarsat1/liblo/releases/download/0.35/liblo-0.35.tar.gz
        sha256: 9acc4f7e5a24f33472e9acd7e409b7bd6810a46f0a1f3cfeecea22d60f3aae13
        
  - name: csound
    buildsystem: cmake-ninja
    license-files:
      - COPYING
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5    
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_PREFIX_PATH=/app
      - -DCMAKE_EXE_LINKER_FLAGS=-static-libgcc -static-libstdc++
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_PLUGINS=ON
      - -DUSE_LIBLO=ON
      - -DUSE_ALSA=ON
      - -DUSE_PORTMIDI=ON
      - -DUSE_PORTAUDIO=OFF
      - -DUSE_PULSEAUDIO=OFF
      - -DUSE_PIPEWIRE=OFF
      - -DBUILD_OSC_OPCODES=ON
      - -DUSE_FLTK=OFF
      - -DBUILD_VIRTUAL_KEYBOARD=OFF
      - -DBUILD_JAVA_INTERFACE=OFF
      - -DBUILD_PYTHON_INTERFACE=OFF
      - -DINSTALL_PYTHON_INTERFACE=OFF
      - -DBUILD_LUA_INTERFACE=OFF
      - -DBUILD_CSBEATS=OFF
      - -DBUILD_STATIC_LIBRARY=OFF
      - -DBUILD_TESTS=OFF
      - -DBUILD_INSTALLER=OFF
      - -DBUILD_UTILITIES=OFF
      - -DUSE_JACK=ON
      # - -DCMAKE_SHARED_LINKER_FLAGS=-static-libgcc -static-libstdc++
      # - -DUSE_JACK=ON
            
    sources:
      - type: git
        url: https://github.com/csound/csound
        # branch: develop
        disable-shallow-clone: true
        commit: 75537cb944a925bd1545a39e84f2e269fda8c1b6

  # External Csound plugins (https://github.com/csound-plugins/csound-plugins)
  # Built against the csound installed above (headers in /app/include/csound),
  # so the bundled csound submodule is not needed. Only the jsusfx submodule
  # (used by the jsfx plugin) is fetched, as a separate source below.
  # -DPORTABLE=ON avoids the php-cli + nasm generated assembly in jsusfx.
  - name: csound-plugins
    license-files:
      - LICENSE
    buildsystem: simple
    build-commands:
      - cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=/app
          -DAPIVERSION=7.0
          -DPORTABLE=ON
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_C_FLAGS=-I/app/include/csound
          -DCMAKE_CXX_FLAGS=-I/app/include/csound
      - cmake --build build --parallel
      # PLUGIN_INSTALL_DIR is hardcoded in the repo to $HOME/.local/... and
      # cannot be overridden from the command line, but all plugin libraries
      # are written flat into the build dir, so install them manually next to
      # csound's own plugins.
      - install -Dm755 build/*.so -t /app/lib/csound/plugins64-7.0/
      - install -Dm644 src/jsfx/jsusfx/LICENSE \
          /app/share/licenses/$FLATPAK_ID/csound-plugins/jsusfx-LICENSE
    # deferred from the libsndfile module (sndmeta needs sndfile.h/libsndfile.a)
    cleanup:
      - /include
      - /lib/*.a
    sources:
      - type: git
        url: https://github.com/csound-plugins/csound-plugins
        commit: e4e6145c03380521c9f29634976eac2af20705ed
        disable-submodules: true
      - type: git
        url: https://github.com/asb2m10/jsusfx
        commit: bcc9cd7b910ee7bba5b4cd2649448ade2ec15712
        dest: src/jsfx/jsusfx

  
  - name: CsoundQt
    buildsystem: simple
    license-files:
      - COPYING
    sources:
      - type: git
        url: https://github.com/CsoundQt/CsoundQt.git
        commit: 810a7c4bf87649e497398fb2de20baa485a0adcd
        
    build-commands:
      - which qmake
      - qmake --version  
      # - git submodule update --init --recursive
      - export QMAKEPATH=/app &&
              /usr/bin/qmake CONFIG+=rtmidi CONFIG+=release CONFIG+=build64 
                DEFINES+=FLATPAK_BUILD
                qcs.pro                           
                CSOUND_API_INCLUDE_DIR=/app/include/csound
                CSOUND_LIBRARY_DIR=/app/lib
                INSTALL_DIR=/app
                SHARE_DIR=/app/share
      - make -j$(nproc)
      - make install 
      - install -Dm644 flatpak/io.github.CsoundQt.CsoundQt.metainfo.xml \
              /app/share/metainfo/io.github.CsoundQt.CsoundQt.metainfo.xml
      - install -Dm644 flatpak/csoundqt.png /app/share/icons/hicolor/256x256/apps/io.github.CsoundQt.CsoundQt.png
      - install io.github.CsoundQt.CsoundQt.desktop /app/share/applications/io.github.CsoundQt.CsoundQt.desktop

  # Offline Csound manual, installed to /app/share/manual.
  - name: csound-manual
    buildsystem: simple
    build-commands:
      - rm -rf extracted
      - mkdir extracted
      - unzip -q csound7-manual-offline.zip -d extracted
      - find extracted -maxdepth 3 -type f | head -50
      - mkdir -p /app/share/manual
      - cp -a extracted/csound7-manual-offline/. /app/share/manual/
      - find /app/share/manual -maxdepth 3 -type f | head -50
      - install -Dm644 COPYING \
                /app/share/licenses/$FLATPAK_ID/csound-manual/COPYING

    sources:
      - type: file
        url: https://github.com/csound/manual/releases/download/latest/csound7-manual-offline.zip
        sha256: a1eb732942a651635ae838e142f339cde5c3822e33236ffea7c9afca613e932d
        dest-filename: csound7-manual-offline.zip
        x-checker-data:
          type: html
          url: https://github.com/csound/manual/releases/tag/latest
          pattern: 'csound7-manual-offline\.zip'

      - type: file
        url: https://github.com/csound/csound/raw/75537cb944a925bd1545a39e84f2e269fda8c1b6/COPYING
        sha256: 277175daefabde6cff3f6dd8ad7a21a2a346b29d3a7d3762367e4354da2ed77d
        dest-filename: COPYING

      
