  - name: CsoundQt
    buildsystem: simple
    license-files:
      - COPYING
    sources:
      - type: git
        url: https://github.com/CsoundQt/CsoundQt.git
        commit: 810a7c4bf87649e497398fb2de20baa485a0adcd
        
    build-commands:
      - which qmake
      - qmake --version  
      # - git submodule update --init --recursive
      - export QMAKEPATH=/app &&
              /usr/bin/qmake6 CONFIG+=rtmidi CONFIG+=release CONFIG+=build64 
                DEFINES+=FLATPAK_BUILD
                qcs.pro                           
                CSOUND_API_INCLUDE_DIR=/app/include/csound
                CSOUND_LIBRARY_DIR=/app/lib
                INSTALL_DIR=/app
                SHARE_DIR=/app/share
      - make -j$(nproc)
      - make install 
      - install -Dm644 flatpak/io.github.CsoundQt.CsoundQt.metainfo.xml \
              /app/share/metainfo/io.github.CsoundQt.CsoundQt.metainfo.xml
      - install -Dm644 flatpak/csoundqt.png /app/share/icons/hicolor/256x256/apps/io.github.CsoundQt.CsoundQt.png
      - install io.github.CsoundQt.CsoundQt.desktop /app/share/applications/io.github.CsoundQt.CsoundQt.desktop

  # Offline Csound manual, installed to /app/share/manual.
  - name: csound-manual
    buildsystem: simple
    build-commands:
      - rm -rf extracted
      - mkdir extracted
      - unzip -q csound7-manual-offline.zip -d extracted
      - echo "=== Manual archive contents ==="
      - find extracted -maxdepth 3 -type f | head -50
      - echo "=== Installing manual ==="
      - mkdir -p /app/share/manual
      - cp -a extracted/csound7-manual-offline/. /app/share/manual/
      - echo "=== Installed manual ==="
      - find /app/share/manual -maxdepth 3 -type f | head -50
      - install -Dm644 COPYING \
                /app/share/licenses/$FLATPAK_ID/csound-manual/COPYING

    sources:
      - type: file
        url: https://github.com/csound/manual/releases/download/latest/csound7-manual-offline.zip
        sha256: a1eb732942a651635ae838e142f339cde5c3822e33236ffea7c9afca613e932d
        dest-filename: csound7-manual-offline.zip
        x-checker-data:
          type: html
          url: https://github.com/csound/manual/releases/tag/latest
          pattern: 'csound7-manual-offline\.zip'

      - type: file
        url: https://github.com/csound/csound/raw/75537cb944a925bd1545a39e84f2e269fda8c1b6/COPYING
        sha256: 277175daefabde6cff3f6dd8ad7a21a2a346b29d3a7d3762367e4354da2ed77d
        dest-filename: COPYING

      
