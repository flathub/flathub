app-id: io.github.gavril_amarant.cosmic-applet-moon
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cosmic-applet-moon
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=com.system76.CosmicSettingsDaemon
  - --filesystem=xdg-config/cosmic:ro
modules:
  - name: cosmic-applet-moon
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/cosmic-applet-moon/cargo
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm0755 target/release/cosmic-applet-moon /app/bin/cosmic-applet-moon
      - install -Dm0644 assets/io.github.gavril_amarant.cosmic-applet-moon.desktop /app/share/applications/io.github.gavril_amarant.cosmic-applet-moon.desktop
      - install -Dm0644 assets/io.github.gavril_amarant.cosmic-applet-moon.metainfo.xml /app/share/metainfo/io.github.gavril_amarant.cosmic-applet-moon.metainfo.xml
      - install -Dm0644 assets/icons/app-icon-128.png /app/share/icons/hicolor/128x128/apps/io.github.gavril_amarant.cosmic-applet-moon.png
    sources:
      - type: git
        url: https://github.com/gavril-amarant/cosmic-applet-moon.git
        tag: v1.0.0
        commit: 343736231e8b84b010e5a1ba459faa6c0458ab42
      - cargo-sources.json
