id: io.github.NezarAltarouti.Aleym
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

base: org.electronjs.Electron2.BaseApp
base-version: '25.08'

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable

build-options:
  append-path: "/usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin"

command: run.sh

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup:
  - /share/web-dist

modules:
  - name: api
    buildsystem: simple
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/api/flatpak-node/cache
        npm_config_cache: /run/build/api/flatpak-node/npm-cache
        npm_config_offline: 'true'
        CARGO_HOME: /run/build/api/cargo
    build-commands:
      # Provide the frontend
      - mkdir ./web
      - ln -s /app/share/web-dist/dist ./web/
      # Build backend
      - cargo build --release --offline
      # Build electron
      - mkdir -p electron/bin
      - cp target/release/aleym_api electron/bin/
      - npm install --offline --prefix electron/
      - |
        . ./flatpak-node/electron-builder-arch-args.sh
        npm run build --prefix electron/ -- $ELECTRON_BUILDER_ARCH_ARGS  --linux --dir
      # Bundle app and dependencies
      - cp -a electron/dist/linux*unpacked /app/api
      # Install app wrapper
      - install -Dm755 -t /app/bin/ ./run.sh
      # Install AppStream metadata
      - install -Dm644 -t /app/share/metainfo/ ./electron/io.github.NezarAltarouti.Aleym.metainfo.xml
      # Install desktop file
      - desktop-file-edit --set-key=Exec --set-value=run.sh ./electron/io.github.NezarAltarouti.Aleym.desktop
      - install -Dm644 -t /app/share/applications/ ./electron/io.github.NezarAltarouti.Aleym.desktop
      # Install icon
      - install -Dm644 electron/icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.NezarAltarouti.Aleym.png
    sources:
      - ./electron-generated-sources.json
      - ./cargo-sources.json
      - type: git
        url: https://github.com/ali-al-ismail/aleym_api
        tag: v1.0.3
        commit: 0ff816cf2bb8e3b3d420d9ebf25ac3713e8ed721
        x-checker-data:
          type: git
          version-scheme: semantic
      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper /app/api/aleym "$@"
    modules:
      - name: ui
        buildsystem: simple
        build-options:
          env:
            XDG_CACHE_HOME: /run/build/ui/flatpak-node/cache
            npm_config_cache: /run/build/ui/flatpak-node/npm-cache
            npm_config_offline: 'true'
        build-commands:
          - npm install --offline
          - npm run build
          - mkdir -p /app/share/web-dist
          - mv ./dist /app/share/web-dist
        sources:
          - ./ui-generated-sources.json
          - type: git
            disable-submodules: true
            url: https://github.com/NezarAltarouti/Aleym.git
            tag: 1.0.1
            commit: 9d86ffb20bfb4f1ed5ad870397b0777c72ca4451
            x-checker-data:
              type: git
              version-scheme: semantic

