app-id: com.tercad.zwyka
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: zwyka
separate-locales: false
finish-args:
  # Java AWT renders through X11 only (XWayland on Wayland sessions).
  - --socket=x11
  - --share=ipc
  - --device=dri
  # Import / Export of data via the file dialog.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # Tray icon and reminders.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: zwyka
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - mkdir -p /app/zwyka /app/bin
      - tar -xzf zwyka_Linux.tar.gz -C /app/zwyka
      # The home folder is not writable: the data goes to ~/.var/app/com.tercad.zwyka/data.
      - |
        cat > /app/bin/zwyka <<'EOF'
        #!/bin/sh
        export ZWYKA_DATA_DIR="${XDG_DATA_HOME}"
        exec /app/zwyka/bin/zwyka "$@"
        EOF
      - chmod +x /app/bin/zwyka
      - install -Dm644 /app/zwyka/com.tercad.zwyka.svg /app/share/icons/hicolor/scalable/apps/com.tercad.zwyka.svg
      - install -Dm644 /app/zwyka/com.tercad.zwyka.desktop /app/share/applications/com.tercad.zwyka.desktop
      - install -Dm644 com.tercad.zwyka.metainfo.xml /app/share/metainfo/com.tercad.zwyka.metainfo.xml
    sources:
      - type: file
        url: https://github.com/lyskouski/app-tracker/releases/download/v0.1.1/zwyka_Linux.tar.gz
        sha256: "14de1d176fae1ef3cea53efe695616d7b5af028834b561eccc526595fb41f53b"
      - type: file
        path: com.tercad.zwyka.metainfo.xml
