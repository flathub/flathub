id: me.vavra.SteamMediaBrowser
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '23.08'
command: steam-media-browser
finish-args:
  # Display and Window Management
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  # Gamepad and Input devices
  - --device=all
  # Audio
  - --socket=pulseaudio
  # Local Filesystem Access (Allow scanning home directory for videos)
  - --filesystem=host
  # Permission to spawn VLC on the host OS
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: steam-media-browser
    buildsystem: simple
    build-commands:
      # Install project dependencies
      - npm install --production
      # Copy files to Flatpak share folder
      - mkdir -p /app/share/
      - cp -R * /app/share/
      # Install executable runner
      - install -D -m 755 -t /app/bin/ runner.sh
      - ln -sf /app/bin/runner.sh /app/bin/steam-media-browser
    sources:
      - type: dir
        path: .
