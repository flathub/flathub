app-id: io.github.nacho.teclas
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: teclas
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_NET_OFFLINE: 'true'
    CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
modules:
  - name: teclas
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/nacho/teclas.git
        commit: a021822fb59264194c49eae5d3c8e21dd28847fe
      # cargo-sources.json needs to be placed before the
      # copying, otherwise the config will just be empty
      - cargo-sources.json
      - type: shell
        commands:
          - mkdir -p .cargo
          - cp cargo/config .cargo/config.toml
