app-id: com.keepsolid.VpnUnlimited
runtime: org.kde.Platform
runtime-version: '5.15-25.08'
sdk: org.kde.Sdk
command: vpn-unlimited

finish-args:
  - --socket=x11
  - --share=ipc                 # SingleApplication: QSharedMemory + QLocalServer
  - --device=dri                # GPU for the Qt Quick scene graph
  - --device=all
  - --share=network             # login / API and the WireGuard data path
  - --talk-name=org.freedesktop.Notifications
  - --system-talk-name=org.freedesktop.NetworkManager
  - --env=QT_QPA_PLATFORM=xcb
  - --unset-env=SESSION_MANAGER

modules:
  - name: vpn-unlimited
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 vpn-unlimited.sh /app/bin/vpn-unlimited
      - install -Dm644 com.keepsolid.VpnUnlimited.desktop
          /app/share/applications/com.keepsolid.VpnUnlimited.desktop
      - install -Dm644 com.keepsolid.VpnUnlimited.metainfo.xml
          /app/share/metainfo/com.keepsolid.VpnUnlimited.metainfo.xml
      - install -Dm644 EUA.txt /app/share/licenses/com.keepsolid.VpnUnlimited/EUA.txt
      - for SZ in 16x16 24x24 32x32 48x48 64x64 72x72 96x96 128x128 256x256; do
          install -Dm644 "icons/$SZ/apps/vpn-unlimited.png"
            "/app/share/icons/hicolor/$SZ/apps/com.keepsolid.VpnUnlimited.png";
        done

    sources:
      - type: extra-data
        filename: vpn-unlimited.tar.gz
        url: https://flatpak-releases.vpnunlimited.com/vpn-unlimited-9.6.6/vpn-unlimited-9.6.6-x86_64.tar.gz
        sha256: c2465ffdc09b33c1822a093095dae0f8bb22f4a2924b5ca09e55d0580542110b
        size: 15302426

      - type: script
        dest-filename: apply_extra
        commands:
          - tar --strip-components=0 -xf vpn-unlimited.tar.gz
          - rm -f vpn-unlimited.tar.gz

      - type: script
        dest-filename: vpn-unlimited.sh
        commands:
          - export LD_LIBRARY_PATH="/app/extra/lib:${LD_LIBRARY_PATH}"
          - exec /app/extra/vpn-unlimited "$@"

      - type: file
        path: com.keepsolid.VpnUnlimited.desktop
      - type: file
        path: com.keepsolid.VpnUnlimited.metainfo.xml
      - type: file
        path: EUA.txt
      - type: dir
        path: icons
        dest: icons
