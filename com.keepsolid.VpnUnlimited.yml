app-id: com.keepsolid.VpnUnlimited
runtime: org.kde.Platform
runtime-version: '5.15-25.08'
sdk: org.kde.Sdk
command: vpn-unlimited

finish-args:
  - --socket=x11
  - --share=ipc                 # SingleApplication: QSharedMemory + QLocalServer
  - --device=all
  - --share=network             # login / API and the WireGuard data path
  - --system-talk-name=org.freedesktop.NetworkManager
  - --env=QT_QPA_PLATFORM=xcb

modules:
  - name: vpn-unlimited
    buildsystem: simple
    build-commands:
      - install -Dm755 vpn-unlimited /app/bin/vpn-unlimited
      - install -Dm644 lib/libvpnu_private_sdk.so.1.0.0 /app/lib/libvpnu_private_sdk.so.1.0.0
      - ln -sf libvpnu_private_sdk.so.1.0.0 /app/lib/libvpnu_private_sdk.so.1
      - install -Dm644 lib/libcares.so.2 /app/lib/libcares.so.2
      - install -Dm644 com.keepsolid.VpnUnlimited.desktop
          /app/share/applications/com.keepsolid.VpnUnlimited.desktop
      - install -Dm644 com.keepsolid.VpnUnlimited.metainfo.xml
          /app/share/metainfo/com.keepsolid.VpnUnlimited.metainfo.xml
      - install -Dm644 EUA.txt /app/share/licenses/com.keepsolid.VpnUnlimited/EUA.txt
      - for SZ in 16x16 24x24 32x32 48x48 64x64 72x72 96x96 128x128 256x256; do
          install -Dm644 "icons/$SZ/apps/vpn-unlimited.png"
            "/app/share/icons/hicolor/$SZ/apps/com.keepsolid.VpnUnlimited.png";
        done

    sources:
      - type: archive
        url: https://flatpak-releases.vpnunlimited.com/vpn-unlimited-9.6.6/vpn-unlimited-9.6.6-x86_64-flathub.tar.gz
        sha256: f58d0fcb3c2152868135b7b7408c4b0ebf14cc576096859b4a79b170c47349d6
        strip-components: 0
