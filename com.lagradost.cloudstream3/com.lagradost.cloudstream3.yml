app-id: com.lagradost.cloudstream3
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Platform
base: io.gitlab.android_translation_layer.BaseApp
base-version: stable
command: cloudstream.sh
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
modules:
  - name: cloudstream
    buildsystem: simple
    build-commands:
      - install -D 4.8.0.apk /app/share/CloudStream.apk
      - install -D cloudstream.sh /app/bin/cloudstream.sh
      - install -D com.lagradost.cloudstream3.desktop /app/share/applications/com.lagradost.cloudstream3.desktop
      - install -D ic_launcher-playstore.png /app/share/icons/hicolor/512x512/apps/com.lagradost.cloudstream3.png
      - install -D com.lagradost.cloudstream3.metainfo.xml /app/share/metainfo/com.lagradost.cloudstream3.metainfo.xml
    sources:
      - type: file
        url: https://github.com/recloudstream/cloudstream/releases/download/v4.8.0/4.8.0.apk
        sha256: 348c3f09551f2dda4fba25ba348928ee7b82a47ce98a6b1eae3295d4c127877c
      - type: file
        url: https://raw.githubusercontent.com/recloudstream/cloudstream/refs/heads/master/app/src/main/ic_launcher-playstore.png
        sha256: c3604d53d0151c9e830ccc0a88224da38027cddae357e71e1d27c439ab2a06c5
      - type: file
        path: cloudstream.sh
      - type: file
        path: com.lagradost.cloudstream3.desktop
      - type: file
        path: com.lagradost.cloudstream3.metainfo.xml

  - name: run-dex2oat
    buildsystem: simple
    build-options:
      append-ld-library-path: /app/lib/art:/app/lib
      arch:
        x86_64:
          env:
            arch: x86_64
        aarch64:
          env:
            arch: arm64
    build-commands:
      - mkdir -p /app/share/oat/$arch
      - dex2oat --dex-file=/app/share/CloudStream.apk --oat-file=/app/share/oat/$arch/CloudStream.odex --host
      - chmod +x /app/share/oat/$arch/CloudStream.odex
      - mv /app/share/CloudStream.apk CloudStream.apk
      - zip -d CloudStream.apk "classes*.dex"
      - mv CloudStream.apk /app/share/CloudStream.apk

  - name: remove-dex2oat
    buildsystem: simple
    build-commands:
      - rm /app/lib/art/libart-compiler.so
      - rm /app/lib/art/libart-dexlayout.so
      - rm /app/bin/dex2oat
      - rm /app/bin/dalvikvm
