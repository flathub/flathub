app-id: io.github.knuddel823.twofauth-client

runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

separate-locales: false

command: twofauth-client

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --talk-name=org.freedesktop.secrets

modules:
  - name: twofauth-client
    buildsystem: simple

    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/twofauth-client/cargo

    build-commands:
      - cargo build --release --offline

      - install -Dm755 target/release/twofauth-client /app/bin/twofauth-client

      - install -Dm644 data/io.github.knuddel823.twofauth-client.desktop /app/share/applications/io.github.knuddel823.twofauth-client.desktop


      - install -Dm644 data/io.github.knuddel823.twofauth-client.metainfo.xml /app/share/metainfo/io.github.knuddel823.twofauth-client.metainfo.xml

      - install -Dm644 data/icon-master.png /app/share/icons/hicolor/256x256/apps/io.github.knuddel823.twofauth-client.png

      - |
        for lang in de en es fr pt; do
          mkdir -p "/app/share/locale/$lang/LC_MESSAGES"
          msgfmt "po/$lang/twofauth-client.po" \
            -o "/app/share/locale/$lang/LC_MESSAGES/twofauth-client.mo"
        done

    sources:
      - type: git
        url: https://github.com/Knuddel823/twofauth-client.git
        tag: v0.1.6
        commit: e527646e205d1fc3626fd2c52f2a158992ba6c6f

      - cargo-sources.json
