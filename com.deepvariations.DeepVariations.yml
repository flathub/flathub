id: com.deepvariations.DeepVariations
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: deepvariation
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network

modules:
  - name: deepvariations
    buildsystem: simple
    build-commands:
      - ar x deepvariations.deb
      - tar -xf data.tar.*
      - mkdir -p "${FLATPAK_DEST}/bin"
      - mkdir -p "${FLATPAK_DEST}/lib"
      - mkdir -p "${FLATPAK_DEST}/share/applications"
      - mkdir -p "${FLATPAK_DEST}/share/metainfo"
      - cp usr/bin/deepvariation "${FLATPAK_DEST}/bin/deepvariation"
      - cp -r usr/lib/* "${FLATPAK_DEST}/lib/" 2>/dev/null || true
      - cp usr/share/applications/DeepVariations.desktop "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - cp usr/share/deepvariations/flatpak/com.deepvariations.DeepVariations.metainfo.xml "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
      - |
        for icon in usr/share/icons/hicolor/*/*/*.png usr/share/icons/hicolor/*/*/*.svg; do
          if [ -f "$icon" ]; then
            size=$(echo "$icon" | awk -F'/' '{print $(NF-2)}')
            mkdir -p "${FLATPAK_DEST}/share/icons/hicolor/${size}/apps"
            cp "$icon" "${FLATPAK_DEST}/share/icons/hicolor/${size}/apps/${FLATPAK_ID}.${icon##*.}"
          fi
        done
      - desktop-file-edit --set-key=Exec --set-value='deepvariation' "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - desktop-file-edit --set-key=Icon --set-value="${FLATPAK_ID}" "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
    sources:
      - type: file
        dest-filename: deepvariations.deb
        url: https://deepvariations.com/updates/flathub/1.0.9/DeepVariations_1.0.9_amd64.deb
        sha256: 09D9F7CB7E3F837DC718635BCA9C12EBE6AF4C8C0A52FC278292BC086ABCF45A
        only-arches: [x86_64]
