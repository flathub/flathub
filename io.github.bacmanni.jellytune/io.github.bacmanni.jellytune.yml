app-id: io.github.bacmanni.jellytune
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet9
command: JellyTune

build-options:
  append-path: /usr/lib/sdk/dotnet9/bin
  append-ld-library-path: /usr/lib/sdk/dotnet9/lib
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "true"

modules:
  - name: JellyTune
    buildsystem: simple
    build-commands:
      - mkdir -p ./nuget-cache
      - dotnet restore JellyTune.Gnome/JellyTune.Gnome.csproj --source ./nuget-sources --packages ./nuget-cache
      - dotnet restore JellyTune.Shared/JellyTune.Shared.csproj --source ./nuget-sources --packages ./nuget-cache
      - |
        if [ "$FLATPAK_ARCH" == "aarch64" ]; then
          DOTNET_ARCH="linux-arm64"
        else
          DOTNET_ARCH="linux-x64"
        fi
        dotnet publish JellyTune.Gnome/JellyTune.Gnome.csproj -c Release -o publish --runtime $DOTNET_ARCH --self-contained false --no-restore --packages ./nuget-cache -p DebugType=None -p DebugSymbols=false
      - /usr/lib/sdk/dotnet9/bin/install.sh
      - install -d /app/bin
      - cp -a publish/. /app/bin/
      - chmod +x /app/bin/JellyTune
      - install -Dm644 Icons/JellyTune.svg /app/share/icons/hicolor/scalable/apps/io.github.bacmanni.jellytune.svg
      - install -Dm644 flathub/io.github.bacmanni.jellytune.desktop /app/share/applications/io.github.bacmanni.jellytune.desktop
      - install -Dm644 flathub/io.github.bacmanni.jellytune.metainfo.xml /app/share/metainfo/io.github.bacmanni.jellytune.metainfo.xml

    sources:
      - type: git
        url: https://github.com/bacmanni/jellytune.git
        tag: v1.2.2
        commit: 63fca2d71847a948b9770479217f371cd5c9761a

      - ./gnome-nuget-sources.json
      
      - ./shared-nuget-sources.json

finish-args:
  - --share=network
  - --device=dri
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --env=DOTNET_ROOT=/app/lib/dotnet

