+app-id: io.github.noderelay.UplinkIRC
+runtime: org.kde.Platform
+runtime-version: '6.10'
+sdk: org.kde.Sdk//6.10
+command: Uplink
+
+finish-args:
+  - --share=network
+  - --share=ipc
+  - --socket=fallback-x11
+  - --socket=wayland
+  - --device=dri
+  - --talk-name=org.freedesktop.Notifications
+  - --talk-name=org.freedesktop.secrets
+  - --talk-name=org.kde.StatusNotifierWatcher
+  - --talk-name=com.canonical.dbusmenu
+
+modules:
+  - name: qtkeychain
+    buildsystem: cmake-ninja
+    config-opts:
+      - -DBUILD_WITH_QT6=ON
+      - -DBUILD_TRANSLATIONS=OFF
+    sources:
+      - type: git
+        url: https://github.com/frankosterfeld/qtkeychain.git
+        commit: 38ff50766c7e4ec490fecb2d9939b7cdc4b74b8e
+
+  - name: tomlplusplus
+    buildsystem: cmake-ninja
+    sources:
+      - type: git
+        url: https://github.com/marzer/tomlplusplus.git
+        commit: 30172438cee64926dc41fdd9c11fb3ba5b2ba9de
+
+  - name: UplinkIRC
+    buildsystem: cmake-ninja
+    config-opts:
+      - -DUPLINK_VENDOR_DEPS=OFF
+      - -DUPLINK_BUILD_TESTS=OFF
+    sources:
+      - type: git
+        url: https://github.com/noderelay/UplinkIRC.git
+        tag: v0.25.54
+        commit: 2654695614f75ee465c1aa76b2053bef90f3589e
+        x-checker-data:
+          type: git
+          tag-pattern: "^v([\\d.]+)$"
+    post-install:
+      - install -Dm644 packaging/flatpak/io.github.noderelay.UplinkIRC.metainfo.xml
+          /app/share/metainfo/io.github.noderelay.UplinkIRC.metainfo.xml
+      - install -Dm644 packaging/flatpak/io.github.noderelay.UplinkIRC.desktop
+          /app/share/applications/io.github.noderelay.UplinkIRC.desktop
+      - install -Dm644 resources/icons/uplink-dark.png
+          /app/share/icons/hicolor/256x256/apps/io.github.noderelay.UplinkIRC.png
