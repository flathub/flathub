app-id: com.tudexnetworks.gravitylauncher
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: com.tudexnetworks.gravitylauncher
finish-args:
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=ipc
  - --share=network

modules:
  - name: game02
    buildsystem: simple
    build-commands:
      - install -Dm755 com.tudexnetworks.gravitylauncher.sh /app/bin/com.tudexnetworks.gravitylauncher
      - install -Dm644 com.tudexnetworks.gravitylauncher.desktop /app/share/applications/com.tudexnetworks.gravitylauncher.desktop
      - install -Dm644 com.tudexnetworks.gravitylauncher.metainfo.xml /app/share/metainfo/com.tudexnetworks.gravitylauncher.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/com.tudexnetworks.gravitylauncher.png
    sources:
      - type: extra-data
        filename: v1.02.604_GravityLauncher_Linux.AppImage
        url: https://github.com/tudexnetworks/game02/releases/download/v1.02.605/v1.02.604_GravityLauncher_Linux.AppImage
        sha256: a04b4bacd5c31665b83edacb29e364dd4b3f9ce45a39704ee15be77a5394ecc2
        size: 108433121
