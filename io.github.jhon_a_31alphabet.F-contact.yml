app-id: io.github.jhon_a_31alphabet.F-contact
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: f-contact
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
finish-args:
  - --share=ipc
  - --socket=x11
cleanup:
  - /fltk
modules:
  - name: cfltk
    buildsystem: simple
    build-commands:
      - cmake -S cfltk -B _build
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_INSTALL_PREFIX=/app/fltk
        -DCMAKE_INSTALL_LIBDIR=lib
        -DCMAKE_POSITION_INDEPENDENT_CODE=ON
        -DCFLTK_LINK_IMAGES=ON
        -DFLTK_USE_PANGO=ON
        -DFLTK_GRAPHICS_CAIRO=ON
        -DFLTK_BUILD_FLUID=OFF
        -DFLTK_BUILD_TEST=OFF
        -DFLTK_BUILD_EXAMPLES=OFF
      - cmake --build _build --parallel
      - cmake --install _build
      - install -Dm0644 LICENSE
        /app/share/licenses/io.github.jhon_a_31alphabet.F-contact/cfltk/LICENSE
      - install -Dm0644 cfltk/fltk/COPYING
        /app/share/licenses/io.github.jhon_a_31alphabet.F-contact/fltk/COPYING
    sources:
      - type: archive
        archive-type: tar-gzip
        url: https://static.crates.io/crates/fltk-sys/fltk-sys-1.5.22.crate
        sha256: 0d09bcc449403e8ef87799dc5c5a1e31469ad5affd1bcaaca3a15810aae4ff6f

  - name: f-contact
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/f-contact/cargo
        CARGO_NET_OFFLINE: 'true'
        CFLTK_BUNDLE_DIR: /app/fltk/lib
    build-commands:
      - cd f-contact && cargo --offline fetch --verbose
      - cd f-contact && cargo build --offline --release
      - install -Dm0755 f-contact/target/release/f-contact ${FLATPAK_DEST}/bin/f-contact.bin
      - install -Dm0755 f-contact-wrapper ${FLATPAK_DEST}/bin/f-contact
      - install -Dm0644 f-contact/resources/io.github.jhon_a_31alphabet.F-contact.desktop
        ${FLATPAK_DEST}/share/applications/io.github.jhon_a_31alphabet.F-contact.desktop
      - install -Dm0644 f-contact/resources/io.github.jhon_a_31alphabet.F-contact.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/io.github.jhon_a_31alphabet.F-contact.metainfo.xml
      - install -Dm0644 f-contact/resources/icons/hicolor/scalable/apps/io.github.jhon_a_31alphabet.F-contact.svg
        ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.jhon_a_31alphabet.F-contact.svg
      - install -Dm0644 LICENSE
        ${FLATPAK_DEST}/share/licenses/io.github.jhon_a_31alphabet.F-contact/f-contact/LICENSE
    sources:
      - type: git
        url: https://github.com/Jhon-A-31alphabet/F-contact.git
        tag: '1.0'
      - type: inline
        contents: |
          #!/bin/sh
          set -eu
          data_dir="${XDG_DATA_HOME:-$HOME/.var/app/io.github.jhon_a_31alphabet.F-contact/data}/f-contact"
          mkdir -p "$data_dir/db"
          cd "$data_dir"
          exec f-contact.bin "$@"
        dest-filename: f-contact-wrapper
      - cargo-sources.json
