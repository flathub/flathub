app-id: com.syntrosend.SyntroSend
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: syntrosend
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --share=network
  - --device=dri
  - --filesystem=host
modules:
  - name: syntrosend
    buildsystem: simple
    build-commands:
      - install -D usr/bin/syntrosend /app/bin/syntrosend
      - install -Dm644 com.syntrosend.SyntroSend.desktop /app/share/applications/com.syntrosend.SyntroSend.desktop
      - install -Dm644 com.syntrosend.SyntroSend.metainfo.xml /app/share/metainfo/com.syntrosend.SyntroSend.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/com.syntrosend.SyntroSend.png
    sources:
      - type: archive
        url: https://btm4lcukupae5qng.public.blob.vercel-storage.com/linux%20x64/deb/SyntroSend_1.0.2_amd64.deb
        sha256: 062307156675c7f1f6e58ebe48959c75b8712cebb6d620b09508135ff6eda7f5
      - type: file
        path: com.syntrosend.SyntroSend.desktop
      - type: file
        path: com.syntrosend.SyntroSend.metainfo.xml
