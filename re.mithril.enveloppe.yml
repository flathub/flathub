
app-id: re.mithril.enveloppe
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: enveloppe
rename-icon: enveloppe
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --talk-name=org.freedesktop.secrets
build-options :
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/enveloppe/cargo
modules:
  - name: enveloppe
    buildsystem: simple
    build-commands:
      - cargo build --release --offline --locked --package enveloppe --bin enveloppe
      - install -Dm755 target/release/enveloppe /app/bin/enveloppe
      - install -Dm644 data/re.mithril.enveloppe.desktop /app/share/applications/re.mithril.enveloppe.desktop
      - install -Dm644 data/icons/hicolor/16x16/apps/enveloppe.png /app/share/icons/hicolor/16x16/apps/enveloppe.png
      - install -Dm644 data/icons/hicolor/22x22/apps/enveloppe.png /app/share/icons/hicolor/22x22/apps/enveloppe.png
      - install -Dm644 data/icons/hicolor/24x24/apps/enveloppe.png /app/share/icons/hicolor/24x24/apps/enveloppe.png
      - install -Dm644 data/icons/hicolor/32x32/apps/enveloppe.png /app/share/icons/hicolor/32x32/apps/enveloppe.png
      - install -Dm644 data/icons/hicolor/48x48/apps/enveloppe.png /app/share/icons/hicolor/48x48/apps/enveloppe.png
      - install -Dm644 data/icons/hicolor/64x64/apps/enveloppe.png /app/share/icons/hicolor/64x64/apps/enveloppe.png
      - install -Dm644 data/icons/hicolor/128x128/apps/enveloppe.png /app/share/icons/hicolor/128x128/apps/enveloppe.png
      - install -Dm644 data/icons/hicolor/192x192/apps/enveloppe.png /app/share/icons/hicolor/192x192/apps/enveloppe.png
      - install -Dm644 data/icons/hicolor/256x256/apps/enveloppe.png /app/share/icons/hicolor/256x256/apps/enveloppe.png
      - install -Dm644 data/icons/hicolor/512x512/apps/enveloppe.png /app/share/icons/hicolor/512x512/apps/enveloppe.png
      - install -Dm644 data/re.mithril.enveloppe.metainfo.xml /app/share/metainfo/re.mithril.enveloppe.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/re.mithril.enveloppe/LICENSE
      - |
        for lang in (sed -e '/^#/d' -e '/^[[:space:]]*/d' po/LINGUAS); do
          install -d /app/share/locale/$lang/LC_MESSAGES
          msgfmt --check-format -o /app/share/locale/$lang/LC_MESSAGES/enveloppe.mo po/$lang.po
        done
    sources:
      - type: git
        url: https://gitlab.com/mithril_informatique/enveloppe.git
        tag: v0.2.0
        commit: 6b6b699aefeee97c90039bc1ea55c91a65e8224f
      - cargo-sources.json
