# Flathub manifest for Macro Trainer.
#
# Flathub builds run with no network access, so this manifest does not build
# the Flutter app from source; it repacks the release bundle produced by the
# linux-bundle-publish workflow and published to the public
# NickHirras/macrotrainer-releases repo. See flatpak/README.md for the
# release + submission runbook.
app-id: com.macrotrainer.MacroTrainer
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: macrotrainer
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Note: no camera access. The barcode scanner is mobile-only today; if it
  # ever lands on Linux desktop, add the camera portal permission then.

modules:
  - name: macrotrainer
    buildsystem: simple
    build-commands:
      - install -d /app/macrotrainer
      - cp -a bundle/. /app/macrotrainer/
      - install -d /app/bin
      - ln -s /app/macrotrainer/macrotrainer /app/bin/macrotrainer
      - install -Dm644 com.macrotrainer.MacroTrainer.desktop -t /app/share/applications
      - install -Dm644 com.macrotrainer.MacroTrainer.metainfo.xml -t /app/share/metainfo
      - install -Dm644 icons/icon-64.png /app/share/icons/hicolor/64x64/apps/com.macrotrainer.MacroTrainer.png
      - install -Dm644 icons/icon-128.png /app/share/icons/hicolor/128x128/apps/com.macrotrainer.MacroTrainer.png
      - install -Dm644 icons/icon-256.png /app/share/icons/hicolor/256x256/apps/com.macrotrainer.MacroTrainer.png
      - install -Dm644 icons/icon-512.png /app/share/icons/hicolor/512x512/apps/com.macrotrainer.MacroTrainer.png
    sources:
      - type: archive
        url: https://github.com/NickHirras/macrotrainer-releases/releases/download/v1.5.6/macrotrainer-linux-x64.tar.gz
        sha256: 9d87f5237366bcd8b652830c7debf9c5c5e5bd09fd85c62d0c23652951062ee5
        dest: bundle
        x-checker-data:
          type: json
          url: https://api.github.com/repos/NickHirras/macrotrainer-releases/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "macrotrainer-linux-x64.tar.gz") | .browser_download_url
      - type: file
        path: com.macrotrainer.MacroTrainer.desktop
      - type: file
        path: com.macrotrainer.MacroTrainer.metainfo.xml
      - type: dir
        path: icons
        dest: icons
