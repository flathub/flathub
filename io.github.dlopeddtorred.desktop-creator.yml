app-id: io.github.dlopeddtorred.desktop-creator
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: desktop-creator

finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home

modules:
  - name: desktop-creator
    buildsystem: simple
    build-commands:
      - install -D main.py /app/bin/desktop-creator
      - install -D desktop_parser.py /app/bin/desktop_parser.py
      - install -D io.github.dlopeddtorred.desktop-creator.desktop /app/share/applications/io.github.dlopeddtorred.desktop-creator.desktop
      - install -D io.github.dlopeddtorred.desktop-creator.metainfo.xml /app/share/metainfo/io.github.dlopeddtorred.desktop-creator.metainfo.xml
      - mkdir -p /app/share/icons/hicolor/scalable/apps
      - |
        cat << 'SVG' > /app/share/icons/hicolor/scalable/apps/io.github.dlopeddtorred.desktop-creator.svg
        <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="24" fill="#3584e4"/>
          <path d="M32 32h64v64H32z" fill="#ffffff" opacity="0.9"/>
          <path d="M44 48h40v8H44zm0 16h40v8H44zm0 16h24v8H44z" fill="#3584e4"/>
        </svg>
        SVG

    sources:
      - type: git
        url: https://github.com/dlopeddtorred/desktop-creator.git
        tag: v1.0.0
