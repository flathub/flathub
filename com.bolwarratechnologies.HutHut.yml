app-id: com.bolwarratechnologies.HutHut
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: hut_hut

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-download:ro
  - --filesystem=xdg-documents:ro
  - --talk-name=org.freedesktop.FileManager1

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dbuild-date=false
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dmanpage-build=disabled
      - -Dalsa=disabled
      - -Dgpl=false
    cleanup:
      - /share/applications
      - /share/bash-completion
      - /share/icons
      - /share/zsh
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209
    modules:
      - name: libass
        config-opts:
          - --disable-static
        sources:
          - type: archive
            url: https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.xz
            sha256: 78f1179b838d025e9c26e8fef33f8092f65611444ffa1bfc0cfac6a33511a05a

      - name: libplacebo
        buildsystem: meson
        config-opts:
          - -Dglslang=disabled
        sources:
          - type: git
            url: https://github.com/haasn/libplacebo.git
            tag: v7.360.1
            commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

      - name: uchardet
        buildsystem: cmake-ninja
        config-opts:
          - -DCMAKE_BUILD_TYPE=Release
          - -DBUILD_STATIC=0
          - -DBUILD_BINARY=OFF
          - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        sources:
          - type: archive
            url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
            sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0

  - name: hut_hut
    buildsystem: simple
    build-commands:
      - install -Dm755 hut_hut /app/lib/huthut/hut_hut
      - cp -ra lib /app/lib/huthut/lib
      - cp -ra data /app/lib/huthut/data
      - install -Dm755 mp /app/lib/huthut/mp
      - install -Dm755 huthut_wrapper.sh /app/bin/hut_hut
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 ${FLATPAK_ID}.png -t /app/share/icons/hicolor/512x512/apps/
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: archive
        url: https://github.com/Perszus/huthut-linux/releases/download/v1.0.1/hut_hut_linux_v1.0.1.tar.xz
        sha256: 7f48f1c3f37d4b38a2b68a31127ab549fe37f8debc2955a64b3fb40c9fb121bf
      - type: script
        dest-filename: huthut_wrapper.sh
        commands:
          - exec /app/lib/huthut/hut_hut "$@"
