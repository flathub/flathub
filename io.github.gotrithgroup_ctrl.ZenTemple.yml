app-id: io.github.gotrithgroup_ctrl.ZenTemple
runtime: org.freedesktop.Platform
runtime-version: 24.08
sdk: org.freedesktop.Sdk
command: zen_temple
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --filesystem=home
modules:
  - name: zen_temple
    buildsystem: simple
    build-commands:
      - flutter pub get --offline
      - flutter build linux --release
      - cp -r build/linux/x64/release/bundle/* /app/
      - mkdir -p /app/bin /app/share/metainfo /app/share/applications
      - ln -s /app/zen_temple /app/bin/zen_temple
      - install -Dm644 flatpak/io.github.gotrithgroup_ctrl.ZenTemple.metainfo.xml /app/share/metainfo/io.github.gotrithgroup_ctrl.ZenTemple.metainfo.xml
      - install -Dm644 flatpak/io.github.gotrithgroup_ctrl.ZenTemple.desktop /app/share/applications/io.github.gotrithgroup_ctrl.ZenTemple.desktop
    sources:
      - type: git
        url: https://github.com/gotrithgroup-ctrl/zen-temple.git
        commit: 90faadfba3eae33396de600370cbaf9a9c562489
