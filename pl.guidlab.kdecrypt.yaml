app-id: pl.guidlab.kdecrypt
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: kdecrypt

# GnuPG (gpg, gpg-agent) ships in the KDE/freedesktop runtime, and KDecrypt feeds
# passphrases to gpg in loopback mode, so no gnupg or pinentry needs bundling.
finish-args:
  - --share=ipc
  - --share=network                 # gpg keyserver access
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.kde.kwalletd6   # KWallet storage-key
  - --filesystem=home               # files to (de)crypt + ~/.gnupg keyring

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.a'

modules:
  - name: kdecrypt
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    rename-icon: kdecrypt
    sources:
      - type: git
        url: https://github.com/Guid-Lab/kdecrypt.git
        tag: v1.0.2
        commit: 4eeae371e5b221cbad213d9ba08a088a6cc7107b
