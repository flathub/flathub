id: io.github.sirulex.cursor-clip
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: cursor-clip-launch
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

finish-args:
  # Hyprland and KDE hide clipboard data-control and layer-shell globals from
  # connections tagged through wp_security_context_manager_v1. The compositor socket
  # is required directly instead of using Flatpak's mediated Wayland socket.
  # This Wayland-only clipboard manager needs raw access to those privileged globals.
  - --filesystem=xdg-run/wayland-0:ro
  - --filesystem=xdg-run/wayland-1:ro
  - --device=dri
  - --talk-name=org.freedesktop.secrets

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/gir-1.0
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - /share/vala
  - '*.a'
  - '*.la'

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts:
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
      - -Dsmoke-tests=false
      - -Dintrospection=false
      - -Dvapi=false
    sources:
      - type: archive
        url: https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.3.0.tar.gz
        sha256: 1ebb01ab14e98afd1727f68f64981c37bd23305b1f131f5667c02b94cf593192
        x-checker-data:
          type: json
          url: https://api.github.com/repos/wmww/gtk4-layer-shell/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .tarball_url

  - name: cursor-clip
    buildsystem: simple
    build-commands:
      - install -Dm644 cargo/config .cargo/config.toml
      - cargo --offline --frozen build --release
      - install -Dm755 target/release/cursor-clip /app/bin/cursor-clip
      - install -Dm755 flatpak/cursor-clip-launch /app/bin/cursor-clip-launch
      - install -Dm644 flatpak/io.github.sirulex.cursor-clip.desktop /app/share/applications/io.github.sirulex.cursor-clip.desktop
      - install -Dm644 flatpak/io.github.sirulex.cursor-clip.metainfo.xml /app/share/metainfo/io.github.sirulex.cursor-clip.metainfo.xml
      - install -Dm644 flatpak/io.github.sirulex.cursor-clip.svg /app/share/icons/hicolor/scalable/apps/io.github.sirulex.cursor-clip.svg
      - install -Dm644 LICENSE /app/share/licenses/io.github.sirulex.cursor-clip/LICENSE
    sources:
      - type: archive
        url: https://github.com/Sirulex/cursor-clip/archive/refs/tags/v1.0.1.tar.gz
        sha256: 3818fdcf20556b1cfdca2f24b6206631520aabe75f92b60605a92b8a3a9f1ed2
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Sirulex/cursor-clip/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .tarball_url
      - cargo-sources.json