# TraceFlow Chain (Flathub)
# The application is repackaged from the official .deb of each release, published in the
# vendor's signed APT repository (https://recall-api.traceflowlabs.com/apt/). Older versions are
# kept there, so every URL below stays valid. x-checker-data proposes each new version.
id: com.traceflowlabs.TraceFlowChain
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: traceflow-chain
finish-args:
  - --share=ipc
  - --share=network        # synchronisation cloud, serveur MCP local, réseau local de l'usine
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all           # balances, imprimantes, codeurs série / USB et Bluetooth appairé (/dev/rfcomm)
  - --filesystem=xdg-download  # exports PDF / Excel enregistrés dans Téléchargements
modules:
  - name: traceflow-chain
    buildsystem: simple
    sources:
      - type: file
        dest-filename: traceflow-chain.deb
        url: https://recall-api.traceflowlabs.com/apt/pool/main/t/trace-flow-chain/trace-flow-chain_2.2.0_amd64.deb
        sha256: 526f9788a4537122e0d134c956434eb9c1475f5ca01d04a6baa4ffdefab29985
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://recall-api.traceflowlabs.com/api/version
          version-query: .version
          url-query: '"https://recall-api.traceflowlabs.com/apt/pool/main/t/trace-flow-chain/trace-flow-chain_" + $version + "_amd64.deb"'
          is-main-source: true
      - type: file
        path: com.traceflowlabs.TraceFlowChain.metainfo.xml
      - type: file
        path: com.traceflowlabs.TraceFlowChain.desktop
      - type: file
        path: com.traceflowlabs.TraceFlowChain.png
    build-commands:
      - ar -x traceflow-chain.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/traceflow-chain /app/bin/traceflow-chain
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/traceflow-chain.png /app/share/icons/hicolor/128x128/apps/com.traceflowlabs.TraceFlowChain.png
      - install -Dm644 com.traceflowlabs.TraceFlowChain.png /app/share/icons/hicolor/256x256/apps/com.traceflowlabs.TraceFlowChain.png
      - install -Dm644 com.traceflowlabs.TraceFlowChain.desktop /app/share/applications/com.traceflowlabs.TraceFlowChain.desktop
      - install -Dm644 com.traceflowlabs.TraceFlowChain.metainfo.xml /app/share/metainfo/com.traceflowlabs.TraceFlowChain.metainfo.xml
