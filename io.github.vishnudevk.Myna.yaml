id: io.github.vishnudevk.Myna
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: myna-app

# --- Permissions ---
# Dictation client needs microphone/audio, desktop display, IBus session bus.
# Whisper backend needs IPC/socket and network access to download models on first run.
finish-args:
  # Wayland / X11 display (for myna-hud overlay and myna-config GTK4 settings UI)
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Network access for downloading Whisper models at runtime
  - --share=network
  # PipeWire audio capture and sound preview playback
  - --filesystem=xdg-run/pipewire-0
  - --socket=pulseaudio
  - --device=all
  # D-Bus permissions: dictation daemon ownership, IBus injection, desktop notifications
  - --own-name=com.canonical.Myna.Dictation
  - --talk-name=org.freedesktop.IBus
  - --talk-name=org.freedesktop.IBus.*
  - --talk-name=org.freedesktop.Notifications
  # Host dconf reading (for keybinding integration)
  - --filesystem=xdg-config/dconf:ro
  # Shared IPC directory for backend and daemon control sockets
  - --filesystem=xdg-run/myna:create
  # Home filesystem access (for myna-testbed WAV clip testing)
  - --filesystem=home

build-options:
  env:
    PIP_DISABLE_PIP_VERSION_CHECK: '1'
    PIP_NO_INDEX: '1'

modules:
  # ─────────────────────────────────────────────────────────────────────────
  # Python inference dependencies (faster-whisper, ctranslate2, tokenizers, numpy)
  # Generated by flatpak-pip-generator with SHA256-verified binary wheels.
  # ─────────────────────────────────────────────────────────────────────────
  - python3-requirements-whisper.json

  # ─────────────────────────────────────────────────────────────────────────
  # Whisper Speech-to-Text inference server
  # ─────────────────────────────────────────────────────────────────────────
  - name: myna-server
    buildsystem: simple
    build-commands:
      # Install pure Python myna package directly into site-packages
      - mkdir -p /app/lib/python3.13/site-packages
      - cp -r server/src/myna /app/lib/python3.13/site-packages/

      # Install myna-server CLI entry point
      - |
        cat << 'EOF' > /app/bin/myna-server
        #!/usr/bin/env python3
        import sys
        from myna.server.cli import main
        if __name__ == '__main__':
            sys.exit(main())
        EOF
        chmod +x /app/bin/myna-server

      # Install server launcher and model downloader
      - install -Dm755 whisper-server       /app/bin/myna-whisper-server
      - install -Dm755 myna-download-model  /app/bin/myna-download-model
      - install -Dm755 myna-download-cuda   /app/bin/myna-download-cuda

    sources:
      - type: git
        url: https://github.com/canonical/myna.git
        commit: bc2eaff061062efcb296318f2efee84dc8ba4f19
      - type: file
        path: scripts/whisper-server
      - type: file
        path: scripts/myna-download-model
      - type: file
        path: scripts/myna-download-cuda

  # ─────────────────────────────────────────────────────────────────────────
  # GTK4 layer-shell support used by the updated Myna HUD
  # ─────────────────────────────────────────────────────────────────────────
  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts:
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
      - -Dsmoke-tests=false
      - -Dintrospection=false
      - -Dvapi=false
    sources:
      - type: archive
        url: https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.3.0.tar.gz
        sha256: 1ebb01ab14e98afd1727f68f64981c37bd23305b1f131f5667c02b94cf593192

  # ─────────────────────────────────────────────────────────────────────────
  # Myna Rust client workspace
  # Builds:
  #   - myna-desktop: the dictation daemon, toggle & status logic
  #   - myna-hud: GTK4/Adwaita overlay showing dictation state without focus
  #   - myna-config: GTK4/Adwaita Myna Settings GUI application
  #   - myna-testbed: development CLI for testing audio & dialect sessions
  #
  # Offline Cargo build (Flathub-compatible):
  #   cargo-sources.json was generated from client/Cargo.lock via
  #   flatpak-cargo-generator.py. Each crate archive is downloaded into
  #   cargo/vendor/, and .cargo/config.toml redirects crates-io to that tree.
  # ─────────────────────────────────────────────────────────────────────────
  - name: myna
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
      env:
        CARGO_HOME: /run/build/myna/cargo
        RUST_BACKTRACE: '1'
        # Point bindgen (used by pipewire-sys) to libclang in llvm20 SDK extension
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
        # Point PipeWire SPA plugins and modules to GNOME platform paths
        SPA_PLUGIN_DIR: /usr/lib/x86_64-linux-gnu/spa-0.2
        PIPEWIRE_MODULE_DIR: /usr/lib/x86_64-linux-gnu/pipewire-0.3
    build-commands:
      # ── Fast Offline Cargo configuration ────────────────────────────────
      - mkdir -p .cargo
      - |
        cat > .cargo/config.toml << 'EOF'
        [source.crates-io]
        replace-with = "vendored-sources"

        [source.vendored-sources]
        directory = "cargo/vendor"

        [build]
        rustflags = ["-C", "link-arg=-fuse-ld=lld"]

        [profile.release]
        opt-level = 3
        codegen-units = 16
        lto = "thin"
        debug = 0
        EOF

      # ── Version staging ─────────────────────────────────────────────────
      # Avoid depending on git rev-parse during sandbox build
      - echo "0.3.1" > client/.version

      # ── Unified Workspace Cargo build (offline, parallel, shared target) 
      - cargo build --release --locked --manifest-path client/Cargo.toml -p myna-desktop -p myna-cli -p myna-hud -p myna-config

      # ── Binary installation ─────────────────────────────────────────────
      - install -Dm755 client/target/release/myna-desktop   /app/bin/myna-desktop
      - install -Dm755 client/target/release/myna-testbed   /app/bin/myna-testbed
      - install -Dm755 client/target/release/myna-hud       /app/bin/myna-hud
      - install -Dm755 client/target/release/myna-config    /app/bin/myna-config
      - install -Dm755 client/target/release/myna-hud-host /app/bin/myna-hud-host

      # Strip DWARF debuginfo, keeping symbols for panic backtraces
      - strip --strip-debug /app/bin/myna-desktop /app/bin/myna-testbed /app/bin/myna-hud /app/bin/myna-config /app/bin/myna-hud-host

      # ── GSettings schema ────────────────────────────────────────────────
      - |
        install -Dm644 \
          client/data/glib-2.0/schemas/com.canonical.Myna.Dictation.gschema.xml \
          /app/share/glib-2.0/schemas/com.canonical.Myna.Dictation.gschema.xml
      - glib-compile-schemas /app/share/glib-2.0/schemas

      # ── Gettext translations ────────────────────────────────────────────
      - |
        for po in client/myna-desktop/po/*.po client/myna-orchestrator/po/*.po; do
          [ -f "$po" ] || continue
          lang=$(basename "$po" .po)
          domain=$(basename "$(dirname "$(dirname "$po")")")
          mkdir -p "/app/share/locale/$lang/LC_MESSAGES"
          msgfmt "$po" -o "/app/share/locale/$lang/LC_MESSAGES/$domain.mo"
        done

      # ── Application icons ───────────────────────────────────────────────
      - install -Dm644 client/data/icons/hicolor/scalable/apps/com.canonical.Myna.svg
          /app/share/icons/hicolor/scalable/apps/io.github.vishnudevk.Myna.svg
      - install -Dm644 client/data/icons/hicolor/scalable/apps/com.canonical.Myna.Config.svg
          /app/share/icons/hicolor/scalable/apps/io.github.vishnudevk.Myna.Config.svg

    sources:
      # Upstream Myna source
      - type: git
        url: https://github.com/canonical/myna.git
        commit: bc2eaff061062efcb296318f2efee84dc8ba4f19
      - type: patch
        path: patches/0001-flatpak-backend-support.patch
      - type: patch
        path: patches/0002-shortcut-desktop-steps.patch
      - type: patch
        path: patches/0003-flatpak-ibus-pid-check.patch
      - type: patch
        path: patches/0004-nvidia-ui-progress.patch
      - type: patch
        path: patches/0005-background-portal.patch
      - type: patch
        path: patches/0006-server-process-name.patch
      - type: patch
        path: patches/0007-flatpak-background-app-id.patch

      # Vendored Cargo crates (517 crates, checksum-verified)
      - cargo-sources.json

  # ─────────────────────────────────────────────────────────────────────────
  # Desktop Integration & Launcher Scripts
  # Separated from Rust compilation so script/metadata tweaks rebuild instantly.
  # ─────────────────────────────────────────────────────────────────────────
  - name: myna-packaging
    buildsystem: simple
    build-commands:
      # ── Launcher scripts ────────────────────────────────────────────────
      - install -Dm755 myna-app             /app/bin/myna-app
      - install -Dm755 myna-daemon          /app/bin/myna-daemon
      - install -Dm755 myna-status          /app/bin/myna-status
      - install -Dm755 myna-toggle          /app/bin/myna-toggle
      - install -Dm755 myna-testbed-wrapper /app/bin/myna-testbed-wrapper

      # ── Desktop & AppStream metadata ────────────────────────────────────
      - install -Dm644 io.github.vishnudevk.Myna.desktop
          /app/share/applications/io.github.vishnudevk.Myna.desktop
      - install -Dm644 io.github.vishnudevk.Myna.metainfo.xml
          /app/share/metainfo/io.github.vishnudevk.Myna.metainfo.xml

      # ── Systemd user service unit ───────────────────────────────────────
      - install -Dm644 io.github.vishnudevk.Myna.service
          /app/share/systemd/user/io.github.vishnudevk.Myna.service

    sources:
      # Packaging helper scripts & integration files
      - type: file
        path: scripts/myna-app
      - type: file
        path: scripts/myna-daemon
      - type: file
        path: scripts/myna-status
      - type: file
        path: scripts/myna-toggle
      - type: file
        path: scripts/myna-testbed-wrapper
      - type: file
        path: io.github.vishnudevk.Myna.desktop
      - type: file
        path: io.github.vishnudevk.Myna.metainfo.xml
      - type: file
        path: services/io.github.vishnudevk.Myna.service
