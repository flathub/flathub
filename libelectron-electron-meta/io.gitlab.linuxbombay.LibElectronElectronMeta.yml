app-id: io.gitlab.linuxbombay.LibElectronElectronMeta
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: libelectron-electron-meta-flatpak-info
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
modules:
  - modules/libelectron-electron-meta.yml
  - name: libelectron-electron-meta-flatpak-info
    buildsystem: simple
    build-commands:
      - install -Dm755 libelectron-electron-meta-flatpak-info /app/bin/libelectron-electron-meta-flatpak-info
    sources:
      - type: script
        dest-filename: libelectron-electron-meta-flatpak-info
        commands:
          - 'printf "LibElectron Electron Meta %s is installed in /app/opt/libelectron-electron-meta\n" "$(cat /app/opt/libelectron-electron-meta/version.txt)"'
          - 'printf "Electron binary: /app/opt/libelectron-electron-meta/node_modules/electron/dist/electron\n"'
          - 'printf "Wrapper: /app/bin/libelectronmeta\n"'
