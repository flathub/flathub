name: libelectron-electron-meta
buildsystem: simple
build-commands:
  - install -dm755 /app/opt/libelectron-electron-meta/node_modules/electron/dist
  - cp -a electron-dist/. /app/opt/libelectron-electron-meta/node_modules/electron/dist/
  - printf '42.10.1\n' > /app/opt/libelectron-electron-meta/version.txt
  - install -Dm755 libelectronmeta /app/bin/libelectronmeta
  - sh -c 'install -Dm644 LICENSE "/app/share/licenses/${FLATPAK_ID}/libelectron-electron-meta/LICENSE"'
sources:
  - type: archive
    url: https://github.com/electron/electron/releases/download/v42.10.1/electron-v42.10.1-linux-x64.zip
    sha256: 2452b27112d92387471fa2488aafac85d79ea3f2ee1216c0abd5150d6c12362b
    dest: electron-dist
    only-arches:
      - x86_64
  - type: archive
    url: https://github.com/electron/electron/releases/download/v42.10.1/electron-v42.10.1-linux-arm64.zip
    sha256: 20e68d6c4e47f3ebf59de7c6b1f8b8bec6a6ebda6a451132f9b465f3f13ce467
    dest: electron-dist
    only-arches:
      - aarch64
  - type: file
    path: ../LICENSE
  - type: file
    path: ../scripts/libelectronmeta
