app-id: io.github.alisontristao.TraceView
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: TraceView
default-branch: stable
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  # QSerialPort (/dev/ttyACM*, /dev/ttyUSB*) and hidapi (/dev/hidraw*).
  - --device=all
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - '*.a'
modules:
  - name: traceview
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DTRACEVIEW_BUILD_TESTS=OFF
      - -DTRACEVIEW_BUILD_TOOLS=OFF
      - -DTRACEVIEW_FLATPAK_BUILD=ON
      - -DHIDAPI_WITH_LIBUSB=OFF
      - -DHIDAPI_WITH_HIDRAW=ON
      - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - -DFETCHCONTENT_SOURCE_DIR_BTP=/run/build/traceview/deps/btp
      - -DFETCHCONTENT_SOURCE_DIR_HIDAPI=/run/build/traceview/deps/hidapi
      - -DFETCHCONTENT_SOURCE_DIR_MBEDTLS=/run/build/traceview/deps/mbedtls
    sources:
      # Development/CI builds use the checked-out revision, including local edits.
      # Flathub submission must replace this with a pinned upstream git source.
      - type: dir
        path: .
        skip: [.git, build, .flatpak-builder, flatpak-repo, build-flatpak]
      - type: git
        url: https://github.com/AlisonTristao/BTP.git
        tag: v2.45.0
        commit: fe0cb9eb8efaffd6c4c2a882caec53fbafa442be
        dest: deps/btp
      - type: git
        url: https://github.com/libusb/hidapi.git
        tag: hidapi-0.15.0
        commit: d6b2a974608dec3b76fb1e36c189f22b9cf3650c
        dest: deps/hidapi
      - type: git
        url: https://github.com/Mbed-TLS/mbedtls.git
        tag: v3.6.7
        commit: 068ff080b369adfac81509f9b57b2afabaf82dc5
        dest: deps/mbedtls
