id: io.github.bztd.FourChessViewer
command: 4chessviewer
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

rename-icon: 4ChessViewer
rename-desktop-file: 4ChessViewer.desktop
rename-appdata-file: 4ChessViewer.appdata.xml

finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --filesystem=xdg-documents   
  - --persist=.ajedrez4

modules:
  - name: wxwidgets
    buildsystem: autotools
    no-autogen: true
    config-opts:
      - --with-gtk=3
      - --disable-webview
      - --disable-webviewwebkit
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/gtk-doc
    sources:
      - type: archive
        url: https://github.com/wxWidgets/wxWidgets/releases/download/v3.3.3/wxWidgets-3.3.3.tar.bz2
        sha256: 81b09d6dd9f1ed9301f8c55a968a488d0491f264dc2bab19a7e407ac67009482
        x-checker-data:
          type: anitya
          project-id: 5150
          stable-only: true
          url-template: https://github.com/wxWidgets/wxWidgets/releases/download/v$version/wxWidgets-$version.tar.bz2

  - name: 4chess-viewer
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: git
        url: https://github.com/bztd/FourChessViewer.git
        # tag: Version-26.07.1
        commit: da98cb016f2209ab3ae6053521c3c71f9d1ff3b4
