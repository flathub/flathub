app-id: red.ghs.axolotl
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22

command: red.ghs.axolotl

finish-args:
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-data/Minecraft:create
  - --filesystem=xdg-download
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/axolotl/cargo
    CARGO_NET_OFFLINE: 'true'
    RUST_BACKTRACE: '1'
    RUST_LOG: info

modules:
  - name: axolotl
    buildsystem: simple
    build-commands:
      # 安装 pnpm
      - npm install -g pnpm

      # 安装前端依赖
      - pnpm install --frozen-lockfile

      # 构建前端
      - pnpm --filter app-frontend build

      # 构建后端
      - |
        cd apps/app
        cargo build --release --features custom-protocol

      # 安装二进制
      - install -Dm755 apps/app/target/release/theseus_gui /app/bin/red.ghs.axolotl

      # 安装图标
      - |
        for size in 32 64 128 256; do
          install -Dm644 apps/app/icons/${size}x${size}.png \
            /app/share/icons/hicolor/${size}x${size}/apps/red.ghs.axolotl.png 2>/dev/null || true
        done

      # 安装 desktop、metainfo 和 mime
      - install -Dm644 red.ghs.axolotl.desktop /app/share/applications/red.ghs.axolotl.desktop
      - install -Dm644 red.ghs.axolotl.metainfo.xml /app/share/metainfo/red.ghs.axolotl.metainfo.xml
      - install -Dm644 red.ghs.axolotl.xml /app/share/mime/packages/red.ghs.axolotl.xml

    sources:
      - type: archive
        url: https://github.com/Mystic-Stars/Axolotl/archive/refs/tags/v1.5.3.tar.gz
        sha256: 6d388168d14f4c55fdad8ac8c1b3b79f2516f99222277a9478f1035988ed85b3
        dest: axolotl-src

      - type: file
        path: red.ghs.axolotl.desktop
      - type: file
        path: red.ghs.axolotl.metainfo.xml
      - type: file
        path: red.ghs.axolotl.xml

      # 注意：实际提交时需要生成 cargo 和 pnpm 的离线依赖
      # 使用 flatpak-cargo-generator 和 flatpak-pnpm-generator
      # 这里先留空，实际构建时需要补充
