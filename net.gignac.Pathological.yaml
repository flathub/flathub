app-id: net.gignac.Pathological
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: pathological-wrapper.sh
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
modules:
  - name: python3-pygame
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - python3 -m ensurepip --root /app --altinstall
      - python3 -m pip install --verbose --no-cache-dir --prefix=/app pygame
    
  - name: pathological
    buildsystem: simple
    sources:
      - type: dir
        path: ..
    build-commands:
      - mkdir -p /app/share/pathological
      - mkdir -p /app/bin
      - mkdir -p /app/share/applications
      - mkdir -p /app/share/metainfo
      - mkdir -p /app/share/icons/hicolor/32x32/apps
      - mkdir -p /app/share/icons/hicolor/48x48/apps
      - mkdir -p /app/share/icons/hicolor/64x64/apps
      - mkdir -p /app/share/icons/hicolor/128x128/apps
      - mkdir -p /app/share/icons/hicolor/256x256/apps

      - cp pathological.py /app/share/pathological/
      - cp pathological_scores /app/share/pathological/
      - cp -r circuits graphics music sounds /app/share/pathological/
      - rm -f /app/share/pathological/graphics/*.xcf
      
      - install -m 755 flatpak/pathological-wrapper.sh /app/bin/pathological-wrapper.sh
      - install -m 644 flatpak/net.gignac.Pathological.desktop /app/share/applications/net.gignac.Pathological.desktop
      - install -m 644 flatpak/net.gignac.Pathological.metainfo.xml /app/share/metainfo/net.gignac.Pathological.metainfo.xml
      
      - cp graphics/icon.png /app/share/icons/hicolor/32x32/apps/net.gignac.Pathological.png
      - cp graphics/icon.png /app/share/icons/hicolor/48x48/apps/net.gignac.Pathological.png
      - cp graphics/icon.png /app/share/icons/hicolor/64x64/apps/net.gignac.Pathological.png
      - cp graphics/icon.png /app/share/icons/hicolor/128x128/apps/net.gignac.Pathological.png
      - cp graphics/icon.png /app/share/icons/hicolor/256x256/apps/net.gignac.Pathological.png
