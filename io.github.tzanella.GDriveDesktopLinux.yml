# Manifesto Flatpak para submissão ao Flathub (https://docs.flathub.org/docs/for-app-authors/submission).
app-id: io.github.tzanella.GDriveDesktopLinux
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: gdrive-desktop-linux-flatpak

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=io.github.tzanella.GDriveDesktopLinux1
  - --own-name=io.github.tzanella.GDriveDesktopLinux1.Ui
  - --own-name=io.github.tzanella.GDriveDesktopLinux1.Tray

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/gdrive-desktop-linux/cargo

modules:
  - name: fuse3
    buildsystem: meson
    config-opts:
      - -Dexamples=false
      - -Dtests=false
      - -Dutils=true
      - -Dudevrulesdir=/app/lib/udev/rules.d
    sources:
      - type: archive
        url: https://github.com/libfuse/libfuse/releases/download/fuse-3.16.2/fuse-3.16.2.tar.gz
        sha256: f797055d9296b275e9fc9f5bd52f2f3008b28d18c78a14e3a764c3d4131c4950

  - name: gdrive-desktop-linux
    buildsystem: simple
    build-commands:
      - cargo --offline build --release -p gdl-daemon -p gdl-cli -p gdl-tray -p gdl-ui -p gdl-mcp --bins
      - sh scripts/install-dev.sh --prefix /app --from target/release --no-activate
      - install -Dm755 packaging/flatpak/gdrive-desktop-linux-flatpak /app/bin/gdrive-desktop-linux-flatpak
      - sed -i 's|Exec=.*|Exec=gdrive-desktop-linux-flatpak|' /app/share/applications/io.github.tzanella.GDriveDesktopLinux.desktop
    sources:
      - type: git
        url: https://github.com/tzanella/gdrive-desktop-linux.git
        tag: v1.3.1
        commit: a8b03606b6b2acfbbb065c077dfd48e0c1769d2d
      - generated-sources.json
