app-id: org.sinzala.silori
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: silori

finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --env=QT_QPA_PLATFORM=xcb

modules:
  - name: silori
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSILORI_BUILD_TESTS=OFF
      - -DSILORI_ENABLE_QT_DEPLOY=OFF
    sources:
      - type: archive
        url: https://sinzala.org/downloads/silori/silori-flathub-source-0.1.0.tar.gz
        sha256: 5610d1c7e79211c47b602d4994c6ba6d402f7d1be30022337b10498e1dedca17
        strip-components: 0
