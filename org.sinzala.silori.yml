app-id: org.sinzala.silori
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: silori

finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --env=QT_QPA_PLATFORM=xcb

modules:
  - name: silori
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSILORI_BUILD_TESTS=OFF
      - -DSILORI_ENABLE_QT_DEPLOY=OFF
    sources:
      - type: archive
        url: https://sinzala.org/downloads/silori/silori-flathub-source-0.1.0.tar.gz
        sha256: ff8993a1b304f0ade6a0bd073fb1d7c79ab3ca37539ebe03fc4637e3c8c683c5
        strip-components: 0
