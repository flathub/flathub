app-id: org.triliumnotes.Trilium
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  # Provides node on PATH at build time only; nothing of it ships in the app.
  - org.freedesktop.Sdk.Extension.node24
command: trilium
# Electron carries its own locale files
separate-locales: false

finish-args:
  # Wayland first, X11 only where Wayland is unavailable.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU acceleration for the Chromium renderer.
  - --device=dri
  # Audio playback (attached media, notification sounds).
  - --socket=pulseaudio
  # Sync with self-hosted servers and fetching remote content in notes.
  - --share=network
  # The notes database; created on first launch. Import/export and attachments
  # go through the portal file chooser, so no wider grant is needed; custom
  # data or backup locations are a user-side `flatpak override --filesystem`.
  - --filesystem=~/.local/share/trilium-data:create
  # Legacy data location, used by data_dir.ts when it already exists.
  - --filesystem=~/trilium-data
  # Desktop notifications.
  - --talk-name=org.freedesktop.Notifications
  # Tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: trilium
    buildsystem: simple
    build-options:
      # pnpm first because apps/desktop/scripts/build.ts needs `pnpm build`.
      append-path: /run/build/trilium/flatpak-node/pnpm/bin:/usr/lib/sdk/node24/bin
      env:
        XDG_CACHE_HOME: /run/build/trilium/flatpak-node/cache
    build-commands:
      # Set up pnpm and install dependencies
      - chmod +x flatpak-node/pnpm/bin/pnpm.cjs
      - ln -s pnpm.cjs flatpak-node/pnpm/bin/pnpm      
      - pnpm install --offline --frozen-lockfile --reporter=append-only

      # Produces apps/desktop/dist: the main/preload bundles, the client, assets
      # and a trimmed better-sqlite3.
      - pnpm desktop:build

      - install -d /app/lib/trilium
      - cp -a apps/desktop/dist/. /app/lib/trilium/
      
      # Electron ships no install script; it downloads its binary lazily on
      # first use, which an offline sandbox cannot allow. Unpack the cached zip
      # instead. zypak replaces the setuid chrome-sandbox helper.
      - unzip -q flatpak-node/cache/electron/electron-v*-linux-*.zip -d /app/lib/electron
      - mv /app/lib/electron/electron /app/lib/electron/trilium
      - rm /app/lib/electron/chrome-sandbox

      # Drop the Chromium UI locales Trilium does not expose (~38 MB).
      - |
        node --experimental-strip-types --input-type=module -e '
        import { LOCALES } from "./packages/commons/src/lib/i18n.ts";
        import { readdirSync, unlinkSync } from "node:fs";
        const keep = new Set(LOCALES.filter((l) => !l.contentOnly && l.electronLocale)
            .map((l) => `${l.electronLocale.replace("_", "-")}.pak`));
        keep.add("en-US.pak"); // Electron names English en-US.pak; the list has "en".
        for (const f of readdirSync("/app/lib/electron/locales")) {
            if (!keep.has(f)) unlinkSync(`/app/lib/electron/locales/${f}`);
        }'

      - install -Dm755 trilium.sh /app/bin/trilium
    sources:
      - type: git
        url: https://github.com/TriliumNext/Trilium.git
        tag: v0.105.0
        commit: a0908a6e1e1741a3c3824d803da07300183dcb0c
      - generated-sources.json
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-11.22.0.tgz
        sha256: 57a97e6f23a3faffc03153a4ef8c770a0552612b8640aebe39bfdd5754d0ebdc
        dest: flatpak-node/pnpm
      # The launcher; zypak maps Chromium's sandbox onto flatpak sub-sandboxes.
      - type: script
        dest-filename: trilium.sh
        commands:
          - exec zypak-wrapper /app/lib/electron/trilium /app/lib/trilium "$@"
