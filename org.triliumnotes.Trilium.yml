app-id: org.triliumnotes.Trilium
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  # Provides node on PATH at build time only; nothing of it ships in the app.
  - org.freedesktop.Sdk.Extension.node24
command: trilium
# Electron carries its own locale files
separate-locales: false

finish-args:
  # Wayland first, X11 only where Wayland is unavailable.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU acceleration for the Chromium renderer.
  - --device=dri
  # Audio playback (attached media, notification sounds).
  - --socket=pulseaudio
  # Sync with self-hosted servers and fetching remote content in notes.
  - --share=network
  # Allow drag & drop from common dirs. Otherwise drag to import would fail due
  # to unreachable files. See https://github.com/electron/electron/issues/30650
  - --filesystem=xdg-download:ro
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro
  # Tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: trilium
    buildsystem: simple
    build-options:
      # pnpm first because apps/desktop/scripts/build.ts needs `pnpm build`.
      append-path: /run/build/trilium/flatpak-node/pnpm/bin:/usr/lib/sdk/node24/bin
      env:
        XDG_CACHE_HOME: /run/build/trilium/flatpak-node/cache
    build-commands:
      - chmod +x flatpak-node/pnpm/bin/pnpm.cjs
      - ln -s pnpm.cjs flatpak-node/pnpm/bin/pnpm      
      - pnpm install --offline --frozen-lockfile --reporter=append-only

      - node --experimental-strip-types stamp-build-info.mts
      - pnpm desktop:build

      - install -d /app/lib/trilium
      - cp -a apps/desktop/dist/. /app/lib/trilium/
      
      # Electron downloads its binary lazily on first use, which an offline sandbox cannot allow.
      # Unpack the cached zip instead.
      - unzip -q flatpak-node/cache/electron/electron-v*-linux-*.zip -d /app/lib/electron
      - mv /app/lib/electron/electron /app/lib/electron/trilium
      - rm /app/lib/electron/chrome-sandbox

      - node --experimental-strip-types flip-fuses.mts
      - node --experimental-strip-types trim-locales.mts

      - install -Dm755 trilium.sh /app/bin/trilium
      - for s in 128 256 512; do install -Dm644 "apps/desktop/electron-forge/app-icon/png/${s}x${s}.png"
        "/app/share/icons/hicolor/${s}x${s}/apps/${FLATPAK_ID}.png"; done
    sources:
      - type: git
        url: https://github.com/TriliumNext/Trilium.git
        tag: v0.105.0
        commit: a0908a6e1e1741a3c3824d803da07300183dcb0c
      - generated-sources.json
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-11.22.0.tgz
        sha256: 57a97e6f23a3faffc03153a4ef8c770a0552612b8640aebe39bfdd5754d0ebdc
        dest: flatpak-node/pnpm
      - type: file
        path: flip-fuses.mts
      - type: file
        path: stamp-build-info.mts
      - type: file
        path: trim-locales.mts
      - type: script
        dest-filename: trilium.sh
        commands:
          # Use built-in directory, unless the user has already overridden or mounted their data directory.
          - |
            if [ -z "${TRILIUM_DATA_DIR:-}" ]; then
                if [ ! -d "$XDG_DATA_HOME/trilium-data" ] && [ -d "$HOME/.local/share/trilium-data" ]; then
                    export TRILIUM_DATA_DIR="$HOME/.local/share/trilium-data"
                else
                    export TRILIUM_DATA_DIR="$XDG_DATA_HOME/trilium-data"
                fi
            fi
          - exec zypak-wrapper /app/lib/electron/trilium /app/lib/trilium "$@"

  # Separate module so a metadata edit does not invalidate app build.
  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: file
        dest-filename: org.triliumnotes.Trilium.desktop
        url: https://raw.githubusercontent.com/TriliumNext/Trilium/e87e0bbcb1ebeefa18374dbbd3ef3ec0e3cd501b/apps/desktop/flatpak/org.triliumnotes.Trilium.desktop
        sha256: 889a8af67c16e23a019eb8126f5a358403394574b8eb3bcc9c6a47540b7db8ae
      - type: file
        dest-filename: org.triliumnotes.Trilium.metainfo.xml
        url: https://raw.githubusercontent.com/TriliumNext/Trilium/e87e0bbcb1ebeefa18374dbbd3ef3ec0e3cd501b/apps/desktop/flatpak/org.triliumnotes.Trilium.metainfo.xml
        sha256: 1ee40ba6439dfc3ac8675ba3ad37892f0db7d033ba2b8f17f2e1870ddccac087
