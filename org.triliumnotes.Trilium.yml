app-id: org.triliumnotes.Trilium
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  # Provides node on PATH at build time only; nothing of it ships in the app.
  - org.freedesktop.Sdk.Extension.node24
command: trilium
# Electron carries its own locale files
separate-locales: false

finish-args:
  # Wayland first, X11 only where Wayland is unavailable.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU acceleration for the Chromium renderer.
  - --device=dri
  # Audio playback (attached media, notification sounds).
  - --socket=pulseaudio
  # Sync with self-hosted servers and fetching remote content in notes.
  - --share=network
  # The notes database lives in ~/.local/share/trilium-data, and import/export,
  # attachments and scripting read and write arbitrary user paths.
  - --filesystem=home
  # Desktop notifications.
  - --talk-name=org.freedesktop.Notifications
  # Tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: trilium
    buildsystem: simple
    build-commands:
      - install -Dm755 trilium.sh /app/bin/trilium
    sources:
      - type: git
        url: https://github.com/TriliumNext/Trilium.git
        tag: v0.105.0
        commit: a0908a6e1e1741a3c3824d803da07300183dcb0c
      - generated-sources.json
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-11.22.0.tgz
        sha256: 57a97e6f23a3faffc03153a4ef8c770a0552612b8640aebe39bfdd5754d0ebdc
        dest: flatpak-node/pnpm
      - type: file
        path: trilium.sh
