app-id: com.ktechpit.typingmaster
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: typingmaster
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --env=INSTALL_TYPE=flatpak

modules:
  - shared-modules/squashfs-tools/squashfs-tools.json

  - name: typingmaster
    buildsystem: simple
    build-commands:
      - unsquashfs -no-progress *.snap
      - install -Dm755 squashfs-root/usr/bin/typingmaster ${FLATPAK_DEST}/bin/typingmaster
      - cp -r squashfs-root/usr/share/icons ${FLATPAK_DEST}/share/
      - install -Dm644 squashfs-root/usr/share/applications/com.ktechpit.typingmaster.desktop ${FLATPAK_DEST}/share/applications/com.ktechpit.typingmaster.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} ${FLATPAK_DEST}/share/applications/com.ktechpit.typingmaster.desktop
      - install -Dm644 squashfs-root/usr/share/metainfo/com.ktechpit.typingmaster.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.ktechpit.typingmaster.metainfo.xml
    sources:
      # =========================
      # x86_64 (amd64) — stable
      # =========================
      - type: file
        url: https://api.snapcraft.io/api/v1/snaps/download/bZzosNX6Jpt5Jb6HIkHiWoJeFwHviCCr_6.snap
        sha256: 43d8fda85e3f2f71dfb15c8892587a5a07b6ac9c9fe0d16c46051a44868bb311
        only-arches:
          - x86_64

      # =========================
      # aarch64 – stable
      # =========================
      - type: file
        url: https://api.snapcraft.io/api/v1/snaps/download/bZzosNX6Jpt5Jb6HIkHiWoJeFwHviCCr_7.snap
        sha256: 639c97f56d5855b91d513f4c1d777fee5f5003631117456b1654c88182023c27
        only-arches:
          - aarch64
