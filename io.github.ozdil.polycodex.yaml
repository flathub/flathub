app-id: io.github.ozdil.polycodex
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: polycodex-gui

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --filesystem=home
  - --filesystem=xdg-run/polycodex:create
  - --talk-name=org.freedesktop.portal.FileChooser

modules:
  - name: polycodex
    buildsystem: simple
    build-commands:
      - tar -xzf polycodex-v0.1.0-x86_64-linux.tar.gz
      - install -Dm755 polycodex /app/bin/polycodex
      - install -Dm755 polycodex-gui /app/bin/polycodex-gui
      - install -Dm644 qml/shell.qml /app/share/polycodex/qml/shell.qml
      - install -Dm644 qml/MainWindow.qml /app/share/polycodex/qml/MainWindow.qml
      - install -Dm644 qml/Theme.qml /app/share/polycodex/qml/Theme.qml
      - install -Dm644 polycodex.desktop /app/share/applications/io.github.ozdil.polycodex.desktop
      - install -Dm644 polycodex.svg /app/share/icons/hicolor/scalable/apps/io.github.ozdil.polycodex.svg
      - install -Dm644 packaging/flatpak/org.ozdil.PolyCodex.metainfo.xml /app/share/metainfo/io.github.ozdil.polycodex.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/ozdil/polycodex/archive/v0.1.0.tar.gz
        sha256: 9b40c2b7454bd28b5496eb5fbc9579f2bd38bff0b8c986af0893b53799b1ae01
      - type: file
        url: https://github.com/ozdil/polycodex/releases/download/v0.1.0/polycodex-v0.1.0-x86_64-linux.tar.gz
        sha256: e729c23e0b8139780aef29835451fdef47d8f30742ba357c2574a1d7e3355cc3
