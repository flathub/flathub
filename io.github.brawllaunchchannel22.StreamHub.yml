app-id: io.github.brawllaunchchannel22.StreamHub
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: streamhub
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri

modules:
  - name: streamhub
    buildsystem: simple
    build-commands:
      - install -Dm755 streamhub.sh /app/bin/streamhub
      - cp -r . /app/lib/streamhub
    sources:
      - type: git
        url: https://github.com/brawllaunchchannel22/streamhub.git
        tag: v3.0.3
        commit: b64fd9a2ebd6ab7379b848bdbc24e14351e74efe
      - type: file
        path: streamhub.sh
