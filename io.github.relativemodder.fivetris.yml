id: io.github.relativemodder.fivetris
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: fivetris

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/fivetris/cargo
    RUST_BACKTRACE: "1"

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - "*.a"
  - "*.la"

modules:
  - name: alsa-lib
    buildsystem: autotools
    config-opts:
      - --disable-python
    sources:
      - type: archive
        url: https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.13.tar.bz2
        sha256: 8c4ff37553cbe89618e187e4c779f71a9bb2a8b27b91f87ed40987cc9233d8f6
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share

  - name: fivetris
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/fivetris/cargo
    build-commands:
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/fivetris -t /app/bin/
      - install -Dm644 assets/icon.png /app/share/icons/hicolor/256x256/apps/io.github.relativemodder.fivetris.png
      - install -Dm644 io.github.relativemodder.fivetris.desktop -t /app/share/applications/
      - install -Dm644 io.github.relativemodder.fivetris.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.relativemodder.fivetris/
    sources:
      - type: git
        url: https://github.com/relativemodder/fivetris.git
        tag: v0.1.5
        commit: 7a98600a2f83c846441bf48f0e2968258baa4b1d
      - type: file
        path: io.github.relativemodder.fivetris.desktop
      - type: file
        path: io.github.relativemodder.fivetris.metainfo.xml
      - type: file
        path: vendor-config.toml
        dest: .cargo
        dest-filename: config.toml
      - cargo-sources.json
