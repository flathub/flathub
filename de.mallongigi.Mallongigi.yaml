id: de.mallongigi.Mallongigi
runtime: org.freedesktop.Platform
runtime-version: '25.08' 
sdk: org.freedesktop.Sdk
command: programStart.sh

# Schaltet die Java-Erweiterung für den Build frei
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk25
  

finish-args:
  - --share=ipc
  - --socket=wayland       # Für moderne Linux-Systeme
  - --socket=fallback-x11  # Fallback, falls Wayland nicht Installiert ist.
  - --socket=pulseaudio    # Wichtig für einen Podcast-Player (Ton)
  - --share=network        # Wichtig für Podcast-Downloads/Streams
  - --device=dri           # Grafikbeschleunigung
  - --persist=mallongigi   # Rechte auf Speicherordner setzten 
  
modules:

  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk25/install.sh

  - name: mallongigi
    buildsystem: simple
    build-commands:
      # Erstellen der Zielverzeichnisse im Flatpak-Sandkasten
      - install -d /app/share/metainfo/
      - install -d /app/share/applications/
      - install -d /app/share/icons/hicolor/scalable/apps/

      # Erstellt die Ordnerstruktur und kopiert die JAR-Datei
      - install -D mallongigi.jar /app/share/mallongigi/mallongigi.jar

      # Desctop und Start Icon kopieren
      - install -D icon.svg /app/share/icons/hicolor/scalable/apps/de.mallongigi.Mallongigi.svg

      # Kopiert Ihr Startskript korrekt nach /app/bin/ und macht es ausführbar
      - install -m 755 -D programStart.sh /app/bin/programStart.sh

      # Kopieren der XML-Metadaten und des Linux-Anwendungsstarters
      - install -m 644 de.mallongigi.Mallongigi.metainfo.xml /app/share/metainfo/
      - install -m 644 de.mallongigi.Mallongigi.desktop /app/share/applications/


    sources:
      - type: archive
        url: https://github.com/mallongigi/Mallongigi/releases/download/1.00.01/Mallongigi_Flatpak_1.00.01.tar.gz # URL zum aktuellen Release
        sha256: 669c73c76d7d892a2570252f6f86f07cff5d1154cae3d0640e0d9ac1aebb6e4d
        strip-components: 0