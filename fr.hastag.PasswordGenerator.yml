app-id: fr.hastag.PasswordGenerator
runtime: org.gnome.Platform
runtime-version: '50' # Version récente recommandée par le linter
sdk: org.gnome.Sdk
command: password-generator

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: password-generator
    buildsystem: simple
    build-commands:
      - install -D src/password_generator.py /app/bin/password-generator
      - chmod +x /app/bin/password-generator
      - install -D fr.hastag.PasswordGenerator.desktop /app/share/applications/fr.hastag.PasswordGenerator.desktop
      - install -D fr.hastag.PasswordGenerator.metainfo.xml /app/share/metainfo/fr.hastag.PasswordGenerator.metainfo.xml
      - install -D fr.hastag.PasswordGenerator.svg /app/share/icons/hicolor/scalable/apps/fr.hastag.PasswordGenerator.svg
    sources:
      - type: git
        url: https://github.com/Studio-Hastag/password-generator.git
        tag: v1.0.0
        commit: 7bdf85f4731d7ae65232bc9c5de3ff6b11d6c726 # Requis par Flathub pour la sécurité
