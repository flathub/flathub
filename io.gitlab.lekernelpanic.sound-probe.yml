id: io.gitlab.lekernelpanic.sound-probe
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.godotengine.godot.BaseApp
base-version: '4.6'
command: godot-runner
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  - --device=all
modules:
  - name: sound-probe
    buildsystem: simple
    build-commands:
     - ./Godot_v4.6-stable_linux.x86_64 --headless --path ./sound-probe --export-pack "pck"
     - install -Dm644 ./sound-probe/sound-probe.pck ${FLATPAK_DEST}/bin/godot-runner.pck
     - install -Dm644 ./linux/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
     - install -Dm644 ./linux/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
     - install -Dm644 ./svg/icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
    sources:
      - type: archive
        url: https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
        sha256: 6bcc59dfd1d670e918c77eae06e82b9dc5699de13d353dc3a4b3b6b307b6dc06
      - type: git
        url: https://gitlab.com/lekernelpanic/sound-probe.git
        tag: 1.0.6
        commit: 983226170216636b8f41388f041dc412dd7a8304
