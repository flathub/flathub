app-id: com.ismailcherri.apps.yaip
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: yaip
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
modules:
  - name: libass
    buildsystem: autotools
    config-opts: [--disable-static]
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc
        x-checker-data:
          type: json
          url: https://api.github.com/repos/libass/libass/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name == "libass-" + $version + ".tar.xz") | .browser_download_url

  - name: libplacebo
    buildsystem: meson
    config-opts:
      [-Dvulkan=enabled, -Dopengl=enabled, -Ddemos=false, -Dtests=false]
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dmanpage-build=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209
        x-checker-data:
          type: json
          url: https://api.github.com/repos/mpv-player/mpv/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/mpv-player/mpv/archive/refs/tags/v" + $version + ".tar.gz"'

  - name: yaip
    buildsystem: simple
    build-commands:
      - tar -xzf yaip-linux.tar.gz -C /app
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://github.com/ismailcherri/yaip-releases/releases/download/desktop-linux-v1.0.3/yaip-linux-x86_64.tar.gz
        sha256: bb51d231b6abfdb47582f9a3eafeaf73092d4984fc7db16dc1bf3f1b8821d755
        dest-filename: yaip-linux.tar.gz
        x-checker-data:
          type: json
          url: https://api.github.com/repos/ismailcherri/yaip-releases/releases/latest
          version-query: .tag_name | sub("^desktop-linux-v"; "")
          url-query: .assets[] | select(.name == "yaip-linux-x86_64.tar.gz") | .browser_download_url
          timestamp-query: .published_at
          is-main-source: true
      - type: file
        only-arches: [aarch64]
        url: https://github.com/ismailcherri/yaip-releases/releases/download/desktop-linux-v1.0.3/yaip-linux-aarch64.tar.gz
        sha256: bdd81248a9e49d28f86370c2308794f027c634eb51bfd110db36da8b74ad988f
        dest-filename: yaip-linux.tar.gz
        x-checker-data:
          type: json
          url: https://api.github.com/repos/ismailcherri/yaip-releases/releases/latest
          version-query: .tag_name | sub("^desktop-linux-v"; "")
          url-query: .assets[] | select(.name == "yaip-linux-aarch64.tar.gz") | .browser_download_url
          timestamp-query: .published_at
