app-id: com.ismailcherri.apps.yaip
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: yaip
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager
modules:
  - name: libass
    buildsystem: autotools
    config-opts: [--disable-static]
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc

  - name: libplacebo
    buildsystem: meson
    config-opts:
      [-Dvulkan=enabled, -Dopengl=enabled, -Ddemos=false, -Dtests=false]
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dmanpage-build=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

  - name: yaip
    buildsystem: simple
    only-arches: [x86_64]
    build-commands:
      - tar -xzf yaip-linux-x86_64.tar.gz -C /app
    sources:
      - type: file
        url: https://github.com/ismailcherri/yaip-releases/releases/download/desktop-linux-v1.0.2/yaip-linux-x86_64.tar.gz
        sha256: 47b743439b32f0c837a0ef4f06ed194ab17306fee2ffa3cf74de7f86b59bb9ed
