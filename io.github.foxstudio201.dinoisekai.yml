id: io.github.foxstudio201.dinoisekai
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: run.sh
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --env=ELECTRON_TRASH=gio
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
build-options:
  append-path: /usr/lib/sdk/node24/bin
  cflags: -O2 -g
  cxxflags: -O2 -g
  env:
    NPM_CONFIG_LOGLEVEL: info
modules:
  - name: dino-isekai
    buildsystem: simple
    subdir: main
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/dino-isekai/flatpak-node/cache
        npm_config_cache: /run/build/dino-isekai/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      - node -e "const f=require('fs');const p=JSON.parse(f.readFileSync('package.json'));p.scripts.postinstall='node scripts/gen-app-secret.cjs';f.writeFileSync('package.json',JSON.stringify(p,null,2))"
      - npm install --offline
      - node -e "const f=require('fs');const p=JSON.parse(f.readFileSync('package.json'));p.build.linux.target='dir';p.build.electronDownload={isVerifyChecksum:false};f.writeFileSync('package.json',JSON.stringify(p,null,2))"
      - |
        . ../flatpak-node/electron-builder-arch-args.sh
        npm run build
        npx electron-builder --linux dir $ELECTRON_BUILDER_ARCH_ARGS
      - cp -a dist-electron/linux*unpacked /app/lib/dino-isekai
      - install -Dm755 -t /app/bin/ ./run.sh
      - install -Dm644 -t /app/share/applications/ io.github.foxstudio201.dinoisekai.desktop
      - install -Dm644 -t /app/share/metainfo/ io.github.foxstudio201.dinoisekai.metainfo.xml
      - install -Dm644 ./public/icon.png /app/share/icons/hicolor/512x512/apps/io.github.foxstudio201.dinoisekai.png
    sources:
      - generated-sources.json
      - type: archive
        url: https://github.com/foxstudio-201/dinoisekailauncher/archive/refs/tags/v4.2.1.tar.gz
        sha256: 946cfb2a6e3108c5006dd30fa51e79386dcc13a7b35da37fd8dbc84115d9abcf
        strip-components: 1
        dest: main
      - type: file
        path: run.sh
        dest: main
      - type: file
        path: io.github.foxstudio201.dinoisekai.desktop
        dest: main
      - type: file
        path: io.github.foxstudio201.dinoisekai.metainfo.xml
        dest: main