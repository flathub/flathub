app-id: com.pouletinteractive.localprose
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: localprose

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-documents
  - --filesystem=~/.localprose:create

modules:
  - name: localprose
    buildsystem: simple
    build-commands:
      - mkdir -p /app/localprose /app/bin
      - cp -a . /app/localprose/
      - rm -f /app/localprose/com.pouletinteractive.localprose.metainfo.xml
      - chmod 755 /app/localprose/localprose
      - |
        if [ -f /app/localprose/runtime/ollama/ollama ]; then chmod 755 /app/localprose/runtime/ollama/ollama; fi
        if [ -f /app/localprose/runtime/ollama/bin/ollama ]; then chmod 755 /app/localprose/runtime/ollama/bin/ollama; fi
        if [ -f /app/localprose/runtime/ollama/lib/ollama/llama-server ]; then chmod 755 /app/localprose/runtime/ollama/lib/ollama/llama-server; fi
        if [ -f /app/localprose/runtime/ollama/lib/ollama/llama-quantize ]; then chmod 755 /app/localprose/runtime/ollama/lib/ollama/llama-quantize; fi
      - |
        cat << 'LAUNCHER' > /app/bin/localprose
        #!/bin/sh
        export LD_LIBRARY_PATH="/app/localprose/lib:/app/localprose/runtime/ollama/lib/ollama${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        exec /app/localprose/localprose "$@"
        LAUNCHER
      - chmod 755 /app/bin/localprose
      - install -Dm644 com.pouletinteractive.localprose.metainfo.xml /app/share/metainfo/com.pouletinteractive.localprose.metainfo.xml
      - |
        python3 - << 'PYICON'
        import shutil, struct
        from pathlib import Path
        p = Path("localprose.png")
        if p.exists():
            with open(p, "rb") as f:
                hdr = f.read(24)
            w, h = struct.unpack(">II", hdr[16:24])
            dest = Path(f"/app/share/icons/hicolor/{w}x{h}/apps")
            dest.mkdir(parents=True, exist_ok=True)
            shutil.copy2(p, dest / "com.pouletinteractive.localprose.png")
        PYICON
      - |
        cat << 'DESKTOP' > com.pouletinteractive.localprose.desktop
        [Desktop Entry]
        Name=LocalProse
        Comment=100% offline novel writing studio with local AI
        Comment[fr]=Atelier d'écriture de romans 100 % hors-ligne avec IA locale
        Comment[de]=100 % Offline-Schreibstudio für Romane mit lokaler KI
        Comment[es]=Estudio de escritura de novelas 100 % sin conexión con IA local
        Comment[it]=Studio di scrittura di romanzi 100% offline con IA locale
        Comment[pt]=Estúdio de escrita de romances 100% offline com IA local
        Comment[nl]=100% offline schrijfstudio voor romans met lokale AI
        Exec=localprose
        Icon=com.pouletinteractive.localprose
        Terminal=false
        Type=Application
        Categories=Office;WordProcessor;
        Keywords=writing;novel;manuscript;worldbuilding;markdown;epub;offline;
        Keywords[fr]=écriture;roman;manuscrit;univers;markdown;epub;hors-ligne;
        Keywords[de]=schreiben;roman;manuskript;weltenbau;markdown;epub;offline;
        Keywords[es]=escritura;novela;manuscrito;mundos;markdown;epub;offline;
        Keywords[it]=scrittura;romanzo;manoscritto;worldbuilding;markdown;epub;offline;
        Keywords[pt]=escrita;romance;manuscrito;mundos;markdown;epub;offline;
        Keywords[nl]=schrijven;roman;manuscript;wereldbouw;markdown;epub;offline;
        StartupWMClass=localprose
        DESKTOP
      - install -Dm644 com.pouletinteractive.localprose.desktop /app/share/applications/com.pouletinteractive.localprose.desktop
      - rm -f com.pouletinteractive.localprose.desktop
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/alexpoulet/localprose-releases/releases/download/v4.0/LocalProse-Setup_4.0.2-linux.tar.gz
        sha256: e3b3509787cb6b76f6375f79f67c9e488bfd00f942ca77c887c1a2d5ef8155d6
        strip-components: 0
      - type: file
        path: com.pouletinteractive.localprose.metainfo.xml
