app-id: io.github.vitao_al.linux-hw-monitor
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: linux-hw-monitor

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/linux-hw-monitor/cargo

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=/sys/class/hwmon:ro
  - --filesystem=/sys/class/thermal:ro
  - --filesystem=/sys/class/power_supply:ro
  - --filesystem=/sys/class/net:ro
  - --filesystem=/sys/class/drm:ro
  - --filesystem=/sys/block:ro
  - --filesystem=/sys/devices:ro
  - --talk-name=org.freedesktop.UPower
  - --system-talk-name=org.freedesktop.hostname1

modules:
  - name: linux-hw-monitor
    buildsystem: meson
    config-opts:
      - -Dprofile=release
    post-install:
      - install -Dm0644 LICENSE -t /app/share/licenses/io.github.vitao_al.linux-hw-monitor/linux-hw-monitor
    sources:
      - type: archive
        url: https://github.com/vitao-al/linux-hw-monitor/archive/refs/tags/v1.0.0.tar.gz
        sha256: 41fbd4cc3680897803f14c60cf50fd7a1a02f125e7ccc2932430391f2ea782cc
        x-checker-data:
          type: json
          url: https://api.github.com/repos/vitao-al/linux-hw-monitor/releases/latest
          version-query: .tag_name | ltrimstr("v")
          url-query: .tarball_url
      - cargo-sources.json
      - type: shell
        commands:
          - mkdir -p .cargo
          - |
            cat > .cargo/config.toml << 'EOF'
            [source.crates-io]
            replace-with = "vendored-sources"

            [source.vendored-sources]
            directory = "cargo/vendor"
            EOF
