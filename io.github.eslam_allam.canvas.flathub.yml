# Flathub copy of flatpak/io.github.eslam_allam.canvas.yml.
#
# Flathub builds run sandboxed and reject build-args, so this manifest builds
# FULLY OFFLINE:
#   - flatpak-sources.json: generated by
#       ./gradlew flatpakGradleGenerator --no-configuration-cache
#     after any dependency change. Contains every direct and transitive
#     dependency (Maven + Gradle plugin artifacts) in an offline-repository/
#     Maven layout, downloaded by flatpak-builder before the build starts.
#   - flatpak-sources-aarch64.json: JavaFX aarch64 natives (hand-maintained;
#     the generator only captures artifacts for the host architecture).
#   - The Gradle distribution itself is pinned below; keep its version in
#     sync with gradle/wrapper/gradle-wrapper.properties.
#
# The build then runs the same Gradle jlink task as local builds, with
# --offline. Note: tag/commit must point at a release that contains these
# offline build changes in build.gradle.kts and settings.gradle.kts (v1.2.5
# predates them — use the first tag created after they land).
app-id: io.github.eslam_allam.canvas
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk25
command: CanvasRubricImporter

finish-args:
  # Canvas API access
  - --share=network
  # JavaFX is X11-only (no native Wayland); runs via XWayland on Wayland sessions
  - --socket=x11
  - --device=dri
  # JavaFX FileChooser does not use xdg-desktop-portal
  - --filesystem=home

build-options:
  append-path: /usr/lib/sdk/openjdk25/bin
  env:
    JAVA_HOME: /usr/lib/sdk/openjdk25/jvm/openjdk-25
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"

modules:
  - name: canvas-rubric-importer
    buildsystem: simple
    build-commands:
      # Unpack the pinned Gradle distribution with the JDK's jar tool
      # (flatpak-builder's archive extraction collides with the repository's
      # own LICENSE/README files when unwrapping the single top dir).
      - mkdir -p .gradle-dist && cd .gradle-dist && jar -xf ../gradle-9.2.0-bin.zip
      - chmod +x .gradle-dist/gradle-9.2.0/bin/gradle
      - ./.gradle-dist/gradle-9.2.0/bin/gradle --offline --no-daemon --console=plain jlink
      # fail fast if the bundled runtime image ever changes shape
      - test -x build/image/bin/CanvasRubricImporter
      - mkdir -p /app/lib/canvas-rubric-importer
      - cp -a build/image/. /app/lib/canvas-rubric-importer/
      - install -Dm755 flatpak/launcher.sh /app/bin/CanvasRubricImporter
      - install -Dm644 flatpak/io.github.eslam_allam.canvas.desktop
        -t /app/share/applications
      - install -Dm644 flatpak/io.github.eslam_allam.canvas.metainfo.xml
        -t /app/share/metainfo
      - install -Dm644 "icons/png/canvas_rubric_importer 128x128.png"
        /app/share/icons/hicolor/128x128/apps/io.github.eslam_allam.canvas.png
      - install -Dm644 "icons/png/canvas_rubric_importer 64x64.png"
        /app/share/icons/hicolor/64x64/apps/io.github.eslam_allam.canvas.png
      - install -Dm644 "icons/png/canvas_rubric_importer 32x32.png"
        /app/share/icons/hicolor/32x32/apps/io.github.eslam_allam.canvas.png
    sources:
      - type: git
        url: https://github.com/eslam-allam/canvas-rubric-importer.git
        tag: v1.2.6
        commit: e2c101275d363210e158a9cd4e1980d050bacbe1
        x-checker-data:
          type: git
          tag-pattern: "^v([\\d.]+)$"
      - type: file
        url: https://services.gradle.org/distributions/gradle-9.2.0-bin.zip
        sha256: df67a32e86e3276d011735facb1535f64d0d88df84fa87521e90becc2d735444
      - flatpak-sources.json
      - flatpak-sources-aarch64.json
