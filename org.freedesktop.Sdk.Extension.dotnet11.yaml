  - name: scripts
    buildsystem: simple
    build-commands:
      - mkdir -p /usr/lib/sdk/dotnet11 /app/share/metainfo
      - cp install.sh install-sdk.sh /usr/lib/sdk/dotnet11/bin
      - cp enable.sh /usr/lib/sdk/dotnet11
      - cp org.freedesktop.Sdk.Extension.dotnet11.metainfo.xml /app/share/metainfo
    sources:
      - type: script
        commands:
          - mkdir -p /app/lib/dotnet
          - mkdir -p /app/bin
          - cp -r /usr/lib/sdk/dotnet11/lib/{dotnet,host,shared} /app/lib/dotnet
          - ln -s /app/lib/dotnet/dotnet /app/bin/dotnet
        dest-filename: install.sh

      - type: script
        commands:
          - /usr/lib/sdk/dotnet11/bin/install.sh
          - cp -r /usr/lib/sdk/dotnet11/lib/sdk /app/lib/dotnet
        dest-filename: install-sdk.sh

      - type: script
        commands:
          - export PATH=$PATH:/usr/lib/sdk/dotnet11/bin
          - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/lib/sdk/dotnet11/lib
          - export DOTNET_CLI_TELEMETRY_OPTOUT=true
          - export DOTNET_NOLOGO=true
          - export DOTNET_ROOT=/usr/lib/sdk/dotnet11/lib
        dest-filename: enable.sh

      - type: file
        path: org.freedesktop.Sdk.Extension.dotnet11.metainfo.xml
