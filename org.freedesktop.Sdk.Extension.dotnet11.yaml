app-id: org.freedesktop.Sdk.Extension.dotnet11
branch: '26.08'
runtime: org.freedesktop.Sdk
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false
modules:
  - name: dotnet-sdk
    buildsystem: simple
    build-commands:
      - mkdir -p /usr/lib/sdk/dotnet11/{bin,lib}
      - cp -r * /usr/lib/sdk/dotnet11/lib
      - ln -s /usr/lib/sdk/dotnet11/lib/dotnet /usr/lib/sdk/dotnet11/bin/dotnet
    sources:
      - type: archive
        url: https://builds.dotnet.microsoft.com/dotnet/Sdk/11.0.100/dotnet-sdk-11.0.100-linux-x64.tar.gz
        sha256: 6fdb8822f47ccdba28f507dcd5d92e632d5b99cd27908d6838f0cc575be33baf
        only-arches: [x86_64]
        x-checker-data:
          type: html
          url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/11.0/latest.version
          version-pattern: ^([\d\.a-z-]+)$
          url-template: https://builds.dotnet.microsoft.com/dotnet/Sdk/$version/dotnet-sdk-$version-linux-x64.tar.gz

      - type: archive
        url: https://builds.dotnet.microsoft.com/dotnet/Sdk/11.0.100/dotnet-sdk-11.0.100-linux-arm64.tar.gz
        sha256: 699951697c76af6ba714fbbe9b45372d1f189d00f303a67ba2e90d53acf630b2
