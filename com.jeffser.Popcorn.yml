id: com.jeffser.Popcorn
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: popcorn
finish-args:
  - '--share=network'
  - '--share=ipc'
  - '--socket=fallback-x11'
  - '--device=dri'
  - '--socket=wayland'
  - '--socket=pulseaudio'
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-docw
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'
