id: com.jeffser.Popcorn
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: popcorn
finish-args:
  - '--share=network'
  - '--share=ipc'
  - '--socket=fallback-x11'
  - '--device=dri'
  - '--socket=wayland'
  - '--socket=pulseaudio'
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-docw
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'
modules:
  - python3-requirements.yaml
  - name: python3-mpris-server
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "mpris-server" --no-build-isolation
    sources:
      - type: file
        url: https://github.com/Jeffser/mpris_server/releases/download/v0.9.1/mpris_server-0.10.0-py3-none-any.whl
        sha256: 14b3c2fd057ca5cf8110d4fe0256a5bc6ad1ccf23474daf31c44728416e6cbbc
      - type: file
        url: https://files.pythonhosted.org/packages/81/69/297302c5f5f59c862faa31e6cb9a4cd74721cd1e052b38e464c5b402df8b/StrEnum-0.4.15-py3-none-any.whl
        sha256: a30cda4af7cc6b5bf52c8055bc4bf4b2b6b14a93b574626da33df53cf7740659
      - type: file
        url: https://files.pythonhosted.org/packages/8f/b7/559f59d57d18b44c6d1250d2eeaa676e028b9c527431f5d0736478a73ba1/Unidecode-1.4.0-py3-none-any.whl
        sha256: c3c7606c27503ad8d501270406e345ddb480a7b5f38827eafe4fa82a137f0021
      - type: file
        url: https://files.pythonhosted.org/packages/e1/5e/4b5aaaabddfacfe36ba7768817bd1f71a7a810a43705e531f3ae4c690767/emoji-2.15.0-py3-none-any.whl
        sha256: 205296793d66a89d88af4688fa57fd6496732eb48917a87175a023c8138995eb
      - type: file
        url: https://files.pythonhosted.org/packages/92/56/27148014c2f85ce70332f18612f921f682395c7d4e91ec103783be4fce00/pydbus-0.6.0-py2.py3-none-any.whl
        sha256: 66b80106352a718d80d6c681dc2a82588048e30b75aab933e4020eb0660bf85e
  - name: popcorn
    builddir: true
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/Jeffser/Popcorn.git
        tag: 0.2.1
        commit: 64c3b238dce49dc50ed75cae653b2ec596896801