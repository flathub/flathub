app-id: nexina.omni.preview
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm19
command: omni_preview
# Build dependencies for zenity (libadwaita)
build-options:
  build-args:
    - --share=network
# Sandbox permissions — review and adjust for your app.
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  - --filesystem=xdg-music
  - --talk-name=org.freedesktop.portal.Documents
  - --talk-name=org.freedesktop.portal.FileChooser
  - --env=GTK_USE_PORTAL=0
modules:
  - name: libass
    buildsystem: meson
    config-opts:
      - -Dtest=false
      - -Dprofile=false
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz
        sha256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959
        x-checker-data:
          type: anitya
          project-id: 1323
          stable-only: true
          url-template: https://github.com/libass/libass/releases/download/$version/libass-$version.tar.xz

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
      - -Dtests=false
      - -Dd3d11=disabled
      - -Dvulkan=disabled
      - -Dlcms=disabled
      - -Dshaderc=disabled
      - -Dglslang=disabled
      - --prefix=/app
    build-options:
      env:
        PKG_CONFIG_PATH: /app/lib64/pkgconfig:/usr/lib64/pkgconfig:/usr/share/pkgconfig
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v6.338.2
        commit: 25ff836306a30e303ea524d1e276a51f2866e7f0

  - name: mpv
    buildsystem: meson
    build-options:
      build-args:
        - --share=network
      env:
        PKG_CONFIG_PATH: /app/lib64/pkgconfig:/usr/lib64/pkgconfig:/usr/share/pkgconfig
    config-opts:
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dpdf-build=disabled
      - -Dcplayer=false
      - -Dlibmpv=true
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dvulkan=disabled
      - -Dcaca=disabled
      - -Ddrm=disabled
      - -Dgbm=disabled
      - -Dwayland=disabled
      - -Dx11=disabled
      - -Dsdl2=disabled
      - -Dshaderc=disabled
      - -Dlcms2=disabled
      - -Duchardet=disabled
      - -Drubberband=disabled
      - -Dlibarchive=disabled
      - -Dzimg=disabled
      - -Dvapoursynth=disabled
      - -Dlibbluray=disabled
      - -Ddvdnav=disabled
      - -Dcdda=disabled
      - -Dlibavdevice=disabled
      - -Dvaapi=disabled
      - -Dvaapi-x11=disabled
      - -Dvaapi-drm=disabled
      - -Dvaapi-wayland=disabled
      - -Dvdpau=disabled
      - -Dvdpau-gl-x11=disabled
      - -Dgl=disabled
      - -Degl=disabled
      - -Degl-x11=disabled
      - -Degl-drm=disabled
      - -Degl-wayland=disabled
      - -Dplain-gl=disabled
      - -Dxv=disabled
