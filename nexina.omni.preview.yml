        sha256: 86d9ef40b6058732f67b46d0bbda24a074fae860b3eaae05bab3145041303066
        x-checker-data:
          type: anitya
          project-id: 12345
          stable-only: true
          url-template: https://github.com/mpv-player/mpv/archive/refs/tags/v$version.tar.gz

  - name: preview
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/llvm19/bin:/var/lib/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm19/lib:/app/lib64
      env:
        PUB_CACHE: /run/build/preview/.pub-cache
        PKG_CONFIG_PATH: /app/lib64/pkgconfig:/usr/lib64/pkgconfig:/usr/share/pkgconfig
        LDFLAGS: -L/app/lib64 -Wl,-rpath,/app/lib64
    # Build steps — review and customise for your project.
    build-commands:
      - mkdir -p /app/preview
      - cp -r omni-preview-linux-x64-1.0.1/. /app/preview/
      - install -Dm755 preview-wrapper.sh /app/bin/omni_preview
      - install -Dm644 nexina.omni.preview.metainfo.xml /app/share/metainfo/nexina.omni.preview.metainfo.xml
      - install -Dm644 nexina.omni.preview.desktop /app/share/applications/nexina.omni.preview.desktop
      - install -Dm644 nexina.omni.preview.png /app/share/icons/hicolor/256x256/apps/nexina.omni.preview.png
    sources:
