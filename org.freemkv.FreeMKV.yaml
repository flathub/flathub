# Flathub-ready Flatpak manifest for freemkv.
#
# Build model: OFFLINE. Flathub's builder has no network during the build
# phase, so nothing here runs `cargo build` against the network. Instead:
#   * The app source is fetched by pinned git tag + commit (v1.7.6).
#   * Every cargo dependency (crates.io tarballs AND the freemkv-* git
#     siblings) is vendored via `cargo-sources.json`, generated by
#     flatpak-builder-tools' flatpak-cargo-generator.py from the Cargo.lock
#     at tag v1.7.6. That file drops a `cargo/config` that redirects
#     crates.io and each `git+` source to `cargo/vendor`, so the build runs
#     with `cargo --offline`.
#   * The freemkv workspace resolves its siblings (libfreemkv,
#     freemkv-engine, freemkv-keysources, freemkv-i18n, and transitively
#     freemkv-unlock) through a `[patch.crates-io]` git-tag redirect in
#     Cargo.toml; the generator captured all five as vendored git sources.
#
# WHY runtime 51: org.gnome.Platform 51 is the CURRENT stable GNOME runtime
# on Flathub (GNOME 51 shipped 2026-09-16) and Flathub requires new
# submissions to target the latest runtime. It carries GTK4 (>=4.10) and
# libadwaita (>=1.4), which the gtk4-rs / libadwaita-rs crates need.
#
# NOTE: the Linux desktop GUI is BETA (first shipped in 1.7.6). The CLI is
# mature; the GTK4 shell is new.

app-id: org.freemkv.FreeMKV
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: freemkv

finish-args:
  # GTK4 desktop app: Wayland first, X11 fallback for X sessions.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # WHY --device=all: freemkv reads the optical drive with raw SG_IO SCSI
  # ioctls (/dev/sr0, /dev/sg1) to derive AACS keys and do multi-pass sector
  # reads. There is no XDG portal for a raw SCSI device, so no
  # less-privileged alternative exists; --device=all is the accepted answer
  # for optical-media rippers on Flathub (same grant MakeMKV uses). Kept as
  # tight as possible otherwise.
  - --device=all

  # Default rip-output destinations. Anything else the user picks arrives
  # through the GtkFileDialog portal, so there is no blanket home grant.
  - --filesystem=xdg-videos
  - --filesystem=xdg-download

  # Outbound HTTPS for the key-database fetch and update check. No inbound
  # network is opened. (Desktop notifications use the portal, which is
  # available by default and needs no finish-arg.)
  - --share=network

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/freemkv/cargo

modules:
  - name: freemkv
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --bin freemkv
      - install -Dm755 target/release/freemkv /app/bin/freemkv
      # The .desktop, AppStream metainfo and icon. The .desktop and metainfo
      # are shipped alongside this manifest (not taken from the immutable
      # v1.7.6 tag) so Flathub-specific metadata fixes don't require an
      # upstream re-release. The icon comes from the tagged source tree.
      - install -Dm644 org.freemkv.FreeMKV.desktop
          /app/share/applications/org.freemkv.FreeMKV.desktop
      - install -Dm644 org.freemkv.FreeMKV.metainfo.xml
          /app/share/metainfo/org.freemkv.FreeMKV.metainfo.xml
      - install -Dm644 res/freemkv-icon.svg
          /app/share/icons/hicolor/scalable/apps/org.freemkv.FreeMKV.svg
    sources:
      # App source: pinned to the released tag AND its commit SHA.
      - type: git
        url: https://github.com/freemkv/freemkv.git
        tag: v1.7.6
        commit: 1ad50de6a0bafae1d404ec544951215d0ca25210
      # Flathub-maintained metadata, colocated with the manifest.
      - type: file
        path: org.freemkv.FreeMKV.desktop
      - type: file
        path: org.freemkv.FreeMKV.metainfo.xml
      # Vendored cargo dependencies (crates.io tarballs + git siblings).
      - cargo-sources.json
