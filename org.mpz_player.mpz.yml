id: org.mpz_player.mpz
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: mpz

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  - --share=network
  - --own-name=org.mpris.MediaPlayer2.mpz
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=host

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '24.08'
    add-ld-path: .
    no-autodownload: false
    autodelete: false

cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/lib/ffmpeg

modules:
  - name: mpz
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_UPDATE_CHECK=OFF
      - -DENABLE_QHOTKEY=OFF
    sources:
      - type: git
        url: https://github.com/olegantonyan/mpz.git
        tag: '2.1.1'
        commit: acb3fc3fdf76564c04d68948b97ff8c11c494db7
        x-checker-data:
          type: git
          tag-pattern: '^([\d.]+)$'
