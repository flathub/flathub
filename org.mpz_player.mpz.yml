id: org.mpz_player.mpz
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: mpz

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  - --share=network
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=home
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=/run/media

modules:
  - name: mpz
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_UPDATE_CHECK=OFF
      - -DENABLE_QHOTKEY=OFF
    sources:
      - type: git
        url: https://github.com/olegantonyan/mpz.git
        tag: 2.1.2
        commit: 41e5532873e339d72dc12a5218c80869b499c426
