app-id: dev.dataheroes.Inkhero
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: inkhero
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: inkhero
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/inkhero -t ${FLATPAK_DEST}/bin
      - mkdir -p ${FLATPAK_DEST}/share
      - cp -r share/. ${FLATPAK_DEST}/share/
    sources:
      - type: archive
        url: https://dataheroes.dev/inkhero/download/inkhero-1.0.0-x86_64.tar.xz
        sha256: 93e69ae4b6af3efcc45ea859a14b4aef24cc34560925bfdabfa29b8d197c3bcc
        strip-components: 0
