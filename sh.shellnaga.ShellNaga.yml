# Shell'Naga (https://shellnaga.sh). The binary is the official release build (reproducible, Ubuntu 22.04,
# glibc 2.35), published at shellnaga.sh and pinned here by SHA-256; nothing is compiled in this manifest
# (the source is closed, license LicenseRef-proprietary: https://shellnaga.sh/eula/).
app-id: sh.shellnaga.ShellNaga
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: shellnaga

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=ssh-auth
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.a11y.Bus
  - --device=all
  - --filesystem=home
  - --filesystem=xdg-config/shellnaga:create

modules:
  - name: shellnaga
    buildsystem: simple
    build-commands:
      - install -Dm755 shellnaga ${FLATPAK_DEST}/bin/shellnaga
      - install -Dm644 THIRD-PARTY-NOTICES.txt ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/THIRD-PARTY-NOTICES.txt
      - install -Dm644 EULA.txt ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/EULA.txt
      - install -Dm644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 shellnaga.1 ${FLATPAK_DEST}/share/man/man1/shellnaga.1
      - mkdir -p ${FLATPAK_DEST}/share/icons && cp -r icons/hicolor ${FLATPAK_DEST}/share/icons/
    sources:
      - type: file
        url: https://shellnaga.sh/downloads/linux/flatpak/shellnaga-0.2.10-x86_64
        sha256: '3710a003161599b0e886e8ea6849ca8b26f00f4d5bc3ddf6d98c47f86fa76c17'
        dest-filename: shellnaga
      - type: file
        url: https://shellnaga.sh/downloads/linux/flatpak/THIRD-PARTY-NOTICES-0.2.10.txt
        sha256: '721f29f8c3f9f0b1c443ac089b93b83d96b6b6b734125a273ef23bab1045c035'
        dest-filename: THIRD-PARTY-NOTICES.txt
      - type: dir
        path: share
