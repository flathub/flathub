app-id: dev.mabdullayev.nurulislam.App
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: nurulislam-desktop

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --socket=pulseaudio
  - --share=network

modules:
  - name: nurulislam
    buildsystem: simple
    build-commands:
      - install -Dm755 nurulislam-desktop /app/bin/nurulislam-desktop
      - install -Dm644 dev.mabdullayev.nurulislam.App.desktop /app/share/applications/dev.mabdullayev.nurulislam.App.desktop
      - install -Dm644 dev.mabdullayev.nurulislam.App.metainfo.xml /app/share/metainfo/dev.mabdullayev.nurulislam.App.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/dev.mabdullayev.nurulislam.App.png
      - install -Dm644 icon-192.png /app/share/icons/hicolor/192x192/apps/dev.mabdullayev.nurulislam.App.png
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/dev.mabdullayev.nurulislam.App.svg
      - mkdir -p /app/share/nurulislam/www
      - cp -r www/* /app/share/nurulislam/www/
    sources:
      - type: archive
        url: https://nurulislam.mabdullayev.dev/linux/nurulislam-linux-1.8.56.tar.gz
        sha256: 86143d0a4ff22fafd29af41b4706d373cf55f4ed099e16b87ca91239c7c818c1
