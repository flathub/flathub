id: com.andr2i.scrolex
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: scrolex

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # documents opened from a file manager arrive through the document portal
  - --file-forwarding
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-download:ro

modules:
  - name: scrolex
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
      env:
        CARGO_HOME: /run/build/scrolex/cargo
        # mupdf-sys compiles its bundled C library and runs bindgen, which
        # needs libclang from the llvm SDK extension.
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
    build-commands:
      - cargo build --offline --release
      - install -Dm755 target/release/scrolex /app/bin/scrolex
      - install -Dm644 resources/icon-64.png /app/share/icons/hicolor/64x64/apps/com.andr2i.scrolex.png
      - install -Dm644 resources/icon-128.png /app/share/icons/hicolor/128x128/apps/com.andr2i.scrolex.png
      - install -Dm644 resources/icon-256.png /app/share/icons/hicolor/256x256/apps/com.andr2i.scrolex.png
      - install -Dm644 resources/icon-512.png /app/share/icons/hicolor/512x512/apps/com.andr2i.scrolex.png
      - install -Dm644 resources/com.andr2i.scrolex.desktop /app/share/applications/com.andr2i.scrolex.desktop
      # @@ marks the file arguments flatpak exports into the document portal
      - desktop-file-edit --set-key=Exec --set-value="scrolex @@ %f @@" /app/share/applications/com.andr2i.scrolex.desktop
      - install -Dm644 resources/com.andr2i.scrolex.metainfo.xml /app/share/metainfo/com.andr2i.scrolex.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/com.andr2i.scrolex/LICENSE
      - install -Dm644 cargo/vendor/mupdf-sys-*/mupdf/COPYING /app/share/licenses/com.andr2i.scrolex/mupdf-COPYING
    sources:
      - type: git
        url: https://github.com/molecule-man/scrolex.git
        tag: 0.7.3
        commit: cbaef666686b59a2f036abb5ccca5906cf9d6be0
      - cargo-sources.json
