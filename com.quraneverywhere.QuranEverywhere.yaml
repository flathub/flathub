app-id: com.quraneverywhere.QuranEverywhere
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: quran_everywhere
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: quran-everywhere
    buildsystem: simple
    build-commands:
      - install -Dm755 quran-everywhere.sh /app/bin/quran_everywhere
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm644 com.quraneverywhere.QuranEverywhere.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 com.quraneverywhere.QuranEverywhere.desktop -t /app/share/applications/
      - install -Dm644 64.png /app/share/icons/hicolor/64x64/apps/com.quraneverywhere.QuranEverywhere.png
      - install -Dm644 128.png /app/share/icons/hicolor/128x128/apps/com.quraneverywhere.QuranEverywhere.png
      - install -Dm644 256.png /app/share/icons/hicolor/256x256/apps/com.quraneverywhere.QuranEverywhere.png
    sources:
      - type: extra-data
        only-arches: [x86_64]
        filename: quran-everywhere.tar.gz
        url: https://github.com/TN19N/quran-everywhere-linux/releases/download/v1.0.0+45/quran-everywhere-1.0.0+45-x86_64.tar.gz
        sha256: ddc6d4759b1a83d37d0124f7de6f260ae4d7b4bf863bd9700458c89e26c50566
        size: 110219752

      - type: extra-data
        only-arches: [aarch64]
        filename: quran-everywhere.tar.gz
        url: https://github.com/TN19N/quran-everywhere-linux/releases/download/v1.0.0+45/quran-everywhere-1.0.0+45-aarch64.tar.gz
        sha256: 9c5b4168bf79eebcb6fdb71e03eda322fead91b6ca8a5911caea28bf6515e515
        size: 92274361

      - type: script
        dest-filename: apply_extra
        commands:
          - tar xf quran-everywhere.tar.gz
          - rm quran-everywhere.tar.gz

      # media_kit dlopen()s libmpv by bare name, so the bundled lib/ has to be on
      # LD_LIBRARY_PATH.
      - type: script
        dest-filename: quran-everywhere.sh
        commands:
          - export LD_LIBRARY_PATH="/app/extra/lib:${LD_LIBRARY_PATH}"
          - exec /app/extra/quran_everywhere "$@"

      - type: file
        path: com.quraneverywhere.QuranEverywhere.metainfo.xml
      - type: file
        path: com.quraneverywhere.QuranEverywhere.desktop
      - type: file
        path: 64.png
      - type: file
        path: 128.png
      - type: file
        path: 256.png
