  - name: hedgewars
    buildsystem: cmake
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    post-install:
      - |
        for res in 16 32 48 64 128 256 512; do
          if [ ${res} -le 32 ]; then
            src=misc/hedgewars_ico.png
          else
