app-id: io.github.seinedkoda.kisel
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: kisel

finish-args:
  - --socket=wayland
  - --socket=x11
  - --device=dri # Hardware acceleration
  - --share=ipc # For Qt
  - --share=network
  - --socket=pulseaudio
  - --allow=bluetooth
  - --allow=multiarch # Enable 32-bit libs support
  - --allow=per-app-dev-shm # Shared memory
  - --device=all
  - --talk-name=org.kde.StatusNotifierWatcher # Tray icon
  - --system-talk-name=org.freedesktop.UDisks2 # Mounted Devices
  - --filesystem=home
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=/run/media
  - --env=PATH=/app/bin:/usr/bin:/usr/lib/extensions/vulkan/MangoHud/bin:/usr/lib/extensions/vulkan/OBSVkCapture/bin

modules:
  - name: icoutils
    buildsystem: simple
    build-commands:
      - ar x icoutils.deb
      - tar xf data.tar.*
      - cp -r usr/bin /app/
    sources:
      - type: file
        url: https://ftp.debian.org/debian/pool/main/i/icoutils/icoutils_0.32.3-6_amd64.deb
        sha256: 16a1b2b359ef3d90e9b83b8cf44ce58b11f097c023d02f3bf77745362a6f7247
        dest-filename: icoutils.deb

  - name: winetricks
    buildsystem: simple
    build-commands:
      - install -Dm755 src/winetricks /app/bin/winetricks
    sources:
      - type: archive
        url: https://github.com/Winetricks/winetricks/archive/refs/tags/20260125.tar.gz
        sha256: 2890bd9fbbade4638e58b4999a237273192df03b58516ae7b8771e09c22d2f56

  - name: umu-launcher
    buildsystem: simple
    build-commands:
      - install -Dm755 umu-run /app/bin/umu-run
      - install -Dm644 LICENSE /app/share/licenses/umu-launcher/LICENSE
    sources:
      - type: archive
        url: https://github.com/Open-Wine-Components/umu-launcher/releases/download/1.4.4/umu-launcher-1.4.4-zipapp.tar
        sha256: eb590691841f7fad3fc3ad8fd5db4ccb87849fe7948e62b28ece7a4ee48cc851
      - type: file
        url: https://raw.githubusercontent.com/Open-Wine-Components/umu-launcher/cf3d1b107147480c447ffbfb3f789dc74335074c/LICENSE
        sha256: 3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986

  - name: kisel
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DINSTALL_UMU=OFF
    sources:
      - type: archive
        url: https://github.com/seinedkoda/kisel/archive/refs/tags/v1.3.2.tar.gz
        sha256: 6cbc58aa6a0440bea4e09eb830395ef91978ace841acb15760c0ba5ffd54b821
