id: net.silentclient.SilentClient
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
separate-locales: false
command: silentclient-launcher
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --persist=.minecraft
  - --persist=.silentclient
  - --persist=.java
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: silentclient
    buildsystem: simple
    build-commands:
      - install -Dm755 -t ${FLATPAK_DEST}/bin/ apply_extra silentclient-launcher
      - install -Dm644 -t ${FLATPAK_DEST}/share/applications/ net.silentclient.SilentClient.desktop
      - install -Dm644 -t ${FLATPAK_DEST}/share/metainfo/ net.silentclient.SilentClient.metainfo.xml
      - install -Dm644 net.silentclient.SilentClient.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
    sources:
      - type: script
        dest-filename: silentclient-launcher
        commands:
          - unset APPIMAGE APPDIR
          - exec zypak-wrapper /app/extra/silentclient/silentclient-launcher.bin "$@"

      - type: script
        dest-filename: apply_extra
        commands:
          - set -eu
          - cd /app/extra
          - bsdtar --to-stdout -xf silentclient.deb 'data.tar*' | bsdtar --no-same-owner -xf -
          - mv 'opt/Silent Client' silentclient
          - rm -rf opt usr silentclient.deb

      - type: extra-data
        only-arches: [x86_64]
        filename: silentclient.deb
        url: https://cdn.silentclient.net/silentclient-assets/releases/launcher/linux/x64/5.3.1/e3ca6ff01f59/silentclient-launcher_5.3.1_amd64.deb
        sha256: e3ca6ff01f599054a5cb6fba7c948f45e6b28185a1166a2ef8796a885b1c8856
        size: 125133276
        x-checker-data:
          type: json
          url: https://api.silentclient.net/branches/releases/download/launcher?platform=linux&arch=x64&format=deb
          version-query: .version
          url-query: .url
          is-main-source: true

      - type: file
        path: net.silentclient.SilentClient.png

      - type: file
        path: net.silentclient.SilentClient.desktop

      - type: file
        path: net.silentclient.SilentClient.metainfo.xml
