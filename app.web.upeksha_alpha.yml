app-id: app.web.upeksha_alpha
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: upeksha

finish-args:
  # Wayland and X11 graphics access
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Hardware 3D Acceleration
  - --device=dri
  # PulseAudio / PipeWire Sound Server (Timer audio alerts)
  - --socket=pulseaudio
  # Network connectivity for Firebase Auth & Firestore sync
  - --share=network

modules:
  - name: upeksha
    buildsystem: simple
    build-commands:
      # 1. Setup target directory layout
      - install -d /app/bin
      - install -d /app/upeksha
      - install -d /app/share/applications
      - install -d /app/share/metainfo
      - install -d /app/share/icons/hicolor/128x128/apps

      # 2. Install Flutter application bundle
      - cp -r bundle/* /app/upeksha/
      - chmod +x /app/upeksha/upeksha

      # 3. Create launcher script
      - |
        cat << 'EOF' > /app/bin/upeksha
        #!/bin/sh
        exec /app/upeksha/upeksha "$@"
        EOF
      - chmod +x /app/bin/upeksha

      # 4. Install Desktop Entry, Metainfo, and Icon from the upstream bundle
      - install -Dm644 bundle/app.web.upeksha_alpha.desktop /app/share/applications/app.web.upeksha_alpha.desktop
      - install -Dm644 bundle/app.web.upeksha_alpha.metainfo.xml /app/share/metainfo/app.web.upeksha_alpha.metainfo.xml
      - install -Dm644 bundle/app.web.upeksha_alpha.png /app/share/icons/hicolor/128x128/apps/app.web.upeksha_alpha.png

    sources:
      - type: archive
        url: https://github.com/ksdmahesh/flathub/releases/download/v1.0.0-alpha.35/upeksha-linux-v1.0.0-alpha.35+8dc5771.tar.gz
        sha256: <NEW_SHA256_FROM_STEP_1>
        dest: bundle
        only-arches:
          - x86_64
