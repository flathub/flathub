app-id: app.web.upeksha_alpha
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: upeksha

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network

modules:
  - name: upeksha
    buildsystem: simple
    build-commands:
      - install -d /app/bin
      - install -d /app/upeksha
      - cp -r * /app/upeksha/
      - chmod +x /app/upeksha/upeksha
      - ln -s /app/upeksha/upeksha /app/bin/upeksha
      - install -Dm644 app.web.upeksha_alpha.desktop /app/share/applications/app.web.upeksha_alpha.desktop
      - install -Dm644 app.web.upeksha_alpha.metainfo.xml /app/share/metainfo/app.web.upeksha_alpha.metainfo.xml
      - install -Dm644 app.web.upeksha_alpha.png /app/share/icons/hicolor/512x512/apps/app.web.upeksha_alpha.png

    sources:
      - type: archive
        url: https://github.com/ksdmahesh/flathub/releases/download/v1.0.0-alpha.35/upeksha-linux-v1.0.0-alpha.35+8dc5771.tar.gz
        sha256: 09f14c4732e5db4d8114e80e605a6a222a852e2428613ad6673d811125746b70
