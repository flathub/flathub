app-id: app.web.upeksha_alpha
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: upeksha

finish-args:
  # Wayland and X11 graphics access
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Hardware 3D Acceleration
  - --device=dri
  # PulseAudio / PipeWire Sound Server (Timer audio alerts)
  - --socket=pulseaudio
  # Network connectivity for Firebase Auth & Firestore sync
  - --share=network

modules:
  - name: upeksha
    buildsystem: simple
    build-commands:
      # 1. Setup target directory layout
      - install -d /app/bin
      - install -d /app/upeksha
      - install -d /app/share/applications
      - install -d /app/share/metainfo
      - install -d /app/share/icons/hicolor/128x128/apps

      # 2. Install Flutter application bundle (binaries, dynamic libraries, and assets)
      - cp -r bundle/* /app/upeksha/
      - chmod +x /app/upeksha/upeksha

      # 3. Create launcher script
      - |
        cat << 'EOF' > /app/bin/upeksha
        #!/bin/sh
        exec /app/upeksha/upeksha "$@"
        EOF
      - chmod +x /app/bin/upeksha

      # 4. Install Desktop Entry and AppStream Metainfo
      - install -Dm644 app.web.upeksha_alpha.desktop /app/share/applications/app.web.upeksha_alpha.desktop
      - install -Dm644 app.web.upeksha_alpha.metainfo.xml /app/share/metainfo/app.web.upeksha_alpha.metainfo.xml

      # 5. Install Icon
      - install -Dm644 app.web.upeksha_alpha.png /app/share/icons/hicolor/128x128/apps/app.web.upeksha_alpha.png

    sources:
      - type: archive
        url: https://github.com/ksdmahesh/upeksha/releases/download/v1.0.0-alpha.35%2B8dc5771/upeksha-linux-v1.0.0-alpha.35+8dc5771.tar.gz
        sha256: 04ec8f4d4cf9e6a9bd43b1282c68ad8d9b22c2ccb938125f56ea11de44e070cd
        dest: bundle
      - type: file
        path: app.web.upeksha_alpha.desktop
      - type: file
        path: app.web.upeksha_alpha.metainfo.xml
      - type: file
        path: app.web.upeksha_alpha.png

