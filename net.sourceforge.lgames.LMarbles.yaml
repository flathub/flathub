app-id: net.sourceforge.lgames.LMarbles
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: lmarbles
rename-icon: lmarbles
rename-appdata-file: lmarbles.metainfo.xml
rename-desktop-file: lmarbles.desktop
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
cleanup:
  - /share/man
modules:
  - shared-modules/SDL2/SDL2_mixer.json
  - name: LMarbles
    buildsystem: autotools
    build-options:
      # A quick fix for: `fatal error: SDL_mixer.h: No such file or directory` error
      cflags: -I/app/include/SDL2
    post-install:
      - install -Dm644 lmarbles.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: archive
        url: https://sourceforge.net/projects/lgames/files/lmarbles/lmarbles-1.2.tar.gz
        sha256: 9a03852bb22f22c90257af5c49c3571bdfaee182a5c6ec81ece21008d38798b0
        x-checker-data:
          type: anitya
          project-id: 8578
          stable-only: true
          url-template: https://sourceforge.net/projects/lgames/files/lmarbles/lmarbles-$version.tar.gz
      - type: file
        path: lmarbles.metainfo.xml
      - type: patch
        path: desktop.patch
      # Fix `configure: error: cannot guess build type; you must specify one` error
      - type: shell
        commands:
          - cp -p /usr/share/automake-*/config.{sub,guess} .
