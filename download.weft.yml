id: download.weft.weft
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: weft
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
modules:
  - name: weft 
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/weft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo build --offline --release
      - install -Dm0755 target/release/weft ${FLATPAK_DEST}/bin/weft
      - install -d ${FLATPAK_DEST}/bin/assets/core && cp -a crates/engine/assets/. ${FLATPAK_DEST}/bin/assets/core/
      - install -Dm0755 target/release/libbase.so ${FLATPAK_DEST}/bin/libbase.so && install -d ${FLATPAK_DEST}/bin/mods && cp -a mods/. ${FLATPAK_DEST}/bin/mods/
      - pwd
      - install -Dm644 metafiles/download.weft.metainfo.xml ${FLATPAK_DEST}/share/metainfo/download.weft.metainfo.xml
      - install -Dm644 metafiles/download.weft.desktop ${FLATPAK_DEST}/share/applications/download.weft.desktop
      - install -Dm644 metafiles/logo.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/download.weft.png
    sources:
      - type: git 
        url: https://github.com/Weft-Rust/Weft
        commit: 571ad03faf9897b72245ee35a45b6c0a4844dcbb
      - cargo-sources.json
