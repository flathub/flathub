id: download.weft.weft
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: weft
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
modules:
  - name: weft 
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/weft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo build --offline --release
      - install -Dm0755 target/release/weft ${FLATPAK_DEST}/bin/weft
      - install -d ${FLATPAK_DEST}/bin/assets/core && cp -a crates/engine/assets/. ${FLATPAK_DEST}/bin/assets/core/
      - install -Dm0755 target/release/libbase.so ${FLATPAK_DEST}/bin/libbase.so && install -d ${FLATPAK_DEST}/bin/mods && cp -a mods/. ${FLATPAK_DEST}/bin/mods/
      - install -Dm644 download.weft.weft.metainfo.xml /app/share/metainfo/download.weft.weft.metainfo.xml
      - install -Dm644 download.weft.weft.desktop /app/share/applications/download.weft.weft.desktop
      - install -Dm644 logo.png /app/share/icons/hicolor/256x256/apps/download.weft.weft.png
    sources:
      - type: archive
        url: https://github.com/Weft-Rust/Weft/archive/refs/tags/v26.11.4.tar.gz
        sha256: 5aeca0bc12b0fdc9b7daf909fe739e95af49baab44ad36e712dbe2c0760ea835 
        dest-filename: v26.11.4.tar.gz
      - cargo-sources.json
      - type: file
        path: metafiles/download.weft.metainfo.xml
      - type: file
        path: metafiles/download.weft.desktop
      - type: file
        path: metafiles/logo.png

