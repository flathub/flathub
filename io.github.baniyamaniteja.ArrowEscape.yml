id: io.github.baniyamaniteja.ArrowEscape
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: arrow-escape

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: arrow-escape
    buildsystem: simple

    build-commands:
      - install -Dm755 arrow-escape.py /app/bin/arrow-escape
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/io.github.baniyamaniteja.ArrowEscape.png
      - install -Dm644 io.github.baniyamaniteja.ArrowEscape.desktop /app/share/applications/io.github.baniyamaniteja.ArrowEscape.desktop
      - install -Dm644 io.github.baniyamaniteja.ArrowEscape.metainfo.xml /app/share/metainfo/io.github.baniyamaniteja.ArrowEscape.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/io.github.baniyamaniteja.ArrowEscape/LICENSE
      - mkdir -p /app/share/arrow-escape
      - cp -a www /app/share/arrow-escape/

    sources:
      - type: git
        url: https://github.com/baniyamaniteja/ArrowEscape.git
        tag: V4.2.7
        commit: ddfbb88cb83d753ed22ef35d0deacd4ee2016b75
