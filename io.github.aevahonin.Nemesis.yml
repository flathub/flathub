app-id: io.github.aevahonin.Nemesis

runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk

command: nemesis
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-music

modules:
  - name: nemesis
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/nemesis -t /app/bin
      - install -Dm644 share/applications/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps/
      - cp /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.mini.svg
      - install -Dm644 share/metainfo/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/aevahonin/Nemesis/releases/download/0.1.9/nemesis-0.1.9-linux-x86_64.tar.gz
        sha256: f22805e037699883a71e02be181690cb5b7b374a9006e7bee1e7a20b71ef94e0
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/aevahonin/Nemesis/releases/download/0.1.9/nemesis-0.1.9-linux-aarch64.tar.gz
        sha256: 8e58f8b56ca56ea6acbba3b1b631e1aa99b4d6600ccd3f2b6fff8301cd4e44c7
