app-id: io.github.aevahonin.Nemesis

runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk

command: nemesis
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-music
  - --filesystem=/run/media
  - --filesystem=/mnt

modules:
  - name: nemesis
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/nemesis -t /app/bin
      - install -Dm644 share/applications/io.github.aevahonin.Nemesis.desktop
        /app/share/applications/io.github.aevahonin.Nemesis.desktop
      - install -Dm644 share/icons/hicolor/scalable/apps/io.github.aevahonin.Nemesis.svg
        /app/share/icons/hicolor/scalable/apps/io.github.aevahonin.Nemesis.svg
      - install -Dm644 io.github.aevahonin.Nemesis.metainfo.xml
        /app/share/metainfo/io.github.aevahonin.Nemesis.metainfo.xml
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/aevahonin/Nemesis/releases/download/0.1.8/nemesis-0.1.8-linux-x86_64.tar.gz
        sha256: 322421987919170bc7660cb3113970522e355208224196af02aa96636972a10f
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/aevahonin/Nemesis/releases/download/0.1.8/nemesis-0.1.8-linux-aarch64.tar.gz
        sha256: 10399ccd9064866d6615c52bd60489e2ae467b03466ec3e5261801c5bfa7461a
      - type: file
        path: io.github.aevahonin.Nemesis.metainfo.xml
