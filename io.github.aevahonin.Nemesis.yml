app-id: io.github.aevahonin.Nemesis

runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk

command: nemesis
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-music
  - --filesystem=/run/media
  - --filesystem=/mnt
  - --own-name=org.mpris.MediaPlayer2.nemesis
  - --own-name=org.mpris.MediaPlayer2.nemesis.*

modules:
  - name: nemesis
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/nemesis -t /app/bin
      - install -Dm644 share/applications/io.github.aevahonin.Nemesis.desktop
        /app/share/applications/io.github.aevahonin.Nemesis.desktop
      - install -Dm644 share/icons/hicolor/scalable/apps/io.github.aevahonin.Nemesis.svg
        /app/share/icons/hicolor/scalable/apps/io.github.aevahonin.Nemesis.svg
      - install -Dm644 io.github.aevahonin.Nemesis.metainfo.xml
        /app/share/metainfo/io.github.aevahonin.Nemesis.metainfo.xml
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/aevahonin/Nemesis/releases/download/0.1.5/nemesis-0.1.5-linux-x86_64.tar.gz
        sha256: 4a3724612c268dd6f2802dd5f286d52d7f185d8490dd302ede06301907940c0a
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/aevahonin/Nemesis/releases/download/0.1.5/nemesis-0.1.5-linux-aarch64.tar.gz
        sha256: 497ab18da651117d9cf189f80d2e3b36e862cd7945444eaed37612990ee4c42f
      - type: file
        path: io.github.aevahonin.Nemesis.metainfo.xml
