app-id: io.github.aevahonin.Nemesis

runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk

command: nemesis
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-music
  - --filesystem=/run/media
  - --filesystem=/mnt
  - --own-name=org.mpris.MediaPlayer2.nemesis
  - --own-name=org.mpris.MediaPlayer2.nemesis.*

modules:
  - name: nemesis
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/nemesis -t /app/bin
      - install -Dm644 share/applications/io.github.aevahonin.Nemesis.desktop
        /app/share/applications/io.github.aevahonin.Nemesis.desktop
      - install -Dm644 share/icons/hicolor/scalable/apps/io.github.aevahonin.Nemesis.svg
        /app/share/icons/hicolor/scalable/apps/io.github.aevahonin.Nemesis.svg
      - install -Dm644 io.github.aevahonin.Nemesis.metainfo.xml
        /app/share/metainfo/io.github.aevahonin.Nemesis.metainfo.xml
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/aevahonin/Nemesis/releases/download/0.1.7/nemesis-0.1.7-linux-x86_64.tar.gz
        sha256: c34474893304898f803fd17c2fb17a11eed4c2052cb91fe636a51f03965ff602
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/aevahonin/Nemesis/releases/download/0.1.7/nemesis-0.1.7-linux-aarch64.tar.gz
        sha256: 86fc2a7ad5741c1f97e6be5cbe95579c201c9e67bbabb92faf1d029a57ae3785
      - type: file
        path: io.github.aevahonin.Nemesis.metainfo.xml
