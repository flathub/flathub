app-id: io.github.intoolswetrust.JSignPdf
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21

command: jsignpdf

finish-args:
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin
# Network is required for TSA (timestamps) functionality
  - --share=network
  - --share=ipc
# Requires X11 to run
  - --socket=x11
# Access to smart cards and YubiKey via pcscd
  - --socket=pcsc
# Access to USB devices (for YubiKey)
  - --device=all

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la
  - /share/doc
  - /share/man

modules:
  - name: pcsc-lite
    sources:
      - type: archive
        url: https://pcsclite.apdu.fr/files/pcsc-lite-2.3.0.tar.xz
        sha256: 1acca22d2891d43ffe6d782740d32e78150d4fcc99e8a3cc763abaf546060d3d
    config-opts:
      - --disable-static
      - --disable-libsystemd
      - --disable-polkit

  - name: opensc
    sources:
      - type: archive
        url: https://github.com/OpenSC/OpenSC/releases/download/0.26.0/opensc-0.26.0.tar.gz
        sha256: 837baead45e1505260d868871056150ede6e73d35460a470f2595a9e5e75f82b
    config-opts:
      - --disable-static
      - --enable-pcsc
      - --enable-openssl
      - --disable-strict

  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh
      - mkdir -p ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/openjdk
      - cp -r /usr/lib/sdk/openjdk21/jvm/openjdk-21/legal/java.base/LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/openjdk/

  - name: jsignpdf
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/intoolswetrust/jsignpdf/archive/refs/tags/JSignPdf_3_0_1.tar.gz
        sha256: 03bc4badc40e0ee73ce34bbe18fb4797ce9f3a6d74de2e579fbf41ffad6495bc
      - type: patch
        path: upgrade-javafx-to-21.0.11.patch
      - maven-dependencies.json
    build-commands:
      - |
        . /usr/lib/sdk/openjdk21/enable.sh
        mvn -o clean install \
          -Dmaven.repo.local="$(pwd)/m2local" \
          -DskipTests \
          -Dmaven.javadoc.skip=true \
          -Dmaven.source.skip=true \
          -Dasciidoctor.skip=true
      - unzip -o distribution/target/jsignpdf-*.zip -d distro
      - mkdir -p ${FLATPAK_DEST}/share/jsignpdf
      - cp -r distro/jsignpdf-*/JSignPdf.jar distro/jsignpdf-*/InstallCert.jar distro/jsignpdf-*/licenses ${FLATPAK_DEST}/share/jsignpdf/
      - install -Dm755 distribution/linux/flatpak/jsignpdf-flatpak.in ${FLATPAK_DEST}/bin/jsignpdf
      - install -Dm644 distribution/linux/jsignpdf.desktop ${FLATPAK_DEST}/share/applications/io.github.intoolswetrust.JSignPdf.desktop
      - install -Dm644 distribution/linux/io.github.intoolswetrust.JSignPdf.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.intoolswetrust.JSignPdf.metainfo.xml
      - install -Dm644 distribution/linux/flatpak/jsignpdf.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.intoolswetrust.JSignPdf.png
      - mkdir -p ${FLATPAK_DEST}/share/licenses/io.github.intoolswetrust.JSignPdf
      - cp -r distro/jsignpdf-*/licenses/* ${FLATPAK_DEST}/share/licenses/io.github.intoolswetrust.JSignPdf/
