id: info.cinfinity.cdfp
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: cdfgplay

rename-icon: cdfp

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --socket=pulseaudio

modules:
  - name: libdiscid
    buildsystem: autotools
    no-autogen: true
    make-install-args:
      - PREFIX=/app
    build-options:
      cflags: -fPIC
    sources:
      - type: archive
        url: https://data.metabrainz.org/pub/musicbrainz/libdiscid/libdiscid-0.6.5.tar.gz
        sha256: 72dbb493e07336418fe2056f0ebc7ce544eedb500bb896cc1cc04bd078c2d530

  - name: libneon
    buildsystem: autotools
    no-autogen: true
    make-install-args:
      - PREFIX=/app
    build-options:
      cflags: -fPIC
    sources:
      - type: archive
        url: https://notroj.github.io/neon/neon-0.37.1.tar.gz
        sha256: a99b7262525a454d1065cf76dd17240fd808dfc4ef15636990ff83a5d0d9e740

  - name: jansson
    buildsystem: autotools
    no-autogen: true
    make-install-args:
      - PREFIX=/app
    build-options:
      cflags: -fPIC
    sources:
      - type: archive
        url: https://github.com/akheron/jansson/releases/download/v2.15.0/jansson-2.15.0.tar.bz2
        sha256: a7eac7765000373165f9373eb748be039c10b2efc00be9af3467ec92357d8954

  - name: libmusicbrainz
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    build-options:
      cflags: -fPIC
    sources:
      - type: archive
        url: https://github.com/metabrainz/libmusicbrainz/releases/download/release-5.1.0/libmusicbrainz-5.1.0.tar.gz
        sha256: 6749259e89bbb273f3f5ad7acdffb7c47a2cf8fcaeab4c4695484cef5f4c6b46
      - type: patch
        path: libmusicbrainz_5.1.0.patch

  - name: libcoverart
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    build-options:
      cflags: -fPIC
    sources:
      - type: archive
        url: https://github.com/metabrainz/libcoverart/releases/download/release-1.0.0/libcoverart-1.0.0.tar.gz
        sha256: 5d9d4a4c46f35754e016affab83957961a364d7a4c7d64447f73bff22a300f44
      - type: patch
        path: libcoverart_1.0.0.patch

  - name: stdconfig
    buildsystem: autotools
    no-autogen: true
    make-install-args:
      - PREFIX=/app
    sources:
      - type: archive
        url: https://cinfinity.info/src/stdconfig_0.4.tar.xz
        sha256: 6397541c68bae0b45827b233e97c2ed6af6ca2037c8bcb97a42a19cb36519698

  - name: cdfp
    buildsystem: autotools
    no-autogen: true
    make-install-args:
      - PREFIX=/app
    sources:
      - type: archive
        url: https://cinfinity.info/src/cdfp_0.2.tar.xz
        sha256: 528aaf8042fd6d42c0364cecb0afd4fbbbfa9f086169d0b957775a08582a6f10


