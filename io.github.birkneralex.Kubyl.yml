app-id: io.github.birkneralex.Kubyl
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: kubyl

finish-args:
  # Network access for Kubernetes API
  - --share=network
  # Device access (needed for some cluster operations)
  - --device=all
  # Home directory access for kubeconfig and credentials
  - --filesystem=home
  # Wayland and X11 display support
  - --socket=wayland
  - --socket=x11
  # Audio (if needed for notifications)
  - --socket=pulseaudio
  # Shared memory for X11
  - --share=ipc

modules:
  - name: kubyl
    buildsystem: simple
    build-commands:
      - install -Dm755 kubyl /app/bin/kubyl
      - install -Dm644 io.github.birkneralex.Kubyl.desktop /app/share/applications/io.github.birkneralex.Kubyl.desktop
      - install -Dm644 io.github.birkneralex.Kubyl.metainfo.xml /app/share/metainfo/io.github.birkneralex.Kubyl.metainfo.xml
      - install -Dm644 app-icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.birkneralex.Kubyl.png
      - install -Dm644 app-icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.birkneralex.Kubyl.png
      - install -Dm644 app-icon-128.png /app/share/icons/hicolor/128x128/apps/io.github.birkneralex.Kubyl.png
      - install -Dm644 app-icon-64.png /app/share/icons/hicolor/64x64/apps/io.github.birkneralex.Kubyl.png
    sources:
      # Pre-built binaries from GitHub releases, one per arch (release.yml's build-linux matrix
      # produces amd64 and arm64 separately; each archive's staged directory name embeds the
      # version, so strip-components flattens it instead of hardcoding that path).
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/BirknerAlex/kubyl/releases/download/v0.3.9/kubyl-0.3.9-linux-amd64.tar.gz
        sha256: a4fd1a0630aea7a908f46c0180e77363e316d8d57de890870d5ae06b2397ddaf
        strip-components: 1
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/BirknerAlex/kubyl/releases/download/v0.3.9/kubyl-0.3.9-linux-arm64.tar.gz
        sha256: 1daa7981c11920e541d5c1c123ca4ddf86744e1d9f9e33251472bf73259319dd
        strip-components: 1
      # Desktop file and icons live in the kubyl repo, not this manifest's own submission repo
      # (Flathub only ever checks out the manifest + metainfo, not the whole upstream tree), so
      # these are fetched from the tagged release commit rather than a local `path:`.
      - type: file
        url: https://raw.githubusercontent.com/BirknerAlex/kubyl/v0.3.9/packaging/linux/kubyl.desktop
        sha256: a703360b80941abc05b0e53565c50fe1914d60a86adba56bbd6cd42c071073ea
        dest-filename: io.github.birkneralex.Kubyl.desktop
      - type: file
        url: https://raw.githubusercontent.com/BirknerAlex/kubyl/v0.3.9/assets/logo/png/app-icon-512.png
        sha256: e1108c43d73fa90ded46b77ea7f0dd7f86bebbcf483c0934b1baaecad0f498fc
        dest-filename: app-icon-512.png
      - type: file
        url: https://raw.githubusercontent.com/BirknerAlex/kubyl/v0.3.9/assets/logo/png/app-icon-256.png
        sha256: b0ddf01debd3f4d9e77a7adfa8fcd2f57974a19e53a0537c0247acb3bf280215
        dest-filename: app-icon-256.png
      - type: file
        url: https://raw.githubusercontent.com/BirknerAlex/kubyl/v0.3.9/assets/logo/png/app-icon-128.png
        sha256: af5a4b3f643bcd6783d64150262939661c72d9f8247f2cd1884a2e23a91a5c23
        dest-filename: app-icon-128.png
      - type: file
        url: https://raw.githubusercontent.com/BirknerAlex/kubyl/v0.3.9/assets/logo/png/app-icon-64.png
        sha256: 40d9f7e986f07ebdc4a8a0c26d25912d8aee2fa20aaf63d3ed8b78b51402a1b9
        dest-filename: app-icon-64.png
      # Metainfo is a sibling of this manifest (not part of the kubyl repo tree Flathub can't
      # see) — copy it alongside io.github.birkneralex.Kubyl.yml when submitting.
      - type: file
        path: io.github.birkneralex.Kubyl.metainfo.xml
