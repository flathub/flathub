app-id: com.covely.finance
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: covely

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home

modules:
  - name: covely
    buildsystem: simple
    build-commands:
      # Extract the .deb file from the tarball
      - tar xf covely-linux-deb-bundle-v1.4.4.tar.gz
      # Extract the .deb contents
      - ar x Covely_1.4.4_amd64.deb
      # Extract the data archive from the .deb
      - tar xf data.tar.*
      # Install the binary
      - install -Dm755 usr/bin/covely /app/bin/covely
      # Install the desktop file
      - install -D -m 644 com.covely.finance.desktop /app/share/applications/com.covely.finance.desktop
      # Install the icon
      - install -D -m 644 com.covely.finance.png /app/share/icons/hicolor/512x512/apps/com.covely.finance.png
      # Install the metainfo XML
      - install -D -m 644 metainfo/com.covely.finance.metainfo.xml /app/share/metainfo/com.covely.finance.metainfo.xml
    sources:
      # Use type file so it copies into the build dir without auto-extracting, or auto-extracting is fine but tar xf makes it explicit
      - type: file
        path: covely-linux-deb-bundle-v1.4.4.tar.gz
      - type: dir
        path: metainfo
        dest: metainfo
