app-id: io.github.roethlar.songr
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: songr
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
modules:
  - name: songr
    buildsystem: simple
    build-commands:
      - chmod +x Songr-1.1.3.AppImage
      - ./Songr-1.1.3.AppImage --appimage-extract
      - rm -f Songr-1.1.3.AppImage
      - rm -rf /app/songr.AppDir
      - mv squashfs-root /app/songr.AppDir
      - install -Dm755 songr.sh /app/bin/songr
      - install -Dm644 io.github.roethlar.songr.desktop /app/share/applications/io.github.roethlar.songr.desktop
      - install -Dm644 io.github.roethlar.songr.metainfo.xml /app/share/metainfo/io.github.roethlar.songr.metainfo.xml
      - install -Dm644 io.github.roethlar.songr.png /app/share/icons/hicolor/512x512/apps/io.github.roethlar.songr.png
    sources:
      - type: file
        url: https://github.com/roethlar/songr/releases/download/v1.1.3/Songr-1.1.3.AppImage
        sha256: '06cbe9c07203f1351be5338637be648d6d9193f28319ed257edbf9499aa555e8'
        dest-filename: Songr-1.1.3.AppImage
      - type: file
        path: songr.sh
      - type: file
        path: io.github.roethlar.songr.desktop
      - type: file
        path: io.github.roethlar.songr.metainfo.xml
      - type: file
        path: io.github.roethlar.songr.png
