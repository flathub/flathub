app-id: io.github.JoddabodScripts.NerimityDesktop
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: run.sh
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
build-options:
  append-path: /usr/lib/sdk/node24/bin
  env:
    NPM_CONFIG_LOGLEVEL: info
modules:
  - name: nerimity-desktop
    buildsystem: simple
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/nerimity-desktop/flatpak-node/cache
        npm_config_cache: /run/build/nerimity-desktop/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      - npm pkg delete scripts.postinstall
      - npm pkg set build.npmRebuild=false build.buildDependenciesFromSource=false
      - npm install --offline
      - npx electron-builder --linux --dir -c.npmRebuild=false -c.buildDependenciesFromSource=false
      - cp -a dist/linux*unpacked /app/main
      - install -Dm755 -t /app/bin/ ../run.sh
      - install -Dm644 io.github.JoddabodScripts.NerimityDesktop.metainfo.xml /app/share/metainfo/io.github.JoddabodScripts.NerimityDesktop.metainfo.xml
      - install -Dm644 io.github.JoddabodScripts.NerimityDesktop.desktop /app/share/applications/io.github.JoddabodScripts.NerimityDesktop.desktop
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.JoddabodScripts.NerimityDesktop.png
    subdir: app
    sources:
      - type: git
        url: https://github.com/Nerimity/nerimity-desktop.git
        tag: v2.2.0
        commit: fb9c56c9729ba5e61e92da21c65368d4d1286332
        dest: app
      - type: patch
        path: 0001-flatpak-skip-updater.patch
      - flatpak/generated-sources.json
      - type: file
        path: io.github.JoddabodScripts.NerimityDesktop.desktop
        dest: app
      - type: file
        path: io.github.JoddabodScripts.NerimityDesktop.metainfo.xml
        dest: app
      - type: file
        path: icon-512.png
        dest: app
      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper.sh /app/main/nerimity-desktop "$@"
