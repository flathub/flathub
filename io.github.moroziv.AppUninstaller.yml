app-id: io.github.moroziv.AppUninstaller
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: app-uninstaller

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --filesystem=host
  - --filesystem=xdg-config/fontconfig:ro
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: app-uninstaller
    buildsystem: simple
    build-commands:
      - install -D -m 0755 uninstaller.py /app/bin/app-uninstaller
      - install -D -m 0644 io.github.moroziv.AppUninstaller.desktop /app/share/applications/io.github.moroziv.AppUninstaller.desktop
      - install -D -m 0644 app-uninstaller.png /app/share/icons/hicolor/128x128/apps/io.github.moroziv.AppUninstaller.png
      - install -D -m 0644 io.github.moroziv.AppUninstaller.metainfo.xml /app/share/metainfo/io.github.moroziv.AppUninstaller.metainfo.xml
    sources:
      - type: git
        url: https://github.com
        commit: fe8bceea091abdc2cddfe499719303402e5d7800
